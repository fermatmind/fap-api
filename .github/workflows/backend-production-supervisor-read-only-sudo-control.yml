name: Backend Production Supervisor Read-only Sudo Control

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only preflight or receipt-bound minimal sudoers apply
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - apply
      expected_control_plane_sha:
        description: Exact latest main SHA containing this control
        required: true
        type: string
      expected_active_revision:
        description: Exact active backend REVISION
        required: true
        type: string
      preflight_run_id:
        description: Apply only - successful preflight run id
        required: false
        default: ""
        type: string
      preflight_run_attempt:
        description: Apply only - successful preflight run attempt
        required: false
        default: ""
        type: string
      expected_preflight_receipt_sha256:
        description: Apply only - exact preflight receipt SHA256
        required: false
        default: ""
        type: string
      expected_deploy_user_sha256:
        description: Apply only - deploy-user fingerprint from preflight
        required: false
        default: ""
        type: string
      expected_rule_sha256:
        description: Apply only - exact one-line sudoers rule SHA256
        required: false
        default: ""
        type: string
      operator_approval_phrase:
        description: Apply only - exact receipt-bound production permission approval
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-${{ github.repository }}-production
  cancel-in-progress: false

jobs:
  control:
    name: Preflight or apply minimal Supervisor read-only sudo rule
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      MODE: ${{ inputs.mode }}
      EXPECTED_CONTROL_PLANE_SHA: ${{ inputs.expected_control_plane_sha }}
      EXPECTED_ACTIVE_REVISION: ${{ inputs.expected_active_revision }}
      PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
      PREFLIGHT_RUN_ATTEMPT: ${{ inputs.preflight_run_attempt }}
      EXPECTED_PREFLIGHT_RECEIPT_SHA256: ${{ inputs.expected_preflight_receipt_sha256 }}
      EXPECTED_DEPLOY_USER_SHA256: ${{ inputs.expected_deploy_user_sha256 }}
      EXPECTED_RULE_SHA256: ${{ inputs.expected_rule_sha256 }}
      OPERATOR_APPROVAL_PHRASE: ${{ inputs.operator_approval_phrase }}
      DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
      DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
      DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}

    steps:
      - name: Initialize sanitized failure receipt
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/backend-production-supervisor-read-only-sudo-control.json"
          jq -n \
            --arg mode "$MODE" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg control "$EXPECTED_CONTROL_PLANE_SHA" \
            --arg active "$EXPECTED_ACTIVE_REVISION" \
            '{
              schema_version: "backend.production_supervisor_read_only_sudo_control.v1",
              mode: $mode,
              status: "FAIL_CONTROL_INITIALIZATION",
              failed_stage: "initialize",
              run_id: $run_id,
              run_attempt: $run_attempt,
              control_plane_sha: $control,
              active_revision: $active,
              deploy_user_sha256: ("0" * 64),
              rule_sha256: ("0" * 64),
              rule_state: "UNKNOWN",
              supervisor_status_authorized_before: false,
              supervisor_status_authorized_after: false,
              queue_total: 0,
              queue_running: 0,
              sudo_policy_list_available: false,
              install_capability: false,
              visudo_capability: false,
              sha256sum_capability: false,
              apply_eligible: false,
              production_write_execution: false,
              sudoers_rule_write_count: 0,
              remote_temp_file_write_count: 0,
              supervisor_config_write_count: 0,
              service_restart_count: 0,
              deploy_count: 0,
              database_or_cms_write_count: 0,
              warm_or_publication_count: 0,
              discoverability_write_count: 0,
              writes_committed: false
            }' > "$receipt"

      - name: Check out exact main control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate latest main and apply evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/backend-production-supervisor-read-only-sudo-control.json"
          set_failure() {
            local stage="$1"
            jq --arg stage "$stage" '.status = "FAIL_CONTROL_ELIGIBILITY" | .failed_stage = $stage' \
              "$receipt" > "$receipt.next"
            mv "$receipt.next" "$receipt"
          }
          trap 'set_failure "control_plane_validation"' ERR

          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$MODE" =~ ^(preflight|apply)$ ]]
          [[ "$EXPECTED_CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_ACTIVE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          test -n "$SSH_KNOWN_HOSTS"
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_CONTROL_PLANE_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_CONTROL_PLANE_SHA"
          test "$GITHUB_SHA" = "$EXPECTED_CONTROL_PLANE_SHA"

          if [ "$MODE" = preflight ]; then
            test -z "$PREFLIGHT_RUN_ID"
            test -z "$PREFLIGHT_RUN_ATTEMPT"
            test -z "$EXPECTED_PREFLIGHT_RECEIPT_SHA256"
            test -z "$EXPECTED_DEPLOY_USER_SHA256"
            test -z "$EXPECTED_RULE_SHA256"
            test -z "$OPERATOR_APPROVAL_PHRASE"
          else
            [[ "$PREFLIGHT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$PREFLIGHT_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
            [[ "$EXPECTED_PREFLIGHT_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
            [[ "$EXPECTED_DEPLOY_USER_SHA256" =~ ^[0-9a-f]{64}$ ]]
            [[ "$EXPECTED_RULE_SHA256" =~ ^[0-9a-f]{64}$ ]]
            expected_phrase="I explicitly approve installing one minimal backend production Supervisor read-only sudo rule from preflight run ${PREFLIGHT_RUN_ID} attempt ${PREFLIGHT_RUN_ATTEMPT} receipt ${EXPECTED_PREFLIGHT_RECEIPT_SHA256} with control-plane SHA ${EXPECTED_CONTROL_PLANE_SHA} active SHA ${EXPECTED_ACTIVE_REVISION} deploy-user fingerprint ${EXPECTED_DEPLOY_USER_SHA256} rule SHA256 ${EXPECTED_RULE_SHA256}; allow only /usr/bin/supervisorctl status without password, validate with visudo and exact readback, with no SSH credential change, broader sudo grant, Supervisor config change, service restart, deploy, database/CMS write, warm, publication, or discoverability change."
            test "$OPERATOR_APPROVAL_PHRASE" = "$expected_phrase"

            run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREFLIGHT_RUN_ID}")"
            jq -e \
              --arg sha "$EXPECTED_CONTROL_PLANE_SHA" \
              --argjson attempt "$PREFLIGHT_RUN_ATTEMPT" \
              '.name == "Backend Production Supervisor Read-only Sudo Control"
               and .path == ".github/workflows/backend-production-supervisor-read-only-sudo-control.yml"
               and .event == "workflow_dispatch"
               and .head_branch == "main"
               and .head_sha == $sha
               and .status == "completed"
               and .conclusion == "success"
               and .run_attempt == $attempt' <<<"$run_json" >/dev/null

            evidence_dir="$(mktemp -d)"
            gh run download "$PREFLIGHT_RUN_ID" \
              --name "backend-production-supervisor-read-only-sudo-preflight-${PREFLIGHT_RUN_ID}-${PREFLIGHT_RUN_ATTEMPT}" \
              --dir "$evidence_dir"
            preflight_receipt="$evidence_dir/backend-production-supervisor-read-only-sudo-control.json"
            test -f "$preflight_receipt"
            test "$(sha256sum "$preflight_receipt" | awk '{print $1}')" = "$EXPECTED_PREFLIGHT_RECEIPT_SHA256"
            jq -e \
              --arg control "$EXPECTED_CONTROL_PLANE_SHA" \
              --arg active "$EXPECTED_ACTIVE_REVISION" \
              --arg user_sha "$EXPECTED_DEPLOY_USER_SHA256" \
              --arg rule_sha "$EXPECTED_RULE_SHA256" \
              '.schema_version == "backend.production_supervisor_read_only_sudo_control.v1"
               and .mode == "preflight"
               and .status == "PASS_PREFLIGHT_APPLY_ELIGIBLE"
               and .control_plane_sha == $control
               and .active_revision == $active
               and .deploy_user_sha256 == $user_sha
               and .rule_sha256 == $rule_sha
               and .rule_state == "ABSENT"
               and .supervisor_status_authorized_before == false
               and .sudo_policy_list_available == true
               and .install_capability == true
               and .visudo_capability == true
               and .sha256sum_capability == true
               and .apply_eligible == true
               and .production_write_execution == false
               and .sudoers_rule_write_count == 0
               and .remote_temp_file_write_count == 0
               and .writes_committed == false' "$preflight_receipt" >/dev/null
          fi
          trap - ERR

      - name: Start pinned SSH agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known hosts
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Run zero-write Supervisor sudo preflight
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/backend-production-supervisor-read-only-sudo-control.json"
          zero_sha="$(printf '0%.0s' {1..64})"
          set +e
          result="$(timeout --signal=TERM --kill-after=5s 60s \
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
              -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "DEPLOY_PATH='$DEPLOY_PATH' EXPECTED_ACTIVE_REVISION='$EXPECTED_ACTIVE_REVISION' bash -s" <<'REMOTE'
          set -u
          rule_path=/etc/sudoers.d/fap-api-github-production-supervisor-status
          target_user="$(id -un)"
          user_sha="$(printf '%s' "$target_user" | sha256sum | awk '{print $1}')"
          rule="$target_user ALL=(root) NOPASSWD: /usr/bin/supervisorctl status"
          rule_sha="$(printf '%s\n' "$rule" | sha256sum | awk '{print $1}')"
          status=PASS_PREFLIGHT_APPLY_ELIGIBLE
          failed_stage=""
          active_match=false
          lock_absent=false
          deploy_process_count=0
          supervisor_authorized=false
          queue_total=0
          queue_running=0
          sudo_list=false
          install_capability=false
          visudo_capability=false
          sha256sum_capability=false
          rule_state=UNKNOWN
          apply_eligible=false

          if [ -r "$DEPLOY_PATH/current/REVISION" ] && \
             [ "$(tr -d '\r\n' < "$DEPLOY_PATH/current/REVISION")" = "$EXPECTED_ACTIVE_REVISION" ]; then
            active_match=true
          else
            status=BLOCKED_ACTIVE_REVISION
            failed_stage=active_revision
          fi
          if [ ! -e "$DEPLOY_PATH/.dep/deploy.lock" ]; then lock_absent=true; else status=BLOCKED_DEPLOY_LOCK; failed_stage=deploy_lock; fi
          deploy_process_count="$(ps -eo comm=,args= | awk '$1=="php" && ($0 ~ /dep\.phar/ || $0 ~ /artisan migrate/ || $0 ~ /queue:reload-workers/) {n++} $1=="composer" && $0 ~ /install/ {n++} END {print n+0}')"
          if [ "$deploy_process_count" -ne 0 ]; then status=BLOCKED_DEPLOY_PROCESS; failed_stage=deploy_process; fi

          if sudo -n -l >/dev/null 2>&1; then sudo_list=true; fi
          if sudo -n -l /usr/bin/install >/dev/null 2>&1; then install_capability=true; fi
          if sudo -n -l /usr/sbin/visudo >/dev/null 2>&1; then visudo_capability=true; fi
          if sudo -n -l /usr/bin/sha256sum >/dev/null 2>&1; then sha256sum_capability=true; fi

          if [ -e "$rule_path" ]; then
            if [ -r "$rule_path" ]; then
              current_sha="$(sha256sum "$rule_path" | awk '{print $1}')"
            elif sudo -n /usr/bin/sha256sum "$rule_path" >/dev/null 2>&1; then
              current_sha="$(sudo -n /usr/bin/sha256sum "$rule_path" | awk '{print $1}')"
            else
              current_sha=""
            fi
            if [ "$current_sha" = "$rule_sha" ]; then rule_state=EXACT_PRESENT; else rule_state=CONFLICTING_OR_UNREADABLE; fi
          else
            rule_state=ABSENT
          fi

          set +e
          supervisor_output="$(sudo -n /usr/bin/supervisorctl status 2>/dev/null)"
          supervisor_rc=$?
          set -e
          if [ "$supervisor_rc" -eq 0 ]; then
            supervisor_authorized=true
            queue_total="$(awk '$1 ~ /^fap-queue/ {n++} END {print n+0}' <<<"$supervisor_output")"
            queue_running="$(awk '$1 ~ /^fap-queue/ && $2=="RUNNING" {n++} END {print n+0}' <<<"$supervisor_output")"
          fi

          if [ "$status" = PASS_PREFLIGHT_APPLY_ELIGIBLE ]; then
            if [ "$supervisor_authorized" = true ] && [ "$queue_total" -gt 0 ] && [ "$queue_running" -eq "$queue_total" ]; then
              status=PASS_PREFLIGHT_ALREADY_AUTHORIZED
            elif [ "$rule_state" != ABSENT ]; then
              status=BLOCKED_EXISTING_RULE
              failed_stage=rule_state
            elif [ "$sudo_list" != true ] || [ "$install_capability" != true ] || [ "$visudo_capability" != true ] || [ "$sha256sum_capability" != true ]; then
              status=PASS_PREFLIGHT_MANUAL_ROOT_REQUIRED
              failed_stage=apply_capability
            else
              apply_eligible=true
            fi
          fi

          printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
            "$status" "$failed_stage" "$user_sha" "$rule_sha" "$rule_state" \
            "$supervisor_authorized" "$queue_total" "$queue_running" "$sudo_list" \
            "$install_capability" "$visudo_capability" "$sha256sum_capability" "$apply_eligible" "$active_match" \
            "$lock_absent" "$deploy_process_count"
          REMOTE
          )"
          ssh_rc=$?
          set -e

          status=FAIL_PREFLIGHT_SSH
          failed_stage=ssh_transport
          user_sha="$zero_sha"
          rule_sha="$zero_sha"
          rule_state=UNKNOWN
          supervisor_authorized=false
          queue_total=0
          queue_running=0
          sudo_list=false
          install_capability=false
          visudo_capability=false
          sha256sum_capability=false
          apply_eligible=false
          active_match=false
          lock_absent=false
          deploy_process_count=0
          if [ "$ssh_rc" -eq 0 ]; then
            IFS=$'\t' read -r status failed_stage user_sha rule_sha rule_state supervisor_authorized queue_total queue_running sudo_list install_capability visudo_capability sha256sum_capability apply_eligible active_match lock_absent deploy_process_count <<<"$result"
          fi

          [[ "$status" =~ ^(PASS_PREFLIGHT_APPLY_ELIGIBLE|PASS_PREFLIGHT_ALREADY_AUTHORIZED|PASS_PREFLIGHT_MANUAL_ROOT_REQUIRED|BLOCKED_[A-Z_]+|FAIL_PREFLIGHT_SSH)$ ]]
          [[ "$user_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$rule_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$rule_state" =~ ^(UNKNOWN|ABSENT|EXACT_PRESENT|CONFLICTING_OR_UNREADABLE)$ ]]
          [[ "$supervisor_authorized" =~ ^(true|false)$ ]]
          [[ "$queue_total" =~ ^[0-9]+$ ]]
          [[ "$queue_running" =~ ^[0-9]+$ ]]
          [[ "$sudo_list" =~ ^(true|false)$ ]]
          [[ "$install_capability" =~ ^(true|false)$ ]]
          [[ "$visudo_capability" =~ ^(true|false)$ ]]
          [[ "$sha256sum_capability" =~ ^(true|false)$ ]]
          [[ "$apply_eligible" =~ ^(true|false)$ ]]
          [[ "$active_match" =~ ^(true|false)$ ]]
          [[ "$lock_absent" =~ ^(true|false)$ ]]
          [[ "$deploy_process_count" =~ ^[0-9]+$ ]]

          jq \
            --arg status "$status" \
            --arg failed_stage "$failed_stage" \
            --arg user_sha "$user_sha" \
            --arg rule_sha "$rule_sha" \
            --arg rule_state "$rule_state" \
            --argjson supervisor_authorized "$supervisor_authorized" \
            --argjson queue_total "$queue_total" \
            --argjson queue_running "$queue_running" \
            --argjson sudo_list "$sudo_list" \
            --argjson install_capability "$install_capability" \
            --argjson visudo_capability "$visudo_capability" \
            --argjson sha256sum_capability "$sha256sum_capability" \
            --argjson apply_eligible "$apply_eligible" \
            --argjson active_match "$active_match" \
            --argjson lock_absent "$lock_absent" \
            --argjson process_count "$deploy_process_count" \
            '.status = $status
             | .failed_stage = (if $failed_stage == "" then null else $failed_stage end)
             | .deploy_user_sha256 = $user_sha
             | .rule_sha256 = $rule_sha
             | .rule_state = $rule_state
             | .supervisor_status_authorized_before = $supervisor_authorized
             | .queue_total = $queue_total
             | .queue_running = $queue_running
             | .sudo_policy_list_available = $sudo_list
             | .install_capability = $install_capability
             | .visudo_capability = $visudo_capability
             | .sha256sum_capability = $sha256sum_capability
             | .apply_eligible = $apply_eligible
             | .checks = {active_revision_match: $active_match, deploy_lock_absent: $lock_absent, deploy_like_process_count: $process_count}' \
            "$receipt" > "$receipt.next"
          mv "$receipt.next" "$receipt"

          {
            echo "status=$status"
            echo "deploy_user_sha256=$user_sha"
            echo "rule_sha256=$rule_sha"
            echo "apply_eligible=$apply_eligible"
          } >> "$GITHUB_OUTPUT"

      - name: Apply exact minimal sudoers rule
        if: ${{ inputs.mode == 'apply' && steps.preflight.outputs.apply_eligible == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/backend-production-supervisor-read-only-sudo-control.json"
          test "${{ steps.preflight.outputs.deploy_user_sha256 }}" = "$EXPECTED_DEPLOY_USER_SHA256"
          test "${{ steps.preflight.outputs.rule_sha256 }}" = "$EXPECTED_RULE_SHA256"

          set +e
          result="$(timeout --signal=TERM --kill-after=5s 60s \
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
              -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "DEPLOY_PATH='$DEPLOY_PATH' EXPECTED_ACTIVE_REVISION='$EXPECTED_ACTIVE_REVISION' EXPECTED_USER_SHA='$EXPECTED_DEPLOY_USER_SHA256' EXPECTED_RULE_SHA='$EXPECTED_RULE_SHA256' bash -s" <<'REMOTE'
          set -u
          rule_path=/etc/sudoers.d/fap-api-github-production-supervisor-status
          target_user="$(id -un)"
          user_sha="$(printf '%s' "$target_user" | sha256sum | awk '{print $1}')"
          rule="$target_user ALL=(root) NOPASSWD: /usr/bin/supervisorctl status"
          rule_sha="$(printf '%s\n' "$rule" | sha256sum | awk '{print $1}')"
          status=FAIL_APPLY_BEFORE_WRITE
          failed_stage=identity_recheck
          write_count=0
          temp_write_count=0
          supervisor_after=false
          queue_total=0
          queue_running=0

          emit() {
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$status" "$failed_stage" "$user_sha" "$rule_sha" "$write_count" "$temp_write_count" "$supervisor_after:$queue_total:$queue_running"
          }
          if [ "$user_sha" != "$EXPECTED_USER_SHA" ] || [ "$rule_sha" != "$EXPECTED_RULE_SHA" ]; then emit; exit 1; fi
          failed_stage=active_revision_recheck
          if [ ! -r "$DEPLOY_PATH/current/REVISION" ] || [ "$(tr -d '\r\n' < "$DEPLOY_PATH/current/REVISION")" != "$EXPECTED_ACTIVE_REVISION" ]; then emit; exit 1; fi
          failed_stage=deploy_lock_recheck
          if [ -e "$DEPLOY_PATH/.dep/deploy.lock" ]; then emit; exit 1; fi
          failed_stage=existing_rule_recheck
          if [ -e "$rule_path" ]; then emit; exit 1; fi
          failed_stage=capability_recheck
          if ! sudo -n -l /usr/bin/install >/dev/null 2>&1 || ! sudo -n -l /usr/sbin/visudo >/dev/null 2>&1 || ! sudo -n -l /usr/bin/sha256sum >/dev/null 2>&1; then emit; exit 1; fi

          failed_stage=candidate_validation
          candidate="$(mktemp)" || { emit; exit 1; }
          temp_write_count=1
          printf '%s\n' "$rule" > "$candidate"
          chmod 0600 "$candidate"
          if ! sudo -n /usr/sbin/visudo -cf "$candidate" >/dev/null 2>&1; then rm -f "$candidate"; emit; exit 1; fi

          failed_stage=rule_install
          if ! sudo -n /usr/bin/install -o root -g root -m 0440 "$candidate" "$rule_path"; then rm -f "$candidate"; emit; exit 1; fi
          write_count=1
          rm -f "$candidate"

          status=FAIL_APPLY_AFTER_WRITE
          failed_stage=full_visudo_validation
          if ! sudo -n /usr/sbin/visudo -cf /etc/sudoers >/dev/null 2>&1; then emit; exit 1; fi
          failed_stage=exact_rule_readback
          if [ "$(sudo -n /usr/bin/sha256sum "$rule_path" 2>/dev/null | awk '{print $1}')" != "$EXPECTED_RULE_SHA" ]; then emit; exit 1; fi
          failed_stage=supervisor_status_readback
          if supervisor_output="$(sudo -n /usr/bin/supervisorctl status 2>/dev/null)"; then
            supervisor_after=true
            queue_total="$(awk '$1 ~ /^fap-queue/ {n++} END {print n+0}' <<<"$supervisor_output")"
            queue_running="$(awk '$1 ~ /^fap-queue/ && $2=="RUNNING" {n++} END {print n+0}' <<<"$supervisor_output")"
          fi
          if [ "$supervisor_after" != true ] || [ "$queue_total" -le 0 ] || [ "$queue_running" -ne "$queue_total" ]; then emit; exit 1; fi
          status=PASS_APPLY
          failed_stage=""
          emit
          REMOTE
          )"
          ssh_rc=$?
          set -e

          IFS=$'\t' read -r status failed_stage user_sha rule_sha write_count temp_write_count supervisor_tuple <<<"$result"
          IFS=: read -r supervisor_after queue_total queue_running <<<"$supervisor_tuple"
          [[ "$status" =~ ^(PASS_APPLY|FAIL_APPLY_BEFORE_WRITE|FAIL_APPLY_AFTER_WRITE)$ ]]
          test "$user_sha" = "$EXPECTED_DEPLOY_USER_SHA256"
          test "$rule_sha" = "$EXPECTED_RULE_SHA256"
          [[ "$write_count" =~ ^[01]$ ]]
          [[ "$temp_write_count" =~ ^[01]$ ]]
          [[ "$supervisor_after" =~ ^(true|false)$ ]]
          if [ "$ssh_rc" -ne 0 ] && [ "$status" = PASS_APPLY ]; then exit 1; fi

          writes_committed=false
          production_write=false
          if [ "$write_count" -eq 1 ]; then writes_committed=true; production_write=true; fi
          jq \
            --arg status "$status" \
            --arg failed_stage "$failed_stage" \
            --argjson supervisor_after "$supervisor_after" \
            --argjson queue_total "$queue_total" \
            --argjson queue_running "$queue_running" \
            --argjson write_count "$write_count" \
            --argjson temp_write_count "$temp_write_count" \
            --argjson writes_committed "$writes_committed" \
            --argjson production_write "$production_write" \
            '.status = $status
             | .failed_stage = (if $failed_stage == "" then null else $failed_stage end)
             | .supervisor_status_authorized_after = $supervisor_after
             | .queue_total = $queue_total
             | .queue_running = $queue_running
             | .production_write_execution = $production_write
             | .sudoers_rule_write_count = $write_count
             | .remote_temp_file_write_count = $temp_write_count
             | .writes_committed = $writes_committed' "$receipt" > "$receipt.next"
          mv "$receipt.next" "$receipt"
          test "$status" = PASS_APPLY

      - name: Validate sanitized control receipt
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/backend-production-supervisor-read-only-sudo-control.json"
          test -f "$receipt"
          jq -e \
            '.schema_version == "backend.production_supervisor_read_only_sudo_control.v1"
             and (.mode == "preflight" or .mode == "apply")
             and (.deploy_user_sha256 | test("^[0-9a-f]{64}$"))
             and (.rule_sha256 | test("^[0-9a-f]{64}$"))
             and .supervisor_config_write_count == 0
             and .service_restart_count == 0
             and .deploy_count == 0
             and .database_or_cms_write_count == 0
             and .warm_or_publication_count == 0
             and .discoverability_write_count == 0
             and (if .mode == "preflight" then
                    .production_write_execution == false
                    and .sudoers_rule_write_count == 0
                    and .remote_temp_file_write_count == 0
                    and .writes_committed == false
                  else true end)' "$receipt" >/dev/null

      - name: Publish safe control summary
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/backend-production-supervisor-read-only-sudo-control.json"
          {
            echo "### Backend production Supervisor read-only sudo control"
            echo "- Mode: $(jq -r '.mode' "$receipt")"
            echo "- Status: $(jq -r '.status' "$receipt")"
            echo "- Failed stage: $(jq -r '.failed_stage // "none"' "$receipt")"
            echo "- Apply eligible: $(jq -r '.apply_eligible' "$receipt")"
            echo "- Production writes committed: $(jq -r '.writes_committed' "$receipt")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable control receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-production-supervisor-read-only-sudo-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/backend-production-supervisor-read-only-sudo-control.json
          if-no-files-found: error
          retention-days: 30
