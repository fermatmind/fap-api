name: SEO 13 Article Schema Release Production Ops

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preflight is read-only; apply atomically enables schema for the exact 13 published revisions
        required: true
        type: choice
        options:
          - preflight
          - apply
      expected_control_plane_sha:
        description: Exact latest main SHA containing this control plane
        required: true
        type: string
      expected_release_sha:
        description: Exact active production application SHA
        required: true
        type: string
      expected_release_name:
        description: Exact active production release name
        required: true
        type: string
      expected_state_sha256:
        description: Apply only; immutable preflight state SHA
        required: false
        default: ""
        type: string
      expected_content_set_sha256:
        description: Apply only; immutable published content-set SHA
        required: false
        default: ""
        type: string
      expected_target_set_sha256:
        description: Apply only; immutable target-set SHA
        required: false
        default: ""
        type: string
      preflight_run_id:
        description: Apply only; immutable successful preflight run id
        required: false
        default: ""
        type: string
      preflight_run_attempt:
        description: Apply only; immutable successful preflight attempt
        required: false
        default: ""
        type: string
      operator_approval_phrase:
        description: Apply only; exact receipt-bound approval phrase
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-${{ github.repository }}-production
  cancel-in-progress: false

jobs:
  eligibility:
    name: Validate latest control plane and immutable schema receipt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.validate.outputs.mode }}
      control_plane_sha: ${{ steps.validate.outputs.control_plane_sha }}
      release_sha: ${{ steps.validate.outputs.release_sha }}
      release_name: ${{ steps.validate.outputs.release_name }}
      state_sha256: ${{ steps.validate.outputs.state_sha256 }}
      content_set_sha256: ${{ steps.validate.outputs.content_set_sha256 }}
      target_set_sha256: ${{ steps.validate.outputs.target_set_sha256 }}
      preflight_run_id: ${{ steps.validate.outputs.preflight_run_id }}
      preflight_run_attempt: ${{ steps.validate.outputs.preflight_run_attempt }}
    steps:
      - name: Checkout exact control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.expected_control_plane_sha }}
          fetch-depth: 0

      - name: Validate latest main and apply receipt
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          EXPECTED_CONTROL_PLANE_SHA: ${{ inputs.expected_control_plane_sha }}
          EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
          EXPECTED_RELEASE_NAME: ${{ inputs.expected_release_name }}
          EXPECTED_STATE_SHA256: ${{ inputs.expected_state_sha256 }}
          EXPECTED_CONTENT_SET_SHA256: ${{ inputs.expected_content_set_sha256 }}
          EXPECTED_TARGET_SET_SHA256: ${{ inputs.expected_target_set_sha256 }}
          PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
          PREFLIGHT_RUN_ATTEMPT: ${{ inputs.preflight_run_attempt }}
          OPERATOR_APPROVAL_PHRASE: ${{ inputs.operator_approval_phrase }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$EXPECTED_CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_RELEASE_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_CONTROL_PLANE_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_CONTROL_PLANE_SHA"
          test "$EXPECTED_RELEASE_SHA" = "$EXPECTED_CONTROL_PLANE_SHA"

          case "$MODE" in
            preflight)
              test -z "$EXPECTED_STATE_SHA256"
              test -z "$EXPECTED_CONTENT_SET_SHA256"
              test -z "$EXPECTED_TARGET_SET_SHA256"
              test -z "$PREFLIGHT_RUN_ID"
              test -z "$PREFLIGHT_RUN_ATTEMPT"
              test -z "$OPERATOR_APPROVAL_PHRASE"
              ;;
            apply)
              [[ "$EXPECTED_STATE_SHA256" =~ ^[0-9a-f]{64}$ ]]
              [[ "$EXPECTED_CONTENT_SET_SHA256" =~ ^[0-9a-f]{64}$ ]]
              [[ "$EXPECTED_TARGET_SET_SHA256" =~ ^[0-9a-f]{64}$ ]]
              [[ "$PREFLIGHT_RUN_ID" =~ ^[0-9]+$ ]]
              [[ "$PREFLIGHT_RUN_ATTEMPT" =~ ^[0-9]+$ ]]

              run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREFLIGHT_RUN_ID}")"
              jq -e \
                --arg sha "$EXPECTED_CONTROL_PLANE_SHA" \
                --argjson attempt "$PREFLIGHT_RUN_ATTEMPT" \
                '.name == "SEO 13 Article Schema Release Production Ops"
                 and .path == ".github/workflows/seo-13-article-schema-release-production-ops.yml"
                 and .event == "workflow_dispatch"
                 and .status == "completed"
                 and .conclusion == "success"
                 and .head_branch == "main"
                 and .head_sha == $sha
                 and .run_attempt == $attempt' <<<"$run_json" >/dev/null

              receipt_dir="$(mktemp -d)"
              gh run download "$PREFLIGHT_RUN_ID" \
                --name "seo-13-article-schema-release-preflight-${PREFLIGHT_RUN_ID}-${PREFLIGHT_RUN_ATTEMPT}" \
                --dir "$receipt_dir"
              receipt="$receipt_dir/seo-13-article-schema-release-production-ops.json"
              test -f "$receipt"
              jq -e \
                --arg sha "$EXPECTED_RELEASE_SHA" \
                --arg release "$EXPECTED_RELEASE_NAME" \
                --arg state "$EXPECTED_STATE_SHA256" \
                --arg content "$EXPECTED_CONTENT_SET_SHA256" \
                --arg target "$EXPECTED_TARGET_SET_SHA256" \
                '.contract_version == "seo13.article_schema_release.production_ops.v1"
                 and .status == "PASS_PREFLIGHT"
                 and .mode == "preflight"
                 and .release_sha == $sha
                 and .release_name == $release
                 and .state_sha256 == $state
                 and .content_set_sha256 == $content
                 and .target_set_sha256 == $target
                 and .target_count == 13
                 and .article_ids == [1,2,5,6,7,9,10,11,12,13,14,15,16]
                 and .published_revision_ids == [446,445,444,443,442,441,440,436,437,439,438,434,435]
                 and .visible_faq_validated_count == 13
                 and .planned_article_schema_count == 13
                 and .planned_breadcrumb_schema_count == 13
                 and .planned_faq_schema_count == 13
                 and .planned_big_five_authority_count == 2
                 and .production_write_execution == false
                 and .schema_write_count == 0
                 and .revision_authority_write_count == 0
                 and .revision_write_count == 0
                 and .publication_write_count == 0
                 and .hreflang_write_count == 0
                 and .revalidation_count == 0
                 and .sitemap_eligibility_write_count == 0
                 and .llms_eligibility_write_count == 0
                 and .sitemap_cache_refresh_count == 0
                 and .llms_cache_refresh_count == 0
                 and .search_submission_count == 0
                 and .gsc_request_count == 0
                 and .url_inspection_count == 0
                 and .queue_dispatch_count == 0
                 and .deploy_count == 0
                 and .write_state == "none"' "$receipt" >/dev/null

              expected_phrase="I explicitly approve SEO 13 atomic schema release for SHA ${EXPECTED_RELEASE_SHA} release ${EXPECTED_RELEASE_NAME} preflight run ${PREFLIGHT_RUN_ID} attempt ${PREFLIGHT_RUN_ATTEMPT} state ${EXPECTED_STATE_SHA256} content set ${EXPECTED_CONTENT_SET_SHA256} target set ${EXPECTED_TARGET_SET_SHA256}; bind visible provenance for exactly 2 Big Five published revisions, enable Article, Breadcrumb, and visible FAQ schema for exactly 13 published revisions, and keep hreflang, publication, revalidation, sitemap eligibility, llms eligibility, sitemap cache, llms cache, search, GSC, URL Inspection, and deploy held."
              test "$(jq -r '.operator_approval_phrase' "$receipt")" = "$expected_phrase"
              test "$OPERATOR_APPROVAL_PHRASE" = "$expected_phrase"
              ;;
            *)
              exit 2
              ;;
          esac

          {
            echo "mode=$MODE"
            echo "control_plane_sha=$EXPECTED_CONTROL_PLANE_SHA"
            echo "release_sha=$EXPECTED_RELEASE_SHA"
            echo "release_name=$EXPECTED_RELEASE_NAME"
            echo "state_sha256=$EXPECTED_STATE_SHA256"
            echo "content_set_sha256=$EXPECTED_CONTENT_SET_SHA256"
            echo "target_set_sha256=$EXPECTED_TARGET_SET_SHA256"
            echo "preflight_run_id=$PREFLIGHT_RUN_ID"
            echo "preflight_run_attempt=$PREFLIGHT_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"

  operate:
    name: Run exact SEO 13 schema phase
    needs: eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
      DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
      RETIRED_DEPLOY_HOST: ${{ secrets.PRODUCTION_RETIRED_DEPLOY_HOST }}
      DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
      MODE: ${{ needs.eligibility.outputs.mode }}
      CONTROL_PLANE_SHA: ${{ needs.eligibility.outputs.control_plane_sha }}
      EXPECTED_RELEASE_SHA: ${{ needs.eligibility.outputs.release_sha }}
      EXPECTED_RELEASE_NAME: ${{ needs.eligibility.outputs.release_name }}
      EXPECTED_STATE_SHA256: ${{ needs.eligibility.outputs.state_sha256 }}
      EXPECTED_CONTENT_SET_SHA256: ${{ needs.eligibility.outputs.content_set_sha256 }}
      EXPECTED_TARGET_SET_SHA256: ${{ needs.eligibility.outputs.target_set_sha256 }}
      PREFLIGHT_RUN_ID: ${{ needs.eligibility.outputs.preflight_run_id }}
      PREFLIGHT_RUN_ATTEMPT: ${{ needs.eligibility.outputs.preflight_run_attempt }}
    steps:
      - name: Checkout exact control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.eligibility.outputs.control_plane_sha }}
          fetch-depth: 1

      - name: Validate protected production topology
        shell: bash
        run: |
          set -euo pipefail
          for name in DEPLOY_USER DEPLOY_PORT DEPLOY_HOST RETIRED_DEPLOY_HOST DEPLOY_PATH; do
            test -n "${!name:-}"
          done
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          test "$DEPLOY_PORT" -ge 1
          test "$DEPLOY_PORT" -le 65535
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$RETIRED_DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          test "$DEPLOY_HOST" != "$RETIRED_DEPLOY_HOST"
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_PATH" != *".."* ]]
          echo "Protected production topology validation passed without disclosing values."

      - name: Set up SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known hosts
        shell: bash
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null \
            || ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f ~/.ssh/known_hosts >/dev/null

      - name: Run streamed exact schema phase against active release
        id: operate
        shell: bash
        run: |
          set -euo pipefail
          receipt="seo-13-article-schema-release-production-ops.json"
          set +e
          {
            printf 'export SEO13_SCHEMA_MODE=%q\n' "$MODE"
            printf 'export DEPLOY_PATH=%q\n' "$DEPLOY_PATH"
            printf 'export EXPECTED_RELEASE_SHA=%q\n' "$EXPECTED_RELEASE_SHA"
            printf 'export EXPECTED_RELEASE_NAME=%q\n' "$EXPECTED_RELEASE_NAME"
            printf 'export EXPECTED_STATE_SHA256=%q\n' "$EXPECTED_STATE_SHA256"
            printf 'export EXPECTED_CONTENT_SET_SHA256=%q\n' "$EXPECTED_CONTENT_SET_SHA256"
            printf 'export EXPECTED_TARGET_SET_SHA256=%q\n' "$EXPECTED_TARGET_SET_SHA256"
            printf 'export PREFLIGHT_RUN_ID=%q\n' "$PREFLIGHT_RUN_ID"
            printf 'export PREFLIGHT_RUN_ATTEMPT=%q\n' "$PREFLIGHT_RUN_ATTEMPT"
            cat backend/scripts/seo/seo_13_article_schema_release_production_ops.sh
          } | ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s" \
            > "$receipt"
          runner_status=$?
          set -e

          if [[ "$MODE" == "preflight" ]]; then
            jq -e '.status == "PASS_PREFLIGHT" and .production_write_execution == false' "$receipt" >/dev/null
            approval_phrase="I explicitly approve SEO 13 atomic schema release for SHA ${EXPECTED_RELEASE_SHA} release ${EXPECTED_RELEASE_NAME} preflight run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT} state $(jq -er '.state_sha256' "$receipt") content set $(jq -er '.content_set_sha256' "$receipt") target set $(jq -er '.target_set_sha256' "$receipt"); bind visible provenance for exactly 2 Big Five published revisions, enable Article, Breadcrumb, and visible FAQ schema for exactly 13 published revisions, and keep hreflang, publication, revalidation, sitemap eligibility, llms eligibility, sitemap cache, llms cache, search, GSC, URL Inspection, and deploy held."
            receipt_tmp="$(mktemp)"
            jq --arg phrase "$approval_phrase" '. + {operator_approval_phrase: $phrase}' "$receipt" > "$receipt_tmp"
            mv "$receipt_tmp" "$receipt"
          else
            jq -e \
              '.status == "PASS_APPLY"
               and .production_write_execution == true
               and .schema_write_count == 13
               and .revision_authority_write_count == 2
               and .revision_write_count == 2
               and .article_body_write_count == 0
               and .big_five_visible_authority_bound_count == 2
               and .article_schema_enabled_count == 13
               and .breadcrumb_schema_enabled_count == 13
               and .faq_schema_enabled_count == 13
               and .publication_write_count == 0
               and .hreflang_write_count == 0
               and .revalidation_count == 0
               and .sitemap_eligibility_write_count == 0
               and .llms_eligibility_write_count == 0
               and .sitemap_cache_refresh_count == 0
               and .llms_cache_refresh_count == 0
               and .search_submission_count == 0
               and .gsc_request_count == 0
               and .url_inspection_count == 0
               and .queue_dispatch_count == 0
               and .deploy_count == 0' "$receipt" >/dev/null
          fi
          exit "$runner_status"

      - name: Upload sanitized SEO 13 schema receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: seo-13-article-schema-release-${{ needs.eligibility.outputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: seo-13-article-schema-release-production-ops.json
          if-no-files-found: error
          retention-days: 30
