name: SEO 13 Article Release Closeout Production Ops

on:
  workflow_dispatch:
    inputs:
      expected_control_plane_sha:
        description: Exact latest main SHA containing this read-only closeout control plane
        required: true
        type: string
      expected_release_sha:
        description: Exact active production application SHA
        required: true
        type: string
      expected_release_name:
        description: Exact active production release name
        required: true
        type: string
      operator_approval_phrase:
        description: Exact read-only production closeout approval phrase
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.repository }}-production
  cancel-in-progress: false

jobs:
  eligibility:
    name: Validate exact latest closeout control plane
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      control_plane_sha: ${{ steps.validate.outputs.control_plane_sha }}
      release_sha: ${{ steps.validate.outputs.release_sha }}
      release_name: ${{ steps.validate.outputs.release_name }}
    steps:
      - name: Checkout exact control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.expected_control_plane_sha }}
          fetch-depth: 0

      - name: Validate latest main and exact read-only approval
        id: validate
        shell: bash
        env:
          EXPECTED_CONTROL_PLANE_SHA: ${{ inputs.expected_control_plane_sha }}
          EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
          EXPECTED_RELEASE_NAME: ${{ inputs.expected_release_name }}
          OPERATOR_APPROVAL_PHRASE: ${{ inputs.operator_approval_phrase }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$EXPECTED_CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_RELEASE_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_CONTROL_PLANE_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_CONTROL_PLANE_SHA"
          test "$EXPECTED_RELEASE_SHA" = "$EXPECTED_CONTROL_PLANE_SHA"

          expected_phrase="I explicitly approve read-only SEO 13 release closeout for SHA ${EXPECTED_RELEASE_SHA} release ${EXPECTED_RELEASE_NAME}; inspect exact 13 public articles, schema, hreflang hold, sitemap, llms, search hold, and cannibalization with zero writes."
          test "$OPERATOR_APPROVAL_PHRASE" = "$expected_phrase"

          {
            echo "control_plane_sha=$EXPECTED_CONTROL_PLANE_SHA"
            echo "release_sha=$EXPECTED_RELEASE_SHA"
            echo "release_name=$EXPECTED_RELEASE_NAME"
          } >> "$GITHUB_OUTPUT"

  verify:
    name: Verify exact SEO 13 release closeout
    needs: eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
      DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
      RETIRED_DEPLOY_HOST: ${{ secrets.PRODUCTION_RETIRED_DEPLOY_HOST }}
      DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
      EXPECTED_RELEASE_SHA: ${{ needs.eligibility.outputs.release_sha }}
      EXPECTED_RELEASE_NAME: ${{ needs.eligibility.outputs.release_name }}
    steps:
      - name: Checkout exact control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.eligibility.outputs.control_plane_sha }}
          fetch-depth: 1

      - name: Validate protected production topology
        shell: bash
        run: |
          set -euo pipefail
          for name in DEPLOY_USER DEPLOY_PORT DEPLOY_HOST RETIRED_DEPLOY_HOST DEPLOY_PATH; do
            test -n "${!name:-}"
          done
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          test "$DEPLOY_PORT" -ge 1
          test "$DEPLOY_PORT" -le 65535
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$RETIRED_DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          test "$DEPLOY_HOST" != "$RETIRED_DEPLOY_HOST"
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_PATH" != *".."* ]]
          echo "Protected production topology validation passed without disclosing values."

      - name: Set up SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known hosts
        shell: bash
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null \
            || ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f ~/.ssh/known_hosts >/dev/null

      - name: Run streamed read-only closeout against active release
        shell: bash
        run: |
          set -euo pipefail
          receipt="seo-13-article-release-closeout-production-ops.json"
          set +e
          {
            printf 'export DEPLOY_PATH=%q\n' "$DEPLOY_PATH"
            printf 'export EXPECTED_RELEASE_SHA=%q\n' "$EXPECTED_RELEASE_SHA"
            printf 'export EXPECTED_RELEASE_NAME=%q\n' "$EXPECTED_RELEASE_NAME"
            cat backend/scripts/seo/seo_13_article_release_closeout_production_ops.sh
          } | ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s" \
            > "$receipt"
          runner_status=$?
          set -e

          jq -e \
            '.contract_version == "seo13.article_release_closeout.production_ops.v1"
             and .status == "PASS_CLOSEOUT"
             and .mode == "verify_only"
             and .target_count == 13
             and .article_ids == [1,2,5,6,7,9,10,11,12,13,14,15,16]
             and .published_revision_ids == [446,445,444,443,442,441,440,436,437,439,438,434,435]
             and .old_published_revision_ids == [341,347,5,6,7,9,10,30,31,32,33,34,35]
             and .schema_released_count == 13
             and .hreflang_held_count == 13
             and .search_hold_verified == true
             and .cannibalization_scan_passed == true
             and .public_api_readback_count == 13
             and .public_html_readback_count == 13
             and .public_sitemap_exact_count == 13
             and .public_llms_exact_count == 13
             and .public_llms_full_exact_count == 13
             and .monitoring_windows == ["D1","D7","D14","D28"]
             and .production_write_execution == false
             and .cms_authority_write_count == 0
             and .database_authority_write_count == 0
             and .publication_write_count == 0
             and .schema_write_count == 0
             and .hreflang_write_count == 0
             and .revalidation_count == 0
             and .sitemap_eligibility_write_count == 0
             and .llms_eligibility_write_count == 0
             and .search_submission_count == 0
             and .gsc_request_count == 0
             and .url_inspection_count == 0
             and .queue_dispatch_count == 0
             and .deploy_count == 0
             and .write_state == "none"' "$receipt" >/dev/null
          exit "$runner_status"

      - name: Upload sanitized SEO 13 closeout artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: seo-13-article-release-closeout-${{ github.run_id }}-${{ github.run_attempt }}
          path: seo-13-article-release-closeout-production-ops.json
          if-no-files-found: error
          retention-days: 30
