name: Enneagram IndexNow Production Submit

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact deployed fap-api SHA (40 lowercase hex)
        required: true
        type: string
      artifact_sha256:
        description: Exact SHA256 of the approved 116-target URL Truth artifact
        required: true
        type: string
      operation_mode:
        description: Canary or batch dry-run/submission
        required: true
        type: choice
        options: [canary_dry_run, canary_submit, batch_dry_run, batch_submit]
      operator_approval_phrase:
        description: Exact SHA-, artifact-, and phase-bound approval phrase
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: enneagram-search-indexnow-production-submit
  cancel-in-progress: false

jobs:
  submit:
    name: Enforce canary-before-batch IndexNow submission
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    env:
      DEPLOY_USER: ${{ vars.PRODUCTION_DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.PRODUCTION_DEPLOY_PORT }}
      DEPLOY_HOST: ${{ vars.PRODUCTION_DEPLOY_HOST }}
      RETIRED_DEPLOY_HOST: ${{ vars.PRODUCTION_RETIRED_DEPLOY_HOST }}
      DEPLOY_PATH: ${{ vars.PRODUCTION_DEPLOY_PATH }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
      OPERATION_MODE: ${{ inputs.operation_mode }}
      OPERATOR_APPROVAL_PHRASE: ${{ inputs.operator_approval_phrase }}

    steps:
      - name: Validate exact phase-bound approval
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ARTIFACT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          case "$OPERATION_MODE" in
            canary_dry_run)
              expected="Approve ENNEAGRAM IndexNow canary dry-run for SHA ${RELEASE_SHA} artifact ${ARTIFACT_SHA256}"
              ;;
            canary_submit)
              expected="I explicitly approve ENNEAGRAM IndexNow canary submission for SHA ${RELEASE_SHA} artifact ${ARTIFACT_SHA256}."
              ;;
            batch_dry_run)
              expected="Approve ENNEAGRAM IndexNow batch dry-run for SHA ${RELEASE_SHA} artifact ${ARTIFACT_SHA256}"
              ;;
            batch_submit)
              expected="I explicitly approve ENNEAGRAM IndexNow batch submission for SHA ${RELEASE_SHA} artifact ${ARTIFACT_SHA256}."
              ;;
            *) exit 2 ;;
          esac
          test "$OPERATOR_APPROVAL_PHRASE" = "$expected"

      - name: Validate protected production topology
        shell: bash
        run: |
          set -euo pipefail
          for name in DEPLOY_USER DEPLOY_PORT DEPLOY_HOST RETIRED_DEPLOY_HOST DEPLOY_PATH; do
            test -n "${!name:-}"
          done
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$RETIRED_DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_PATH" != *".."* ]]
          test "$DEPLOY_HOST" != "$RETIRED_DEPLOY_HOST"

      - name: Set up SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known hosts
        shell: bash
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null \
            || ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f ~/.ssh/known_hosts >/dev/null

      - name: Run mandatory dry-run then optional phase submission
        shell: bash
        run: |
          set -euo pipefail
          target="$DEPLOY_USER@$DEPLOY_HOST"
          printf -v q_deploy_path '%q' "$DEPLOY_PATH"
          printf -v q_release_sha '%q' "$RELEASE_SHA"
          printf -v q_artifact_sha '%q' "$ARTIFACT_SHA256"
          printf -v q_mode '%q' "$OPERATION_MODE"

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -p "$DEPLOY_PORT" "$target" \
            "DEPLOY_PATH=$q_deploy_path RELEASE_SHA=$q_release_sha ARTIFACT_SHA256=$q_artifact_sha OPERATION_MODE=$q_mode bash -s" <<'REMOTE' > summary.json
          set -Eeuo pipefail
          cd "$DEPLOY_PATH/current"
          deployed_sha="$(if [ -f REVISION ]; then tr -d '\r\n' < REVISION; else git rev-parse HEAD; fi)"
          test "$deployed_sha" = "$RELEASE_SHA"
          cd backend

          phase="${OPERATION_MODE%%_*}"
          if [[ "$OPERATION_MODE" == *_submit ]]; then live=1; else live=0; fi
          operator_token="ENNEAGRAM-SEARCH-INDEXNOW-SUBMIT-01:${phase}:${ARTIFACT_SHA256}"

          run_phase() {
            local execute_live="$1"
            PHASE="$phase" ARTIFACT_SHA256="$ARTIFACT_SHA256" LIVE="$execute_live" OPERATOR_TOKEN="$operator_token" php -r '
              require "vendor/autoload.php";
              $app = require "bootstrap/app.php";
              $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
              $live = getenv("LIVE") === "1";
              if ($live) {
                  config([
                      "seo_intel.search_channel_queue.live_submission.enabled" => true,
                      "seo_intel.search_channel_queue.live_submission.external_api_calls_enabled" => true,
                      "seo_intel.indexnow_live_api_enabled" => true,
                  ]);
              }
              $result = app(App\Services\SeoIntel\SearchChannelQueue\SearchChannelQueueBoundedLiveExecutor::class)
                  ->submitEnneagramIndexNow(
                      getenv("PHASE") ?: "",
                      getenv("ARTIFACT_SHA256") ?: "",
                      $live ? (getenv("OPERATOR_TOKEN") ?: null) : null,
                      "enneagram-indexnow-production-ops",
                      $live,
                  );
              echo json_encode($result, JSON_UNESCAPED_SLASHES), PHP_EOL;
            '
          }

          run_dir="$(mktemp -d /tmp/enneagram-indexnow-ops.XXXXXX)"
          trap 'rm -rf "$run_dir"' EXIT
          run_phase 0 > "$run_dir/dry-run.json"
          expected_count=1
          [ "$phase" = batch ] && expected_count=115
          jq -e --arg phase "$phase" --arg sha "$ARTIFACT_SHA256" --argjson count "$expected_count" '
            .schema_version == "enneagram-indexnow-production-submit.v1" and
            .ok == true and (.status == "dry_run_ready" or .status == "already_completed") and
            .phase == $phase and .dry_run == true and .artifact_sha256 == $sha and
            .target_count == 116 and
            ((.status == "already_completed" and .phase_target_count == 0) or .phase_target_count == $count) and
            .external_calls_attempted == false and .search_submission_attempted == false and
            ([.negative_guarantees[]] | all(. == false))
          ' "$run_dir/dry-run.json" >/dev/null

          touch "$run_dir/live.json" "$run_dir/readback.json"
          if [ "$live" = 1 ]; then
            run_phase 1 > "$run_dir/live.json"
            jq -e --arg phase "$phase" --arg sha "$ARTIFACT_SHA256" --argjson count "$expected_count" '
              .schema_version == "enneagram-indexnow-production-submit.v1" and
              .ok == true and (.status == "success" or .status == "already_completed") and
              .phase == $phase and .dry_run == false and .artifact_sha256 == $sha and
              .target_count == 116 and
              ((.status == "already_completed" and .submitted_count == 0) or
               (.submitted_count == $count and .failed_count == 0 and .external_calls_attempted == true and
                .search_submission_attempted == true)) and
              ([.negative_guarantees[]] | all(. == false))
            ' "$run_dir/live.json" >/dev/null

            run_phase 0 > "$run_dir/readback.json"
            jq -e --arg phase "$phase" '
              .ok == true and .status == "already_completed" and .phase == $phase and
              .target_count == 116 and .state_counts.failed == 0 and .state_counts.submitting == 0 and
              (if $phase == "canary" then .state_counts.submitted == 1 and .state_counts.pending == 115
               else .state_counts.submitted == 116 and .state_counts.pending == 0 end) and
              .external_calls_attempted == false
            ' "$run_dir/readback.json" >/dev/null
          fi

          jq -n \
            --arg release_sha "$RELEASE_SHA" \
            --arg artifact_sha256 "$ARTIFACT_SHA256" \
            --arg operation_mode "$OPERATION_MODE" \
            --slurpfile dry_run "$run_dir/dry-run.json" \
            --slurpfile live_result "$run_dir/live.json" \
            --slurpfile readback "$run_dir/readback.json" \
            '{
              schema_version: "enneagram-indexnow-production-ops.v1",
              status: "success",
              release_sha: $release_sha,
              artifact_sha256: $artifact_sha256,
              operation_mode: $operation_mode,
              dry_run: $dry_run[0],
              live: (if ($live_result | length) == 1 then $live_result[0] else null end),
              readback: (if ($readback | length) == 1 then $readback[0] else null end),
              negative_guarantees: {
                queue_payload_exposed: false,
                provider_credentials_exposed: false,
                cms_or_eligibility_write: false,
                sitemap_or_llms_cache_mutation: false,
                deploy: false
              }
            }'
          REMOTE

          jq -e '
            .status == "success" and .release_sha == env.RELEASE_SHA and
            .artifact_sha256 == env.ARTIFACT_SHA256 and
            .dry_run.target_count == 116 and
            ([.negative_guarantees[]] | all(. == false))
          ' summary.json >/dev/null

      - name: Upload sanitized aggregate summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: enneagram-indexnow-production-submit-${{ github.run_id }}
          path: summary.json
          if-no-files-found: error
