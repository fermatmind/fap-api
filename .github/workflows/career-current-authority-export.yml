name: Career Current Authority Export
run-name: Career current SELECT-only export [op:${{ inputs.operation_key }}]

on:
  workflow_dispatch:
    inputs:
      expected_release_sha:
        description: Exact latest deployed production SHA containing this one-time exporter
        required: true
        type: string
      operation_key:
        description: Deterministic controlled-operation key
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: career-current-authority-export-production
  cancel-in-progress: false

jobs:
  operation_gate:
    name: Elect one-time export owner before Environment access
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      decision: ${{ steps.gate.outputs.decision }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - id: identity
        shell: bash
        env:
          IDENTITY: release=${{ inputs.expected_release_sha }}|mode=select-only-export
        run: echo "operation_key=$(node .github/scripts/controlled-operation-gate.cjs key --repository "$GITHUB_REPOSITORY" --workflow .github/workflows/career-current-authority-export.yml --scope career-current-authority-export --identity "$IDENTITY")" >> "$GITHUB_OUTPUT"
      - id: gate
        uses: ./.github/actions/controlled-operation-gate
        with:
          claimed-key: ${{ inputs.operation_key }}
          expected-key: ${{ steps.identity.outputs.operation_key }}
          workflow-file: career-current-authority-export.yml
          receipt-template: career-current-authority-export-{run_id}-{run_attempt}

  export:
    name: Export exact current authority once
    needs: operation_gate
    if: needs.operation_gate.outputs.decision == 'execute'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - name: Check out exact latest main release
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.expected_release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact latest main
        shell: bash
        env:
          RELEASE: ${{ inputs.expected_release_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$RELEASE" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE"
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$RELEASE"

      - name: Set up pinned production SSH identity
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known hosts
        shell: bash
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS"
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null || ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f ~/.ssh/known_hosts >/dev/null

      - name: Export SELECT-only current authority
        shell: bash
        env:
          RELEASE: ${{ inputs.expected_release_sha }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ && "$DEPLOY_PATH" != *".."* ]]
          mkdir -p artifacts/career-current-authority-export
          raw="$RUNNER_TEMP/career-current-authority-export.ndjson"
          printf -v q_path '%q' "$DEPLOY_PATH"
          printf -v q_release '%q' "$RELEASE"
          printf -v q_run '%q' "$GITHUB_RUN_ID"
          printf -v q_attempt '%q' "$GITHUB_RUN_ATTEMPT"
          remote="set -euo pipefail; current=\$(readlink -f $q_path/current); test -n \"\$current\"; test \"\$(tr -d '\\r\\n' < \"\$current/REVISION\")\" = $q_release; test ! -e $q_path/.dep/deploy.lock; release_name=\$(basename \"\$current\"); sudo -n -u www-data -- env CAREER_CURRENT_EXPORT_EXECUTE=1 CAREER_CURRENT_EXPORT_BACKEND_ROOT=\"\$current/backend\" CAREER_CURRENT_EXPORT_RELEASE_SHA=$q_release CAREER_CURRENT_EXPORT_RELEASE_NAME=\"\$release_name\" CAREER_CURRENT_EXPORT_WORKFLOW_RUN_ID=$q_run CAREER_CURRENT_EXPORT_WORKFLOW_RUN_ATTEMPT=$q_attempt php \"\$current/backend/scripts/operations/career_current_authority_export.php\""
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "$remote" > "$raw"
          test "$(wc -l < "$raw" | tr -d ' ')" = 1047
          head -n 1 "$raw" > "$RUNNER_TEMP/meta.json"
          tail -n +2 "$raw" > artifacts/career-current-authority-export/assets.jsonl
          jq -e '.kind == "meta" and .receipt.status == "PASS_CURRENT_AUTHORITY_EXPORT"' "$RUNNER_TEMP/meta.json" >/dev/null
          jq -S '.manifest' "$RUNNER_TEMP/meta.json" > artifacts/career-current-authority-export/manifest.json
          jq -S '.receipt' "$RUNNER_TEMP/meta.json" > artifacts/career-current-authority-export/receipt.json

      - name: Validate exported artifact and zero-write receipt
        shell: bash
        env:
          RELEASE: ${{ inputs.expected_release_sha }}
        run: |
          set -euo pipefail
          dir=artifacts/career-current-authority-export
          assets_sha="$(sha256sum "$dir/assets.jsonl" | awk '{print $1}')"
          jq -e --arg release "$RELEASE" --arg assets "$assets_sha" '
            .contract_version == "career.current_authority_export.v1"
            and .status == "PASS_CURRENT_AUTHORITY_EXPORT"
            and .release_sha == $release
            and .counts.careers == 1046
            and .counts.locale_pages == 2092
            and .counts.components_per_page == 26
            and .counts.numeric_rating_statement_residue_count == 0
            and .assets_sha256 == $assets
            and .database_query_count > 0
            and .database_query_verbs == ["select"]
            and .database_write_count == 0
            and .cache_write_count == 0
            and .pointer_write_count == 0
            and .discoverability_write_count == 0
            and .cms_write_count == 0
            and .sitemap_write_count == 0
            and .llms_write_count == 0
            and .search_submission_count == 0
            and .remote_file_write_count == 0
            and .database_public_content_sha256 == .active_cache_public_content_sha256
            and .database_public_content_sha256 == .api_public_content_sha256
            and .hashes_match == true
            and .not_repository_authority == true
          ' "$dir/receipt.json" >/dev/null
          jq -e --arg assets "$assets" '
            .contract_version == "career.current_authority_manifest.v1"
            and .counts.careers == 1046
            and .counts.locale_pages == 2092
            and .counts.components_per_page == 26
            and .files[0].sha256 == $assets
            and (.exported_field_set_sha256 | keys | length) == 13
          ' "$dir/manifest.json" >/dev/null
          test "$(wc -l < "$dir/assets.jsonl" | tr -d ' ')" = 1046
          jq -e -s 'length == 1046 and ([.[].canonical_slug] | unique | length) == 1046 and all(.[].component_order_json; length == 26)' "$dir/assets.jsonl" >/dev/null

      - name: Upload immutable export artifact
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: career-current-authority-export-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/career-current-authority-export
          if-no-files-found: error
          retention-days: 30
