            > "$cro_dry_run_json" 2> "$cro_dry_run_stderr" \
            || fail CRO_DRY_RUN_COMMAND_FAILED
          jq -e '
            .schema_version == "analytics-seo-conversion-refresh-dry-run.v1"
            and .status == "not_executed"
            and .org_scope_mode == "bounded"
            and .org_scope_count == 1
            and (.attempted_rows | type == "number" and . >= 0)
            and ((.expected_metrics | keys | sort) == [
              "article_to_test_click_count",
              "complete_test_count",
              "landing_pv_count",
              "result_ready_count",
              "return_public_content_count",
              "start_test_count",
              "view_result_count"
            ])
            and ((.expected_metrics | to_entries) | all(.value | type == "number" and . >= 0))
            and .raw_session_or_business_identifiers_exposed == false
          ' "$cro_dry_run_json" >/dev/null || fail CRO_NO_REAL_AGGREGATE_SOURCE

          cro_refresh_json="$RUNNER_TEMP/staging-cro-refresh.json"
          cro_refresh_stderr="$RUNNER_TEMP/staging-cro-refresh.stderr"
          "${ssh_base[@]}" "$remote_prefix export SEO_INTEL_ALLOW_EXTERNAL_API_CALLS=false SEO_INTEL_WRITE_ENABLED=false; php artisan analytics:refresh-seo-conversion-daily --from=$from_date --to=$to_date --org=0 --trigger=manual --json --no-interaction --no-ansi" \
