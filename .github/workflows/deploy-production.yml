            --dir "$incident_dir"
          incident_receipt="$incident_dir/backend-production-incident-diagnostic.json"
          test -f "$incident_receipt"
          test "$(sha256sum "$incident_receipt" | awk '{print $1}')" = "$incident_receipt_sha256"
          jq -e \
            --arg candidate_sha "$candidate_sha" \
            --arg release_id "$release_id" \
            --arg incident_run_id "$incident_run_id" \
            --arg expected_active_revision "$EXPECTED_DEPLOYED_REVISION" \
            '
              .schema_version == "fermatmind.backend-production-incident-diagnostic.v2"
              and .status == "hold_no_retry"
