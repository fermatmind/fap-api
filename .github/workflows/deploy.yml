name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  attestations: read
  contents: read

concurrency:
  group: trunk-deploy-${{ github.repository }}
  cancel-in-progress: false

env:
  DEPLOYER_VERSION: "7.5.12"
  DEPLOYER_SHA256: "b55c6609653e888c672d327c407f8bba6324b9c9cc24f9dcfb3f4b3922760632"
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
  DEPLOY_LOCK_RUN_ID: ${{ github.run_id }}
  DEPLOY_LOCK_RUN_ATTEMPT: ${{ github.run_attempt }}
  TRUNK_DEPLOY_SERIALIZED: "true"

jobs:
  policy:
    name: Bind successful main CI receipt
    if: >-
      github.event.workflow_run.name == 'CI' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.receipt.outputs.deploy }}
      classification: ${{ steps.receipt.outputs.classification }}
      artifact_digest: ${{ steps.artifact.outputs.digest }}
      config_fingerprint: ${{ steps.receipt.outputs.config_fingerprint }}
      career_current: ${{ steps.receipt.outputs.career_current }}
      career_current_release: ${{ steps.receipt.outputs.career_current_release }}
      career_data_recovery: ${{ steps.receipt.outputs.career_data_recovery }}
      career_current_full_scan: ${{ steps.receipt.outputs.career_current_full_scan }}
      career_current_assets_sha256: ${{ steps.career-current.outputs.assets_sha256 }}
      career_current_source_merge_sha: ${{ steps.career-current.outputs.source_merge_sha }}
      career_current_manifest_sha256: ${{ steps.career-current.outputs.manifest_sha256 }}
      career_current_projection_sha256: ${{ steps.career-current.outputs.versionless_projection_sha256 }}
      career_current_operation_key: ${{ steps.career-current.outputs.operation_key }}
      career_parity_receipt_digest: ${{ steps.receipt.outputs.career_parity_receipt_digest }}
      career_parity_compiler_digest: ${{ steps.receipt.outputs.career_parity_compiler_digest }}
      career_parity_codec_digest: ${{ steps.receipt.outputs.career_parity_codec_digest }}
      mbti_zh_result_release: ${{ steps.receipt.outputs.mbti_zh_result_release }}
      mbti_zh_result_package_hash: ${{ steps.mbti-zh-result.outputs.package_hash }}
      mbti_zh_result_actor: ${{ steps.mbti-zh-result.outputs.actor }}
      mbti_zh_result_operation_key: ${{ steps.mbti-zh-result.outputs.operation_key }}
      seo_platform_10_closeout: ${{ steps.receipt.outputs.seo_platform_10_closeout }}
      seo_agent_evidence_boundary: ${{ steps.receipt.outputs.seo_agent_evidence_boundary }}
      seo_agent_policy_gateway: ${{ steps.receipt.outputs.seo_agent_policy_gateway }}
      seo_council_orchestration: ${{ steps.receipt.outputs.seo_council_orchestration }}
      seo_competitive_evidence: ${{ steps.receipt.outputs.seo_competitive_evidence }}
      private_result_authority_publish_required: ${{ steps.receipt.outputs.private_result_authority_publish_required }}
    steps:
      - name: Refuse non-main, PR, failed, or ambiguous CI runs
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CI_EVENT: ${{ github.event.workflow_run.event }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$CI_RUN_ATTEMPT" = 1
          test "$HEAD_BRANCH" = main
          test "$CI_EVENT" = push
          test "$CI_CONCLUSION" = success
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
      - id: artifact
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        with:
          script: |
            const runId = Number(process.env.CI_RUN_ID);
            const expected = `trunk-validation-${process.env.DEPLOY_SHA}`;
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner, repo: context.repo.repo, run_id: runId, per_page: 100,
            });
            const matches = data.artifacts.filter((artifact) => artifact.name === expected && !artifact.expired);
            if (matches.length !== 1) return core.setFailed(`Expected one ${expected} artifact; found ${matches.length}`);
            if (!/^sha256:[0-9a-f]{64}$/.test(String(matches[0].digest || ""))) return core.setFailed("Validation artifact digest is missing");
            core.setOutput("id", String(matches[0].id));
            core.setOutput("digest", matches[0].digest);
      - id: receipt
        name: Verify exact-SHA receipt bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.id }}
          EXPECTED_DIGEST: ${{ steps.artifact.outputs.digest }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/validation.zip"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" -o "$zip"
          test "sha256:$(sha256sum "$zip" | awk '{print $1}')" = "$EXPECTED_DIGEST"
          unzip -q "$zip" -d "$RUNNER_TEMP/validation"
          receipt="$RUNNER_TEMP/validation/trunk-validation.json"
          jq -e --arg sha "$DEPLOY_SHA" --arg run "$CI_RUN_ID" '
            .schema_version == "fermatmind.trunk-validation.v1"
            and .sha == $sha
            and .ci_run_id == $run
            and .result == "success"
            and .publisher.required == .classification.operations.publisher_required
            and .seo_agent_policy_gateway.required == .classification.operations.seo_agent_policy_gateway
            and .seo_council_orchestration.required == .classification.operations.seo_council_orchestration
            and .seo_competitive_evidence.required == .classification.operations.seo_competitive_evidence
            and ((.publisher.required == true
                and .publisher.parity.status == "pass"
                and .publisher.parity.release_sha == $sha
                and (.publisher.parity.receipt_digest | test("^[0-9a-f]{64}$")))
              or (.publisher.required == false and .publisher.parity.status == "skipped"))
            and ((.seo_agent_policy_gateway.required == true
                and .seo_agent_policy_gateway.state == "DEPLOYED_DISABLED"
                and .seo_agent_policy_gateway.mode == "DETERMINISTIC_DENY_ONLY"
                and .seo_agent_policy_gateway.decision_allow_count == 0
                and .seo_agent_policy_gateway.admission_bypass == 0
                and .seo_agent_policy_gateway.execution_bypass == 0
                and .seo_agent_policy_gateway.manifest_bypass == 0
                and .seo_agent_policy_gateway.entrypoint_bypass == 0
                and .seo_agent_policy_gateway.l4_allow_count == 0
                and .seo_agent_policy_gateway.active_manifest_count == 0
                and .seo_agent_policy_gateway.trusted_signing_key_count == 0
                and .seo_agent_policy_gateway.model_calls == 0
                and .seo_agent_policy_gateway.tool_calls == 0
                and .seo_agent_policy_gateway.external_calls == 0
                and .seo_agent_policy_gateway.business_writes == 0
                and .seo_agent_policy_gateway.cms_writes == 0
                and .seo_agent_policy_gateway.url_truth_writes == 0
                and .seo_agent_policy_gateway.search_submissions == 0
                and .seo_agent_policy_gateway.contract_version == "seo.policy_gateway_closeout.v2"
                and .seo_agent_policy_gateway.manifest_contract.total == 3
                and .seo_agent_policy_gateway.manifest_contract.rejected == 3
                and .seo_agent_policy_gateway.manifest_contract.bypass == 0
                and .seo_agent_policy_gateway.execution_scope_binding.total == 10
                and .seo_agent_policy_gateway.execution_scope_binding.denied == 8
                and .seo_agent_policy_gateway.execution_scope_binding.held == 2
                and .seo_agent_policy_gateway.execution_scope_binding.bypass == 0)
              or (.seo_agent_policy_gateway.required == false
                and .seo_agent_policy_gateway.result == "skipped"))
            and ((.seo_council_orchestration.required == true
                and .seo_council_orchestration.contract_version == "seo.council_closeout.v2"
                and .seo_council_orchestration.source_sha == $sha
                and .seo_council_orchestration."SEO-PLATFORM-11D" == "CLOSED"
                and .seo_council_orchestration.ready_for_11E == true
                and .seo_council_orchestration."SEO-PLATFORM-11E" == "HOLD"
                and .seo_council_orchestration.ready_for_11F == false
                and .seo_council_orchestration.technical_diagnosis.receipt_version == "seo.technical_diagnosis_closeout.v2"
                and .seo_council_orchestration.technical_diagnosis.environment == "ci_candidate"
                and .seo_council_orchestration.technical_diagnosis.dependency_mode == "OFFLINE_FIXTURE"
                and .seo_council_orchestration.technical_diagnosis.closeout_state == "CANDIDATE_READY"
                and .seo_council_orchestration.technical_diagnosis.candidate_sha == $sha
                and .seo_council_orchestration.technical_diagnosis.observed_active_sha == null
                and .seo_council_orchestration.technical_diagnosis."SEO-PLATFORM-11E" == "HOLD"
                and .seo_council_orchestration.technical_diagnosis.ready_for_11F == false
                and .seo_council_orchestration.technical_diagnosis.private_url_leak_count == 0
                and .seo_council_orchestration.technical_diagnosis.unsupported_p0_p1_count == 0
                and .seo_council_orchestration.technical_diagnosis.authority_invention_count == 0
                and .seo_council_orchestration.technical_diagnosis.policy_bypass_count == 0
                and .seo_council_orchestration.technical_diagnosis.write_attempt_count == 0
                and .seo_council_orchestration.technical_diagnosis.shared_root_misclassification_count == 0
                and .seo_council_orchestration.technical_diagnosis.real_dependency_binding_bypass == 0
                and .seo_council_orchestration.technical_diagnosis.dependency_ref_mismatch_bypass == 0
                and .seo_council_orchestration.technical_diagnosis.detector_ref_mismatch_bypass == 0
                and .seo_council_orchestration.technical_diagnosis.cross_source_field_bypass == 0
                and .seo_council_orchestration.technical_diagnosis.cross_source_overwrite_bypass == 0
                and .seo_council_orchestration.technical_diagnosis.bundle_order_variance_count == 0
                and .seo_council_orchestration.technical_diagnosis.hardcoded_negative_guarantee_count == 0
                and .seo_council_orchestration.technical_diagnosis.orchestrator_runner_bypass == 0
                and .seo_council_orchestration.technical_diagnosis.model_calls == 0
                and .seo_council_orchestration.technical_diagnosis.tool_calls == 0
                and .seo_council_orchestration.technical_diagnosis.external_calls == 0
                and .seo_council_orchestration.technical_diagnosis.production_permissions == 0
                and .seo_council_orchestration.technical_diagnosis.execution_allowed == false
                and .seo_council_orchestration."SEO-PLATFORM-11F" == "HOLD"
                and .seo_council_orchestration.ready_for_11G == false
                and .seo_council_orchestration.measurement_review.receipt_version == "seo.measurement_closeout.v3"
                and .seo_council_orchestration.measurement_review.environment == "ci_candidate"
                and .seo_council_orchestration.measurement_review.closeout_state == "OFFLINE_EVAL_READY"
                and .seo_council_orchestration.measurement_review.mode_state == "OFFLINE_EVAL_READY"
                and .seo_council_orchestration.measurement_review.candidate_sha == $sha
                and .seo_council_orchestration.measurement_review.dependency_status == "READY"
                and .seo_council_orchestration.measurement_review.evidence_source_state == "offline_not_loaded"
                and .seo_council_orchestration.measurement_review.evidence_freshness_state == "not_applicable"
                and .seo_council_orchestration.measurement_review.search_source_state == "offline_not_loaded"
                and .seo_council_orchestration.measurement_review.search_freshness_state == "not_applicable"
                and .seo_council_orchestration.measurement_review.search_bundle_verification == "not_applicable"
                and .seo_council_orchestration.measurement_review.search_context_status == "NOT_APPLICABLE"
                and .seo_council_orchestration.measurement_review.search_hold_reason == "OFFLINE_NOT_LOADED"
                and .seo_council_orchestration.measurement_review.cro_source_state == "offline_not_loaded"
                and .seo_council_orchestration.measurement_review.cro_freshness_state == "not_applicable"
                and .seo_council_orchestration.measurement_review.cro_bundle_verification == "not_applicable"
                and .seo_council_orchestration.measurement_review.cro_context_status == "NOT_APPLICABLE"
                and .seo_council_orchestration.measurement_review.cro_hold_reason == "OFFLINE_NOT_LOADED"
                and ((.seo_council_orchestration.measurement_review | [
                  .real_evidence_bundle_bypass_count, .bundle_verifier_bypass_count, .context_builder_bypass_count,
                  .request_pii_bypass_count, .evidence_pii_bypass_count, .metadata_pii_bypass_count,
                  .output_pii_bypass_count, .private_url_leak_count, .cro_causal_overclaim_count,
                  .source_conflict_bypass_count, .schema_validation_bypass_count, .orchestrator_runner_bypass_count,
                  .direct_mode_entry_bypass_count, .policy_bypass_count, .role_expansion_bypass_count,
                  .write_attempt_count, .all_privacy_bypass, .source_conflict_bypass, .causal_overclaim, .orchestrator_bypass,
                  .model_calls, .tool_calls, .external_calls, .cms_writes,
                  .url_truth_writes, .search_writes, .business_writes, .production_permissions
                ]) | all(. == 0))
                and .seo_council_orchestration.measurement_review.model_calls == 0
                and .seo_council_orchestration.measurement_review.tool_calls == 0
                and .seo_council_orchestration.measurement_review.external_calls == 0
                and .seo_council_orchestration.measurement_review.production_permissions == 0
                and .seo_council_orchestration.measurement_review.cms_writes == 0
                and .seo_council_orchestration.measurement_review.url_truth_writes == 0
                and .seo_council_orchestration.measurement_review.search_writes == 0
                and .seo_council_orchestration.measurement_review.business_writes == 0
                and .seo_council_orchestration.measurement_review.execution_allowed == false
                and .seo_council_orchestration.measurement_review.production_execution_enabled == false
                and .seo_council_orchestration.binding_hash_drift_count == 0
                and .seo_council_orchestration.admission_deny_bypass == 0
                and .seo_council_orchestration.admission_hold_bypass == 0
                and .seo_council_orchestration.csrf_bypass == 0
                and .seo_council_orchestration.policy_reason_overwrite_count == 0
                and .seo_council_orchestration.unauthorized_route_execution_count == 0
                and .seo_council_orchestration.state == "DEPLOYED_DISABLED"
                and .seo_council_orchestration.runtime_mode == "DETERMINISTIC_ROUTE_HOLD_ONLY"
                and .seo_council_orchestration.unique_seo_orchestrator_count == 1
                and .seo_council_orchestration.binding_status == "READY"
                and .seo_council_orchestration.dependency_status == "READY"
                and .seo_council_orchestration.contract_schema_hash_drift == 0
                and .seo_council_orchestration.entrypoints_present == "5/5"
                and .seo_council_orchestration.caller_role_bypass == 0
                and .seo_council_orchestration.active_legacy_seo_agent_entrypoints == 0
                and .seo_council_orchestration.routing.routing_precision.numerator == .seo_council_orchestration.routing.routing_precision.denominator
                and .seo_council_orchestration.routing.routing_recall.numerator == .seo_council_orchestration.routing.routing_recall.denominator
                and .seo_council_orchestration.routing.missed_required_mode_rate.numerator == 0
                and .seo_council_orchestration.routing.unnecessary_mode_rate.numerator == 0
                and .seo_council_orchestration.routing.all_team_invocation_count.numerator == 1
                and .seo_council_orchestration.routing.unauthorized_all_team_invocation_count.numerator == 0
                and .seo_council_orchestration.unauthorized_all_team_calls == 0
                and .seo_council_orchestration.peer_delegation_bypass == 0
                and .seo_council_orchestration.budget_timeout_retry_idempotency_bypass == 0
                and .seo_council_orchestration.unresolved_conflict_execution_bypass == 0
                and .seo_council_orchestration.career_chain_order_bypass == 0
                and .seo_council_orchestration.metadata_private_data_bypass == 0
                and .seo_council_orchestration.l4_allow_count == 0
                and .seo_council_orchestration.model_calls == 0
                and .seo_council_orchestration.tool_calls == 0
                and .seo_council_orchestration.external_calls == 0
                and .seo_council_orchestration.agent_write_permissions == 0
                and .seo_council_orchestration.business_writes == 0
                and .seo_council_orchestration.cms_writes == 0
                and .seo_council_orchestration.url_truth_writes == 0
                and .seo_council_orchestration.search_writes == 0
                and .seo_council_orchestration.active_manifests == 0
                and .seo_council_orchestration.trusted_signing_keys == 0
                and .seo_council_orchestration.external_trace_export == false
                and .seo_council_orchestration.shared_agent_memory == false
                and .seo_council_orchestration.mission_persistence_enabled == false
                and .seo_council_orchestration.platform11.receipt_version == "seo.intent_ownership_closeout.v1"
                and .seo_council_orchestration.platform11.environment == "ci_candidate"
                and .seo_council_orchestration.platform11.closeout_state == "OFFLINE_EVAL_READY"
                and .seo_council_orchestration.platform11.dependency_status == "READY"
                and .seo_council_orchestration.platform11.dependency_snapshot.source == "prior_production_closeout"
                and .seo_council_orchestration.platform11.dependency_snapshot.current_candidate_production_claimed == false
                and .seo_council_orchestration.platform11.negative_probes.bypass_count == 0
                and .seo_council_orchestration.platform11.role_count == 9
                and .seo_council_orchestration.platform11.seo_orchestrator_count == 1
                and .seo_council_orchestration.platform11."SEO-PLATFORM-11H" == "OFFLINE_EVAL_READY"
                and .seo_council_orchestration.platform11.ready_for_11I == false
                and .seo_council_orchestration.platform11_editorial.receipt_version == "seo.editorial_draft_closeout.v1"
                and .seo_council_orchestration.platform11_editorial.closeout_state == "OFFLINE_EVAL_READY"
                and .seo_council_orchestration.platform11_editorial.negative_probes.bypass_count == 0
                and .seo_council_orchestration.platform11_editorial."SEO-PLATFORM-11I" == "OFFLINE_EVAL_READY"
                and .seo_council_orchestration.platform11_editorial.ready_for_11J == false
                and .seo_council_orchestration.platform11_runtime_qa.receipt_version == "seo.runtime_qa_closeout.v1"
                and .seo_council_orchestration.platform11_runtime_qa.closeout_state == "OFFLINE_EVAL_READY"
                and .seo_council_orchestration.platform11_runtime_qa.negative_probes.bypass_count == 0
                and .seo_council_orchestration.platform11_runtime_qa."SEO-PLATFORM-11J" == "OFFLINE_EVAL_READY"
                and .seo_council_orchestration.platform11_runtime_qa.ready_for_11K == false
                and .seo_council_orchestration.platform11_independent_review.receipt_version == "seo.independent_review_closeout.v1"
                and .seo_council_orchestration.platform11_independent_review.closeout_state == "OFFLINE_EVAL_READY"
                and .seo_council_orchestration.platform11_independent_review.negative_probes.bypass_count == 0
                and .seo_council_orchestration.platform11_independent_review."SEO-PLATFORM-11K" == "OFFLINE_EVAL_READY"
                and .seo_council_orchestration.platform11_independent_review.ready_for_11L == false
                and .seo_council_orchestration.platform11_lifecycle.receipt_version == "seo.platform11_closeout.v1"
                and .seo_council_orchestration.platform11_lifecycle.closeout_state == "OFFLINE_EVAL_READY"
                and .seo_council_orchestration.platform11_lifecycle.lifecycle_probes.bypass_count == 0
                and .seo_council_orchestration.platform11_lifecycle.canary_probes.bypass_count == 0
                and .seo_council_orchestration.platform11_lifecycle.evaluation.sample_size == 96
                and .seo_council_orchestration.platform11_lifecycle.fault_drill.passed_count == 15
                and .seo_council_orchestration.platform11_lifecycle."SEO-PLATFORM-11" == "OFFLINE_EVAL_READY"
                and .seo_council_orchestration.platform11_lifecycle.ready_for_12 == false
                and .seo_council_orchestration.platform11_lifecycle.execution_allowed == false
                and .seo_council_orchestration.execution_allowed == false)
              or (.seo_council_orchestration.required == false
                and .seo_council_orchestration.result == "skipped"))
            and ((.seo_competitive_evidence.required == true
                and .seo_competitive_evidence.receipt_version == "seo.competitive_evidence_closeout.v3"
                and .seo_competitive_evidence.closeout_state == "OFFLINE_EVAL_READY"
                and .seo_competitive_evidence.candidate_sha == $sha
                and .seo_competitive_evidence.environment == "ci_candidate"
                and .seo_competitive_evidence."SEO-PLATFORM-11G" == "OFFLINE_EVAL_READY"
                and .seo_competitive_evidence.dependency_ingestion.external_reads == 0
                and .seo_competitive_evidence.external_calls == 0
                and .seo_competitive_evidence.production_permissions == 0
                and .seo_competitive_evidence.execution_allowed == false)
              or (.seo_competitive_evidence.required == false
                and .seo_competitive_evidence.result == "skipped"))
          ' \
            "$receipt" >/dev/null
          classification="$(jq -c .classification "$receipt")"
          career_current_release="$(jq -r '.classification.operations.career_current_authority_release == true' "$receipt")"
          career_data_recovery="$(jq -r '.classification.operations.career_data_recovery == true' "$receipt")"
          career_current="$(jq -r '.publisher.required == true' "$receipt")"
          career_current_full_scan="$career_current"
          mbti_zh_result_release="$(jq -r '.classification.operations.mbti_zh_result_authority_release == true' "$receipt")"
          seo_platform_10_closeout="$(jq -r '.classification.operations.seo_platform_10_closeout == true' "$receipt")"
          seo_agent_evidence_boundary="$(jq -r '.classification.operations.seo_agent_evidence_boundary == true' "$receipt")"
          seo_agent_policy_gateway="$(jq -r '.classification.operations.seo_agent_policy_gateway == true' "$receipt")"
          seo_council_orchestration="$(jq -r '.classification.operations.seo_council_orchestration == true' "$receipt")"
          seo_competitive_evidence="$(jq -r '.classification.operations.seo_competitive_evidence == true' "$receipt")"
          private_result_authority_publish_required="$(jq -r '
            if .classification.operations.seo_council_orchestration == true
            then false else true end
          ' "$receipt")"
          if [ "$private_result_authority_publish_required" = false ]; then
            # Keep the CI parity proof, but do not turn a Council control-plane
            # closeout into Career publication authority.
            career_current=false
            career_current_full_scan=false
          fi
          {
            echo "deploy=$(jq -r .classification.deploy "$receipt")"
            echo "classification=$classification"
            echo "config_fingerprint=$(sha256sum "$receipt" | awk '{print $1}')"
            echo "career_current=$career_current"
            echo "career_current_release=$career_current_release"
            echo "career_data_recovery=$career_data_recovery"
            echo "career_current_full_scan=$career_current_full_scan"
            echo "career_parity_receipt_digest=$(jq -r '.publisher.parity.receipt_digest // ""' "$receipt")"
            echo "career_parity_compiler_digest=$(jq -r '.publisher.parity.package.compiler_digest // ""' "$receipt")"
            echo "career_parity_codec_digest=$(jq -r '.publisher.parity.package.codec_digest // ""' "$receipt")"
            echo "mbti_zh_result_release=$mbti_zh_result_release"
            echo "seo_platform_10_closeout=$seo_platform_10_closeout"
            echo "seo_agent_evidence_boundary=$seo_agent_evidence_boundary"
            echo "seo_agent_policy_gateway=$seo_agent_policy_gateway"
            echo "seo_council_orchestration=$seo_council_orchestration"
            echo "seo_competitive_evidence=$seo_competitive_evidence"
            echo "private_result_authority_publish_required=$private_result_authority_publish_required"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        if: steps.receipt.outputs.career_current == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        if: steps.receipt.outputs.career_current == 'true'
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - name: Install Career release-intent verifier dependencies
        if: steps.receipt.outputs.career_current == 'true'
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress
      - id: career-current
        name: Bind Career Current package operation
        if: steps.receipt.outputs.career_current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          receipt="$(backend/scripts/ci/verify_career_current_authority_release.sh)"
          jq -e '.status == "PASS_CAREER_CURRENT_RELEASE_INTENT" and (.source_merge_sha | length == 40) and (.operation_key | length == 64)' <<<"$receipt" >/dev/null
          jq -e --arg assets "$(jq -r .aggregate_sha256 <<<"$receipt")" \
            --arg projection "$(jq -r .versionless_projection_sha256 <<<"$receipt")" '
              .publisher.required == true
              and .publisher.parity.status == "pass"
              and .publisher.parity.package.digest == $assets
              and .publisher.parity.package.projection_digest == $projection
              and (.publisher.parity.package.compiler_digest | test("^[0-9a-f]{64}$"))
              and (.publisher.parity.package.codec_digest | test("^[0-9a-f]{64}$"))
            ' "$RUNNER_TEMP/validation/trunk-validation.json" >/dev/null
          {
            echo "assets_sha256=$(jq -r .aggregate_sha256 <<<"$receipt")"
            echo "source_merge_sha=$(jq -r .source_merge_sha <<<"$receipt")"
            echo "manifest_sha256=$(jq -r .manifest_sha256 <<<"$receipt")"
            echo "versionless_projection_sha256=$(jq -r .versionless_projection_sha256 <<<"$receipt")"
            echo "operation_key=$(jq -r .operation_key <<<"$receipt")"
          } >> "$GITHUB_OUTPUT"
      - id: mbti-zh-result
        name: Bind exact MBTI zh result authority operation
        if: steps.receipt.outputs.mbti_zh_result_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/mbti-zh-result-authority-release.json"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/contents/backend/content_assets/personality_public/mbti_zh_result_authority_release.v1.json?ref=$DEPLOY_SHA" \
            | jq -r .content | base64 --decode > "$manifest"
          jq -e '
            .contract_version == "mbti.zh_result_authority_release.v1"
            and .package_id == "mbti-zh-result-41755da0ed35dc35"
            and .package_hash == "41755da0ed35dc35d8ef4de68582506a9615924bfbb3548c037c004f34b520c4"
            and .locale == "zh-CN"
            and .template_key == "mbti_desktop_clone_v1"
            and .record_count == 32
            and .disabled_slot_count == 224
            and .admin_actor_user_id == 1
            and ([.negative_guarantees[]] | all(. == false))
          ' "$manifest" >/dev/null
          package_hash="$(jq -r .package_hash "$manifest")"
          actor="$(jq -r .admin_actor_user_id "$manifest")"
          operation_key="$(printf 'mbti-zh-result-authority|%s|%s|%s' "$DEPLOY_SHA" "$package_hash" "$actor" | sha256sum | awk '{print $1}')"
          {
            echo "package_hash=$package_hash"
            echo "actor=$actor"
            echo "operation_key=$operation_key"
          } >> "$GITHUB_OUTPUT"

  staging:
    name: Staging exact-SHA deploy and smoke
    needs: policy
    if: needs.policy.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: staging
    env:
      TARGET: staging
      DEPLOY_USER: ${{ secrets.STAGING_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.STAGING_DEPLOY_PORT }}
      DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
      DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
      DEPLOY_USER_STG: ${{ secrets.STAGING_DEPLOY_USER }}
      DEPLOY_PORT_STG: ${{ secrets.STAGING_DEPLOY_PORT }}
      DEPLOY_HOST_STG: ${{ secrets.STAGING_DEPLOY_HOST }}
      DEPLOY_PATH_STG: ${{ secrets.STAGING_DEPLOY_PATH }}
      HEALTHCHECK_URL: ${{ secrets.STAGING_HEALTHCHECK_URL }}
      AUTH_GUEST_CHECK_URL: ${{ secrets.STAGING_AUTH_GUEST_CHECK_URL }}
      OPS_HOST: ${{ secrets.STAGING_OPS_HOST }}
      DEPLOY_REVISION: ${{ github.event.workflow_run.head_sha }}
      DEPLOY_MODE: standard
      CI_PARITY_RECEIPT_VERIFIED: "true"
      CI_PARITY_RECEIPT_SHA: ${{ github.event.workflow_run.head_sha }}
      CI_PARITY_RECEIPT_ARTIFACT_DIGEST: ${{ needs.policy.outputs.artifact_digest }}
      CI_PARITY_RECEIPT_CONFIG_FINGERPRINT: ${{ needs.policy.outputs.config_fingerprint }}
      CI_PARITY_RECEIPT_RUN_ID: ${{ github.event.workflow_run.id }}
      CI_PARITY_RECEIPT_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      SEO_INTEL_RUNTIME_ENVIRONMENT: staging
      SEO_INTEL_ENABLED: ${{ vars.SEO_INTEL_ENABLED }}
      SEO_INTEL_DB_CONNECTION: ${{ vars.SEO_INTEL_DB_CONNECTION }}
      SEO_INTEL_WRITE_ENABLED: ${{ vars.SEO_INTEL_WRITE_ENABLED }}
      SEO_INTEL_COLLECTORS_ENABLED: ${{ vars.SEO_INTEL_COLLECTORS_ENABLED }}
      SEO_INTEL_DRY_RUN_DEFAULT: ${{ vars.SEO_INTEL_DRY_RUN_DEFAULT }}
      SEO_INTEL_ALLOW_EXTERNAL_API_CALLS: ${{ vars.SEO_INTEL_ALLOW_EXTERNAL_API_CALLS }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Install pinned Deployer
        run: |
          curl -fsSL -o /tmp/dep.phar "https://github.com/deployphp/deployer/releases/download/v${DEPLOYER_VERSION}/deployer.phar"
          printf '%s  /tmp/dep.phar\n' "$DEPLOYER_SHA256" | sha256sum -c -
      - name: Configure staging SSH identities
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          STAGING_REPO_READ_SSH_KEY: ${{ secrets.STAGING_REPO_READ_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$STAGING_REPO_READ_SSH_KEY"
          install -d -m 700 ~/.ssh
          host_key="$RUNNER_TEMP/staging-host-key"
          install -m 600 /dev/null "$host_key"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$host_key"
          printf 'DEPLOY_IDENTITY_FILE_STG=%s\n' "$host_key" >> "$GITHUB_ENV"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          eval "$(ssh-agent -s)" >/dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          printf '%s\n' "$STAGING_REPO_READ_SSH_KEY" | ssh-add - >/dev/null 2>&1
      - name: Deploy staging and run repository smoke chain
        env:
          SEO_INTEL_DB_HOST: ${{ secrets.SEO_INTEL_DB_HOST }}
          SEO_INTEL_DB_PORT: ${{ secrets.SEO_INTEL_DB_PORT }}
          SEO_INTEL_DB_DATABASE: ${{ secrets.SEO_INTEL_DB_DATABASE }}
          SEO_INTEL_DB_USERNAME: ${{ secrets.SEO_INTEL_DB_USERNAME }}
          SEO_INTEL_DB_PASSWORD: ${{ secrets.SEO_INTEL_DB_PASSWORD }}
          SEO_INTEL_MIGRATION_DB_USERNAME: ${{ secrets.SEO_INTEL_MIGRATION_DB_USERNAME }}
          SEO_INTEL_MIGRATION_DB_PASSWORD: ${{ secrets.SEO_INTEL_MIGRATION_DB_PASSWORD }}
          SEO_COUNCIL_DB_USERNAME: ${{ secrets.SEO_COUNCIL_DB_USERNAME }}
          SEO_COUNCIL_DB_PASSWORD: ${{ secrets.SEO_COUNCIL_DB_PASSWORD }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          council_orchestration='${{ needs.policy.outputs.seo_council_orchestration }}'
          deploy_timeout=30m
          if test "$council_orchestration" = true; then deploy_timeout=60m; fi
          timeout --signal=TERM --kill-after=30s "$deploy_timeout" php /tmp/dep.phar deploy staging -f deploy.php --revision "$DEPLOY_SHA" \
            -o release_name="trunk-${DEPLOY_SHA:0:12}-${GITHUB_RUN_ID}" -o deploy_mode=standard \
            -o seo_platform_10_closeout='${{ needs.policy.outputs.seo_platform_10_closeout }}' \
            -o seo_agent_evidence_boundary='${{ needs.policy.outputs.seo_agent_evidence_boundary }}' \
            -o seo_agent_policy_gateway='${{ needs.policy.outputs.seo_agent_policy_gateway }}' \
            -o private_result_authority_publish_required='${{ needs.policy.outputs.private_result_authority_publish_required }}' \
            -o career_data_recovery='${{ needs.policy.outputs.career_data_recovery }}' \
            -o seo_council_orchestration="$council_orchestration" \
            -o seo_competitive_evidence='${{ needs.policy.outputs.seo_competitive_evidence }}' \
            -o seo_council_closeout_deferred="$council_orchestration" --no-interaction
      - name: Materialize inactive staging measurement candidate
        if: needs.policy.outputs.seo_council_orchestration == 'true'
        env:
          SEO_INTEL_DB_HOST: ${{ secrets.SEO_INTEL_DB_HOST }}
          SEO_INTEL_DB_PORT: ${{ secrets.SEO_INTEL_DB_PORT }}
          SEO_INTEL_DB_DATABASE: ${{ secrets.SEO_INTEL_DB_DATABASE }}
          SEO_INTEL_DB_USERNAME: ${{ secrets.SEO_INTEL_DB_USERNAME }}
          SEO_INTEL_DB_PASSWORD: ${{ secrets.SEO_INTEL_DB_PASSWORD }}
          SEO_INTEL_MIGRATION_DB_USERNAME: ${{ secrets.SEO_INTEL_MIGRATION_DB_USERNAME }}
          SEO_INTEL_MIGRATION_DB_PASSWORD: ${{ secrets.SEO_INTEL_MIGRATION_DB_PASSWORD }}
          SEO_COUNCIL_DB_USERNAME: ${{ secrets.SEO_COUNCIL_DB_USERNAME }}
          SEO_COUNCIL_DB_PASSWORD: ${{ secrets.SEO_COUNCIL_DB_PASSWORD }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          timeout --signal=TERM --kill-after=30s 20m php /tmp/dep.phar deploy:candidate-only staging -f deploy.php --revision "$DEPLOY_SHA" \
            -o release_name="source-${DEPLOY_SHA:0:12}-${GITHUB_RUN_ID}" -o deploy_mode=candidate_only \
            -o private_result_authority_publish_required=false --no-interaction
      - name: Verify staging measurement source readiness
        id: measurement_source_readiness
        if: needs.policy.outputs.seo_council_orchestration == 'true'
        continue-on-error: true
        shell: bash
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.SEO_INTEL_GSC_SERVICE_ACCOUNT_JSON }}
          GSC_PROPERTY_URL: ${{ secrets.SEO_INTEL_GSC_PROPERTY_URL }}
          GSC_ENABLED: ${{ vars.SEO_INTEL_GSC_ENABLED }}
          GSC_LIVE_API_ENABLED: ${{ vars.SEO_INTEL_GSC_LIVE_API_ENABLED }}
          GSC_SYNC_ENABLED: ${{ vars.SEO_INTEL_GSC_SYNC_ENABLED }}
          GSC_AUTH_MODE: ${{ vars.SEO_INTEL_GSC_AUTH_MODE }}
          GSC_SCOPE: ${{ vars.SEO_INTEL_GSC_SCOPE }}
          GSC_SYNC_WINDOW_DAYS: ${{ vars.SEO_INTEL_GSC_SYNC_WINDOW_DAYS }}
          GSC_SYNC_SEARCH_TYPES: ${{ vars.SEO_INTEL_GSC_SYNC_SEARCH_TYPES }}
          GSC_SYNC_DB_USERNAME: ${{ secrets.SEO_INTEL_MIGRATION_DB_USERNAME }}
          GSC_SYNC_DB_PASSWORD: ${{ secrets.SEO_INTEL_MIGRATION_DB_PASSWORD }}
          PROXY_PORT: "18444"
        run: |
          set -euo pipefail
          fail() {
            printf 'measurement_source_readiness=HOLD reason=%s\n' "$1" >&2
            exit 1
          }
          test -n "$GSC_SERVICE_ACCOUNT_JSON" || fail GSC_SECRET_MISSING
          [[ "$GSC_PROPERTY_URL" =~ ^sc-domain:[A-Za-z0-9.-]+$ ]] || fail GSC_PROPERTY_INVALID
          test "$GSC_ENABLED" = true || fail GSC_DISABLED
          test "$GSC_LIVE_API_ENABLED" = true || fail GSC_LIVE_API_DISABLED
          test "$GSC_SYNC_ENABLED" = true || fail GSC_SYNC_DISABLED
          test "$GSC_AUTH_MODE" = service_account || fail GSC_AUTH_MODE_INVALID
          test "$GSC_SCOPE" = https://www.googleapis.com/auth/webmasters.readonly || fail GSC_SCOPE_NOT_READONLY
          test "$GSC_SYNC_WINDOW_DAYS" = 90 || fail GSC_WINDOW_INVALID
          test "$GSC_SYNC_SEARCH_TYPES" = web || fail GSC_SEARCH_TYPE_INVALID
          test -n "$GSC_SYNC_DB_USERNAME" || fail GSC_SYNC_DB_CREDENTIAL_MISSING
          test -n "$GSC_SYNC_DB_PASSWORD" || fail GSC_SYNC_DB_CREDENTIAL_MISSING

          local_key="$RUNNER_TEMP/service-account.json"
          local_env="$RUNNER_TEMP/readiness.env"
          local_sync_env="$RUNNER_TEMP/sync-db.env"
          remote_tmp="/tmp/fermatmind-11f-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          remote_key="$remote_tmp/service-account.json"
          remote_env="$remote_tmp/readiness.env"
          remote_sync_env="$remote_tmp/sync-db.env"
          proxy_pid=""
          tunnel_pid=""
          ssh_base=(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -o ConnectionAttempts=3 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=8 -o IdentitiesOnly=yes \
            -i "$DEPLOY_IDENTITY_FILE_STG" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST")
          cleanup() {
            if [ -n "$tunnel_pid" ]; then kill "$tunnel_pid" 2>/dev/null || true; fi
            if [ -n "$proxy_pid" ]; then kill "$proxy_pid" 2>/dev/null || true; fi
            "${ssh_base[@]}" "rm -f '$remote_key' '$remote_env' '$remote_sync_env'; rmdir '$remote_tmp' 2>/dev/null || true" \
              >/dev/null 2>&1 || true
            rm -f "$local_key" "$local_env" "$local_sync_env"
          }
          trap cleanup EXIT HUP INT TERM

          umask 077
          printf '%s' "$GSC_SERVICE_ACCOUNT_JSON" > "$local_key"
          jq -e '
            .type == "service_account"
            and (.client_email | type == "string" and length > 0)
            and (.private_key | type == "string" and length > 0)
            and .token_uri == "https://oauth2.googleapis.com/token"
          ' "$local_key" >/dev/null || fail GSC_CREDENTIAL_INVALID
          {
            printf 'SEO_INTEL_GSC_ENABLED=%q\n' "$GSC_ENABLED"
            printf 'SEO_INTEL_GSC_LIVE_API_ENABLED=%q\n' "$GSC_LIVE_API_ENABLED"
            printf 'SEO_INTEL_GSC_SYNC_ENABLED=%q\n' "$GSC_SYNC_ENABLED"
            printf 'SEO_INTEL_GSC_PROPERTY_URL=%q\n' "$GSC_PROPERTY_URL"
            printf 'SEO_INTEL_GSC_AUTH_MODE=%q\n' "$GSC_AUTH_MODE"
            printf 'SEO_INTEL_GSC_SERVICE_ACCOUNT_JSON_PATH=%q\n' "$remote_key"
            printf 'SEO_INTEL_GSC_SCOPE=%q\n' "$GSC_SCOPE"
            printf 'SEO_INTEL_GSC_SYNC_WINDOW_DAYS=%q\n' "$GSC_SYNC_WINDOW_DAYS"
            printf 'SEO_INTEL_GSC_SYNC_SEARCH_TYPES=%q\n' "$GSC_SYNC_SEARCH_TYPES"
            printf 'SEO_INTEL_ALLOW_EXTERNAL_API_CALLS=true\n'
            printf 'SEO_INTEL_WRITE_ENABLED=false\n'
          } > "$local_env"
          {
            printf 'SEO_INTEL_DB_USERNAME=%q\n' "$GSC_SYNC_DB_USERNAME"
            printf 'SEO_INTEL_DB_PASSWORD=%q\n' "$GSC_SYNC_DB_PASSWORD"
          } > "$local_sync_env"

          "${ssh_base[@]}" "umask 077; mkdir '$remote_tmp'"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o ConnectTimeout=10 -o ConnectionAttempts=3 \
            -i "$DEPLOY_IDENTITY_FILE_STG" -P "$DEPLOY_PORT" \
            "$local_key" "$local_env" "$local_sync_env" "$DEPLOY_USER@$DEPLOY_HOST:$remote_tmp/"

          node backend/scripts/seo/gsc_restricted_connect_proxy.mjs --port="$PROXY_PORT" \
            >"$RUNNER_TEMP/staging-gsc-proxy.log" 2>&1 &
          proxy_pid=$!
          for _ in {1..20}; do
            nc -z 127.0.0.1 "$PROXY_PORT" && break
            sleep 1
          done
          nc -z 127.0.0.1 "$PROXY_PORT"

          ssh -N -o BatchMode=yes -o StrictHostKeyChecking=yes -o ExitOnForwardFailure=yes \
            -o ConnectTimeout=10 -o ConnectionAttempts=3 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=8 -o IdentitiesOnly=yes \
            -i "$DEPLOY_IDENTITY_FILE_STG" -p "$DEPLOY_PORT" \
            -R "127.0.0.1:$PROXY_PORT:127.0.0.1:$PROXY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            >"$RUNNER_TEMP/staging-gsc-tunnel.log" 2>&1 &
          tunnel_pid=$!
          sleep 2
          kill -0 "$tunnel_pid"

          printf -v q_path '%q' "$DEPLOY_PATH"
          printf -v q_env '%q' "$remote_env"
          printf -v q_sync_env '%q' "$remote_sync_env"
          printf -v q_proxy '%q' "http://127.0.0.1:$PROXY_PORT"
          candidate_name="source-${DEPLOY_SHA:0:12}-${GITHUB_RUN_ID}"
          printf -v q_candidate '%q' "$candidate_name"
          printf -v q_sha '%q' "$DEPLOY_SHA"
          cache_path="/tmp/fermatmind-11f-config-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.php"
          printf -v q_cache '%q' "$cache_path"
          remote_prefix="set -euo pipefail; releases=\$(readlink -f $q_path/releases); candidate=\$(readlink -f \"\$releases/$q_candidate\"); test -n \"\$candidate\"; case \"\$candidate\" in \"\$releases\"/*) ;; *) exit 1 ;; esac; test \"\$(cat \"\$candidate/REVISION\")\" = $q_sha; cd \"\$candidate/backend\"; set -a; . $q_env; set +a; export HTTPS_PROXY=$q_proxy HTTP_PROXY=$q_proxy NO_PROXY=127.0.0.1,localhost APP_CONFIG_CACHE=$q_cache;"

          preflight_json="$RUNNER_TEMP/staging-gsc-preflight.json"
          preflight_stderr="$RUNNER_TEMP/staging-gsc-preflight.stderr"
          set +e
          "${ssh_base[@]}" "$remote_prefix php artisan seo-intel:collect --collector=gsc_foundation --gsc-live-preflight --dry-run --no-write --json --no-interaction --no-ansi" \
            > "$preflight_json" 2> "$preflight_stderr"
          preflight_exit=$?
          set -e
          if [ "$preflight_exit" -ne 0 ]; then
            if grep -Eiq 'banner exchange|connection (timed out|reset|closed)|broken pipe|kex_exchange_identification' "$preflight_stderr"; then
              fail GSC_PREFLIGHT_TRANSPORT_FAILED
            fi
            fail GSC_PREFLIGHT_COMMAND_FAILED
          fi
          jq -e '
            .status == "success"
            and .dry_run == true
            and .writes_attempted == false
            and .writes_committed == false
            and .external_calls_attempted == false
            and .metadata.live_readiness.status == "ready"
            and .metadata.live_readiness.read_only == true
            and .metadata.live_readiness.credential_valid == true
            and .metadata.live_readiness.readonly_scope_valid == true
            and .metadata.live_readiness.restricted_egress.status == "restricted"
            and .metadata.live_readiness.search_provider_submission_allowed == false
          ' "$preflight_json" >/dev/null || fail GSC_PREFLIGHT_HOLD

          sync_raw="$RUNNER_TEMP/staging-gsc-sync.raw"
          sync_json="$RUNNER_TEMP/staging-gsc-sync.json"
          sync_stderr="$RUNNER_TEMP/staging-gsc-sync.stderr"
          set +e
          "${ssh_base[@]}" "$remote_prefix set -a; . $q_sync_env; set +a; export SEO_INTEL_WRITE_ENABLED=true; php artisan seo-intel:gsc-sync --window=90 --search-types=web --full-window --trigger=manual --json --no-interaction --no-ansi" \
            > "$sync_raw" 2> "$sync_stderr"
          sync_exit=$?
          set -e
          awk 'started || /^[[:space:]]*\{/ { started=1; print }' "$sync_raw" > "$sync_json"
          if ! jq -e 'type == "object"' "$sync_json" >/dev/null 2>&1; then
            test -s "$sync_raw" || fail GSC_SYNC_OUTPUT_EMPTY
            fail GSC_SYNC_OUTPUT_INVALID
          fi
          if [ "$sync_exit" -ne 0 ]; then
            sync_issue="$(jq -r '.issue // ""' "$sync_json")"
            case "$sync_issue" in
              gsc_authentication_failed|gsc_authentication_request_failed|gsc_access_token_resolution_failed)
                fail GSC_AUTHENTICATION_FAILED
                ;;
              gsc_disconnected)
                fail GSC_SYNC_PREFLIGHT_CHANGED
                ;;
              gsc_searchanalytics_timeout_or_transport_failure)
                fail GSC_RESTRICTED_EGRESS_TRANSPORT_FAILED
                ;;
              gsc_searchanalytics_request_failed)
                fail GSC_SEARCH_ANALYTICS_REQUEST_FAILED
                ;;
              gsc_rate_limited)
                fail GSC_RATE_LIMITED
                ;;
              gsc_pagination_limit_exceeded)
                fail GSC_PAGINATION_LIMIT_EXCEEDED
                ;;
              gsc_empty_response)
                fail GSC_EMPTY_RESPONSE
                ;;
              gsc_data_quality_gate_failed)
                fail GSC_DATA_QUALITY_FAILED
                ;;
              gsc_read_model_schema_missing)
                fail GSC_SCHEMA_MISSING
                ;;
              seo_intel_write_disabled)
                fail GSC_SCOPED_WRITE_GATE_DISABLED
                ;;
              gsc_sync_internal_failure)
                fail GSC_SYNC_INTERNAL_FAILURE
                ;;
              *)
                fail GSC_SYNC_COMMAND_FAILED
                ;;
            esac
          fi
          jq -e '
            .status == "success"
            and .window_days == 90
            and .fetch_mode == "full_window"
            and .search_types == ["web"]
            and .pages_fetched > 0
            and .rows_seen > 0
            and .rows_upserted > 0
            and .mapped_rows > 0
            and .unmapped_rows == 0
            and (.excluded_non_authority_rows | type == "number" and . >= 0)
            and .duplicate_natural_keys == 0
            and .quality_gate.status == "pass"
            and (.data_max_date | type == "string" and length == 10)
            and (.data_lag_days | type == "number" and . <= 10)
            and .read_only_gsc == true
            and .search_submission_allowed == false
            and .restricted_egress.status == "restricted"
          ' "$sync_json" >/dev/null || fail GSC_SYNC_QUALITY_HOLD

          from_date="$(date -u -d '89 days ago' +%F)"
          to_date="$(date -u +%F)"
