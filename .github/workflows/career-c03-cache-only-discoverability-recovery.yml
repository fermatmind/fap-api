name: Career C03 Cache-only Discoverability Recovery

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Exact controlled phase
        required: true
        type: choice
        options:
          - incident_closeout
          - verify
          - apply
      expected_control_plane_sha:
        description: Exact latest main SHA containing this control
        required: true
        type: string
      expected_active_revision:
        description: Exact active production revision that must remain unchanged
        required: true
        type: string
      incident_closeout_run_id:
        description: Successful incident_closeout run id required by verify/apply
        required: false
        type: string
      incident_closeout_run_attempt:
        description: Successful incident_closeout run attempt required by verify/apply
        required: false
        type: string
      expected_incident_closeout_receipt_sha256:
        description: Exact incident closeout receipt SHA256
        required: false
        type: string
      expected_incident_closeout_artifact_digest:
        description: Exact incident closeout artifact digest
        required: false
        type: string
      verify_run_id:
        description: PASS_RECOVERY_REQUIRED verify run id required by apply
        required: false
        type: string
      verify_run_attempt:
        description: PASS_RECOVERY_REQUIRED verify run attempt required by apply
        required: false
        type: string
      expected_verify_receipt_sha256:
        description: Exact verify receipt SHA256 required by apply
        required: false
        type: string
      expected_verify_artifact_digest:
        description: Exact verify artifact digest required by apply
        required: false
        type: string
      operator_approval_phrase:
        description: Exact verify-receipt-bound cache-only apply phrase
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-${{ github.repository }}-production
  cancel-in-progress: false

jobs:
  control:
    name: Close or recover Career C03 without deployment
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      MODE: ${{ inputs.mode }}
      CONTROL_PLANE_SHA: ${{ inputs.expected_control_plane_sha }}
      EXPECTED_ACTIVE_REVISION: ${{ inputs.expected_active_revision }}
      INCIDENT_CLOSEOUT_RUN_ID: ${{ inputs.incident_closeout_run_id }}
      INCIDENT_CLOSEOUT_RUN_ATTEMPT: ${{ inputs.incident_closeout_run_attempt }}
      EXPECTED_INCIDENT_CLOSEOUT_RECEIPT_SHA256: ${{ inputs.expected_incident_closeout_receipt_sha256 }}
      EXPECTED_INCIDENT_CLOSEOUT_ARTIFACT_DIGEST: ${{ inputs.expected_incident_closeout_artifact_digest }}
      VERIFY_RUN_ID: ${{ inputs.verify_run_id }}
      VERIFY_RUN_ATTEMPT: ${{ inputs.verify_run_attempt }}
      EXPECTED_VERIFY_RECEIPT_SHA256: ${{ inputs.expected_verify_receipt_sha256 }}
      EXPECTED_VERIFY_ARTIFACT_DIGEST: ${{ inputs.expected_verify_artifact_digest }}
      OPERATOR_APPROVAL_PHRASE: ${{ inputs.operator_approval_phrase }}
      DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
      DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
      RETIRED_DEPLOY_HOST: ${{ secrets.PRODUCTION_RETIRED_DEPLOY_HOST }}
      DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
      FAILED_DEPLOY_RUN_ID: '31373985399'
      FAILED_DEPLOY_RUN_ATTEMPT: '1'
      FAILED_DEPLOY_SHA: '8e352dc727e131101f741be99a0a69f4178a7329'
      FAILED_TIMING_ARTIFACT_DIGEST: 'sha256:f0a85f1a6bd41fbd950e1384826a2f423e2d528430d312b9e825cde06797a704'
      FAILED_TIMING_RECEIPT_SHA256: '44951ee59449d0efeeebd179486b6e2db2d05ff265d547105131a6d39e1bf4ec'
      FAILED_PROGRESS_ARTIFACT_DIGEST: 'sha256:ab84f3c2cc2330ba26ca72ffa2f16c07938d4a34ffaa4c943e8f662a93c055c2'
      FAILED_PROGRESS_RECEIPT_SHA256: '993980a3cd345dfc4315f075b78cf7f029bd5c9113b9cc1be0ef5d36bc4bee33'
      FAILED_INCIDENT_ARTIFACT_DIGEST: 'sha256:5326960d5670519d831889688a91d13c1c3f1b937bdcc513618265c4899d7f2b'
      FAILED_INCIDENT_RECEIPT_SHA256: 'c2659ace415f9bc91b8052f63c8224d6cc9e43bfde7696287aa288d69dfc0613'
      C02_REPAIR_RUN_ID: '31372257233'
      C02_REPAIR_RUN_ATTEMPT: '1'
      C02_REPAIR_ARTIFACT_DIGEST: 'sha256:ba1be4f6862851752b1bbfd6a535c7c1ef589e90658d9043f372174fd17ea6eb'
      C02_REPAIR_RECEIPT_SHA256: 'f1a30b3c83c8d3f11b83e4b8056074bf724e1f6d37646f93750567b0a60b4cc1'
      AUTHORITY_PROJECTION_SHA256: '397f2a4ec284e9c0a6cd610447541ad4773fa7a7f3045008fab5efb334ec85c6'

    steps:
      - name: Initialize failure-safe receipt
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/career-c03-cache-only-discoverability-recovery.json"
          printf 'RECEIPT=%s\n' "$receipt" >> "$GITHUB_ENV"
          jq -n \
            --arg mode "$MODE" \
            --arg control "$CONTROL_PLANE_SHA" \
            --arg active "$EXPECTED_ACTIVE_REVISION" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" \
            '{
              contract_version: "career.c03.cache_only_discoverability_recovery.v1",
              mode: $mode,
              status: "HOLD_CONTROL_INCOMPLETE",
              control_plane_sha: $control,
              active_revision: $active,
              workflow_run_id: ($run_id | tonumber),
              workflow_run_attempt: ($attempt | tonumber),
              cache_write_count: 0,
              database_write_count: 0,
              publication_write_count: 0,
              indexability_write_count: 0,
              deploy_count: 0,
              migration_count: 0,
              symlink_write_count: 0,
              process_restart_count: 0,
              queue_reload_count: 0,
              sitemap_submission_count: 0,
              llms_submission_count: 0,
              search_submission_count: 0,
              career_link_publication_gate: "CLOSED",
              automatic_retry_allowed: false
            }' > "$receipt"

      - name: Checkout exact control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.expected_control_plane_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate latest main and immutable runner
        shell: bash
        run: |
          set -euo pipefail
          runner='backend/scripts/operations/career_c03_cache_only_discoverability_control.php'
          public_readback_runner='backend/scripts/operations/career_c03_bounded_public_readback.sh'
          test "$GITHUB_REF" = refs/heads/main
          [[ "$CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_ACTIVE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$CONTROL_PLANE_SHA"
          test "$(git rev-parse origin/main)" = "$CONTROL_PLANE_SHA"
          git cat-file -e "${EXPECTED_ACTIVE_REVISION}^{commit}"
          git merge-base --is-ancestor "$EXPECTED_ACTIVE_REVISION" "$CONTROL_PLANE_SHA"
          test -f "$runner"
          test ! -L "$runner"
          php -l "$runner" >/dev/null
          test -f "$public_readback_runner"
          test ! -L "$public_readback_runner"
          bash -n "$public_readback_runner"
          {
            printf 'RUNNER=%s\n' "$runner"
            printf 'RUNNER_SHA256=%s\n' "$(sha256sum "$runner" | awk '{print $1}')"
            printf 'PUBLIC_READBACK_RUNNER=%s\n' "$public_readback_runner"
            printf 'PUBLIC_READBACK_RUNNER_SHA256=%s\n' "$(sha256sum "$public_readback_runner" | awk '{print $1}')"
          } >> "$GITHUB_ENV"

      - name: Validate protected production topology
        shell: bash
        run: |
          set -euo pipefail
          for name in DEPLOY_USER DEPLOY_PORT DEPLOY_HOST RETIRED_DEPLOY_HOST DEPLOY_PATH; do
            test -n "${!name:-}"
          done
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          test "$DEPLOY_PORT" -ge 1
          test "$DEPLOY_PORT" -le 65535
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$RETIRED_DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          test "$DEPLOY_HOST" != "$RETIRED_DEPLOY_HOST"
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_PATH" != *'/../'* ]]

      - name: Validate mode-specific input boundary
        shell: bash
        run: |
          set -euo pipefail
          numeric='^[1-9][0-9]*$'
          sha='^[0-9a-f]{64}$'
          digest='^sha256:[0-9a-f]{64}$'
          case "$MODE" in
            incident_closeout)
              test -z "$INCIDENT_CLOSEOUT_RUN_ID$INCIDENT_CLOSEOUT_RUN_ATTEMPT$VERIFY_RUN_ID$VERIFY_RUN_ATTEMPT"
              test -z "$EXPECTED_INCIDENT_CLOSEOUT_RECEIPT_SHA256$EXPECTED_INCIDENT_CLOSEOUT_ARTIFACT_DIGEST"
              test -z "$EXPECTED_VERIFY_RECEIPT_SHA256$EXPECTED_VERIFY_ARTIFACT_DIGEST$OPERATOR_APPROVAL_PHRASE"
              ;;
            verify)
              [[ "$INCIDENT_CLOSEOUT_RUN_ID" =~ $numeric ]]
              [[ "$INCIDENT_CLOSEOUT_RUN_ATTEMPT" =~ $numeric ]]
              [[ "$EXPECTED_INCIDENT_CLOSEOUT_RECEIPT_SHA256" =~ $sha ]]
              [[ "$EXPECTED_INCIDENT_CLOSEOUT_ARTIFACT_DIGEST" =~ $digest ]]
              test -z "$VERIFY_RUN_ID$VERIFY_RUN_ATTEMPT$EXPECTED_VERIFY_RECEIPT_SHA256$EXPECTED_VERIFY_ARTIFACT_DIGEST$OPERATOR_APPROVAL_PHRASE"
              ;;
            apply)
              [[ "$INCIDENT_CLOSEOUT_RUN_ID" =~ $numeric ]]
              [[ "$INCIDENT_CLOSEOUT_RUN_ATTEMPT" =~ $numeric ]]
              [[ "$EXPECTED_INCIDENT_CLOSEOUT_RECEIPT_SHA256" =~ $sha ]]
              [[ "$EXPECTED_INCIDENT_CLOSEOUT_ARTIFACT_DIGEST" =~ $digest ]]
              [[ "$VERIFY_RUN_ID" =~ $numeric ]]
              [[ "$VERIFY_RUN_ATTEMPT" =~ $numeric ]]
              [[ "$EXPECTED_VERIFY_RECEIPT_SHA256" =~ $sha ]]
              [[ "$EXPECTED_VERIFY_ARTIFACT_DIGEST" =~ $digest ]]
              test -n "$OPERATOR_APPROVAL_PHRASE"
              ;;
            *) exit 2 ;;
          esac

      - name: Set up SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known hosts
        shell: bash
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null \
            || ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f ~/.ssh/known_hosts >/dev/null

      - name: Validate C02 repair and failed deploy evidence
        if: inputs.mode == 'incident_closeout'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/incident-evidence"
          mkdir -p "$evidence"

          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_DEPLOY_RUN_ID}")"
          jq -e --arg sha "$FAILED_DEPLOY_SHA" --argjson attempt "$FAILED_DEPLOY_RUN_ATTEMPT" '
            .name == "Deploy API Production"
            and .path == ".github/workflows/deploy-production.yml"
            and .event == "workflow_dispatch"
            and .head_branch == "main"
            and .head_sha == $sha
            and .status == "completed"
            and .conclusion == "failure"
            and .run_attempt == $attempt' <<<"$run_json" >/dev/null

          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_DEPLOY_RUN_ID}/artifacts?per_page=100")"
          for pair in \
            "deployer-task-timing-production|$FAILED_TIMING_ARTIFACT_DIGEST" \
            "backend-production-deploy-progress-${FAILED_DEPLOY_RUN_ID}-${FAILED_DEPLOY_RUN_ATTEMPT}|$FAILED_PROGRESS_ARTIFACT_DIGEST" \
            "backend-production-incident-diagnostic-${FAILED_DEPLOY_RUN_ID}-${FAILED_DEPLOY_RUN_ATTEMPT}|$FAILED_INCIDENT_ARTIFACT_DIGEST"; do
            name="${pair%%|*}"
            digest="${pair#*|}"
            jq -e --arg name "$name" --arg digest "$digest" \
              '[.artifacts[] | select(.name == $name)] | length == 1 and .[0].expired == false and .[0].digest == $digest' \
              <<<"$artifacts" >/dev/null
            gh run download "$FAILED_DEPLOY_RUN_ID" --name "$name" --dir "$evidence/$name"
          done

          timing="$evidence/deployer-task-timing-production/deployer-task-timing.json"
          progress="$evidence/backend-production-deploy-progress-${FAILED_DEPLOY_RUN_ID}-${FAILED_DEPLOY_RUN_ATTEMPT}/deployer-progress.json"
          incident="$evidence/backend-production-incident-diagnostic-${FAILED_DEPLOY_RUN_ID}-${FAILED_DEPLOY_RUN_ATTEMPT}/backend-production-incident-diagnostic.json"
          test "$(sha256sum "$timing" | awk '{print $1}')" = "$FAILED_TIMING_RECEIPT_SHA256"
          test "$(sha256sum "$progress" | awk '{print $1}')" = "$FAILED_PROGRESS_RECEIPT_SHA256"
          test "$(sha256sum "$incident" | awk '{print $1}')" = "$FAILED_INCIDENT_RECEIPT_SHA256"
          jq -e '.status == "failed" and .sha == env.FAILED_DEPLOY_SHA' "$progress" >/dev/null
          jq -e '
            def task($name):
              ([.tasks[] | select(.task == $name)] | length == 1)
              and ([.tasks[] | select(.task == $name)][0].result == "success");
            task("artisan:migrate")
            and task("career:repair-published-detail-cache-coverage")
            and task("guard:career-detail-cache-coverage")
            and task("career:rebuild-directory-after-detail-repair")
            and task("guard:career-discoverability-pre-sitemap")
            and task("guard:career-discoverability-post-sitemap")
            and ([.tasks[] | select(.task == "guard:public-dns-health")] | length == 1 and .[0].result == "failure")
            and ([.tasks[] | select(.task == "deploy:symlink")] | length == 1 and .[0].result == "skipped")
            and ([.tasks[] | select(.task == "reload:php-fpm")] | length == 1 and .[0].result == "skipped")
            and ([.tasks[] | select(.task == "reload:nginx")] | length == 1 and .[0].result == "skipped")
            and ([.tasks[] | select(.task == "queue:reload-workers")] | length == 1 and .[0].result == "skipped")' "$timing" >/dev/null
          jq -e '
            .status == "hold_no_retry"
            and .deploy_attempted == false
            and .cms_or_db_write_count == 0
            and .queue_or_cache_operation_attempted == false
            and .publication_or_seo_mutation_attempted == false' "$incident" >/dev/null

          c02_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${C02_REPAIR_RUN_ID}")"
          jq -e --arg sha "$FAILED_DEPLOY_SHA" --argjson attempt "$C02_REPAIR_RUN_ATTEMPT" '
            .name == "Career Runtime Authority Permission Repair"
            and .head_sha == $sha
            and .status == "completed"
            and .conclusion == "success"
            and .run_attempt == $attempt' <<<"$c02_run" >/dev/null
          c02_name="career-runtime-authority-permission-repair-${C02_REPAIR_RUN_ID}-${C02_REPAIR_RUN_ATTEMPT}"
          c02_artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${C02_REPAIR_RUN_ID}/artifacts?per_page=100")"
          jq -e --arg name "$c02_name" --arg digest "$C02_REPAIR_ARTIFACT_DIGEST" \
            '[.artifacts[] | select(.name == $name)] | length == 1 and .[0].expired == false and .[0].digest == $digest' \
            <<<"$c02_artifacts" >/dev/null
          gh run download "$C02_REPAIR_RUN_ID" --name "$c02_name" --dir "$evidence/$c02_name"
          c02="$evidence/$c02_name/career-runtime-authority-permission-repair.json"
          test "$(sha256sum "$c02" | awk '{print $1}')" = "$C02_REPAIR_RECEIPT_SHA256"
          jq -e --arg projection "$AUTHORITY_PROJECTION_SHA256" '
            .status == "PASS_PERMISSION_REPAIR_VERIFIED"
            and .projection_sha256 == $projection
            and .runtime_readable == true
            and .bytes_unchanged == true
            and .database_write_count == 0
            and .cache_write_count == 0
            and .deploy_count == 0' "$c02" >/dev/null

      - name: Validate incident closeout lineage
        if: inputs.mode == 'verify' || inputs.mode == 'apply'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${INCIDENT_CLOSEOUT_RUN_ID}")"
          jq -e --arg sha "$CONTROL_PLANE_SHA" --argjson attempt "$INCIDENT_CLOSEOUT_RUN_ATTEMPT" '
            .name == "Career C03 Cache-only Discoverability Recovery"
            and .path == ".github/workflows/career-c03-cache-only-discoverability-recovery.yml"
            and .event == "workflow_dispatch"
            and .head_branch == "main"
            and .head_sha == $sha
            and .status == "completed"
            and .conclusion == "success"
            and .run_attempt == $attempt' <<<"$run_json" >/dev/null
          name="career-c03-incident_closeout-${INCIDENT_CLOSEOUT_RUN_ID}-${INCIDENT_CLOSEOUT_RUN_ATTEMPT}"
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${INCIDENT_CLOSEOUT_RUN_ID}/artifacts?per_page=100")"
          jq -e --arg name "$name" --arg digest "$EXPECTED_INCIDENT_CLOSEOUT_ARTIFACT_DIGEST" \
            '[.artifacts[] | select(.name == $name)] | length == 1 and .[0].expired == false and .[0].digest == $digest' \
            <<<"$artifacts" >/dev/null
          dir="$RUNNER_TEMP/incident-closeout-lineage"
          gh run download "$INCIDENT_CLOSEOUT_RUN_ID" --name "$name" --dir "$dir"
          receipt="$dir/career-c03-cache-only-discoverability-recovery.json"
          test "$(sha256sum "$receipt" | awk '{print $1}')" = "$EXPECTED_INCIDENT_CLOSEOUT_RECEIPT_SHA256"
          jq -e \
            --arg control "$CONTROL_PLANE_SHA" \
            --arg active "$EXPECTED_ACTIVE_REVISION" \
            --arg authority "$AUTHORITY_PROJECTION_SHA256" \
            --arg readback_runner "$PUBLIC_READBACK_RUNNER_SHA256" \
            --argjson run_id "$INCIDENT_CLOSEOUT_RUN_ID" \
            --argjson attempt "$INCIDENT_CLOSEOUT_RUN_ATTEMPT" '
            .status == "PASS_INCIDENT_CLOSED"
            and .control_plane_sha == $control
            and .active_revision == $active
            and .authority_artifact_sha256 == $authority
            and .public_readback_runner_sha256 == $readback_runner
            and .workflow_run_id == $run_id
            and .workflow_run_attempt == $attempt
            and .failed_deploy_run_id == 31373985399
            and .old_incident_artifact_superseded == true
            and .career_link_publication_gate == "CLOSED"' "$receipt" >/dev/null
          cp "$receipt" "$RUNNER_TEMP/validated-incident-closeout.json"

      - name: Validate verify lineage and exact approval
        if: inputs.mode == 'apply'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$VERIFY_RUN_ID" -gt "$INCIDENT_CLOSEOUT_RUN_ID"
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${VERIFY_RUN_ID}")"
          jq -e --arg sha "$CONTROL_PLANE_SHA" --argjson attempt "$VERIFY_RUN_ATTEMPT" '
            .name == "Career C03 Cache-only Discoverability Recovery"
            and .path == ".github/workflows/career-c03-cache-only-discoverability-recovery.yml"
            and .head_sha == $sha
            and .status == "completed"
            and .conclusion == "success"
            and .run_attempt == $attempt' <<<"$run_json" >/dev/null
          name="career-c03-verify-${VERIFY_RUN_ID}-${VERIFY_RUN_ATTEMPT}"
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${VERIFY_RUN_ID}/artifacts?per_page=100")"
          jq -e --arg name "$name" --arg digest "$EXPECTED_VERIFY_ARTIFACT_DIGEST" \
            '[.artifacts[] | select(.name == $name)] | length == 1 and .[0].expired == false and .[0].digest == $digest' \
            <<<"$artifacts" >/dev/null
          dir="$RUNNER_TEMP/verify-lineage"
          gh run download "$VERIFY_RUN_ID" --name "$name" --dir "$dir"
          verify="$dir/career-c03-cache-only-discoverability-recovery.json"
          test "$(sha256sum "$verify" | awk '{print $1}')" = "$EXPECTED_VERIFY_RECEIPT_SHA256"
          jq -e \
            --arg control "$CONTROL_PLANE_SHA" \
            --arg active "$EXPECTED_ACTIVE_REVISION" \
            --arg incident_sha "$EXPECTED_INCIDENT_CLOSEOUT_RECEIPT_SHA256" \
            --arg readback_runner "$PUBLIC_READBACK_RUNNER_SHA256" \
            --argjson run_id "$VERIFY_RUN_ID" \
            --argjson attempt "$VERIFY_RUN_ATTEMPT" '
            .status == "PASS_RECOVERY_REQUIRED"
            and .control_plane_sha == $control
            and .active_revision == $active
            and .incident_closeout_receipt_sha256 == $incident_sha
            and .public_readback_runner_sha256 == $readback_runner
            and .workflow_run_id == $run_id
            and .workflow_run_attempt == $attempt
            and .detail_repair_target_count <= 250
            and .job_index_converged == true
            and .career_link_publication_gate == "CLOSED"' "$verify" >/dev/null
          expected_phrase="$(jq -r '.expected_apply_approval_phrase' "$verify")"
          test -n "$expected_phrase"
          test "$OPERATOR_APPROVAL_PHRASE" = "$expected_phrase"
          cp "$verify" "$RUNNER_TEMP/validated-verify.json"

      - name: Inspect active Career authority and derived caches
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          printf -v q_deploy_path '%q' "$DEPLOY_PATH"
          printf -v q_active '%q' "$EXPECTED_ACTIVE_REVISION"
          printf -v q_authority '%q' "$AUTHORITY_PROJECTION_SHA256"
          set +e
          result="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -euo pipefail; current=\$(readlink -f $q_deploy_path/current); test -f \"\$current/REVISION\"; test \"\$(tr -d '\\r\\n' < \"\$current/REVISION\")\" = $q_active; test ! -e $q_deploy_path/.dep/deploy.lock; test \"\$(ps -eo comm=,args= | awk '\$1 == \"php\" && (\$0 ~ /dep(\\.phar)? .* production/ || \$0 ~ /artisan migrate/) {n++} END {print n+0}')\" = 0; CAREER_C03_BACKEND_ROOT=\"\$current/backend\" CAREER_C03_EXPECTED_AUTHORITY_SHA256=$q_authority php /dev/stdin inspect" \
            < "$RUNNER")"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] || ! jq -e \
            --arg authority "$AUTHORITY_PROJECTION_SHA256" '
              .contract_version == "career.c03.cache_only_discoverability_control.v1"
              and .mode == "inspect"
              and .status == "PASS_AUTHORITY_READABLE"
              and .authority_artifact_sha256 == $authority
              and .authority_inventory.unique_slug_count > 0
              and .authority_inventory.locale_row_count == (.authority_inventory.unique_slug_count * 2)
              and .authority.slug_count > 0
              and .authority.row_count == (.authority.slug_count * 2)
              and .database_write_count == 0
              and .cache_write_count == 0
              and .deploy_count == 0
              and .migration_count == 0' <<<"$result" >/dev/null 2>&1; then
            echo 'CAREER_C03_REMOTE_INSPECTION_FAILED' >&2
            exit 1
          fi
          printf '%s' "$result" > "$RUNNER_TEMP/career-c03-inspection.json"

      - name: Capture bounded public readback
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/career-c03-public"
          mkdir -p "$dir"
          safe_empty() {
            local kind="$1" output="$2"
            case "$kind" in
              collection) printf '%s' '{"items":[]}' > "$output" ;;
              sitemap_source) printf '%s' '{"ok":true,"source":"backend_sitemap_generator","items":[]}' > "$output" ;;
              text) : > "$output" ;;
              *) return 2 ;;
            esac
          }
          fetch() {
            local id="$1" kind="$2" url="$3" output="$4"
            local metadata rc http retries elapsed elapsed_ms
            set +e
            metadata="$(curl --http1.1 --proto '=https' --request GET --max-redirs 0 \
              -fsS --retry 2 --retry-delay 2 --retry-all-errors \
              --connect-timeout 10 --max-time 60 -H 'Cache-Control: no-cache' \
              --output "$output" --write-out $'%{http_code}\t%{num_retries}\t%{time_total}' "$url" \
              2>"$dir/$id.stderr")"
            rc=$?
            set -e
            rm -f "$dir/$id.stderr"
            IFS=$'\t' read -r http retries elapsed <<<"$metadata"
            if [[ ! "${http:-}" =~ ^[0-9]{3}$ ]] || [[ ! "${retries:-}" =~ ^[0-2]$ ]] \
              || [[ ! "${elapsed:-}" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
              http=000
              retries=0
              elapsed=0
              rc=99
            fi
            elapsed_ms="$(awk -v seconds="$elapsed" 'BEGIN {printf "%d", (seconds * 1000) + 0.5}')"
            if [ "$rc" -ne 0 ] || [ "$http" != 200 ]; then
              safe_empty "$kind" "$output"
            fi
            printf '%s\t%s\t%s\t%s\t%s\n' "$id" "$http" "$rc" "$retries" "$elapsed_ms" \
              > "$dir/status-$id.tsv"
          }
          fetch jobs_en collection 'https://api.fermatmind.com/api/v0.5/career/jobs?locale=en' "$dir/jobs-en.json" &
          first=$!
          fetch jobs_zh collection 'https://api.fermatmind.com/api/v0.5/career/jobs?locale=zh-CN' "$dir/jobs-zh.json" &
          second=$!
          wait "$first"; wait "$second"
          fetch directory_en collection 'https://api.fermatmind.com/api/v0.5/career/directory?locale=en' "$dir/directory-en.json" &
          first=$!
          fetch directory_zh collection 'https://api.fermatmind.com/api/v0.5/career/directory?locale=zh-CN' "$dir/directory-zh.json" &
          second=$!
          wait "$first"; wait "$second"
          fetch sitemap_source sitemap_source 'https://api.fermatmind.com/api/v0.5/seo/sitemap-source' "$dir/sitemap-source.json" &
          first=$!
          fetch sitemap text 'https://fermatmind.com/sitemap.xml' "$dir/sitemap.xml" &
          second=$!
          wait "$first"; wait "$second"
          fetch llms text 'https://fermatmind.com/llms.txt' "$dir/llms.txt" &
          first=$!
          fetch llms_full text 'https://fermatmind.com/llms-full.txt' "$dir/llms-full.txt" &
          second=$!
          wait "$first"; wait "$second"
          : > "$dir/shared-surface-status.tsv"
          for id in jobs_en jobs_zh directory_en directory_zh sitemap_source sitemap llms llms_full; do
            test -f "$dir/status-$id.tsv"
            while IFS= read -r line; do
              printf '%s\n' "$line" >> "$dir/shared-surface-status.tsv"
            done < "$dir/status-$id.tsv"
          done

          bash "$PUBLIC_READBACK_RUNNER" \
            "$RUNNER_TEMP/career-c03-inspection.json" "$dir/detail-status.tsv"

          set +e
          php "$RUNNER" public-verify \
            "$RUNNER_TEMP/career-c03-inspection.json" \
            "$dir/jobs-en.json" "$dir/jobs-zh.json" \
            "$dir/directory-en.json" "$dir/directory-zh.json" \
            "$dir/sitemap-source.json" "$dir/sitemap.xml" \
            "$dir/llms.txt" "$dir/llms-full.txt" "$dir/detail-status.tsv" \
            "$dir/shared-surface-status.tsv" \
            > "$RUNNER_TEMP/career-c03-public-verification.json"
          verify_rc=$?
          set -e
          jq -e 'type == "object"' "$RUNNER_TEMP/career-c03-public-verification.json" >/dev/null
          public_failure_code="$(jq -r '
            if .shared_surface_readback.incomplete_transfer_count > 0 then "PUBLIC_SHARED_TRANSPORT_INCOMPLETE"
            elif .shared_surface_readback.timeout_count > 0 then "PUBLIC_SHARED_TRANSPORT_TIMEOUT"
            elif .shared_surface_readback.other_transport_failure_count > 0 then "PUBLIC_SHARED_TRANSPORT_OTHER"
            elif .shared_surface_readback.server_error_count > 0 then "PUBLIC_SHARED_HTTP_5XX"
            elif .shared_surface_readback.non_200_count > 0 then "PUBLIC_SHARED_HTTP_NON_200"
            elif .detail_readback.incomplete_transfer_count > 0 then "PUBLIC_TRANSPORT_INCOMPLETE"
            elif .detail_readback.timeout_count > 0 then "PUBLIC_TRANSPORT_TIMEOUT"
            elif .detail_readback.other_transport_failure_count > 0 then "PUBLIC_TRANSPORT_OTHER"
            elif .detail_readback.server_error_count > 0 then "PUBLIC_HTTP_5XX"
            elif .detail_readback.non_200_count > 0 then "PUBLIC_HTTP_NON_200"
            elif .private_path_leak_count > 0 then "PUBLIC_PRIVATE_PATH_LEAK"
            elif (.surface_mismatches | length) > 0 then "PUBLIC_SET_DRIFT"
            else "PUBLIC_READBACK_UNKNOWN"
            end
          ' "$RUNNER_TEMP/career-c03-public-verification.json")"
          printf 'PUBLIC_VERIFY_RC=%s\n' "$verify_rc" >> "$GITHUB_ENV"
          printf 'PUBLIC_FAILURE_CODE=%s\n' "$public_failure_code" >> "$GITHUB_ENV"

      - name: Write corrected incident closeout receipt
        if: inputs.mode == 'incident_closeout'
        shell: bash
