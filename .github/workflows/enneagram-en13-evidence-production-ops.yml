name: Enneagram EN13 Evidence Production Ops

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact deployed fap-api SHA (40 lowercase hex)
        required: true
        type: string
      operation_mode:
        description: Read-only dry-run or exact-cohort evidence refresh
        required: true
        type: choice
        options: [dry_run, write]
      cohort_sha256:
        description: Exact successful dry-run cohort SHA256; required for write
        required: false
        default: ""
        type: string
      operator_approval_phrase:
        description: Exact SHA- and cohort-bound operator phrase
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: enneagram-en13-evidence-production-ops
  cancel-in-progress: false

jobs:
  refresh:
    name: Validate or refresh exact 26-page EN13 evidence cohort
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    env:
      DEPLOY_USER: ${{ vars.PRODUCTION_DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.PRODUCTION_DEPLOY_PORT }}
      DEPLOY_HOST: ${{ vars.PRODUCTION_DEPLOY_HOST }}
      RETIRED_DEPLOY_HOST: ${{ vars.PRODUCTION_RETIRED_DEPLOY_HOST }}
      DEPLOY_PATH: ${{ vars.PRODUCTION_DEPLOY_PATH }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      OPERATION_MODE: ${{ inputs.operation_mode }}
      COHORT_SHA256: ${{ inputs.cohort_sha256 }}
      OPERATOR_APPROVAL_PHRASE: ${{ inputs.operator_approval_phrase }}
      EN_PACKAGE: docs/seo/personality/enneagram/content-packages/en13-cms-v1/enneagram-en13-cms-package-v1.json
      EN_LEDGER: docs/seo/personality/enneagram/content-packages/en13-cms-v1/source-ledger.json
      ZH_PACKAGE: docs/seo/personality/enneagram/content-packages/zh13-cms-v1/enneagram-zh13-cms-package-v1.json
      ZH_LEDGER: docs/seo/personality/enneagram/content-packages/zh13-cms-v1/source-ledger.json

    steps:
      - name: Validate exact operation approval
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          case "$OPERATION_MODE" in
            dry_run)
              test -z "$COHORT_SHA256"
              expected="Approve ENNEAGRAM EN13 evidence refresh dry-run for SHA ${RELEASE_SHA}"
              ;;
            write)
              [[ "$COHORT_SHA256" =~ ^[0-9a-f]{64}$ ]]
              expected="I explicitly approve ENNEAGRAM EN13 evidence refresh for SHA ${RELEASE_SHA} cohort ${COHORT_SHA256}."
              ;;
            *) exit 2 ;;
          esac
          test "$OPERATOR_APPROVAL_PHRASE" = "$expected"

      - name: Checkout authorized revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Validate revision and package inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          for path in "$EN_PACKAGE" "$EN_LEDGER" "$ZH_PACKAGE" "$ZH_LEDGER"; do
            test -r "$path"
            jq -e . "$path" >/dev/null
          done

      - name: Validate protected production topology
        shell: bash
        run: |
          set -euo pipefail
          for name in DEPLOY_USER DEPLOY_PORT DEPLOY_HOST RETIRED_DEPLOY_HOST DEPLOY_PATH; do test -n "${!name:-}"; done
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_PATH" != *".."* ]]
          test "$DEPLOY_HOST" != "$RETIRED_DEPLOY_HOST"

      - name: Set up SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known hosts
        shell: bash
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null \
            || ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f ~/.ssh/known_hosts >/dev/null

      - name: Run mandatory dry-run then optional bounded refresh
        id: refresh
        shell: bash
        run: |
          set -uo pipefail
          target="$DEPLOY_USER@$DEPLOY_HOST"
          for value in DEPLOY_PATH RELEASE_SHA OPERATION_MODE COHORT_SHA256 EN_PACKAGE EN_LEDGER ZH_PACKAGE ZH_LEDGER; do
            printf -v "q_${value,,}" '%q' "${!value}"
          done
          set +e
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -p "$DEPLOY_PORT" "$target" \
            "DEPLOY_PATH=$q_deploy_path RELEASE_SHA=$q_release_sha OPERATION_MODE=$q_operation_mode COHORT_SHA256=$q_cohort_sha256 EN_PACKAGE=$q_en_package EN_LEDGER=$q_en_ledger ZH_PACKAGE=$q_zh_package ZH_LEDGER=$q_zh_ledger bash -s" <<'REMOTE' > summary.json
          set -Eeuo pipefail
          stage="bootstrap"
          tmp_dir="$(mktemp -d /tmp/en13-evidence-refresh.XXXXXX)"
          dry_run_summary=null
          write_summary=null
          readback_summary=null
          emit_summary() {
            rc=$?
            trap - EXIT
            status=failure
            failed_stage="$stage"
            if [ "$rc" -eq 0 ]; then
              status=success
              failed_stage=""
            fi
            jq -n \
              --arg schema_version "enneagram-en13-evidence-production-ops.v1" \
              --arg status "$status" \
              --arg release_sha "$RELEASE_SHA" \
              --arg operation_mode "$OPERATION_MODE" \
              --arg cohort_sha256 "${actual_cohort:-}" \
              --arg failed_stage "$failed_stage" \
              --argjson dry_run "$dry_run_summary" \
              --argjson write "$write_summary" \
              --argjson readback "$readback_summary" \
              '{schema_version:$schema_version,status:$status,release_sha:$release_sha,operation_mode:$operation_mode,cohort_sha256:$cohort_sha256,failed_stage:(if $failed_stage == "" then null else $failed_stage end),dry_run:$dry_run,write:$write,readback:$readback}'
            rm -rf "$tmp_dir"
            exit "$rc"
          }
          trap emit_summary EXIT
          cd "$DEPLOY_PATH/current"
          stage="deployed_revision"
          deployed_sha="$(tr -d '\r\n' < REVISION)"
          test "$deployed_sha" = "$RELEASE_SHA"
          cd backend
          run_refresh() {
            local write_mode="$1"
            local confirmed_cohort="${2:-}"
            local operator_token="${3:-}"
            ENNEAGRAM_EN13_EVIDENCE_WRITE_ENABLED="${ENNEAGRAM_EN13_EVIDENCE_WRITE_ENABLED:-false}" \
              WRITE_MODE="$write_mode" CONFIRMED_COHORT="$confirmed_cohort" OPERATOR_TOKEN="$operator_token" \
              EN_PATH="../$EN_PACKAGE" EN_LEDGER_PATH="../$EN_LEDGER" ZH_PATH="../$ZH_PACKAGE" ZH_LEDGER_PATH="../$ZH_LEDGER" \
              RELEASE_SHA="$RELEASE_SHA" php -r '
                require "vendor/autoload.php";
                $app = require "bootstrap/app.php";
                $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
                $read = static fn (string $path): array => (array) json_decode((string) file_get_contents($path), true, 512, JSON_THROW_ON_ERROR);
                $paths = ["en" => getenv("EN_PATH"), "zh-CN" => getenv("ZH_PATH")];
                $ledgerPaths = ["en" => getenv("EN_LEDGER_PATH"), "zh-CN" => getenv("ZH_LEDGER_PATH")];
                $packages = $ledgers = $hashes = [];
                foreach ($paths as $locale => $path) {
                    $raw = (string) file_get_contents($path);
                    $packages[$locale] = (array) json_decode($raw, true, 512, JSON_THROW_ON_ERROR);
                    $ledgers[$locale] = $read($ledgerPaths[$locale]);
                    $hashes[$locale] = hash("sha256", $raw);
                }
                $writer = app(App\Services\Cms\EnneagramCmsDraftWriter::class);
                $result = getenv("WRITE_MODE") === "write"
                    ? $writer->writeEvidenceRefresh($packages, $ledgers, $hashes, getenv("RELEASE_SHA") ?: "", getenv("CONFIRMED_COHORT") ?: "", getenv("OPERATOR_TOKEN") ?: "", getenv("ENNEAGRAM_EN13_EVIDENCE_WRITE_ENABLED") === "true")
                    : $writer->planEvidenceRefresh($packages, $ledgers, $hashes, getenv("RELEASE_SHA") ?: "");
                echo json_encode($result, JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE | JSON_THROW_ON_ERROR), PHP_EOL;
              '
          }
          stage="dry_run_execution"
          run_refresh dry_run > "$tmp_dir/dry-run.json"
          dry_run_summary="$(jq -c '{ok,status,target_count,already_current_count,updated_count,issue_count:(.issues|length),negative_guarantees}' "$tmp_dir/dry-run.json")"
          stage="dry_run_validation"
          jq -e '.ok == true and (.status == "dry_run_ready" or .status == "already_refreshed") and .target_count == 26 and (.issues | length) == 0' "$tmp_dir/dry-run.json" >/dev/null
          actual_cohort="$(jq -r '.cohort_sha256' "$tmp_dir/dry-run.json")"
          if [ "$OPERATION_MODE" = write ]; then
            stage="cohort_validation"
            test "$actual_cohort" = "$COHORT_SHA256"
            token="ENNEAGRAM-EN13-EVIDENCE-CMS-REFRESH-01:${RELEASE_SHA}:${COHORT_SHA256}"
            stage="write_execution"
            ENNEAGRAM_EN13_EVIDENCE_WRITE_ENABLED=true run_refresh write "$COHORT_SHA256" "$token" > "$tmp_dir/write.json"
            write_summary="$(jq -c '{ok,status,target_count,already_current_count,updated_count,issue_count:(.issues|length),negative_guarantees}' "$tmp_dir/write.json")"
            stage="write_validation"
            jq -e '.ok == true and (.status == "refreshed" or .status == "already_refreshed") and .target_count == 26 and (.issues | length) == 0' "$tmp_dir/write.json" >/dev/null
            stage="readback_execution"
            run_refresh dry_run > "$tmp_dir/readback.json"
            readback_summary="$(jq -c '{ok,status,target_count,already_current_count,updated_count,issue_count:(.issues|length),negative_guarantees}' "$tmp_dir/readback.json")"
            stage="readback_validation"
            jq -e '.ok == true and .status == "already_refreshed" and .target_count == 26 and .already_current_count == 26 and (.issues | length) == 0' "$tmp_dir/readback.json" >/dev/null
          fi
          stage="completed"
          REMOTE
          remote_exit=$?
          set -e
          if ! jq -e '.schema_version == "enneagram-en13-evidence-production-ops.v1" and (.status == "success" or .status == "failure")' summary.json >/dev/null 2>&1; then
            jq -n \
              --arg release_sha "$RELEASE_SHA" \
              --arg operation_mode "$OPERATION_MODE" \
              '{schema_version:"enneagram-en13-evidence-production-ops.v1",status:"failure",release_sha:$release_sha,operation_mode:$operation_mode,cohort_sha256:"",failed_stage:"transport_or_summary",dry_run:null,write:null,readback:null}' \
              > summary.json
            remote_exit=1
          fi
          echo "remote_exit=$remote_exit" >> "$GITHUB_OUTPUT"

      - name: Upload sanitized aggregate summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: enneagram-en13-evidence-production-ops-${{ github.run_id }}
          path: summary.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce fail-closed refresh result
        if: always()
        shell: bash
        env:
          REMOTE_EXIT: ${{ steps.refresh.outputs.remote_exit }}
        run: |
          set -euo pipefail
          test "$REMOTE_EXIT" = "0"
          jq -e '.status == "success" and .failed_stage == null' summary.json >/dev/null
