name: Career Search Entry Cache Post-Readback Diagnostic

on:
  workflow_dispatch:
    inputs:
      expected_control_plane_sha:
        description: Exact latest main SHA containing this diagnostic control
        required: true
        type: string
      expected_release_sha:
        description: Exact unchanged active production application SHA
        required: true
        type: string
      expected_release_name:
        description: Exact unchanged active production release name
        required: true
        type: string
      failed_execute_run_id:
        description: Exact failed partial resume execute run
        required: true
        type: string
      failed_execute_run_attempt:
        description: Exact failed partial resume execute attempt
        required: true
        type: string
      expected_failed_execute_receipt_sha256:
        description: Exact immutable failed partial receipt SHA256
        required: true
        type: string
      expected_failed_execute_artifact_digest:
        description: Exact immutable failed partial artifact digest
        required: true
        type: string
      expected_manifest_sha256:
        description: Exact 50-slug manifest SHA256
        required: true
        type: string
      expected_post_readback_state_sha256:
        description: Exact failed execute post-readback state SHA256
        required: true
        type: string
      operator_approval_phrase:
        description: Exact read-only diagnostic operator phrase
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-${{ github.repository }}-production
  cancel-in-progress: false

jobs:
  eligibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      control_plane_sha: ${{ steps.validate.outputs.control_plane_sha }}
      release_sha: ${{ steps.validate.outputs.release_sha }}
      release_name: ${{ steps.validate.outputs.release_name }}
      manifest_sha256: ${{ steps.validate.outputs.manifest_sha256 }}
      failed_execute_run_id: ${{ steps.validate.outputs.failed_execute_run_id }}
      failed_execute_run_attempt: ${{ steps.validate.outputs.failed_execute_run_attempt }}
      failed_execute_receipt_sha256: ${{ steps.validate.outputs.failed_execute_receipt_sha256 }}
      failed_execute_artifact_digest: ${{ steps.validate.outputs.failed_execute_artifact_digest }}
      post_readback_state_sha256: ${{ steps.validate.outputs.post_readback_state_sha256 }}
    steps:
      - name: Checkout exact post-readback diagnostic control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.expected_control_plane_sha }}
          fetch-depth: 0

      - name: Bind latest main, failed partial receipt, and read-only authorization
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CONTROL_PLANE_SHA: ${{ inputs.expected_control_plane_sha }}
          EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
          EXPECTED_RELEASE_NAME: ${{ inputs.expected_release_name }}
          FAILED_EXECUTE_RUN_ID: ${{ inputs.failed_execute_run_id }}
          FAILED_EXECUTE_RUN_ATTEMPT: ${{ inputs.failed_execute_run_attempt }}
          EXPECTED_FAILED_EXECUTE_RECEIPT_SHA256: ${{ inputs.expected_failed_execute_receipt_sha256 }}
          EXPECTED_FAILED_EXECUTE_ARTIFACT_DIGEST: ${{ inputs.expected_failed_execute_artifact_digest }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.expected_manifest_sha256 }}
          EXPECTED_POST_READBACK_STATE_SHA256: ${{ inputs.expected_post_readback_state_sha256 }}
          OPERATOR_APPROVAL_PHRASE: ${{ inputs.operator_approval_phrase }}
          FAILED_SSH_PREFLIGHT_DIAGNOSTIC_RUN_ID: "30590027833"
          FAILED_SSH_PREFLIGHT_DIAGNOSTIC_RUN_ATTEMPT: "1"
          FAILED_SSH_PREFLIGHT_DIAGNOSTIC_CONTROL_PLANE_SHA: b7ab619e5ca6c5fb8356fe4ae6ac569fb48b3f64
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$EXPECTED_CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_RELEASE_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          [[ "$FAILED_EXECUTE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$FAILED_EXECUTE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_FAILED_EXECUTE_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_FAILED_EXECUTE_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_POST_READBACK_STATE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$FAILED_SSH_PREFLIGHT_DIAGNOSTIC_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$FAILED_SSH_PREFLIGHT_DIAGNOSTIC_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$FAILED_SSH_PREFLIGHT_DIAGNOSTIC_CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_CONTROL_PLANE_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_CONTROL_PLANE_SHA"
          git merge-base --is-ancestor "$EXPECTED_RELEASE_SHA" origin/main

          failed_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_EXECUTE_RUN_ID}")"
          jq -e \
            --argjson attempt "$FAILED_EXECUTE_RUN_ATTEMPT" \
            '.name == "Career Search Entry Batch Cache Refresh Permission-Repaired Resume"
             and .path == ".github/workflows/career-search-entry-batch-cache-refresh-resume.yml"
             and .event == "workflow_dispatch"
             and .status == "completed"
             and .conclusion == "failure"
             and .head_branch == "main"
             and .head_sha == "9c7925b1ce821fea3777e52ecb6c9c84dc8dd1eb"
             and .run_attempt == $attempt' <<<"$failed_run" >/dev/null

          artifact_name="career-search-entry-batch-cache-refresh-resume-execute-${FAILED_EXECUTE_RUN_ID}-${FAILED_EXECUTE_RUN_ATTEMPT}"
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_EXECUTE_RUN_ID}/artifacts?per_page=100")"
          jq -e \
            --arg name "$artifact_name" \
            --arg digest "sha256:${EXPECTED_FAILED_EXECUTE_ARTIFACT_DIGEST}" \
            '[.artifacts[] | select(.name == $name and .expired == false and .digest == $digest)] | length == 1' \
            <<<"$artifacts" >/dev/null
          receipt_dir="$(mktemp -d)"
          gh run download "$FAILED_EXECUTE_RUN_ID" --name "$artifact_name" --dir "$receipt_dir"
          receipt="$receipt_dir/career-search-entry-batch-cache-refresh-resume.json"
          test "$(sha256sum "$receipt" | awk '{print $1}')" = "$EXPECTED_FAILED_EXECUTE_RECEIPT_SHA256"
          jq -e \
            --arg release "$EXPECTED_RELEASE_SHA" \
            --arg release_name "$EXPECTED_RELEASE_NAME" \
            --arg manifest "$EXPECTED_MANIFEST_SHA256" \
            --arg post_state "$EXPECTED_POST_READBACK_STATE_SHA256" \
            --argjson run_id "$FAILED_EXECUTE_RUN_ID" \
            --argjson attempt "$FAILED_EXECUTE_RUN_ATTEMPT" \
            '.contract_version == "career.search_entry_batch.cache_refresh.resume.v1"
             and .mode == "execute"
             and .status == "FAIL_PARTIAL"
             and .release_sha == $release
             and .release_name == $release_name
             and .manifest_sha256 == $manifest
             and .failed_stage == "post_refresh_public_readback"
             and .failure_category == "quality_incomplete"
             and .write_state == "committed_unverified"
             and .production_write_execution == true
             and .cache_refresh_target_count == 75
             and .completed_batch_count == 10
             and .build_ms_max <= 5000
             and .post_refresh_readback_state_sha256 == $post_state
             and .observed_url_count == 100
             and .observed_http_200_count == 100
             and .observed_transport_failure_count == 0
             and .observed_non_200_response_count == 0
             and .observed_canonical_ok_count == 100
             and .observed_robots_ok_count == 100
             and .observed_locale_ok_count == 100
             and .observed_bad_href_url_count == 65
             and .observed_low_module_url_count == 10
             and .database_write_count == 0
             and .cms_write_count == 0
             and .publication_write_count == 0
             and .indexability_write_count == 0
             and .queue_dispatch_count == 0
             and .sitemap_write_count == 0
             and .llms_write_count == 0
             and .search_channel_action_count == 0
             and .url_submission_count == 0
             and .non_target_write_count == 0
             and .deploy_count == 0
             and .rollback_count == 0
             and .workflow_run_id == $run_id
             and .workflow_run_attempt == $attempt' "$receipt" >/dev/null

          later_resume="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/career-search-entry-batch-cache-refresh-resume.yml/runs?event=workflow_dispatch&per_page=100")"
          jq -e --argjson failed "$FAILED_EXECUTE_RUN_ID" \
            '[.workflow_runs[] | select(.id > $failed)] | length == 0' <<<"$later_resume" >/dev/null
          failed_diagnostic="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_SSH_PREFLIGHT_DIAGNOSTIC_RUN_ID}")"
          jq -e \
            --arg control "$FAILED_SSH_PREFLIGHT_DIAGNOSTIC_CONTROL_PLANE_SHA" \
            --argjson attempt "$FAILED_SSH_PREFLIGHT_DIAGNOSTIC_RUN_ATTEMPT" \
            '.name == "Career Search Entry Cache Post-Readback Diagnostic"
             and .path == ".github/workflows/career-search-entry-cache-post-readback-diagnostic.yml"
             and .event == "workflow_dispatch"
             and .status == "completed"
             and .conclusion == "failure"
             and .head_branch == "main"
             and .head_sha == $control
             and .run_attempt == $attempt' <<<"$failed_diagnostic" >/dev/null
          failed_diagnostic_jobs="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_SSH_PREFLIGHT_DIAGNOSTIC_RUN_ID}/jobs?per_page=100")"
          jq -e \
            '([.jobs[] | select(.name == "diagnose"
               and .status == "completed"
               and .conclusion == "failure")] | length == 1)
             and ([.jobs[] | select(.name == "diagnose") | .steps[]
               | select(.name == "Inspect aggregate runtime cache and fresh public state"
                 and .status == "completed" and .conclusion == "skipped")] | length == 1)' \
            <<<"$failed_diagnostic_jobs" >/dev/null
          failed_diagnostic_artifacts="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_SSH_PREFLIGHT_DIAGNOSTIC_RUN_ID}/artifacts?per_page=100")"
          jq -e '.total_count == 0 and (.artifacts | length == 0)' \
            <<<"$failed_diagnostic_artifacts" >/dev/null
          later_diagnostic="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/career-search-entry-cache-post-readback-diagnostic.yml/runs?event=workflow_dispatch&per_page=100")"
          jq -e \
            --argjson current "$GITHUB_RUN_ID" \
            --argjson failed "$FAILED_SSH_PREFLIGHT_DIAGNOSTIC_RUN_ID" \
            '[.workflow_runs[] | select(.id != $current) | .id] == [$failed]' \
            <<<"$later_diagnostic" >/dev/null

          expected_phrase="I explicitly approve one read-only Career search-entry cache post-readback diagnostic for failed partial resume execute run ${FAILED_EXECUTE_RUN_ID} attempt ${FAILED_EXECUTE_RUN_ATTEMPT} receipt ${EXPECTED_FAILED_EXECUTE_RECEIPT_SHA256} artifact ${EXPECTED_FAILED_EXECUTE_ARTIFACT_DIGEST}, failed SSH-preflight diagnostic run ${FAILED_SSH_PREFLIGHT_DIAGNOSTIC_RUN_ID} attempt ${FAILED_SSH_PREFLIGHT_DIAGNOSTIC_RUN_ATTEMPT} with inspect skipped and zero artifacts, control-plane SHA ${EXPECTED_CONTROL_PLANE_SHA}, active SHA ${EXPECTED_RELEASE_SHA}, manifest ${EXPECTED_MANIFEST_SHA256}, post-readback state ${EXPECTED_POST_READBACK_STATE_SHA256}; compare only aggregate 100-target deploy-runner and www-data active cache quality with one fresh 100-URL public snapshot, with zero server write, cache write, retry, rollback, deploy, CMS/DB write, or Search Channel operation."
          test "$OPERATOR_APPROVAL_PHRASE" = "$expected_phrase"
          {
            echo "control_plane_sha=$EXPECTED_CONTROL_PLANE_SHA"
            echo "release_sha=$EXPECTED_RELEASE_SHA"
            echo "release_name=$EXPECTED_RELEASE_NAME"
            echo "manifest_sha256=$EXPECTED_MANIFEST_SHA256"
            echo "failed_execute_run_id=$FAILED_EXECUTE_RUN_ID"
            echo "failed_execute_run_attempt=$FAILED_EXECUTE_RUN_ATTEMPT"
            echo "failed_execute_receipt_sha256=$EXPECTED_FAILED_EXECUTE_RECEIPT_SHA256"
            echo "failed_execute_artifact_digest=$EXPECTED_FAILED_EXECUTE_ARTIFACT_DIGEST"
            echo "post_readback_state_sha256=$EXPECTED_POST_READBACK_STATE_SHA256"
          } >> "$GITHUB_OUTPUT"

  diagnose:
    needs: eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout exact post-readback diagnostic control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.eligibility.outputs.control_plane_sha }}
          fetch-depth: 1

      - name: Validate protected production topology
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          RETIRED_DEPLOY_HOST: ${{ secrets.PRODUCTION_RETIRED_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$RETIRED_DEPLOY_HOST"
          test "$DEPLOY_HOST" != "$RETIRED_DEPLOY_HOST"

      - name: Set up SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known hosts
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null \
            || ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f ~/.ssh/known_hosts >/dev/null

      - name: Inspect aggregate runtime cache and fresh public state
        shell: bash
        env:
          DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
          CONTROL_PLANE_SHA: ${{ needs.eligibility.outputs.control_plane_sha }}
          EXPECTED_RELEASE_SHA: ${{ needs.eligibility.outputs.release_sha }}
          EXPECTED_RELEASE_NAME: ${{ needs.eligibility.outputs.release_name }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.eligibility.outputs.manifest_sha256 }}
          FAILED_EXECUTE_RUN_ID: ${{ needs.eligibility.outputs.failed_execute_run_id }}
          FAILED_EXECUTE_RUN_ATTEMPT: ${{ needs.eligibility.outputs.failed_execute_run_attempt }}
          EXPECTED_FAILED_RECEIPT_SHA256: ${{ needs.eligibility.outputs.failed_execute_receipt_sha256 }}
          FAILED_EXECUTE_ARTIFACT_DIGEST: ${{ needs.eligibility.outputs.failed_execute_artifact_digest }}
          EXPECTED_POST_READBACK_STATE_SHA256: ${{ needs.eligibility.outputs.post_readback_state_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          probe="backend/scripts/career/career_search_entry_cache_post_readback_diagnostic.php"
          probe_sha256="$(sha256sum "$probe" | awk '{print $1}')"
          for variable in DEPLOY_PATH EXPECTED_RELEASE_SHA EXPECTED_RELEASE_NAME \
            EXPECTED_MANIFEST_SHA256 EXPECTED_FAILED_RECEIPT_SHA256; do
            printf -v "q_${variable}" '%q' "${!variable}"
          done
          base_env="DEPLOY_PATH=$q_DEPLOY_PATH EXPECTED_RELEASE_SHA=$q_EXPECTED_RELEASE_SHA EXPECTED_RELEASE_NAME=$q_EXPECTED_RELEASE_NAME EXPECTED_MANIFEST_SHA256=$q_EXPECTED_MANIFEST_SHA256 EXPECTED_FAILED_RECEIPT_SHA256=$q_EXPECTED_FAILED_RECEIPT_SHA256"
          ssh_base=(
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10
            -o ServerAliveInterval=20 -o ServerAliveCountMax=30
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST"
          )
          set +e
          "${ssh_base[@]}" \
            "$base_env CAREER_CACHE_POST_READBACK_PROBE_MODE=runtime_cache /usr/bin/php" \
            < "$probe" > artifacts/deploy-runner-runtime.json
          deploy_status=$?
          "${ssh_base[@]}" \
            "sudo -n -u www-data -- env $base_env CAREER_CACHE_POST_READBACK_PROBE_MODE=runtime_cache /usr/bin/php" \
            < "$probe" > artifacts/www-data-runtime.json
          runtime_status=$?
          "${ssh_base[@]}" \
            "$base_env CAREER_CACHE_POST_READBACK_PROBE_MODE=public_fresh /usr/bin/php" \
            < "$probe" > artifacts/public-fresh.json
          public_status=$?
          set -e

          diagnostic_state_sha256="$(
            jq -S -c . artifacts/deploy-runner-runtime.json artifacts/www-data-runtime.json artifacts/public-fresh.json \
              | sha256sum | awk '{print $1}'
          )"
          jq -s \
            --arg control "$CONTROL_PLANE_SHA" \
            --arg probe "$probe_sha256" \
            --arg failed_receipt "$EXPECTED_FAILED_RECEIPT_SHA256" \
            --arg failed_artifact "$FAILED_EXECUTE_ARTIFACT_DIGEST" \
            --arg post_state "$EXPECTED_POST_READBACK_STATE_SHA256" \
            --arg diagnostic_state "$diagnostic_state_sha256" \
            --argjson failed_run "$FAILED_EXECUTE_RUN_ID" \
            --argjson failed_attempt "$FAILED_EXECUTE_RUN_ATTEMPT" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            '.[0] as $deploy
             | .[1] as $runtime
             | .[2] as $public
             | {
                 contract_version: "career.search_entry_batch.cache_post_readback_diagnostic.v1",
                 status: (
                   if ($deploy.status != "PASS_PROBE_COMPLETE"
                     or $runtime.status != "PASS_PROBE_COMPLETE"
                     or $public.status != "PASS_PROBE_COMPLETE"
                     or $deploy.url_count != 100
                     or $runtime.url_count != 100
                     or $public.url_count != 100) then
                     "HOLD_DIAGNOSTIC_INCOMPLETE"
                   elif ($deploy.runtime_identity_sha256 != $runtime.runtime_identity_sha256
                     or $deploy.payload_set_sha256 != $runtime.payload_set_sha256) then
                     "PASS_DIAGNOSTIC_RUNTIME_IDENTITY_MISMATCH"
                   elif ($deploy.ready_active_count != 100
                     or $deploy.bad_href_url_count != 0
                     or $deploy.low_module_url_count != 0) then
                     "PASS_DIAGNOSTIC_REFRESH_PAYLOAD_INEFFECTIVE"
                   elif ($public.http_200_count == 100
                     and $public.transport_failure_count == 0
                     and $public.bad_href_url_count == 0
                     and $public.low_module_url_count == 0) then
                     "PASS_DIAGNOSTIC_FRESH_PUBLIC_MATCH"
                   else
                     "PASS_DIAGNOSTIC_PUBLIC_DELIVERY_STALE"
                   end
                 ),
                 release_sha: $deploy.release_sha,
                 release_name: $deploy.release_name,
                 manifest_sha256: $deploy.manifest_sha256,
                 deploy_runner_runtime_identity_sha256: $deploy.runtime_identity_sha256,
                 php_runtime_identity_sha256: $runtime.runtime_identity_sha256,
                 deploy_runner_payload_set_sha256: $deploy.payload_set_sha256,
                 php_runtime_payload_set_sha256: $runtime.payload_set_sha256,
                 deploy_runner_ready_active_count: $deploy.ready_active_count,
                 php_runtime_ready_active_count: $runtime.ready_active_count,
                 deploy_runner_bad_href_url_count: $deploy.bad_href_url_count,
                 php_runtime_bad_href_url_count: $runtime.bad_href_url_count,
                 deploy_runner_low_module_url_count: $deploy.low_module_url_count,
                 php_runtime_low_module_url_count: $runtime.low_module_url_count,
                 public_fresh_payload_set_sha256: $public.payload_set_sha256,
                 public_fresh_http_200_count: $public.http_200_count,
                 public_fresh_transport_failure_count: $public.transport_failure_count,
                 public_fresh_bad_href_url_count: $public.bad_href_url_count,
                 public_fresh_low_module_url_count: $public.low_module_url_count,
                 public_fresh_cache_header_count: $public.fresh_cache_header_count,
                 diagnostic_state_sha256: $diagnostic_state,
                 failed_execute_run_id: $failed_run,
                 failed_execute_run_attempt: $failed_attempt,
                 failed_execute_receipt_sha256: $failed_receipt,
                 failed_execute_artifact_digest: $failed_artifact,
                 failed_post_readback_state_sha256: $post_state,
                 control_plane_sha: $control,
                 probe_sha256: $probe,
                 workflow_run_id: $run_id,
                 workflow_run_attempt: $run_attempt,
                 write_state: "none",
                 production_write_execution: false,
                 server_write_count: 0,
                 cache_write_count: 0,
                 retry_execution_count: 0,
                 database_write_count: 0,
                 cms_write_count: 0,
                 publication_write_count: 0,
                 indexability_write_count: 0,
                 queue_dispatch_count: 0,
                 sitemap_write_count: 0,
                 llms_write_count: 0,
                 search_channel_action_count: 0,
                 url_submission_count: 0,
                 deploy_count: 0,
                 rollback_count: 0
               }' \
            artifacts/deploy-runner-runtime.json artifacts/www-data-runtime.json artifacts/public-fresh.json \
            > artifacts/career-search-entry-cache-post-readback-diagnostic.json
          test "$deploy_status" -eq 0
          test "$runtime_status" -eq 0
          test "$public_status" -eq 0

      - name: Upload sanitized immutable post-readback diagnostic receipt
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: career-search-entry-cache-post-readback-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/career-search-entry-cache-post-readback-diagnostic.json
          if-no-files-found: error
          retention-days: 90
