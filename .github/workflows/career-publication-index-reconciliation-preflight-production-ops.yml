name: Career Publication Index Reconciliation Preflight Production Ops

on:
  workflow_dispatch:
    inputs:
      expected_control_plane_sha:
        description: Exact latest main SHA containing this SELECT-only control
        required: true
        type: string
      expected_release_sha:
        description: Exact active production application SHA
        required: true
        type: string
      expected_release_name:
        description: Exact active production release name
        required: true
        type: string
      operator_approval_phrase:
        description: Exact SHA and release-bound approval for this zero-write preflight only
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-${{ github.repository }}-production
  cancel-in-progress: false

jobs:
  preflight:
    name: Capture exact SELECT-only publication/index difference
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      EXPECTED_CONTROL_PLANE_SHA: ${{ inputs.expected_control_plane_sha }}
      EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
      EXPECTED_RELEASE_NAME: ${{ inputs.expected_release_name }}
      OPERATOR_APPROVAL_PHRASE: ${{ inputs.operator_approval_phrase }}
      FROZEN_MANIFEST_SHA256: b570ec0cdda65278aa543431886b3529d072de8d67a8e79f1cafbb1c4c8dfc0e
      BASELINE_SET_SHA256: 39cc766fb18c85d385b83f0ac1f56a8b97d46481d3e9a12de0588abbaf640060
      RECEIPT_SET_SHA256: 09ec67befe967e1619a40578c47b862743883717b048da802ee7ef3551a0747f
      TARGET_SET_SHA256: 3b101fb76b5666200c73519c650beb1a5b0b35f47f7592453bf5671920571a18
      EMPTY_SET_SHA256: 01ba4719c80b6fe911b091a7c05124b64eeece964e09c058ef8f9805daca546b
      DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
      DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
      RETIRED_DEPLOY_HOST: ${{ secrets.PRODUCTION_RETIRED_DEPLOY_HOST }}
      DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}

    steps:
      - name: Initialize sanitized failure receipt before checkout
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/career-publication-index-reconciliation-preflight.json"
          jq -n \
            --arg control "$EXPECTED_CONTROL_PLANE_SHA" \
            --arg release "$EXPECTED_RELEASE_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{
              contract_version: "career.publication_index_reconciliation_preflight.v1",
              mode: "preflight",
              status: "FAIL_PREFLIGHT_INITIALIZATION",
              failed_stage: "initialize",
              control_plane_sha: $control,
              release_sha: $release,
              workflow_run_id: ($run_id | tonumber),
              workflow_run_attempt: ($run_attempt | tonumber),
              production_read_execution: false,
              database_select_only: true,
              database_write_count: 0,
              cms_write_count: 0,
              cache_write_count: 0,
              artifact_write_count: 0,
              publication_write_count: 0,
              deployment_count: 0,
              migration_count: 0,
              sitemap_write_count: 0,
              llms_write_count: 0,
              search_submission_count: 0,
              writes_committed: false,
              zero_write_guarantee: false,
              automatic_retry_allowed: false
            }' > "$receipt"

      - name: Checkout exact control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.expected_control_plane_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate latest main and exact zero-write authorization
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/career-publication-index-reconciliation-preflight.json"
          mark_failure() {
            jq --arg stage "$1" '.status = "FAIL_PREFLIGHT_ELIGIBILITY" | .failed_stage = $stage' \
              "$receipt" > "$receipt.next"
            mv "$receipt.next" "$receipt"
          }
          trap 'mark_failure "control_plane_or_authorization_validation"' ERR

          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$EXPECTED_CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_RELEASE_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_CONTROL_PLANE_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_CONTROL_PLANE_SHA"
          test "$GITHUB_SHA" = "$EXPECTED_CONTROL_PLANE_SHA"
          git cat-file -e "${EXPECTED_RELEASE_SHA}^{commit}"
          git merge-base --is-ancestor "$EXPECTED_RELEASE_SHA" origin/main

          expected_phrase="I explicitly approve SELECT-only Career publication/index reconciliation preflight for control plane SHA ${EXPECTED_CONTROL_PLANE_SHA} active SHA ${EXPECTED_RELEASE_SHA} release ${EXPECTED_RELEASE_NAME}; read exact receipt, target, baseline and current DB state hashes with zero writes and no apply, deploy, migration, CMS/cache/artifact/publication/sitemap/llms/Search action."
          test "$OPERATOR_APPROVAL_PHRASE" = "$expected_phrase"
          freeze_result="$(php backend/scripts/operations/verify_career_1046_current_state_freeze.php)"
          jq -e \
            '.status == "PASS_FROZEN_ZERO_WRITE_CONTRACT"
             and .payload_sha256 == "23c86542bbe9301f60b101d067ad6c2382982041042eaf4a9faa61886c164f88"
             and .receipt_coverage == 1016
             and .database_latest_index_missing == 1016
             and .writes == 0
             and .production_apply_allowed == false' <<<"$freeze_result" >/dev/null
          test "$(sha256sum backend/docs/seo/generated/detail-ready-1046-rollout-manifest.v1.json | awk '{print $1}')" = "$FROZEN_MANIFEST_SHA256"
          php -l backend/scripts/operations/career_publication_index_reconciliation_preflight.php >/dev/null
          trap - ERR

      - name: Validate protected production topology
        shell: bash
        run: |
          set -euo pipefail
          for name in DEPLOY_USER DEPLOY_PORT DEPLOY_HOST RETIRED_DEPLOY_HOST DEPLOY_PATH SSH_KNOWN_HOSTS; do
            test -n "${!name:-}"
          done
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          test "$DEPLOY_PORT" -ge 1
          test "$DEPLOY_PORT" -le 65535
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$RETIRED_DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          test "$DEPLOY_HOST" != "$RETIRED_DEPLOY_HOST"
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_PATH" != *".."* ]]
          echo "Protected production topology validated without disclosing values."

      - name: Start pinned SSH agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known hosts
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null \
            || ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f ~/.ssh/known_hosts >/dev/null

      - name: Run bounded SELECT-only reconciliation preflight
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/career-publication-index-reconciliation-preflight.json"
          remote_receipt="$RUNNER_TEMP/career-publication-index-reconciliation-preflight.remote.json"
          printf -v q_deploy_path '%q' "$DEPLOY_PATH"
          printf -v q_control '%q' "$EXPECTED_CONTROL_PLANE_SHA"
          printf -v q_release '%q' "$EXPECTED_RELEASE_SHA"
          printf -v q_release_name '%q' "$EXPECTED_RELEASE_NAME"
          printf -v q_run_id '%q' "$GITHUB_RUN_ID"
          printf -v q_run_attempt '%q' "$GITHUB_RUN_ATTEMPT"

          set +e
          timeout --signal=TERM --kill-after=5s 120s \
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
              -o ServerAliveInterval=20 -o ServerAliveCountMax=5 \
              -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "set -euo pipefail; current=\$(readlink -f $q_deploy_path/current); release=\$(readlink -f $q_deploy_path/releases/$q_release_name); test -n \"\$current\"; test \"\$current\" = \"\$release\"; test \"\$(tr -d '\\r\\n' < \"\$current/REVISION\")\" = $q_release; test ! -e $q_deploy_path/.dep/deploy.lock; test \"\$(ps -eo comm=,args= | awk '\$1 == \"php\" && (\$0 ~ /dep(\\.phar)? .* production/ || \$0 ~ /artisan migrate/ || \$0 ~ /queue:reload-workers/ || \$0 ~ /career_publication_index_reconciliation/) {n++} \$1 == \"composer\" && \$0 ~ /install/ {n++} END {print n+0}')\" = 0; CAREER_RECONCILIATION_BACKEND_ROOT=\"\$current/backend\" CAREER_RECONCILIATION_CONTROL_PLANE_SHA=$q_control CAREER_RECONCILIATION_RELEASE_SHA=$q_release CAREER_RECONCILIATION_RELEASE_NAME=$q_release_name CAREER_RECONCILIATION_RUN_ID=$q_run_id CAREER_RECONCILIATION_RUN_ATTEMPT=$q_run_attempt php /dev/stdin inspect" \
              < backend/scripts/operations/career_publication_index_reconciliation_preflight.php \
              > "$remote_receipt" 2>/dev/null
          remote_status=$?
          set -e

          if jq -e \
            '.contract_version == "career.publication_index_reconciliation_preflight.v1"
             and .mode == "preflight"
             and (.status | type == "string")' "$remote_receipt" >/dev/null 2>&1; then
            mv "$remote_receipt" "$receipt"
          else
            jq '.status = "FAIL_REMOTE_READ_OUTCOME_REQUIRES_REVIEW"
                | .failed_stage = "remote_transport_or_receipt_invalid"
                | .production_read_execution = true
                | .zero_write_guarantee = false' \
              "$receipt" > "$receipt.next"
            mv "$receipt.next" "$receipt"
          fi
          exit "$remote_status"

      - name: Validate sanitized immutable receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/career-publication-index-reconciliation-preflight.json"
          release_name_sha256="$(printf '%s' "$EXPECTED_RELEASE_NAME" | sha256sum | awk '{print $1}')"
          jq -e \
            --arg control "$EXPECTED_CONTROL_PLANE_SHA" \
            --arg release "$EXPECTED_RELEASE_SHA" \
            --arg release_name_sha "$release_name_sha256" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            '.contract_version == "career.publication_index_reconciliation_preflight.v1"
             and .mode == "preflight"
             and .status == "PASS_SELECT_ONLY_RECONCILIATION_PREFLIGHT"
             and .control_plane_sha == $control
             and .release_sha == $release
             and .release_name_sha256 == $release_name_sha
             and .workflow_run_id == $run_id
             and .workflow_run_attempt == $run_attempt
             and .manifest_sha256 == "b570ec0cdda65278aa543431886b3529d072de8d67a8e79f1cafbb1c4c8dfc0e"
             and .manifest.baseline_count == 30
             and .manifest.baseline_set_sha256 == "39cc766fb18c85d385b83f0ac1f56a8b97d46481d3e9a12de0588abbaf640060"
             and .manifest.delta_count == 1016
             and .manifest.delta_set_sha256 == "09ec67befe967e1619a40578c47b862743883717b048da802ee7ef3551a0747f"
             and .manifest.target_count == 1046
             and .manifest.target_set_sha256 == "3b101fb76b5666200c73519c650beb1a5b0b35f47f7592453bf5671920571a18"
             and .receipt_authority.authentic_receipt_count == 1016
             and .receipt_authority.authentic_receipt_set_sha256 == "09ec67befe967e1619a40578c47b862743883717b048da802ee7ef3551a0747f"
             and .receipt_authority.covered_delta_count == 1016
             and .receipt_authority.covered_delta_set_sha256 == "09ec67befe967e1619a40578c47b862743883717b048da802ee7ef3551a0747f"
             and .receipt_authority.missing_receipt_count == 0
             and .receipt_authority.missing_receipt_set_sha256 == "01ba4719c80b6fe911b091a7c05124b64eeece964e09c058ef8f9805daca546b"
             and .receipt_authority.outside_target_count == 0
             and .receipt_authority.outside_target_set_sha256 == "01ba4719c80b6fe911b091a7c05124b64eeece964e09c058ef8f9805daca546b"
             and .receipt_authority.baseline_overlap_count == 0
             and .receipt_authority.baseline_overlap_set_sha256 == "01ba4719c80b6fe911b091a7c05124b64eeece964e09c058ef8f9805daca546b"
             and .receipt_authority.exact_delta_receipt_authority == true
             and .database_latest_index_state.receipt_covered_count == 1016
             and .database_latest_index_state.current_state_row_count == 1016
             and (.database_latest_index_state.current_state_sha256 | test("^[0-9a-f]{64}$"))
             and (.database_latest_index_state.matching_set_sha256 | test("^[0-9a-f]{64}$"))
             and (.database_latest_index_state.missing_or_mismatching_set_sha256 | test("^[0-9a-f]{64}$"))
             and (.database_latest_index_state.occupation_missing_set_sha256 | test("^[0-9a-f]{64}$"))
             and (.database_latest_index_state.latest_state_missing_set_sha256 | test("^[0-9a-f]{64}$"))
             and .database_latest_index_state.latest_state_tie_count == 0
             and .database_latest_index_state.latest_state_tie_set_sha256 == "01ba4719c80b6fe911b091a7c05124b64eeece964e09c058ef8f9805daca546b"
             and (.database_latest_index_state.matching_count + .database_latest_index_state.missing_or_mismatching_count == 1016)
             and .deploy_lock_absent == true
             and .deploy_process_absent == true
             and .production_read_execution == true
             and .database_select_only == true
             and .observed_database_query_count >= 1
             and .observed_database_query_verb_set_sha256 == "3be326473610e616ccddabfee05380d844fc5c01116946a24ab8e620d2713ba7"
             and .database_write_count == 0
             and .cms_write_count == 0
             and .cache_write_count == 0
             and .artifact_write_count == 0
             and .publication_write_count == 0
             and .deployment_count == 0
             and .migration_count == 0
             and .sitemap_write_count == 0
             and .llms_write_count == 0
             and .search_submission_count == 0
             and .writes_committed == false
             and .zero_write_guarantee == true
             and .automatic_retry_allowed == false' "$receipt" >/dev/null

      - name: Upload immutable sanitized preflight receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: career-publication-index-reconciliation-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/career-publication-index-reconciliation-preflight.json
          if-no-files-found: error
          retention-days: 90
