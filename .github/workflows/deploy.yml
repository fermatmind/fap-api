            and .platform11_independent_review.external_calls == 0 and .platform11_independent_review.production_permissions == 0
            and .platform11_independent_review.cms_writes == 0 and .platform11_independent_review.deploy_writes == 0
            and .platform11_independent_review.url_truth_writes == 0 and .platform11_independent_review.search_writes == 0
            and .platform11_independent_review.business_writes == 0
            and .platform11_independent_review."SEO-PLATFORM-11K" == "STAGING_READY"
            and .platform11_independent_review.ready_for_11L == false and .platform11_independent_review.execution_allowed == false
            and .platform11_lifecycle.receipt_version == "seo.platform11_closeout.v1"
            and .platform11_lifecycle.environment == "staging_runtime"
            and .platform11_lifecycle.closeout_state == "STAGING_READY"
            and .platform11_lifecycle.dependency_status == "READY"
            and .platform11_lifecycle.lifecycle_probes.bypass_count == 0
            and .platform11_lifecycle.canary_probes.bypass_count == 0
            and .platform11_lifecycle.evaluation.sample_size == 96
            and .platform11_lifecycle.evaluation.golden_fixture_passed == 96
            and .platform11_lifecycle.fault_drill.scenario_count == 15
            and .platform11_lifecycle.fault_drill.passed_count == 15
            and .platform11_lifecycle.active_manifest_count == 0
            and .platform11_lifecycle.trusted_signing_key_count == 0
            and .platform11_lifecycle.model_calls == 0 and .platform11_lifecycle.tool_calls == 0
            and .platform11_lifecycle.external_calls == 0 and .platform11_lifecycle.production_permissions == 0
            and .platform11_lifecycle.cms_writes == 0 and .platform11_lifecycle.publish_writes == 0
            and .platform11_lifecycle.url_truth_writes == 0 and .platform11_lifecycle.search_writes == 0
            and .platform11_lifecycle.business_writes == 0
            and .platform11_lifecycle."SEO-PLATFORM-11L" == "STAGING_READY"
            and .platform11_lifecycle."SEO-PLATFORM-11" == "STAGING_READY"
            and .platform11_lifecycle.ready_for_12 == false
            and .platform11_lifecycle.post12_agent_write_enabled == false
            and .platform11_lifecycle.execution_allowed == false
            and .execution_allowed == false and (.receipt_hash | test("^[a-f0-9]{64}$"))
          ' "$receipt" >/dev/null
      - name: Validate three A08 sources through controlled read-only Missions
        if: needs.policy.outputs.seo_council_orchestration == 'true'
        shell: bash
        run: |
          set -euo pipefail
          printf -v q_path '%q' "$DEPLOY_PATH"
          printf -v q_sha '%q' "$DEPLOY_SHA"
          ssh_base=(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -o ConnectionAttempts=3 -o IdentitiesOnly=yes -i "$DEPLOY_IDENTITY_FILE_STG" \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST")
          operation="deploy:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:${DEPLOY_SHA}"
          mkdir -p artifacts/seo-council-a08-staging
          begun="$("${ssh_base[@]}" "set -euo pipefail; test \"\$(tr -d '\\r\\n' < $q_path/current/REVISION)\" = $q_sha; cd $q_path/current/backend; php artisan seo:council-runtime acceptance-begin --operation-ref='$operation' --adopt-historical-pause --no-interaction --no-ansi")"
          jq -e --arg operation "$operation" '.state == "CONTROLLED_ACCEPTANCE_ONLY"
            and .controlled_acceptance_enabled == true and .operation_ref == $operation
            and .pause_source == "acceptance_protection" and (.generation | test("^[a-f0-9]{32}$"))
            and .business_write_enabled == false' <<<"$begun" >/dev/null
          historical_pause_adopted="$(jq -r .historical_pause_adopted <<<"$begun")"
          generation="$(jq -r .generation <<<"$begun")"
          failure_stage="public_probe"
          public_probe_exit=null
          probe_summary='{"item_count":0,"target_ids":[],"healthy_count":0,"readback_count":0,"error_codes":[]}'
          results='[]'
          source_connected=false
          notification_delivery_verified=false
          receipt_to_ui_verified=false
          pause_resume_verified=false
          write_hold_receipt() {
            jq -n --arg sha "$DEPLOY_SHA" --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
              --arg stage "$failure_stage" --arg source_connected "$source_connected" \
              --arg notification "$notification_delivery_verified" --arg readback "$receipt_to_ui_verified" \
              --arg pause_resume "$pause_resume_verified" --argjson probe_exit "$public_probe_exit" \
              --argjson probe_summary "$probe_summary" --argjson missions "$results" \
              '{schema_version:"seo.platform12_a08_staging_acceptance.v2",sha:$sha,deploy_run_id:($run|tonumber),deploy_run_attempt:($attempt|tonumber),
                status:"hold",reason:"A08_SOURCE_ACCEPTANCE_HOLD",failure_stage:$stage,
                trigger_mode:"controlled_acceptance",natural_slot_receipt:false,
                source_connected:($source_connected == "true"),
                notification_delivery_verified:($notification == "true"),
                pause_resume_verified:($pause_resume == "true"),receipt_to_ui_verified:($readback == "true"),
                probe_exit_code:$probe_exit,probe_summary:$probe_summary,
                mission_count:($missions|length),missions:$missions,
                model_calls:0,tool_calls:0,external_calls:0,business_writes:0}' \
              > artifacts/seo-council-a08-staging/receipt.json
          }
          abort_acceptance() {
            local exit_code=$?
            trap - ERR
            set +e
            write_hold_receipt
            "${ssh_base[@]}" "cd $q_path/current/backend && php artisan seo:council-runtime acceptance-abort --operation-ref='$operation' --expected-generation='$generation' --no-interaction --no-ansi" >/dev/null || true
            exit "$exit_code"
          }
          trap abort_acceptance ERR
          failure_stage="sitemap_observation_refresh"
          sitemap_refresh="$("${ssh_base[@]}" "set -euo pipefail; test \"\$(tr -d '\\r\\n' < $q_path/current/REVISION)\" = $q_sha; cd $q_path/current/backend; php artisan seo:warm-sitemap-source-cache --refresh-if-changed --json --no-interaction --no-ansi")"
          jq -e '((keys | sort) == ["count","elapsed_seconds","status"])
            and (.status | IN("verified_unchanged","rebuilt"))
            and (.count | type == "number" and . >= 1)
            and (.elapsed_seconds | type == "number" and . >= 0)' <<<"$sitemap_refresh" >/dev/null
          trap - ERR
          set +e
          public_probe="$("${ssh_base[@]}" "cd $q_path/current/backend && php artisan public-content:probe-delivery --all --json --no-interaction --no-ansi")"
          public_probe_exit=$?
          set -e
          trap abort_acceptance ERR
          failure_stage="public_probe_observation"
          jq -e '((keys | sort) == (["ok","scope","mode","items"] | sort))
            and .scope == "fixed_anonymous_public_allowlist" and .mode == "all" and (.ok | type == "boolean")
            and (.items | type == "array" and length == 3)
            and ([.items[].target_id] | sort) == ["l1_mbti_intj_a_en","l2_big_five_hub_en","l3_career_industries_en"]
            and all(.items[];
              ((keys | sort) == (["target_id","family","priority","locale","observed_at","duration_ms","ok",
                "status_code","status_class","bytes","cache_state","content_authority",
                "content_aggregate_sha256","readback","error_code"] | sort))
              and (.target_id | type == "string") and (.family | type == "string")
              and (.priority | type == "string") and (.locale | type == "string")
              and (.observed_at | type == "string") and (.ok | type == "boolean")
              and (.status_code | type == "number") and (.status_code >= 0 and .status_code < 600)
              and (.bytes | type == "number") and (.bytes >= 0 and .bytes <= 1048577)
              and (.duration_ms | type == "number") and .duration_ms >= 0
              and (.status_class | IN("success","redirect","client_error","server_error","network_error","unknown"))
              and (.cache_state | IN("miss","fresh","stale","bypass","unknown"))
              and (.content_authority | test("^[a-z0-9][a-z0-9._-]{0,79}$"))
              and ((.content_aggregate_sha256 == null) or (.content_aggregate_sha256 | test("^[a-f0-9]{64}$")))
              and (.readback | type == "object")
              and ((.readback | keys | sort) == (["ok","profile","fields","version_fingerprint"] | sort))
              and (.readback.ok | type == "boolean") and (.readback.profile | type == "string")
              and (.readback.fields | type == "object")
              and ((.readback.version_fingerprint == null)
                or (.readback.version_fingerprint | test("^[a-f0-9]{64}$")))
              and ((.error_code == null) or (.error_code | test("^[a-z0-9_]{1,80}$"))))' <<<"$public_probe" >/dev/null
          probe_now_epoch="$(date -u +%s)"
          while IFS= read -r observed_at; do
            observed_epoch="$(date -u -d "$observed_at" +%s)"
            test "$observed_epoch" -le "$probe_now_epoch"
            test "$observed_epoch" -ge "$((probe_now_epoch - 1800))"
          done < <(jq -r '.items[].observed_at' <<<"$public_probe")
          probe_summary="$(jq -c '{item_count:(.items|length),target_ids:([.items[].target_id]|sort),
            healthy_count:([.items[]|select(.ok == true)]|length),
            readback_count:([.items[]|select(.readback.ok == true)]|length),
            error_codes:([.items[].error_code|select(type == "string")]|unique)}' <<<"$public_probe")"
          source_connected=true
          for mission in \
            seo.platform12.daily_gsc_core_runtime \
            seo.platform12.daily_url_truth_reconciliation \
            seo.platform12.daily_private_policy_evidence_drift; do
            failure_stage="mission_${mission//./_}"
            result="$("${ssh_base[@]}" "cd $q_path/current/backend && php artisan seo:council-scheduled --acceptance=$mission --acceptance-operation='$operation' --json --no-interaction --no-ansi")"
            results="$(jq -c --argjson result "$result" '. + [$result]' <<<"$results")"
            if ! jq -e '.status == "TERMINAL_COMMITTED" and .terminal_committed == true
              and (.receipt_hash | test("^[a-f0-9]{64}$")) and .source_gaps == []
              and (.mission_verdict | type == "string")
              and .execution_allowed == false and .business_write_enabled == false' <<<"$result" >/dev/null; then
              jq -c '{status,mission_id,terminal_committed,mission_verdict,source_gaps,runtime_error_code,
                runtime_error_fingerprint,execution_allowed,business_write_enabled}' <<<"$result" >&2
              false
            fi
          done
          failure_stage="receipt_readback"
          hashes="$(jq -c '[.[].receipt_hash]' <<<"$results")"
          hash_csv="$(jq -r 'join(",")' <<<"$hashes")"
          readback="$("${ssh_base[@]}" "cd $q_path/current/backend && php artisan seo:council-acceptance-readback --receipt-hashes='$hash_csv' --no-interaction --no-ansi")"
          jq -e '.status == "pass" and .receipt_to_ui_verified == true
            and .notification_configuration_verified == true
            and .controlled_acceptance_verified == true and .receipt_count == 3
            and .business_write_enabled == false' <<<"$readback" >/dev/null
          receipt_to_ui_verified=true
          failure_stage="notification_delivery"
          notification="$("${ssh_base[@]}" "cd $q_path/current/backend && php artisan seo:council-notification-acceptance --operation-ref='$operation' --json --no-interaction --no-ansi")"
          jq -e '.status == "sent" and .business_write_enabled == false' <<<"$notification" >/dev/null
          notification_delivery_verified=true
          failure_stage="notification_deduplication"
          duplicate="$("${ssh_base[@]}" "cd $q_path/current/backend && php artisan seo:council-notification-acceptance --operation-ref='$operation' --json --no-interaction --no-ansi")"
          jq -e '.status == "DEDUPLICATED" and .business_write_enabled == false' <<<"$duplicate" >/dev/null
          failure_stage="acceptance_complete"
          completed="$("${ssh_base[@]}" "cd $q_path/current/backend && php artisan seo:council-runtime acceptance-complete --operation-ref='$operation' --expected-generation='$generation' --no-interaction --no-ansi")"
          jq -e '.state == "ACTIVE_READ_ONLY" and .controlled_acceptance_enabled == false
            and .business_write_enabled == false' <<<"$completed" >/dev/null
          pause_resume_verified=true
          trap - ERR
          jq -n --arg sha "$DEPLOY_SHA" --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --arg historical_pause_adopted "$historical_pause_adopted" --argjson probe_exit "$public_probe_exit" \
            --argjson probe_summary "$probe_summary" --argjson missions "$results" \
            '{schema_version:"seo.platform12_a08_staging_acceptance.v2",sha:$sha,deploy_run_id:($run|tonumber),deploy_run_attempt:($attempt|tonumber),
              status:"pass",failure_stage:null,source_connected:true,notification_delivery_verified:true,pause_resume_verified:true,
              receipt_to_ui_verified:true,
              historical_pause_adopted:($historical_pause_adopted == "true"),
              trigger_mode:"controlled_acceptance",natural_slot_receipt:false,mission_count:3,
              probe_exit_code:$probe_exit,probe_summary:$probe_summary,
              missions:$missions,model_calls:0,tool_calls:0,external_calls:0,business_writes:0}' \
            > artifacts/seo-council-a08-staging/receipt.json
      - name: Record staging timing
        if: always()
        run: |
          jq -n --arg sha "$DEPLOY_SHA" --arg run "$GITHUB_RUN_ID" --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schema_version:"fermatmind.trunk-deploy-timing.v1",sha:$sha,phase:"staging",run_id:$run,completed_at:$at}' > staging-timing.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: trunk-staging-${{ github.event.workflow_run.head_sha }}
          path: |
            staging-timing.json
            seo-agent-evidence-boundary-staging.json
            seo-agent-policy-gateway-staging.json
            seo-council-orchestration-staging.json
            artifacts/seo-council-a08-staging/receipt.json
          if-no-files-found: error
          retention-days: 90

  production:
    name: Production exact-SHA activation, smoke, and LKG fallback
    needs: [policy, staging]
    if: needs.staging.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    env:
      TARGET: production
      DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
      DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
      RETIRED_DEPLOY_HOST: ${{ secrets.PRODUCTION_RETIRED_DEPLOY_HOST }}
      DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
      DEPLOY_USER_PROD: ${{ secrets.PRODUCTION_DEPLOY_USER }}
      DEPLOY_PORT_PROD: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
      DEPLOY_HOST_PROD: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
      DEPLOY_PATH_PROD: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
      HEALTHCHECK_URL: ${{ vars.PRODUCTION_HEALTHCHECK_URL }}
      AUTH_GUEST_CHECK_URL: ${{ vars.PRODUCTION_AUTH_GUEST_CHECK_URL }}
      OPS_HOST: ${{ vars.PRODUCTION_OPS_HOST }}
      DEPLOY_REVISION: ${{ github.event.workflow_run.head_sha }}
      DEPLOY_MODE: standard
      SEO_INTEL_RUNTIME_ENVIRONMENT: production
      SEO_INTEL_ENABLED: ${{ vars.SEO_INTEL_ENABLED }}
      SEO_INTEL_DB_CONNECTION: ${{ vars.SEO_INTEL_DB_CONNECTION }}
      SEO_INTEL_WRITE_ENABLED: ${{ vars.SEO_INTEL_WRITE_ENABLED }}
      SEO_INTEL_COLLECTORS_ENABLED: ${{ vars.SEO_INTEL_COLLECTORS_ENABLED }}
      SEO_INTEL_DRY_RUN_DEFAULT: ${{ vars.SEO_INTEL_DRY_RUN_DEFAULT }}
      SEO_INTEL_ALLOW_EXTERNAL_API_CALLS: ${{ vars.SEO_INTEL_ALLOW_EXTERNAL_API_CALLS }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Verify production 11G configuration before transport
        if: needs.policy.outputs.seo_competitive_evidence == 'true'
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.SEO_INTEL_GSC_SERVICE_ACCOUNT_JSON }}
          GSC_PROPERTY_URL: ${{ secrets.SEO_INTEL_GSC_PROPERTY_URL }}
          GSC_ENABLED: ${{ vars.SEO_INTEL_GSC_ENABLED }}
          GSC_LIVE_API_ENABLED: ${{ vars.SEO_INTEL_GSC_LIVE_API_ENABLED }}
          GSC_SYNC_ENABLED: ${{ vars.SEO_INTEL_GSC_SYNC_ENABLED }}
          GSC_AUTH_MODE: ${{ vars.SEO_INTEL_GSC_AUTH_MODE }}
          GSC_SCOPE: ${{ vars.SEO_INTEL_GSC_SCOPE }}
          GSC_SYNC_WINDOW_DAYS: ${{ vars.SEO_INTEL_GSC_SYNC_WINDOW_DAYS }}
          GSC_SYNC_SEARCH_TYPES: ${{ vars.SEO_INTEL_GSC_SYNC_SEARCH_TYPES }}
          COMPETITIVE_WRITER_DB_USERNAME: ${{ secrets.SEO_INTEL_MIGRATION_DB_USERNAME }}
          COMPETITIVE_WRITER_DB_PASSWORD: ${{ secrets.SEO_INTEL_MIGRATION_DB_PASSWORD }}
        run: |
          set -euo pipefail
          fail() {
            printf 'production_competitive_configuration=HOLD reason=%s\n' "$1" >&2
            exit 1
          }
          test -n "$COMPETITIVE_WRITER_DB_USERNAME" || fail COMPETITIVE_WRITER_DB_CREDENTIAL_MISSING
          test -n "$COMPETITIVE_WRITER_DB_PASSWORD" || fail COMPETITIVE_WRITER_DB_CREDENTIAL_MISSING
          printf 'production_competitive_configuration=READY gsc_refresh_validation=deferred_until_needed\n'
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Install pinned Deployer
        run: |
          curl -fsSL -o /tmp/dep.phar "https://github.com/deployphp/deployer/releases/download/v${DEPLOYER_VERSION}/deployer.phar"
          printf '%s  /tmp/dep.phar\n' "$DEPLOYER_SHA256" | sha256sum -c -
      - name: Start SSH agent without key metadata output
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          eval "$(ssh-agent -s)" >/dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          printf '%s\n' "$SSH_PRIVATE_KEY" | ssh-add - >/dev/null 2>&1
      - name: Install pinned known_hosts
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Refuse stale or non-forward production activation
        id: baseline
        run: |
          set -euo pipefail
          test "$DEPLOY_HOST" != "$RETIRED_DEPLOY_HOST"
          active="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o ConnectionAttempts=3 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "tr -d '\r\n' < '$DEPLOY_PATH/current/REVISION'")"
          [[ "$active" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$active"
          if ! git merge-base --is-ancestor "$active" "$DEPLOY_SHA"; then
            echo "Candidate is older than or divergent from active production; skip out-of-order activation."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$active" != "$DEPLOY_SHA"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "active=$active" >> "$GITHUB_OUTPUT"
      - name: Deploy once and automatically restore LKG after committed smoke failure
        if: steps.baseline.outputs.skip != 'true'
        env:
          SEO_INTEL_CRAWLER_LOG_SOURCE_AUTHORITY: ${{ secrets.SEO_INTEL_CRAWLER_LOG_SOURCE_AUTHORITY }}
          SEO_INTEL_DB_HOST: ${{ secrets.SEO_INTEL_DB_HOST }}
          SEO_INTEL_DB_PORT: ${{ secrets.SEO_INTEL_DB_PORT }}
          SEO_INTEL_DB_DATABASE: ${{ secrets.SEO_INTEL_DB_DATABASE }}
          SEO_INTEL_DB_USERNAME: ${{ secrets.SEO_INTEL_DB_USERNAME }}
          SEO_INTEL_DB_PASSWORD: ${{ secrets.SEO_INTEL_DB_PASSWORD }}
          SEO_INTEL_MIGRATION_DB_USERNAME: ${{ secrets.SEO_INTEL_MIGRATION_DB_USERNAME }}
          SEO_INTEL_MIGRATION_DB_PASSWORD: ${{ secrets.SEO_INTEL_MIGRATION_DB_PASSWORD }}
          SEO_COUNCIL_DB_USERNAME: ${{ secrets.SEO_COUNCIL_DB_USERNAME }}
          SEO_COUNCIL_DB_PASSWORD: ${{ secrets.SEO_COUNCIL_DB_PASSWORD }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.SEO_INTEL_GSC_SERVICE_ACCOUNT_JSON }}
          GSC_PROPERTY_URL: ${{ secrets.SEO_INTEL_GSC_PROPERTY_URL }}
          GSC_ENABLED: ${{ vars.SEO_INTEL_GSC_ENABLED }}
          GSC_LIVE_API_ENABLED: ${{ vars.SEO_INTEL_GSC_LIVE_API_ENABLED }}
          GSC_SYNC_ENABLED: ${{ vars.SEO_INTEL_GSC_SYNC_ENABLED }}
          GSC_AUTH_MODE: ${{ vars.SEO_INTEL_GSC_AUTH_MODE }}
          GSC_SCOPE: ${{ vars.SEO_INTEL_GSC_SCOPE }}
          GSC_SYNC_WINDOW_DAYS: ${{ vars.SEO_INTEL_GSC_SYNC_WINDOW_DAYS }}
          GSC_SYNC_SEARCH_TYPES: ${{ vars.SEO_INTEL_GSC_SYNC_SEARCH_TYPES }}
          PROXY_PORT: "18445"
        run: |
          set -euo pipefail
          fail() {
            printf 'production_measurement_refresh=HOLD reason=%s\n' "$1" >&2
            exit 1
          }
          competitive_evidence='${{ needs.policy.outputs.seo_competitive_evidence }}'
          council_orchestration='${{ needs.policy.outputs.seo_council_orchestration }}'
          production_council_closeout=false
          if [ "$competitive_evidence" = true ] && [ "$council_orchestration" = true ]; then
            production_council_closeout=true
          fi
          local_key="$RUNNER_TEMP/service-account.json"
          local_env="$RUNNER_TEMP/measurement.env"
          local_writer_env="$RUNNER_TEMP/competitive-writer.env"
          remote_tmp="/tmp/fermatmind-11g-production-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          remote_key="$remote_tmp/service-account.json"
          remote_env="$remote_tmp/measurement.env"
          remote_writer_env="$remote_tmp/competitive-writer.env"
          remote_writer_config="$remote_tmp/competitive-config.php"
          proxy_pid=""
          tunnel_pid=""
          gsc_refresh_configured=false
          ssh_base=(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST")
          cleanup() {
            stop_owned_pid "$tunnel_pid" "ssh -N"
            stop_owned_pid "$proxy_pid" "gsc_restricted_connect_proxy.mjs"
            if [ "$competitive_evidence" = true ]; then
              "${ssh_base[@]}" "rm -f '$remote_key' '$remote_env' '$remote_writer_env' '$remote_tmp/config.php' '$remote_writer_config'; rmdir '$remote_tmp' 2>/dev/null || true" \
                >/dev/null 2>&1 || true
            fi
            rm -f "$local_key" "$local_env" "$local_writer_env"
          }
          stop_owned_pid() {
            local pid="${1:-}" marker="${2:-}"
            [[ "$pid" =~ ^[1-9][0-9]*$ ]] || return 0
            kill -0 "$pid" 2>/dev/null || return 0
            ps -p "$pid" -o command= 2>/dev/null | grep -F -- "$marker" >/dev/null || return 0
            kill "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT HUP INT TERM

          if [ "$competitive_evidence" = true ]; then
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]] || fail RUN_ID_INVALID
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || fail RUN_ATTEMPT_INVALID
          test -n "$SEO_INTEL_MIGRATION_DB_USERNAME" || fail GSC_SYNC_DB_CREDENTIAL_MISSING
          test -n "$SEO_INTEL_MIGRATION_DB_PASSWORD" || fail GSC_SYNC_DB_CREDENTIAL_MISSING

          umask 077
          if [ -n "$GSC_SERVICE_ACCOUNT_JSON" ] \
            && [[ "$GSC_PROPERTY_URL" =~ ^sc-domain:[A-Za-z0-9.-]+$ ]] \
            && [ "$GSC_ENABLED" = true ] && [ "$GSC_LIVE_API_ENABLED" = true ] \
            && [ "$GSC_SYNC_ENABLED" = true ] && [ "$GSC_AUTH_MODE" = service_account ] \
            && [ "$GSC_SCOPE" = https://www.googleapis.com/auth/webmasters.readonly ] \
            && [ "$GSC_SYNC_WINDOW_DAYS" = 90 ] && [ "$GSC_SYNC_SEARCH_TYPES" = web ]; then
            printf '%s' "$GSC_SERVICE_ACCOUNT_JSON" > "$local_key"
            if jq -e '
              .type == "service_account"
              and (.client_email | type == "string" and length > 0)
              and (.private_key | type == "string" and length > 0)
              and .token_uri == "https://oauth2.googleapis.com/token"
            ' "$local_key" >/dev/null; then
              gsc_refresh_configured=true
            fi
          fi
          {
            printf 'SEO_INTEL_GSC_ENABLED=%q\n' "$GSC_ENABLED"
            printf 'SEO_INTEL_GSC_LIVE_API_ENABLED=%q\n' "$GSC_LIVE_API_ENABLED"
            printf 'SEO_INTEL_GSC_SYNC_ENABLED=%q\n' "$GSC_SYNC_ENABLED"
            printf 'SEO_INTEL_GSC_PROPERTY_URL=%q\n' "$GSC_PROPERTY_URL"
            printf 'SEO_INTEL_GSC_AUTH_MODE=%q\n' "$GSC_AUTH_MODE"
            if [ "$gsc_refresh_configured" = true ]; then
              printf 'SEO_INTEL_GSC_SERVICE_ACCOUNT_JSON_PATH=%q\n' "$remote_key"
            else
              printf 'SEO_INTEL_GSC_SERVICE_ACCOUNT_JSON_PATH=\n'
            fi
            printf 'SEO_INTEL_GSC_SCOPE=%q\n' "$GSC_SCOPE"
            printf 'SEO_INTEL_GSC_SYNC_WINDOW_DAYS=%q\n' "$GSC_SYNC_WINDOW_DAYS"
            printf 'SEO_INTEL_GSC_SYNC_SEARCH_TYPES=%q\n' "$GSC_SYNC_SEARCH_TYPES"
            printf 'SEO_INTEL_ALLOW_EXTERNAL_API_CALLS=true\n'
            printf 'SEO_INTEL_WRITE_ENABLED=false\n'
            printf 'SEO_INTEL_DB_USERNAME=%q\n' "$SEO_INTEL_MIGRATION_DB_USERNAME"
            printf 'SEO_INTEL_DB_PASSWORD=%q\n' "$SEO_INTEL_MIGRATION_DB_PASSWORD"
            printf 'HTTPS_PROXY=http://127.0.0.1:%q\n' "$PROXY_PORT"
            printf 'HTTP_PROXY=http://127.0.0.1:%q\n' "$PROXY_PORT"
            printf 'NO_PROXY=127.0.0.1,localhost\n'
            printf 'APP_CONFIG_CACHE=%q\n' "$remote_tmp/config.php"
          } > "$local_env"
          {
            printf 'SEO_INTEL_DB_USERNAME=%q\n' "$SEO_INTEL_MIGRATION_DB_USERNAME"
            printf 'SEO_INTEL_DB_PASSWORD=%q\n' "$SEO_INTEL_MIGRATION_DB_PASSWORD"
            printf 'SEO_INTEL_WRITE_ENABLED=true\n'
            printf 'APP_CONFIG_CACHE=%q\n' "$remote_writer_config"
          } > "$local_writer_env"
          chmod 0600 "$local_env" "$local_writer_env"
          if [ -f "$local_key" ]; then chmod 0600 "$local_key"; fi

          "${ssh_base[@]}" "umask 077; test ! -e '$remote_tmp'; mkdir '$remote_tmp'"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -o ConnectionAttempts=3 -P "$DEPLOY_PORT" "$local_env" \
            "$DEPLOY_USER@$DEPLOY_HOST:$remote_tmp/"
          if [ "$gsc_refresh_configured" = true ]; then
            scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
              -o ConnectionAttempts=3 -P "$DEPLOY_PORT" "$local_key" \
              "$DEPLOY_USER@$DEPLOY_HOST:$remote_key"
          fi
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -o ConnectionAttempts=3 -P "$DEPLOY_PORT" "$local_writer_env" \
            "$DEPLOY_USER@$DEPLOY_HOST:$remote_writer_env"
          "${ssh_base[@]}" "chmod 0600 '$remote_writer_env'"

          if [ "$gsc_refresh_configured" = true ]; then
            node backend/scripts/seo/gsc_restricted_connect_proxy.mjs --port="$PROXY_PORT" \
              >"$RUNNER_TEMP/production-gsc-proxy.log" 2>&1 &
            proxy_pid=$!
            for _ in {1..20}; do
              nc -z 127.0.0.1 "$PROXY_PORT" && break
              sleep 1
            done
            if nc -z 127.0.0.1 "$PROXY_PORT"; then
              ssh -N -o BatchMode=yes -o StrictHostKeyChecking=yes -o ExitOnForwardFailure=yes \
                -o ConnectTimeout=10 -o ConnectionAttempts=3 -o ServerAliveInterval=15 \
                -o ServerAliveCountMax=8 -R "127.0.0.1:$PROXY_PORT:127.0.0.1:$PROXY_PORT" \
                -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
                >"$RUNNER_TEMP/production-gsc-tunnel.log" 2>&1 &
              tunnel_pid=$!
              sleep 2
              if ! kill -0 "$tunnel_pid" 2>/dev/null; then
                stop_owned_pid "$proxy_pid" "gsc_restricted_connect_proxy.mjs"
                proxy_pid=""
                tunnel_pid=""
              fi
            else
              stop_owned_pid "$proxy_pid" "gsc_restricted_connect_proxy.mjs"
              proxy_pid=""
            fi
          fi
          fi

          release="trunk-${DEPLOY_SHA:0:12}-${GITHUB_RUN_ID}"
          candidate_sha="$DEPLOY_SHA"
          lkg_sha='${{ steps.baseline.outputs.active }}'
          deploy_timeout=30m
          if test "$competitive_evidence" = true; then deploy_timeout=35m; fi
          if test "$production_council_closeout" = true; then deploy_timeout=60m; fi
          set +e
          timeout --signal=TERM --kill-after=30s "$deploy_timeout" php /tmp/dep.phar deploy production -f deploy.php --revision "$DEPLOY_SHA" \
            -o release_name="$release" -o deploy_mode=standard \
            -o career_current_parity_required='${{ needs.policy.outputs.career_current }}' \
            -o career_data_recovery='${{ needs.policy.outputs.career_data_recovery }}' \
            -o seo_platform_10_closeout='${{ needs.policy.outputs.seo_platform_10_closeout }}' \
            -o seo_agent_evidence_boundary='${{ needs.policy.outputs.seo_agent_evidence_boundary }}' \
            -o seo_agent_policy_gateway='${{ needs.policy.outputs.seo_agent_policy_gateway }}' \
            -o private_result_authority_publish_required='${{ needs.policy.outputs.private_result_authority_publish_required }}' \
            -o seo_council_orchestration="$production_council_closeout" \
            -o seo_competitive_evidence='${{ needs.policy.outputs.seo_competitive_evidence }}' \
            -o seo_measurement_sync_env="$remote_env" \
            -o seo_competitive_writer_env="$remote_writer_env" --no-interaction
          deploy_rc=$?
          set -e
          if [ "$deploy_rc" -eq 0 ]; then exit 0; fi
          current="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o ConnectionAttempts=3 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "tr -d '\r\n' < '$DEPLOY_PATH/current/REVISION'" || true)"
          if [ "$current" = "$DEPLOY_SHA" ]; then
            echo "Production activation committed but smoke failed; restoring previous LKG once."
            export DEPLOY_SHA="$lkg_sha"
            set +e
            php /tmp/dep.phar rollback production -f deploy.php --no-interaction
            rollback_rc=$?
            set -e

            restored="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o ConnectionAttempts=3 -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "tr -d '\r\n' < '$DEPLOY_PATH/current/REVISION'" || true)"
            safe_restored=""
            if [[ "$restored" =~ ^[0-9a-f]{40}$ ]]; then safe_restored="$restored"; fi

            rollback_command_succeeded=false
            rollback_healthchecks_succeeded=false
            restoration_completed=false
            restoration_mismatch=true
            status=restoration_mismatch
            if [ "$rollback_rc" -eq 0 ]; then
              rollback_command_succeeded=true
              rollback_healthchecks_succeeded=true
            fi
            if [ "$safe_restored" = "$lkg_sha" ]; then
              restoration_completed=true
              restoration_mismatch=false
              status=restored
              if [ "$rollback_rc" -ne 0 ]; then status=restored_smoke_failed; fi
            fi

            jq -n \
              --arg candidate_sha "$candidate_sha" \
              --arg lkg_sha "$lkg_sha" \
              --arg restored_sha "$safe_restored" \
              --arg status "$status" \
              --arg run_id "$GITHUB_RUN_ID" \
              --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
              --argjson rollback_command_succeeded "$rollback_command_succeeded" \
              --argjson rollback_healthchecks_succeeded "$rollback_healthchecks_succeeded" \
              --argjson restoration_completed "$restoration_completed" \
              --argjson restoration_mismatch "$restoration_mismatch" \
              '{schema_version:"fermatmind.deploy_lkg_rollback.v1",status:$status,
                workflow:{run_id:$run_id,run_attempt:$run_attempt},
                candidate_sha:$candidate_sha,lkg_sha:$lkg_sha,
                restored_sha:(if $restored_sha == "" then null else $restored_sha end),
                rollback:{command_succeeded:$rollback_command_succeeded,
                  healthchecks_succeeded:$rollback_healthchecks_succeeded,
                  restoration_completed:$restoration_completed},
                incident:{restoration_mismatch:$restoration_mismatch},sanitized:true}' \
              > lkg-rollback-receipt.json

            if [ "$restoration_completed" != true ]; then
              echo "Production incident: rollback did not restore the exact LKG revision." >&2
              exit 1
            fi
            if [ "$rollback_rc" -ne 0 ]; then
              echo "LKG restoration completed, but rollback healthchecks failed." >&2
            fi
          fi
          cleanup
          trap - EXIT HUP INT TERM
          exit "$deploy_rc"
      - name: Read production competitive evidence receipt
        if: always() && steps.baseline.outputs.skip != 'true' && needs.policy.outputs.seo_competitive_evidence == 'true'
        shell: bash
        run: |
          set -euo pipefail
          receipt=seo-competitive-evidence-production.json
          printf -v q_path '%q' "$DEPLOY_PATH"
          printf -v q_sha '%q' "$DEPLOY_SHA"
          remote="set -euo pipefail; file=$q_path/shared/backend/storage/app/release-receipts/seo-competitive-evidence/$q_sha.json; sudo -n -u www-data -- test -f \"\$file\"; sudo -n -u www-data -- test ! -L \"\$file\"; sudo -n -u www-data -- cat \"\$file\""
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o ConnectionAttempts=3 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "$remote" > "$receipt"
          jq -e --arg sha "$DEPLOY_SHA" '
            .receipt_version == "seo.competitive_evidence_closeout.v3"
            and .candidate_sha == $sha and .production_sha == $sha and .environment == "production"
            and .closeout_state == "CLOSED"
            and ."SEO-PLATFORM-11G" == "CLOSED" and .ready_for_11H == true and ."11i_handoff_ready" == true
            and .competitive_source_state == "available" and .competitive_freshness_state == "fresh"
            and .competitive_bundle_verification == "valid" and .competitive_context_status == "READY"
            and .competitive_hold_reason == "NONE" and .execution_allowed == false
            and .search_measurement.source_state == "available"
            and .search_measurement.freshness_state == "fresh"
            and .search_measurement.bundle_verification == "valid"
            and .search_measurement.context_status == "READY"
            and .search_measurement.hold_reason == "NONE"
            and .cro_measurement.source_state == "available"
            and .cro_measurement.freshness_state == "fresh"
            and .cro_measurement.bundle_verification == "valid"
            and .cro_measurement.context_status == "READY"
            and .cro_measurement.hold_reason == "NONE"
            and .external_calls == 0 and .production_permissions == 0
          ' "$receipt" >/dev/null
      - name: Read production SEO Evidence closeout receipt
        if: steps.baseline.outputs.skip != 'true' && needs.policy.outputs.seo_agent_evidence_boundary == 'true'
        shell: bash
        run: |
          set -euo pipefail
          receipt=seo-agent-evidence-boundary-production.json
          printf -v q_path '%q' "$DEPLOY_PATH"
          printf -v q_sha '%q' "$DEPLOY_SHA"
          remote="set -euo pipefail; file=$q_path/shared/backend/storage/app/release-receipts/seo-agent-evidence-boundary/$q_sha.json; sudo -n -u www-data -- test -f \"\$file\"; sudo -n -u www-data -- test ! -L \"\$file\"; sudo -n -u www-data -- cat \"\$file\""
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o ConnectionAttempts=3 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "$remote" > "$receipt"
          jq -e --arg sha "$DEPLOY_SHA" '
            .contract_version == "seo.evidence_boundary_closeout.v4"
            and .release_sha == $sha
            and .execution_allowed == false
            and .bundle_write_enabled == false
            and .context_build_enabled == false
            and .external_fetch_enabled == false
            and .retention_delete_enabled == false
            and .query_hmac_dual_write_enabled == false
            and .agent_external_egress == false
            and .allowed_sources_count == 0
            and .model_calls == 0 and .tool_calls == 0 and .external_calls == 0 and .business_writes == 0
            and .negative_guarantees.agent_runtime_created == false
            and .negative_guarantees.agent_write_permissions == 0
            and .negative_guarantees.cms_write == 0
            and .negative_guarantees.search_submission == 0
            and .negative_guarantees.url_truth_write == 0
            and .self_checks.metadata_privacy_probes == {
              total:52,
              factory:{total:19,rejected:19,bypass:0},
              verifier:{total:27,rejected:27,bypass:0},
              context_builder:{total:6,held:6,fully_sanitized:6,bypass:0}
            }
            and .self_checks.payment_identifier_evasion_probes == {
              malicious_total:9,rejected:9,bypass:0,
              scanner:{total:3,rejected:3,bypass:0},
              factory:{total:3,rejected:3,bypass:0},
              verifier:{total:3,rejected:3,bypass:0},
              valid_hash_chain:{total:3,passed:3},valid_hash_false_positive:0
            }
            and (.receipt_hash | test("^[a-f0-9]{64}$"))
          ' "$receipt" >/dev/null
      - name: Read production Policy Gateway closeout receipt
        if: steps.baseline.outputs.skip != 'true' && needs.policy.outputs.seo_agent_policy_gateway == 'true'
        shell: bash
        run: |
          set -euo pipefail
          receipt=seo-agent-policy-gateway-production.json
          printf -v q_path '%q' "$DEPLOY_PATH"
          printf -v q_sha '%q' "$DEPLOY_SHA"
          remote="set -euo pipefail; file=$q_path/shared/backend/storage/app/release-receipts/seo-agent-policy-gateway/$q_sha.json; sudo -n -u www-data -- test -f \"\$file\"; sudo -n -u www-data -- test ! -L \"\$file\"; sudo -n -u www-data -- cat \"\$file\""
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o ConnectionAttempts=3 -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" "$remote" > "$receipt"
          jq -e --arg sha "$DEPLOY_SHA" '
            .contract_version == "seo.policy_gateway_closeout.v2"
            and .release_sha == $sha and .state == "DEPLOYED_DISABLED"
            and .mode == "DETERMINISTIC_DENY_ONLY"
            and .decision_allow_count == 0
            and .admission_bypass == 0 and .execution_bypass == 0
            and .manifest_bypass == 0 and .entrypoint_bypass == 0
            and .l4_allow_count == 0
            and .active_manifest_count == 0 and .trusted_signing_key_count == 0
            and .model_calls == 0 and .tool_calls == 0 and .external_calls == 0
            and .business_writes == 0 and .cms_writes == 0
            and .url_truth_writes == 0 and .search_submissions == 0
            and .manifest_contract.total == 3 and .manifest_contract.rejected == 3 and .manifest_contract.bypass == 0
            and (.manifest_contract.probes | map("\(.probe_id):\(.outcome):\(.reason_code)")) == [
              "review_state_invalid:REJECTED:MANIFEST_CONTRACT_INVALID",
              "authority_revision_empty:REJECTED:MANIFEST_CONTRACT_INVALID",
              "canary_stage_empty:REJECTED:MANIFEST_CONTRACT_INVALID"
