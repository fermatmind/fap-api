name: MBTI W1 Target Authority Draft Receipt

on:
  workflow_dispatch:
    inputs:
      expected_control_plane_sha:
        description: Exact latest main SHA containing this controlled receipt executor
        required: true
        type: string
      expected_active_revision:
        description: Exact active production application SHA used only to bootstrap the CMS authority connection
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mbti-w1-target-authority-draft-receipt
  cancel-in-progress: false

jobs:
  controlled-target-authority-receipt:
    name: Write and read back exact inactive draft targets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout exact control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.expected_control_plane_sha }}
          fetch-depth: 1

      - name: Verify immutable approval and control-plane contract
        shell: bash
        env:
          EXPECTED_CONTROL_PLANE_SHA: ${{ inputs.expected_control_plane_sha }}
          EXPECTED_ACTIVE_REVISION: ${{ inputs.expected_active_revision }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$EXPECTED_CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_ACTIVE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_CONTROL_PLANE_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_CONTROL_PLANE_SHA"
          printf '%s  %s\n' \
            5455bc63ea094bb2adb11576d29a67f812a9189b6ddeadcebd0c20ac2dc5b5d6 backend/content_assets/en-content-parity/CONTROL-approvals/W1-MBTI-COMPARISONS/target-authority-draft-receipt-approval-2026-08-01.json \
            ba793884a5517f1194edab787c99a5be5159a2660954a15deb6cf0659544fa40 backend/content_assets/en-content-parity/CONTROL-approvals/W1-MBTI-RESULT-CONTENT/target-authority-draft-receipt-approval-2026-08-01.json \
            | sha256sum -c -
          jq -e '
            .approval_owner == "human_operator" and .subscope_id == "W1-MBTI-COMPARISONS" and
            .package_sha256 == "deecc8175fb43ba3730d6513b496a0ab6834459108e3b24e25550bbf40e001a2" and
            .gate == "target_authority_draft_receipt" and .verdict == "APPROVED" and
            .permissions.target_authority_draft_write_authorized == true and
            .permissions.target_authority_readback_authorized == true and
            .permissions.publish_authorized == false and .permissions.activation_authorized == false and
            .permissions.active_pointer_authorized == false and .permissions.indexability_authorized == false and
            .permissions.sitemap_authorized == false and .permissions.hreflang_authorized == false and
            .permissions.llms_authorized == false and .permissions.json_ld_authorized == false and
            .permissions.search_submission_authorized == false and .permissions.deployment_authorized == false and
            .permissions.private_result_read_authorized == false and .permissions.attempt_report_order_payment_read_authorized == false
          ' backend/content_assets/en-content-parity/CONTROL-approvals/W1-MBTI-COMPARISONS/target-authority-draft-receipt-approval-2026-08-01.json >/dev/null
          jq -e '
            .approval_owner == "human_operator" and .subscope_id == "W1-MBTI-RESULT-CONTENT" and
            .package_sha256 == "9325013b870fd2496efc0882656240f91ce28ff4faaf1da42fb3dde3577b0ed3" and
            .gate == "target_authority_draft_receipt" and .verdict == "APPROVED" and
            .permissions.target_authority_draft_write_authorized == true and
            .permissions.target_authority_readback_authorized == true and
            .permissions.publish_authorized == false and .permissions.activation_authorized == false and
            .permissions.active_pointer_authorized == false and .permissions.indexability_authorized == false and
            .permissions.sitemap_authorized == false and .permissions.hreflang_authorized == false and
            .permissions.llms_authorized == false and .permissions.json_ld_authorized == false and
            .permissions.search_submission_authorized == false and .permissions.deployment_authorized == false and
            .permissions.private_result_read_authorized == false and .permissions.attempt_report_order_payment_read_authorized == false
          ' backend/content_assets/en-content-parity/CONTROL-approvals/W1-MBTI-RESULT-CONTENT/target-authority-draft-receipt-approval-2026-08-01.json >/dev/null

      - name: Set up pinned production SSH identity
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known hosts
        shell: bash
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS"
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null || ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f ~/.ssh/known_hosts >/dev/null

      - name: Execute exact authority write and readback without deployment
        shell: bash
        env:
          DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
          CONTROL_PLANE_SHA: ${{ inputs.expected_control_plane_sha }}
          ACTIVE_REVISION: ${{ inputs.expected_active_revision }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ && "$DEPLOY_PATH" != *".."* ]]
          run_dir="/tmp/mbti-w1-target-authority-receipt-${GITHUB_RUN_ID}"
          bundle="$RUNNER_TEMP/mbti-w1-target-authority-input.tgz"
          tar -C "$GITHUB_WORKSPACE" -czf "$bundle" \
            backend/scripts/mbti_target_authority_draft_receipt.php \
            backend/content_assets/en-content-parity/W1-mbti/comparisons/w9-correction-deecc817 \
            backend/content_assets/en-content-parity/W1-mbti/result-content \
            backend/content_assets/en-content-parity/CONTROL-approvals/W1-MBTI-COMPARISONS/target-authority-draft-receipt-approval-2026-08-01.json \
            backend/content_assets/en-content-parity/CONTROL-approvals/W1-MBTI-RESULT-CONTENT/target-authority-draft-receipt-approval-2026-08-01.json
          scp -P "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$bundle" "$DEPLOY_USER@$DEPLOY_HOST:$run_dir.tgz"
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' RUN_DIR='$run_dir' CONTROL_PLANE_SHA='$CONTROL_PLANE_SHA' ACTIVE_REVISION='$ACTIVE_REVISION' bash -s" <<'REMOTE'
          set -euo pipefail
          current="$(readlink -f "$DEPLOY_PATH/current")"
          test -d "$current/backend"
          test -f "$current/REVISION"
          test "$(tr -d '\r\n' < "$current/REVISION")" = "$ACTIVE_REVISION"
          test ! -e "$DEPLOY_PATH/.dep/deploy.lock"
          mkdir -p "$RUN_DIR/input" "$RUN_DIR/receipts"
          tar -xzf "$RUN_DIR.tgz" -C "$RUN_DIR/input"
          set +e
          php "$RUN_DIR/input/backend/scripts/mbti_target_authority_draft_receipt.php" \
            --backend-root="$current/backend" \
            --source-backend-root="$RUN_DIR/input/backend" \
            --receipt-dir="$RUN_DIR/receipts" \
            --control-plane-sha="$CONTROL_PLANE_SHA" \
            --active-revision="$ACTIVE_REVISION" \
            >"$RUN_DIR/executor.stdout" 2>"$RUN_DIR/executor.stderr"
          executor_status=$?
          set -e
          if [ "$executor_status" -ne 0 ]; then
            printf '%s\n' 'target_authority_receipt_failed' >&2
            exit "$executor_status"
          fi
          jq -e '.status == "PASS" and .row_count == 7 and .publish_attempted == false and .activation_attempted == false and .active_pointer_changed == false and .indexability_attempted == false and .deploy_attempted == false and .private_authority_read_attempted == false' "$RUN_DIR/receipts/comparison-target-authority-draft-receipt.json" >/dev/null
          jq -e '.status == "PASS" and .row_count == 46 and .authority_content_row_count == 21 and .publish_attempted == false and .activation_attempted == false and .active_pointer_changed == false and .indexability_attempted == false and .deploy_attempted == false and .private_authority_read_attempted == false' "$RUN_DIR/receipts/result-target-authority-draft-receipt.json" >/dev/null
          REMOTE
          mkdir -p "$RUNNER_TEMP/mbti-w1-target-authority-receipts"
          scp -r -P "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST:$run_dir/receipts/." "$RUNNER_TEMP/mbti-w1-target-authority-receipts/"

      - name: Publish immutable target-authority receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mbti-w1-target-authority-draft-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mbti-w1-target-authority-receipts
          if-no-files-found: warn
          retention-days: 90
