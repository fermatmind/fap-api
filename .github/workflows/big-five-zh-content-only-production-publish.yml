name: Big Five ZH Content-only Production Publish

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preflight is read-only; publish writes the exact 112-asset zh-CN cohort"
        required: true
        default: preflight
        type: choice
        options: [preflight, publish]
      expected_release_sha:
        description: "Exact deployed fap-api release SHA"
        required: true
        type: string
      expected_package_sha256:
        description: "Exact SHA-256 of the locked zh-CN content-only release package"
        required: true
        default: "9d15f0da6fca3d9c317c35d00abf078aaf9d03f740ece6ed388f53ad05c89494"
        type: string

permissions:
  contents: read

concurrency:
  group: big-five-zh-content-only-production-publish
  cancel-in-progress: false

jobs:
  production-publish:
    name: Big Five ZH content-only (${{ inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
    env:
      DEPLOY_USER: ubuntu
      DEPLOY_HOST: 139.224.130.204
      DEPLOY_PORT: "22"
      DEPLOY_PATH: /var/www/fap-api
      PACKAGE_RELATIVE_PATH: generated/big-five-authority-v2/big5-authority-v2-zh-content-only-release/release-package.json
      EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
      EXPECTED_PACKAGE_SHA256: ${{ inputs.expected_package_sha256 }}
      OPERATION_MODE: ${{ inputs.mode }}

    steps:
      - name: Validate bounded inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$EXPECTED_PACKAGE_SHA256" = "9d15f0da6fca3d9c317c35d00abf078aaf9d03f740ece6ed388f53ad05c89494"
          case "$OPERATION_MODE" in preflight|publish) ;; *) exit 2 ;; esac

      - name: Set up production SSH identity
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known hosts
        shell: bash
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify deployed release and run exact publisher
        shell: bash
        run: |
          set -euo pipefail
          receipt_dir="$RUNNER_TEMP/big-five-zh-content-only"
          mkdir -p "$receipt_dir"

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' PACKAGE_RELATIVE_PATH='$PACKAGE_RELATIVE_PATH' EXPECTED_RELEASE_SHA='$EXPECTED_RELEASE_SHA' EXPECTED_PACKAGE_SHA256='$EXPECTED_PACKAGE_SHA256' OPERATION_MODE='$OPERATION_MODE' bash -s" \
            <<'REMOTE' | tee "$receipt_dir/receipt.txt"
          set -euo pipefail

          RELEASE_ROOT="$DEPLOY_PATH/current"
          BACKEND_ROOT="$RELEASE_ROOT/backend"
          PACKAGE="$RELEASE_ROOT/$PACKAGE_RELATIVE_PATH"
          REPORT="/tmp/big-five-zh-content-only-${OPERATION_MODE}.json"
          test -d "$BACKEND_ROOT"
          test -f "$PACKAGE"

          if [ -f "$RELEASE_ROOT/REVISION" ]; then
            DEPLOYED_SHA="$(tr -d '\r\n' < "$RELEASE_ROOT/REVISION")"
          else
            DEPLOYED_SHA="$(git -C "$RELEASE_ROOT" rev-parse HEAD)"
          fi
          echo "deployed_release_sha=$DEPLOYED_SHA"
          test "$DEPLOYED_SHA" = "$EXPECTED_RELEASE_SHA"

          ACTUAL_PACKAGE_SHA256="$(sha256sum "$PACKAGE" | awk '{print $1}')"
          echo "package_sha256=$ACTUAL_PACKAGE_SHA256"
          test "$ACTUAL_PACKAGE_SHA256" = "$EXPECTED_PACKAGE_SHA256"

          cd "$BACKEND_ROOT"
          if [ "$OPERATION_MODE" = "publish" ]; then
            php artisan personality:big-five-authority-v2-zh-content-publish \
              --execute --json --output="$REPORT" --no-ansi
          else
            php artisan personality:big-five-authority-v2-zh-content-publish \
              --json --output="$REPORT" --no-ansi
          fi

          php -r '
          $report = json_decode((string) file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR);
          $mode = $argv[2];
          $expectedCounts = [
              "CMS Article" => 56,
              "CMS content_pages" => 2,
              "CMS landing_surfaces/page_blocks" => 1,
              "CMS personality_public_content_assets" => 52,
              "CMS topic_profiles" => 1,
          ];
          if (($report["ok"] ?? false) !== true
              || ($report["asset_count"] ?? null) !== 112
              || ($report["surface_counts"] ?? null) !== $expectedCounts
              || ($report["media_deferred_by_operator_count"] ?? null) !== 112
              || ($report["media_library_write_count"] ?? null) !== 0
              || ($report["frontend_fallback_write_count"] ?? null) !== 0
              || ($report["english_write_count"] ?? null) !== 0) {
              throw new RuntimeException("bounded release report failed");
          }
          if ($mode === "preflight") {
              if (($report["status"] ?? null) !== "PASS_ZH_CONTENT_ONLY_PREFLIGHT"
                  || ($report["writes_committed"] ?? null) !== false) {
                  throw new RuntimeException("preflight report failed");
              }
          } elseif (($report["status"] ?? null) !== "PASS_ZH_CONTENT_ONLY_RELEASE"
              || ($report["writes_committed"] ?? null) !== true
              || ($report["public_release_count"] ?? null) !== 112
              || ($report["readback"]["ok"] ?? false) !== true
              || ($report["readback"]["public_count"] ?? null) !== 112
              || ($report["readback"]["zh6_faq_count"] ?? null) !== 35
              || ($report["readback"]["issues"] ?? null) !== []) {
              throw new RuntimeException("publish readback report failed");
          }
          echo "bounded_release_report=pass\n";
          ' "$REPORT" "$OPERATION_MODE"
          cat "$REPORT"
          REMOTE

      - name: Publish production receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: big-five-zh-content-only-${{ inputs.mode }}-receipt
          path: ${{ runner.temp }}/big-five-zh-content-only/receipt.txt
          if-no-files-found: warn
          retention-days: 30
