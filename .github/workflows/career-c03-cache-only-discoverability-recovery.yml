            --arg timing_sha "$FAILED_TIMING_RECEIPT_SHA256" \
            --arg c02_run "$C02_REPAIR_RUN_ID" \
            --arg c02_sha "$C02_REPAIR_RECEIPT_SHA256" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --argjson inspect "$(<"$inspect")" \
            --argjson public "$(<"$public")" '
            {
              contract_version: "career.c03.cache_only_discoverability_recovery.v1",
              mode: "incident_closeout",
              status: "PASS_INCIDENT_CLOSED",
              control_plane_sha: $control,
              active_revision: $active,
              runner_sha256: $runner,
              public_readback_runner_sha256: $readback_runner,
              workflow_run_id: ($run_id | tonumber),
              workflow_run_attempt: ($attempt | tonumber),
              failed_deploy_run_id: ($failed_run | tonumber),
              failed_deploy_run_attempt: ($failed_attempt | tonumber),
              failed_deploy_sha: "8e352dc727e131101f741be99a0a69f4178a7329",
              failed_deploy_timing_receipt_sha256: $timing_sha,
              superseded_incident_receipt_sha256: $failed_incident_sha,
              old_incident_artifact_superseded: true,
              corrected_facts: {
                standard_deploy_attempted: true,
                migration_execution_attempted: true,
                migration_applied: true,
                career_detail_cache_operation_completed: true,
                career_directory_rebuild_completed: true,
                sitemap_source_rebuild_completed: true,
                career_pre_sitemap_gate_passed: true,
                career_post_sitemap_gate_passed: true,
                terminal_failure_task: "guard:public-dns-health",
                symlink_changed: false,
                php_fpm_restarted: false,
                nginx_restarted: false,
                queue_reloaded: false
              },
              failed_run_standard_deploy_execution_count: 1,
              failed_run_migration_execution_count: 1,
              failed_run_career_detail_cache_operation_count: 1,
              failed_run_career_directory_rebuild_count: 1,
              failed_run_sitemap_source_rebuild_count: 1,
              c02_repair_run_id: ($c02_run | tonumber),
              c02_repair_receipt_sha256: $c02_sha,
              authority_artifact_sha256: $authority,
              authority_inventory: $inspect.authority_inventory,
              published_cohort: $inspect.authority,
              public_readback: $public.expected,
              surface_diagnostics: $public.surface_diagnostics,
              shared_surface_readback: $public.shared_surface_readback,
              public_timeout_count: $public.detail_readback.timeout_count,
              public_transport_retry_count: $public.detail_readback.transport_retry_count,
              public_recovered_transport_failure_count: $public.detail_readback.recovered_transport_failure_count,
              public_recovered_incomplete_transfer_count: $public.detail_readback.recovered_incomplete_transfer_count,
              public_terminal_transport_failure_count: $public.detail_readback.terminal_transport_failure_count,
              public_incomplete_transfer_count: $public.detail_readback.incomplete_transfer_count,
              public_other_transport_failure_count: $public.detail_readback.other_transport_failure_count,
              public_5xx_count: $public.detail_readback.server_error_count,
              public_non_200_count: $public.detail_readback.non_200_count,
