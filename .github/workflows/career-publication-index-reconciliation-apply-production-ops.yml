name: Career Publication Index Reconciliation Apply Production Ops

on:
  workflow_dispatch:
    inputs:
      expected_control_plane_sha:
        description: Exact latest main SHA containing this apply control
        required: true
        type: string
      expected_release_sha:
        description: Exact active production application SHA
        required: true
        type: string
      expected_release_name:
        description: Exact active production release name
        required: true
        type: string
      preflight_run_id:
        description: Fresh successful exact reconciliation preflight run id
        required: true
        type: string
      preflight_run_attempt:
        description: Exact preflight run attempt
        required: true
        type: string
      expected_preflight_receipt_sha256:
        description: Exact immutable preflight receipt SHA-256
        required: true
        type: string
      expected_preflight_artifact_digest:
        description: Exact GitHub artifact digest including sha256 prefix
        required: true
        type: string
      expected_current_db_state_sha256:
        description: Exact current DB latest-state hash from the preflight receipt
        required: true
        type: string
      operator_approval_phrase:
        description: Exact receipt and release-bound approval for this one transaction
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-${{ github.repository }}-production
  cancel-in-progress: false

jobs:
  apply:
    name: Apply exact receipt-covered publication/index reconciliation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      CONTROL_PLANE_SHA: ${{ inputs.expected_control_plane_sha }}
      EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
      EXPECTED_RELEASE_NAME: ${{ inputs.expected_release_name }}
      PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
      PREFLIGHT_RUN_ATTEMPT: ${{ inputs.preflight_run_attempt }}
      EXPECTED_PREFLIGHT_RECEIPT_SHA256: ${{ inputs.expected_preflight_receipt_sha256 }}
      EXPECTED_PREFLIGHT_ARTIFACT_DIGEST: ${{ inputs.expected_preflight_artifact_digest }}
      EXPECTED_CURRENT_DB_STATE_SHA256: ${{ inputs.expected_current_db_state_sha256 }}
      OPERATOR_APPROVAL_PHRASE: ${{ inputs.operator_approval_phrase }}
      FROZEN_MANIFEST_SHA256: ef4d43eeaa0300534b36fd77d7806bcbe065de1fb13f158ceda1517f259207c5
      BASELINE_SET_SHA256: 39cc766fb18c85d385b83f0ac1f56a8b97d46481d3e9a12de0588abbaf640060
      RECEIPT_SET_SHA256: 09ec67befe967e1619a40578c47b862743883717b048da802ee7ef3551a0747f
      TARGET_SET_SHA256: 3b101fb76b5666200c73519c650beb1a5b0b35f47f7592453bf5671920571a18
      EMPTY_SET_SHA256: 01ba4719c80b6fe911b091a7c05124b64eeece964e09c058ef8f9805daca546b
      DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
      DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
      RETIRED_DEPLOY_HOST: ${{ secrets.PRODUCTION_RETIRED_DEPLOY_HOST }}
      DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Initialize sanitized failure receipt before checkout
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/career-publication-index-reconciliation-apply.json"
          jq -n \
            --arg control "$CONTROL_PLANE_SHA" \
            --arg release "$EXPECTED_RELEASE_SHA" \
            --arg preflight "$PREFLIGHT_RUN_ID" \
            --arg attempt "$PREFLIGHT_RUN_ATTEMPT" \
            --arg current "$EXPECTED_CURRENT_DB_STATE_SHA256" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{
              contract_version: "career.publication_index_reconciliation_apply.v2",
              mode: "apply",
              status: "FAIL_APPLY_INITIALIZATION",
              failed_stage: "initialize",
              control_plane_sha: $control,
              release_sha: $release,
              preflight_run_id: ($preflight | tonumber? // 0),
              preflight_run_attempt: ($attempt | tonumber? // 0),
              preflight_current_state_sha256: $current,
              workflow_run_id: ($run_id | tonumber),
              workflow_run_attempt: ($run_attempt | tonumber),
              production_apply_execution: false,
              writes_committed: null,
              database_transaction_committed: false,
              cms_write_count: 0,
              cache_write_count: 0,
              artifact_write_count: 0,
              projection_write_count: 0,
              ledger_write_count: 0,
              deployment_count: 0,
              migration_count: 0,
              sitemap_write_count: 0,
              llms_write_count: 0,
              search_submission_count: 0,
              automatic_retry_allowed: false
            }' > "$receipt"

      - name: Checkout exact control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.expected_control_plane_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate latest main and bounded inputs
        shell: bash
        run: |
          set -euo pipefail
          numeric='^[1-9][0-9]*$'
          sha40='^[0-9a-f]{40}$'
          sha64='^[0-9a-f]{64}$'
          digest='^sha256:[0-9a-f]{64}$'
          release='^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
          test "$GITHUB_REF" = refs/heads/main
          [[ "$CONTROL_PLANE_SHA" =~ $sha40 ]]
          [[ "$EXPECTED_RELEASE_SHA" =~ $sha40 ]]
          [[ "$EXPECTED_RELEASE_NAME" =~ $release ]]
          [[ "$PREFLIGHT_RUN_ID" =~ $numeric ]]
          [[ "$PREFLIGHT_RUN_ATTEMPT" =~ $numeric ]]
          [[ "$EXPECTED_PREFLIGHT_RECEIPT_SHA256" =~ $sha64 ]]
          [[ "$EXPECTED_PREFLIGHT_ARTIFACT_DIGEST" =~ $digest ]]
          [[ "$EXPECTED_CURRENT_DB_STATE_SHA256" =~ $sha64 ]]
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$CONTROL_PLANE_SHA"
          test "$(git rev-parse origin/main)" = "$CONTROL_PLANE_SHA"
          test "$GITHUB_SHA" = "$CONTROL_PLANE_SHA"
          git cat-file -e "${EXPECTED_RELEASE_SHA}^{commit}"
          git merge-base --is-ancestor "$EXPECTED_RELEASE_SHA" "$CONTROL_PLANE_SHA"
          test "$(sha256sum backend/docs/seo/generated/detail-ready-1046-rollout-manifest.v2.json | awk '{print $1}')" = "$FROZEN_MANIFEST_SHA256"
          php -l backend/scripts/operations/career_publication_index_reconciliation_apply.php >/dev/null

      - name: Validate fresh immutable preflight receipt and artifact digest
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/preflight"
          mkdir -p "$evidence"
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREFLIGHT_RUN_ID}")"
          jq -e \
            --arg control "$CONTROL_PLANE_SHA" \
            --arg attempt "$PREFLIGHT_RUN_ATTEMPT" '
            .event == "workflow_dispatch"
            and .head_sha == $control
            and .head_branch == "main"
            and .path == ".github/workflows/career-publication-index-reconciliation-preflight-production-ops.yml"
            and .run_attempt == ($attempt | tonumber)
            and .status == "completed"
            and .conclusion == "success"
            and (.updated_at | type == "string")' <<<"$run_json" >/dev/null
          completed_at="$(jq -er '.updated_at' <<<"$run_json")"
          completed_epoch="$(date -u -d "$completed_at" +%s)"
          now_epoch="$(date -u +%s)"
          age_seconds="$((now_epoch - completed_epoch))"
          test "$age_seconds" -ge 0
          test "$age_seconds" -le 21600

          artifact_name="career-publication-index-reconciliation-preflight-${PREFLIGHT_RUN_ID}-${PREFLIGHT_RUN_ATTEMPT}"
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREFLIGHT_RUN_ID}/artifacts?per_page=100")"
          jq -e --arg name "$artifact_name" --arg digest "$EXPECTED_PREFLIGHT_ARTIFACT_DIGEST" '
            [.artifacts[] | select(.name == $name)]
            | length == 1 and .[0].expired == false and .[0].digest == $digest' \
            <<<"$artifacts" >/dev/null
          gh run download "$PREFLIGHT_RUN_ID" --name "$artifact_name" --dir "$evidence"
          preflight="$evidence/career-publication-index-reconciliation-preflight.json"
          test -f "$preflight"
          test ! -L "$preflight"
          test "$(sha256sum "$preflight" | awk '{print $1}')" = "$EXPECTED_PREFLIGHT_RECEIPT_SHA256"
          release_name_sha256="$(printf '%s' "$EXPECTED_RELEASE_NAME" | sha256sum | awk '{print $1}')"
          jq -e \
            --arg control "$CONTROL_PLANE_SHA" \
            --arg release "$EXPECTED_RELEASE_SHA" \
            --arg release_name_sha "$release_name_sha256" \
            --arg run_id "$PREFLIGHT_RUN_ID" \
            --arg attempt "$PREFLIGHT_RUN_ATTEMPT" \
            --arg current "$EXPECTED_CURRENT_DB_STATE_SHA256" '
            .contract_version == "career.publication_index_reconciliation_preflight.v2"
            and .mode == "preflight"
            and .status == "PASS_SELECT_ONLY_RECONCILIATION_PREFLIGHT"
            and .control_plane_sha == $control
            and .release_sha == $release
            and .release_name_sha256 == $release_name_sha
            and .workflow_run_id == ($run_id | tonumber)
            and .workflow_run_attempt == ($attempt | tonumber)
            and .manifest_sha256 == "ef4d43eeaa0300534b36fd77d7806bcbe065de1fb13f158ceda1517f259207c5"
            and .manifest.baseline_count == 30
            and .manifest.baseline_set_sha256 == "39cc766fb18c85d385b83f0ac1f56a8b97d46481d3e9a12de0588abbaf640060"
            and .manifest.delta_count == 1016
            and .manifest.delta_set_sha256 == "09ec67befe967e1619a40578c47b862743883717b048da802ee7ef3551a0747f"
            and .manifest.target_count == 1046
            and .manifest.target_set_sha256 == "3b101fb76b5666200c73519c650beb1a5b0b35f47f7592453bf5671920571a18"
            and .receipt_authority.exact_delta_receipt_authority == true
            and .receipt_authority.authentic_receipt_count == 1016
            and .receipt_authority.authentic_receipt_set_sha256 == "09ec67befe967e1619a40578c47b862743883717b048da802ee7ef3551a0747f"
            and .receipt_authority.missing_receipt_count == 0
            and .receipt_authority.outside_target_count == 0
            and .receipt_authority.baseline_overlap_count == 0
            and .database_latest_index_state.receipt_covered_count == 1016
            and .database_latest_index_state.current_state_row_count == 1016
            and .database_latest_index_state.current_state_sha256 == $current
            and (.database_latest_index_state.matching_count + .database_latest_index_state.missing_or_mismatching_count == 1016)
            and .database_latest_index_state.latest_state_tie_count == 0
            and .database_select_only == true
            and .database_write_count == 0
            and .cms_write_count == 0
            and .cache_write_count == 0
            and .artifact_write_count == 0
            and .publication_write_count == 0
            and .writes_committed == false
            and .zero_write_guarantee == true
            and .automatic_retry_allowed == false' "$preflight" >/dev/null

          expected_phrase="I explicitly approve one exact Career publication/index reconciliation transaction for control plane SHA ${CONTROL_PLANE_SHA} active SHA ${EXPECTED_RELEASE_SHA} release ${EXPECTED_RELEASE_NAME}, fresh preflight run ${PREFLIGHT_RUN_ID} attempt ${PREFLIGHT_RUN_ATTEMPT}, receipt ${EXPECTED_PREFLIGHT_RECEIPT_SHA256}, artifact ${EXPECTED_PREFLIGHT_ARTIFACT_DIGEST}, and current DB state ${EXPECTED_CURRENT_DB_STATE_SHA256}; restore only the exact 1016 receipt-covered slugs, preserve the baseline 30, write only exact index_states rows, perform no deploy, migration, CMS/cache/artifact/projection/ledger/sitemap/llms/Search action, and do not automatically retry."
          test "$OPERATOR_APPROVAL_PHRASE" = "$expected_phrase"

      - name: Validate protected production topology
        shell: bash
        run: |
          set -euo pipefail
          for name in DEPLOY_USER DEPLOY_PORT DEPLOY_HOST RETIRED_DEPLOY_HOST DEPLOY_PATH SSH_KNOWN_HOSTS; do
            test -n "${!name:-}"
          done
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          test "$DEPLOY_PORT" -ge 1
          test "$DEPLOY_PORT" -le 65535
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$RETIRED_DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          test "$DEPLOY_HOST" != "$RETIRED_DEPLOY_HOST"
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_PATH" != *".."* ]]
          echo "Protected production topology validated without disclosing values."

      - name: Start pinned SSH agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known hosts
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null \
            || ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f ~/.ssh/known_hosts >/dev/null

      - name: Execute one bounded transaction without automatic retry
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/career-publication-index-reconciliation-apply.json"
          remote_receipt="$RUNNER_TEMP/career-publication-index-reconciliation-apply.remote.json"
          printf -v q_deploy_path '%q' "$DEPLOY_PATH"
          printf -v q_control '%q' "$CONTROL_PLANE_SHA"
          printf -v q_release '%q' "$EXPECTED_RELEASE_SHA"
          printf -v q_release_name '%q' "$EXPECTED_RELEASE_NAME"
          printf -v q_preflight_run '%q' "$PREFLIGHT_RUN_ID"
          printf -v q_preflight_attempt '%q' "$PREFLIGHT_RUN_ATTEMPT"
          printf -v q_preflight_receipt '%q' "$EXPECTED_PREFLIGHT_RECEIPT_SHA256"
          printf -v q_preflight_artifact '%q' "$EXPECTED_PREFLIGHT_ARTIFACT_DIGEST"
          printf -v q_current_state '%q' "$EXPECTED_CURRENT_DB_STATE_SHA256"
          printf -v q_run_id '%q' "$GITHUB_RUN_ID"
          printf -v q_run_attempt '%q' "$GITHUB_RUN_ATTEMPT"

          set +e
          timeout --signal=TERM --kill-after=10s 300s \
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
              -o ServerAliveInterval=20 -o ServerAliveCountMax=12 \
              -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "set -euo pipefail; current=\$(readlink -f $q_deploy_path/current); release=\$(readlink -f $q_deploy_path/releases/$q_release_name); test -n \"\$current\"; test \"\$current\" = \"\$release\"; test \"\$(tr -d '\\r\\n' < \"\$current/REVISION\")\" = $q_release; test ! -e $q_deploy_path/.dep/deploy.lock; test \"\$(ps -eo comm=,args= | awk '\$1 == \"php\" && (\$0 ~ /dep(\\.phar)? .* production/ || \$0 ~ /artisan migrate/ || \$0 ~ /queue:reload-workers/ || \$0 ~ /career_publication_index_reconciliation/) {n++} \$1 == \"composer\" && \$0 ~ /install/ {n++} END {print n+0}')\" = 0; CAREER_RECONCILIATION_BACKEND_ROOT=\"\$current/backend\" CAREER_RECONCILIATION_CONTROL_PLANE_SHA=$q_control CAREER_RECONCILIATION_RELEASE_SHA=$q_release CAREER_RECONCILIATION_RELEASE_NAME=$q_release_name CAREER_RECONCILIATION_PREFLIGHT_RUN_ID=$q_preflight_run CAREER_RECONCILIATION_PREFLIGHT_RUN_ATTEMPT=$q_preflight_attempt CAREER_RECONCILIATION_PREFLIGHT_RECEIPT_SHA256=$q_preflight_receipt CAREER_RECONCILIATION_PREFLIGHT_ARTIFACT_DIGEST=$q_preflight_artifact CAREER_RECONCILIATION_EXPECTED_CURRENT_STATE_SHA256=$q_current_state CAREER_RECONCILIATION_RUN_ID=$q_run_id CAREER_RECONCILIATION_RUN_ATTEMPT=$q_run_attempt php /dev/stdin apply" \
              < backend/scripts/operations/career_publication_index_reconciliation_apply.php \
              > "$remote_receipt" 2>/dev/null
          remote_status=$?
          set -e

          if jq -e '
            .contract_version == "career.publication_index_reconciliation_apply.v2"
            and .mode == "apply"
            and (.status | type == "string")' "$remote_receipt" >/dev/null 2>&1; then
            mv "$remote_receipt" "$receipt"
          else
            jq '.status = "HOLD_REMOTE_APPLY_OUTCOME_AMBIGUOUS"
                | .failed_stage = "remote_transport_or_receipt_invalid"
                | .production_apply_execution = true
                | .writes_committed = null
                | .database_transaction_committed = false' \
              "$receipt" > "$receipt.next"
            mv "$receipt.next" "$receipt"
          fi
          exit "$remote_status"

      - name: Validate sanitized exact post-write receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/career-publication-index-reconciliation-apply.json"
          release_name_sha256="$(printf '%s' "$EXPECTED_RELEASE_NAME" | sha256sum | awk '{print $1}')"
          jq -e \
            --arg control "$CONTROL_PLANE_SHA" \
            --arg release "$EXPECTED_RELEASE_SHA" \
            --arg release_name_sha "$release_name_sha256" \
            --arg preflight_run "$PREFLIGHT_RUN_ID" \
            --arg preflight_attempt "$PREFLIGHT_RUN_ATTEMPT" \
            --arg preflight_receipt "$EXPECTED_PREFLIGHT_RECEIPT_SHA256" \
            --arg preflight_artifact "$EXPECTED_PREFLIGHT_ARTIFACT_DIGEST" \
            --arg current "$EXPECTED_CURRENT_DB_STATE_SHA256" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" '
            .contract_version == "career.publication_index_reconciliation_apply.v2"
            and .mode == "apply"
            and .status == "PASS_EXACT_RECONCILIATION_APPLY"
            and .control_plane_sha == $control
            and .release_sha == $release
            and .release_name_sha256 == $release_name_sha
            and .preflight_run_id == ($preflight_run | tonumber)
            and .preflight_run_attempt == ($preflight_attempt | tonumber)
            and .preflight_receipt_sha256 == $preflight_receipt
            and .preflight_artifact_digest == $preflight_artifact
            and .preflight_current_state_sha256 == $current
            and .before_database_latest_index_state.current_state_sha256 == $current
            and .workflow_run_id == ($run_id | tonumber)
            and .workflow_run_attempt == ($run_attempt | tonumber)
            and .manifest_sha256 == "ef4d43eeaa0300534b36fd77d7806bcbe065de1fb13f158ceda1517f259207c5"
            and .manifest.baseline_count == 30
            and .manifest.baseline_set_sha256 == "39cc766fb18c85d385b83f0ac1f56a8b97d46481d3e9a12de0588abbaf640060"
            and .manifest.delta_count == 1016
            and .manifest.delta_set_sha256 == "09ec67befe967e1619a40578c47b862743883717b048da802ee7ef3551a0747f"
            and .manifest.target_count == 1046
            and .manifest.target_set_sha256 == "3b101fb76b5666200c73519c650beb1a5b0b35f47f7592453bf5671920571a18"
            and .receipt_authority.receipt_covered_count == 1016
            and .receipt_authority.receipt_covered_set_sha256 == "09ec67befe967e1619a40578c47b862743883717b048da802ee7ef3551a0747f"
            and .receipt_authority.missing_receipt_count == 0
            and .receipt_authority.outside_target_count == 0
            and .receipt_authority.baseline_overlap_count == 0
            and .postwrite_readback.receipt_covered_count == 1016
            and .postwrite_readback.matching_latest_state_count == 1016
            and .postwrite_readback.matching_latest_state_set_sha256 == "09ec67befe967e1619a40578c47b862743883717b048da802ee7ef3551a0747f"
            and .postwrite_readback.missing_latest_state_count == 0
            and .postwrite_readback.missing_latest_state_set_sha256 == "01ba4719c80b6fe911b091a7c05124b64eeece964e09c058ef8f9805daca546b"
            and .postwrite_readback.outside_target_count == 0
            and .postwrite_readback.outside_target_set_sha256 == "01ba4719c80b6fe911b091a7c05124b64eeece964e09c058ef8f9805daca546b"
            and .postwrite_readback.baseline_preserved_count == 30
            and .postwrite_readback.baseline_preserved_set_sha256 == "39cc766fb18c85d385b83f0ac1f56a8b97d46481d3e9a12de0588abbaf640060"
            and .allowed_database_write.table == "index_states"
            and .allowed_database_write.index_state_values == ["indexed"]
            and .allowed_database_write.index_eligible_values == [true]
            and .allowed_database_write.canonical_target_values == [null]
            and .allowed_database_write.receipt_slug_set_sha256 == "09ec67befe967e1619a40578c47b862743883717b048da802ee7ef3551a0747f"
            and .database_insert_count >= 0
            and .database_insert_count <= 1016
            and .database_update_count == 0
            and .database_delete_count == 0
            and .database_transaction_committed == true
            and .writes_committed == true
            and .production_apply_execution == true
            and .cms_write_count == 0
            and .cache_write_count == 0
            and .artifact_write_count == 0
            and .projection_write_count == 0
            and .ledger_write_count == 0
            and .deployment_count == 0
            and .migration_count == 0
            and .sitemap_write_count == 0
            and .llms_write_count == 0
            and .search_submission_count == 0
            and .automatic_retry_allowed == false' "$receipt" >/dev/null

      - name: Upload immutable sanitized apply receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: career-publication-index-reconciliation-apply-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/career-publication-index-reconciliation-apply.json
          if-no-files-found: error
          retention-days: 90
