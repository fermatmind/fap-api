name: Enneagram CMS Production Ops

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact deployed fap-api release SHA (40 lowercase hex characters)
        required: true
        type: string
      operator_approval_phrase:
        description: Exact SHA-bound human approval phrase
        required: true
        type: string
      operation_mode:
        description: Inspect is read-only; write performs the guarded CMS import and promotion.
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - write

permissions:
  contents: read

concurrency:
  group: enneagram-cms-production-ops
  cancel-in-progress: false

jobs:
  import-and-promote-en13:
    name: Inspect or import EN13 as noindex content
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    env:
      DEPLOY_HOST: "139.224.130.204"
      DEPLOY_PATH: "/var/www/fap-api"
      DEPLOY_PORT: "22"
      DEPLOY_USER: "ubuntu"
      RELEASE_SHA: ${{ inputs.release_sha }}
      OPERATOR_APPROVAL_PHRASE: ${{ inputs.operator_approval_phrase }}
      OPERATION_MODE: ${{ inputs.operation_mode }}
      PACKAGE_PATH: "docs/seo/personality/enneagram/content-packages/en13-cms-v1/enneagram-en13-cms-package-v1.json"
      QA_PATH: "docs/seo/personality/enneagram/en13-content-qa-01.json"

    steps:
      - name: Validate SHA-bound approval
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_sha must be 40 lowercase hexadecimal characters." >&2
            exit 2
          fi
          expected="Approve ENNEAGRAM-EN13 CMS import and noindex promotion for SHA ${RELEASE_SHA}"
          if [ "$OPERATOR_APPROVAL_PHRASE" != "$expected" ]; then
            echo "operator_approval_phrase does not match the exact SHA-bound phrase." >&2
            exit 2
          fi
          case "$OPERATION_MODE" in
            inspect|write) ;;
            *) echo "operation_mode must be inspect or write." >&2; exit 2 ;;
          esac

      - name: Checkout authorized revision
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Verify authorized revision belongs to main
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$RELEASE_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main

      - name: Hash immutable EN13 inputs
        id: inputs_hash
        shell: bash
        run: |
          set -euo pipefail
          test -r "$PACKAGE_PATH"
          test -r "$QA_PATH"
          echo "package_sha=$(sha256sum "$PACKAGE_PATH" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "qa_sha=$(sha256sum "$QA_PATH" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known hosts
        shell: bash
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null \
            || ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f ~/.ssh/known_hosts >/dev/null

      - name: Inspect or import EN13 without release side effects
        shell: bash
        env:
          PACKAGE_SHA: ${{ steps.inputs_hash.outputs.package_sha }}
          QA_SHA: ${{ steps.inputs_hash.outputs.qa_sha }}
          OPERATION_MODE: ${{ inputs.operation_mode }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          target="$DEPLOY_USER@$DEPLOY_HOST"
          run_dir="/tmp/enneagram-cms-ops-${GITHUB_RUN_ID}"

          printf -v q_deploy_path '%q' "$DEPLOY_PATH"
          printf -v q_release_sha '%q' "$RELEASE_SHA"
          printf -v q_package_path '%q' "$PACKAGE_PATH"
          printf -v q_qa_path '%q' "$QA_PATH"
          printf -v q_package_sha '%q' "$PACKAGE_SHA"
          printf -v q_qa_sha '%q' "$QA_SHA"
          printf -v q_run_dir '%q' "$run_dir"
          printf -v q_operation_mode '%q' "$OPERATION_MODE"

          set +e
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -p "$DEPLOY_PORT" "$target" \
            "DEPLOY_PATH=$q_deploy_path RELEASE_SHA=$q_release_sha PACKAGE_PATH=$q_package_path QA_PATH=$q_qa_path PACKAGE_SHA=$q_package_sha QA_SHA=$q_qa_sha RUN_DIR=$q_run_dir OPERATION_MODE=$q_operation_mode bash -s" <<'REMOTE'
          set -Eeuo pipefail
          phase="remote_bootstrap"
          mkdir -p "$RUN_DIR"
          write_failure_summary() {
            local exit_code=$?
            trap - ERR
            jq -n \
              --arg release_sha "$RELEASE_SHA" \
              --arg operation_mode "$OPERATION_MODE" \
              --arg phase "$phase" \
              --argjson exit_code "$exit_code" \
              '{schema_version:"enneagram_cms_production_ops.v2", outcome:"failure", release_sha:$release_sha, operation_mode:$operation_mode, failed_phase:$phase, exit_code:$exit_code}' \
              > "$RUN_DIR/summary.json" || true
            exit "$exit_code"
          }
          trap write_failure_summary ERR

          phase="release_root"
          cd "$DEPLOY_PATH/current"
          phase="deployed_revision"
          if [ -f REVISION ]; then
            deployed_sha="$(tr -d '\r\n' < REVISION)"
          else
            deployed_sha="$(git rev-parse HEAD)"
          fi
          test "$deployed_sha" = "$RELEASE_SHA"
          phase="backend_root"
          cd backend
          test -f artisan
          phase="package_readability"
          test -r "../$PACKAGE_PATH"
          test -r "../$QA_PATH"
          phase="package_hash"
          printf '%s  %s\n' "$PACKAGE_SHA" "../$PACKAGE_PATH" | sha256sum -c -
          printf '%s  %s\n' "$QA_SHA" "../$QA_PATH" | sha256sum -c -

          phase="draft_inspect"
          php artisan personality:enneagram-cms-draft \
            --package="../$PACKAGE_PATH" --qa="../$QA_PATH" --dry-run --update-existing --json \
            --output="$RUN_DIR/draft-dry-run.json" >/dev/null

          phase="promotion_inspect"
          promotion_inspect_status=0
          if php artisan personality:enneagram-cms-promote \
            --package="../$PACKAGE_PATH" --dry-run --json \
            --output="$RUN_DIR/promote-dry-run.json" >/dev/null; then
            promotion_inspect_status=0
          else
            promotion_inspect_status=$?
          fi

          phase="promotion_inspect_classification"
          promotion_inspect_state="$(jq -r '
            if
              .ok == true and .status == "pass" and .row_count == 13 and
              .writes_attempted == false and .writes_committed == false and
              .publish_attempted == false and .index_attempted == false and
              .sitemap_llms_release_attempted == false and .search_release_attempted == false and
              .missing_target_count == 0 and .forbidden_route_count == 0 and
              .stale_or_invalid_asset_count == 0 and (.errors | length) == 0
            then "ready"
            elif
              .ok == false and .status == "fail" and .row_count == 13 and
              .writes_attempted == false and .writes_committed == false and
              .publish_attempted == false and .index_attempted == false and
              .sitemap_llms_release_attempted == false and .search_release_attempted == false and
              .missing_target_count == 13 and .forbidden_route_count == 0 and
              .stale_or_invalid_asset_count == 0 and (.errors | length) == 13 and
              all(.errors[]; .code == "missing_draft_asset")
            then "first_import_missing_drafts"
            else "blocked"
            end
          ' "$RUN_DIR/promote-dry-run.json")"
          case "$promotion_inspect_state" in
            ready)
              test "$promotion_inspect_status" -eq 0
              ;;
            first_import_missing_drafts)
              test "$promotion_inspect_status" -ne 0
              ;;
            *)
              exit 1
              ;;
          esac

          phase="operation_mode"
          if [ "$OPERATION_MODE" = "inspect" ]; then
            phase="inspect_summary"
            jq -n \
              --arg release_sha "$RELEASE_SHA" \
              --arg operation_mode "$OPERATION_MODE" \
              --arg package_sha "$PACKAGE_SHA" \
              --arg qa_sha "$QA_SHA" \
              --arg promotion_inspect_state "$promotion_inspect_state" \
              --argjson promotion_inspect_exit_code "$promotion_inspect_status" \
              --slurpfile draft "$RUN_DIR/draft-dry-run.json" \
              --slurpfile promote "$RUN_DIR/promote-dry-run.json" \
              'def action_counts: (.rows // [] | map(.action // "unknown") | sort | group_by(.) | map({action:.[0], count:length}));
               {
                 schema_version:"enneagram_cms_production_ops.v2",
                 outcome:"success",
                 release_sha:$release_sha,
                 operation_mode:$operation_mode,
                 package_sha256:$package_sha,
                 qa_sha256:$qa_sha,
                 inspection:{
                   draft:($draft[0]|{
                     ok,status,row_count,hub_row_count,center_row_count,core_type_row_count,writes_attempted,writes_committed,would_create_asset_count,created_asset_count,updated_asset_count,skipped_existing_count,publish_attempted,index_attempted,sitemap_llms_release_attempted,search_release_attempted,
                     error_count:(.errors|length),action_counts:action_counts
                   }),
                   promotion:($promote[0]|{
                     inspection_state:$promotion_inspect_state,command_exit_code:$promotion_inspect_exit_code,
                     ok,status,row_count,hub_row_count,center_row_count,core_type_row_count,writes_attempted,writes_committed,would_promote_count,promoted_count,skipped_existing_count,missing_target_count,forbidden_route_count,stale_or_invalid_asset_count,publish_attempted,index_attempted,sitemap_llms_release_attempted,search_release_attempted,
                     error_count:(.errors|length),action_counts:action_counts
                   })
                 }
               }' > "$RUN_DIR/summary.json"
            exit 0
          fi

          phase="draft_write"
          php artisan personality:enneagram-cms-draft \
            --package="../$PACKAGE_PATH" --qa="../$QA_PATH" --write --update-existing --json \
            --draft-only --no-publish --no-index --no-sitemap --no-llms --no-search-release \
            --operator-approved=ENNEAGRAM-CMS-DRAFT-WRITER-CONTRACT-01 \
            --output="$RUN_DIR/draft-write.json" >/dev/null

          phase="promotion_reinspect"
          php artisan personality:enneagram-cms-promote \
            --package="../$PACKAGE_PATH" --dry-run --json \
            --output="$RUN_DIR/promote-after-draft-dry-run.json" >/dev/null
          jq -e '
            .ok == true and .status == "pass" and .row_count == 13 and
            .writes_attempted == false and .writes_committed == false and
            .publish_attempted == false and .index_attempted == false and
            .sitemap_llms_release_attempted == false and .search_release_attempted == false and
            ((.would_promote_count + .skipped_existing_count) == 13) and
            .missing_target_count == 0 and .forbidden_route_count == 0 and
            .stale_or_invalid_asset_count == 0 and (.errors | length) == 0
          ' "$RUN_DIR/promote-after-draft-dry-run.json" >/dev/null

          phase="promotion_write"
          php artisan personality:enneagram-cms-promote \
            --package="../$PACKAGE_PATH" --write --json \
            --promote-live-content --no-publish --no-index --no-sitemap --no-llms --no-search-release \
            --operator-approved=ENNEAGRAM-CMS-PROMOTION-CONTRACT-01 \
            --output="$RUN_DIR/promote-write.json" >/dev/null

          phase="write_summary"
          jq -n \
            --arg release_sha "$RELEASE_SHA" \
            --arg operation_mode "$OPERATION_MODE" \
            --arg package_sha "$PACKAGE_SHA" \
            --arg qa_sha "$QA_SHA" \
            --arg prewrite_promotion_inspect_state "$promotion_inspect_state" \
            --argjson prewrite_promotion_inspect_exit_code "$promotion_inspect_status" \
            --slurpfile dry "$RUN_DIR/draft-dry-run.json" \
            --slurpfile prewrite_inspect_promote "$RUN_DIR/promote-dry-run.json" \
            --slurpfile inspect_promote "$RUN_DIR/promote-after-draft-dry-run.json" \
            --slurpfile draft "$RUN_DIR/draft-write.json" \
            --slurpfile promote "$RUN_DIR/promote-write.json" \
            '{
              schema_version:"enneagram_cms_production_ops.v2",
              outcome:"success",
              release_sha:$release_sha,
              operation_mode:$operation_mode,
              package_sha256:$package_sha,
              qa_sha256:$qa_sha,
              dry_run:($dry[0]|{ok,status,row_count,writes_attempted,writes_committed,would_create_asset_count,created_asset_count,updated_asset_count,skipped_existing_count,publish_attempted,index_attempted,sitemap_llms_release_attempted,search_release_attempted,error_count:(.errors|length)}),
              prewrite_promotion_inspect:($prewrite_inspect_promote[0]|{inspection_state:$prewrite_promotion_inspect_state,command_exit_code:$prewrite_promotion_inspect_exit_code,ok,status,row_count,writes_attempted,writes_committed,would_promote_count,promoted_count,skipped_existing_count,missing_target_count,forbidden_route_count,stale_or_invalid_asset_count,publish_attempted,index_attempted,sitemap_llms_release_attempted,search_release_attempted,error_count:(.errors|length)}),
              promotion_inspect:($inspect_promote[0]|{ok,status,row_count,writes_attempted,writes_committed,would_promote_count,promoted_count,skipped_existing_count,missing_target_count,forbidden_route_count,stale_or_invalid_asset_count,publish_attempted,index_attempted,sitemap_llms_release_attempted,search_release_attempted,error_count:(.errors|length)}),
              draft_write:($draft[0]|{ok,status,row_count,created_asset_count,updated_asset_count,skipped_existing_count,writes_committed,publish_attempted,index_attempted,sitemap_llms_release_attempted,search_release_attempted,error_count:(.errors|length)}),
              promote_write:($promote[0]|{ok,status,row_count,promoted_count,skipped_existing_count,writes_committed,publish_attempted,index_attempted,sitemap_llms_release_attempted,search_release_attempted,error_count:(.errors|length)})
            }' \
            > "$RUN_DIR/summary.json"
          REMOTE
          remote_status=$?
          set -e

          summary_status=0
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -P "$DEPLOY_PORT" "$target:$run_dir/summary.json" artifacts/summary.json \
            || summary_status=$?
          if [ "$summary_status" -ne 0 ]; then
            jq -n \
              --arg release_sha "$RELEASE_SHA" \
              --arg operation_mode "$OPERATION_MODE" \
              --arg phase "summary_transfer" \
              --argjson remote_exit_code "$remote_status" \
              --argjson summary_transfer_exit_code "$summary_status" \
              '{schema_version:"enneagram_cms_production_ops.v2", outcome:"failure", release_sha:$release_sha, operation_mode:$operation_mode, failed_phase:$phase, remote_exit_code:$remote_exit_code, summary_transfer_exit_code:$summary_transfer_exit_code}' \
              > artifacts/summary.json
          fi
          if [ "$remote_status" -ne 0 ]; then
            exit "$remote_status"
          fi
          jq -e '
            if .operation_mode == "inspect" then
              .outcome == "success" and
              .inspection.draft.ok == true and .inspection.draft.row_count == 13 and .inspection.draft.writes_attempted == false and .inspection.draft.writes_committed == false and .inspection.draft.error_count == 0 and
              all([.inspection.draft][]; .publish_attempted == false and .index_attempted == false and .sitemap_llms_release_attempted == false and .search_release_attempted == false) and
              .inspection.promotion.row_count == 13 and .inspection.promotion.writes_attempted == false and .inspection.promotion.writes_committed == false and
              all([.inspection.promotion][]; .publish_attempted == false and .index_attempted == false and .sitemap_llms_release_attempted == false and .search_release_attempted == false) and
              (
                (.inspection.promotion.inspection_state == "ready" and .inspection.promotion.command_exit_code == 0 and .inspection.promotion.ok == true and .inspection.promotion.missing_target_count == 0 and .inspection.promotion.forbidden_route_count == 0 and .inspection.promotion.stale_or_invalid_asset_count == 0 and .inspection.promotion.error_count == 0) or
                (.inspection.promotion.inspection_state == "first_import_missing_drafts" and .inspection.promotion.command_exit_code != 0 and .inspection.promotion.ok == false and .inspection.promotion.missing_target_count == 13 and .inspection.promotion.forbidden_route_count == 0 and .inspection.promotion.stale_or_invalid_asset_count == 0 and .inspection.promotion.error_count == 13)
              )
            else
              .outcome == "success" and
              .dry_run.ok == true and .dry_run.row_count == 13 and .dry_run.writes_attempted == false and
              (.prewrite_promotion_inspect.inspection_state == "first_import_missing_drafts" or .prewrite_promotion_inspect.inspection_state == "ready") and
              .draft_write.ok == true and .draft_write.row_count == 13 and
              ((.draft_write.created_asset_count + .draft_write.updated_asset_count + .draft_write.skipped_existing_count) == 13) and
              .promotion_inspect.ok == true and .promotion_inspect.row_count == 13 and .promotion_inspect.writes_attempted == false and .promotion_inspect.writes_committed == false and
              ((.promotion_inspect.would_promote_count + .promotion_inspect.skipped_existing_count) == 13) and
              .promotion_inspect.missing_target_count == 0 and .promotion_inspect.forbidden_route_count == 0 and .promotion_inspect.stale_or_invalid_asset_count == 0 and .promotion_inspect.error_count == 0 and
              .promote_write.ok == true and .promote_write.row_count == 13 and
              ((.promote_write.promoted_count + .promote_write.skipped_existing_count) == 13) and
              all([.dry_run, .draft_write, .promotion_inspect, .promote_write][]; .publish_attempted == false and .index_attempted == false and .sitemap_llms_release_attempted == false and .search_release_attempted == false and .error_count == 0)
            end
          ' artifacts/summary.json >/dev/null

      - name: Upload redacted operation summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enneagram-cms-production-ops-summary
          path: artifacts/summary.json
          if-no-files-found: warn
