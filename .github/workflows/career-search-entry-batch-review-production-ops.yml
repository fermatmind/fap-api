name: Career Search Entry Batch Review Production Ops

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preflight is zero-write; bind records exact approved-all review evidence only
        required: true
        type: choice
        options:
          - preflight
          - bind
      expected_control_plane_sha:
        description: Exact latest main SHA containing this control plane
        required: true
        type: string
      expected_release_sha:
        description: Exact active production application SHA
        required: true
        type: string
      expected_release_name:
        description: Exact active production release name
        required: true
        type: string
      actor_admin_user_id:
        description: Exact configured solo-owner admin user ID
        required: true
        default: "1"
        type: string
      expected_state_sha256:
        description: Bind only; immutable preflight state SHA
        required: false
        default: ""
        type: string
      expected_quality_package_sha256:
        description: Bind only; exact quality package SHA
        required: false
        default: ""
        type: string
      expected_review_package_sha256:
        description: Bind only; exact review package SHA
        required: false
        default: ""
        type: string
      expected_target_set_sha256:
        description: Bind only; exact review target-set SHA
        required: false
        default: ""
        type: string
      preflight_run_id:
        description: Bind only; immutable successful preflight run
        required: false
        default: ""
        type: string
      preflight_run_attempt:
        description: Bind only; immutable successful preflight attempt
        required: false
        default: ""
        type: string
      operator_approval_phrase:
        description: Bind only; exact receipt-bound approval phrase
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: career-search-entry-batch-review-production-ops
  cancel-in-progress: false

jobs:
  eligibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.validate.outputs.mode }}
      control_plane_sha: ${{ steps.validate.outputs.control_plane_sha }}
      release_sha: ${{ steps.validate.outputs.release_sha }}
      release_name: ${{ steps.validate.outputs.release_name }}
      actor_admin_user_id: ${{ steps.validate.outputs.actor_admin_user_id }}
      expected_state_sha256: ${{ steps.validate.outputs.expected_state_sha256 }}
      expected_quality_package_sha256: ${{ steps.validate.outputs.expected_quality_package_sha256 }}
      expected_review_package_sha256: ${{ steps.validate.outputs.expected_review_package_sha256 }}
      expected_target_set_sha256: ${{ steps.validate.outputs.expected_target_set_sha256 }}
    steps:
      - name: Checkout exact control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.expected_control_plane_sha }}
          fetch-depth: 0

      - name: Validate latest main and immutable review preflight
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          EXPECTED_CONTROL_PLANE_SHA: ${{ inputs.expected_control_plane_sha }}
          EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
          EXPECTED_RELEASE_NAME: ${{ inputs.expected_release_name }}
          ACTOR_ADMIN_USER_ID: ${{ inputs.actor_admin_user_id }}
          EXPECTED_STATE_SHA256: ${{ inputs.expected_state_sha256 }}
          EXPECTED_QUALITY_PACKAGE_SHA256: ${{ inputs.expected_quality_package_sha256 }}
          EXPECTED_REVIEW_PACKAGE_SHA256: ${{ inputs.expected_review_package_sha256 }}
          EXPECTED_TARGET_SET_SHA256: ${{ inputs.expected_target_set_sha256 }}
          PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
          PREFLIGHT_RUN_ATTEMPT: ${{ inputs.preflight_run_attempt }}
          OPERATOR_APPROVAL_PHRASE: ${{ inputs.operator_approval_phrase }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$EXPECTED_CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_RELEASE_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          [[ "$ACTOR_ADMIN_USER_ID" =~ ^[1-9][0-9]*$ ]]
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_CONTROL_PLANE_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_CONTROL_PLANE_SHA"
          test "$EXPECTED_RELEASE_SHA" = "$EXPECTED_CONTROL_PLANE_SHA"
          git merge-base --is-ancestor "$EXPECTED_RELEASE_SHA" origin/main

          if [ "$MODE" = "preflight" ]; then
            test -z "$EXPECTED_STATE_SHA256"
            test -z "$PREFLIGHT_RUN_ID"
            test -z "$PREFLIGHT_RUN_ATTEMPT"
            test -z "$OPERATOR_APPROVAL_PHRASE"
          else
            [[ "$EXPECTED_STATE_SHA256" =~ ^[0-9a-f]{64}$ ]]
            [[ "$EXPECTED_QUALITY_PACKAGE_SHA256" =~ ^[0-9a-f]{64}$ ]]
            [[ "$EXPECTED_REVIEW_PACKAGE_SHA256" =~ ^[0-9a-f]{64}$ ]]
            [[ "$EXPECTED_TARGET_SET_SHA256" =~ ^[0-9a-f]{64}$ ]]
            [[ "$PREFLIGHT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$PREFLIGHT_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
            run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREFLIGHT_RUN_ID}")"
            jq -e \
              --arg sha "$EXPECTED_CONTROL_PLANE_SHA" \
              --argjson attempt "$PREFLIGHT_RUN_ATTEMPT" \
              '.name == "Career Search Entry Batch Review Production Ops"
               and .path == ".github/workflows/career-search-entry-batch-review-production-ops.yml"
               and .event == "workflow_dispatch"
               and .status == "completed"
               and .conclusion == "success"
               and .head_branch == "main"
               and .head_sha == $sha
               and .run_attempt == $attempt' <<<"$run_json" >/dev/null
            receipt_dir="$(mktemp -d)"
            gh run download "$PREFLIGHT_RUN_ID" \
              --name "career-search-entry-batch-review-preflight-${PREFLIGHT_RUN_ID}-${PREFLIGHT_RUN_ATTEMPT}" \
              --dir "$receipt_dir"
            receipt="$receipt_dir/career-search-entry-batch-review-production-ops.json"
            jq -e \
              --arg release "$EXPECTED_RELEASE_SHA" \
              --arg release_name "$EXPECTED_RELEASE_NAME" \
              --arg state "$EXPECTED_STATE_SHA256" \
              --arg quality "$EXPECTED_QUALITY_PACKAGE_SHA256" \
              --arg review "$EXPECTED_REVIEW_PACKAGE_SHA256" \
              --arg targets "$EXPECTED_TARGET_SET_SHA256" \
              --argjson actor "$ACTOR_ADMIN_USER_ID" \
              '.contract_version == "career.search_entry_batch.review.production_ops.v1"
               and .status == "PASS_PREFLIGHT"
               and .release_sha == $release
               and .release_name == $release_name
               and .preflight_state_sha256 == $state
               and .quality_package_sha256 == $quality
               and .review_package_sha256 == $review
               and .target_set_sha256 == $targets
               and .actor_admin_user_id == $actor
               and .candidate_count == 50
               and .bilingual_url_count == 100
               and .review_target_count == 300
               and .review_write_count == 0
               and .publication_write_count == 0
               and .indexability_write_count == 0
               and .cache_write_count == 0
               and .queue_dispatch_count == 0
               and .sitemap_write_count == 0
               and .llms_write_count == 0
               and .search_channel_action_count == 0
               and .url_submission_count == 0
               and .deploy_count == 0' "$receipt" >/dev/null
            expected_phrase="I explicitly approve Career search-entry batch review binding for SHA ${EXPECTED_RELEASE_SHA} release ${EXPECTED_RELEASE_NAME} preflight run ${PREFLIGHT_RUN_ID} attempt ${PREFLIGHT_RUN_ATTEMPT} state ${EXPECTED_STATE_SHA256} quality package ${EXPECTED_QUALITY_PACKAGE_SHA256} review package ${EXPECTED_REVIEW_PACKAGE_SHA256} target set ${EXPECTED_TARGET_SET_SHA256} actor ${ACTOR_ADMIN_USER_ID}; bind exactly 300 approved-all review targets and keep apply, publication, indexability, cache, queue, sitemap, llms, Search Channel, URL submission, and deploy held."
            test "$OPERATOR_APPROVAL_PHRASE" = "$expected_phrase"
          fi
          {
            echo "mode=$MODE"
            echo "control_plane_sha=$EXPECTED_CONTROL_PLANE_SHA"
            echo "release_sha=$EXPECTED_RELEASE_SHA"
            echo "release_name=$EXPECTED_RELEASE_NAME"
            echo "actor_admin_user_id=$ACTOR_ADMIN_USER_ID"
            echo "expected_state_sha256=$EXPECTED_STATE_SHA256"
            echo "expected_quality_package_sha256=$EXPECTED_QUALITY_PACKAGE_SHA256"
            echo "expected_review_package_sha256=$EXPECTED_REVIEW_PACKAGE_SHA256"
            echo "expected_target_set_sha256=$EXPECTED_TARGET_SET_SHA256"
          } >> "$GITHUB_OUTPUT"

  operate:
    needs: eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: deploy-${{ github.repository }}-production
      cancel-in-progress: false
    env:
      DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
      DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
      RETIRED_DEPLOY_HOST: ${{ secrets.PRODUCTION_RETIRED_DEPLOY_HOST }}
      DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
      MODE: ${{ needs.eligibility.outputs.mode }}
      CONTROL_PLANE_SHA: ${{ needs.eligibility.outputs.control_plane_sha }}
      EXPECTED_RELEASE_SHA: ${{ needs.eligibility.outputs.release_sha }}
      EXPECTED_RELEASE_NAME: ${{ needs.eligibility.outputs.release_name }}
      ACTOR_ADMIN_USER_ID: ${{ needs.eligibility.outputs.actor_admin_user_id }}
      EXPECTED_STATE_SHA256: ${{ needs.eligibility.outputs.expected_state_sha256 }}
      EXPECTED_QUALITY_PACKAGE_SHA256: ${{ needs.eligibility.outputs.expected_quality_package_sha256 }}
      EXPECTED_REVIEW_PACKAGE_SHA256: ${{ needs.eligibility.outputs.expected_review_package_sha256 }}
      EXPECTED_TARGET_SET_SHA256: ${{ needs.eligibility.outputs.expected_target_set_sha256 }}
    steps:
      - name: Checkout exact control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.eligibility.outputs.control_plane_sha }}
          fetch-depth: 1

      - name: Validate protected production topology
        shell: bash
        run: |
          set -euo pipefail
          for name in DEPLOY_USER DEPLOY_PORT DEPLOY_HOST RETIRED_DEPLOY_HOST DEPLOY_PATH; do
            test -n "${!name:-}"
          done
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          test "$DEPLOY_PORT" -ge 1
          test "$DEPLOY_PORT" -le 65535
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$RETIRED_DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          test "$DEPLOY_HOST" != "$RETIRED_DEPLOY_HOST"
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_PATH" != *".."* ]]
          echo "Protected production topology validated without disclosing values."

      - name: Set up SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known hosts
        shell: bash
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null \
            || ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f ~/.ssh/known_hosts >/dev/null

      - name: Run exact review phase against active release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          printf -v q_mode '%q' "$MODE"
          printf -v q_path '%q' "$DEPLOY_PATH"
          printf -v q_sha '%q' "$EXPECTED_RELEASE_SHA"
          printf -v q_name '%q' "$EXPECTED_RELEASE_NAME"
          printf -v q_actor '%q' "$ACTOR_ADMIN_USER_ID"
          printf -v q_state '%q' "$EXPECTED_STATE_SHA256"
          printf -v q_quality '%q' "$EXPECTED_QUALITY_PACKAGE_SHA256"
          printf -v q_review '%q' "$EXPECTED_REVIEW_PACKAGE_SHA256"
          printf -v q_targets '%q' "$EXPECTED_TARGET_SET_SHA256"
          set +e
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "CAREER_REVIEW_MODE=$q_mode DEPLOY_PATH=$q_path EXPECTED_RELEASE_SHA=$q_sha EXPECTED_RELEASE_NAME=$q_name ACTOR_ADMIN_USER_ID=$q_actor EXPECTED_STATE_SHA256=$q_state EXPECTED_QUALITY_PACKAGE_SHA256=$q_quality EXPECTED_REVIEW_PACKAGE_SHA256=$q_review EXPECTED_TARGET_SET_SHA256=$q_targets bash -s" \
            < backend/scripts/career/career_search_entry_batch_review_production_ops.sh \
            > artifacts/remote-receipt.json
          remote_status=$?
          set -e
          jq \
            --arg control "$CONTROL_PLANE_SHA" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            '. + {
              control_plane_sha: $control,
              workflow_run_id: $run_id,
              workflow_run_attempt: $run_attempt
            }' artifacts/remote-receipt.json \
            > artifacts/career-search-entry-batch-review-production-ops.json
          test "$remote_status" -eq 0
          if [ "$MODE" = "preflight" ]; then
            state="$(jq -er '.preflight_state_sha256' artifacts/career-search-entry-batch-review-production-ops.json)"
            quality="$(jq -er '.quality_package_sha256' artifacts/career-search-entry-batch-review-production-ops.json)"
            review="$(jq -er '.review_package_sha256' artifacts/career-search-entry-batch-review-production-ops.json)"
            targets="$(jq -er '.target_set_sha256' artifacts/career-search-entry-batch-review-production-ops.json)"
            phrase="I explicitly approve Career search-entry batch review binding for SHA ${EXPECTED_RELEASE_SHA} release ${EXPECTED_RELEASE_NAME} preflight run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT} state ${state} quality package ${quality} review package ${review} target set ${targets} actor ${ACTOR_ADMIN_USER_ID}; bind exactly 300 approved-all review targets and keep apply, publication, indexability, cache, queue, sitemap, llms, Search Channel, URL submission, and deploy held."
            jq --arg phrase "$phrase" '. + {exact_bind_approval_phrase: $phrase}' \
              artifacts/career-search-entry-batch-review-production-ops.json \
              > artifacts/final.json
            mv artifacts/final.json artifacts/career-search-entry-batch-review-production-ops.json
          fi

      - name: Upload sanitized immutable receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: career-search-entry-batch-review-${{ needs.eligibility.outputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/career-search-entry-batch-review-production-ops.json
          if-no-files-found: error
          retention-days: 90
