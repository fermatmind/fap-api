name: Career detail production cache repair

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "verify_only is read-only; diagnose_target permits one exact target; bootstrap_and_verify remains separately controlled"
        required: true
        default: verify_only
        type: choice
        options:
          - verify_only
          - diagnose_target
          - bootstrap_and_verify
      expected_control_plane_sha:
        description: "Required for diagnose_target/bootstrap_and_verify; exact main SHA containing this workflow and runner"
        required: false
        default: ""
        type: string
      expected_runner_sha256:
        description: "Required for diagnose_target/bootstrap_and_verify; exact SHA256 of the streamed candidate-exact runner"
        required: false
        default: ""
        type: string
      authorization_preflight_run_id:
        description: "Required for diagnose_target/bootstrap_and_verify; exact successful verify_only run"
        required: false
        default: ""
        type: string
      authorization_preflight_run_attempt:
        description: "Required for diagnose_target/bootstrap_and_verify; exact verify_only run attempt"
        required: false
        default: ""
        type: string
      expected_coverage_fingerprint_sha256:
        description: "Required for diagnose_target/bootstrap_and_verify; exact v2 preflight coverage fingerprint"
        required: false
        default: ""
        type: string
      expected_active_revision:
        description: "Exact 40-character REVISION currently active on production"
        required: true
        type: string
      candidate_release_revision:
        description: "Exact 40-character REVISION materialized in the inactive candidate release"
        required: true
        type: string
      candidate_release_name:
        description: "Exact inactive Deployer release directory name"
        required: true
        type: string
      staging_run_id:
        description: "Successful exact-SHA Deploy Application staging run"
        required: true
        type: string
      expected_missing_pointer_count:
        description: "Required for diagnose/bootstrap; omit for verify_only discovery"
        required: false
        default: ""
        type: string
      diagnostic_target_slug:
        description: "Required only for diagnose_target; one exact lowercase canonical slug"
        required: false
        default: ""
        type: string
      diagnostic_target_locale:
        description: "Required only for diagnose_target; exact public locale"
        required: false
        default: ""
        type: string
      execute_diagnostic_write:
        description: "diagnose_target defaults to zero writes; enable only with exact authorization"
        required: true
        default: false
        type: boolean
      operator_approval_phrase:
        description: "Required for a diagnostic write or bootstrap; must match the exact bound phrase"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

jobs:
  production-cache-repair:
    name: Career detail production cache repair (${{ inputs.mode }})
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    concurrency:
      group: deploy-${{ github.repository }}-production
      cancel-in-progress: false
    env:
      MINIMUM_TARGETS: "2092"
      BOOTSTRAP_BATCH_SIZE: "10"
      BOOTSTRAP_DENSE_BATCH_COOLDOWN_SECONDS: "2"
      OFFLINE_BUILD_BUDGET_MS: "5000"
      BOOTSTRAP_RETRY_LIMIT: "1"
      RUNNER_PATH: "backend/scripts/deploy/career_candidate_exact_cache_bootstrap.php"

    steps:
      - name: Validate exact production cache operation contract
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          EXPECTED_CONTROL_PLANE_SHA: ${{ inputs.expected_control_plane_sha }}
          EXPECTED_RUNNER_SHA256: ${{ inputs.expected_runner_sha256 }}
          AUTHORIZATION_PREFLIGHT_RUN_ID: ${{ inputs.authorization_preflight_run_id }}
          AUTHORIZATION_PREFLIGHT_RUN_ATTEMPT: ${{ inputs.authorization_preflight_run_attempt }}
          EXPECTED_COVERAGE_FINGERPRINT_SHA256: ${{ inputs.expected_coverage_fingerprint_sha256 }}
          EXPECTED_ACTIVE_REVISION: ${{ inputs.expected_active_revision }}
          CANDIDATE_RELEASE_REVISION: ${{ inputs.candidate_release_revision }}
          CANDIDATE_RELEASE_NAME: ${{ inputs.candidate_release_name }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
          EXPECTED_MISSING_POINTER_COUNT: ${{ inputs.expected_missing_pointer_count }}
          DIAGNOSTIC_TARGET_SLUG: ${{ inputs.diagnostic_target_slug }}
          DIAGNOSTIC_TARGET_LOCALE: ${{ inputs.diagnostic_target_locale }}
          EXECUTE_DIAGNOSTIC_WRITE: ${{ inputs.execute_diagnostic_write }}
          OPERATOR_APPROVAL_PHRASE: ${{ inputs.operator_approval_phrase }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$EXPECTED_ACTIVE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_RELEASE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$CANDIDATE_RELEASE_REVISION" != "88dedb58f341e6c92d07754eac7862fa3454dc7c"
          # The revisions may match when the candidate is a separately
          # materialized inactive release. Remote identity checks below still
          # require distinct resolved active and candidate release paths.
          [[ "$CANDIDATE_RELEASE_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          [[ "$STAGING_RUN_ID" =~ ^[0-9]+$ ]]

          case "$MODE" in
            verify_only)
              test -z "$EXPECTED_MISSING_POINTER_COUNT"
              if [ -n "$OPERATOR_APPROVAL_PHRASE" ]; then
                echo "verify_only refuses an operator approval phrase." >&2
                exit 2
              fi
              test -z "$EXPECTED_CONTROL_PLANE_SHA"
              test -z "$EXPECTED_RUNNER_SHA256"
              test -z "$AUTHORIZATION_PREFLIGHT_RUN_ID"
              test -z "$AUTHORIZATION_PREFLIGHT_RUN_ATTEMPT"
              test -z "$EXPECTED_COVERAGE_FINGERPRINT_SHA256"
              test -z "$DIAGNOSTIC_TARGET_SLUG"
              test -z "$DIAGNOSTIC_TARGET_LOCALE"
              test "$EXECUTE_DIAGNOSTIC_WRITE" = "false"
              ;;
            diagnose_target)
              [[ "$EXPECTED_MISSING_POINTER_COUNT" =~ ^(0|[1-9][0-9]{0,3})$ ]]
              test "$EXPECTED_MISSING_POINTER_COUNT" -le "$MINIMUM_TARGETS"
              test "$EXPECTED_MISSING_POINTER_COUNT" -gt 0
              [[ "$EXPECTED_CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]]
              [[ "$EXPECTED_RUNNER_SHA256" =~ ^[0-9a-f]{64}$ ]]
              [[ "$AUTHORIZATION_PREFLIGHT_RUN_ID" =~ ^[0-9]+$ ]]
              [[ "$AUTHORIZATION_PREFLIGHT_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
              [[ "$EXPECTED_COVERAGE_FINGERPRINT_SHA256" =~ ^[0-9a-f]{64}$ ]]
              [[ "$DIAGNOSTIC_TARGET_SLUG" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]
              [[ "$DIAGNOSTIC_TARGET_LOCALE" =~ ^(en|zh-CN)$ ]]
              if [ "$EXECUTE_DIAGNOSTIC_WRITE" = "true" ]; then
                expected_phrase="I explicitly approve production Career single-target inactive-candidate cache diagnosis with authorization preflight run ${AUTHORIZATION_PREFLIGHT_RUN_ID} coverage fingerprint ${EXPECTED_COVERAGE_FINGERPRINT_SHA256} control-plane SHA ${EXPECTED_CONTROL_PLANE_SHA} runner SHA256 ${EXPECTED_RUNNER_SHA256} active SHA ${EXPECTED_ACTIVE_REVISION} using exact staging run ${STAGING_RUN_ID} and inactive candidate SHA ${CANDIDATE_RELEASE_REVISION} release ${CANDIDATE_RELEASE_NAME} for target ${DIAGNOSTIC_TARGET_SLUG}/${DIAGNOSTIC_TARGET_LOCALE} at exactly ${EXPECTED_MISSING_POINTER_COUNT} missing pointers across ${MINIMUM_TARGETS} targets with offline build budget ${OFFLINE_BUILD_BUDGET_MS}ms; one candidate-runtime cache warm, zero queue/DB/CMS-authority/publication/indexability/sitemap/llms/search/candidate activation."
                if [ "$OPERATOR_APPROVAL_PHRASE" != "$expected_phrase" ]; then
                  echo "operator_approval_phrase does not match the exact single-target cache diagnosis authorization." >&2
                  exit 2
                fi
              else
                test "$EXECUTE_DIAGNOSTIC_WRITE" = "false"
                if [ -n "$OPERATOR_APPROVAL_PHRASE" ]; then
                  echo "read-only diagnose_target refuses an operator approval phrase." >&2
                  exit 2
                fi
              fi
              ;;
            bootstrap_and_verify)
              [[ "$EXPECTED_MISSING_POINTER_COUNT" =~ ^(0|[1-9][0-9]{0,3})$ ]]
              test "$EXPECTED_MISSING_POINTER_COUNT" -le "$MINIMUM_TARGETS"
              test -z "$DIAGNOSTIC_TARGET_SLUG"
              test -z "$DIAGNOSTIC_TARGET_LOCALE"
              test "$EXECUTE_DIAGNOSTIC_WRITE" = "false"
              test "$EXPECTED_MISSING_POINTER_COUNT" -gt 0
              [[ "$EXPECTED_CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]]
              [[ "$EXPECTED_RUNNER_SHA256" =~ ^[0-9a-f]{64}$ ]]
              [[ "$AUTHORIZATION_PREFLIGHT_RUN_ID" =~ ^[0-9]+$ ]]
              [[ "$AUTHORIZATION_PREFLIGHT_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
              [[ "$EXPECTED_COVERAGE_FINGERPRINT_SHA256" =~ ^[0-9a-f]{64}$ ]]
              expected_phrase="I explicitly approve production Career inactive-candidate exact cache bootstrap with authorization preflight run ${AUTHORIZATION_PREFLIGHT_RUN_ID} coverage fingerprint ${EXPECTED_COVERAGE_FINGERPRINT_SHA256} control-plane SHA ${EXPECTED_CONTROL_PLANE_SHA} runner SHA256 ${EXPECTED_RUNNER_SHA256} active SHA ${EXPECTED_ACTIVE_REVISION} using exact staging run ${STAGING_RUN_ID} and inactive candidate SHA ${CANDIDATE_RELEASE_REVISION} release ${CANDIDATE_RELEASE_NAME} for exactly ${EXPECTED_MISSING_POINTER_COUNT} missing pointers across ${MINIMUM_TARGETS} targets with offline build budget ${OFFLINE_BUILD_BUDGET_MS}ms, retry limit ${BOOTSTRAP_RETRY_LIMIT}, batch size ${BOOTSTRAP_BATCH_SIZE} and dense-batch cooldown ${BOOTSTRAP_DENSE_BATCH_COOLDOWN_SECONDS}s; candidate-code synchronous cache-only batches, no active default worker/queue/CMS/DB-authority/publication/indexability/sitemap/llms/search/candidate activation."
              if [ "$OPERATOR_APPROVAL_PHRASE" != "$expected_phrase" ]; then
                echo "operator_approval_phrase does not match the exact candidate-exact cache bootstrap authorization." >&2
                exit 2
              fi
              ;;
            *)
              echo "unsupported mode: $MODE" >&2
              exit 2
              ;;
          esac

      - name: Check out exact main control plane
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact control plane and runner
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          EXPECTED_CONTROL_PLANE_SHA: ${{ inputs.expected_control_plane_sha }}
          EXPECTED_RUNNER_SHA256: ${{ inputs.expected_runner_sha256 }}
        run: |
          set -euo pipefail
          control_plane_sha="$(git rev-parse HEAD)"
          test "$control_plane_sha" = "$GITHUB_SHA"
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$control_plane_sha" = "$(git rev-parse origin/main)"
          test -f "$RUNNER_PATH"
          runner_sha256="$(sha256sum "$RUNNER_PATH" | awk '{print $1}')"
          [[ "$runner_sha256" =~ ^[0-9a-f]{64}$ ]]
          if [ "$MODE" != "verify_only" ]; then
            test "$control_plane_sha" = "$EXPECTED_CONTROL_PLANE_SHA"
            test "$runner_sha256" = "$EXPECTED_RUNNER_SHA256"
          fi
          {
            echo "CONTROL_PLANE_SHA=$control_plane_sha"
            echo "RUNNER_SHA256=$runner_sha256"
          } >> "$GITHUB_ENV"

      - name: Verify candidate ancestry and exact staging evidence
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_ACTIVE_REVISION: ${{ inputs.expected_active_revision }}
          CANDIDATE_RELEASE_REVISION: ${{ inputs.candidate_release_revision }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
        run: |
          set -euo pipefail
          AUDITED_RUNTIME46_PRODUCTION_SHA="bc0ed833bc9aae1473ab37f1dead2517e1aff618"
          AUDITED_RUNTIME46_BRIDGE_SHA="49038deb50cda789e4365ea42068832ed28d6023"
          AUDITED_RUNTIME46_PATHS=(
            backend/app/Console/Commands/PersonalityMbtiCompRuntime46IntpPromote.php
            backend/app/Console/Commands/PersonalityMbtiCompRuntime46IntpRevision.php
            backend/app/Services/Cms/MbtiCompRuntime46IntpPromotionService.php
            backend/app/Services/Cms/MbtiFullCmsImportService.php
            backend/docs/seo/import-packages/mbti-comp-runtime-46-intp-revision-2026-07-19.json
            backend/tests/Feature/Console/PersonalityMbtiCompRuntime46IntpRevisionCommandTest.php
          )
          verify_audited_runtime46_subsumed_baseline() {
            local production_parent actual_diff expected_diff path production_blob candidate_blob
            local -a production_commit
            [ "$EXPECTED_ACTIVE_REVISION" = "$AUDITED_RUNTIME46_PRODUCTION_SHA" ] || {
              echo "Cache repair refused an unreviewed divergent production revision." >&2
              return 1
            }
            git cat-file -e "${AUDITED_RUNTIME46_BRIDGE_SHA}^{commit}" || {
              echo "Cache repair cannot resolve the audited Runtime 46 bridge." >&2
              return 1
            }
            git merge-base --is-ancestor "$AUDITED_RUNTIME46_BRIDGE_SHA" "$CANDIDATE_RELEASE_REVISION" || {
              echo "Cache repair requires a candidate descended from the audited Runtime 46 bridge." >&2
              return 1
            }
            read -r -a production_commit <<<"$(git rev-list --parents -n 1 "$EXPECTED_ACTIVE_REVISION")"
            [ "${#production_commit[@]}" -eq 2 ] || {
              echo "Cache repair requires a divergent production commit with exactly one parent." >&2
              return 1
            }
            production_parent="${production_commit[1]}"
            git merge-base --is-ancestor "$production_parent" "$CANDIDATE_RELEASE_REVISION" || {
              echo "Cache repair requires the divergent production parent to be an ancestor of the candidate." >&2
              return 1
            }
            expected_diff="$(printf '%s\n' \
              $'A\tbackend/app/Console/Commands/PersonalityMbtiCompRuntime46IntpPromote.php' \
              $'A\tbackend/app/Console/Commands/PersonalityMbtiCompRuntime46IntpRevision.php' \
              $'A\tbackend/app/Services/Cms/MbtiCompRuntime46IntpPromotionService.php' \
              $'M\tbackend/app/Services/Cms/MbtiFullCmsImportService.php' \
              $'A\tbackend/docs/seo/import-packages/mbti-comp-runtime-46-intp-revision-2026-07-19.json' \
              $'A\tbackend/tests/Feature/Console/PersonalityMbtiCompRuntime46IntpRevisionCommandTest.php')"
            actual_diff="$(git diff --no-renames --name-status "$production_parent" "$EXPECTED_ACTIVE_REVISION")"
            [ "$actual_diff" = "$expected_diff" ] || {
              echo "Cache repair refused an unknown, deleted, renamed, or status-drifted production path." >&2
              return 1
            }
            for path in "${AUDITED_RUNTIME46_PATHS[@]}"; do
              production_blob="$(git rev-parse "${EXPECTED_ACTIVE_REVISION}:${path}")" || return 1
              candidate_blob="$(git rev-parse "${CANDIDATE_RELEASE_REVISION}:${path}")" || return 1
              git cat-file -e "${production_blob}^{blob}" || return 1
              git cat-file -e "${candidate_blob}^{blob}" || return 1
              [ "$production_blob" = "$candidate_blob" ] || {
                echo "Cache repair refused Runtime 46 blob drift." >&2
                return 1
              }
            done
          }
          test "$(git rev-parse HEAD)" = "$CONTROL_PLANE_SHA"
          if ! git cat-file -e "${CANDIDATE_RELEASE_REVISION}^{commit}"; then
            git fetch --no-tags origin "$CANDIDATE_RELEASE_REVISION"
          fi
          git cat-file -e "${CANDIDATE_RELEASE_REVISION}^{commit}"
          if ! git cat-file -e "${EXPECTED_ACTIVE_REVISION}^{commit}"; then
            git fetch --no-tags origin "$EXPECTED_ACTIVE_REVISION"
          fi
          git cat-file -e "${EXPECTED_ACTIVE_REVISION}^{commit}"
          if ! git merge-base --is-ancestor "$EXPECTED_ACTIVE_REVISION" "$CANDIDATE_RELEASE_REVISION"; then
            verify_audited_runtime46_subsumed_baseline
          fi
          git merge-base --is-ancestor "$CANDIDATE_RELEASE_REVISION" origin/main

          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${STAGING_RUN_ID}")"
          jq -e \
            --arg candidate_sha "$CANDIDATE_RELEASE_REVISION" \
            '.name == "Deploy Application"
             and .path == ".github/workflows/deploy.yml"
             and (.event == "push" or .event == "workflow_dispatch")
             and .status == "completed"
             and .conclusion == "success"
             and .head_branch == "main"
             and .head_sha == $candidate_sha' \
            <<<"$run_json" >/dev/null

          jobs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${STAGING_RUN_ID}/jobs?per_page=100")"
          jq -e \
            '([.jobs[] | select(.name == "Deploy checks (staging)" and .conclusion == "success")] | length) == 1
             and ([.jobs[] | select(.name == "Deploy (staging)" and .conclusion == "success")] | length) == 1' \
            <<<"$jobs_json" >/dev/null

      - name: Bind immutable v2 verify-only authorization
        if: inputs.mode != 'verify_only'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHORIZATION_PREFLIGHT_RUN_ID: ${{ inputs.authorization_preflight_run_id }}
          AUTHORIZATION_PREFLIGHT_RUN_ATTEMPT: ${{ inputs.authorization_preflight_run_attempt }}
          EXPECTED_COVERAGE_FINGERPRINT_SHA256: ${{ inputs.expected_coverage_fingerprint_sha256 }}
          EXPECTED_ACTIVE_REVISION: ${{ inputs.expected_active_revision }}
          CANDIDATE_RELEASE_REVISION: ${{ inputs.candidate_release_revision }}
          CANDIDATE_RELEASE_NAME: ${{ inputs.candidate_release_name }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
          EXPECTED_MISSING_POINTER_COUNT: ${{ inputs.expected_missing_pointer_count }}
        run: |
          set -euo pipefail
          test "$AUTHORIZATION_PREFLIGHT_RUN_ID" -lt "$GITHUB_RUN_ID"
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${AUTHORIZATION_PREFLIGHT_RUN_ID}")"
          jq -e \
            --arg control_plane_sha "$CONTROL_PLANE_SHA" \
            --argjson run_attempt "$AUTHORIZATION_PREFLIGHT_RUN_ATTEMPT" \
            '.name == "Career detail production cache repair"
             and .path == ".github/workflows/career-detail-production-cache-repair.yml"
             and .event == "workflow_dispatch"
             and .status == "completed"
             and .conclusion == "success"
             and .head_branch == "main"
             and .head_sha == $control_plane_sha
             and .run_attempt == $run_attempt' \
            <<<"$run_json" >/dev/null

          jobs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${AUTHORIZATION_PREFLIGHT_RUN_ID}/jobs?per_page=100")"
          jq -e \
            '([.jobs[] |
                select(.name == "Career detail production cache repair (verify_only)")
                | select(.conclusion == "success")] | length) == 1' \
            <<<"$jobs_json" >/dev/null

          artifact_name="career-detail-production-cache-verify_only-${AUTHORIZATION_PREFLIGHT_RUN_ID}-${AUTHORIZATION_PREFLIGHT_RUN_ATTEMPT}"
          artifacts_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${AUTHORIZATION_PREFLIGHT_RUN_ID}/artifacts?per_page=100")"
          jq -e \
            --arg artifact_name "$artifact_name" \
            '([.artifacts[] |
                select(.name == $artifact_name)
                | select(.expired == false)] | length) == 1' \
            <<<"$artifacts_json" >/dev/null
          mkdir -p artifacts/authorized-preflight
          gh run download "$AUTHORIZATION_PREFLIGHT_RUN_ID" \
            --name "$artifact_name" \
            --dir artifacts/authorized-preflight
          packet="artifacts/authorized-preflight/authorization-packet.json"
          authorized_preflight="artifacts/authorized-preflight/preflight.json"
          test -f "$packet"
          test -f "$authorized_preflight"
          authorized_coverage_state="$(jq -r '.coverage_state' "$authorized_preflight")"
          [[ "$authorized_coverage_state" =~ ^[MALG]+$ ]]
          test "${#authorized_coverage_state}" -eq "$MINIMUM_TARGETS"
          authorized_coverage_state_sha256="$(
            printf '%s' "$authorized_coverage_state" | sha256sum | awk '{print $1}'
          )"
          [[ "$authorized_coverage_state_sha256" =~ ^[0-9a-f]{64}$ ]]
          test "$(jq -r '.coverage_state_sha256' "$authorized_preflight")" = \
            "$authorized_coverage_state_sha256"
          jq -e \
            --argjson preflight_run_id "$AUTHORIZATION_PREFLIGHT_RUN_ID" \
            --argjson preflight_run_attempt "$AUTHORIZATION_PREFLIGHT_RUN_ATTEMPT" \
            --arg coverage_fingerprint "$EXPECTED_COVERAGE_FINGERPRINT_SHA256" \
            --arg coverage_state_sha256 "$authorized_coverage_state_sha256" \
            --arg control_plane_sha "$CONTROL_PLANE_SHA" \
            --arg runner_sha256 "$RUNNER_SHA256" \
            --arg active_revision "$EXPECTED_ACTIVE_REVISION" \
            --arg candidate_revision "$CANDIDATE_RELEASE_REVISION" \
            --arg candidate_release "$CANDIDATE_RELEASE_NAME" \
            --arg staging_run_id "$STAGING_RUN_ID" \
            --argjson expected_targets "$MINIMUM_TARGETS" \
            --argjson missing_pointer_count "$EXPECTED_MISSING_POINTER_COUNT" \
            --argjson offline_build_budget_ms "$OFFLINE_BUILD_BUDGET_MS" \
            --argjson retry_limit "$BOOTSTRAP_RETRY_LIMIT" \
            --argjson batch_size "$BOOTSTRAP_BATCH_SIZE" \
            --argjson dense_batch_cooldown_seconds "$BOOTSTRAP_DENSE_BATCH_COOLDOWN_SECONDS" \
            '.contract_version == "career.candidate_exact_cache_bootstrap.authorization.v2"
             and .preflight_run_id == $preflight_run_id
             and .preflight_run_attempt == $preflight_run_attempt
             and .coverage_fingerprint_sha256 == $coverage_fingerprint
             and .coverage_state_sha256 == $coverage_state_sha256
             and .control_plane_sha == $control_plane_sha
             and .runner_sha256 == $runner_sha256
             and .active_revision == $active_revision
             and .candidate_revision == $candidate_revision
             and .candidate_release == $candidate_release
             and .staging_run_id == $staging_run_id
             and .expected_target_count == $expected_targets
             and .missing_pointer_count == $missing_pointer_count
             and .offline_build_budget_ms == $offline_build_budget_ms
             and .retry_limit == $retry_limit
             and .batch_size == $batch_size
             and .dense_batch_cooldown_seconds == $dense_batch_cooldown_seconds
             and .cache_write_count == 0
             and .owned_cache_write_count == 0
             and .concurrent_coverage_gain_count == 0
             and .queue_dispatch_count == 0
             and .database_write_count == 0
             and .candidate_activation == false' \
            "$packet" >/dev/null

          runs_json="$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/career-detail-production-cache-repair.yml/runs?per_page=100")"
          mapfile -t intervening_run_ids < <(
            jq -r \
              --argjson preflight_run_id "$AUTHORIZATION_PREFLIGHT_RUN_ID" \
              --argjson current_run_id "$GITHUB_RUN_ID" \
              '[.[].workflow_runs[]]
               | map(select(.id > $preflight_run_id and .id < $current_run_id))
               | .[].id' \
              <<<"$runs_json"
          )
          for run_id in "${intervening_run_ids[@]}"; do
            intervening_jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100")"
            if jq -e \
              '[.jobs[] | select(.name == "Career detail production cache repair (bootstrap_and_verify)")] | length > 0' \
              <<<"$intervening_jobs" >/dev/null; then
              echo "INTERVENING_BOOTSTRAP_RUN" >&2
              exit 2
            fi
          done

      - name: Set up SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known hosts
        shell: bash
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          RETIRED_DEPLOY_HOST: ${{ secrets.PRODUCTION_RETIRED_DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS"
          for name in DEPLOY_USER DEPLOY_PORT DEPLOY_HOST RETIRED_DEPLOY_HOST DEPLOY_PATH; do
            test -n "${!name:-}"
          done
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          test "$DEPLOY_PORT" -ge 1
          test "$DEPLOY_PORT" -le 65535
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$RETIRED_DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          test "$DEPLOY_HOST" != "$RETIRED_DEPLOY_HOST"
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_PATH" != *".."* ]]
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null \
            || ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f ~/.ssh/known_hosts >/dev/null

      - name: Verify exact active and inactive production releases
        shell: bash
        env:
          DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
          EXPECTED_ACTIVE_REVISION: ${{ inputs.expected_active_revision }}
          CANDIDATE_RELEASE_REVISION: ${{ inputs.candidate_release_revision }}
          CANDIDATE_RELEASE_NAME: ${{ inputs.candidate_release_name }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -euo pipefail; current=\$(readlink -f '$DEPLOY_PATH/current'); candidate=\$(readlink -f '$DEPLOY_PATH/releases/$CANDIDATE_RELEASE_NAME'); test -n \"\$current\"; test -n \"\$candidate\"; test \"\$current\" != \"\$candidate\"; test \"\$(tr -d '\\r\\n' < \"\$current/REVISION\")\" = '$EXPECTED_ACTIVE_REVISION'; test \"\$(tr -d '\\r\\n' < \"\$candidate/REVISION\")\" = '$CANDIDATE_RELEASE_REVISION'; test ! -e '$DEPLOY_PATH/.dep/deploy.lock'" \
            2>/dev/null

      - name: Read-only exact coverage preflight
        shell: bash
        env:
          DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
          CANDIDATE_RELEASE_NAME: ${{ inputs.candidate_release_name }}
          CANDIDATE_RELEASE_REVISION: ${{ inputs.candidate_release_revision }}
          EXPECTED_ACTIVE_REVISION: ${{ inputs.expected_active_revision }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
          EXPECTED_MISSING_POINTER_COUNT: ${{ inputs.expected_missing_pointer_count }}
          EXPECTED_COVERAGE_FINGERPRINT_SHA256: ${{ inputs.expected_coverage_fingerprint_sha256 }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          preflight_receipt="artifacts/preflight.json"
          if [ "$MODE" = "bootstrap_and_verify" ]; then
            preflight_receipt="artifacts/current-preflight.json"
          fi
          runner_expected_missing="$EXPECTED_MISSING_POINTER_COUNT"
          authorized_coverage_state=""
          if [ "$MODE" = "verify_only" ]; then
            runner_expected_missing=""
          elif [ "$MODE" = "bootstrap_and_verify" ]; then
            authorized_coverage_state="$(
              jq -r '.coverage_state' artifacts/authorized-preflight/preflight.json
            )"
            [[ "$authorized_coverage_state" =~ ^[MALG]+$ ]]
            test "${#authorized_coverage_state}" -eq "$MINIMUM_TARGETS"
          fi
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -euo pipefail; test -x /usr/bin/php; test -x /usr/bin/timeout; sudo -n -u www-data -- test -r '$DEPLOY_PATH/releases/$CANDIDATE_RELEASE_NAME/backend/vendor/autoload.php'; sudo -n -u www-data -- test -w '$DEPLOY_PATH/releases/$CANDIDATE_RELEASE_NAME/backend/storage/framework/cache/data'" \
            2>/dev/null

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo -n -u www-data -- env FM_CAREER_RUNNER_EXECUTE=1 FM_CAREER_MODE=preflight FM_CAREER_MANAGED_RELEASES_ROOT='$DEPLOY_PATH/releases' FM_CAREER_CANDIDATE_RELEASE='$CANDIDATE_RELEASE_NAME' FM_CAREER_CANDIDATE_SHA='$CANDIDATE_RELEASE_REVISION' FM_CAREER_EXPECTED_TARGETS='$MINIMUM_TARGETS' FM_CAREER_EXPECTED_MISSING='$runner_expected_missing' FM_CAREER_EXPECTED_COVERAGE_FINGERPRINT='$EXPECTED_COVERAGE_FINGERPRINT_SHA256' FM_CAREER_AUTHORIZED_COVERAGE_STATE='$authorized_coverage_state' FM_CAREER_OFFLINE_BUILD_BUDGET_MS='$OFFLINE_BUILD_BUDGET_MS' FM_CAREER_RETRY_LIMIT='$BOOTSTRAP_RETRY_LIMIT' /usr/bin/timeout 720 /usr/bin/php" \
            < "$RUNNER_PATH" > "$preflight_receipt" 2>/dev/null

          observed_missing_pointer_count="$(
            jq -r '.coverage.missing_pointer_count' "$preflight_receipt"
          )"
          [[ "$observed_missing_pointer_count" =~ ^(0|[1-9][0-9]{0,3})$ ]]
          test "$observed_missing_pointer_count" -le "$MINIMUM_TARGETS"
          expected_preflight_concurrent_gain=0
          if [ "$MODE" = "bootstrap_and_verify" ]; then
            test "$observed_missing_pointer_count" -le "$EXPECTED_MISSING_POINTER_COUNT"
            expected_preflight_concurrent_gain=$((EXPECTED_MISSING_POINTER_COUNT - observed_missing_pointer_count))
          fi

          jq -e \
            --arg mode "$MODE" \
            --arg candidate_sha "$CANDIDATE_RELEASE_REVISION" \
            --arg expected_fingerprint "$EXPECTED_COVERAGE_FINGERPRINT_SHA256" \
            --argjson expected_missing "$observed_missing_pointer_count" \
            --argjson expected_preflight_concurrent_gain "$expected_preflight_concurrent_gain" \
            --argjson expected_targets "$MINIMUM_TARGETS" \
            --argjson offline_build_budget_ms "$OFFLINE_BUILD_BUDGET_MS" \
            --argjson retry_limit "$BOOTSTRAP_RETRY_LIMIT" \
            --argjson batch_size "$BOOTSTRAP_BATCH_SIZE" \
            '.contract_version == "career.candidate_exact_cache_bootstrap.v2"
             and .mode == "preflight"
             and .status == "ready"
             and .candidate_revision == $candidate_sha
             and .offline_build_budget_ms == $offline_build_budget_ms
             and .retry_limit == $retry_limit
             and .batch_size == $batch_size
             and (.coverage_fingerprint_sha256 | test("^[0-9a-f]{64}$"))
             and (.coverage_state | test("^[MALG]+$"))
             and (.coverage_state | length) == $expected_targets
             and (.coverage_state_sha256 | test("^[0-9a-f]{64}$"))
             and (
               if $mode == "bootstrap_and_verify" then
                 .authorized_coverage_fingerprint_sha256 == $expected_fingerprint
                 and .concurrent_coverage_gain_count == $expected_preflight_concurrent_gain
               else
                 .authorized_coverage_fingerprint_sha256 == null
                 and ($expected_fingerprint == "" or .coverage_fingerprint_sha256 == $expected_fingerprint)
                 and .concurrent_coverage_gain_count == 0
               end
             )
             and .cache_write_count == 0
             and .owned_cache_write_count == 0
             and .failure_count == 0
             and .queue_dispatch_count == 0
             and .database_write_count == 0
             and .coverage.expected_target_count == $expected_targets
             and .coverage.eligible_target_count == $expected_targets
             and .coverage.missing_pointer_count == $expected_missing
             and .coverage.missing_payload_count == 0
             and .coverage.broken_count == 0
             and .coverage.excluded_count == 0
             and .coverage.covered_target_count == ($expected_targets - $expected_missing)' \
            "$preflight_receipt" >/dev/null

          if [ "$MODE" = "verify_only" ]; then
            coverage_fingerprint="$(jq -r '.coverage_fingerprint_sha256' "$preflight_receipt")"
            coverage_state_sha256="$(jq -r '.coverage_state_sha256' "$preflight_receipt")"
            jq -n \
              --arg contract_version "career.candidate_exact_cache_bootstrap.authorization.v2" \
              --argjson preflight_run_id "$GITHUB_RUN_ID" \
              --argjson preflight_run_attempt "$GITHUB_RUN_ATTEMPT" \
              --arg coverage_fingerprint_sha256 "$coverage_fingerprint" \
              --arg coverage_state_sha256 "$coverage_state_sha256" \
              --arg control_plane_sha "$CONTROL_PLANE_SHA" \
              --arg runner_sha256 "$RUNNER_SHA256" \
              --arg active_revision "$EXPECTED_ACTIVE_REVISION" \
              --arg candidate_revision "$CANDIDATE_RELEASE_REVISION" \
              --arg candidate_release "$CANDIDATE_RELEASE_NAME" \
              --arg staging_run_id "$STAGING_RUN_ID" \
              --argjson expected_targets "$MINIMUM_TARGETS" \
              --argjson missing_pointer_count "$observed_missing_pointer_count" \
              --argjson offline_build_budget_ms "$OFFLINE_BUILD_BUDGET_MS" \
              --argjson retry_limit "$BOOTSTRAP_RETRY_LIMIT" \
              --argjson batch_size "$BOOTSTRAP_BATCH_SIZE" \
              --argjson dense_batch_cooldown_seconds "$BOOTSTRAP_DENSE_BATCH_COOLDOWN_SECONDS" \
              '{
                contract_version: $contract_version,
                preflight_run_id: $preflight_run_id,
                preflight_run_attempt: $preflight_run_attempt,
                coverage_fingerprint_sha256: $coverage_fingerprint_sha256,
                coverage_state_sha256: $coverage_state_sha256,
                control_plane_sha: $control_plane_sha,
                runner_sha256: $runner_sha256,
                active_revision: $active_revision,
                candidate_revision: $candidate_revision,
                candidate_release: $candidate_release,
                staging_run_id: $staging_run_id,
                expected_target_count: $expected_targets,
                missing_pointer_count: $missing_pointer_count,
                offline_build_budget_ms: $offline_build_budget_ms,
                retry_limit: $retry_limit,
                batch_size: $batch_size,
                dense_batch_cooldown_seconds: $dense_batch_cooldown_seconds,
                cache_write_count: 0,
                owned_cache_write_count: 0,
                concurrent_coverage_gain_count: 0,
                queue_dispatch_count: 0,
                database_write_count: 0,
                candidate_activation: false
              }' > artifacts/authorization-packet.json
          fi

      - name: Diagnose one exact candidate cache target
        if: inputs.mode == 'diagnose_target'
        shell: bash
        env:
          DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
          EXPECTED_ACTIVE_REVISION: ${{ inputs.expected_active_revision }}
          CANDIDATE_RELEASE_NAME: ${{ inputs.candidate_release_name }}
          CANDIDATE_RELEASE_REVISION: ${{ inputs.candidate_release_revision }}
          EXPECTED_MISSING_POINTER_COUNT: ${{ inputs.expected_missing_pointer_count }}
          EXPECTED_COVERAGE_FINGERPRINT_SHA256: ${{ inputs.expected_coverage_fingerprint_sha256 }}
          DIAGNOSTIC_TARGET_SLUG: ${{ inputs.diagnostic_target_slug }}
          DIAGNOSTIC_TARGET_LOCALE: ${{ inputs.diagnostic_target_locale }}
          EXECUTE_DIAGNOSTIC_WRITE: ${{ inputs.execute_diagnostic_write }}
        run: |
          set -euo pipefail
          verify_identity() {
            test "$(git rev-parse HEAD)" = "$CONTROL_PLANE_SHA"
            test "$(sha256sum "$RUNNER_PATH" | awk '{print $1}')" = "$RUNNER_SHA256"
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
              -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "set -euo pipefail; current=\$(readlink -f '$DEPLOY_PATH/current'); candidate=\$(readlink -f '$DEPLOY_PATH/releases/$CANDIDATE_RELEASE_NAME'); test -n \"\$current\"; test -n \"\$candidate\"; test \"\$current\" != \"\$candidate\"; test \"\$(tr -d '\\r\\n' < \"\$current/REVISION\")\" = '$EXPECTED_ACTIVE_REVISION'; test \"\$(tr -d '\\r\\n' < \"\$candidate/REVISION\")\" = '$CANDIDATE_RELEASE_REVISION'; test ! -e '$DEPLOY_PATH/.dep/deploy.lock'" \
              2>/dev/null
          }
          verify_identity

          diagnostic_write=0
          if [ "$EXECUTE_DIAGNOSTIC_WRITE" = "true" ]; then
            diagnostic_write=1
          fi
          set +e
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo -n -u www-data -- env FM_CAREER_RUNNER_EXECUTE=1 FM_CAREER_MODE=diagnose_target FM_CAREER_MANAGED_RELEASES_ROOT='$DEPLOY_PATH/releases' FM_CAREER_CANDIDATE_RELEASE='$CANDIDATE_RELEASE_NAME' FM_CAREER_CANDIDATE_SHA='$CANDIDATE_RELEASE_REVISION' FM_CAREER_EXPECTED_TARGETS='$MINIMUM_TARGETS' FM_CAREER_EXPECTED_MISSING='$EXPECTED_MISSING_POINTER_COUNT' FM_CAREER_EXPECTED_COVERAGE_FINGERPRINT='$EXPECTED_COVERAGE_FINGERPRINT_SHA256' FM_CAREER_OFFLINE_BUILD_BUDGET_MS='$OFFLINE_BUILD_BUDGET_MS' FM_CAREER_RETRY_LIMIT='$BOOTSTRAP_RETRY_LIMIT' FM_CAREER_TARGET_SLUG='$DIAGNOSTIC_TARGET_SLUG' FM_CAREER_TARGET_LOCALE='$DIAGNOSTIC_TARGET_LOCALE' FM_CAREER_DIAGNOSTIC_WRITE='$diagnostic_write' /usr/bin/timeout 720 /usr/bin/php" \
            < "$RUNNER_PATH" > artifacts/single-target-diagnostic.json 2>/dev/null
          diagnostic_exit=$?
          set -e

          jq -e \
            --arg candidate_sha "$CANDIDATE_RELEASE_REVISION" \
            --arg expected_fingerprint "$EXPECTED_COVERAGE_FINGERPRINT_SHA256" \
            --argjson expected_targets "$MINIMUM_TARGETS" \
            --argjson expected_missing "$EXPECTED_MISSING_POINTER_COUNT" \
            --argjson offline_build_budget_ms "$OFFLINE_BUILD_BUDGET_MS" \
            '.contract_version == "career.candidate_exact_cache_bootstrap.v2"
             and .mode == "diagnose_target"
             and .candidate_revision == $candidate_sha
             and (.target_index_sha256 | test("^[0-9a-f]{64}$"))
             and .offline_build_budget_ms == $offline_build_budget_ms
             and .cache_write_count == .owned_cache_write_count
             and .concurrent_coverage_gain_count == 0
             and .queue_dispatch_count == 0
             and .database_write_count == 0
             and .pre_coverage_fingerprint_sha256 == $expected_fingerprint
             and .pre_target_coverage.expected_target_count == $expected_targets
             and .pre_target_coverage.missing_pointer_count == $expected_missing
             and (.target? == null)
             and (.slug? == null)
             and (.locale? == null)
             and (.message? == null)
             and (.cache_key? == null)' \
            artifacts/single-target-diagnostic.json >/dev/null

          if [ "$diagnostic_write" -eq 0 ]; then
            test "$diagnostic_exit" -eq 0
            jq -e \
              '.status == "ready"
               and .diagnostic_write == false
               and .cache_write_count == 0
               and .failure_count == 0
               and .post_target_coverage == .pre_target_coverage
               and .post_coverage_fingerprint_sha256 == .pre_coverage_fingerprint_sha256' \
              artifacts/single-target-diagnostic.json >/dev/null
          elif [ "$diagnostic_exit" -eq 0 ]; then
            jq -e \
              '.status == "completed"
               and .diagnostic_write == true
               and .cache_write_count == 1
               and .failure_count == 0
               and .failure_stage == null
               and .error_category == null
               and .post_target_coverage.missing_pointer_count == (.pre_target_coverage.missing_pointer_count - 1)' \
              artifacts/single-target-diagnostic.json >/dev/null
          else
            jq -e \
              '.status == "failed"
               and .diagnostic_write == true
               and (.cache_write_count == 0 or .cache_write_count == 1)
               and .failure_count == 1
               and (.failure_stage | IN("precompute_conversion_closure", "build_detail_payload", "publish_cache_payload", "post_batch_coverage"))
               and (.error_category | IN("build_budget_exceeded", "cache_publish_failed", "database_permanent_read", "database_transient_read", "payload_not_cached", "unexpected"))
               and (.build_ms | type == "number")
               and .post_target_coverage.missing_pointer_count == .pre_target_coverage.missing_pointer_count' \
              artifacts/single-target-diagnostic.json >/dev/null
            exit "$diagnostic_exit"
          fi
          verify_identity

      - name: Run candidate-exact synchronous cache batches
        if: inputs.mode == 'bootstrap_and_verify'
        shell: bash
        env:
          DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
          EXPECTED_ACTIVE_REVISION: ${{ inputs.expected_active_revision }}
          CANDIDATE_RELEASE_NAME: ${{ inputs.candidate_release_name }}
          CANDIDATE_RELEASE_REVISION: ${{ inputs.candidate_release_revision }}
          EXPECTED_MISSING_POINTER_COUNT: ${{ inputs.expected_missing_pointer_count }}
          EXPECTED_COVERAGE_FINGERPRINT_SHA256: ${{ inputs.expected_coverage_fingerprint_sha256 }}
        run: |
          set -euo pipefail
          verify_identity() {
            test "$(git rev-parse HEAD)" = "$CONTROL_PLANE_SHA"
            test "$(sha256sum "$RUNNER_PATH" | awk '{print $1}')" = "$RUNNER_SHA256"
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
              -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "set -euo pipefail; current=\$(readlink -f '$DEPLOY_PATH/current'); candidate=\$(readlink -f '$DEPLOY_PATH/releases/$CANDIDATE_RELEASE_NAME'); test -n \"\$current\"; test -n \"\$candidate\"; test \"\$current\" != \"\$candidate\"; test \"\$(tr -d '\\r\\n' < \"\$current/REVISION\")\" = '$EXPECTED_ACTIVE_REVISION'; test \"\$(tr -d '\\r\\n' < \"\$candidate/REVISION\")\" = '$CANDIDATE_RELEASE_REVISION'; test ! -e '$DEPLOY_PATH/.dep/deploy.lock'" \
              2>/dev/null
          }

          run_candidate_batch() {
            local output_receipt="$1"
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
              -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "sudo -n -u www-data -- env FM_CAREER_RUNNER_EXECUTE=1 FM_CAREER_MODE=batch FM_CAREER_MANAGED_RELEASES_ROOT='$DEPLOY_PATH/releases' FM_CAREER_CANDIDATE_RELEASE='$CANDIDATE_RELEASE_NAME' FM_CAREER_CANDIDATE_SHA='$CANDIDATE_RELEASE_REVISION' FM_CAREER_EXPECTED_TARGETS='$MINIMUM_TARGETS' FM_CAREER_EXPECTED_MISSING='$expected_remaining' FM_CAREER_EXPECTED_COVERAGE_FINGERPRINT='$expected_fingerprint' FM_CAREER_AUTHORIZED_COVERAGE_STATE='$expected_state' FM_CAREER_BATCH_OFFSET='$offset' FM_CAREER_BATCH_SIZE='$BOOTSTRAP_BATCH_SIZE' FM_CAREER_OFFLINE_BUILD_BUDGET_MS='$OFFLINE_BUILD_BUDGET_MS' FM_CAREER_RETRY_LIMIT='$BOOTSTRAP_RETRY_LIMIT' /usr/bin/timeout 720 /usr/bin/php" \
              < "$RUNNER_PATH" > "$output_receipt" 2>/dev/null
          }

          total_owned_writes=0
          runtime_initialization_retry_count=0
          total_concurrent_coverage_gain="$(
            jq -r '.concurrent_coverage_gain_count' artifacts/current-preflight.json
          )"
          expected_remaining="$(
            jq -r '.coverage.missing_pointer_count' artifacts/current-preflight.json
          )"
          expected_fingerprint="$(
            jq -r '.coverage_fingerprint_sha256' artifacts/current-preflight.json
          )"
          expected_state="$(jq -r '.coverage_state' artifacts/current-preflight.json)"
          [[ "$total_concurrent_coverage_gain" =~ ^(0|[1-9][0-9]*)$ ]]
          [[ "$expected_remaining" =~ ^(0|[1-9][0-9]*)$ ]]
          test $((expected_remaining + total_concurrent_coverage_gain)) -eq \
            "$EXPECTED_MISSING_POINTER_COUNT"
          [[ "$expected_fingerprint" =~ ^[0-9a-f]{64}$ ]]
          [[ "$expected_state" =~ ^[MALG]+$ ]]
          test "${#expected_state}" -eq "$MINIMUM_TARGETS"
          offset=0
          while [ "$offset" -lt "$MINIMUM_TARGETS" ]; do
            verify_identity
            receipt="artifacts/candidate-exact-batch-${offset}.json"
            if ! run_candidate_batch "$receipt"; then
              if jq -e \
                --argjson offset "$offset" \
                '.contract_version == "career.candidate_exact_cache_bootstrap.v2"
                 and .status == "failed"
                 and .batch_offset == $offset
                 and .cache_write_count == 0
                 and .owned_cache_write_count == 0
                 and .failure_count == 1
                 and (
                   (
                     .error_code == "CANDIDATE_RUNTIME_INITIALIZATION_FAILED"
                     and (.failure_stage | IN(
                       "load_candidate_application",
                       "bootstrap_candidate_kernel",
                       "validate_candidate_services",
                       "install_database_guard",
                       "resolve_candidate_services"
                     ))
                     and .error_category == "database_transient_read"
                   )
                   or (
                     .error_code == "UNEXPECTED_RUNNER_FAILURE"
                     and .failure_stage == "initialize_candidate_runtime"
                     and .error_category == "unexpected"
                   )
                 )
                 and .attempt_count == 1
                 and .retry_count == 0
                 and .queue_dispatch_count == 0
                 and .database_write_count == 0
                 and (.target? == null)
                 and (.slug? == null)
                 and (.locale? == null)
                 and (.message? == null)
                 and (.cache_key? == null)' \
                "$receipt" >/dev/null; then
                first_attempt_receipt="artifacts/candidate-exact-batch-${offset}-runtime-attempt-1.json"
                mv "$receipt" "$first_attempt_receipt"
                runtime_initialization_retry_count=$((runtime_initialization_retry_count + 1))
                verify_identity
                sleep "$BOOTSTRAP_DENSE_BATCH_COOLDOWN_SECONDS"
                if ! run_candidate_batch "$receipt"; then
                  echo "candidate-exact cache batch failed after one safe runtime initialization retry; inspect the sanitized receipts." >&2
                  exit 1
                fi
              else
                echo "candidate-exact cache batch failed outside the safe runtime initialization retry boundary; inspect the sanitized receipt." >&2
                exit 1
              fi
            fi

            owned_writes="$(jq -r '.owned_cache_write_count' "$receipt")"
            concurrent_gain="$(jq -r '.concurrent_coverage_gain_count' "$receipt")"
            pre_batch_concurrent_gain="$(
              jq -r '.pre_batch_concurrent_coverage_gain_count' "$receipt"
            )"
            pre_remaining="$(jq -r '.pre_batch_coverage.missing_pointer_count' "$receipt")"
            post_remaining="$(jq -r '.post_batch_coverage.missing_pointer_count' "$receipt")"
            [[ "$owned_writes" =~ ^(0|[1-9][0-9]*)$ ]]
            [[ "$concurrent_gain" =~ ^(0|[1-9][0-9]*)$ ]]
            [[ "$pre_batch_concurrent_gain" =~ ^(0|[1-9][0-9]*)$ ]]
            [[ "$pre_remaining" =~ ^(0|[1-9][0-9]*)$ ]]
            [[ "$post_remaining" =~ ^(0|[1-9][0-9]*)$ ]]
            test $((pre_remaining + pre_batch_concurrent_gain)) -eq "$expected_remaining"
            test "$post_remaining" -le "$pre_remaining"
            coverage_gain=$((pre_remaining - post_remaining))
            test "$coverage_gain" -eq $((owned_writes + concurrent_gain))
            jq -e \
              --arg candidate_sha "$CANDIDATE_RELEASE_REVISION" \
              --argjson offset "$offset" \
              --argjson owned_writes "$owned_writes" \
              --argjson concurrent_gain "$concurrent_gain" \
              --argjson pre_batch_concurrent_gain "$pre_batch_concurrent_gain" \
              --argjson pre_remaining "$pre_remaining" \
              --argjson post_remaining "$post_remaining" \
              --arg expected_fingerprint "$expected_fingerprint" \
              --argjson expected_targets "$MINIMUM_TARGETS" \
              --argjson offline_build_budget_ms "$OFFLINE_BUILD_BUDGET_MS" \
              --argjson retry_limit "$BOOTSTRAP_RETRY_LIMIT" \
              --argjson batch_size "$BOOTSTRAP_BATCH_SIZE" \
              '.contract_version == "career.candidate_exact_cache_bootstrap.v2"
               and .mode == "batch"
               and .status == "completed"
               and .candidate_revision == $candidate_sha
               and .batch_offset == $offset
               and .batch_size == $batch_size
               and .offline_build_budget_ms == $offline_build_budget_ms
               and .retry_limit == $retry_limit
               and .cache_write_count == $owned_writes
               and .owned_cache_write_count == $owned_writes
               and .concurrent_coverage_gain_count == $concurrent_gain
               and .pre_batch_concurrent_coverage_gain_count == $pre_batch_concurrent_gain
               and .failure_count == 0
               and .failure_stage == null
               and .error_category == null
               and .failed_target_index_sha256 == null
               and .retry_count >= 0
               and .retry_count <= .attempt_count
               and .queue_dispatch_count == 0
               and .database_write_count == 0
               and .authorized_pre_coverage_fingerprint_sha256 == $expected_fingerprint
               and (.pre_coverage_fingerprint_sha256 | test("^[0-9a-f]{64}$"))
               and (.post_coverage_fingerprint_sha256 | test("^[0-9a-f]{64}$"))
               and (.post_coverage_state | test("^[MALG]+$"))
               and (.post_coverage_state | length) == $expected_targets
               and .pre_batch_coverage.missing_pointer_count == $pre_remaining
               and .post_batch_coverage.missing_pointer_count == $post_remaining
               and (
                 .post_batch_coverage.covered_target_count
                 - .pre_batch_coverage.covered_target_count
               ) == ($owned_writes + $concurrent_gain)
               and .post_batch_coverage.missing_payload_count == 0
               and .post_batch_coverage.broken_count == 0
               and .post_batch_coverage.excluded_count == 0' \
              "$receipt" >/dev/null
            total_owned_writes=$((total_owned_writes + owned_writes))
            total_concurrent_coverage_gain=$((total_concurrent_coverage_gain + pre_batch_concurrent_gain + concurrent_gain))
            expected_remaining="$post_remaining"
            expected_fingerprint="$(jq -r '.post_coverage_fingerprint_sha256' "$receipt")"
            expected_state="$(jq -r '.post_coverage_state' "$receipt")"
            next_offset=$((offset + BOOTSTRAP_BATCH_SIZE))
            if [ "$owned_writes" -gt 0 ] && [ "$next_offset" -lt "$MINIMUM_TARGETS" ]; then
              sleep "$BOOTSTRAP_DENSE_BATCH_COOLDOWN_SECONDS"
            fi
            offset="$next_offset"
          done
          total_coverage_gain=$((total_owned_writes + total_concurrent_coverage_gain))
          test "$total_coverage_gain" -eq "$EXPECTED_MISSING_POINTER_COUNT"
          test "$expected_remaining" -eq 0
          jq -n \
            --argjson initial_missing_pointer_count "$EXPECTED_MISSING_POINTER_COUNT" \
            --argjson final_missing_pointer_count "$expected_remaining" \
            --argjson owned_cache_write_count "$total_owned_writes" \
            --argjson concurrent_coverage_gain_count "$total_concurrent_coverage_gain" \
            --argjson total_coverage_gain_count "$total_coverage_gain" \
            --argjson runtime_initialization_retry_count "$runtime_initialization_retry_count" \
            --argjson runtime_initialization_retry_limit "$BOOTSTRAP_RETRY_LIMIT" \
            --argjson dense_batch_cooldown_seconds "$BOOTSTRAP_DENSE_BATCH_COOLDOWN_SECONDS" \
            '{
              contract_version: "career.candidate_exact_cache_bootstrap.progress.v1",
              initial_missing_pointer_count: $initial_missing_pointer_count,
              final_missing_pointer_count: $final_missing_pointer_count,
              owned_cache_write_count: $owned_cache_write_count,
              concurrent_coverage_gain_count: $concurrent_coverage_gain_count,
              total_coverage_gain_count: $total_coverage_gain_count,
              runtime_initialization_retry_count: $runtime_initialization_retry_count,
              runtime_initialization_retry_limit_per_batch: $runtime_initialization_retry_limit,
              dense_batch_cooldown_seconds: $dense_batch_cooldown_seconds,
              queue_dispatch_count: 0,
              database_write_count: 0
            }' > artifacts/cache-bootstrap-progress.json
          verify_identity

      - name: Read back exact full coverage
        if: inputs.mode == 'bootstrap_and_verify'
        shell: bash
        env:
          DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
          EXPECTED_ACTIVE_REVISION: ${{ inputs.expected_active_revision }}
          CANDIDATE_RELEASE_NAME: ${{ inputs.candidate_release_name }}
          CANDIDATE_RELEASE_REVISION: ${{ inputs.candidate_release_revision }}
          EXPECTED_MISSING_POINTER_COUNT: ${{ inputs.expected_missing_pointer_count }}
        run: |
          set -euo pipefail
          post_bootstrap_raw="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH/releases/$CANDIDATE_RELEASE_NAME/backend' && sudo -n -u www-data -- /usr/bin/timeout 720 /usr/bin/php artisan career:verify-job-detail-cache-coverage --verify-only --locales=en,zh-CN --minimum-targets=$MINIMUM_TARGETS --json --no-interaction --no-ansi" \
            2>/dev/null)"
          jq -e \
            --argjson expected_targets "$MINIMUM_TARGETS" \
            '.status == "ready"
             and .expected_target_count == $expected_targets
             and .eligible_target_count == $expected_targets
             and .covered_target_count == $expected_targets
             and .missing_count == 0
             and .broken_count == 0
             and .excluded_count == 0
             and .coverage_ratio == 1' \
            <<<"$post_bootstrap_raw" >/dev/null
          jq '{
            contract_version,
            status,
            expected_target_count,
            eligible_target_count,
            covered_target_count,
            missing_count,
            broken_count,
            excluded_count,
            coverage_ratio
          }' <<<"$post_bootstrap_raw" > artifacts/post-bootstrap.json
          unset post_bootstrap_raw
          jq -e \
            --argjson expected_missing "$EXPECTED_MISSING_POINTER_COUNT" \
            '.contract_version == "career.candidate_exact_cache_bootstrap.progress.v1"
             and .initial_missing_pointer_count == $expected_missing
             and .final_missing_pointer_count == 0
             and .total_coverage_gain_count == $expected_missing
             and .total_coverage_gain_count == (
               .owned_cache_write_count + .concurrent_coverage_gain_count
             )
             and .queue_dispatch_count == 0
             and .database_write_count == 0' \
            artifacts/cache-bootstrap-progress.json >/dev/null
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -euo pipefail; current=\$(readlink -f '$DEPLOY_PATH/current'); candidate=\$(readlink -f '$DEPLOY_PATH/releases/$CANDIDATE_RELEASE_NAME'); test -n \"\$current\"; test -n \"\$candidate\"; test \"\$current\" != \"\$candidate\"; test \"\$(tr -d '\\r\\n' < \"\$current/REVISION\")\" = '$EXPECTED_ACTIVE_REVISION'; test \"\$(tr -d '\\r\\n' < \"\$candidate/REVISION\")\" = '$CANDIDATE_RELEASE_REVISION'; test ! -e '$DEPLOY_PATH/.dep/deploy.lock'" \
            2>/dev/null

      - name: Upload production cache repair receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: career-detail-production-cache-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 30
