name: MBTI W1 English Result Runtime Capability Phase Stdout Provenance Diagnostic

on:
  workflow_dispatch:
    inputs:
      expected_control_plane_sha:
        description: Exact latest main SHA containing this read-only diagnostic control
        required: true
        type: string
      expected_active_revision:
        description: Exact active production application SHA to inspect without mutation
        required: true
        type: string
      expected_approval_sha:
        description: Exact human-operator phase-provenance approval SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mbti-w1-result-runtime-capability-phase-provenance-diagnostic
  cancel-in-progress: false

jobs:
  read-only-phase-stdout-provenance-diagnostic:
    name: Diagnose exact result runtime phases without mutation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout exact control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.expected_control_plane_sha }}
          fetch-depth: 1

      - name: Verify immutable diagnostic inputs
        shell: bash
        env:
          EXPECTED_CONTROL_PLANE_SHA: ${{ inputs.expected_control_plane_sha }}
          EXPECTED_ACTIVE_REVISION: ${{ inputs.expected_active_revision }}
          EXPECTED_APPROVAL_SHA: ${{ inputs.expected_approval_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$EXPECTED_CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_ACTIVE_REVISION" = 660280d00a57e58bd8bc76608e19de2492c03f53
          test "$EXPECTED_APPROVAL_SHA" = 6e266ad254ca445ce4d60524af7deecebb78398cf5e65db34a62919f97aff6f7
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_CONTROL_PLANE_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_CONTROL_PLANE_SHA"
          printf '%s  %s\n' \
            6e266ad254ca445ce4d60524af7deecebb78398cf5e65db34a62919f97aff6f7 backend/content_assets/en-content-parity/CONTROL-approvals/W1-MBTI-RESULT-CONTENT/runtime-capability-phase-provenance-diagnostic-approval-2026-08-02.json \
            | sha256sum -c -
          jq -e '
            .artifact_kind == "controlled_transition_approval" and
            .schema_version == "fermatmind.en_content_parity_controlled_transition_approval.v1" and
            .control_id == "EN-PARITY-W1-MBTI-RESULT-RUNTIME-CAPABILITY-PHASE-PROVENANCE-DIAGNOSTIC-01" and
            .approval_owner == "human_operator" and
            .subscope_id == "W1-MBTI-RESULT-CONTENT" and
            .package_sha256 == "9325013b870fd2496efc0882656240f91ce28ff4faaf1da42fb3dde3577b0ed3" and
            .target_authority_receipt_sha256 == "f093096ff881bfabc633407d51ee01061dc17b9dbc43da41dc03ae7881b13756" and
            .target_manifest_sha256 == "649a61633a05728618477b97036718c582673c96a82c24d142287991b3d2d0e1" and
            .active_runtime_revision == "660280d00a57e58bd8bc76608e19de2492c03f53" and
            .gate == "runtime_capability_phase_provenance_diagnostic" and .verdict == "APPROVED" and
            .permissions.target_authority_readback_authorized == true and
            .permissions.runtime_projection_readback_authorized == true and
            .permissions.publish_authorized == false and .permissions.activation_authorized == false and
            .permissions.active_pointer_authorized == false and .permissions.indexability_authorized == false and
            .permissions.sitemap_authorized == false and .permissions.hreflang_authorized == false and
            .permissions.llms_authorized == false and .permissions.json_ld_authorized == false and
            .permissions.search_submission_authorized == false and .permissions.deployment_authorized == false and
            .permissions.private_result_read_authorized == false and .permissions.attempt_report_order_payment_read_authorized == false
          ' backend/content_assets/en-content-parity/CONTROL-approvals/W1-MBTI-RESULT-CONTENT/runtime-capability-phase-provenance-diagnostic-approval-2026-08-02.json >/dev/null

      - name: Set up pinned production SSH identity
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known hosts
        shell: bash
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS"
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null || ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f ~/.ssh/known_hosts >/dev/null

      - name: Execute one read-only phase stdout provenance diagnostic
        shell: bash
        env:
          DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
          CONTROL_PLANE_SHA: ${{ inputs.expected_control_plane_sha }}
          ACTIVE_REVISION: ${{ inputs.expected_active_revision }}
          APPROVAL_SHA: ${{ inputs.expected_approval_sha }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ && "$DEPLOY_PATH" != *".."* ]]
          receipt_path="$RUNNER_TEMP/mbti-result-english-runtime-capability-phase-provenance-diagnostic.json"
          candidate_receipt_path="$RUNNER_TEMP/mbti-result-english-runtime-capability-phase-provenance-diagnostic.candidate.json"
          emit_runner_failure_receipt() {
            jq -n --arg stage "$1" --arg error_code "$2" --arg control_plane_sha "$CONTROL_PLANE_SHA" --arg active_revision "$ACTIVE_REVISION" --arg approval_sha "$APPROVAL_SHA" '{artifact:"EN-PARITY-W1-MBTI-RESULT-RUNTIME-CAPABILITY-PHASE-PROVENANCE-DIAGNOSTIC-RECEIPT",schema_version:"fermatmind.en_parity.result_runtime_capability_phase_provenance_diagnostic_receipt.v1",status:"BLOCKED",ok:false,mode:"controlled_read_only_runtime_capability_phase_provenance_diagnostic",read_only:true,stage:$stage,error_code:$error_code,control_plane_sha:$control_plane_sha,active_revision:$active_revision,approval_sha256:$approval_sha,cms_write_attempted:false,publish_attempted:false,activation_attempted:false,active_pointer_changed:false,indexability_attempted:false,sitemap_attempted:false,hreflang_attempted:false,llms_attempted:false,json_ld_attempted:false,search_submission_attempted:false,deploy_attempted:false,private_authority_read_attempted:false,attempt_report_order_payment_read_attempted:false,phases:[]}' > "$receipt_path"
          }
          run_dir="/tmp/mbti-w1-result-runtime-capability-phase-provenance-${GITHUB_RUN_ID}"
          set +e
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' RUN_DIR='$run_dir' CONTROL_PLANE_SHA='$CONTROL_PLANE_SHA' ACTIVE_REVISION='$ACTIVE_REVISION' APPROVAL_SHA='$APPROVAL_SHA' bash -s" > "$candidate_receipt_path" 2>"$RUNNER_TEMP/mbti-result-runtime-phase-provenance.stderr" <<'REMOTE'
          set -euo pipefail
          current="$(readlink -f "$DEPLOY_PATH/current")"
          test -d "$current/backend"
          test -f "$current/REVISION"
          test "$(tr -d '\r\n' < "$current/REVISION")" = "$ACTIVE_REVISION"
          test ! -e "$DEPLOY_PATH/.dep/deploy.lock"
          trap 'rm -rf "$RUN_DIR"' EXIT
          mkdir -p "$RUN_DIR"
          cat > "$RUN_DIR/authority_metadata.php" <<'PHP'
          <?php
          declare(strict_types=1);
          require getenv('DEPLOYED_BACKEND_ROOT').'/vendor/autoload.php';
          $app = require getenv('DEPLOYED_BACKEND_ROOT').'/bootstrap/app.php';
          $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $release = \Illuminate\Support\Facades\DB::table('content_pack_releases')->select(['id', 'region', 'locale', 'dir_alias', 'to_pack_id', 'status', 'manifest_hash', 'compiled_hash', 'pack_version'])->where('id', '2b6deff4-0fdf-5d7c-a86f-e3d4aa61c488')->first();
          $manifest = \Illuminate\Support\Facades\DB::table('content_release_manifests')->select(['content_pack_release_id', 'manifest_hash', 'pack_id', 'pack_version', 'compiled_hash'])->where('manifest_hash', '649a61633a05728618477b97036718c582673c96a82c24d142287991b3d2d0e1')->first();
          $activation = \Illuminate\Support\Facades\DB::table('content_pack_activations')->where('pack_id', 'MBTI.global.en.default')->where('pack_version', 'v0.3')->exists();
          if ($release === null || $manifest === null || $activation || (string) $release->region !== 'GLOBAL' || (string) $release->locale !== 'en' || (string) $release->dir_alias !== 'MBTI-GLOBAL-en-v0.3' || strcasecmp((string) $release->to_pack_id, 'MBTI.global.en.default') !== 0 || (string) $release->status !== 'success' || (string) $release->manifest_hash !== '649a61633a05728618477b97036718c582673c96a82c24d142287991b3d2d0e1' || (string) $release->compiled_hash !== '9325013b870fd2496efc0882656240f91ce28ff4faaf1da42fb3dde3577b0ed3' || (string) $release->pack_version !== 'v0.3' || (string) $manifest->content_pack_release_id !== '2b6deff4-0fdf-5d7c-a86f-e3d4aa61c488' || strcasecmp((string) $manifest->pack_id, 'MBTI.global.en.default') !== 0 || (string) $manifest->pack_version !== 'v0.3' || (string) $manifest->compiled_hash !== '9325013b870fd2496efc0882656240f91ce28ff4faaf1da42fb3dde3577b0ed3') { exit(2); }
          PHP
          cat > "$RUN_DIR/physical_pack_resolver.php" <<'PHP'
          <?php
          declare(strict_types=1);
          require getenv('DEPLOYED_BACKEND_ROOT').'/vendor/autoload.php';
          $app = require getenv('DEPLOYED_BACKEND_ROOT').'/bootstrap/app.php';
          $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $resolved = $app->make(\App\Services\ContentPackResolver::class)->resolve('MBTI', 'GLOBAL', 'en', 'v0.3', 'MBTI-GLOBAL-en-v0.3');
          if ($resolved->packId !== 'MBTI.global.en.default' || ! is_array($resolved->manifest) || ($resolved->manifest['pack_id'] ?? null) !== 'MBTI.global.en.default' || ($resolved->manifest['locale'] ?? null) !== 'en' || ($resolved->manifest['content_package_version'] ?? null) !== 'v0.3' || basename((string) $resolved->baseDir) !== 'MBTI-GLOBAL-en-v0.3') { exit(3); }
          PHP
          cat > "$RUN_DIR/compiled_path_resolver.php" <<'PHP'
          <?php
          declare(strict_types=1);
          require getenv('DEPLOYED_BACKEND_ROOT').'/vendor/autoload.php';
          $app = require getenv('DEPLOYED_BACKEND_ROOT').'/bootstrap/app.php';
          $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          config()->set('storage_rollout.resolver_materialization_enabled', false);
          config()->set('storage_rollout.packs_v2_remote_rehydrate_enabled', false);
          $resolved = $app->make(\App\Services\Content\ContentPackV2Resolver::class)->resolveCompiledPathByManifestHash('MBTI.global.en.default', 'v0.3', '649a61633a05728618477b97036718c582673c96a82c24d142287991b3d2d0e1');
          if (! is_string($resolved) || $resolved === '') { exit(4); }
          PHP
          cat > "$RUN_DIR/isolated_projection_renderer.php" <<'PHP'
          <?php
          declare(strict_types=1);
          require getenv('DEPLOYED_BACKEND_ROOT').'/vendor/autoload.php';
          $app = require getenv('DEPLOYED_BACKEND_ROOT').'/bootstrap/app.php';
          $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $reflection = new \ReflectionClass(\App\Services\Mbti\MbtiResultPersonalizationService::class);
          $expectedPath = realpath(base_path('app/Services/Mbti/MbtiResultPersonalizationService.php'));
          $rendererPath = $reflection->getFileName();
          $method = $reflection->getMethod('applyToProjection');
          if (! is_string($expectedPath) || ! is_string($rendererPath) || realpath($rendererPath) !== $expectedPath || ! $method->isPublic() || $method->isStatic()) { exit(5); }
          $renderer = $reflection->newInstanceWithoutConstructor();
          $rendered = $renderer->applyToProjection(['sections' => [['key' => 'traits.close_call_axes', 'body_md' => 'Synthetic {{close_axis_label}} token.', 'payload' => ['summary' => 'Synthetic {{neighbor_type}} token.']]]], ['locale' => 'en', 'sections' => ['traits.close_call_axes' => ['blocks' => [], 'selected_blocks' => []]]]);
          if (! is_array($rendered)) { exit(6); }
          PHP
          phases_path="$RUN_DIR/phases.ndjson"
          : > "$phases_path"
          run_phase() {
            local name="$1"
            local script="$2"
            local stdout_path="$RUN_DIR/$name.stdout"
            local stderr_path="$RUN_DIR/$name.stderr"
            set +e
            env DEPLOYED_BACKEND_ROOT="$current/backend" php -d display_errors=0 -d log_errors=0 "$script" > "$stdout_path" 2> "$stderr_path"
            local exit_status=$?
            set -e
            local stdout_bytes newline_count stdout_sha256 json_document_count json_valid classification
            stdout_bytes="$(wc -c < "$stdout_path" | tr -d '[:space:]')"
            newline_count="$(wc -l < "$stdout_path" | tr -d '[:space:]')"
            stdout_sha256="$(sha256sum "$stdout_path" | awk '{print $1}')"
            json_document_count=0
            json_valid=false
            if jq -e -s 'type == "array"' "$stdout_path" >/dev/null 2>&1; then
              json_document_count="$(jq -s 'length' "$stdout_path")"
              json_valid=true
            fi
            if [ "$exit_status" -ne 0 ]; then
              classification=probe_failed
            elif [ "$stdout_bytes" = 0 ]; then
              classification=empty
            elif [ "$json_valid" = true ] && [ "$json_document_count" -gt 1 ]; then
              classification=multiple_json_documents
            elif [ "$json_valid" = true ] && [ "$json_document_count" -eq 1 ]; then
              classification=single_json_document_observed
            else
              classification=direct_stdout_observed
            fi
            jq -nc --arg name "$name" --arg classification "$classification" --arg stdout_sha256 "$stdout_sha256" --argjson exit_status "$exit_status" --argjson stdout_bytes "$stdout_bytes" --argjson newline_count "$newline_count" --argjson json_document_count "$json_document_count" --argjson json_valid "$json_valid" '{name:$name,exit_status:$exit_status,stdout_bytes:$stdout_bytes,newline_count:$newline_count,json_document_count:$json_document_count,json_valid:$json_valid,stdout_sha256:$stdout_sha256,classification:$classification}' >> "$phases_path"
          }
          run_phase authority_metadata "$RUN_DIR/authority_metadata.php"
          run_phase physical_pack_resolver "$RUN_DIR/physical_pack_resolver.php"
          run_phase compiled_path_resolver "$RUN_DIR/compiled_path_resolver.php"
          run_phase isolated_projection_renderer "$RUN_DIR/isolated_projection_renderer.php"
          phases="$(jq -s '.' "$phases_path")"
          if jq -e 'all(.[]; .classification == "empty")' <<< "$phases" >/dev/null; then
            status=PASS
            ok=true
            error_code=null
          else
            status=BLOCKED
            ok=false
            error_code=phase_stdout_provenance_observed
          fi
          jq -nc --arg status "$status" --argjson ok "$ok" --arg error_code "$error_code" --arg control_plane_sha "$CONTROL_PLANE_SHA" --arg active_revision "$ACTIVE_REVISION" --arg approval_sha "$APPROVAL_SHA" --argjson phases "$phases" '{artifact:"EN-PARITY-W1-MBTI-RESULT-RUNTIME-CAPABILITY-PHASE-PROVENANCE-DIAGNOSTIC-RECEIPT",schema_version:"fermatmind.en_parity.result_runtime_capability_phase_provenance_diagnostic_receipt.v1",status:$status,ok:$ok,mode:"controlled_read_only_runtime_capability_phase_provenance_diagnostic",read_only:true,stage:"phase_stdout_provenance_diagnostic",error_code:(if $error_code == "null" then null else $error_code end),control_plane_sha:$control_plane_sha,active_revision:$active_revision,approval_sha256:$approval_sha,cms_write_attempted:false,publish_attempted:false,activation_attempted:false,active_pointer_changed:false,indexability_attempted:false,sitemap_attempted:false,hreflang_attempted:false,llms_attempted:false,json_ld_attempted:false,search_submission_attempted:false,deploy_attempted:false,private_authority_read_attempted:false,attempt_report_order_payment_read_attempted:false,phases:$phases}'
          REMOTE
          remote_status=$?
          set -e
          if [ "$remote_status" -ne 0 ]; then
            emit_runner_failure_receipt remote_transport_or_bootstrap_failed remote_transport_or_bootstrap_failed
            exit 1
          fi
          if ! test -s "$candidate_receipt_path" || ! jq -e -s --arg control_plane_sha "$CONTROL_PLANE_SHA" --arg active_revision "$ACTIVE_REVISION" --arg approval_sha "$APPROVAL_SHA" '
            length == 1 and (.[0] |
              .artifact == "EN-PARITY-W1-MBTI-RESULT-RUNTIME-CAPABILITY-PHASE-PROVENANCE-DIAGNOSTIC-RECEIPT" and
              .schema_version == "fermatmind.en_parity.result_runtime_capability_phase_provenance_diagnostic_receipt.v1" and
              (.status == "PASS" or .status == "BLOCKED") and
              .mode == "controlled_read_only_runtime_capability_phase_provenance_diagnostic" and .read_only == true and
              .control_plane_sha == $control_plane_sha and .active_revision == $active_revision and .approval_sha256 == $approval_sha and
              .cms_write_attempted == false and .publish_attempted == false and .activation_attempted == false and .active_pointer_changed == false and
              .indexability_attempted == false and .sitemap_attempted == false and .hreflang_attempted == false and .llms_attempted == false and
              .json_ld_attempted == false and .search_submission_attempted == false and .deploy_attempted == false and
              .private_authority_read_attempted == false and .attempt_report_order_payment_read_attempted == false and
              (.phases | type == "array" and length == 4 and all(.[]; (. | keys | sort) == ["classification","exit_status","json_document_count","json_valid","name","newline_count","stdout_bytes","stdout_sha256"]))
            )
          ' "$candidate_receipt_path" >/dev/null; then
            emit_runner_failure_receipt runner_receipt_contract_failed runner_receipt_contract_failed
            exit 1
          fi
          mv "$candidate_receipt_path" "$receipt_path"
          if jq -e '.status == "BLOCKED"' "$receipt_path" >/dev/null; then
            exit 1
          fi

      - name: Publish immutable read-only phase provenance receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mbti-w1-result-english-runtime-capability-phase-provenance-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mbti-result-english-runtime-capability-phase-provenance-diagnostic.json
          if-no-files-found: warn
          retention-days: 90
