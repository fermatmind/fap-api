name: Enneagram PR23 Cache-Only Resume

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preflight is read-only; execute performs HMAC plus post-readback; post_readback_only resumes reads from an exact committed-HMAC receipt"
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - execute
          - post_readback_only
      expected_control_plane_sha:
        description: "Exact latest fap-api main SHA containing this control plane"
        required: true
        type: string
      expected_runner_sha256:
        description: "Execute-only exact runner SHA256 from the immutable preflight"
        required: false
        default: ""
        type: string
      authorization_preflight_run_id:
        description: "Execute-only successful cache-only preflight run id"
        required: false
        default: ""
        type: string
      authorization_preflight_run_attempt:
        description: "Execute-only successful cache-only preflight run attempt"
        required: false
        default: ""
        type: string
      expected_state_fingerprint_sha256:
        description: "Execute-only exact preflight state fingerprint"
        required: false
        default: ""
        type: string
      expected_backend_sha:
        description: "Exact active production backend REVISION"
        required: true
        type: string
      expected_frontend_sha:
        description: "Exact active production frontend /revision"
        required: true
        type: string
      expected_package_sha256:
        description: "Exact Enneagram Authority V2 package SHA256"
        required: true
        type: string
      expected_release_report_sha256:
        description: "Exact release-gate report SHA256"
        required: true
        type: string
      runtime_config_apply_run_id:
        description: "Exact successful fap-web runtime-config apply run; fixed to 30333691762"
        required: true
        type: string
      runtime_config_apply_run_attempt:
        description: "Exact successful fap-web runtime-config apply attempt; fixed to 1"
        required: true
        type: string
      runtime_config_apply_receipt_sha256:
        description: "Exact sanitized fap-web runtime-config apply receipt SHA256"
        required: true
        type: string
      runtime_config_apply_receipt_base64:
        description: "Exact sanitized fap-web runtime-config apply receipt, base64 encoded"
        required: true
        type: string
      rollback_token_sha256:
        description: "Exact persisted PR23 rollback-token SHA256; token itself is forbidden"
        required: true
        type: string
      authorization_phrase:
        description: "Execute-only exact phrase generated by the immutable preflight"
        required: false
        default: ""
        type: string
      source_execute_run_id:
        description: "Post-readback-only exact failed execute run whose receipt proves committed HMAC revalidation"
        required: false
        default: ""
        type: string
      source_execute_run_attempt:
        description: "Post-readback-only exact source execute attempt"
        required: false
        default: ""
        type: string
      source_execute_control_plane_sha:
        description: "Post-readback-only exact source execute control-plane SHA"
        required: false
        default: ""
        type: string
      source_execute_runner_sha256:
        description: "Post-readback-only exact source execute runner SHA256"
        required: false
        default: ""
        type: string
      source_execute_receipt_sha256:
        description: "Post-readback-only exact sanitized source execute receipt SHA256"
        required: false
        default: ""
        type: string
      source_execute_receipt_base64:
        description: "Post-readback-only sanitized source execute receipt, base64 encoded"
        required: false
        default: ""
        type: string

permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  group: deploy-${{ github.repository }}-production
  cancel-in-progress: false

jobs:
  cache-only-resume:
    name: Enneagram PR23 cache-only resume (${{ inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    env:
      RUNNER_PATH: backend/scripts/deploy/enneagram_pr23_cache_only_resume.php
      API_ORIGIN: https://api.fermatmind.com
      FRONTEND_ORIGIN: https://fermatmind.com
      EXPECTED_CONTROL_PLANE_SHA: ${{ inputs.expected_control_plane_sha }}
      EXPECTED_RUNNER_SHA256: ${{ inputs.expected_runner_sha256 }}
      EXPECTED_BACKEND_SHA: ${{ inputs.expected_backend_sha }}
      EXPECTED_FRONTEND_SHA: ${{ inputs.expected_frontend_sha }}
      EXPECTED_PACKAGE_SHA256: ${{ inputs.expected_package_sha256 }}
      EXPECTED_RELEASE_REPORT_SHA256: ${{ inputs.expected_release_report_sha256 }}
      RUNTIME_CONFIG_APPLY_RUN_ID: ${{ inputs.runtime_config_apply_run_id }}
      RUNTIME_CONFIG_APPLY_RUN_ATTEMPT: ${{ inputs.runtime_config_apply_run_attempt }}
      RUNTIME_CONFIG_APPLY_RECEIPT_SHA256: ${{ inputs.runtime_config_apply_receipt_sha256 }}
      ROLLBACK_TOKEN_SHA256: ${{ inputs.rollback_token_sha256 }}
      AUTHORIZATION_PREFLIGHT_RUN_ID: ${{ inputs.authorization_preflight_run_id }}
      AUTHORIZATION_PREFLIGHT_RUN_ATTEMPT: ${{ inputs.authorization_preflight_run_attempt }}
      EXPECTED_STATE_FINGERPRINT_SHA256: ${{ inputs.expected_state_fingerprint_sha256 }}
      AUTHORIZATION_PHRASE: ${{ inputs.authorization_phrase }}
      SOURCE_EXECUTE_RUN_ID: ${{ inputs.source_execute_run_id }}
      SOURCE_EXECUTE_RUN_ATTEMPT: ${{ inputs.source_execute_run_attempt }}
      SOURCE_EXECUTE_CONTROL_PLANE_SHA: ${{ inputs.source_execute_control_plane_sha }}
      SOURCE_EXECUTE_RUNNER_SHA256: ${{ inputs.source_execute_runner_sha256 }}
      SOURCE_EXECUTE_RECEIPT_SHA256: ${{ inputs.source_execute_receipt_sha256 }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Validate exact cache-only operation inputs
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$EXPECTED_CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_BACKEND_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_FRONTEND_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_PACKAGE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_RELEASE_REPORT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RUNTIME_CONFIG_APPLY_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$ROLLBACK_TOKEN_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$RUNTIME_CONFIG_APPLY_RUN_ID" = "30333691762"
          test "$RUNTIME_CONFIG_APPLY_RUN_ATTEMPT" = "1"
          case "$MODE" in
            preflight)
              test -z "$EXPECTED_RUNNER_SHA256"
              test -z "$AUTHORIZATION_PREFLIGHT_RUN_ID"
              test -z "$AUTHORIZATION_PREFLIGHT_RUN_ATTEMPT"
              test -z "$EXPECTED_STATE_FINGERPRINT_SHA256"
              test -z "$AUTHORIZATION_PHRASE"
              test -z "$SOURCE_EXECUTE_RUN_ID"
              test -z "$SOURCE_EXECUTE_RUN_ATTEMPT"
              test -z "$SOURCE_EXECUTE_CONTROL_PLANE_SHA"
              test -z "$SOURCE_EXECUTE_RUNNER_SHA256"
              test -z "$SOURCE_EXECUTE_RECEIPT_SHA256"
              ;;
            execute)
              [[ "$EXPECTED_RUNNER_SHA256" =~ ^[0-9a-f]{64}$ ]]
              [[ "$AUTHORIZATION_PREFLIGHT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
              [[ "$AUTHORIZATION_PREFLIGHT_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
              [[ "$EXPECTED_STATE_FINGERPRINT_SHA256" =~ ^[0-9a-f]{64}$ ]]
              test -n "$AUTHORIZATION_PHRASE"
              test -z "$SOURCE_EXECUTE_RUN_ID"
              test -z "$SOURCE_EXECUTE_RUN_ATTEMPT"
              test -z "$SOURCE_EXECUTE_CONTROL_PLANE_SHA"
              test -z "$SOURCE_EXECUTE_RUNNER_SHA256"
              test -z "$SOURCE_EXECUTE_RECEIPT_SHA256"
              ;;
            post_readback_only)
              test -z "$EXPECTED_RUNNER_SHA256"
              [[ "$AUTHORIZATION_PREFLIGHT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
              [[ "$AUTHORIZATION_PREFLIGHT_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
              [[ "$EXPECTED_STATE_FINGERPRINT_SHA256" =~ ^[0-9a-f]{64}$ ]]
              test -z "$AUTHORIZATION_PHRASE"
              [[ "$SOURCE_EXECUTE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
              [[ "$SOURCE_EXECUTE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
              [[ "$SOURCE_EXECUTE_CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]]
              [[ "$SOURCE_EXECUTE_RUNNER_SHA256" =~ ^[0-9a-f]{64}$ ]]
              [[ "$SOURCE_EXECUTE_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
              ;;
            *)
              echo "Unsupported mode." >&2
              exit 2
              ;;
          esac

      - name: Check out exact main control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.expected_control_plane_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind latest main and exact runner
        id: bind
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          control_plane_sha="$(git rev-parse HEAD)"
          test "$control_plane_sha" = "$GITHUB_SHA"
          test "$control_plane_sha" = "$EXPECTED_CONTROL_PLANE_SHA"
          test "$control_plane_sha" = "$(git rev-parse origin/main)"
          runner_sha256="$(sha256sum "$RUNNER_PATH" | awk '{print $1}')"
          [[ "$runner_sha256" =~ ^[0-9a-f]{64}$ ]]
          if [ "$MODE" = execute ]; then
            test "$runner_sha256" = "$EXPECTED_RUNNER_SHA256"
          fi
          echo "runner_sha256=$runner_sha256" >> "$GITHUB_OUTPUT"

      - name: Verify required checks are green
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          INPUT_CONTROL_PLANE_SHA: ${{ inputs.expected_control_plane_sha }}
        with:
          script: |
            const sha = process.env.INPUT_CONTROL_PLANE_SHA || '';
            const required = [
              'hygiene',
              'supply-chain',
              'content-pack-build-validate',
              'verify-mbti-legacy',
              'verify-mbti-v2',
              'verify-bigfive',
              'Semgrep blocking secrets',
            ];
            const runs = await github.paginate(github.rest.checks.listForRef, {
              ...context.repo,
              ref: sha,
              per_page: 100,
            });
            for (const name of required) {
              const run = runs
                .filter((item) => item.name === name)
                .sort((a, b) => Number(b.id) - Number(a.id))[0];
              if (!run || run.status !== 'completed' || run.conclusion !== 'success') {
                core.setFailed(`Required check is not green: ${name}.`);
                return;
              }
            }

      - name: Validate exact fap-web runtime-config apply evidence
        shell: bash
        env:
          RUNTIME_CONFIG_APPLY_RECEIPT_BASE64: ${{ inputs.runtime_config_apply_receipt_base64 }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/fap-web-runtime-config-apply.json"
          printf '%s' "$RUNTIME_CONFIG_APPLY_RECEIPT_BASE64" | base64 --decode > "$receipt"
          test "$(sha256sum "$receipt" | awk '{print $1}')" = "$RUNTIME_CONFIG_APPLY_RECEIPT_SHA256"
          jq -e \
            --arg frontend "$EXPECTED_FRONTEND_SHA" \
            '.mode == "apply"
             and .ok == true
             and .status == "PASS_RUNTIME_CONFIG_CONVERGED"
             and .active_frontend_sha == $frontend
             and .writes_committed == true
             and .runtime_setting_write_count == 3
             and .pm2_reload_committed == true
             and .application_deploy == false
             and .cache_revalidation == false
             and .secret_values_output == false' "$receipt" >/dev/null
          run_json="$(gh api "repos/fermatmind/fap-web/actions/runs/${RUNTIME_CONFIG_APPLY_RUN_ID}")"
          jq -e \
            --arg frontend "$EXPECTED_FRONTEND_SHA" \
            --argjson attempt "$RUNTIME_CONFIG_APPLY_RUN_ATTEMPT" \
            '.status == "completed"
             and .conclusion == "success"
             and .event == "workflow_dispatch"
             and .run_attempt == $attempt' <<<"$run_json" >/dev/null
          test "$(jq -r '.path' <<<"$run_json")" = \
            ".github/workflows/content-release-revalidation-runtime-config.yml"
          echo "Exact sanitized fap-web runtime-config apply evidence verified."

      - name: Bind immutable cache-only preflight
        if: inputs.mode == 'execute'
        shell: bash
        run: |
          set -euo pipefail
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${AUTHORIZATION_PREFLIGHT_RUN_ID}")"
          jq -e \
            --arg sha "$EXPECTED_CONTROL_PLANE_SHA" \
            --argjson attempt "$AUTHORIZATION_PREFLIGHT_RUN_ATTEMPT" \
            '.status == "completed"
             and .conclusion == "success"
             and .event == "workflow_dispatch"
             and .head_sha == $sha
             and .run_attempt == $attempt' <<<"$run_json" >/dev/null
          test "$(jq -r '.path' <<<"$run_json")" = \
            ".github/workflows/enneagram-pr23-cache-only-resume.yml"
          preflight_dir="$RUNNER_TEMP/authorized-preflight"
          mkdir -p "$preflight_dir"
          gh run download "$AUTHORIZATION_PREFLIGHT_RUN_ID" \
            --name "enneagram-pr23-cache-only-preflight-${AUTHORIZATION_PREFLIGHT_RUN_ID}-${AUTHORIZATION_PREFLIGHT_RUN_ATTEMPT}" \
            --dir "$preflight_dir"
          receipt="$preflight_dir/preflight.json"
          test -f "$receipt"
          jq -e \
            --arg control "$EXPECTED_CONTROL_PLANE_SHA" \
            --arg runner "$EXPECTED_RUNNER_SHA256" \
            --arg backend "$EXPECTED_BACKEND_SHA" \
            --arg frontend "$EXPECTED_FRONTEND_SHA" \
            --arg package "$EXPECTED_PACKAGE_SHA256" \
            --arg report "$EXPECTED_RELEASE_REPORT_SHA256" \
            --arg runtime_receipt "$RUNTIME_CONFIG_APPLY_RECEIPT_SHA256" \
            --arg rollback "$ROLLBACK_TOKEN_SHA256" \
            --arg state "$EXPECTED_STATE_FINGERPRINT_SHA256" \
            --arg phrase "$AUTHORIZATION_PHRASE" \
            --argjson run_id "$AUTHORIZATION_PREFLIGHT_RUN_ID" \
            --argjson run_attempt "$AUTHORIZATION_PREFLIGHT_RUN_ATTEMPT" \
            '.contract_version == "enneagram.pr23.cache_only_resume.v1"
             and .authorization_contract_version == "enneagram.pr23.cache_only_resume.authorization.v1"
             and .ok == true
             and .status == "PASS_CACHE_ONLY_RESUME_PREFLIGHT_AUTHORIZATION_REQUIRED"
             and .preflight_run_id == $run_id
             and .preflight_run_attempt == $run_attempt
             and .control_plane_sha == $control
             and .runner_sha256 == $runner
             and .backend_sha == $backend
             and .frontend_sha == $frontend
             and .package_sha256 == $package
             and .release_report_sha256 == $report
             and .runtime_config_apply_run_id == 30333691762
             and .runtime_config_apply_run_attempt == 1
             and .runtime_config_receipt_sha256 == $runtime_receipt
             and .rollback_token_sha256 == $rollback
             and .published_count == 116
             and .working_count == 116
             and .approved_review_count == 116
             and .state_fingerprint_sha256 == $state
             and .authorization_phrase == $phrase
             and .writes_committed == false' "$receipt" >/dev/null
          authorized_projection="$(jq -r '.public_projection_fingerprint' "$receipt")"
          authorized_discoverability="$(
            jq -r '.stable_identity_discoverability_fingerprint' "$receipt"
          )"
          authorized_url_sets="$(jq -r '.url_sets_sha256' "$receipt")"
          [[ "$authorized_projection" =~ ^[0-9a-f]{64}$ ]]
          [[ "$authorized_discoverability" =~ ^[0-9a-f]{64}$ ]]
          [[ "$authorized_url_sets" =~ ^[0-9a-f]{64}$ ]]
          echo "AUTHORIZED_PUBLIC_PROJECTION_FINGERPRINT=$authorized_projection" >> "$GITHUB_ENV"
          echo "AUTHORIZED_DISCOVERABILITY_FINGERPRINT=$authorized_discoverability" >> "$GITHUB_ENV"
          echo "AUTHORIZED_URL_SETS_SHA256=$authorized_url_sets" >> "$GITHUB_ENV"

      - name: Bind committed HMAC receipt for post-readback-only resume
        if: inputs.mode == 'post_readback_only'
        shell: bash
        env:
          SOURCE_EXECUTE_RECEIPT_BASE64: ${{ inputs.source_execute_receipt_base64 }}
        run: |
          set -euo pipefail
          source_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_EXECUTE_RUN_ID}")"
          jq -e \
            --arg sha "$SOURCE_EXECUTE_CONTROL_PLANE_SHA" \
            --argjson attempt "$SOURCE_EXECUTE_RUN_ATTEMPT" \
            '.status == "completed"
             and .conclusion == "failure"
             and .event == "workflow_dispatch"
             and .head_sha == $sha
             and .run_attempt == $attempt' <<<"$source_run" >/dev/null
          test "$(jq -r '.path' <<<"$source_run")" = \
            ".github/workflows/enneagram-pr23-cache-only-resume.yml"

          source_receipt="$RUNNER_TEMP/source-execute.json"
          printf '%s' "$SOURCE_EXECUTE_RECEIPT_BASE64" | base64 --decode > "$source_receipt"
          test "$(sha256sum "$source_receipt" | awk '{print $1}')" = \
            "$SOURCE_EXECUTE_RECEIPT_SHA256"
          jq -e \
            '.contract_version == "enneagram.pr23.cache_only_resume.v1"
             and .ok == false
             and .status == "FAIL_CLOSED"
             and .failure_stage == "post_readback_canary-00"
             and .writes_committed == true
             and .frontend_revalidation_attempted == true
             and .frontend_revalidation_committed == true
             and .import_committed == false
             and .review_bind_committed == false
             and .promotion_committed == false
             and .rollback_committed == false
             and .backend_cache_invalidation_committed == false
             and .deployment_committed == false
             and .pr23_rerun == false
             and .secret_output == false
             and .nonce_output == false
             and .signature_output == false' "$source_receipt" >/dev/null

          preflight_run="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${AUTHORIZATION_PREFLIGHT_RUN_ID}"
          )"
          jq -e \
            --arg source_sha "$SOURCE_EXECUTE_CONTROL_PLANE_SHA" \
            --argjson attempt "$AUTHORIZATION_PREFLIGHT_RUN_ATTEMPT" \
            '.status == "completed"
             and .conclusion == "success"
             and .event == "workflow_dispatch"
             and .head_sha == $source_sha
             and .run_attempt == $attempt' <<<"$preflight_run" >/dev/null
          preflight_dir="$RUNNER_TEMP/source-preflight"
          mkdir -p "$preflight_dir"
          gh run download "$AUTHORIZATION_PREFLIGHT_RUN_ID" \
            --name "enneagram-pr23-cache-only-preflight-${AUTHORIZATION_PREFLIGHT_RUN_ID}-${AUTHORIZATION_PREFLIGHT_RUN_ATTEMPT}" \
            --dir "$preflight_dir"
          preflight_receipt="$preflight_dir/preflight.json"
          jq -e \
            --arg source_control "$SOURCE_EXECUTE_CONTROL_PLANE_SHA" \
            --arg source_runner "$SOURCE_EXECUTE_RUNNER_SHA256" \
            --arg backend "$EXPECTED_BACKEND_SHA" \
            --arg frontend "$EXPECTED_FRONTEND_SHA" \
            --arg package "$EXPECTED_PACKAGE_SHA256" \
            --arg report "$EXPECTED_RELEASE_REPORT_SHA256" \
            --arg state "$EXPECTED_STATE_FINGERPRINT_SHA256" \
            '.ok == true
             and .status == "PASS_CACHE_ONLY_RESUME_PREFLIGHT_AUTHORIZATION_REQUIRED"
             and .control_plane_sha == $source_control
             and .runner_sha256 == $source_runner
             and .backend_sha == $backend
             and .frontend_sha == $frontend
             and .package_sha256 == $package
             and .release_report_sha256 == $report
             and .state_fingerprint_sha256 == $state
             and .published_count == 116
             and .working_count == 116
             and .approved_review_count == 116
             and .writes_committed == false' "$preflight_receipt" >/dev/null
          authorized_projection="$(jq -r '.public_projection_fingerprint' "$preflight_receipt")"
          authorized_discoverability="$(
            jq -r '.stable_identity_discoverability_fingerprint' "$preflight_receipt"
          )"
          authorized_url_sets="$(jq -r '.url_sets_sha256' "$preflight_receipt")"
          [[ "$authorized_projection" =~ ^[0-9a-f]{64}$ ]]
          [[ "$authorized_discoverability" =~ ^[0-9a-f]{64}$ ]]
          [[ "$authorized_url_sets" =~ ^[0-9a-f]{64}$ ]]
          echo "AUTHORIZED_PUBLIC_PROJECTION_FINGERPRINT=$authorized_projection" >> "$GITHUB_ENV"
          echo "AUTHORIZED_DISCOVERABILITY_FINGERPRINT=$authorized_discoverability" >> "$GITHUB_ENV"
          echo "AUTHORIZED_URL_SETS_SHA256=$authorized_url_sets" >> "$GITHUB_ENV"

      - name: Reject intervening cache-only execute runs
        if: inputs.mode == 'execute' || inputs.mode == 'post_readback_only'
        shell: bash
        run: |
          set -euo pipefail
          runs="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows/enneagram-pr23-cache-only-resume.yml/runs?event=workflow_dispatch&per_page=100")"
          lower_bound="$AUTHORIZATION_PREFLIGHT_RUN_ID"
          if [ "${{ inputs.mode }}" = post_readback_only ]; then
            lower_bound="$SOURCE_EXECUTE_RUN_ID"
          fi
          mapfile -t candidates < <(
            jq -r \
              --argjson preflight "$lower_bound" \
              --argjson current "$GITHUB_RUN_ID" \
              '.workflow_runs[]
               | select(.id > $preflight and .id < $current)
               | .id' <<<"$runs"
          )
          for run_id in "${candidates[@]}"; do
            jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100")"
            if jq -e \
              '.jobs[] | select(.name == "Enneagram PR23 cache-only resume (execute)")' \
              <<<"$jobs" >/dev/null; then
              echo "INTERVENING_CACHE_ONLY_EXECUTE_RUN" >&2
              exit 2
            fi
          done

      - name: Set up SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known hosts
        shell: bash
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Run bounded cache-only control
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
          RUNNER_SHA256: ${{ steps.bind.outputs.runner_sha256 }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_PATH" != *".."* ]]
          if [ "$MODE" = preflight ]; then
            bound_run_id="$GITHUB_RUN_ID"
            bound_run_attempt="$GITHUB_RUN_ATTEMPT"
          else
            bound_run_id="$AUTHORIZATION_PREFLIGHT_RUN_ID"
            bound_run_attempt="$AUTHORIZATION_PREFLIGHT_RUN_ATTEMPT"
          fi
          remote_command="$(
            printf 'test ! -e %q/.dep/deploy.lock && ' "$DEPLOY_PATH"
            printf 'sudo -n -u www-data -- /bin/sh -c %q && ' 'for environment in /proc/[0-9]*/environ; do [ -r "$environment" ] || continue; if tr "\0" "\n" < "$environment" | grep -qx "FM_ENNEAGRAM_RUNNER_EXECUTE=1"; then exit 1; fi; done'
            printf 'active_backend=$(readlink -f %q/current/backend) && test -n \"$active_backend\" && sudo -n -u www-data -- env ' "$DEPLOY_PATH"
            printf 'FM_ENNEAGRAM_RESUME_MODE=%q ' "$MODE"
            printf 'FM_ENNEAGRAM_RUNNER_EXECUTE=1 '
            printf 'FM_ENNEAGRAM_ACTIVE_BACKEND="$active_backend" '
            printf 'FM_ENNEAGRAM_MANAGED_DEPLOY_ROOT=%q/releases ' "$DEPLOY_PATH"
            printf 'FM_ENNEAGRAM_PREFLIGHT_RUN_ID=%q ' "$bound_run_id"
            printf 'FM_ENNEAGRAM_PREFLIGHT_RUN_ATTEMPT=%q ' "$bound_run_attempt"
            printf 'FM_ENNEAGRAM_CONTROL_PLANE_SHA=%q ' "$EXPECTED_CONTROL_PLANE_SHA"
            printf 'FM_ENNEAGRAM_RUNNER_SHA256=%q ' "$RUNNER_SHA256"
            printf 'FM_ENNEAGRAM_BACKEND_SHA=%q ' "$EXPECTED_BACKEND_SHA"
            printf 'FM_ENNEAGRAM_FRONTEND_SHA=%q ' "$EXPECTED_FRONTEND_SHA"
            printf 'FM_ENNEAGRAM_PACKAGE_SHA256=%q ' "$EXPECTED_PACKAGE_SHA256"
            printf 'FM_ENNEAGRAM_RELEASE_REPORT_SHA256=%q ' "$EXPECTED_RELEASE_REPORT_SHA256"
            printf 'FM_ENNEAGRAM_RUNTIME_CONFIG_APPLY_RUN_ID=%q ' "$RUNTIME_CONFIG_APPLY_RUN_ID"
            printf 'FM_ENNEAGRAM_RUNTIME_CONFIG_APPLY_RUN_ATTEMPT=%q ' "$RUNTIME_CONFIG_APPLY_RUN_ATTEMPT"
            printf 'FM_ENNEAGRAM_RUNTIME_CONFIG_RECEIPT_SHA256=%q ' "$RUNTIME_CONFIG_APPLY_RECEIPT_SHA256"
            printf 'FM_ENNEAGRAM_ROLLBACK_TOKEN_SHA256=%q ' "$ROLLBACK_TOKEN_SHA256"
            printf 'FM_ENNEAGRAM_API_ORIGIN=%q ' "$API_ORIGIN"
            printf 'FM_ENNEAGRAM_FRONTEND_ORIGIN=%q ' "$FRONTEND_ORIGIN"
            printf 'FM_ENNEAGRAM_EXPECTED_STATE_FINGERPRINT=%q ' "$EXPECTED_STATE_FINGERPRINT_SHA256"
            printf 'FM_ENNEAGRAM_AUTHORIZED_PUBLIC_PROJECTION_FINGERPRINT=%q ' "${AUTHORIZED_PUBLIC_PROJECTION_FINGERPRINT:-}"
            printf 'FM_ENNEAGRAM_AUTHORIZED_DISCOVERABILITY_FINGERPRINT=%q ' "${AUTHORIZED_DISCOVERABILITY_FINGERPRINT:-}"
            printf 'FM_ENNEAGRAM_AUTHORIZED_URL_SETS_SHA256=%q ' "${AUTHORIZED_URL_SETS_SHA256:-}"
            printf 'FM_ENNEAGRAM_AUTHORIZATION_PHRASE=%q ' "$AUTHORIZATION_PHRASE"
            printf 'FM_ENNEAGRAM_SOURCE_EXECUTE_RUN_ID=%q ' "$SOURCE_EXECUTE_RUN_ID"
            printf 'FM_ENNEAGRAM_SOURCE_EXECUTE_RUN_ATTEMPT=%q ' "$SOURCE_EXECUTE_RUN_ATTEMPT"
            printf 'FM_ENNEAGRAM_SOURCE_EXECUTE_CONTROL_PLANE_SHA=%q ' "$SOURCE_EXECUTE_CONTROL_PLANE_SHA"
            printf 'FM_ENNEAGRAM_SOURCE_EXECUTE_RUNNER_SHA256=%q ' "$SOURCE_EXECUTE_RUNNER_SHA256"
            printf 'FM_ENNEAGRAM_SOURCE_EXECUTE_RECEIPT_SHA256=%q ' "$SOURCE_EXECUTE_RECEIPT_SHA256"
            printf '/usr/bin/timeout 5400 /usr/bin/php'
          )"
          receipt="$RUNNER_TEMP/cache-only-resume.json"
          set +e
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "$remote_command" \
            < "$RUNNER_PATH" > "$receipt"
          status=$?
          set -e
          case "$MODE" in
            preflight) receipt_name=preflight.json ;;
            execute) receipt_name=execute.json ;;
            post_readback_only) receipt_name=post-readback.json ;;
          esac
          cp "$receipt" "$receipt_name"
          jq -e \
            '.secret_output == false
             and .nonce_output == false
             and .signature_output == false
             and .import_committed == false
             and .review_bind_committed == false
             and .promotion_committed == false
             and .rollback_committed == false
             and .backend_cache_invalidation_committed == false
             and .deployment_committed == false
             and .pr23_rerun == false' "$receipt" >/dev/null
          if [ "$status" -ne 0 ]; then
            jq -e '.ok == false' "$receipt" >/dev/null
            exit "$status"
          fi
          if [ "$MODE" = preflight ]; then
            jq -e \
              '.ok == true
               and .published_count == 116
               and .working_count == 116
               and .approved_review_count == 116
               and .revalidation_path_count == 116
               and .readback_plan == "8+9x12"
               and .writes_committed == false
               and (.authorization_phrase | length > 0)' "$receipt" >/dev/null
            echo "Cache-only preflight passed; exact authorization phrase is in the immutable artifact."
          elif [ "$MODE" = execute ]; then
            jq -e \
              '.ok == true
               and .status == "PASS_CACHE_ONLY_REVALIDATION_AND_POST_READBACK"
               and .accepted_revalidation_path_count == 116
               and .rejected_revalidation_path_count == 0
               and .readback_batch_count == 10
               and .api_read_count == 116
               and .html_read_count == 116
               and .writes_committed == true
               and .frontend_revalidation_committed == true' "$receipt" >/dev/null
          else
            jq -e \
              '.ok == true
               and .status == "PASS_POST_READBACK_ONLY"
               and .source_frontend_revalidation_committed == true
               and .frontend_revalidation_attempted == false
               and .frontend_revalidation_committed == false
               and .readback_batch_count == 10
               and .api_read_count == 116
               and .html_read_count == 116
               and .writes_committed == false' "$receipt" >/dev/null
          fi

      - name: Upload immutable cache-only preflight
        if: always() && inputs.mode == 'preflight'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: enneagram-pr23-cache-only-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: preflight.json
          retention-days: 14
          if-no-files-found: error

      - name: Upload cache-only execute receipt
        if: always() && inputs.mode == 'execute'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: enneagram-pr23-cache-only-execute-${{ github.run_id }}-${{ github.run_attempt }}
          path: execute.json
          retention-days: 14
          if-no-files-found: error

      - name: Upload post-readback-only receipt
        if: always() && inputs.mode == 'post_readback_only'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: enneagram-pr23-post-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: post-readback.json
          retention-days: 14
          if-no-files-found: error
