name: MBTI INTP-A SEO Title Production Promotion

on:
  workflow_dispatch:
    inputs:
      expected_control_plane_sha:
        description: Exact latest main SHA containing this production control plane
        required: true
        type: string
      expected_active_revision:
        description: Exact active production REVISION; must equal the control-plane SHA
        required: true
        type: string
      expected_package_sha256:
        description: Exact SHA-256 of the production promotion package
        required: true
        type: string
      staging_run_id:
        description: Exact successful staging experiment run id
        required: true
        type: string
      staging_receipt_sha256:
        description: Exact staging workflow receipt SHA-256
        required: true
        type: string
      mode:
        description: Zero-write dry-run or one-field write with automatic rollback
        required: true
        type: choice
        options:
          - dry-run
          - write
      operator_approval_phrase:
        description: Exact SHA- and evidence-bound production approval phrase
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-${{ github.repository }}-production
  cancel-in-progress: false

jobs:
  promote:
    name: Validate and promote one production seo_title field
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
      DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
      DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
      CONTROL_SHA: ${{ inputs.expected_control_plane_sha }}
      ACTIVE_REVISION: ${{ inputs.expected_active_revision }}
      PACKAGE_SHA: ${{ inputs.expected_package_sha256 }}
      STAGING_RUN_ID: ${{ inputs.staging_run_id }}
      STAGING_RECEIPT_SHA: ${{ inputs.staging_receipt_sha256 }}
      PROMOTION_MODE: ${{ inputs.mode }}
      OPERATOR_APPROVAL_PHRASE: ${{ inputs.operator_approval_phrase }}
      DETAIL_API_URL: https://api.fermatmind.com/api/v0.5/personality/intp-a?locale=zh-CN&scale_code=MBTI
      SEO_API_URL: https://api.fermatmind.com/api/v0.5/personality/intp-a/seo?locale=zh-CN&org_id=0&scale_code=MBTI
      PUBLIC_PAGE_URL: https://fermatmind.com/zh/personality/intp-a

    steps:
      - name: Initialize failure-safe receipt
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/mbti-intp-a-seo-title-production-promotion-receipt.json"
          echo "RECEIPT_PATH=$receipt" >> "$GITHUB_ENV"
          jq -n '{
            schema_version: "personality.mbti-seo-title-production-workflow-receipt.v1",
            ok: false,
            status: "workflow_incomplete",
            seo_title_changes: 0,
            audit_revision_created_count: 0,
            other_seo_field_changes: 0,
            live_projection_forbidden_changes: 0,
            cache_invalidations: 0,
            publication_changes: 0,
            indexability_changes: 0,
            discoverability_changes: 0,
            search_changes: 0,
            rollback_attempted: false,
            rollback_succeeded: false
          }' > "$receipt"

      - name: Checkout exact control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.expected_control_plane_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact main package staging receipt and approval
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          package="backend/docs/seo/personality/experiments/zh-intp-a-seo-title-production-promotion-v1.json"
          test "$GITHUB_REF" = refs/heads/main
          [[ "$CONTROL_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$ACTIVE_REVISION" = "$CONTROL_SHA"
          [[ "$PACKAGE_SHA" =~ ^[0-9a-f]{64}$ ]]
          test "$STAGING_RUN_ID" = "31395530368"
          test "$STAGING_RECEIPT_SHA" = "d5bdc286f156f7b07f4694b0dc702461eeb64f1fdd359d0cfc42b22beef1d57a"
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$CONTROL_SHA"
          test "$(git rev-parse origin/main)" = "$CONTROL_SHA"
          printf '%s  %s\n' "$PACKAGE_SHA" "$package" | sha256sum -c -

          expected="I authorize zh-CN INTP-A seo_title production promotion mode ${PROMOTION_MODE} for control SHA ${CONTROL_SHA}, active revision ${ACTIVE_REVISION}, package SHA ${PACKAGE_SHA}, staging run ${STAGING_RUN_ID}, staging receipt ${STAGING_RECEIPT_SHA}; no other content, publication, indexability, discoverability, or search change."
          test "$OPERATOR_APPROVAL_PHRASE" = "$expected"

          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${STAGING_RUN_ID}")"
          jq -e --arg receipt "$STAGING_RECEIPT_SHA" '
            .name == "MBTI INTP-A SEO Title Staging Draft" and
            .status == "completed" and .conclusion == "success" and
            $receipt == "d5bdc286f156f7b07f4694b0dc702461eeb64f1fdd359d0cfc42b22beef1d57a"
          ' <<<"$run_json" >/dev/null
          mkdir -p "$RUNNER_TEMP/staging-receipt"
          gh run download "$STAGING_RUN_ID" \
            --name mbti-intp-a-seo-title-staging-draft-receipt \
            --dir "$RUNNER_TEMP/staging-receipt"
          staging_receipt="$RUNNER_TEMP/staging-receipt/mbti-intp-a-seo-title-staging-draft-receipt.json"
          test -f "$staging_receipt"
          test "$(sha256sum "$staging_receipt" | awk '{print $1}')" = "$STAGING_RECEIPT_SHA"
          test "$(jq -r '.staging_evidence.experiment_package_sha256' "$package")" = "809a86d39744bf13c8aa5c43eeaa5f12ec9116c5cd6f6a8af68eea551aa8dc96"
          test "$(jq -r '.staging_evidence.revision_snapshot_sha256' "$package")" = "ec74c351c92498fec3714368bceb9b3f2674f07b2c9e5b313b9826461faab7be"

      - name: Validate protected production topology
        shell: bash
        run: |
          set -euo pipefail
          for name in DEPLOY_USER DEPLOY_HOST DEPLOY_PORT DEPLOY_PATH; do test -n "${!name:-}"; done
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          test "$DEPLOY_PORT" -ge 1 && test "$DEPLOY_PORT" -le 65535
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_PATH" != *".."* ]]

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known hosts
        shell: bash
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null \
            || ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f ~/.ssh/known_hosts >/dev/null

      - name: Verify exact active production revision
        shell: bash
        run: |
          set -euo pipefail
          printf -v q_path '%q' "$DEPLOY_PATH"
          printf -v q_revision '%q' "$ACTIVE_REVISION"
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH=$q_path ACTIVE_REVISION=$q_revision bash -s" <<'REMOTE'
          set -euo pipefail
          current="$(readlink -f "$DEPLOY_PATH/current")"
          test -d "$current/backend"
          test -f "$current/REVISION"
          test "$(tr -d '\r\n' < "$current/REVISION")" = "$ACTIVE_REVISION"
          REMOTE

      - name: Execute guarded promotion and live QA
        shell: bash
        run: |
          set -Eeuo pipefail
          old_title='INTP-A 人格特点：分析建模、可能性探索和独立解题 | FermatMind'
          new_title='INTP-A 是什么？人格特点、优势盲点与适合场景 | FermatMind'

          capture_api() {
            local suffix="$1"
            curl -fsS --connect-timeout 5 --max-time 30 "$DETAIL_API_URL" | jq -S . > "$RUNNER_TEMP/detail-${suffix}.json"
            curl -fsS --connect-timeout 5 --max-time 30 "$SEO_API_URL" | jq -S . > "$RUNNER_TEMP/seo-${suffix}.json"
          }
          capture_html() {
            local suffix="$1"
            curl -fsS --connect-timeout 5 --max-time 30 "$PUBLIC_PAGE_URL" > "$RUNNER_TEMP/page-${suffix}.html"
            python3 - "$RUNNER_TEMP/page-${suffix}.html" > "$RUNNER_TEMP/html-${suffix}.json" <<'PY'
          import hashlib, json, re, sys
          from html.parser import HTMLParser
          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.stack=[]; self.title=[]; self.h1=[]; self.body=[]; self.meta=[]; self.canonical=[]; self.jsonld=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs); self.stack.append((tag,a))
                  if tag == 'meta' and (a.get('name') in {'description','robots'} or (a.get('property') or '').startswith('og:') or (a.get('name') or '').startswith('twitter:')): self.meta.append(a)
                  if tag == 'link' and a.get('rel') == 'canonical': self.canonical.append(a.get('href',''))
              def handle_endtag(self, tag):
                  for i in range(len(self.stack)-1,-1,-1):
                      if self.stack[i][0] == tag: self.stack=self.stack[:i]; break
              def handle_data(self, data):
                  tags=[x[0] for x in self.stack]; value=' '.join(data.split())
                  if not value: return
                  if 'title' in tags: self.title.append(value)
                  if 'h1' in tags: self.h1.append(value)
                  if 'body' in tags and not any(x in tags for x in ('script','style','noscript')): self.body.append(value)
                  if 'script' in tags and any(x[0]=='script' and x[1].get('type')=='application/ld+json' for x in self.stack): self.jsonld.append(value)
          p=P(); p.feed(open(sys.argv[1],encoding='utf-8').read())
          stable={'h1':p.h1,'body_sha256':hashlib.sha256('\n'.join(p.body).encode()).hexdigest(),'meta':p.meta,'canonical':p.canonical,'jsonld':p.jsonld}
          print(json.dumps({'title':' '.join(p.title),'stable':stable},ensure_ascii=False,sort_keys=True))
          PY
          }
          remote_command() {
            local mode="$1" approval="$2" output="$3"
            printf -v q_path '%q' "$DEPLOY_PATH"
            printf -v q_revision '%q' "$ACTIVE_REVISION"
            printf -v q_control '%q' "$CONTROL_SHA"
            printf -v q_package_sha '%q' "$PACKAGE_SHA"
            printf -v q_staging_run '%q' "$STAGING_RUN_ID"
            printf -v q_staging_receipt '%q' "$STAGING_RECEIPT_SHA"
            printf -v q_mode '%q' "$mode"
            printf -v q_approval '%q' "$approval"
            ssh -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "DEPLOY_PATH=$q_path ACTIVE_REVISION=$q_revision CONTROL_SHA=$q_control PACKAGE_SHA=$q_package_sha STAGING_RUN_ID=$q_staging_run STAGING_RECEIPT_SHA=$q_staging_receipt MODE=$q_mode APPROVAL=$q_approval bash -s" > "$output" <<'REMOTE'
          set -euo pipefail
          current="$(readlink -f "$DEPLOY_PATH/current")"
          test "$(tr -d '\r\n' < "$current/REVISION")" = "$ACTIVE_REVISION"
          cd "$current/backend"
          php artisan personality:mbti-intp-a-seo-title-production-promotion \
            --package='docs/seo/personality/experiments/zh-intp-a-seo-title-production-promotion-v1.json' \
            --confirm-package-sha256="$PACKAGE_SHA" \
            --control-sha="$CONTROL_SHA" \
            --active-revision="$ACTIVE_REVISION" \
            --staging-run-id="$STAGING_RUN_ID" \
            --staging-receipt-sha256="$STAGING_RECEIPT_SHA" \
            --operator-approved="$APPROVAL" \
            --"$MODE" --json
          REMOTE
          }

          capture_api before
          capture_html before
          before_title="$(jq -r '.seo_meta.seo_title' "$RUNNER_TEMP/detail-before.json")"
          test "$before_title" = "$old_title" || test "$before_title" = "$new_title"

          if ! remote_command dry-run "I authorize zh-CN INTP-A seo_title production promotion mode dry-run for control SHA ${CONTROL_SHA}, active revision ${ACTIVE_REVISION}, package SHA ${PACKAGE_SHA}, staging run ${STAGING_RUN_ID}, staging receipt ${STAGING_RECEIPT_SHA}; no other content, publication, indexability, discoverability, or search change." "$RUNNER_TEMP/dry-run.json"; then
            exit 1
          fi
          jq -e '.ok == true and .writes_committed == false and .seo_title_changes == 0' "$RUNNER_TEMP/dry-run.json" >/dev/null

          if [ "$PROMOTION_MODE" = dry-run ]; then
            capture_api after
            capture_html after
            cmp "$RUNNER_TEMP/detail-before.json" "$RUNNER_TEMP/detail-after.json"
            cmp "$RUNNER_TEMP/seo-before.json" "$RUNNER_TEMP/seo-after.json"
            cmp "$RUNNER_TEMP/html-before.json" "$RUNNER_TEMP/html-after.json"
            jq -n --arg control "$CONTROL_SHA" --arg package_sha "$PACKAGE_SHA" --slurpfile command "$RUNNER_TEMP/dry-run.json" '{
              schema_version:"personality.mbti-seo-title-production-workflow-receipt.v1", ok:true,
              status:"production_dry_run_pass", mode:"dry-run", control_plane_sha:$control,
              active_revision:$control, package_sha256:$package_sha, writes_committed:0,
              seo_title_changes:0, audit_revision_created_count:0, other_seo_field_changes:0,
              live_projection_forbidden_changes:0, cache_invalidations:0, publication_changes:0,
              indexability_changes:0, discoverability_changes:0, search_changes:0,
              public_api_unchanged:true, public_html_unchanged:true, rollback_attempted:false,
              rollback_succeeded:false, command_status:$command[0].status
            }' > "$RECEIPT_PATH"
            exit 0
          fi

          if ! remote_command write "$OPERATOR_APPROVAL_PHRASE" "$RUNNER_TEMP/write.json"; then
            exit 1
          fi
          jq -e '(.ok == true) and (.status == "promoted_live" or .status == "idempotent_promoted_live")' "$RUNNER_TEMP/write.json" >/dev/null
          if [ "$(jq -r '.status' "$RUNNER_TEMP/write.json")" = promoted_live ]; then
            test "$before_title" = "$old_title"
          else
            test "$before_title" = "$new_title"
          fi

          qa_pass=false
          for attempt in $(seq 1 24); do
            echo "Live QA attempt ${attempt}/24."
            if capture_api after && capture_html after \
              && test "$(jq -r '.seo_meta.seo_title' "$RUNNER_TEMP/detail-after.json")" = "$new_title" \
              && test "$(jq -r '.title' "$RUNNER_TEMP/html-after.json")" = "$new_title"; then
              jq 'del(.seo_meta.seo_title,.seo_surface_v1.title,.seo_surface_v1.metadata_fingerprint,.mbti_public_projection_v1.seo.title)' "$RUNNER_TEMP/detail-before.json" > "$RUNNER_TEMP/detail-before-stable.json"
              jq 'del(.seo_meta.seo_title,.seo_surface_v1.title,.seo_surface_v1.metadata_fingerprint,.mbti_public_projection_v1.seo.title)' "$RUNNER_TEMP/detail-after.json" > "$RUNNER_TEMP/detail-after-stable.json"
              jq 'del(.meta.title,.seo_surface_v1.title,.seo_surface_v1.metadata_fingerprint)' "$RUNNER_TEMP/seo-before.json" > "$RUNNER_TEMP/seo-before-stable.json"
              jq 'del(.meta.title,.seo_surface_v1.title,.seo_surface_v1.metadata_fingerprint)' "$RUNNER_TEMP/seo-after.json" > "$RUNNER_TEMP/seo-after-stable.json"
              if cmp -s "$RUNNER_TEMP/detail-before-stable.json" "$RUNNER_TEMP/detail-after-stable.json" \
                && cmp -s "$RUNNER_TEMP/seo-before-stable.json" "$RUNNER_TEMP/seo-after-stable.json" \
                && test "$(jq -c '.stable' "$RUNNER_TEMP/html-before.json")" = "$(jq -c '.stable' "$RUNNER_TEMP/html-after.json")"; then
                qa_pass=true
                break
              fi
            fi
            sleep 30
          done

          if [ "$qa_pass" != true ]; then
            rollback_approval="I authorize zh-CN INTP-A seo_title production promotion mode rollback for control SHA ${CONTROL_SHA}, active revision ${ACTIVE_REVISION}, package SHA ${PACKAGE_SHA}, staging run ${STAGING_RUN_ID}, staging receipt ${STAGING_RECEIPT_SHA}; no other content, publication, indexability, discoverability, or search change."
            rollback_ok=false
            if remote_command rollback "$rollback_approval" "$RUNNER_TEMP/rollback.json" \
              && jq -e '.ok == true and (.status == "rolled_back" or .status == "idempotent_rolled_back")' "$RUNNER_TEMP/rollback.json" >/dev/null; then
              rollback_ok=true
            fi
            jq -n --arg control "$CONTROL_SHA" --arg package_sha "$PACKAGE_SHA" --argjson rollback_ok "$rollback_ok" --slurpfile write "$RUNNER_TEMP/write.json" '{
              schema_version:"personality.mbti-seo-title-production-workflow-receipt.v1", ok:false,
              status:(if $rollback_ok then "live_qa_failed_rolled_back" else "live_qa_failed_rollback_failed" end),
              mode:"write", control_plane_sha:$control, active_revision:$control, package_sha256:$package_sha,
              seo_title_changes:$write[0].seo_title_changes, audit_revision_created_count:$write[0].audit_revision_created_count,
              other_seo_field_changes:$write[0].other_seo_field_changes, live_projection_forbidden_changes:1,
              cache_invalidations:$write[0].cache_invalidations, publication_changes:0, indexability_changes:0,
              discoverability_changes:0, search_changes:0, rollback_attempted:true, rollback_succeeded:$rollback_ok
            }' > "$RECEIPT_PATH"
            exit 1
          fi

          printf -v q_path '%q' "$DEPLOY_PATH"
          printf -v q_revision '%q' "$ACTIVE_REVISION"
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            "$DEPLOY_USER@$DEPLOY_HOST" "DEPLOY_PATH=$q_path ACTIVE_REVISION=$q_revision bash -s" > "$RUNNER_TEMP/refresh.json" <<'REMOTE'
          set -euo pipefail
          current="$(readlink -f "$DEPLOY_PATH/current")"
          test "$(tr -d '\r\n' < "$current/REVISION")" = "$ACTIVE_REVISION"
          cd "$current/backend"
          php artisan personality:refresh-mbti-variant-seo-metadata --locale=zh-CN --type=INTP --dry-run --json
          REMOTE
          jq -e '.writes_committed == 0 and .protected_override_count == 1 and .protected_fields == ["seo_title"]' "$RUNNER_TEMP/refresh.json" >/dev/null

          jq -n --arg control "$CONTROL_SHA" --arg package_sha "$PACKAGE_SHA" --slurpfile write "$RUNNER_TEMP/write.json" '{
            schema_version:"personality.mbti-seo-title-production-workflow-receipt.v1", ok:true,
            status:"production_promotion_live_qa_pass", mode:"write", control_plane_sha:$control,
            active_revision:$control, package_sha256:$package_sha, writes_committed:$write[0].writes_committed,
            seo_title_changes:$write[0].seo_title_changes,
            audit_revision_created_count:$write[0].audit_revision_created_count,
            idempotent_count:$write[0].idempotent_count,
            other_seo_field_changes:0, live_projection_forbidden_changes:0,
            cache_invalidations:$write[0].cache_invalidations, publication_changes:0,
            indexability_changes:0, discoverability_changes:0, search_changes:0,
            production_api_title_verified:true, public_html_title_verified:true,
            refresh_override_protection_verified:true, rollback_attempted:false, rollback_succeeded:false
          }' > "$RECEIPT_PATH"

      - name: Upload sanitized production receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mbti-intp-a-seo-title-production-promotion-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/mbti-intp-a-seo-title-production-promotion-receipt.json
          if-no-files-found: error
          retention-days: 14
