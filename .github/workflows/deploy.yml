            and .org_scope_mode == "bounded"
            and .org_scope_count == 1
            and (.attempted_rows | type == "number" and . >= 0)
            and (.upserted_rows | type == "number" and . >= 0)
            and .readback_receipt.status == "pass"
            and ((.readback_receipt.expected_metrics | keys | sort) == [
              "article_to_test_click_count",
              "complete_test_count",
              "landing_pv_count",
              "result_ready_count",
              "return_public_content_count",
              "start_test_count",
              "view_result_count"
            ])
            and ((.readback_receipt.persisted_metrics | keys | sort) == [
              "article_to_test_click_count",
              "complete_test_count",
              "landing_pv_count",
              "result_ready_count",
              "return_public_content_count",
              "start_test_count",
              "view_result_count"
            ])
            and ((.readback_receipt.expected_metrics | to_entries) | all(.value | type == "number" and . >= 0))
            and ((.readback_receipt.persisted_metrics | to_entries) | all(.value | type == "number" and . >= 0))
            and .readback_receipt.raw_session_or_business_identifiers_exposed == false
            and .raw_query_exposed == false
            and .raw_session_or_business_identifiers_exposed == false
            and .private_paths_allowed == false
            and .search_submission_allowed == false
          ' "$cro_refresh_json" >/dev/null || fail CRO_READMODEL_UNHEALTHY

          mkdir -p artifacts/measurement-source-readiness
          jq -n --arg sha "$DEPLOY_SHA" --slurpfile gsc "$sync_json" --slurpfile cro "$cro_refresh_json" '
            {
