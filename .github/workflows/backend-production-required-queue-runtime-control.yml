name: Backend Production Required Queue Runtime Control

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only preflight or exact-authorized apply
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - apply
          - backlog_apply
      expected_control_plane_sha:
        description: Exact latest main SHA containing this control plane
        required: true
        type: string
      expected_active_revision:
        description: Exact active backend REVISION
        required: true
        type: string
      expected_runner_sha256:
        description: Exact SHA-256 of the required queue control runner
        required: true
        type: string
      expected_target_set_sha256:
        description: Apply only; target-set SHA-256 from preflight
        required: false
        default: ""
        type: string
      expected_state_sha256:
        description: Apply only; runtime state SHA-256 from preflight
        required: false
        default: ""
        type: string
      expected_backlog_snapshot_sha256:
        description: Backlog apply only; exact payload-hash snapshot from preflight
        required: false
        default: ""
        type: string
      expected_job_class_counts_sha256:
        description: Backlog apply only; exact safe class-count map hash from preflight
        required: false
        default: ""
        type: string
      expected_pending_total:
        description: Backlog apply only; exact pending job count from preflight
        required: false
        default: ""
        type: string
      preflight_run_id:
        description: Apply only; immutable successful preflight run id
        required: false
        default: ""
        type: string
      preflight_run_attempt:
        description: Apply only; immutable successful preflight run attempt
        required: false
        default: ""
        type: string
      operator_approval_phrase:
        description: Apply only; exact receipt-bound authorization phrase
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: backend-production-required-queue-runtime-control
  cancel-in-progress: false

jobs:
  eligibility:
    name: Validate required queue runtime control eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.validate.outputs.mode }}
      control_plane_sha: ${{ steps.validate.outputs.control_plane_sha }}
      active_revision: ${{ steps.validate.outputs.active_revision }}
      runner_sha256: ${{ steps.validate.outputs.runner_sha256 }}
      target_set_sha256: ${{ steps.validate.outputs.target_set_sha256 }}
      state_sha256: ${{ steps.validate.outputs.state_sha256 }}
      backlog_snapshot_sha256: ${{ steps.validate.outputs.backlog_snapshot_sha256 }}
      job_class_counts_sha256: ${{ steps.validate.outputs.job_class_counts_sha256 }}
      pending_total: ${{ steps.validate.outputs.pending_total }}
    steps:
      - name: Checkout exact main control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Validate exact control and immutable preflight binding
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          EXPECTED_CONTROL_PLANE_SHA: ${{ inputs.expected_control_plane_sha }}
          EXPECTED_ACTIVE_REVISION: ${{ inputs.expected_active_revision }}
          EXPECTED_RUNNER_SHA256: ${{ inputs.expected_runner_sha256 }}
          EXPECTED_TARGET_SET_SHA256: ${{ inputs.expected_target_set_sha256 }}
          EXPECTED_STATE_SHA256: ${{ inputs.expected_state_sha256 }}
          EXPECTED_BACKLOG_SNAPSHOT_SHA256: ${{ inputs.expected_backlog_snapshot_sha256 }}
          EXPECTED_JOB_CLASS_COUNTS_SHA256: ${{ inputs.expected_job_class_counts_sha256 }}
          EXPECTED_PENDING_TOTAL: ${{ inputs.expected_pending_total }}
          PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
          PREFLIGHT_RUN_ATTEMPT: ${{ inputs.preflight_run_attempt }}
          OPERATOR_APPROVAL_PHRASE: ${{ inputs.operator_approval_phrase }}
        run: |
          set -euo pipefail
          runner="backend/scripts/deploy/control_required_supervisor_programs.sh"
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$EXPECTED_CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_ACTIVE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_RUNNER_SHA256" =~ ^[0-9a-f]{64}$ ]]
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_CONTROL_PLANE_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_CONTROL_PLANE_SHA"
          test "$(sha256sum "$runner" | awk '{print $1}')" = "$EXPECTED_RUNNER_SHA256"

          case "$MODE" in
            preflight)
              test -z "$EXPECTED_TARGET_SET_SHA256"
              test -z "$EXPECTED_STATE_SHA256"
              test -z "$EXPECTED_BACKLOG_SNAPSHOT_SHA256"
              test -z "$EXPECTED_JOB_CLASS_COUNTS_SHA256"
              test -z "$EXPECTED_PENDING_TOTAL"
              test -z "$PREFLIGHT_RUN_ID"
              test -z "$PREFLIGHT_RUN_ATTEMPT"
              test -z "$OPERATOR_APPROVAL_PHRASE"
              ;;
            apply)
              [[ "$EXPECTED_TARGET_SET_SHA256" =~ ^[0-9a-f]{64}$ ]]
              [[ "$EXPECTED_STATE_SHA256" =~ ^[0-9a-f]{64}$ ]]
              test -z "$EXPECTED_BACKLOG_SNAPSHOT_SHA256"
              test -z "$EXPECTED_JOB_CLASS_COUNTS_SHA256"
              test -z "$EXPECTED_PENDING_TOTAL"
              [[ "$PREFLIGHT_RUN_ID" =~ ^[0-9]+$ ]]
              [[ "$PREFLIGHT_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
              expected_phrase="I explicitly approve production fap-api required queue runtime convergence from preflight run ${PREFLIGHT_RUN_ID} attempt ${PREFLIGHT_RUN_ATTEMPT} with control-plane SHA ${EXPECTED_CONTROL_PLANE_SHA} active SHA ${EXPECTED_ACTIVE_REVISION} runner SHA256 ${EXPECTED_RUNNER_SHA256} target-set SHA256 ${EXPECTED_TARGET_SET_SHA256} state SHA256 ${EXPECTED_STATE_SHA256}; restart only non-running fap-queue-default-high and fap-queue-reports workers with zero pending jobs, no deploy/symlink/migration/CMS/database-authority/publication/schema/hreflang/revalidation/sitemap/llms/search."
              test "$OPERATOR_APPROVAL_PHRASE" = "$expected_phrase"

              run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREFLIGHT_RUN_ID}")"
              jq -e \
                --arg sha "$EXPECTED_CONTROL_PLANE_SHA" \
                --argjson attempt "$PREFLIGHT_RUN_ATTEMPT" \
                '.name == "Backend Production Required Queue Runtime Control"
                 and .path == ".github/workflows/backend-production-required-queue-runtime-control.yml"
                 and .event == "workflow_dispatch"
                 and .status == "completed"
                 and .conclusion == "success"
                 and .head_branch == "main"
                 and .head_sha == $sha
                 and .run_attempt == $attempt' <<<"$run_json" >/dev/null

              receipt_dir="$(mktemp -d)"
              gh run download "$PREFLIGHT_RUN_ID" \
                --name "backend-production-required-queue-preflight-${PREFLIGHT_RUN_ID}-${PREFLIGHT_RUN_ATTEMPT}" \
                --dir "$receipt_dir"
              receipt="$receipt_dir/backend-production-required-queue-runtime-control.json"
              test -f "$receipt"
              jq -e \
                --arg control "$EXPECTED_CONTROL_PLANE_SHA" \
                --arg active "$EXPECTED_ACTIVE_REVISION" \
                --arg runner_sha "$EXPECTED_RUNNER_SHA256" \
                --arg target_sha "$EXPECTED_TARGET_SET_SHA256" \
                --arg state_sha "$EXPECTED_STATE_SHA256" \
                --arg run_id "$PREFLIGHT_RUN_ID" \
                --arg run_attempt "$PREFLIGHT_RUN_ATTEMPT" \
                '.contract_version == "backend.production_required_queue_runtime_control.v4"
                 and .mode == "preflight"
                 and .status == "PASS_PREFLIGHT"
                 and .run_id == $run_id
                 and .run_attempt == $run_attempt
                 and .control_plane_sha == $control
                 and .active_revision == $active
                 and .runner_sha256 == $runner_sha
                 and .target_set_sha256 == $target_sha
                 and .state_sha256 == $state_sha
                 and .pending_total == 0
                 and .unknown_class_count == 0
                 and .convergence_required == true
                 and .apply_supported == true
                 and .deploy_lock_present == false
                 and .deploy_like_process_count == 0
                 and .production_write_execution == false' "$receipt" >/dev/null
              ;;
            backlog_apply)
              [[ "$EXPECTED_TARGET_SET_SHA256" =~ ^[0-9a-f]{64}$ ]]
              [[ "$EXPECTED_STATE_SHA256" =~ ^[0-9a-f]{64}$ ]]
              [[ "$EXPECTED_BACKLOG_SNAPSHOT_SHA256" =~ ^[0-9a-f]{64}$ ]]
              [[ "$EXPECTED_JOB_CLASS_COUNTS_SHA256" =~ ^[0-9a-f]{64}$ ]]
              [[ "$EXPECTED_PENDING_TOTAL" =~ ^[1-9][0-9]*$ ]]
              [[ "$PREFLIGHT_RUN_ID" =~ ^[0-9]+$ ]]
              [[ "$PREFLIGHT_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
              expected_phrase="I explicitly approve production fap-api required queue backlog recovery from preflight run ${PREFLIGHT_RUN_ID} attempt ${PREFLIGHT_RUN_ATTEMPT} with control-plane SHA ${EXPECTED_CONTROL_PLANE_SHA} active SHA ${EXPECTED_ACTIVE_REVISION} runner SHA256 ${EXPECTED_RUNNER_SHA256} target-set SHA256 ${EXPECTED_TARGET_SET_SHA256} state SHA256 ${EXPECTED_STATE_SHA256} backlog snapshot SHA256 ${EXPECTED_BACKLOG_SNAPSHOT_SHA256} job-class-counts SHA256 ${EXPECTED_JOB_CLASS_COUNTS_SHA256} pending total ${EXPECTED_PENDING_TOTAL}; restart only non-running fap-queue-default-high and fap-queue-reports workers and resume normal processing including the exact preflight-bound App\\Jobs\\ProcessAttemptSubmissionJob backlog, with no deploy/symlink/migration/CMS-authority/publication/schema/hreflang/revalidation/sitemap/llms/search."
              test "$OPERATOR_APPROVAL_PHRASE" = "$expected_phrase"

              run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREFLIGHT_RUN_ID}")"
              jq -e \
                --arg sha "$EXPECTED_CONTROL_PLANE_SHA" \
                --argjson attempt "$PREFLIGHT_RUN_ATTEMPT" \
                '.name == "Backend Production Required Queue Runtime Control"
                 and .path == ".github/workflows/backend-production-required-queue-runtime-control.yml"
                 and .event == "workflow_dispatch"
                 and .status == "completed"
                 and .conclusion == "success"
                 and .head_branch == "main"
                 and .head_sha == $sha
                 and .run_attempt == $attempt' <<<"$run_json" >/dev/null

              receipt_dir="$(mktemp -d)"
              gh run download "$PREFLIGHT_RUN_ID" \
                --name "backend-production-required-queue-preflight-${PREFLIGHT_RUN_ID}-${PREFLIGHT_RUN_ATTEMPT}" \
                --dir "$receipt_dir"
              receipt="$receipt_dir/backend-production-required-queue-runtime-control.json"
              test -f "$receipt"
              jq -e \
                --arg control "$EXPECTED_CONTROL_PLANE_SHA" \
                --arg active "$EXPECTED_ACTIVE_REVISION" \
                --arg runner_sha "$EXPECTED_RUNNER_SHA256" \
                --arg target_sha "$EXPECTED_TARGET_SET_SHA256" \
                --arg state_sha "$EXPECTED_STATE_SHA256" \
                --arg backlog_sha "$EXPECTED_BACKLOG_SNAPSHOT_SHA256" \
                --arg class_sha "$EXPECTED_JOB_CLASS_COUNTS_SHA256" \
                --argjson pending "$EXPECTED_PENDING_TOTAL" \
                --arg run_id "$PREFLIGHT_RUN_ID" \
                --arg run_attempt "$PREFLIGHT_RUN_ATTEMPT" \
                '.contract_version == "backend.production_required_queue_runtime_control.v4"
                 and .mode == "preflight"
                 and .status == "PASS_PREFLIGHT"
                 and .run_id == $run_id
                 and .run_attempt == $run_attempt
                 and .control_plane_sha == $control
                 and .active_revision == $active
                 and .runner_sha256 == $runner_sha
                 and .target_set_sha256 == $target_sha
                 and .state_sha256 == $state_sha
                 and .backlog_snapshot_sha256 == $backlog_sha
                 and .job_class_counts_sha256 == $class_sha
                 and .pending_total == $pending
                 and .pending_by_queue == {high: 0, default: $pending, reports: 0}
                 and .job_class_counts == {
                   high: {},
                   default: {"App\\Jobs\\ProcessAttemptSubmissionJob": $pending},
                   reports: {}
                 }
                 and .unknown_class_count == 0
                 and .convergence_required == true
                 and .backlog_recovery_supported == true
                 and .production_write_execution == false' "$receipt" >/dev/null
              ;;
            *)
              exit 2
              ;;
          esac

          {
            echo "mode=$MODE"
            echo "control_plane_sha=$EXPECTED_CONTROL_PLANE_SHA"
            echo "active_revision=$EXPECTED_ACTIVE_REVISION"
            echo "runner_sha256=$EXPECTED_RUNNER_SHA256"
            echo "target_set_sha256=$EXPECTED_TARGET_SET_SHA256"
            echo "state_sha256=$EXPECTED_STATE_SHA256"
            echo "backlog_snapshot_sha256=$EXPECTED_BACKLOG_SNAPSHOT_SHA256"
            echo "job_class_counts_sha256=$EXPECTED_JOB_CLASS_COUNTS_SHA256"
            echo "pending_total=$EXPECTED_PENDING_TOTAL"
          } >> "$GITHUB_OUTPUT"
          echo "Exact required queue control eligibility passed."

  control:
    name: Preflight or apply required queue runtime control
    needs: eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    steps:
      - name: Checkout exact control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.eligibility.outputs.control_plane_sha }}
          fetch-depth: 1

      - name: Start pinned SSH agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known hosts
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_PORT"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null \
            || ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f ~/.ssh/known_hosts >/dev/null
          echo "Pinned known-host validation passed."

      - name: Execute bounded required queue control
        id: execute
        shell: bash
        env:
          MODE: ${{ needs.eligibility.outputs.mode }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
          EXPECTED_ACTIVE_REVISION: ${{ needs.eligibility.outputs.active_revision }}
          EXPECTED_RUNNER_SHA256: ${{ needs.eligibility.outputs.runner_sha256 }}
          EXPECTED_TARGET_SET_SHA256: ${{ needs.eligibility.outputs.target_set_sha256 }}
          EXPECTED_STATE_SHA256: ${{ needs.eligibility.outputs.state_sha256 }}
          EXPECTED_BACKLOG_SNAPSHOT_SHA256: ${{ needs.eligibility.outputs.backlog_snapshot_sha256 }}
          EXPECTED_JOB_CLASS_COUNTS_SHA256: ${{ needs.eligibility.outputs.job_class_counts_sha256 }}
          EXPECTED_PENDING_TOTAL: ${{ needs.eligibility.outputs.pending_total }}
        run: |
          set -euo pipefail
          runner="backend/scripts/deploy/control_required_supervisor_programs.sh"
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_PATH" != *".."* ]]
          test "$(sha256sum "$runner" | awk '{print $1}')" = "$EXPECTED_RUNNER_SHA256"

          printf -v q_mode '%q' "$MODE"
          printf -v q_path '%q' "$DEPLOY_PATH"
          printf -v q_active '%q' "$EXPECTED_ACTIVE_REVISION"
          printf -v q_state '%q' "$EXPECTED_STATE_SHA256"
          printf -v q_backlog '%q' "$EXPECTED_BACKLOG_SNAPSHOT_SHA256"
          printf -v q_classes '%q' "$EXPECTED_JOB_CLASS_COUNTS_SHA256"
          printf -v q_pending '%q' "$EXPECTED_PENDING_TOTAL"
          set +e
          result="$(
            timeout --signal=TERM --kill-after=10s 180s \
              ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
                -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
                "MODE=$q_mode DEPLOY_PATH=$q_path EXPECTED_ACTIVE_REVISION=$q_active EXPECTED_STATE_SHA256=$q_state EXPECTED_BACKLOG_SNAPSHOT_SHA256=$q_backlog EXPECTED_JOB_CLASS_COUNTS_SHA256=$q_classes EXPECTED_PENDING_TOTAL=$q_pending bash -s" \
                < "$runner" 2>"$RUNNER_TEMP/required-queue-control.err"
          )"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            safe_failure="$(grep -Eo 'REQUIRED_QUEUE_CONTROL_FAILED:[A-Z0-9_-]+' \
              "$RUNNER_TEMP/required-queue-control.err" | tail -n 1 || true)"
            if [[ "$safe_failure" =~ ^REQUIRED_QUEUE_CONTROL_FAILED:[A-Z0-9_-]+$ ]]; then
              echo "$safe_failure" >&2
            else
              echo "REQUIRED_QUEUE_CONTROL_REMOTE_FAILURE" >&2
            fi
            exit "$rc"
          fi

          if [ "$MODE" = preflight ]; then
            parser_fail() {
              printf 'REQUIRED_QUEUE_RESULT_FAILED:%s\n' "$1" >&2
              exit 1
            }
            [[ "$result" != *$'\n'* ]] || parser_fail FIELD_SHAPE
            field_count="$(awk -F $'\t' '{print NF}' <<<"$result")"
            test "$field_count" -eq 17 || parser_fail FIELD_SHAPE
            IFS=$'\t' read -r active target_sha state_sha default_state reports_state pending_total high_pending default_pending reports_pending convergence_required apply_supported foreign_sha unknown_class_count oldest_pending_seconds backlog_snapshot_sha256 job_class_counts_b64 job_class_counts_sha256 <<<"$result"
            test "$active" = "$EXPECTED_ACTIVE_REVISION" || parser_fail IDENTITY
            [[ "$target_sha" =~ ^[0-9a-f]{64}$ ]] || parser_fail HASH
            [[ "$state_sha" =~ ^[0-9a-f]{64}$ ]] || parser_fail HASH
            [[ "$default_state" =~ ^(RUNNING|NOT_RUNNING)$ ]] || parser_fail STATE
            [[ "$reports_state" =~ ^(RUNNING|NOT_RUNNING)$ ]] || parser_fail STATE
            [[ "$pending_total" =~ ^[0-9]+$ ]] || parser_fail SCALAR
            [[ "$high_pending" =~ ^[0-9]+$ ]] || parser_fail SCALAR
            [[ "$default_pending" =~ ^[0-9]+$ ]] || parser_fail SCALAR
            [[ "$reports_pending" =~ ^[0-9]+$ ]] || parser_fail SCALAR
            test "$pending_total" -eq $((high_pending + default_pending + reports_pending)) \
              || parser_fail QUEUE_TOTAL
            [[ "$convergence_required" =~ ^(true|false)$ ]] || parser_fail BOOLEAN
            [[ "$apply_supported" =~ ^(true|false)$ ]] || parser_fail BOOLEAN
            [[ "$foreign_sha" =~ ^[0-9a-f]{64}$ ]] || parser_fail HASH
            [[ "$unknown_class_count" =~ ^[0-9]+$ ]] || parser_fail SCALAR
            [[ "$oldest_pending_seconds" =~ ^[0-9]+$ ]] || parser_fail SCALAR
            [[ "$backlog_snapshot_sha256" =~ ^[0-9a-f]{64}$ ]] || parser_fail HASH
            [[ "$job_class_counts_b64" =~ ^[A-Za-z0-9+/=]+$ ]] || parser_fail CLASS_B64
            if ! decoded_job_class_counts="$(
              printf '%s' "$job_class_counts_b64" | base64 --decode
            )"; then
              parser_fail CLASS_B64
            fi
            jq -e '
              type == "object"
              and (keys | sort) == ["default", "high", "reports"]
              and all(.[]; type == "object")
              and all(.[][]; type == "number" and . >= 0 and floor == .)
            ' <<<"$decoded_job_class_counts" >/dev/null || parser_fail CLASS_JSON
            if ! classified_total="$(
              jq '[.[][]] | add // 0' <<<"$decoded_job_class_counts"
            )"; then
              parser_fail CLASS_JSON
            fi
            test "$classified_total" -eq "$pending_total" || parser_fail CLASS_TOTAL
            test "$unknown_class_count" -le "$pending_total" || parser_fail UNKNOWN_TOTAL
            test "$(
              printf '%s' "$decoded_job_class_counts" | sha256sum | awk '{print $1}'
            )" = "$job_class_counts_sha256" || parser_fail CLASS_HASH
            backlog_recovery_supported=false
            if [ "$pending_total" -gt 0 ] \
              && [ "$high_pending" -eq 0 ] \
              && [ "$reports_pending" -eq 0 ] \
              && [ "$unknown_class_count" -eq 0 ] \
              && [ "$convergence_required" = true ] \
              && jq -e --argjson pending "$pending_total" '
                . == {
                  high: {},
                  default: {"App\\Jobs\\ProcessAttemptSubmissionJob": $pending},
                  reports: {}
                }
              ' <<<"$decoded_job_class_counts" >/dev/null; then
              backlog_recovery_supported=true
            fi
            {
              echo "target_set_sha256=$target_sha"
              echo "state_sha256=$state_sha"
              echo "default_state=$default_state"
              echo "reports_state=$reports_state"
              echo "pending_total=$pending_total"
              echo "high_pending=$high_pending"
              echo "default_pending=$default_pending"
              echo "reports_pending=$reports_pending"
              echo "convergence_required=$convergence_required"
              echo "apply_supported=$apply_supported"
              echo "unknown_class_count=$unknown_class_count"
              echo "oldest_pending_seconds=$oldest_pending_seconds"
              echo "backlog_snapshot_sha256=$backlog_snapshot_sha256"
              echo "job_class_counts_b64=$job_class_counts_b64"
              echo "job_class_counts_sha256=$job_class_counts_sha256"
              echo "backlog_recovery_supported=$backlog_recovery_supported"
              echo "after_state_sha256=$(printf '0%.0s' {1..64})"
            } >> "$GITHUB_OUTPUT"
          else
            IFS=$'\t' read -r active target_sha state_sha after_state_sha <<<"$result"
            test "$active" = "$EXPECTED_ACTIVE_REVISION"
            test "$target_sha" = "$EXPECTED_TARGET_SET_SHA256"
            test "$state_sha" = "$EXPECTED_STATE_SHA256"
            [[ "$after_state_sha" =~ ^[0-9a-f]{64}$ ]]
            {
              echo "target_set_sha256=$target_sha"
              echo "state_sha256=$state_sha"
              echo "default_state=RUNNING"
              echo "reports_state=RUNNING"
              if [ "$MODE" = backlog_apply ]; then
                echo "pending_total=$EXPECTED_PENDING_TOTAL"
                echo "high_pending=0"
                echo "default_pending=$EXPECTED_PENDING_TOTAL"
                echo "reports_pending=0"
                echo "backlog_snapshot_sha256=$EXPECTED_BACKLOG_SNAPSHOT_SHA256"
                expected_classes="$(jq -nc --argjson pending "$EXPECTED_PENDING_TOTAL" \
                  '{high:{},default:{"App\\Jobs\\ProcessAttemptSubmissionJob":$pending},reports:{}}')"
                echo "job_class_counts_b64=$(printf '%s' "$expected_classes" | base64 -w0)"
                echo "job_class_counts_sha256=$EXPECTED_JOB_CLASS_COUNTS_SHA256"
              else
                echo "pending_total=0"
                echo "high_pending=0"
                echo "default_pending=0"
                echo "reports_pending=0"
                echo "backlog_snapshot_sha256=$(printf '' | sha256sum | awk '{print $1}')"
                echo "job_class_counts_b64=$(printf '%s' '{"high":{},"default":{},"reports":{}}' | base64 -w0)"
                echo "job_class_counts_sha256=$(printf '%s' '{"high":{},"default":{},"reports":{}}' | sha256sum | awk '{print $1}')"
              fi
              echo "convergence_required=false"
              echo "apply_supported=false"
              echo "unknown_class_count=0"
              echo "oldest_pending_seconds=0"
              echo "backlog_recovery_supported=false"
              echo "after_state_sha256=$after_state_sha"
            } >> "$GITHUB_OUTPUT"
          fi
          echo "Bounded required queue control completed without raw runtime output."

      - name: Generate sanitized immutable receipt
        shell: bash
        env:
          MODE: ${{ needs.eligibility.outputs.mode }}
          CONTROL_PLANE_SHA: ${{ needs.eligibility.outputs.control_plane_sha }}
          ACTIVE_REVISION: ${{ needs.eligibility.outputs.active_revision }}
          RUNNER_SHA256: ${{ needs.eligibility.outputs.runner_sha256 }}
          TARGET_SET_SHA256: ${{ steps.execute.outputs.target_set_sha256 }}
          STATE_SHA256: ${{ steps.execute.outputs.state_sha256 }}
          AFTER_STATE_SHA256: ${{ steps.execute.outputs.after_state_sha256 }}
          DEFAULT_STATE: ${{ steps.execute.outputs.default_state }}
          REPORTS_STATE: ${{ steps.execute.outputs.reports_state }}
          PENDING_TOTAL: ${{ steps.execute.outputs.pending_total }}
          HIGH_PENDING: ${{ steps.execute.outputs.high_pending }}
          DEFAULT_PENDING: ${{ steps.execute.outputs.default_pending }}
          REPORTS_PENDING: ${{ steps.execute.outputs.reports_pending }}
          CONVERGENCE_REQUIRED: ${{ steps.execute.outputs.convergence_required }}
          APPLY_SUPPORTED: ${{ steps.execute.outputs.apply_supported }}
          UNKNOWN_CLASS_COUNT: ${{ steps.execute.outputs.unknown_class_count }}
          OLDEST_PENDING_SECONDS: ${{ steps.execute.outputs.oldest_pending_seconds }}
          BACKLOG_SNAPSHOT_SHA256: ${{ steps.execute.outputs.backlog_snapshot_sha256 }}
          JOB_CLASS_COUNTS_B64: ${{ steps.execute.outputs.job_class_counts_b64 }}
          JOB_CLASS_COUNTS_SHA256: ${{ steps.execute.outputs.job_class_counts_sha256 }}
          BACKLOG_RECOVERY_SUPPORTED: ${{ steps.execute.outputs.backlog_recovery_supported }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          status=PASS_APPLY
          production_write_execution=true
          queue_job_execution_enabled=false
          if [ "$MODE" = preflight ]; then
            status=PASS_PREFLIGHT
            production_write_execution=false
          elif [ "$MODE" = backlog_apply ]; then
            queue_job_execution_enabled=true
          fi
          job_class_counts="$(printf '%s' "$JOB_CLASS_COUNTS_B64" | base64 --decode)"
          jq -e '
            type == "object"
            and (keys | sort) == ["default", "high", "reports"]
            and all(.[]; type == "object")
            and all(.[][]; type == "number" and . >= 0 and floor == .)
          ' <<<"$job_class_counts" >/dev/null
          jq -n \
            --arg mode "$MODE" \
            --arg status "$status" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg control "$CONTROL_PLANE_SHA" \
            --arg active "$ACTIVE_REVISION" \
            --arg runner "$RUNNER_SHA256" \
            --arg target "$TARGET_SET_SHA256" \
            --arg state "$STATE_SHA256" \
            --arg after_state "$AFTER_STATE_SHA256" \
            --arg default_state "$DEFAULT_STATE" \
            --arg reports_state "$REPORTS_STATE" \
            --argjson pending "$PENDING_TOTAL" \
            --argjson high_pending "$HIGH_PENDING" \
            --argjson default_pending "$DEFAULT_PENDING" \
            --argjson reports_pending "$REPORTS_PENDING" \
            --argjson convergence "$CONVERGENCE_REQUIRED" \
            --argjson apply_supported "$APPLY_SUPPORTED" \
            --argjson unknown_class_count "$UNKNOWN_CLASS_COUNT" \
            --argjson oldest_pending_seconds "$OLDEST_PENDING_SECONDS" \
            --arg backlog_snapshot_sha256 "$BACKLOG_SNAPSHOT_SHA256" \
            --arg job_class_counts_sha256 "$JOB_CLASS_COUNTS_SHA256" \
            --argjson job_class_counts "$job_class_counts" \
            --argjson backlog_recovery_supported "$BACKLOG_RECOVERY_SUPPORTED" \
            --argjson queue_job_execution_enabled "$queue_job_execution_enabled" \
            --argjson write "$production_write_execution" \
            '{
              contract_version: "backend.production_required_queue_runtime_control.v4",
              mode: $mode,
              status: $status,
              run_id: $run_id,
              run_attempt: $run_attempt,
              control_plane_sha: $control,
              active_revision: $active,
              runner_sha256: $runner,
              target_set_sha256: $target,
              state_sha256: $state,
              after_state_sha256: $after_state,
              target_states: {
                "fap-queue-default-high": $default_state,
                "fap-queue-reports": $reports_state
              },
              pending_total: $pending,
              pending_by_queue: {
                high: $high_pending,
                default: $default_pending,
                reports: $reports_pending
              },
              job_class_counts: $job_class_counts,
              unknown_class_count: $unknown_class_count,
              oldest_pending_seconds: $oldest_pending_seconds,
              backlog_snapshot_sha256: $backlog_snapshot_sha256,
              job_class_counts_sha256: $job_class_counts_sha256,
              convergence_required: $convergence,
              apply_supported: $apply_supported,
              backlog_recovery_supported: $backlog_recovery_supported,
              deploy_lock_present: false,
              deploy_like_process_count: 0,
              production_write_execution: $write,
              queue_job_execution_enabled: $queue_job_execution_enabled,
              negative_guarantees: {
                deploy: false,
                symlink: false,
                migration: false,
                cms_or_database_authority: false,
                publication: false,
                schema: false,
                hreflang: false,
                revalidation: false,
                sitemap_or_llms: false,
                search_submission: false,
                remote_file_write: false
              }
            }' > artifacts/backend-production-required-queue-runtime-control.json
          jq -e \
            '.contract_version == "backend.production_required_queue_runtime_control.v4"
             and .pending_total == (
               .pending_by_queue.high + .pending_by_queue.default + .pending_by_queue.reports
             )
             and .pending_total == ([.job_class_counts[][]] | add // 0)
             and .unknown_class_count <= .pending_total
             and (.backlog_snapshot_sha256 | test("^[0-9a-f]{64}$"))
             and (.job_class_counts_sha256 | test("^[0-9a-f]{64}$"))
             and .deploy_lock_present == false
             and .deploy_like_process_count == 0
             and .negative_guarantees.search_submission == false
             and .negative_guarantees.remote_file_write == false' \
            artifacts/backend-production-required-queue-runtime-control.json >/dev/null

      - name: Publish exact preflight authorization
        if: needs.eligibility.outputs.mode == 'preflight' && steps.execute.outputs.apply_supported == 'true'
        shell: bash
        env:
          CONTROL_PLANE_SHA: ${{ needs.eligibility.outputs.control_plane_sha }}
          ACTIVE_REVISION: ${{ needs.eligibility.outputs.active_revision }}
          RUNNER_SHA256: ${{ needs.eligibility.outputs.runner_sha256 }}
          TARGET_SET_SHA256: ${{ steps.execute.outputs.target_set_sha256 }}
          STATE_SHA256: ${{ steps.execute.outputs.state_sha256 }}
          CONVERGENCE_REQUIRED: ${{ steps.execute.outputs.convergence_required }}
        run: |
          set -euo pipefail
          test "$CONVERGENCE_REQUIRED" = true
          phrase="I explicitly approve production fap-api required queue runtime convergence from preflight run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT} with control-plane SHA ${CONTROL_PLANE_SHA} active SHA ${ACTIVE_REVISION} runner SHA256 ${RUNNER_SHA256} target-set SHA256 ${TARGET_SET_SHA256} state SHA256 ${STATE_SHA256}; restart only non-running fap-queue-default-high and fap-queue-reports workers with zero pending jobs, no deploy/symlink/migration/CMS/database-authority/publication/schema/hreflang/revalidation/sitemap/llms/search."
          {
            echo "## Required queue runtime preflight"
            echo
            echo '```text'
            echo "$phrase"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Exact receipt-bound authorization generated."

      - name: Publish exact backlog recovery authorization
        if: needs.eligibility.outputs.mode == 'preflight' && steps.execute.outputs.backlog_recovery_supported == 'true'
        shell: bash
        env:
          CONTROL_PLANE_SHA: ${{ needs.eligibility.outputs.control_plane_sha }}
          ACTIVE_REVISION: ${{ needs.eligibility.outputs.active_revision }}
          RUNNER_SHA256: ${{ needs.eligibility.outputs.runner_sha256 }}
          TARGET_SET_SHA256: ${{ steps.execute.outputs.target_set_sha256 }}
          STATE_SHA256: ${{ steps.execute.outputs.state_sha256 }}
          BACKLOG_SNAPSHOT_SHA256: ${{ steps.execute.outputs.backlog_snapshot_sha256 }}
          JOB_CLASS_COUNTS_SHA256: ${{ steps.execute.outputs.job_class_counts_sha256 }}
          PENDING_TOTAL: ${{ steps.execute.outputs.pending_total }}
        run: |
          set -euo pipefail
          phrase="I explicitly approve production fap-api required queue backlog recovery from preflight run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT} with control-plane SHA ${CONTROL_PLANE_SHA} active SHA ${ACTIVE_REVISION} runner SHA256 ${RUNNER_SHA256} target-set SHA256 ${TARGET_SET_SHA256} state SHA256 ${STATE_SHA256} backlog snapshot SHA256 ${BACKLOG_SNAPSHOT_SHA256} job-class-counts SHA256 ${JOB_CLASS_COUNTS_SHA256} pending total ${PENDING_TOTAL}; restart only non-running fap-queue-default-high and fap-queue-reports workers and resume normal processing including the exact preflight-bound App\\Jobs\\ProcessAttemptSubmissionJob backlog, with no deploy/symlink/migration/CMS-authority/publication/schema/hreflang/revalidation/sitemap/llms/search."
          {
            echo "## Required queue backlog recovery preflight"
            echo
            echo '```text'
            echo "$phrase"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Exact receipt-bound backlog recovery authorization generated."

      - name: Publish safe backlog diagnostic
        if: needs.eligibility.outputs.mode == 'preflight' && steps.execute.outputs.apply_supported != 'true' && steps.execute.outputs.backlog_recovery_supported != 'true'
        shell: bash
        env:
          DEFAULT_STATE: ${{ steps.execute.outputs.default_state }}
          REPORTS_STATE: ${{ steps.execute.outputs.reports_state }}
          HIGH_PENDING: ${{ steps.execute.outputs.high_pending }}
          DEFAULT_PENDING: ${{ steps.execute.outputs.default_pending }}
          REPORTS_PENDING: ${{ steps.execute.outputs.reports_pending }}
          UNKNOWN_CLASS_COUNT: ${{ steps.execute.outputs.unknown_class_count }}
          OLDEST_PENDING_SECONDS: ${{ steps.execute.outputs.oldest_pending_seconds }}
          BACKLOG_SNAPSHOT_SHA256: ${{ steps.execute.outputs.backlog_snapshot_sha256 }}
          JOB_CLASS_COUNTS_B64: ${{ steps.execute.outputs.job_class_counts_b64 }}
        run: |
          set -euo pipefail
          job_class_counts="$(printf '%s' "$JOB_CLASS_COUNTS_B64" | base64 --decode)"
          {
            echo "## Required queue runtime diagnostic"
            echo
            echo "- fap-queue-default-high state: $DEFAULT_STATE"
            echo "- fap-queue-reports state: $REPORTS_STATE"
            echo "- high pending: $HIGH_PENDING"
            echo "- default pending: $DEFAULT_PENDING"
            echo "- reports pending: $REPORTS_PENDING"
            echo "- unknown job classes: $UNKNOWN_CLASS_COUNT"
            echo "- oldest pending seconds: $OLDEST_PENDING_SECONDS"
            echo "- backlog snapshot SHA-256: $BACKLOG_SNAPSHOT_SHA256"
            echo "- job classes by queue:"
            jq -r 'to_entries[] as $queue
              | $queue.value
              | to_entries[]
              | "  - \($queue.key): \(.key) = \(.value)"' <<<"$job_class_counts"
            echo "- apply authorization: not generated"
            echo "- production writes: zero"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable control receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-production-required-queue-${{ needs.eligibility.outputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/backend-production-required-queue-runtime-control.json
          if-no-files-found: error
          retention-days: 30
