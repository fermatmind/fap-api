name: Backend Production Shared Permissions Provisioning

on:
  workflow_dispatch:
    inputs:
      expected_control_plane_sha:
        description: Exact latest main SHA containing this control
        required: true
        type: string
      expected_active_revision:
        description: Exact active production application SHA that must remain active
        required: true
        type: string
      expected_inactive_release_sha:
        description: Exact inactive release SHA containing the fixed 15-path manifest
        required: true
        type: string
      inactive_release_name:
        description: Exact inactive release directory created by the failed deploy
        required: true
        type: string
      failed_deploy_run_id:
        description: Exact failed Deploy API Production run that materialized the release
        required: true
        type: string
      failed_deploy_run_attempt:
        description: Exact failed deploy run attempt
        required: true
        type: string
      operator_approval_phrase:
        description: Exact release-bound one-time provisioning approval
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-${{ github.repository }}-production
  cancel-in-progress: false

jobs:
  provision:
    name: Provision and verify fixed production shared-permissions manifest
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      CONTROL_PLANE_SHA: ${{ inputs.expected_control_plane_sha }}
      EXPECTED_ACTIVE_REVISION: ${{ inputs.expected_active_revision }}
      INACTIVE_RELEASE_SHA: ${{ inputs.expected_inactive_release_sha }}
      INACTIVE_RELEASE_NAME: ${{ inputs.inactive_release_name }}
      FAILED_DEPLOY_RUN_ID: ${{ inputs.failed_deploy_run_id }}
      FAILED_DEPLOY_RUN_ATTEMPT: ${{ inputs.failed_deploy_run_attempt }}
      OPERATOR_APPROVAL_PHRASE: ${{ inputs.operator_approval_phrase }}
      DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
      DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
      RETIRED_DEPLOY_HOST: ${{ secrets.PRODUCTION_RETIRED_DEPLOY_HOST }}
      DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}

    steps:
      - name: Checkout exact control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.expected_control_plane_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact latest main, failed deploy and fixed manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          manifest="backend/scripts/deploy/shared_permissions_paths.txt"
          provisioner="backend/scripts/deploy/provision_shared_permissions.sh"
          verifier="backend/scripts/deploy/verify_shared_permissions.sh"

          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_ACTIVE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$INACTIVE_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$INACTIVE_RELEASE_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          [[ "$FAILED_DEPLOY_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$FAILED_DEPLOY_RUN_ATTEMPT" =~ ^[0-9]+$ ]]

          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$CONTROL_PLANE_SHA"
          test "$(git rev-parse origin/main)" = "$CONTROL_PLANE_SHA"
          git cat-file -e "${EXPECTED_ACTIVE_REVISION}^{commit}"
          git cat-file -e "${INACTIVE_RELEASE_SHA}^{commit}"
          git merge-base --is-ancestor "$EXPECTED_ACTIVE_REVISION" "$CONTROL_PLANE_SHA"
          git merge-base --is-ancestor "$INACTIVE_RELEASE_SHA" "$CONTROL_PLANE_SHA"
          test "$INACTIVE_RELEASE_SHA" != "$EXPECTED_ACTIVE_REVISION"

          for path in "$manifest" "$provisioner" "$verifier"; do
            test -f "$path"
            test ! -L "$path"
            test "$(git rev-parse "${CONTROL_PLANE_SHA}:${path}")" = \
              "$(git rev-parse "${INACTIVE_RELEASE_SHA}:${path}")"
          done
          bash -n "$provisioner"
          bash -n "$verifier"
          test "$(grep -cve '^$' "$manifest")" -eq 15
          test "$(LC_ALL=C sort -u "$manifest" | grep -cve '^$')" -eq 15
          while IFS= read -r relative_path || [ -n "$relative_path" ]; do
            [[ "$relative_path" =~ ^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$ ]]
            [[ "$relative_path" != *".."* ]]
          done < "$manifest"

          expected_suffix="-${FAILED_DEPLOY_RUN_ID}-${FAILED_DEPLOY_RUN_ATTEMPT}"
          [[ "$INACTIVE_RELEASE_NAME" == *"$expected_suffix" ]]
          failed_run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_DEPLOY_RUN_ID}")"
          jq -e \
            --arg sha "$INACTIVE_RELEASE_SHA" \
            --argjson attempt "$FAILED_DEPLOY_RUN_ATTEMPT" \
            '.name == "Deploy API Production"
             and .path == ".github/workflows/deploy-production.yml"
             and .event == "workflow_dispatch"
             and .status == "completed"
             and .conclusion == "failure"
             and .head_branch == "main"
             and .head_sha == $sha
             and .run_attempt == $attempt' <<<"$failed_run_json" >/dev/null

          expected_phrase="I explicitly approve one-time backend production shared-permissions provisioning for exact inactive release SHA ${INACTIVE_RELEASE_SHA} release ${INACTIVE_RELEASE_NAME}, using fixed 15-path manifest from exact latest main ${CONTROL_PLANE_SHA}; provision and verify only, zero application deploy, activation, rollback, CMS/DB write, or Search Channel operation."
          test "$OPERATOR_APPROVAL_PHRASE" = "$expected_phrase"

          {
            echo "MANIFEST_SHA256=$(sha256sum "$manifest" | awk '{print $1}')"
            echo "PROVISIONER_SHA256=$(sha256sum "$provisioner" | awk '{print $1}')"
            echo "VERIFIER_SHA256=$(sha256sum "$verifier" | awk '{print $1}')"
          } >> "$GITHUB_ENV"
          echo "Exact production provisioning eligibility passed without server writes."

      - name: Validate protected production topology
        shell: bash
        run: |
          set -euo pipefail
          for name in DEPLOY_USER DEPLOY_PORT DEPLOY_HOST RETIRED_DEPLOY_HOST DEPLOY_PATH; do
            test -n "${!name:-}"
          done
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          test "$DEPLOY_PORT" -ge 1
          test "$DEPLOY_PORT" -le 65535
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$RETIRED_DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          test "$DEPLOY_HOST" != "$RETIRED_DEPLOY_HOST"
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_PATH" != *".."* ]]
          echo "Protected production topology validation passed without disclosing values."

      - name: Set up SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known hosts
        shell: bash
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null \
            || ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f ~/.ssh/known_hosts >/dev/null

      - name: Provision and verify exact fixed manifest
        id: provision
        shell: bash
        run: |
          set -euo pipefail
          printf -v q_deploy_path '%q' "$DEPLOY_PATH"
          printf -v q_deploy_user '%q' "$DEPLOY_USER"
          printf -v q_active_revision '%q' "$EXPECTED_ACTIVE_REVISION"
          printf -v q_inactive_sha '%q' "$INACTIVE_RELEASE_SHA"
          printf -v q_release_name '%q' "$INACTIVE_RELEASE_NAME"
          printf -v q_manifest_sha '%q' "$MANIFEST_SHA256"
          printf -v q_provisioner_sha '%q' "$PROVISIONER_SHA256"
          printf -v q_verifier_sha '%q' "$VERIFIER_SHA256"

          result="$(
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
              -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "DEPLOY_PATH=$q_deploy_path DEPLOY_USER=$q_deploy_user EXPECTED_ACTIVE_REVISION=$q_active_revision INACTIVE_RELEASE_SHA=$q_inactive_sha INACTIVE_RELEASE_NAME=$q_release_name MANIFEST_SHA256=$q_manifest_sha PROVISIONER_SHA256=$q_provisioner_sha VERIFIER_SHA256=$q_verifier_sha bash -s" \
              <<'REMOTE'
          set -Eeuo pipefail
          releases_root="$(readlink -f "$DEPLOY_PATH/releases")"
          current_release="$(readlink -f "$DEPLOY_PATH/current")"
          release_path="$releases_root/$INACTIVE_RELEASE_NAME"
          resolved_release="$(readlink -f "$release_path")"

          test -d "$releases_root"
          test -d "$current_release"
          test "$resolved_release" = "$release_path"
          test "$resolved_release" != "$current_release"
          test ! -e "$DEPLOY_PATH/.dep/deploy.lock"
          test -f "$current_release/REVISION"
          test -f "$release_path/REVISION"
          test "$(tr -d '\r\n' < "$current_release/REVISION")" = "$EXPECTED_ACTIVE_REVISION"
          test "$(tr -d '\r\n' < "$release_path/REVISION")" = "$INACTIVE_RELEASE_SHA"

          manifest="$release_path/backend/scripts/deploy/shared_permissions_paths.txt"
          provisioner="$release_path/backend/scripts/deploy/provision_shared_permissions.sh"
          verifier="$release_path/backend/scripts/deploy/verify_shared_permissions.sh"
          for path in "$manifest" "$provisioner" "$verifier"; do
            test -f "$path"
            test ! -L "$path"
          done
          test "$(sha256sum "$manifest" | awk '{print $1}')" = "$MANIFEST_SHA256"
          test "$(sha256sum "$provisioner" | awk '{print $1}')" = "$PROVISIONER_SHA256"
          test "$(sha256sum "$verifier" | awk '{print $1}')" = "$VERIFIER_SHA256"
          test "$(grep -cve '^$' "$manifest")" -eq 15

          provision_output="$(
            sudo -n env \
              SHARED_PERMISSIONS_ROOT="$DEPLOY_PATH/shared" \
              SHARED_PERMISSIONS_OWNER="$DEPLOY_USER" \
              SHARED_PERMISSIONS_GROUP=www-data \
              SHARED_PERMISSIONS_APPLY=true \
              bash "$provisioner"
          )"
          test "$provision_output" = $'shared_permissions_provisioning_status=success\nshared_permissions_provisioned=16'

          verify_output="$(
            env \
              SHARED_PERMISSIONS_ROOT="$DEPLOY_PATH/shared" \
              SHARED_PERMISSIONS_OWNER="$DEPLOY_USER" \
              SHARED_PERMISSIONS_GROUP=www-data \
              SHARED_PERMISSIONS_RUNTIME_USER=www-data \
              bash "$verifier"
          )"
          test "$verify_output" = $'shared_permissions_status=success\nshared_permissions_checked=16'

          test "$(readlink -f "$DEPLOY_PATH/current")" = "$current_release"
          test "$(tr -d '\r\n' < "$current_release/REVISION")" = "$EXPECTED_ACTIVE_REVISION"
          test "$(tr -d '\r\n' < "$release_path/REVISION")" = "$INACTIVE_RELEASE_SHA"
          test ! -e "$DEPLOY_PATH/.dep/deploy.lock"
          printf 'shared_permissions_provisioning_status=success\n'
          printf 'shared_permissions_provisioned=16\n'
          printf 'shared_permissions_status=success\n'
          printf 'shared_permissions_checked=16\n'
          printf 'active_revision_unchanged=true\n'
          printf 'inactive_release_unchanged=true\n'
          REMOTE
          )"

          test "$result" = $'shared_permissions_provisioning_status=success\nshared_permissions_provisioned=16\nshared_permissions_status=success\nshared_permissions_checked=16\nactive_revision_unchanged=true\ninactive_release_unchanged=true'
          printf '%s\n' "$result"
          echo "provisioned=16" >> "$GITHUB_OUTPUT"
          echo "verified=16" >> "$GITHUB_OUTPUT"

      - name: Write bounded provisioning receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          jq -n \
            --arg control_plane_sha "$CONTROL_PLANE_SHA" \
            --arg active_revision "$EXPECTED_ACTIVE_REVISION" \
            --arg inactive_release_sha "$INACTIVE_RELEASE_SHA" \
            --arg inactive_release_name "$INACTIVE_RELEASE_NAME" \
            --arg failed_deploy_run_id "$FAILED_DEPLOY_RUN_ID" \
            --arg failed_deploy_run_attempt "$FAILED_DEPLOY_RUN_ATTEMPT" \
            --arg manifest_sha256 "$MANIFEST_SHA256" \
            '{
              schema_version: "backend-production-shared-permissions-provisioning.v1",
              status: "PASS_PROVISIONED_AND_VERIFIED",
              control_plane_sha: $control_plane_sha,
              active_revision: $active_revision,
              inactive_release_sha: $inactive_release_sha,
              inactive_release_name: $inactive_release_name,
              failed_deploy_run_id: ($failed_deploy_run_id | tonumber),
              failed_deploy_run_attempt: ($failed_deploy_run_attempt | tonumber),
              manifest_sha256: $manifest_sha256,
              manifest_path_count: 15,
              provisioned_target_count: 16,
              verified_target_count: 16,
              active_revision_unchanged: true,
              inactive_release_unchanged: true,
              application_deploy_count: 0,
              candidate_activation_count: 0,
              rollback_count: 0,
              cms_or_database_write_count: 0,
              migration_count: 0,
              queue_restart_count: 0,
              search_channel_operation_count: 0
            }' > artifacts/backend-production-shared-permissions-provisioning.json
          jq -e '
            .schema_version == "backend-production-shared-permissions-provisioning.v1"
            and .status == "PASS_PROVISIONED_AND_VERIFIED"
            and .manifest_path_count == 15
            and .provisioned_target_count == 16
            and .verified_target_count == 16
            and .active_revision_unchanged == true
            and .inactive_release_unchanged == true
            and .application_deploy_count == 0
            and .candidate_activation_count == 0
            and .rollback_count == 0
            and .cms_or_database_write_count == 0
            and .migration_count == 0
            and .queue_restart_count == 0
            and .search_channel_operation_count == 0
          ' artifacts/backend-production-shared-permissions-provisioning.json >/dev/null

      - name: Publish safe summary
        shell: bash
        run: |
          {
            echo "## Backend production shared-permissions provisioning"
            echo
            echo "- status: PASS_PROVISIONED_AND_VERIFIED"
            echo "- fixed_manifest_paths: 15"
            echo "- provisioned_targets_including_root: 16"
            echo "- verified_targets_including_root: 16"
            echo "- active_revision_unchanged: true"
            echo "- application_deploy_or_activation: false"
            echo "- rollback: false"
            echo "- CMS_DB_or_Search_Channel_operation: false"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bounded provisioning receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-production-shared-permissions-provisioning-${{ github.run_id }}
          path: artifacts/backend-production-shared-permissions-provisioning.json
          if-no-files-found: error
          retention-days: 30
