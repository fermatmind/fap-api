  mbti-zh-result-publish:
    name: Publish exact MBTI zh result authority
    needs: [policy, production]
    if: needs.production.result == 'success' && needs.policy.outputs.mbti_zh_result_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      PACKAGE_HASH: ${{ needs.policy.outputs.mbti_zh_result_package_hash }}
      ADMIN_ACTOR: ${{ needs.policy.outputs.mbti_zh_result_actor }}
      OPERATION_KEY: ${{ needs.policy.outputs.mbti_zh_result_operation_key }}
      DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
      DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
      RETIRED_DEPLOY_HOST: ${{ secrets.PRODUCTION_RETIRED_DEPLOY_HOST }}
      DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
    steps:
      - name: Start SSH agent without key metadata output
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          eval "$(ssh-agent -s)" >/dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          printf '%s\n' "$SSH_PRIVATE_KEY" | ssh-add - >/dev/null 2>&1
      - name: Install pinned known_hosts
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$DEPLOY_HOST" != "$RETIRED_DEPLOY_HOST"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Promote, read back, and recover the exact package
        shell: bash
        run: |
          set -euo pipefail
          dir=artifacts/mbti-zh-result-authority-publish
          mkdir -p "$dir"
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PACKAGE_HASH" =~ ^[0-9a-f]{64}$ ]]
          [[ "$ADMIN_ACTOR" =~ ^[1-9][0-9]*$ ]]
          [[ "$OPERATION_KEY" =~ ^[0-9a-f]{64}$ ]]
          printf -v q_path '%q' "$DEPLOY_PATH"
          printf -v q_release '%q' "$DEPLOY_SHA"
          ssh_base=(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST")
          remote_prefix="set -euo pipefail; current=\$(readlink -f $q_path/current); releases=\$(readlink -f $q_path/releases); test -n \"\$current\"; test -n \"\$releases\"; case \"\$current\" in \"\$releases\"/*) ;; *) exit 1 ;; esac; test \"\$(tr -d '\\r\\n' < \"\$current/REVISION\")\" = $q_release; test ! -e $q_path/.dep/deploy.lock; cd \"\$current/backend\";"
          flags="--production-content-write-authorized --no-publication-change --no-indexability-change --no-sitemap --no-llms --no-search-release"
          run_artisan() {
            "${ssh_base[@]}" "$remote_prefix sudo -n -u www-data -- php artisan personality:mbti-zh-result-content-release $* --no-interaction --no-ansi"
          }
          public_rows() {
            local output="$1"
            : > "$output"
            for base in ENFJ ENFP ENTJ ENTP ESFJ ESFP ESTJ ESTP INFJ INFP INTJ INTP ISFJ ISFP ISTJ ISTP; do
              for axis in A T; do
                code="${base}-${axis}"
                slug="$(tr '[:upper:]' '[:lower:]' <<<"$code")"
                curl --retry 3 --retry-all-errors --retry-delay 2 -fsS --connect-timeout 5 --max-time 30 \
                  "https://api.fermatmind.com/api/v0.5/personality/${slug}/desktop-clone?locale=zh-CN&org_id=0&scale_code=MBTI" \
                  | jq -c --arg code "$code" --arg package "$PACKAGE_HASH" '
                      select(.ok == true
                        and .full_code == $code
                        and (._meta.package_id | type == "string" and length > 0)
                        and ._meta.package_hash == $package
                        and (._meta.source_hash | test("^[a-f0-9]{64}$"))
                        and (._meta.revision_no | type == "number" and . > 0)
                        and (.asset_slots | length) == 7
                        and ([.asset_slots[] | select(.status == "disabled" and .asset_ref == null and .alt == "")] | length) == 7)
                      | {full_code,package_id:._meta.package_id,package_hash:._meta.package_hash,source_hash:._meta.source_hash,revision_no:._meta.revision_no,disabled_slots:7}
                    ' >> "$output"
              done
            done
          }
          public_snapshot() {
            local output="$1"
            : > "$output"
            for base in ENFJ ENFP ENTJ ENTP ESFJ ESFP ESTJ ESTP INFJ INFP INTJ INTP ISFJ ISFP ISTJ ISTP; do
              for axis in A T; do
                code="${base}-${axis}"
                slug="$(tr '[:upper:]' '[:lower:]' <<<"$code")"
                digest="$(curl --retry 3 --retry-all-errors --retry-delay 2 -fsS --connect-timeout 5 --max-time 30 \
                  "https://api.fermatmind.com/api/v0.5/personality/${slug}/desktop-clone?locale=zh-CN&org_id=0&scale_code=MBTI" \
                  | jq -S -c . | sha256sum | awk '{print $1}')"
                jq -cn --arg code "$code" --arg digest "$digest" '{full_code:$code,response_sha256:$digest}' >> "$output"
              done
            done
          }

          run_artisan --stage=dry-run | tee "$dir/dry-run.json"
          jq -e --arg package "$PACKAGE_HASH" '
            .ok == true and .record_count == 32 and .package_hash == $package
            and .writes == false and .discoverability_changes == false
          ' "$dir/dry-run.json" >/dev/null
          pre_state_hash="$(jq -r .pre_state_hash "$dir/dry-run.json")"
          already_active="$(jq -r .already_active "$dir/dry-run.json")"

          if [ "$already_active" = true ]; then
            run_artisan --stage=readback --package-hash="$PACKAGE_HASH" | tee "$dir/database-readback.json"
            public_rows "$dir/public-rows.jsonl"
            jq -s --arg package "$PACKAGE_HASH" '
              {schema:"mbti_zh_result_public_readback.v1",package_hash:$package,record_count:length,
               disabled_slot_count:(map(.disabled_slots)|add),unique_source_hashes:(map(.source_hash)|unique|length),
               ok:(length == 32 and (map(.package_hash)|unique) == [$package] and (map(.source_hash)|unique|length) == 32)}
            ' "$dir/public-rows.jsonl" > "$dir/public-readback.json"
            jq -e '.ok == true and .record_count == 32 and .disabled_slot_count == 224 and .unique_source_hashes == 32' "$dir/public-readback.json" >/dev/null
            jq -n --arg sha "$DEPLOY_SHA" --arg package "$PACKAGE_HASH" --arg operation "$OPERATION_KEY" '
              {contract_version:"mbti.zh_result_authority_publish.v1",status:"PASS_ALREADY_ACTIVE",release_sha:$sha,
               package_hash:$package,operation_key:$operation,record_count:32,disabled_slot_count:224,
               public_api_readback_count:32,immutable_revision_count_created:0,rollback_performed:false,
               negative_guarantees:{publication_eligibility_changed:false,indexability_changed:false,sitemap_mutated:false,llms_mutated:false,search_channel_mutated:false}}
            ' > "$dir/receipt.json"
            exit 0
          fi

          public_snapshot "$dir/public-pre-state.jsonl"
          rollback_set_hash=""
          recover_pre_state() {
            trap - ERR
            run_artisan --stage=dry-run | tee "$dir/failed-state.json"
            rollback_performed=false
            if ! jq -e --arg pre "$pre_state_hash" '.ok == true and .pre_state_hash == $pre and .already_active == false' "$dir/failed-state.json" >/dev/null; then
              [[ "$rollback_set_hash" =~ ^[0-9a-f]{64}$ ]]
              run_artisan --stage=rollback --package-hash="$PACKAGE_HASH" --pre-state-hash="$pre_state_hash" --revision-set-hash="$rollback_set_hash" "$flags" | tee "$dir/rollback.json"
              rollback_performed=true
            fi
            run_artisan --stage=dry-run | tee "$dir/rollback-database-readback.json"
            jq -e --arg pre "$pre_state_hash" '.ok == true and .pre_state_hash == $pre and .already_active == false' "$dir/rollback-database-readback.json" >/dev/null
            public_snapshot "$dir/public-restored-state.jsonl"
            diff -u "$dir/public-pre-state.jsonl" "$dir/public-restored-state.jsonl" > "$dir/rollback-public-diff.txt"
            jq -n --arg sha "$DEPLOY_SHA" --arg package "$PACKAGE_HASH" --arg operation "$OPERATION_KEY" --argjson rollback "$rollback_performed" '
              {contract_version:"mbti.zh_result_authority_publish.v1",status:"FAIL_ROLLED_BACK",release_sha:$sha,
               package_hash:$package,operation_key:$operation,record_count:32,rollback_performed:$rollback,
               database_pre_state_restored:true,public_pre_state_restored:true}
            ' > "$dir/receipt.json"
          }
          trap recover_pre_state ERR
          run_artisan --stage=draft --package-hash="$PACKAGE_HASH" --pre-state-hash="$pre_state_hash" --admin-user-id="$ADMIN_ACTOR" "$flags" | tee "$dir/draft.json"
          jq -e '
            .ok == true and .stage == "draft_write" and .record_count == 32
            and (.candidate_revisions | length) == 32 and (.rollback_revisions | length) == 32
            and (.candidate_revision_set_hash | test("^[a-f0-9]{64}$"))
            and (.rollback_revision_set_hash | test("^[a-f0-9]{64}$"))
          ' "$dir/draft.json" >/dev/null
          rollback_set_hash="$(jq -r .rollback_revision_set_hash "$dir/draft.json")"

          run_artisan --stage=promotion-dry-run | tee "$dir/promotion-dry-run.json"
          revision_set_hash="$(jq -r .candidate_revision_set_hash "$dir/promotion-dry-run.json")"
          test "$(jq -r .rollback_revision_set_hash "$dir/promotion-dry-run.json")" = "$rollback_set_hash"
          jq -e --arg package "$PACKAGE_HASH" --arg pre "$pre_state_hash" '
            .ok == true and .package_hash == $package and .pre_state_hash == $pre and .record_count == 32
          ' "$dir/promotion-dry-run.json" >/dev/null

          readback_ok=1
          set +e
          run_artisan --stage=promote --package-hash="$PACKAGE_HASH" --pre-state-hash="$pre_state_hash" --revision-set-hash="$revision_set_hash" "$flags" | tee "$dir/promotion.json"
          promotion_status="${PIPESTATUS[0]}"
          set -e
          test "$promotion_status" -eq 0 || readback_ok=0
          jq -e '.ok == true and .committed == true and .record_count == 32' "$dir/promotion.json" >/dev/null || readback_ok=0
          run_artisan --stage=readback --package-hash="$PACKAGE_HASH" | tee "$dir/database-readback.json" || readback_ok=0
          jq -e '.ok == true and .record_count == 32 and .disabled_slot_count == 224 and ([.revision_nos[]] | all(. > 0))' "$dir/database-readback.json" >/dev/null || readback_ok=0
          public_rows "$dir/public-rows.jsonl" || readback_ok=0
          jq -s --arg package "$PACKAGE_HASH" '
            {schema:"mbti_zh_result_public_readback.v1",package_hash:$package,record_count:length,
             disabled_slot_count:(map(.disabled_slots)|add // 0),unique_source_hashes:(map(.source_hash)|unique|length),
             ok:(length == 32 and (map(.package_hash)|unique) == [$package] and (map(.source_hash)|unique|length) == 32)}
          ' "$dir/public-rows.jsonl" > "$dir/public-readback.json"
          jq -e '.ok == true and .record_count == 32 and .disabled_slot_count == 224 and .unique_source_hashes == 32' "$dir/public-readback.json" >/dev/null || readback_ok=0

          if [ "$readback_ok" -ne 1 ]; then
            recover_pre_state
            exit 1
          fi

          trap - ERR
          jq -n --arg sha "$DEPLOY_SHA" --arg package "$PACKAGE_HASH" --arg operation "$OPERATION_KEY" \
            --arg pre "$pre_state_hash" --arg revisions "$revision_set_hash" '
            {contract_version:"mbti.zh_result_authority_publish.v1",status:"PASS_EXACT_AUTHORITY_PUBLISH",release_sha:$sha,
             package_hash:$package,operation_key:$operation,pre_state_hash:$pre,candidate_revision_set_hash:$revisions,
             record_count:32,disabled_slot_count:224,public_api_readback_count:32,immutable_revision_count_created:64,
             rollback_performed:false,
             negative_guarantees:{publication_eligibility_changed:false,indexability_changed:false,sitemap_mutated:false,llms_mutated:false,search_channel_mutated:false}}
          ' > "$dir/receipt.json"
      - name: Validate immutable sanitized receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          receipt=artifacts/mbti-zh-result-authority-publish/receipt.json
          jq -e --arg sha "$DEPLOY_SHA" --arg package "$PACKAGE_HASH" --arg operation "$OPERATION_KEY" '
            .contract_version == "mbti.zh_result_authority_publish.v1"
            and (.status == "PASS_EXACT_AUTHORITY_PUBLISH" or .status == "PASS_ALREADY_ACTIVE")
            and .release_sha == $sha and .package_hash == $package and .operation_key == $operation
            and .record_count == 32 and .disabled_slot_count == 224 and .public_api_readback_count == 32
            and ([.negative_guarantees[]] | all(. == false))
          ' "$receipt" >/dev/null
      - name: Upload MBTI zh result authority receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mbti-zh-result-authority-publish-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mbti-zh-result-authority-publish
          if-no-files-found: error
          retention-days: 90

  career-current-publish:
    name: Publish Career Current authority
    needs: [policy, staging, production]
    if: needs.production.result == 'success' && needs.policy.outputs.career_current_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      ASSETS_SHA256: ${{ needs.policy.outputs.career_current_assets_sha256 }}
      SOURCE_MERGE_SHA: ${{ needs.policy.outputs.career_current_source_merge_sha }}
      MANIFEST_SHA256: ${{ needs.policy.outputs.career_current_manifest_sha256 }}
      VERSIONLESS_PROJECTION_SHA256: ${{ needs.policy.outputs.career_current_projection_sha256 }}
      OPERATION_KEY: ${{ needs.policy.outputs.career_current_operation_key }}
      CI_PACKAGE_SCAN_RECEIPT_DIGEST: ${{ needs.policy.outputs.career_parity_receipt_digest }}
      PARITY_COMPILER_DIGEST: ${{ needs.policy.outputs.career_parity_compiler_digest }}
      PARITY_CODEC_DIGEST: ${{ needs.policy.outputs.career_parity_codec_digest }}
      FULL_SCAN: ${{ needs.policy.outputs.career_current_full_scan == 'true' && '1' || '0' }}
      DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
      DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
      RETIRED_DEPLOY_HOST: ${{ secrets.PRODUCTION_RETIRED_DEPLOY_HOST }}
      DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Download exact production Career parity receipt
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: trunk-production-${{ github.event.workflow_run.head_sha }}
          path: artifacts/career-current-production-parity
      - name: Start SSH agent without key metadata output
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          eval "$(ssh-agent -s)" >/dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          printf '%s\n' "$SSH_PRIVATE_KEY" | ssh-add - >/dev/null 2>&1
      - name: Install pinned known_hosts
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$DEPLOY_HOST" != "$RETIRED_DEPLOY_HOST"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Stream Career Current publisher and validate receipt
        shell: bash
        run: |
          set -euo pipefail
          dir=artifacts/career-current-authority-publish
          receipt="$dir/receipt.json"
          remote_stderr="$RUNNER_TEMP/career-current-authority-publish.stderr"
          production_parity_receipt="artifacts/career-current-production-parity/career-current-authority-production-preactivation-parity.json"
          mkdir -p "$dir"
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_MERGE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ASSETS_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$VERSIONLESS_PROJECTION_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$OPERATION_KEY" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CI_PACKAGE_SCAN_RECEIPT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          test -f "$production_parity_receipt"
          test ! -L "$production_parity_receipt"
          jq -e --arg sha "$DEPLOY_SHA" --arg projection "$VERSIONLESS_PROJECTION_SHA256" \
            --arg compiler "$PARITY_COMPILER_DIGEST" --arg codec "$PARITY_CODEC_DIGEST" '
              .contract_version == "career.current_authority_parity.v2"
              and .status == "pass"
              and .mode == "production-preactivation"
              and .release_sha == $sha
              and .package.projection_digest == $projection
              and .package.compiler_digest == $compiler
              and .package.codec_digest == $codec
              and .validation_scope.canonical_slugs == ["accountants-and-auditors"]
              and .validation_scope.locales == ["en", "zh-CN"]
              and .validation_scope.locale_page_count == 2
              and ([.write_counts[]] | all(. == 0))
              and (.receipt_digest | test("^[0-9a-f]{64}$"))
            ' "$production_parity_receipt" >/dev/null
          PRODUCTION_PARITY_RECEIPT_DIGEST="$(jq -r .receipt_digest "$production_parity_receipt")"
          export PRODUCTION_PARITY_RECEIPT_DIGEST
          [[ "$PRODUCTION_PARITY_RECEIPT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PARITY_COMPILER_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PARITY_CODEC_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$FULL_SCAN" =~ ^[01]$ ]]
          printf -v q_path '%q' "$DEPLOY_PATH"
          printf -v q_release '%q' "$DEPLOY_SHA"
          printf -v q_assets '%q' "$ASSETS_SHA256"
          printf -v q_source '%q' "$SOURCE_MERGE_SHA"
          printf -v q_manifest '%q' "$MANIFEST_SHA256"
          printf -v q_projection '%q' "$VERSIONLESS_PROJECTION_SHA256"
          printf -v q_operation '%q' "$OPERATION_KEY"
          printf -v q_ci_package_scan '%q' "$CI_PACKAGE_SCAN_RECEIPT_DIGEST"
          printf -v q_production_parity '%q' "$PRODUCTION_PARITY_RECEIPT_DIGEST"
          printf -v q_compiler '%q' "$PARITY_COMPILER_DIGEST"
          printf -v q_codec '%q' "$PARITY_CODEC_DIGEST"
          printf -v q_full_scan '%q' "$FULL_SCAN"
          printf -v q_run '%q' "$GITHUB_RUN_ID"
          printf -v q_attempt '%q' "$GITHUB_RUN_ATTEMPT"
          remote="set -euo pipefail; current=\$(readlink -f $q_path/current); releases=\$(readlink -f $q_path/releases); test -n \"\$current\"; test -n \"\$releases\"; case \"\$current\" in \"\$releases\"/*) ;; *) exit 1 ;; esac; test \"\$(tr -d '\\r\\n' < \"\$current/REVISION\")\" = $q_release; test ! -e $q_path/.dep/deploy.lock; release_name=\$(basename \"\$current\"); sudo -n -u www-data -- env CAREER_CURRENT_PUBLISH_EXECUTE=1 CAREER_CURRENT_PUBLISH_BACKEND_ROOT=\"\$current/backend\" CAREER_CURRENT_PUBLISH_RELEASE_SHA=$q_release CAREER_CURRENT_PUBLISH_RELEASE_NAME=\"\$release_name\" CAREER_CURRENT_PUBLISH_SOURCE_MERGE_SHA=$q_source CAREER_CURRENT_PUBLISH_MANIFEST_SHA256=$q_manifest CAREER_CURRENT_PUBLISH_ASSETS_SHA256=$q_assets CAREER_CURRENT_PUBLISH_VERSIONLESS_PROJECTION_SHA256=$q_projection CAREER_CURRENT_PUBLISH_OPERATION_KEY=$q_operation CAREER_CURRENT_PUBLISH_CI_PACKAGE_SCAN_RECEIPT_DIGEST=$q_ci_package_scan CAREER_CURRENT_PUBLISH_PRODUCTION_PARITY_RECEIPT_DIGEST=$q_production_parity CAREER_CURRENT_PUBLISH_PARITY_COMPILER_DIGEST=$q_compiler CAREER_CURRENT_PUBLISH_PARITY_CODEC_DIGEST=$q_codec CAREER_CURRENT_PUBLISH_FULL_SCAN=$q_full_scan CAREER_CURRENT_PUBLISH_WORKFLOW_RUN_ID=$q_run CAREER_CURRENT_PUBLISH_WORKFLOW_RUN_ATTEMPT=$q_attempt \"\$current/backend/scripts/deploy/run_career_current_authority_publisher.sh\""
          set +e
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" "$remote" \
            < backend/scripts/operations/career_current_authority_publish.php \
            > "$receipt" 2> "$remote_stderr"
          remote_status=$?
          set -e
          jq -e 'type == "object" and (.status | type == "string")' "$receipt" >/dev/null
          test "$remote_status" = 0
          jq -e --arg release "$DEPLOY_SHA" --arg source "$SOURCE_MERGE_SHA" --arg manifest "$MANIFEST_SHA256" \
            --arg assets "$ASSETS_SHA256" --arg projection "$VERSIONLESS_PROJECTION_SHA256" \
            --arg operation "$OPERATION_KEY" --argjson full_scan "$FULL_SCAN" '
              .contract_version == "career.current_authority_publish.v1"
              and .status == "PASS_CURRENT_AUTHORITY_PUBLISH"
              and .release_sha == $release
              and .source_merge_sha == $source
              and .manifest_sha256 == $manifest
              and .assets_sha256 == $assets
              and .versionless_projection_sha256 == $projection
              and .versionless_projection_sha256 == .package.versionless_projection_sha256
              and .operation_key == $operation
              and .parity.ci_package_scan_receipt_digest == env.CI_PACKAGE_SCAN_RECEIPT_DIGEST
              and .parity.production_preactivation_receipt_digest == env.PRODUCTION_PARITY_RECEIPT_DIGEST
              and .parity.compiler_digest == env.PARITY_COMPILER_DIGEST
              and .parity.codec_digest == env.PARITY_CODEC_DIGEST
              and .full_scan == ($full_scan == 1)
              and .resource_guard == {
                "schema_version": "career.current_authority_publish.resource_guard.v1",
                "timeout_seconds": 900,
                "nice_adjustment": 15,
                "ionice_class": 2,
                "ionice_priority": 7,
                "memory_limit_mb": 1024
              }
              and .package.career_count == 1046
              and .package.locale_page_count == 2092
              and .package.file_count == 2092
              and .authority.target_count == 1046
              and .authority.unique_slug_count == 1046
              and .authority.component_28_count == 1046
              and .manual_hold_verified == true
              and (.full_scan == false or .public_readback.verified_slug_count == 1046)
              and (.full_scan == false or .public_readback.verified_locale_page_count == 2092)
              and .write_counts.occupation_write_count == 0
              and .write_counts.generation_write_count == 0
              and .write_counts.discoverability_write_count == 0
              and .write_counts.search_submission_count == 0
              and .negative_guarantees.task_3a_through_7b_executed == false
              and .negative_guarantees.search_channel_executed == false
              and .automatic_retry_allowed == false
            ' "$receipt" >/dev/null
      - name: Upload Career Current publish receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: career-current-authority-publish-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/career-current-authority-publish
          if-no-files-found: error
          retention-days: 90

  docs-only:
    name: Docs-only deployment skip receipt
    needs: policy
