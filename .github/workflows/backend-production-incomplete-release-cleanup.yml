name: Backend Production Incomplete Release Cleanup

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only preflight or receipt-bound empty-directory cleanup
        required: true
        type: choice
        options:
          - preflight
          - apply
      expected_control_plane_sha:
        description: Exact latest main SHA containing this cleanup control
        required: true
        type: string
      target_release_name:
        description: Exact inactive release directory name
        required: true
        type: string
      expected_release_revision:
        description: Exact historical revision bound to the source deploy evidence
        required: true
        type: string
      source_deploy_run_id:
        description: Exact Deploy API Production run that created the historical release
        required: true
        type: string
      source_deploy_run_attempt:
        description: Exact source deploy run attempt
        required: true
        type: string
      preflight_run_id:
        description: Apply-only successful cleanup preflight run id
        required: false
        type: string
      preflight_run_attempt:
        description: Apply-only successful cleanup preflight run attempt
        required: false
        type: string
      expected_inventory_sha256:
        description: Apply-only exact empty-directory inventory SHA256
        required: false
        type: string
      operator_approval_phrase:
        description: Apply-only exact receipt-bound destructive approval
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-${{ github.repository }}-production
  cancel-in-progress: false

jobs:
  cleanup:
    name: Verify or remove one incomplete backend release residue
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      MODE: ${{ inputs.mode }}
      EXPECTED_CONTROL_PLANE_SHA: ${{ inputs.expected_control_plane_sha }}
      TARGET_RELEASE_NAME: ${{ inputs.target_release_name }}
      EXPECTED_RELEASE_REVISION: ${{ inputs.expected_release_revision }}
      SOURCE_DEPLOY_RUN_ID: ${{ inputs.source_deploy_run_id }}
      SOURCE_DEPLOY_RUN_ATTEMPT: ${{ inputs.source_deploy_run_attempt }}
      PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
      PREFLIGHT_RUN_ATTEMPT: ${{ inputs.preflight_run_attempt }}
      EXPECTED_INVENTORY_SHA256: ${{ inputs.expected_inventory_sha256 }}
      OPERATOR_APPROVAL_PHRASE: ${{ inputs.operator_approval_phrase }}

    steps:
      - name: Check out exact main control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.expected_control_plane_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact control plane and historical deploy evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          case "$MODE" in preflight|apply) ;; *) exit 2 ;; esac
          [[ "$EXPECTED_CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_RELEASE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TARGET_RELEASE_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          [[ "$SOURCE_DEPLOY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_DEPLOY_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]

          control_plane_sha="$(git rev-parse HEAD)"
          test "$control_plane_sha" = "$EXPECTED_CONTROL_PLANE_SHA"
          test "$control_plane_sha" = "$GITHUB_SHA"
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$control_plane_sha" = "$(git rev-parse origin/main)"
          git cat-file -e "${EXPECTED_RELEASE_REVISION}^{commit}"
          git merge-base --is-ancestor "$EXPECTED_RELEASE_REVISION" origin/main

          revision_prefix="${EXPECTED_RELEASE_REVISION:0:12}"
          [[ "$TARGET_RELEASE_NAME" == *"-${revision_prefix}-${SOURCE_DEPLOY_RUN_ID}-${SOURCE_DEPLOY_RUN_ATTEMPT}" ]]

          source_run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_DEPLOY_RUN_ID}")"
          jq -e \
            --argjson attempt "$SOURCE_DEPLOY_RUN_ATTEMPT" \
            '.name == "Deploy API Production"
             and .path == ".github/workflows/deploy-production.yml"
             and .event == "workflow_dispatch"
             and .head_branch == "main"
             and .status == "completed"
             and (.conclusion == "success" or .conclusion == "cancelled" or .conclusion == "failure")
             and .run_attempt == $attempt' \
            <<<"$source_run_json" >/dev/null

          evidence_dir="$(mktemp -d)"
          gh run download "$SOURCE_DEPLOY_RUN_ID" \
            --name "backend-production-deploy-progress-${SOURCE_DEPLOY_RUN_ID}-${SOURCE_DEPLOY_RUN_ATTEMPT}" \
            --dir "$evidence_dir/progress"
          gh run download "$SOURCE_DEPLOY_RUN_ID" \
            --name "deployer-task-timing-production" \
            --dir "$evidence_dir/timing"
          progress_receipt="$evidence_dir/progress/deployer-progress.json"
          timing_receipt="$evidence_dir/timing/deployer-task-timing.json"
          test -f "$progress_receipt"
          test -f "$timing_receipt"
          jq -e \
            --arg revision "$EXPECTED_RELEASE_REVISION" \
            --arg run_id "$SOURCE_DEPLOY_RUN_ID" \
            --arg attempt "$SOURCE_DEPLOY_RUN_ATTEMPT" \
            '.schema_version == "fermatmind.deployer-progress.v1"
             and .status == "completed"
             and .sha == $revision
             and .workflow_run_id == $run_id
             and .workflow_run_attempt == $attempt' \
            "$progress_receipt" >/dev/null
          jq -e \
            --arg revision "$EXPECTED_RELEASE_REVISION" \
            --arg run_id "$SOURCE_DEPLOY_RUN_ID" \
            --arg attempt "$SOURCE_DEPLOY_RUN_ATTEMPT" \
            '.schema_version == "fermatmind.deployer-task-timing.v1"
             and .plan_status == "complete"
             and .sha == $revision
             and .workflow_run_id == $run_id
             and .workflow_run_attempt == $attempt
             and ([.tasks[] | select(.task == "deploy:update_code" and .result == "success")] | length) == 1
             and ([.tasks[] | select(.task == "guard:expected-release-revision" and .result == "success")] | length) == 1
             and ([.tasks[] | select(.task == "deploy:symlink" and .result == "success")] | length) == 1
             and ([.tasks[] | select(.task == "deploy:cleanup" and .result == "success")] | length) == 1' \
            "$timing_receipt" >/dev/null

          if [ "$MODE" = apply ]; then
            [[ "$PREFLIGHT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$PREFLIGHT_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
            [[ "$EXPECTED_INVENTORY_SHA256" =~ ^[0-9a-f]{64}$ ]]
            test "$PREFLIGHT_RUN_ID" != "$GITHUB_RUN_ID"

            preflight_run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREFLIGHT_RUN_ID}")"
            jq -e \
              --arg sha "$EXPECTED_CONTROL_PLANE_SHA" \
              --argjson attempt "$PREFLIGHT_RUN_ATTEMPT" \
              '.name == "Backend Production Incomplete Release Cleanup"
               and .path == ".github/workflows/backend-production-incomplete-release-cleanup.yml"
               and .event == "workflow_dispatch"
               and .head_branch == "main"
               and .head_sha == $sha
               and .status == "completed"
               and .conclusion == "success"
               and .run_attempt == $attempt' \
              <<<"$preflight_run_json" >/dev/null

            preflight_dir="$(mktemp -d)"
            gh run download "$PREFLIGHT_RUN_ID" \
              --name "backend-production-incomplete-release-cleanup-preflight-${PREFLIGHT_RUN_ID}-${PREFLIGHT_RUN_ATTEMPT}" \
              --dir "$preflight_dir"
            preflight_receipt="$preflight_dir/backend-production-incomplete-release-cleanup.json"
            test -f "$preflight_receipt"
            jq -e \
              --arg control "$EXPECTED_CONTROL_PLANE_SHA" \
              --arg target "$TARGET_RELEASE_NAME" \
              --arg revision "$EXPECTED_RELEASE_REVISION" \
              --arg source_run "$SOURCE_DEPLOY_RUN_ID" \
              --arg source_attempt "$SOURCE_DEPLOY_RUN_ATTEMPT" \
              --arg inventory "$EXPECTED_INVENTORY_SHA256" \
              '.contract_version == "backend.production_incomplete_release_cleanup.v1"
               and .mode == "preflight"
               and .status == "PASS_PREFLIGHT"
               and .control_plane_sha == $control
               and .target_release_name == $target
               and .historical_revision == $revision
               and .source_deploy_run_id == $source_run
               and .source_deploy_run_attempt == $source_attempt
               and .inventory_sha256 == $inventory
               and .target_is_active == false
               and .deploy_lock_present == false
               and .process_reference_count == 0
               and .regular_file_count == 0
               and .symlink_count == 0
               and .writes_committed == false' \
              "$preflight_receipt" >/dev/null
            PREFLIGHT_ACTIVE_REVISION="$(jq -r '.active_revision' "$preflight_receipt")"
            PREFLIGHT_ACTIVE_RELEASE_NAME="$(jq -r '.active_release_name' "$preflight_receipt")"
            [[ "$PREFLIGHT_ACTIVE_REVISION" =~ ^[0-9a-f]{40}$ ]]
            [[ "$PREFLIGHT_ACTIVE_RELEASE_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
            expected_phrase="I explicitly approve removal of empty inactive backend production release residue ${TARGET_RELEASE_NAME} from source deploy run ${SOURCE_DEPLOY_RUN_ID} attempt ${SOURCE_DEPLOY_RUN_ATTEMPT}, historical revision ${EXPECTED_RELEASE_REVISION}, active release ${PREFLIGHT_ACTIVE_RELEASE_NAME} SHA ${PREFLIGHT_ACTIVE_REVISION}, cleanup preflight ${PREFLIGHT_RUN_ID} attempt ${PREFLIGHT_RUN_ATTEMPT}, inventory ${EXPECTED_INVENTORY_SHA256}; rmdir-only, zero deploy, activation, database/CMS write, warm, publication, process restart, or discoverability change."
            test "$OPERATOR_APPROVAL_PHRASE" = "$expected_phrase"
            printf 'PREFLIGHT_ACTIVE_REVISION=%s\n' "$PREFLIGHT_ACTIVE_REVISION" >> "$GITHUB_ENV"
            printf 'PREFLIGHT_ACTIVE_RELEASE_NAME=%s\n' "$PREFLIGHT_ACTIVE_RELEASE_NAME" >> "$GITHUB_ENV"
          else
            test -z "$PREFLIGHT_RUN_ID"
            test -z "$PREFLIGHT_RUN_ATTEMPT"
            test -z "$EXPECTED_INVENTORY_SHA256"
            test -z "$OPERATOR_APPROVAL_PHRASE"
          fi

      - name: Set up SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known hosts
        shell: bash
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          RETIRED_DEPLOY_HOST: ${{ secrets.PRODUCTION_RETIRED_DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS"
          for name in DEPLOY_USER DEPLOY_PORT DEPLOY_HOST RETIRED_DEPLOY_HOST DEPLOY_PATH; do
            test -n "${!name:-}"
          done
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          test "$DEPLOY_PORT" -ge 1
          test "$DEPLOY_PORT" -le 65535
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$RETIRED_DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          test "$DEPLOY_HOST" != "$RETIRED_DEPLOY_HOST"
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_PATH" != *".."* ]]
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null \
            || ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f ~/.ssh/known_hosts >/dev/null

      - name: Verify exact incomplete release residue without writes
        if: ${{ inputs.mode == 'preflight' }}
        shell: bash
        env:
          DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          printf -v q_deploy_path '%q' "$DEPLOY_PATH"
          printf -v q_target_release_name '%q' "$TARGET_RELEASE_NAME"
          if ! ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH=$q_deploy_path TARGET_RELEASE_NAME=$q_target_release_name bash -s" \
            <<'REMOTE' > artifacts/remote-preflight.json 2> artifacts/remote-preflight.err
          set -Eeuo pipefail
          trap 'printf "INCOMPLETE_RELEASE_CLEANUP_REMOTE_FAILURE_LINE_%s\n" "$LINENO" >&2' ERR
          releases_root="$(readlink -f "$DEPLOY_PATH/releases")"
          current_release="$(readlink -f "$DEPLOY_PATH/current")"
          target="$releases_root/$TARGET_RELEASE_NAME"
          resolved_target="$(readlink -f "$target")"
          test "$resolved_target" = "$target"
          test -d "$target"
          test "$target" != "$current_release"
          test ! -e "$DEPLOY_PATH/.dep/deploy.lock"
          active_release_name="$(basename "$current_release")"
          active_revision="$(tr -d '\r\n' < "$current_release/REVISION")"
          [[ "$active_release_name" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          [[ "$active_revision" =~ ^[0-9a-f]{40}$ ]]

          inventory="$(find "$target" -mindepth 1 -printf '%y %P\n' | LC_ALL=C sort)"
          expected_inventory=$'d backend\nd backend/storage\nd backend/storage/framework\nd backend/storage/framework/cache'
          test "$inventory" = "$expected_inventory"
          inventory_sha256="$(printf '%s\n' "$inventory" | sha256sum | awk '{print $1}')"
          regular_file_count="$(find "$target" -xdev -type f | wc -l | tr -d ' ')"
          symlink_count="$(find "$target" -xdev -type l | wc -l | tr -d ' ')"
          test "$regular_file_count" = 0
          test "$symlink_count" = 0

          process_reference_count=0
          for process_root in /proc/[0-9]*; do
            cwd="$(readlink -f "$process_root/cwd" 2>/dev/null || true)"
            exe="$(readlink -f "$process_root/exe" 2>/dev/null || true)"
            root="$(readlink -f "$process_root/root" 2>/dev/null || true)"
            case "$cwd|$exe|$root" in *"$target"*) process_reference_count=$((process_reference_count + 1));; esac
          done
          test "$process_reference_count" = 0

          jq -n \
            --arg active_release_name "$active_release_name" \
            --arg active_revision "$active_revision" \
            --arg inventory_sha256 "$inventory_sha256" \
            --argjson regular_file_count "$regular_file_count" \
            --argjson symlink_count "$symlink_count" \
            --argjson process_reference_count "$process_reference_count" \
            '{
              active_release_name: $active_release_name,
              active_revision: $active_revision,
              inventory_sha256: $inventory_sha256,
              target_is_active: false,
              deploy_lock_present: false,
              regular_file_count: $regular_file_count,
              symlink_count: $symlink_count,
              process_reference_count: $process_reference_count
            }'
          REMOTE
          then
            failure_code="$(rg -o 'INCOMPLETE_RELEASE_CLEANUP_REMOTE_FAILURE_LINE_[0-9]+' artifacts/remote-preflight.err | tail -n 1 || true)"
            echo "${failure_code:-INCOMPLETE_RELEASE_CLEANUP_REMOTE_PREFLIGHT_FAILED}" >&2
            exit 1
          fi

          jq -e '
            (.active_release_name | test("^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"))
            and (.active_revision | test("^[0-9a-f]{40}$"))
            and (.inventory_sha256 | test("^[0-9a-f]{64}$"))
            and .target_is_active == false
            and .deploy_lock_present == false
            and .regular_file_count == 0
            and .symlink_count == 0
            and .process_reference_count == 0
          ' artifacts/remote-preflight.json >/dev/null

          jq -n \
            --arg contract_version "backend.production_incomplete_release_cleanup.v1" \
            --arg status "PASS_PREFLIGHT" \
            --arg mode "preflight" \
            --arg control_plane_sha "$EXPECTED_CONTROL_PLANE_SHA" \
            --arg target_release_name "$TARGET_RELEASE_NAME" \
            --arg historical_revision "$EXPECTED_RELEASE_REVISION" \
            --arg source_deploy_run_id "$SOURCE_DEPLOY_RUN_ID" \
            --arg source_deploy_run_attempt "$SOURCE_DEPLOY_RUN_ATTEMPT" \
            --slurpfile remote artifacts/remote-preflight.json \
            '{
              contract_version: $contract_version,
              status: $status,
              mode: $mode,
              control_plane_sha: $control_plane_sha,
              target_release_name: $target_release_name,
              historical_revision: $historical_revision,
              source_deploy_run_id: $source_deploy_run_id,
              source_deploy_run_attempt: $source_deploy_run_attempt,
              active_release_name: $remote[0].active_release_name,
              active_revision: $remote[0].active_revision,
              inventory_sha256: $remote[0].inventory_sha256,
              target_is_active: false,
              deploy_lock_present: false,
              process_reference_count: 0,
              regular_file_count: 0,
              symlink_count: 0,
              directory_removal_count: 0,
              file_delete_count: 0,
              deploy_count: 0,
              activation_count: 0,
              database_write_count: 0,
              cms_write_count: 0,
              cache_warm_count: 0,
              publication_count: 0,
              process_restart_count: 0,
              discoverability_write_count: 0,
              writes_committed: false
            }' > artifacts/backend-production-incomplete-release-cleanup.json

          inventory_sha256="$(jq -r '.inventory_sha256' artifacts/backend-production-incomplete-release-cleanup.json)"
          active_release_name="$(jq -r '.active_release_name' artifacts/backend-production-incomplete-release-cleanup.json)"
          active_revision="$(jq -r '.active_revision' artifacts/backend-production-incomplete-release-cleanup.json)"
          approval="I explicitly approve removal of empty inactive backend production release residue ${TARGET_RELEASE_NAME} from source deploy run ${SOURCE_DEPLOY_RUN_ID} attempt ${SOURCE_DEPLOY_RUN_ATTEMPT}, historical revision ${EXPECTED_RELEASE_REVISION}, active release ${active_release_name} SHA ${active_revision}, cleanup preflight ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}, inventory ${inventory_sha256}; rmdir-only, zero deploy, activation, database/CMS write, warm, publication, process restart, or discoverability change."
          {
            echo "## Incomplete release cleanup preflight"
            echo
            echo "Status: PASS_PREFLIGHT"
            echo
            echo "Exact apply approval phrase:"
            echo
            echo "\`\`\`text"
            echo "$approval"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove exact empty inactive release residue
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        env:
          DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          printf -v q_deploy_path '%q' "$DEPLOY_PATH"
          printf -v q_target_release_name '%q' "$TARGET_RELEASE_NAME"
          printf -v q_expected_active_revision '%q' "$PREFLIGHT_ACTIVE_REVISION"
          printf -v q_expected_active_release_name '%q' "$PREFLIGHT_ACTIVE_RELEASE_NAME"
          printf -v q_expected_inventory_sha256 '%q' "$EXPECTED_INVENTORY_SHA256"
          if ! ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH=$q_deploy_path TARGET_RELEASE_NAME=$q_target_release_name EXPECTED_ACTIVE_REVISION=$q_expected_active_revision EXPECTED_ACTIVE_RELEASE_NAME=$q_expected_active_release_name EXPECTED_INVENTORY_SHA256=$q_expected_inventory_sha256 bash -s" \
            <<'REMOTE' > artifacts/remote-apply.json 2> artifacts/remote-apply.err
          set -Eeuo pipefail
          trap 'printf "INCOMPLETE_RELEASE_CLEANUP_REMOTE_FAILURE_LINE_%s\n" "$LINENO" >&2' ERR
          releases_root="$(readlink -f "$DEPLOY_PATH/releases")"
          current_release="$(readlink -f "$DEPLOY_PATH/current")"
          target="$releases_root/$TARGET_RELEASE_NAME"
          resolved_target="$(readlink -f "$target")"
          test "$resolved_target" = "$target"
          test -d "$target"
          test "$target" != "$current_release"
          test ! -e "$DEPLOY_PATH/.dep/deploy.lock"
          test "$(basename "$current_release")" = "$EXPECTED_ACTIVE_RELEASE_NAME"
          test "$(tr -d '\r\n' < "$current_release/REVISION")" = "$EXPECTED_ACTIVE_REVISION"

          inventory="$(find "$target" -mindepth 1 -printf '%y %P\n' | LC_ALL=C sort)"
          expected_inventory=$'d backend\nd backend/storage\nd backend/storage/framework\nd backend/storage/framework/cache'
          test "$inventory" = "$expected_inventory"
          inventory_sha256="$(printf '%s\n' "$inventory" | sha256sum | awk '{print $1}')"
          test "$inventory_sha256" = "$EXPECTED_INVENTORY_SHA256"
          test "$(find "$target" -xdev -type f | wc -l | tr -d ' ')" = 0
          test "$(find "$target" -xdev -type l | wc -l | tr -d ' ')" = 0

          process_reference_count=0
          for process_root in /proc/[0-9]*; do
            cwd="$(readlink -f "$process_root/cwd" 2>/dev/null || true)"
            exe="$(readlink -f "$process_root/exe" 2>/dev/null || true)"
            root="$(readlink -f "$process_root/root" 2>/dev/null || true)"
            case "$cwd|$exe|$root" in *"$target"*) process_reference_count=$((process_reference_count + 1));; esac
          done
          test "$process_reference_count" = 0

          rmdir -- "$target/backend/storage/framework/cache"
          rmdir -- "$target/backend/storage/framework"
          rmdir -- "$target/backend/storage"
          rmdir -- "$target/backend"
          rmdir -- "$target"

          test ! -e "$target"
          current_release_after="$(readlink -f "$DEPLOY_PATH/current")"
          test "$current_release_after" = "$current_release"
          test "$(basename "$current_release_after")" = "$EXPECTED_ACTIVE_RELEASE_NAME"
          test "$(tr -d '\r\n' < "$current_release_after/REVISION")" = "$EXPECTED_ACTIVE_REVISION"
          test ! -e "$DEPLOY_PATH/.dep/deploy.lock"

          jq -n \
            --arg active_release_name "$EXPECTED_ACTIVE_RELEASE_NAME" \
            --arg active_revision "$EXPECTED_ACTIVE_REVISION" \
            --arg inventory_sha256 "$inventory_sha256" \
            '{
              active_release_name: $active_release_name,
              active_revision: $active_revision,
              inventory_sha256: $inventory_sha256,
              target_absent: true,
              active_release_unchanged: true,
              deploy_lock_present: false,
              directory_removal_count: 5,
              file_delete_count: 0
            }'
          REMOTE
          then
            failure_code="$(rg -o 'INCOMPLETE_RELEASE_CLEANUP_REMOTE_FAILURE_LINE_[0-9]+' artifacts/remote-apply.err | tail -n 1 || true)"
            echo "${failure_code:-INCOMPLETE_RELEASE_CLEANUP_REMOTE_APPLY_FAILED}" >&2
            exit 1
          fi

          jq -e \
            --arg active_name "$PREFLIGHT_ACTIVE_RELEASE_NAME" \
            --arg active_revision "$PREFLIGHT_ACTIVE_REVISION" \
            --arg inventory "$EXPECTED_INVENTORY_SHA256" \
            '.active_release_name == $active_name
             and .active_revision == $active_revision
             and .inventory_sha256 == $inventory
             and .target_absent == true
             and .active_release_unchanged == true
             and .deploy_lock_present == false
             and .directory_removal_count == 5
             and .file_delete_count == 0' \
            artifacts/remote-apply.json >/dev/null

          jq -n \
            --arg contract_version "backend.production_incomplete_release_cleanup.v1" \
            --arg status "PASS_APPLY" \
            --arg mode "apply" \
            --arg control_plane_sha "$EXPECTED_CONTROL_PLANE_SHA" \
            --arg target_release_name "$TARGET_RELEASE_NAME" \
            --arg historical_revision "$EXPECTED_RELEASE_REVISION" \
            --arg source_deploy_run_id "$SOURCE_DEPLOY_RUN_ID" \
            --arg source_deploy_run_attempt "$SOURCE_DEPLOY_RUN_ATTEMPT" \
            --arg preflight_run_id "$PREFLIGHT_RUN_ID" \
            --arg preflight_run_attempt "$PREFLIGHT_RUN_ATTEMPT" \
            --slurpfile remote artifacts/remote-apply.json \
            '{
              contract_version: $contract_version,
              status: $status,
              mode: $mode,
              control_plane_sha: $control_plane_sha,
              target_release_name: $target_release_name,
              historical_revision: $historical_revision,
              source_deploy_run_id: $source_deploy_run_id,
              source_deploy_run_attempt: $source_deploy_run_attempt,
              preflight_run_id: $preflight_run_id,
              preflight_run_attempt: $preflight_run_attempt,
              active_release_name: $remote[0].active_release_name,
              active_revision: $remote[0].active_revision,
              inventory_sha256: $remote[0].inventory_sha256,
              target_absent: true,
              active_release_unchanged: true,
              deploy_lock_present: false,
              directory_removal_count: 5,
              file_delete_count: 0,
              deploy_count: 0,
              activation_count: 0,
              database_write_count: 0,
              cms_write_count: 0,
              cache_warm_count: 0,
              publication_count: 0,
              process_restart_count: 0,
              discoverability_write_count: 0,
              writes_committed: true
            }' > artifacts/backend-production-incomplete-release-cleanup.json

      - name: Upload cleanup receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-production-incomplete-release-cleanup-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/backend-production-incomplete-release-cleanup.json
          if-no-files-found: error
          retention-days: 90
