name: Career Search Entry Batch Cache Refresh Resume

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preflight is read-only; execute requires its exact production-write phrase
        required: true
        type: choice
        options:
          - preflight
          - execute
      expected_control_plane_sha:
        description: Exact latest main SHA containing this resume control
        required: true
        type: string
      expected_release_sha:
        description: Exact unchanged active production application SHA
        required: true
        type: string
      expected_release_name:
        description: Exact unchanged active production release name
        required: true
        type: string
      failed_run_id:
        description: Exact indeterminate cache-refresh execute run
        required: true
        type: string
      failed_run_attempt:
        description: Exact indeterminate cache-refresh execute attempt
        required: true
        type: string
      recovery_run_id:
        description: Exact successful indeterminate recovery preflight run
        required: true
        type: string
      recovery_run_attempt:
        description: Exact successful indeterminate recovery preflight attempt
        required: true
        type: string
      expected_manifest_sha256:
        description: Exact 50-slug manifest SHA from recovery
        required: true
        type: string
      expected_recovery_readback_sha256:
        description: Exact current readback SHA from recovery
        required: true
        type: string
      expected_bad_href_url_count:
        description: Exact locale-unsafe-href URL count from recovery
        required: true
        type: string
      expected_low_module_url_count:
        description: Exact thin-module URL count from recovery
        required: true
        type: string
      preflight_run_id:
        description: Execute only; exact successful resume preflight run
        required: false
        default: ""
        type: string
      preflight_run_attempt:
        description: Execute only; exact successful resume preflight attempt
        required: false
        default: ""
        type: string
      expected_preflight_state_sha256:
        description: Execute only; exact resume preflight state SHA
        required: false
        default: ""
        type: string
      expected_resume_target_set_sha256:
        description: Execute only; exact residual target-set SHA
        required: false
        default: ""
        type: string
      expected_resume_target_count:
        description: Execute only; exact residual target count
        required: false
        default: ""
        type: string
      expected_resume_batch_count:
        description: Execute only; exact bounded batch count
        required: false
        default: ""
        type: string
      operator_approval_phrase:
        description: Exact mode-specific operator phrase
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-${{ github.repository }}-production
  cancel-in-progress: false

jobs:
  eligibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.validate.outputs.mode }}
      control_plane_sha: ${{ steps.validate.outputs.control_plane_sha }}
      release_sha: ${{ steps.validate.outputs.release_sha }}
      release_name: ${{ steps.validate.outputs.release_name }}
      failed_run_id: ${{ steps.validate.outputs.failed_run_id }}
      failed_run_attempt: ${{ steps.validate.outputs.failed_run_attempt }}
      failed_receipt_sha256: ${{ steps.validate.outputs.failed_receipt_sha256 }}
      recovery_run_id: ${{ steps.validate.outputs.recovery_run_id }}
      recovery_run_attempt: ${{ steps.validate.outputs.recovery_run_attempt }}
      recovery_receipt_sha256: ${{ steps.validate.outputs.recovery_receipt_sha256 }}
      recovery_payload_set_sha256: ${{ steps.validate.outputs.recovery_payload_set_sha256 }}
      manifest_sha256: ${{ steps.validate.outputs.manifest_sha256 }}
      recovery_readback_sha256: ${{ steps.validate.outputs.recovery_readback_sha256 }}
      bad_href_url_count: ${{ steps.validate.outputs.bad_href_url_count }}
      low_module_url_count: ${{ steps.validate.outputs.low_module_url_count }}
      preflight_state_sha256: ${{ steps.validate.outputs.preflight_state_sha256 }}
      resume_target_set_sha256: ${{ steps.validate.outputs.resume_target_set_sha256 }}
      resume_target_count: ${{ steps.validate.outputs.resume_target_count }}
      resume_batch_count: ${{ steps.validate.outputs.resume_batch_count }}
    steps:
      - name: Checkout exact resume control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.expected_control_plane_sha }}
          fetch-depth: 0

      - name: Bind latest main, recovery receipt, and exact mode authorization
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          EXPECTED_CONTROL_PLANE_SHA: ${{ inputs.expected_control_plane_sha }}
          EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
          EXPECTED_RELEASE_NAME: ${{ inputs.expected_release_name }}
          FAILED_RUN_ID: ${{ inputs.failed_run_id }}
          FAILED_RUN_ATTEMPT: ${{ inputs.failed_run_attempt }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
          RECOVERY_RUN_ATTEMPT: ${{ inputs.recovery_run_attempt }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.expected_manifest_sha256 }}
          EXPECTED_RECOVERY_READBACK_SHA256: ${{ inputs.expected_recovery_readback_sha256 }}
          EXPECTED_BAD_HREF_URL_COUNT: ${{ inputs.expected_bad_href_url_count }}
          EXPECTED_LOW_MODULE_URL_COUNT: ${{ inputs.expected_low_module_url_count }}
          PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
          PREFLIGHT_RUN_ATTEMPT: ${{ inputs.preflight_run_attempt }}
          EXPECTED_PREFLIGHT_STATE_SHA256: ${{ inputs.expected_preflight_state_sha256 }}
          EXPECTED_RESUME_TARGET_SET_SHA256: ${{ inputs.expected_resume_target_set_sha256 }}
          EXPECTED_RESUME_TARGET_COUNT: ${{ inputs.expected_resume_target_count }}
          EXPECTED_RESUME_BATCH_COUNT: ${{ inputs.expected_resume_batch_count }}
          OPERATOR_APPROVAL_PHRASE: ${{ inputs.operator_approval_phrase }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$MODE" == "preflight" || "$MODE" == "execute" ]]
          [[ "$EXPECTED_CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_RELEASE_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          [[ "$FAILED_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$FAILED_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$RECOVERY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RECOVERY_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_RECOVERY_READBACK_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_BAD_HREF_URL_COUNT" =~ ^[1-9][0-9]{0,2}$ ]]
          [[ "$EXPECTED_LOW_MODULE_URL_COUNT" =~ ^(0|[1-9][0-9]{0,2})$ ]]
          test "$EXPECTED_BAD_HREF_URL_COUNT" -le 100
          test "$EXPECTED_LOW_MODULE_URL_COUNT" -le 100

          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_CONTROL_PLANE_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_CONTROL_PLANE_SHA"
          git merge-base --is-ancestor "$EXPECTED_RELEASE_SHA" origin/main

          recovery_run="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RECOVERY_RUN_ID}"
          )"
          jq -e \
            --argjson attempt "$RECOVERY_RUN_ATTEMPT" \
            '.name == "Career Search Entry Batch Cache Refresh Recovery Preflight"
             and .path == ".github/workflows/career-search-entry-batch-cache-refresh-recovery-preflight.yml"
             and .event == "workflow_dispatch"
             and .status == "completed"
             and .conclusion == "success"
             and .head_branch == "main"
             and .run_attempt == $attempt' <<<"$recovery_run" >/dev/null

          receipt_dir="$(mktemp -d)"
          gh run download "$RECOVERY_RUN_ID" \
            --name "career-search-entry-batch-cache-refresh-recovery-preflight-${RECOVERY_RUN_ID}-${RECOVERY_RUN_ATTEMPT}" \
            --dir "$receipt_dir"
          recovery_receipt="$receipt_dir/career-search-entry-batch-cache-refresh-recovery-preflight.json"
          recovery_receipt_sha256="$(sha256sum "$recovery_receipt" | awk '{print $1}')"
          failed_receipt_sha256="$(jq -er '.failed_receipt_sha256' "$recovery_receipt")"
          recovery_payload_set_sha256="$(jq -er '.current_payload_set_sha256' "$recovery_receipt")"
          jq -e \
            --arg release "$EXPECTED_RELEASE_SHA" \
            --arg release_name "$EXPECTED_RELEASE_NAME" \
            --arg manifest "$EXPECTED_MANIFEST_SHA256" \
            --arg readback "$EXPECTED_RECOVERY_READBACK_SHA256" \
            --argjson failed_run "$FAILED_RUN_ID" \
            --argjson failed_attempt "$FAILED_RUN_ATTEMPT" \
            --argjson recovery_run "$RECOVERY_RUN_ID" \
            --argjson recovery_attempt "$RECOVERY_RUN_ATTEMPT" \
            --argjson bad_href "$EXPECTED_BAD_HREF_URL_COUNT" \
            --argjson low_module "$EXPECTED_LOW_MODULE_URL_COUNT" \
            '.contract_version == "career.search_entry_batch.cache_refresh.recovery_preflight.v1"
             and .status == "PASS_RECOVERY_RESUME_REQUIRED"
             and .release_sha == $release
             and .release_name == $release_name
             and .failed_run_id == $failed_run
             and .failed_run_attempt == $failed_attempt
             and .workflow_run_id == $recovery_run
             and .workflow_run_attempt == $recovery_attempt
             and .manifest_sha256 == $manifest
             and .current_readback_sha256 == $readback
             and .bad_href_url_count == $bad_href
             and .low_module_url_count == $low_module
             and (.failed_receipt_sha256 | test("^[0-9a-f]{64}$"))
             and (.current_payload_set_sha256 | test("^[0-9a-f]{64}$"))
             and .candidate_count == 50
             and .bilingual_url_count == 100
             and .write_state == "none"
             and .production_write_execution == false
             and .recovery_action_authorized == false
             and .retry_execution_count == 0
             and .cache_refresh_target_count == 0
             and .database_write_count == 0
             and .cms_write_count == 0
             and .publication_write_count == 0
             and .indexability_write_count == 0
             and .queue_dispatch_count == 0
             and .sitemap_write_count == 0
             and .llms_write_count == 0
             and .search_channel_action_count == 0
             and .url_submission_count == 0
             and .non_target_write_count == 0
             and .deploy_count == 0
             and .rollback_count == 0' "$recovery_receipt" >/dev/null

          later_refresh="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/career-search-entry-batch-cache-refresh-production-ops.yml/runs?event=workflow_dispatch&per_page=100"
          )"
          jq -e \
            --argjson failed_run "$FAILED_RUN_ID" \
            '[.workflow_runs[] | select(.id > $failed_run)] | length == 0' \
            <<<"$later_refresh" >/dev/null
          later_recovery="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/career-search-entry-batch-cache-refresh-recovery-preflight.yml/runs?event=workflow_dispatch&per_page=100"
          )"
          jq -e \
            --argjson recovery_run "$RECOVERY_RUN_ID" \
            '[.workflow_runs[] | select(.id > $recovery_run)] | length == 0' \
            <<<"$later_recovery" >/dev/null

          preflight_state=""
          target_set=""
          target_count=""
          batch_count=""
          if [ "$MODE" = "preflight" ]; then
            test -z "$PREFLIGHT_RUN_ID"
            test -z "$PREFLIGHT_RUN_ATTEMPT"
            test -z "$EXPECTED_PREFLIGHT_STATE_SHA256"
            test -z "$EXPECTED_RESUME_TARGET_SET_SHA256"
            test -z "$EXPECTED_RESUME_TARGET_COUNT"
            test -z "$EXPECTED_RESUME_BATCH_COUNT"
            expected_phrase="I explicitly approve one fresh read-only Career search-entry cache-only resume preflight for failed run ${FAILED_RUN_ID} attempt ${FAILED_RUN_ATTEMPT}, recovery run ${RECOVERY_RUN_ID} attempt ${RECOVERY_RUN_ATTEMPT}, active SHA ${EXPECTED_RELEASE_SHA}, manifest ${EXPECTED_MANIFEST_SHA256}, current readback ${EXPECTED_RECOVERY_READBACK_SHA256}, with ${EXPECTED_BAD_HREF_URL_COUNT} locale-unsafe-href URLs and ${EXPECTED_LOW_MODULE_URL_COUNT} thin-module URLs; diagnose and plan only, with zero cache write, retry, rollback, deploy, or Search Channel operation."
            test "$OPERATOR_APPROVAL_PHRASE" = "$expected_phrase"
          else
            [[ "$PREFLIGHT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$PREFLIGHT_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
            [[ "$EXPECTED_PREFLIGHT_STATE_SHA256" =~ ^[0-9a-f]{64}$ ]]
            [[ "$EXPECTED_RESUME_TARGET_SET_SHA256" =~ ^[0-9a-f]{64}$ ]]
            [[ "$EXPECTED_RESUME_TARGET_COUNT" =~ ^[1-9][0-9]{0,2}$ ]]
            [[ "$EXPECTED_RESUME_BATCH_COUNT" =~ ^[1-9][0-9]{0,2}$ ]]
            preflight_run="$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREFLIGHT_RUN_ID}"
            )"
            jq -e \
              --arg control "$EXPECTED_CONTROL_PLANE_SHA" \
              --argjson attempt "$PREFLIGHT_RUN_ATTEMPT" \
              '.name == "Career Search Entry Batch Cache Refresh Resume"
               and .path == ".github/workflows/career-search-entry-batch-cache-refresh-resume.yml"
               and .event == "workflow_dispatch"
               and .status == "completed"
               and .conclusion == "success"
               and .head_branch == "main"
               and .head_sha == $control
               and .run_attempt == $attempt' <<<"$preflight_run" >/dev/null
            preflight_dir="$(mktemp -d)"
            gh run download "$PREFLIGHT_RUN_ID" \
              --name "career-search-entry-batch-cache-refresh-resume-preflight-${PREFLIGHT_RUN_ID}-${PREFLIGHT_RUN_ATTEMPT}" \
              --dir "$preflight_dir"
            preflight_receipt="$preflight_dir/career-search-entry-batch-cache-refresh-resume.json"
            jq -e \
              --arg release "$EXPECTED_RELEASE_SHA" \
              --arg release_name "$EXPECTED_RELEASE_NAME" \
              --arg manifest "$EXPECTED_MANIFEST_SHA256" \
              --arg recovery_receipt "$recovery_receipt_sha256" \
              --arg state "$EXPECTED_PREFLIGHT_STATE_SHA256" \
              --arg targets "$EXPECTED_RESUME_TARGET_SET_SHA256" \
              --argjson target_count "$EXPECTED_RESUME_TARGET_COUNT" \
              --argjson batch_count "$EXPECTED_RESUME_BATCH_COUNT" \
              '.contract_version == "career.search_entry_batch.cache_refresh.resume.v1"
               and .mode == "preflight"
               and .status == "PASS_PREFLIGHT_RESUME_REQUIRED"
               and .release_sha == $release
               and .release_name == $release_name
               and .manifest_sha256 == $manifest
               and .recovery_receipt_sha256 == $recovery_receipt
               and .preflight_state_sha256 == $state
               and .resume_target_set_sha256 == $targets
               and .resume_target_count == $target_count
               and .resume_batch_count == $batch_count
               and .max_batch_target_count == 10
               and .max_batch_slug_count == 5
               and .offline_build_budget_ms == 5000
               and .per_target_retry_limit == 0
               and .write_state == "none"
               and .production_write_execution == false
               and .cache_refresh_target_count == 0
               and .database_write_count == 0
               and .queue_dispatch_count == 0
               and .deploy_count == 0
               and .rollback_count == 0' "$preflight_receipt" >/dev/null
            expected_phrase="$(jq -er '.exact_resume_execute_approval_phrase' "$preflight_receipt")"
            test "$OPERATOR_APPROVAL_PHRASE" = "$expected_phrase"
            later_resume="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/career-search-entry-batch-cache-refresh-resume.yml/runs?event=workflow_dispatch&per_page=100"
            )"
            jq -e \
              --argjson preflight_run "$PREFLIGHT_RUN_ID" \
              --argjson current_run "$GITHUB_RUN_ID" \
              '[.workflow_runs[] | select(.id > $preflight_run and .id != $current_run)] | length == 0' \
              <<<"$later_resume" >/dev/null
            preflight_state="$EXPECTED_PREFLIGHT_STATE_SHA256"
            target_set="$EXPECTED_RESUME_TARGET_SET_SHA256"
            target_count="$EXPECTED_RESUME_TARGET_COUNT"
            batch_count="$EXPECTED_RESUME_BATCH_COUNT"
          fi

          {
            echo "mode=$MODE"
            echo "control_plane_sha=$EXPECTED_CONTROL_PLANE_SHA"
            echo "release_sha=$EXPECTED_RELEASE_SHA"
            echo "release_name=$EXPECTED_RELEASE_NAME"
            echo "failed_run_id=$FAILED_RUN_ID"
            echo "failed_run_attempt=$FAILED_RUN_ATTEMPT"
            echo "failed_receipt_sha256=$failed_receipt_sha256"
            echo "recovery_run_id=$RECOVERY_RUN_ID"
            echo "recovery_run_attempt=$RECOVERY_RUN_ATTEMPT"
            echo "recovery_receipt_sha256=$recovery_receipt_sha256"
            echo "recovery_payload_set_sha256=$recovery_payload_set_sha256"
            echo "manifest_sha256=$EXPECTED_MANIFEST_SHA256"
            echo "recovery_readback_sha256=$EXPECTED_RECOVERY_READBACK_SHA256"
            echo "bad_href_url_count=$EXPECTED_BAD_HREF_URL_COUNT"
            echo "low_module_url_count=$EXPECTED_LOW_MODULE_URL_COUNT"
            echo "preflight_state_sha256=$preflight_state"
            echo "resume_target_set_sha256=$target_set"
            echo "resume_target_count=$target_count"
            echo "resume_batch_count=$batch_count"
          } >> "$GITHUB_OUTPUT"

  operate:
    needs: eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
      DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
      RETIRED_DEPLOY_HOST: ${{ secrets.PRODUCTION_RETIRED_DEPLOY_HOST }}
      DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
      MODE: ${{ needs.eligibility.outputs.mode }}
      CONTROL_PLANE_SHA: ${{ needs.eligibility.outputs.control_plane_sha }}
      EXPECTED_RELEASE_SHA: ${{ needs.eligibility.outputs.release_sha }}
      EXPECTED_RELEASE_NAME: ${{ needs.eligibility.outputs.release_name }}
      FAILED_RUN_ID: ${{ needs.eligibility.outputs.failed_run_id }}
      FAILED_RUN_ATTEMPT: ${{ needs.eligibility.outputs.failed_run_attempt }}
      FAILED_RECEIPT_SHA256: ${{ needs.eligibility.outputs.failed_receipt_sha256 }}
      RECOVERY_RUN_ID: ${{ needs.eligibility.outputs.recovery_run_id }}
      RECOVERY_RUN_ATTEMPT: ${{ needs.eligibility.outputs.recovery_run_attempt }}
      RECOVERY_RECEIPT_SHA256: ${{ needs.eligibility.outputs.recovery_receipt_sha256 }}
      EXPECTED_RECOVERY_PAYLOAD_SET_SHA256: ${{ needs.eligibility.outputs.recovery_payload_set_sha256 }}
      EXPECTED_MANIFEST_SHA256: ${{ needs.eligibility.outputs.manifest_sha256 }}
      EXPECTED_BAD_HREF_URL_COUNT: ${{ needs.eligibility.outputs.bad_href_url_count }}
      EXPECTED_LOW_MODULE_URL_COUNT: ${{ needs.eligibility.outputs.low_module_url_count }}
      EXPECTED_PREFLIGHT_STATE_SHA256: ${{ needs.eligibility.outputs.preflight_state_sha256 }}
      EXPECTED_RESUME_TARGET_SET_SHA256: ${{ needs.eligibility.outputs.resume_target_set_sha256 }}
      EXPECTED_RESUME_TARGET_COUNT: ${{ needs.eligibility.outputs.resume_target_count }}
      EXPECTED_RESUME_BATCH_COUNT: ${{ needs.eligibility.outputs.resume_batch_count }}
    steps:
      - name: Checkout exact resume control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.eligibility.outputs.control_plane_sha }}
          fetch-depth: 1

      - name: Validate protected production topology
        shell: bash
        run: |
          set -euo pipefail
          for name in DEPLOY_USER DEPLOY_PORT DEPLOY_HOST RETIRED_DEPLOY_HOST DEPLOY_PATH; do
            test -n "${!name:-}"
          done
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          test "$DEPLOY_PORT" -ge 1
          test "$DEPLOY_PORT" -le 65535
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$RETIRED_DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          test "$DEPLOY_HOST" != "$RETIRED_DEPLOY_HOST"
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_PATH" != *".."* ]]
          echo "Protected production topology validated without disclosing values."

      - name: Set up SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known hosts
        shell: bash
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null \
            || ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f ~/.ssh/known_hosts >/dev/null

      - name: Run exact bounded resume phase against unchanged active release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          runner="backend/scripts/career/career_search_entry_batch_cache_refresh_resume.php"
          runner_sha256="$(sha256sum "$runner" | awk '{print $1}')"
          for variable in \
            MODE DEPLOY_PATH EXPECTED_RELEASE_SHA EXPECTED_RELEASE_NAME \
            EXPECTED_MANIFEST_SHA256 EXPECTED_RECOVERY_PAYLOAD_SET_SHA256 \
            EXPECTED_BAD_HREF_URL_COUNT EXPECTED_LOW_MODULE_URL_COUNT \
            EXPECTED_PREFLIGHT_STATE_SHA256 EXPECTED_RESUME_TARGET_SET_SHA256 \
            EXPECTED_RESUME_TARGET_COUNT EXPECTED_RESUME_BATCH_COUNT; do
            printf -v "q_${variable}" '%q' "${!variable}"
          done
          set +e
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -o ServerAliveInterval=20 -o ServerAliveCountMax=30 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "CAREER_CACHE_RESUME_MODE=$q_MODE DEPLOY_PATH=$q_DEPLOY_PATH EXPECTED_RELEASE_SHA=$q_EXPECTED_RELEASE_SHA EXPECTED_RELEASE_NAME=$q_EXPECTED_RELEASE_NAME EXPECTED_MANIFEST_SHA256=$q_EXPECTED_MANIFEST_SHA256 EXPECTED_RECOVERY_PAYLOAD_SET_SHA256=$q_EXPECTED_RECOVERY_PAYLOAD_SET_SHA256 EXPECTED_BAD_HREF_URL_COUNT=$q_EXPECTED_BAD_HREF_URL_COUNT EXPECTED_LOW_MODULE_URL_COUNT=$q_EXPECTED_LOW_MODULE_URL_COUNT EXPECTED_PREFLIGHT_STATE_SHA256=$q_EXPECTED_PREFLIGHT_STATE_SHA256 EXPECTED_RESUME_TARGET_SET_SHA256=$q_EXPECTED_RESUME_TARGET_SET_SHA256 EXPECTED_RESUME_TARGET_COUNT=$q_EXPECTED_RESUME_TARGET_COUNT EXPECTED_RESUME_BATCH_COUNT=$q_EXPECTED_RESUME_BATCH_COUNT php" \
            < "$runner" > artifacts/remote-receipt.json
          remote_status=$?
          set -e
          jq \
            --arg control "$CONTROL_PLANE_SHA" \
            --arg runner "$runner_sha256" \
            --arg failed_receipt "$FAILED_RECEIPT_SHA256" \
            --arg recovery_receipt "$RECOVERY_RECEIPT_SHA256" \
            --argjson failed_run "$FAILED_RUN_ID" \
            --argjson failed_attempt "$FAILED_RUN_ATTEMPT" \
            --argjson recovery_run "$RECOVERY_RUN_ID" \
            --argjson recovery_attempt "$RECOVERY_RUN_ATTEMPT" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            '. + {
              control_plane_sha: $control,
              runner_sha256: $runner,
              failed_run_id: $failed_run,
              failed_run_attempt: $failed_attempt,
              failed_receipt_sha256: $failed_receipt,
              recovery_run_id: $recovery_run,
              recovery_run_attempt: $recovery_attempt,
              recovery_receipt_sha256: $recovery_receipt,
              workflow_run_id: $run_id,
              workflow_run_attempt: $run_attempt
            }' artifacts/remote-receipt.json \
            > artifacts/career-search-entry-batch-cache-refresh-resume.json

          if [ "$remote_status" -eq 0 ] && [ "$MODE" = "preflight" ]; then
            state="$(jq -er '.preflight_state_sha256' artifacts/career-search-entry-batch-cache-refresh-resume.json)"
            targets="$(jq -er '.resume_target_set_sha256' artifacts/career-search-entry-batch-cache-refresh-resume.json)"
            target_count="$(jq -er '.resume_target_count' artifacts/career-search-entry-batch-cache-refresh-resume.json)"
            batch_count="$(jq -er '.resume_batch_count' artifacts/career-search-entry-batch-cache-refresh-resume.json)"
            phrase="I explicitly approve one-time Career search-entry cache-only resume execute for failed run ${FAILED_RUN_ID} attempt ${FAILED_RUN_ATTEMPT}, recovery run ${RECOVERY_RUN_ID} attempt ${RECOVERY_RUN_ATTEMPT}, preflight run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}, active SHA ${EXPECTED_RELEASE_SHA}, manifest ${EXPECTED_MANIFEST_SHA256}, state ${state}, target set ${targets}; refresh exactly ${target_count} residual targets in ${batch_count} batches of at most 5 slugs and 10 URLs using the 5000ms offline build budget and zero per-target retry, then require exact quality-package and 100-URL readback, with no DB, CMS, publication, indexability, queue, sitemap, llms, Search Channel, URL submission, deploy, rollback, or non-target write."
            jq --arg phrase "$phrase" \
              '. + {exact_resume_execute_approval_phrase: $phrase}' \
              artifacts/career-search-entry-batch-cache-refresh-resume.json \
              > artifacts/final.json
            mv artifacts/final.json artifacts/career-search-entry-batch-cache-refresh-resume.json
          fi
          test "$remote_status" -eq 0

      - name: Upload sanitized immutable resume receipt
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: career-search-entry-batch-cache-refresh-resume-${{ needs.eligibility.outputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/career-search-entry-batch-cache-refresh-resume.json
          if-no-files-found: error
          retention-days: 90
