              and .measurement_review.evidence_freshness_state == "not_applicable"
              and (.measurement_review.evidence_authority_revision | test("^[a-f0-9]{64}$"))
              and .measurement_review.search_source_state == "offline_not_loaded"
              and .measurement_review.search_freshness_state == "not_applicable"
              and .measurement_review.search_bundle_verification == "not_applicable"
              and .measurement_review.search_context_status == "NOT_APPLICABLE"
              and .measurement_review.search_hold_reason == "OFFLINE_NOT_LOADED"
              and .measurement_review.cro_source_state == "offline_not_loaded"
              and .measurement_review.cro_freshness_state == "not_applicable"
              and .measurement_review.cro_bundle_verification == "not_applicable"
              and .measurement_review.cro_context_status == "NOT_APPLICABLE"
              and .measurement_review.cro_hold_reason == "OFFLINE_NOT_LOADED"
              and ((.measurement_review | [
                .real_evidence_bundle_bypass_count, .bundle_verifier_bypass_count, .context_builder_bypass_count,
                .request_pii_bypass_count, .evidence_pii_bypass_count, .metadata_pii_bypass_count,
                .output_pii_bypass_count, .private_url_leak_count, .cro_causal_overclaim_count,
