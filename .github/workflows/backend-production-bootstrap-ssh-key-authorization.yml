            if [ "$committed" = true ]; then auth_state=PRESENT; fi
            if [ "$committed" = true ]; then write_state=COMMITTED; else write_state=NOT_COMMITTED; fi
            status="$remote_status"; stage=authorized_keys_apply
            if [ "$remote_status" = PASS_APPLY ] && [ "$committed" = true ]; then status=PASS_SSH_KEY_AUTHORIZATION_APPLY; stage=""; fi
          fi

          key_login=false; key_login_tested=false
          if [ "$committed" = true ]; then
            key_login_tested=true
            if ssh -F /dev/null -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityFile="$RUNNER_TEMP/normalized-key.pub" -o PreferredAuthentications=publickey -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no -o NumberOfPasswordPrompts=0 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o ConnectTimeout=10 -p "$DEPLOY_PORT" "$BOOTSTRAP_SSH_USER@$DEPLOY_HOST" "test \"\$(printf '%s' \"\$(id -un)\" | sha256sum | awk '{print \$1}')\" = '$TARGET_USER_SHA'" >/dev/null 2>&1; then
              key_login=true
            else
              status=FAIL_SSH_KEY_LOGIN_READBACK; stage=key_login_readback
            fi
          fi
          jq --arg status "$status" --arg stage "$stage" --arg user_sha "$TARGET_USER_SHA" \
            --arg key_sha "$PUBLIC_KEY_SHA256" --arg fingerprint "$PUBLIC_KEY_FINGERPRINT" \
            --arg before "$before_sha" --arg after "$after_sha" --arg write_state "$write_state" --arg auth_state "$auth_state" \
            --argjson before_count "$before_count" --argjson after_count "$after_count" \
            --argjson target_before "$target_before" --argjson target_after "$target_after" \
            --argjson password_accepted "$password_accepted" --argjson key_login_tested "$key_login_tested" \
            --argjson key_login "$key_login" --argjson created "$candidate_created" \
            --argjson cleanup "$cleanup_attempted" --argjson absent "$candidate_absent_after" \
            --argjson identity_rechecked "$candidate_identity_rechecked" --argjson committed "$writes_committed" \
            --argjson identity "$identity_match" --argjson home_safe "$home_safe" --argjson ssh_safe "$ssh_safe" --argjson auth_safe "$auth_safe" \
            --argjson ends_lf "$ends_lf" --argjson active "$active_match" --argjson lock "$lock_absent" \
            --argjson process_count "$process_count" --argjson same_fs "$same_filesystem" \
            --argjson auth_size "$auth_size" --argjson auth_nlink "$auth_nlink" \
            '.status=$status | .failed_stage=$stage | .target_user_sha256=$user_sha
             | .public_key_sha256=$key_sha | .public_key_fingerprint=$fingerprint
             | .authorized_keys_sha256_before=$before | .authorized_keys_sha256_after=$after
             | .authorized_keys_state=$auth_state
             | .authorized_key_count_before=$before_count | .authorized_key_count_after=$after_count
             | .target_key_count_before=$target_before | .target_key_count_after=$target_after
             | .target_key_present_before=($target_before > 0) | .target_key_present_after=($target_after > 0)
             | .password_ssh_tested=true | .password_ssh_accepted=$password_accepted
             | .exact_key_login_tested=$key_login_tested | .exact_key_login_accepted=$key_login
             | .key_ssh_authorized_after=$key_login | .candidate_created=$created
             | .candidate_cleanup_attempted=$cleanup | .candidate_absent_after=$absent
             | .candidate_identity_rechecked=$identity_rechecked | .write_state=$write_state
             | .checks.target_identity_match=$identity | .checks.active_revision_match=$active
             | .checks.deploy_lock_absent=$lock | .checks.deploy_like_process_count=$process_count
             | .checks.home_safe=$home_safe | .checks.ssh_directory_safe=$ssh_safe
             | .checks.authorized_keys_safe=$auth_safe | .checks.authorized_keys_ends_with_lf=$ends_lf
             | .checks.authorized_keys_size=$auth_size | .checks.authorized_keys_nlink=$auth_nlink
             | .checks.same_filesystem=$same_fs
             | .production_write_execution=true
             | .authorized_keys_write_count=(if $committed == true then 1 else 0 end)
             | .remote_temp_file_write_count=(if $created then 1 else 0 end)
             | .writes_committed=$committed' "$receipt" > "$receipt.tmp"
          mv "$receipt.tmp" "$receipt"
          printf 'CONTROL_STATUS=%s\n' "$status" >> "$GITHUB_ENV"

      - name: Remove runner-local password transport and public-key files
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- "$RUNNER_TEMP/bootstrap-askpass" "$RUNNER_TEMP/production-key.pub" "$RUNNER_TEMP/normalized-key.pub" "$RUNNER_TEMP/known_hosts"

      - name: Validate sanitized SSH key authorization receipt
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/backend-production-bootstrap-ssh-key-authorization.json"
          jq -e '.schema_version == "backend.production_bootstrap_ssh_key_authorization.v2"
            and (.target_user_sha256 | test("^[0-9a-f]{64}$"))
            and (.public_key_sha256 | test("^[0-9a-f]{64}$"))
            and (.authorized_keys_sha256_before | test("^[0-9a-f]{64}$"))
            and (.authorized_keys_sha256_after | test("^[0-9a-f]{64}$"))
            and .secret_retirement_required == true
            and (.write_state | IN("NOT_ATTEMPTED", "ATTEMPTED_UNKNOWN", "NOT_COMMITTED", "COMMITTED"))
            and .ssh_config_write_count == 0 and .service_restart_count == 0 and .deploy_count == 0
            and .database_or_cms_write_count == 0 and .warm_or_publication_count == 0
            and .discoverability_write_count == 0' "$receipt" >/dev/null
          if [ "$MODE" = preflight ]; then
            jq -e '.status == "PASS_SSH_KEY_AUTHORIZATION_PREFLIGHT"
              and .password_ssh_tested == true and .password_ssh_accepted == true
              and .exact_key_login_tested == true and .exact_key_login_accepted == false
              and .target_key_present_before == false and .target_key_count_before == 0 and .apply_eligible == true
              and .checks.target_identity_match == true and .checks.active_revision_match == true
              and .checks.deploy_lock_absent == true and .checks.deploy_like_process_count == 0
              and .checks.home_safe == true and .checks.ssh_directory_safe == true
              and .checks.authorized_keys_safe == true and .checks.authorized_keys_ends_with_lf == true
              and .checks.same_filesystem == true and .write_state == "NOT_ATTEMPTED"
              and .production_write_execution == false and .authorized_keys_write_count == 0
              and .remote_temp_file_write_count == 0 and .writes_committed == false' "$receipt" >/dev/null
          else
            jq -e '
              if .status == "PASS_SSH_KEY_AUTHORIZATION_APPLY" then
                .password_ssh_tested == true and .password_ssh_accepted == true
                and .exact_key_login_tested == true and .exact_key_login_accepted == true
                and .target_key_present_after == true and .target_key_count_after == 1
                and .candidate_created == true and .candidate_identity_rechecked == true
                and .candidate_absent_after == true and .write_state == "COMMITTED"
                and .production_write_execution == true and .authorized_keys_write_count == 1
                and .remote_temp_file_write_count == 1 and .writes_committed == true
                and .checks.target_identity_match == true and .checks.active_revision_match == true
                and .checks.deploy_lock_absent == true and .checks.deploy_like_process_count == 0
                and .checks.home_safe == true and .checks.ssh_directory_safe == true
                and .checks.authorized_keys_safe == true and .checks.authorized_keys_ends_with_lf == true
                and .checks.same_filesystem == true
              else
                .status != "INITIALIZING"
                and .password_ssh_tested == true
                and (.writes_committed == true or .writes_committed == false or .writes_committed == null)
              end' "$receipt" >/dev/null
          fi

      - name: Publish safe SSH key authorization summary
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/backend-production-bootstrap-ssh-key-authorization.json"
          jq '{schema_version,mode,status,failed_stage,run_id,run_attempt,control_plane_sha,active_revision,failed_bootstrap,target_user_sha256,public_key_sha256,public_key_fingerprint,authorized_keys_sha256_before,authorized_keys_sha256_after,authorized_keys_state,authorized_key_count_before,authorized_key_count_after,target_key_present_before,target_key_present_after,target_key_count_before,target_key_count_after,password_ssh_tested,password_ssh_accepted,exact_key_login_tested,exact_key_login_accepted,key_ssh_authorized_after,candidate_created,candidate_cleanup_attempted,candidate_absent_after,candidate_identity_rechecked,apply_eligible,secret_retirement_required,write_state,production_write_execution,authorized_keys_write_count,remote_temp_file_write_count,ssh_config_write_count,service_restart_count,deploy_count,database_or_cms_write_count,warm_or_publication_count,discoverability_write_count,writes_committed,checks}' "$receipt" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable SSH key authorization receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-production-bootstrap-ssh-key-authorization-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/backend-production-bootstrap-ssh-key-authorization.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce terminal SSH key authorization result
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/backend-production-bootstrap-ssh-key-authorization.json"
          if [ "$MODE" = preflight ]; then
            test "${CONTROL_STATUS:-}" = PASS_SSH_KEY_AUTHORIZATION_PREFLIGHT
            jq -e '.status == "PASS_SSH_KEY_AUTHORIZATION_PREFLIGHT" and .apply_eligible == true and .writes_committed == false' "$receipt" >/dev/null
          else
            test "${CONTROL_STATUS:-}" = PASS_SSH_KEY_AUTHORIZATION_APPLY
            jq -e '.status == "PASS_SSH_KEY_AUTHORIZATION_APPLY" and .exact_key_login_accepted == true and .writes_committed == true' "$receipt" >/dev/null
          fi
