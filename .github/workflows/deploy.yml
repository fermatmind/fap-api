name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  attestations: read
  contents: read

concurrency:
  group: trunk-deploy-${{ github.repository }}
  cancel-in-progress: false

env:
  DEPLOYER_VERSION: "7.5.12"
  DEPLOYER_SHA256: "b55c6609653e888c672d327c407f8bba6324b9c9cc24f9dcfb3f4b3922760632"
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  policy:
    name: Bind successful main CI receipt
    if: >-
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.receipt.outputs.deploy }}
      classification: ${{ steps.receipt.outputs.classification }}
      artifact_digest: ${{ steps.artifact.outputs.digest }}
      config_fingerprint: ${{ steps.receipt.outputs.config_fingerprint }}
      career_current: ${{ steps.receipt.outputs.career_current }}
      career_current_full_scan: ${{ steps.receipt.outputs.career_current_full_scan }}
      career_current_assets_sha256: ${{ steps.career-current.outputs.assets_sha256 }}
      career_current_operation_key: ${{ steps.career-current.outputs.operation_key }}
      mbti_zh_result_release: ${{ steps.receipt.outputs.mbti_zh_result_release }}
      mbti_zh_result_package_hash: ${{ steps.mbti-zh-result.outputs.package_hash }}
      mbti_zh_result_actor: ${{ steps.mbti-zh-result.outputs.actor }}
      mbti_zh_result_operation_key: ${{ steps.mbti-zh-result.outputs.operation_key }}
    steps:
      - name: Refuse non-main, PR, failed, or ambiguous CI runs
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CI_EVENT: ${{ github.event.workflow_run.event }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$CI_RUN_ATTEMPT" = 1
          test "$HEAD_BRANCH" = main
          test "$CI_EVENT" = push
          test "$CI_CONCLUSION" = success
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
      - id: artifact
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        with:
          script: |
            const runId = Number(process.env.CI_RUN_ID);
            const expected = `trunk-validation-${process.env.DEPLOY_SHA}`;
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner, repo: context.repo.repo, run_id: runId, per_page: 100,
            });
            const matches = data.artifacts.filter((artifact) => artifact.name === expected && !artifact.expired);
            if (matches.length !== 1) return core.setFailed(`Expected one ${expected} artifact; found ${matches.length}`);
            if (!/^sha256:[0-9a-f]{64}$/.test(String(matches[0].digest || ""))) return core.setFailed("Validation artifact digest is missing");
            core.setOutput("id", String(matches[0].id));
            core.setOutput("digest", matches[0].digest);
      - id: receipt
        name: Verify exact-SHA receipt bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.id }}
          EXPECTED_DIGEST: ${{ steps.artifact.outputs.digest }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/validation.zip"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" -o "$zip"
          test "sha256:$(sha256sum "$zip" | awk '{print $1}')" = "$EXPECTED_DIGEST"
          unzip -q "$zip" -d "$RUNNER_TEMP/validation"
          receipt="$RUNNER_TEMP/validation/trunk-validation.json"
          jq -e --arg sha "$DEPLOY_SHA" --arg run "$CI_RUN_ID" \
            '.schema_version == "fermatmind.trunk-validation.v1" and .sha == $sha and .ci_run_id == $run and .result == "success"' \
            "$receipt" >/dev/null
          classification="$(jq -c .classification "$receipt")"
          career_current="$(jq -r '[.classification.paths[] | select(startswith("backend/content_assets/career/current/") or . == "backend/app/Domain/Career/Display/CareerCurrentAuthorityPackage.php" or . == "backend/app/Domain/Career/Display/CareerCurrentAuthorityPublisher.php" or . == "backend/scripts/operations/career_current_authority_publish.php")] | length > 0' "$receipt")"
          career_current_full_scan="$(jq -r '[.classification.paths[] | select(startswith("backend/content_assets/career/current/") or . == "backend/app/Domain/Career/Display/CareerCurrentAuthorityPackage.php" or . == "backend/app/Domain/Career/Display/CareerCurrentAuthorityPublisher.php" or . == "backend/scripts/operations/career_current_authority_publish.php")] | length > 0' "$receipt")"
          mbti_zh_result_release="$(jq -r '.classification.operations.mbti_zh_result_authority_release == true' "$receipt")"
          {
            echo "deploy=$(jq -r .classification.deploy "$receipt")"
            echo "classification=$classification"
            echo "config_fingerprint=$(sha256sum "$receipt" | awk '{print $1}')"
            echo "career_current=$career_current"
            echo "career_current_full_scan=$career_current_full_scan"
            echo "mbti_zh_result_release=$mbti_zh_result_release"
          } >> "$GITHUB_OUTPUT"
      - id: career-current
        name: Bind Career Current package operation
        if: steps.receipt.outputs.career_current == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/career-current-manifest.json"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/contents/backend/content_assets/career/current/manifest.json?ref=$DEPLOY_SHA" \
            | jq -r .content | base64 --decode > "$manifest"
          contract_version="$(jq -r '.contract_version' "$manifest")"
          if [[ "$contract_version" == "career.sharded_current.manifest.v1" ]]; then
            assets_sha256="$(jq -r '.aggregate_sha256' "$manifest")"
          else
            assets_sha256="$(jq -r '.files[] | select(.path == "assets.jsonl") | .sha256' "$manifest")"
          fi
          [[ "$assets_sha256" =~ ^[0-9a-f]{64}$ ]]
          operation_key="$(printf 'career-current-authority|%s|%s' "$DEPLOY_SHA" "$assets_sha256" | sha256sum | awk '{print $1}')"
          {
            echo "assets_sha256=$assets_sha256"
            echo "operation_key=$operation_key"
          } >> "$GITHUB_OUTPUT"
      - id: mbti-zh-result
        name: Bind exact MBTI zh result authority operation
        if: steps.receipt.outputs.mbti_zh_result_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/mbti-zh-result-authority-release.json"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/contents/backend/content_assets/personality_public/mbti_zh_result_authority_release.v1.json?ref=$DEPLOY_SHA" \
            | jq -r .content | base64 --decode > "$manifest"
          jq -e '
            .contract_version == "mbti.zh_result_authority_release.v1"
            and .package_id == "mbti-zh-result-41755da0ed35dc35"
            and .package_hash == "41755da0ed35dc35d8ef4de68582506a9615924bfbb3548c037c004f34b520c4"
            and .locale == "zh-CN"
            and .template_key == "mbti_desktop_clone_v1"
            and .record_count == 32
            and .disabled_slot_count == 224
            and .admin_actor_user_id == 1
            and ([.negative_guarantees[]] | all(. == false))
          ' "$manifest" >/dev/null
          package_hash="$(jq -r .package_hash "$manifest")"
          actor="$(jq -r .admin_actor_user_id "$manifest")"
          operation_key="$(printf 'mbti-zh-result-authority|%s|%s|%s' "$DEPLOY_SHA" "$package_hash" "$actor" | sha256sum | awk '{print $1}')"
          {
            echo "package_hash=$package_hash"
            echo "actor=$actor"
            echo "operation_key=$operation_key"
          } >> "$GITHUB_OUTPUT"

  staging:
    name: Staging exact-SHA deploy and smoke
    needs: policy
    if: needs.policy.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    env:
      TARGET: staging
      DEPLOY_USER: ${{ secrets.STAGING_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.STAGING_DEPLOY_PORT }}
      DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
      DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
      DEPLOY_USER_STG: ${{ secrets.STAGING_DEPLOY_USER }}
      DEPLOY_PORT_STG: ${{ secrets.STAGING_DEPLOY_PORT }}
      DEPLOY_HOST_STG: ${{ secrets.STAGING_DEPLOY_HOST }}
      DEPLOY_PATH_STG: ${{ secrets.STAGING_DEPLOY_PATH }}
      HEALTHCHECK_URL: ${{ secrets.STAGING_HEALTHCHECK_URL }}
      AUTH_GUEST_CHECK_URL: ${{ secrets.STAGING_AUTH_GUEST_CHECK_URL }}
      OPS_HOST: ${{ secrets.STAGING_OPS_HOST }}
      DEPLOY_REVISION: ${{ github.event.workflow_run.head_sha }}
      DEPLOY_MODE: standard
      CI_PARITY_RECEIPT_VERIFIED: "true"
      CI_PARITY_RECEIPT_SHA: ${{ github.event.workflow_run.head_sha }}
      CI_PARITY_RECEIPT_ARTIFACT_DIGEST: ${{ needs.policy.outputs.artifact_digest }}
      CI_PARITY_RECEIPT_CONFIG_FINGERPRINT: ${{ needs.policy.outputs.config_fingerprint }}
      CI_PARITY_RECEIPT_RUN_ID: ${{ github.event.workflow_run.id }}
      CI_PARITY_RECEIPT_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Install pinned Deployer
        run: |
          curl -fsSL -o /tmp/dep.phar "https://github.com/deployphp/deployer/releases/download/v${DEPLOYER_VERSION}/deployer.phar"
          printf '%s  /tmp/dep.phar\n' "$DEPLOYER_SHA256" | sha256sum -c -
      - name: Configure staging SSH identities
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          STAGING_REPO_READ_SSH_KEY: ${{ secrets.STAGING_REPO_READ_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$STAGING_REPO_READ_SSH_KEY"
          install -d -m 700 ~/.ssh
          host_key="$RUNNER_TEMP/staging-host-key"
          install -m 600 /dev/null "$host_key"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$host_key"
          printf 'DEPLOY_IDENTITY_FILE_STG=%s\n' "$host_key" >> "$GITHUB_ENV"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          eval "$(ssh-agent -s)" >/dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          printf '%s\n' "$STAGING_REPO_READ_SSH_KEY" | ssh-add - >/dev/null 2>&1
      - name: Deploy staging and run repository smoke chain
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          php /tmp/dep.phar deploy staging -f deploy.php --revision "$DEPLOY_SHA" \
            -o release_name="trunk-${DEPLOY_SHA:0:12}-${GITHUB_RUN_ID}" -o deploy_mode=standard --no-interaction
      - name: Record staging timing
        if: always()
        run: |
          jq -n --arg sha "$DEPLOY_SHA" --arg run "$GITHUB_RUN_ID" --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schema_version:"fermatmind.trunk-deploy-timing.v1",sha:$sha,phase:"staging",run_id:$run,completed_at:$at}' > staging-timing.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: trunk-staging-${{ github.event.workflow_run.head_sha }}
          path: staging-timing.json
          if-no-files-found: error
          retention-days: 90

  production:
    name: Production exact-SHA activation, smoke, and LKG fallback
    needs: [policy, staging]
    if: needs.staging.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      TARGET: production
      DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
      DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
      RETIRED_DEPLOY_HOST: ${{ secrets.PRODUCTION_RETIRED_DEPLOY_HOST }}
      DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
      DEPLOY_USER_PROD: ${{ secrets.PRODUCTION_DEPLOY_USER }}
      DEPLOY_PORT_PROD: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
      DEPLOY_HOST_PROD: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
      DEPLOY_PATH_PROD: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
      SEO_INTEL_CRAWLER_LOG_SOURCE_AUTHORITY: ${{ secrets.SEO_INTEL_CRAWLER_LOG_SOURCE_AUTHORITY }}
      HEALTHCHECK_URL: ${{ vars.PRODUCTION_HEALTHCHECK_URL }}
      AUTH_GUEST_CHECK_URL: ${{ vars.PRODUCTION_AUTH_GUEST_CHECK_URL }}
      OPS_HOST: ${{ vars.PRODUCTION_OPS_HOST }}
      DEPLOY_REVISION: ${{ github.event.workflow_run.head_sha }}
      DEPLOY_MODE: standard
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Install pinned Deployer
        run: |
          curl -fsSL -o /tmp/dep.phar "https://github.com/deployphp/deployer/releases/download/v${DEPLOYER_VERSION}/deployer.phar"
          printf '%s  /tmp/dep.phar\n' "$DEPLOYER_SHA256" | sha256sum -c -
      - name: Start SSH agent without key metadata output
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          eval "$(ssh-agent -s)" >/dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          printf '%s\n' "$SSH_PRIVATE_KEY" | ssh-add - >/dev/null 2>&1
      - name: Install pinned known_hosts
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Refuse stale or non-forward production activation
        id: baseline
        run: |
          set -euo pipefail
          test "$DEPLOY_HOST" != "$RETIRED_DEPLOY_HOST"
          active="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "tr -d '\r\n' < '$DEPLOY_PATH/current/REVISION'")"
          [[ "$active" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$active"
          if ! git merge-base --is-ancestor "$active" "$DEPLOY_SHA"; then
            echo "Candidate is older than or divergent from active production; skip out-of-order activation."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$active" != "$DEPLOY_SHA"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "active=$active" >> "$GITHUB_OUTPUT"
      - name: Deploy once and automatically restore LKG after committed smoke failure
        if: steps.baseline.outputs.skip != 'true'
        run: |
          set -euo pipefail
          release="trunk-${DEPLOY_SHA:0:12}-${GITHUB_RUN_ID}"
          set +e
          php /tmp/dep.phar deploy production -f deploy.php --revision "$DEPLOY_SHA" \
            -o release_name="$release" -o deploy_mode=standard -vvv --no-interaction
          deploy_rc=$?
          set -e
          if [ "$deploy_rc" -eq 0 ]; then exit 0; fi
          current="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "tr -d '\r\n' < '$DEPLOY_PATH/current/REVISION'" || true)"
          if [ "$current" = "$DEPLOY_SHA" ]; then
            echo "Production activation committed but smoke failed; restoring previous LKG once."
            export DEPLOY_SHA='${{ steps.baseline.outputs.active }}'
            php /tmp/dep.phar rollback production -f deploy.php --no-interaction
            restored="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "tr -d '\r\n' < '$DEPLOY_PATH/current/REVISION'")"
            test "$restored" = '${{ steps.baseline.outputs.active }}'
          fi
          exit "$deploy_rc"
      - name: Persist push-to-production timing receipt
        if: always()
        env:
          PUSHED_AT: ${{ github.event.workflow_run.created_at }}
          CI_COMPLETED_AT: ${{ github.event.workflow_run.updated_at }}
        run: |
          jq -n --arg sha "$DEPLOY_SHA" --arg pushed "$PUSHED_AT" --arg ci "$CI_COMPLETED_AT" \
            --arg completed "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg run "$GITHUB_RUN_ID" \
            '{schema_version:"fermatmind.trunk-delivery-timing.v1",sha:$sha,pushed_at:$pushed,ci_completed_at:$ci,production_smoke_completed_at:$completed,deploy_run_id:$run}' \
            > trunk-delivery-timing.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: trunk-production-${{ github.event.workflow_run.head_sha }}
          path: trunk-delivery-timing.json
          if-no-files-found: error
          retention-days: 90

  mbti-zh-result-publish:
    name: Publish exact MBTI zh result authority
    needs: [policy, production]
    if: needs.production.result == 'success' && needs.policy.outputs.mbti_zh_result_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      PACKAGE_HASH: ${{ needs.policy.outputs.mbti_zh_result_package_hash }}
      ADMIN_ACTOR: ${{ needs.policy.outputs.mbti_zh_result_actor }}
      OPERATION_KEY: ${{ needs.policy.outputs.mbti_zh_result_operation_key }}
      DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
      DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
      RETIRED_DEPLOY_HOST: ${{ secrets.PRODUCTION_RETIRED_DEPLOY_HOST }}
      DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
    steps:
      - name: Start SSH agent without key metadata output
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          eval "$(ssh-agent -s)" >/dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          printf '%s\n' "$SSH_PRIVATE_KEY" | ssh-add - >/dev/null 2>&1
      - name: Install pinned known_hosts
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$DEPLOY_HOST" != "$RETIRED_DEPLOY_HOST"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Promote, read back, and recover the exact package
        shell: bash
        run: |
          set -euo pipefail
          dir=artifacts/mbti-zh-result-authority-publish
          mkdir -p "$dir"
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PACKAGE_HASH" =~ ^[0-9a-f]{64}$ ]]
          [[ "$ADMIN_ACTOR" =~ ^[1-9][0-9]*$ ]]
          [[ "$OPERATION_KEY" =~ ^[0-9a-f]{64}$ ]]
          printf -v q_path '%q' "$DEPLOY_PATH"
          printf -v q_release '%q' "$DEPLOY_SHA"
          ssh_base=(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST")
          remote_prefix="set -euo pipefail; current=\$(readlink -f $q_path/current); releases=\$(readlink -f $q_path/releases); test -n \"\$current\"; test -n \"\$releases\"; case \"\$current\" in \"\$releases\"/*) ;; *) exit 1 ;; esac; test \"\$(tr -d '\\r\\n' < \"\$current/REVISION\")\" = $q_release; test ! -e $q_path/.dep/deploy.lock; cd \"\$current/backend\";"
          flags="--production-content-write-authorized --no-publication-change --no-indexability-change --no-sitemap --no-llms --no-search-release"
          run_artisan() {
            "${ssh_base[@]}" "$remote_prefix sudo -n -u www-data -- php artisan personality:mbti-zh-result-content-release $* --no-interaction --no-ansi"
          }
          public_rows() {
            local output="$1"
            : > "$output"
            for base in ENFJ ENFP ENTJ ENTP ESFJ ESFP ESTJ ESTP INFJ INFP INTJ INTP ISFJ ISFP ISTJ ISTP; do
              for axis in A T; do
                code="${base}-${axis}"
                slug="$(tr '[:upper:]' '[:lower:]' <<<"$code")"
                curl --retry 3 --retry-all-errors --retry-delay 2 -fsS --connect-timeout 5 --max-time 30 \
                  "https://api.fermatmind.com/api/v0.5/personality/${slug}/desktop-clone?locale=zh-CN&org_id=0&scale_code=MBTI" \
                  | jq -c --arg code "$code" --arg package "$PACKAGE_HASH" '
                      select(.ok == true
                        and .full_code == $code
                        and (._meta.package_id | type == "string" and length > 0)
                        and ._meta.package_hash == $package
                        and (._meta.source_hash | test("^[a-f0-9]{64}$"))
                        and (._meta.revision_no | type == "number" and . > 0)
                        and (.asset_slots | length) == 7
                        and ([.asset_slots[] | select(.status == "disabled" and .asset_ref == null and .alt == "")] | length) == 7)
                      | {full_code,package_id:._meta.package_id,package_hash:._meta.package_hash,source_hash:._meta.source_hash,revision_no:._meta.revision_no,disabled_slots:7}
                    ' >> "$output"
              done
            done
          }
          public_snapshot() {
            local output="$1"
            : > "$output"
            for base in ENFJ ENFP ENTJ ENTP ESFJ ESFP ESTJ ESTP INFJ INFP INTJ INTP ISFJ ISFP ISTJ ISTP; do
              for axis in A T; do
                code="${base}-${axis}"
                slug="$(tr '[:upper:]' '[:lower:]' <<<"$code")"
                digest="$(curl --retry 3 --retry-all-errors --retry-delay 2 -fsS --connect-timeout 5 --max-time 30 \
                  "https://api.fermatmind.com/api/v0.5/personality/${slug}/desktop-clone?locale=zh-CN&org_id=0&scale_code=MBTI" \
                  | jq -S -c . | sha256sum | awk '{print $1}')"
                jq -cn --arg code "$code" --arg digest "$digest" '{full_code:$code,response_sha256:$digest}' >> "$output"
              done
            done
          }

          run_artisan --stage=dry-run | tee "$dir/dry-run.json"
          jq -e --arg package "$PACKAGE_HASH" '
            .ok == true and .record_count == 32 and .package_hash == $package
            and .writes == false and .discoverability_changes == false
          ' "$dir/dry-run.json" >/dev/null
          pre_state_hash="$(jq -r .pre_state_hash "$dir/dry-run.json")"
          already_active="$(jq -r .already_active "$dir/dry-run.json")"

          if [ "$already_active" = true ]; then
            run_artisan --stage=readback --package-hash="$PACKAGE_HASH" | tee "$dir/database-readback.json"
            public_rows "$dir/public-rows.jsonl"
            jq -s --arg package "$PACKAGE_HASH" '
              {schema:"mbti_zh_result_public_readback.v1",package_hash:$package,record_count:length,
               disabled_slot_count:(map(.disabled_slots)|add),unique_source_hashes:(map(.source_hash)|unique|length),
               ok:(length == 32 and (map(.package_hash)|unique) == [$package] and (map(.source_hash)|unique|length) == 32)}
            ' "$dir/public-rows.jsonl" > "$dir/public-readback.json"
            jq -e '.ok == true and .record_count == 32 and .disabled_slot_count == 224 and .unique_source_hashes == 32' "$dir/public-readback.json" >/dev/null
            jq -n --arg sha "$DEPLOY_SHA" --arg package "$PACKAGE_HASH" --arg operation "$OPERATION_KEY" '
              {contract_version:"mbti.zh_result_authority_publish.v1",status:"PASS_ALREADY_ACTIVE",release_sha:$sha,
               package_hash:$package,operation_key:$operation,record_count:32,disabled_slot_count:224,
               public_api_readback_count:32,immutable_revision_count_created:0,rollback_performed:false,
               negative_guarantees:{publication_eligibility_changed:false,indexability_changed:false,sitemap_mutated:false,llms_mutated:false,search_channel_mutated:false}}
            ' > "$dir/receipt.json"
            exit 0
          fi

          public_snapshot "$dir/public-pre-state.jsonl"
          rollback_set_hash=""
          recover_pre_state() {
            trap - ERR
            run_artisan --stage=dry-run | tee "$dir/failed-state.json"
            rollback_performed=false
            if ! jq -e --arg pre "$pre_state_hash" '.ok == true and .pre_state_hash == $pre and .already_active == false' "$dir/failed-state.json" >/dev/null; then
              [[ "$rollback_set_hash" =~ ^[0-9a-f]{64}$ ]]
              run_artisan --stage=rollback --package-hash="$PACKAGE_HASH" --pre-state-hash="$pre_state_hash" --revision-set-hash="$rollback_set_hash" "$flags" | tee "$dir/rollback.json"
              rollback_performed=true
            fi
            run_artisan --stage=dry-run | tee "$dir/rollback-database-readback.json"
            jq -e --arg pre "$pre_state_hash" '.ok == true and .pre_state_hash == $pre and .already_active == false' "$dir/rollback-database-readback.json" >/dev/null
            public_snapshot "$dir/public-restored-state.jsonl"
            diff -u "$dir/public-pre-state.jsonl" "$dir/public-restored-state.jsonl" > "$dir/rollback-public-diff.txt"
            jq -n --arg sha "$DEPLOY_SHA" --arg package "$PACKAGE_HASH" --arg operation "$OPERATION_KEY" --argjson rollback "$rollback_performed" '
              {contract_version:"mbti.zh_result_authority_publish.v1",status:"FAIL_ROLLED_BACK",release_sha:$sha,
               package_hash:$package,operation_key:$operation,record_count:32,rollback_performed:$rollback,
               database_pre_state_restored:true,public_pre_state_restored:true}
            ' > "$dir/receipt.json"
          }
          trap recover_pre_state ERR
          run_artisan --stage=draft --package-hash="$PACKAGE_HASH" --pre-state-hash="$pre_state_hash" --admin-user-id="$ADMIN_ACTOR" "$flags" | tee "$dir/draft.json"
          jq -e '
            .ok == true and .stage == "draft_write" and .record_count == 32
            and (.candidate_revisions | length) == 32 and (.rollback_revisions | length) == 32
            and (.candidate_revision_set_hash | test("^[a-f0-9]{64}$"))
            and (.rollback_revision_set_hash | test("^[a-f0-9]{64}$"))
          ' "$dir/draft.json" >/dev/null
          rollback_set_hash="$(jq -r .rollback_revision_set_hash "$dir/draft.json")"

          run_artisan --stage=promotion-dry-run | tee "$dir/promotion-dry-run.json"
          revision_set_hash="$(jq -r .candidate_revision_set_hash "$dir/promotion-dry-run.json")"
          test "$(jq -r .rollback_revision_set_hash "$dir/promotion-dry-run.json")" = "$rollback_set_hash"
          jq -e --arg package "$PACKAGE_HASH" --arg pre "$pre_state_hash" '
            .ok == true and .package_hash == $package and .pre_state_hash == $pre and .record_count == 32
          ' "$dir/promotion-dry-run.json" >/dev/null

          readback_ok=1
          set +e
          run_artisan --stage=promote --package-hash="$PACKAGE_HASH" --pre-state-hash="$pre_state_hash" --revision-set-hash="$revision_set_hash" "$flags" | tee "$dir/promotion.json"
          promotion_status="${PIPESTATUS[0]}"
          set -e
          test "$promotion_status" -eq 0 || readback_ok=0
          jq -e '.ok == true and .committed == true and .record_count == 32' "$dir/promotion.json" >/dev/null || readback_ok=0
          run_artisan --stage=readback --package-hash="$PACKAGE_HASH" | tee "$dir/database-readback.json" || readback_ok=0
          jq -e '.ok == true and .record_count == 32 and .disabled_slot_count == 224 and ([.revision_nos[]] | all(. > 0))' "$dir/database-readback.json" >/dev/null || readback_ok=0
          public_rows "$dir/public-rows.jsonl" || readback_ok=0
          jq -s --arg package "$PACKAGE_HASH" '
            {schema:"mbti_zh_result_public_readback.v1",package_hash:$package,record_count:length,
             disabled_slot_count:(map(.disabled_slots)|add // 0),unique_source_hashes:(map(.source_hash)|unique|length),
             ok:(length == 32 and (map(.package_hash)|unique) == [$package] and (map(.source_hash)|unique|length) == 32)}
          ' "$dir/public-rows.jsonl" > "$dir/public-readback.json"
          jq -e '.ok == true and .record_count == 32 and .disabled_slot_count == 224 and .unique_source_hashes == 32' "$dir/public-readback.json" >/dev/null || readback_ok=0

          if [ "$readback_ok" -ne 1 ]; then
            recover_pre_state
            exit 1
          fi

          trap - ERR
          jq -n --arg sha "$DEPLOY_SHA" --arg package "$PACKAGE_HASH" --arg operation "$OPERATION_KEY" \
            --arg pre "$pre_state_hash" --arg revisions "$revision_set_hash" '
            {contract_version:"mbti.zh_result_authority_publish.v1",status:"PASS_EXACT_AUTHORITY_PUBLISH",release_sha:$sha,
             package_hash:$package,operation_key:$operation,pre_state_hash:$pre,candidate_revision_set_hash:$revisions,
             record_count:32,disabled_slot_count:224,public_api_readback_count:32,immutable_revision_count_created:64,
             rollback_performed:false,
             negative_guarantees:{publication_eligibility_changed:false,indexability_changed:false,sitemap_mutated:false,llms_mutated:false,search_channel_mutated:false}}
          ' > "$dir/receipt.json"
      - name: Validate immutable sanitized receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          receipt=artifacts/mbti-zh-result-authority-publish/receipt.json
          jq -e --arg sha "$DEPLOY_SHA" --arg package "$PACKAGE_HASH" --arg operation "$OPERATION_KEY" '
            .contract_version == "mbti.zh_result_authority_publish.v1"
            and (.status == "PASS_EXACT_AUTHORITY_PUBLISH" or .status == "PASS_ALREADY_ACTIVE")
            and .release_sha == $sha and .package_hash == $package and .operation_key == $operation
            and .record_count == 32 and .disabled_slot_count == 224 and .public_api_readback_count == 32
            and ([.negative_guarantees[]] | all(. == false))
          ' "$receipt" >/dev/null
      - name: Upload MBTI zh result authority receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mbti-zh-result-authority-publish-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mbti-zh-result-authority-publish
          if-no-files-found: error
          retention-days: 90

  career-current-publish:
    name: Publish Career Current authority
    needs: [policy, production]
    if: needs.production.result == 'success' && needs.policy.outputs.career_current == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      ASSETS_SHA256: ${{ needs.policy.outputs.career_current_assets_sha256 }}
      OPERATION_KEY: ${{ needs.policy.outputs.career_current_operation_key }}
      FULL_SCAN: ${{ needs.policy.outputs.career_current_full_scan == 'true' && '1' || '0' }}
      DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
      DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
      RETIRED_DEPLOY_HOST: ${{ secrets.PRODUCTION_RETIRED_DEPLOY_HOST }}
      DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Start SSH agent without key metadata output
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          eval "$(ssh-agent -s)" >/dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          printf '%s\n' "$SSH_PRIVATE_KEY" | ssh-add - >/dev/null 2>&1
      - name: Install pinned known_hosts
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$DEPLOY_HOST" != "$RETIRED_DEPLOY_HOST"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Stream Career Current publisher and validate receipt
        shell: bash
        run: |
          set -euo pipefail
          dir=artifacts/career-current-authority-publish
          receipt="$dir/receipt.json"
          remote_stderr="$RUNNER_TEMP/career-current-authority-publish.stderr"
          mkdir -p "$dir"
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ASSETS_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$OPERATION_KEY" =~ ^[0-9a-f]{64}$ ]]
          [[ "$FULL_SCAN" =~ ^[01]$ ]]
          printf -v q_path '%q' "$DEPLOY_PATH"
          printf -v q_release '%q' "$DEPLOY_SHA"
          printf -v q_assets '%q' "$ASSETS_SHA256"
          printf -v q_operation '%q' "$OPERATION_KEY"
          printf -v q_full_scan '%q' "$FULL_SCAN"
          printf -v q_run '%q' "$GITHUB_RUN_ID"
          printf -v q_attempt '%q' "$GITHUB_RUN_ATTEMPT"
          remote="set -euo pipefail; current=\$(readlink -f $q_path/current); releases=\$(readlink -f $q_path/releases); test -n \"\$current\"; test -n \"\$releases\"; case \"\$current\" in \"\$releases\"/*) ;; *) exit 1 ;; esac; test \"\$(tr -d '\\r\\n' < \"\$current/REVISION\")\" = $q_release; test ! -e $q_path/.dep/deploy.lock; release_name=\$(basename \"\$current\"); sudo -n -u www-data -- env CAREER_CURRENT_PUBLISH_EXECUTE=1 CAREER_CURRENT_PUBLISH_BACKEND_ROOT=\"\$current/backend\" CAREER_CURRENT_PUBLISH_RELEASE_SHA=$q_release CAREER_CURRENT_PUBLISH_RELEASE_NAME=\"\$release_name\" CAREER_CURRENT_PUBLISH_ASSETS_SHA256=$q_assets CAREER_CURRENT_PUBLISH_OPERATION_KEY=$q_operation CAREER_CURRENT_PUBLISH_FULL_SCAN=$q_full_scan CAREER_CURRENT_PUBLISH_WORKFLOW_RUN_ID=$q_run CAREER_CURRENT_PUBLISH_WORKFLOW_RUN_ATTEMPT=$q_attempt \"\$current/backend/scripts/deploy/run_career_current_authority_publisher.sh\""
          set +e
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" "$remote" \
            < backend/scripts/operations/career_current_authority_publish.php \
            > "$receipt" 2> "$remote_stderr"
          remote_status=$?
          set -e
          jq -e 'type == "object" and (.status | type == "string")' "$receipt" >/dev/null
          test "$remote_status" = 0
          jq -e --arg release "$DEPLOY_SHA" --arg assets "$ASSETS_SHA256" \
            --arg operation "$OPERATION_KEY" --argjson full_scan "$FULL_SCAN" '
              .contract_version == "career.current_authority_publish.v1"
              and .status == "PASS_CURRENT_AUTHORITY_PUBLISH"
              and .release_sha == $release
              and .assets_sha256 == $assets
              and (.versionless_projection_sha256 | test("^[0-9a-f]{64}$"))
              and .versionless_projection_sha256 == .package.versionless_projection_sha256
              and .operation_key == $operation
              and .full_scan == ($full_scan == 1)
              and .resource_guard == {
                "schema_version": "career.current_authority_publish.resource_guard.v1",
                "timeout_seconds": 900,
                "nice_adjustment": 15,
                "ionice_class": 2,
                "ionice_priority": 7,
                "memory_limit_mb": 1024
              }
              and .package.career_count == 1046
              and .package.locale_page_count == 2092
              and .package.components_per_page == 28
              and .authority.target_count == 1046
              and .authority.unique_slug_count == 1046
              and .authority.component_28_count == 1046
              and .manual_hold_verified == true
              and (.full_scan == false or .public_readback.verified_slug_count == 1046)
              and (.full_scan == false or .public_readback.verified_locale_page_count == 2092)
              and .write_counts.occupation_write_count == 0
              and .write_counts.generation_write_count == 0
              and .write_counts.discoverability_write_count == 0
              and .write_counts.search_submission_count == 0
              and .negative_guarantees.task_3a_through_7b_executed == false
              and .negative_guarantees.search_channel_executed == false
              and .automatic_retry_allowed == false
            ' "$receipt" >/dev/null
      - name: Upload Career Current publish receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: career-current-authority-publish-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/career-current-authority-publish
          if-no-files-found: error
          retention-days: 90

  docs-only:
    name: Docs-only deployment skip receipt
    needs: policy
    if: needs.policy.outputs.deploy != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Validated docs/rules/tests-only SHA; application deployment intentionally skipped."
