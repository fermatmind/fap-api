name: Nightly

on:
  schedule:
    - cron: "17 18 * * *"

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: nightly-${{ github.repository }}
  cancel-in-progress: true

jobs:
  full-regression:
    name: Full regression, content consistency, dependencies, and performance
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: fap_ci
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -proot" --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:6-alpine
        ports: ["6379:6379"]
        options: --health-cmd="redis-cli ping || exit 1" --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: fap_ci
      DB_USERNAME: root
      DB_PASSWORD: root
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      RUN_BIG5_OCEAN_GATE: "1"
      RUN_ENNEAGRAM_GATE: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: mbstring, intl, pdo_sqlite, sqlite3, pdo_mysql, redis
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
      - working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress
      - working-directory: backend
        run: composer audit --locked --no-interaction --ignore-unreachable
      - run: node --test .github/trunk/*.test.mjs
      - name: Install CI verification tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ripgrep
      - run: bash backend/scripts/ci_verify_mbti.sh
      - working-directory: backend
        run: php artisan test --no-ansi

  codeql:
    name: CodeQL and Semgrep security scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Blocking Semgrep scan
        env:
          SEMGREP_VERSION: "1.150.0"
          SEMGREP_SETUPTOOLS_VERSION: "80.9.0"
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir "setuptools==$SEMGREP_SETUPTOOLS_VERSION" "semgrep==$SEMGREP_VERSION"
          semgrep scan --error --config p/php --config p/secrets --exclude backend/vendor --exclude backend/node_modules backend
      - uses: github/codeql-action/init@1ad29ea4a422cce9a242a9fae469541dcd08addc # v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@1ad29ea4a422cce9a242a9fae469541dcd08addc # v4

  alert:
    name: Actionable nightly diagnostic
    needs: [full-regression, codeql]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - run: echo "Nightly failed. Production remains on its current healthy SHA; inspect this run for the failing boundary."
