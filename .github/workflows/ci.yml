            and (.technical_diagnosis.receipt_hash | test("^[a-f0-9]{64}$"))
            and (.binding_hash | test("^[a-f0-9]{64}$"))
            and (.contract_manifest_hash | test("^[a-f0-9]{64}$"))
            and (.receipt_hash | test("^[a-f0-9]{64}$"))
          ' ../seo-council-orchestration-closeout.json >/dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: seo-council-orchestration-${{ github.sha }}
          path: seo-council-orchestration-closeout.json
          if-no-files-found: error
          retention-days: 90

  seo-competitive-evidence:
    name: SEO Platform 11G competitive evidence offline evaluation
    needs: classify
    if: needs.classify.outputs.seo_competitive_evidence == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: curl, sodium, pdo_sqlite, sqlite3
      - name: Verify 11B gateway safety and 11G deterministic contracts
        working-directory: backend
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist --no-progress
          php scripts/seo/export_seo_agent_evidence_contracts.php --check
          php scripts/seo/export_seo_council_contracts.php --check
          php artisan test --compact tests/Feature/SeoIntel/SeoPlatform11B*.php tests/Feature/SeoIntel/SeoPlatform11G*.php
          php artisan seo:competitive-evidence-closeout --expected-sha="$GITHUB_SHA" --environment=ci_candidate --json > ../seo-competitive-evidence-closeout.json
          jq -e --arg sha "$GITHUB_SHA" '
            .receipt_version == "seo.competitive_evidence_closeout.v3"
            and .environment == "ci_candidate"
            and .closeout_state == "OFFLINE_EVAL_READY"
            and .candidate_sha == $sha
            and ."SEO-PLATFORM-11G" == "OFFLINE_EVAL_READY"
            and .ready_for_11H == false
            and ."11i_handoff_ready" == false
            and .dependency_ingestion.external_reads == 0
            and .model_calls == 0 and .tool_calls == 0 and .external_calls == 0
            and .cms_writes == 0 and .url_truth_writes == 0 and .search_writes == 0 and .business_writes == 0
            and .production_permissions == 0 and .execution_allowed == false
            and (.receipt_hash | test("^[a-f0-9]{64}$"))
          ' ../seo-competitive-evidence-closeout.json >/dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: seo-competitive-evidence-${{ github.sha }}
          path: seo-competitive-evidence-closeout.json
          if-no-files-found: error
          retention-days: 90

  validation-receipt:
    name: exact-SHA validation receipt
    needs: [classify, hygiene, supply-chain, content-pack-build-validate, verify-mbti, verify-bigfive, career-publisher-parity, seo-platform-11a-closeout, seo-agent-evidence-boundary, seo-agent-policy-gateway, seo-council-orchestration, seo-competitive-evidence]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: trunk-classification-${{ github.sha }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: career-current-authority-parity-${{ github.sha }}
          path: career-parity
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: needs.classify.outputs.seo_platform_11a_closeout == 'true'
        with:
          name: seo-platform-11a-closeout-${{ github.sha }}
          path: seo-platform-11a-closeout
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: needs.classify.outputs.seo_agent_evidence_boundary == 'true'
        with:
          name: seo-agent-evidence-boundary-${{ github.sha }}
          path: seo-agent-evidence-boundary
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: needs.classify.outputs.seo_agent_policy_gateway == 'true'
        with:
          name: seo-agent-policy-gateway-${{ github.sha }}
          path: seo-agent-policy-gateway
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: needs.classify.outputs.seo_council_orchestration == 'true'
        with:
          name: seo-council-orchestration-${{ github.sha }}
          path: seo-council-orchestration
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: needs.classify.outputs.seo_competitive_evidence == 'true'
        with:
          name: seo-competitive-evidence-${{ github.sha }}
          path: seo-competitive-evidence
      - name: Require every selected validation to pass
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          HYGIENE_RESULT: ${{ needs.hygiene.result }}
          SUPPLY_CHAIN_RESULT: ${{ needs.supply-chain.result }}
          CONTENT_PACK_RESULT: ${{ needs.content-pack-build-validate.result }}
          VERIFY_MBTI_RESULT: ${{ needs.verify-mbti.result }}
          VERIFY_BIGFIVE_RESULT: ${{ needs.verify-bigfive.result }}
          CAREER_PARITY_RESULT: ${{ needs.career-publisher-parity.result }}
          SEO_PLATFORM_11A_CLOSEOUT_RESULT: ${{ needs.seo-platform-11a-closeout.result }}
          SEO_AGENT_EVIDENCE_BOUNDARY_RESULT: ${{ needs.seo-agent-evidence-boundary.result }}
          SEO_AGENT_POLICY_GATEWAY_RESULT: ${{ needs.seo-agent-policy-gateway.result }}
          SEO_COUNCIL_ORCHESTRATION_RESULT: ${{ needs.seo-council-orchestration.result }}
          SEO_COMPETITIVE_EVIDENCE_RESULT: ${{ needs.seo-competitive-evidence.result }}
        run: |
          set -euo pipefail
          for result in "$CLASSIFY_RESULT" "$HYGIENE_RESULT" "$SUPPLY_CHAIN_RESULT" "$CONTENT_PACK_RESULT" "$VERIFY_MBTI_RESULT" "$VERIFY_BIGFIVE_RESULT" "$CAREER_PARITY_RESULT"; do
            test "$result" = success
          done
          required="$(jq -r .operations.publisher_required trunk-path-classification.json)"
          jq -e --arg sha "$GITHUB_SHA" --argjson required "$required" '
            .release_sha == $sha
            and (($required and .status == "pass" and (.receipt_digest | test("^[0-9a-f]{64}$")))
              or (($required | not) and .status == "skipped"))
          ' career-parity/career-current-authority-parity.json >/dev/null
          closeout_required="$(jq -r .operations.seo_platform_11a_closeout trunk-path-classification.json)"
          if [ "$closeout_required" = true ]; then
            test "$SEO_PLATFORM_11A_CLOSEOUT_RESULT" = success
            jq -e --arg sha "$GITHUB_SHA" '.ok == true and .delivery_sha == $sha' \
              seo-platform-11a-closeout/seo-platform-11a-closeout.json >/dev/null
            closeout="$(jq -c '. + {required:true}' seo-platform-11a-closeout/seo-platform-11a-closeout.json)"
          else
            test "$SEO_PLATFORM_11A_CLOSEOUT_RESULT" = skipped
            closeout='{"required":false,"result":"skipped"}'
          fi
          evidence_required="$(jq -r .operations.seo_agent_evidence_boundary trunk-path-classification.json)"
          if [ "$evidence_required" = true ]; then
            test "$SEO_AGENT_EVIDENCE_BOUNDARY_RESULT" = success
            jq -e --arg sha "$GITHUB_SHA" '
              .contract_version == "seo.evidence_boundary_closeout.v4"
              and .release_sha == $sha
              and .execution_allowed == false
              and .model_calls == 0 and .tool_calls == 0 and .external_calls == 0 and .business_writes == 0
              and .negative_guarantees.agent_runtime_created == false
              and .negative_guarantees.agent_write_permissions == 0
              and .negative_guarantees.cms_write == 0
              and .negative_guarantees.search_submission == 0
              and .negative_guarantees.url_truth_write == 0
              and .self_checks.metadata_privacy_probes == {
                total:52,
                factory:{total:19,rejected:19,bypass:0},
                verifier:{total:27,rejected:27,bypass:0},
                context_builder:{total:6,held:6,fully_sanitized:6,bypass:0}
              }
              and .self_checks.payment_identifier_evasion_probes == {
                malicious_total:9,rejected:9,bypass:0,
                scanner:{total:3,rejected:3,bypass:0},
                factory:{total:3,rejected:3,bypass:0},
                verifier:{total:3,rejected:3,bypass:0},
                valid_hash_chain:{total:3,passed:3},valid_hash_false_positive:0
              }
              and (.receipt_hash | test("^[a-f0-9]{64}$"))
            ' \
              seo-agent-evidence-boundary/seo-agent-evidence-boundary-closeout.json >/dev/null
            evidence="$(jq -c '. + {required:true}' seo-agent-evidence-boundary/seo-agent-evidence-boundary-closeout.json)"
          else
            test "$SEO_AGENT_EVIDENCE_BOUNDARY_RESULT" = skipped
            evidence='{"required":false,"result":"skipped"}'
          fi
          gateway_required="$(jq -r .operations.seo_agent_policy_gateway trunk-path-classification.json)"
          if [ "$gateway_required" = true ]; then
            test "$SEO_AGENT_POLICY_GATEWAY_RESULT" = success
            jq -e --arg sha "$GITHUB_SHA" '
              .contract_version == "seo.policy_gateway_closeout.v2"
              and .release_sha == $sha
              and .state == "DEPLOYED_DISABLED"
              and .mode == "DETERMINISTIC_DENY_ONLY"
              and .decision_allow_count == 0
              and .admission_bypass == 0 and .execution_bypass == 0
              and .manifest_bypass == 0 and .entrypoint_bypass == 0
              and .l4_allow_count == 0
              and .active_manifest_count == 0 and .trusted_signing_key_count == 0
              and .model_calls == 0 and .tool_calls == 0 and .external_calls == 0
              and .business_writes == 0 and .cms_writes == 0
              and .url_truth_writes == 0 and .search_submissions == 0
              and .manifest_contract.total == 3 and .manifest_contract.rejected == 3 and .manifest_contract.bypass == 0
              and (.manifest_contract.probes | map("\(.probe_id):\(.outcome):\(.reason_code)")) == [
                "review_state_invalid:REJECTED:MANIFEST_CONTRACT_INVALID",
                "authority_revision_empty:REJECTED:MANIFEST_CONTRACT_INVALID",
                "canary_stage_empty:REJECTED:MANIFEST_CONTRACT_INVALID"
              ]
              and .execution_scope_binding.total == 10 and .execution_scope_binding.denied == 8
              and .execution_scope_binding.held == 2 and .execution_scope_binding.bypass == 0
              and (.execution_scope_binding.probes | map("\(.probe_id):\(.outcome):\(.reason_code)")) == [
                "role_binding_mismatch:DENIED:MANIFEST_ROLE_BINDING_MISMATCH",
                "mission_binding_mismatch:DENIED:MANIFEST_MISSION_BINDING_MISMATCH",
                "autonomy_binding_expansion:DENIED:MANIFEST_AUTONOMY_BINDING_MISMATCH",
                "target_environment_mismatch:DENIED:MANIFEST_TARGET_ENVIRONMENT_MISMATCH",
                "evidence_threshold_unmet:HELD:EVIDENCE_THRESHOLD_UNMET",
                "canary_stage_mismatch:DENIED:CANARY_STAGE_MISMATCH",
                "approval_pending:HELD:APPROVAL_PENDING",
                "approval_rejected:DENIED:APPROVAL_REJECTED",
                "approval_unknown:DENIED:APPROVAL_UNKNOWN",
                "blast_radius_scope_mismatch:DENIED:BLAST_RADIUS_SCOPE_MISMATCH"
              ]
              and (.receipt_hash | test("^[a-f0-9]{64}$"))
            ' seo-agent-policy-gateway/seo-agent-policy-gateway-closeout.json >/dev/null
            gateway="$(jq -c '. + {required:true}' seo-agent-policy-gateway/seo-agent-policy-gateway-closeout.json)"
          else
            test "$SEO_AGENT_POLICY_GATEWAY_RESULT" = skipped
            gateway='{"required":false,"result":"skipped"}'
          fi
          council_required="$(jq -r .operations.seo_council_orchestration trunk-path-classification.json)"
          if [ "$council_required" = true ]; then
            test "$SEO_COUNCIL_ORCHESTRATION_RESULT" = success
            jq -e --arg sha "$GITHUB_SHA" '
              .contract_version == "seo.council_closeout.v2"
              and .source_sha == $sha
              and .unique_orchestrator_probe_total == 1
              and .dependency_status == "READY"
              and .contract_schema_hash_drift_count == 0
              and .binding_schema_probe_total == 1 and .binding_schema_probe_passed == 1 and .binding_schema_probe_failed == 0
              and .binding_hash_drift_count == 0 and .unbound_mission_count == 0
              and .unknown_role_count == 0 and .unknown_capability_count == 0 and .unknown_tool_count == 0
              and .admission_deny_probe_total == 1 and .admission_deny_bypass == 0
              and .admission_hold_probe_total == 5 and .admission_hold_bypass == 0
              and .requested_role_expansion_bypass == 0
              and .five_entrypoint_probe_total == 5 and .five_entrypoint_probe_passed == 5
              and .csrf_negative_probe_total == 3 and .csrf_bypass == 0
              and .career_chain_probe_total == 1 and .career_chain_bypass == 0
              and .policy_reason_overwrite_count == 0 and .unauthorized_route_execution_count == 0
              and .active_legacy_seo_agent_entrypoints == 0
              and .routing.routing_precision == {numerator:32,denominator:32,measurement_state:"observed"}
              and (.routing.corpus_hash | test("^[a-f0-9]{64}$"))
              and .routing.routing_recall == {numerator:32,denominator:32,measurement_state:"observed"}
              and .routing.missed_required_mode_rate.numerator == 0
              and .routing.unnecessary_mode_rate.numerator == 0
              and .routing.all_team_invocation_count.numerator == 1
              and .routing.unauthorized_all_team_invocation_count.numerator == 0
              and .routing.human_route_correction_rate.measurement_state == "not_observed"
              and .l4_allow_count == 0
              and .model_calls == 0 and .tool_calls == 0 and .external_calls == 0
              and .production_permissions == 0 and .business_writes == 0
              and .cms_writes == 0 and .url_truth_writes == 0 and .search_writes == 0
              and .active_manifest_count == 0 and .trusted_key_count == 0
              and .career_runtime == "unavailable_manifest_validator_risk_open"
              and .mission_persistence_enabled == false
              and .operator_time_baseline == {state:"NO_OBSERVATIONS",total_minutes:null,observation_count:0}
              and .action_manifest_ref.id == "seo.action_scoped_manifest.v1"
              and .execution_allowed == false
              and ."SEO-PLATFORM-11D" == "CLOSED" and .ready_for_11E == true
              and ."SEO-PLATFORM-11E" == "HOLD" and .ready_for_11F == false
              and .technical_diagnosis.receipt_version == "seo.technical_diagnosis_closeout.v2"
