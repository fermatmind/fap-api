      DIAGNOSTIC_RUN_ID: ${{ needs.eligibility.outputs.diagnostic_run_id }}
      DIAGNOSTIC_RUN_ATTEMPT: ${{ needs.eligibility.outputs.diagnostic_run_attempt }}
      DIAGNOSTIC_RECEIPT_SHA256: ${{ needs.eligibility.outputs.diagnostic_receipt_sha256 }}
      DIAGNOSTIC_STATE_SHA256: ${{ needs.eligibility.outputs.diagnostic_state_sha256 }}
      DIAGNOSTIC_PAYLOAD_SET_SHA256: ${{ needs.eligibility.outputs.diagnostic_payload_set_sha256 }}
      EXPECTED_PREFLIGHT_STATE_SHA256: ${{ needs.eligibility.outputs.preflight_state_sha256 }}
      EXPECTED_RESUME_TARGET_SET_SHA256: ${{ needs.eligibility.outputs.resume_target_set_sha256 }}
      EXPECTED_RESUME_TARGET_COUNT: ${{ needs.eligibility.outputs.resume_target_count }}
      EXPECTED_RESUME_BATCH_COUNT: ${{ needs.eligibility.outputs.resume_batch_count }}
      FAILED_RESUME_EXECUTE_RUN_ID: ${{ needs.eligibility.outputs.failed_resume_execute_run_id }}
      FAILED_RESUME_EXECUTE_RUN_ATTEMPT: ${{ needs.eligibility.outputs.failed_resume_execute_run_attempt }}
      FAILED_RESUME_EXECUTE_RECEIPT_SHA256: ${{ needs.eligibility.outputs.failed_resume_execute_receipt_sha256 }}
      FAILED_RESUME_EXECUTE_ARTIFACT_DIGEST: ${{ needs.eligibility.outputs.failed_resume_execute_artifact_digest }}
      PERMISSION_REPAIR_RUN_ID: ${{ needs.eligibility.outputs.permission_repair_run_id }}
      PERMISSION_REPAIR_RUN_ATTEMPT: ${{ needs.eligibility.outputs.permission_repair_run_attempt }}
      PERMISSION_REPAIR_RECEIPT_SHA256: ${{ needs.eligibility.outputs.permission_repair_receipt_sha256 }}
      PERMISSION_REPAIR_ARTIFACT_DIGEST: ${{ needs.eligibility.outputs.permission_repair_artifact_digest }}
    steps:
      - name: Checkout exact resume control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.eligibility.outputs.control_plane_sha }}
          fetch-depth: 1

      - name: Validate protected production topology
        shell: bash
        run: |
          set -euo pipefail
          for name in DEPLOY_USER DEPLOY_PORT DEPLOY_HOST RETIRED_DEPLOY_HOST DEPLOY_PATH; do
            test -n "${!name:-}"
          done
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          test "$DEPLOY_PORT" -ge 1
          test "$DEPLOY_PORT" -le 65535
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$RETIRED_DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          test "$DEPLOY_HOST" != "$RETIRED_DEPLOY_HOST"
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_PATH" != *".."* ]]
          echo "Protected production topology validated without disclosing values."

      - name: Set up SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known hosts
        shell: bash
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null \
            || ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f ~/.ssh/known_hosts >/dev/null

      - name: Run exact bounded resume phase against unchanged active release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          runner="backend/scripts/career/career_search_entry_batch_cache_refresh_resume.php"
          runner_sha256="$(sha256sum "$runner" | awk '{print $1}')"
          for variable in \
            MODE DEPLOY_PATH EXPECTED_RELEASE_SHA EXPECTED_RELEASE_NAME \
            EXPECTED_MANIFEST_SHA256 EXPECTED_BASELINE_PAYLOAD_SET_SHA256 \
            EXPECTED_BAD_HREF_URL_COUNT EXPECTED_LOW_MODULE_URL_COUNT \
            EXPECTED_PREFLIGHT_STATE_SHA256 EXPECTED_RESUME_TARGET_SET_SHA256 \
            EXPECTED_RESUME_TARGET_COUNT EXPECTED_RESUME_BATCH_COUNT; do
            printf -v "q_${variable}" '%q' "${!variable}"
          done
          set +e
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -o ServerAliveInterval=20 -o ServerAliveCountMax=30 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "CAREER_CACHE_RESUME_MODE=$q_MODE DEPLOY_PATH=$q_DEPLOY_PATH EXPECTED_RELEASE_SHA=$q_EXPECTED_RELEASE_SHA EXPECTED_RELEASE_NAME=$q_EXPECTED_RELEASE_NAME EXPECTED_MANIFEST_SHA256=$q_EXPECTED_MANIFEST_SHA256 EXPECTED_BASELINE_PAYLOAD_SET_SHA256=$q_EXPECTED_BASELINE_PAYLOAD_SET_SHA256 EXPECTED_BAD_HREF_URL_COUNT=$q_EXPECTED_BAD_HREF_URL_COUNT EXPECTED_LOW_MODULE_URL_COUNT=$q_EXPECTED_LOW_MODULE_URL_COUNT EXPECTED_PREFLIGHT_STATE_SHA256=$q_EXPECTED_PREFLIGHT_STATE_SHA256 EXPECTED_RESUME_TARGET_SET_SHA256=$q_EXPECTED_RESUME_TARGET_SET_SHA256 EXPECTED_RESUME_TARGET_COUNT=$q_EXPECTED_RESUME_TARGET_COUNT EXPECTED_RESUME_BATCH_COUNT=$q_EXPECTED_RESUME_BATCH_COUNT php" \
            < "$runner" > artifacts/remote-receipt.json
          remote_status=$?
          set -e
          jq \
            --arg control "$CONTROL_PLANE_SHA" \
            --arg runner "$runner_sha256" \
            --arg failed_receipt "$FAILED_RECEIPT_SHA256" \
            --arg recovery_receipt "$RECOVERY_RECEIPT_SHA256" \
            --arg failed_preflight_receipt "$FAILED_PREFLIGHT_RECEIPT_SHA256" \
            --arg diagnostic_receipt "$DIAGNOSTIC_RECEIPT_SHA256" \
            --arg diagnostic_state "$DIAGNOSTIC_STATE_SHA256" \
            --arg diagnostic_payload_set "$DIAGNOSTIC_PAYLOAD_SET_SHA256" \
            --arg failed_resume_execute_receipt "$FAILED_RESUME_EXECUTE_RECEIPT_SHA256" \
            --arg failed_resume_execute_artifact "$FAILED_RESUME_EXECUTE_ARTIFACT_DIGEST" \
            --arg permission_repair_receipt "$PERMISSION_REPAIR_RECEIPT_SHA256" \
            --arg permission_repair_artifact "$PERMISSION_REPAIR_ARTIFACT_DIGEST" \
            --argjson failed_run "$FAILED_RUN_ID" \
            --argjson failed_attempt "$FAILED_RUN_ATTEMPT" \
            --argjson recovery_run "$RECOVERY_RUN_ID" \
            --argjson recovery_attempt "$RECOVERY_RUN_ATTEMPT" \
            --argjson failed_preflight_run "$FAILED_PREFLIGHT_RUN_ID" \
            --argjson failed_preflight_attempt "$FAILED_PREFLIGHT_RUN_ATTEMPT" \
            --argjson diagnostic_run "$DIAGNOSTIC_RUN_ID" \
            --argjson diagnostic_attempt "$DIAGNOSTIC_RUN_ATTEMPT" \
            --argjson failed_resume_execute_run "$FAILED_RESUME_EXECUTE_RUN_ID" \
            --argjson failed_resume_execute_attempt "$FAILED_RESUME_EXECUTE_RUN_ATTEMPT" \
            --argjson permission_repair_run "$PERMISSION_REPAIR_RUN_ID" \
            --argjson permission_repair_attempt "$PERMISSION_REPAIR_RUN_ATTEMPT" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            '. + {
              control_plane_sha: $control,
              runner_sha256: $runner,
              failed_run_id: $failed_run,
              failed_run_attempt: $failed_attempt,
              failed_receipt_sha256: $failed_receipt,
              recovery_run_id: $recovery_run,
              recovery_run_attempt: $recovery_attempt,
              recovery_receipt_sha256: $recovery_receipt,
              baseline_source: "diagnostic",
              failed_preflight_run_id: $failed_preflight_run,
              failed_preflight_run_attempt: $failed_preflight_attempt,
              failed_preflight_receipt_sha256: $failed_preflight_receipt,
              diagnostic_run_id: $diagnostic_run,
              diagnostic_run_attempt: $diagnostic_attempt,
              diagnostic_receipt_sha256: $diagnostic_receipt,
              diagnostic_state_sha256: $diagnostic_state,
              diagnostic_payload_set_sha256: $diagnostic_payload_set,
              failed_resume_execute_run_id: $failed_resume_execute_run,
              failed_resume_execute_run_attempt: $failed_resume_execute_attempt,
              failed_resume_execute_receipt_sha256: $failed_resume_execute_receipt,
              failed_resume_execute_artifact_digest: $failed_resume_execute_artifact,
              permission_repair_run_id: $permission_repair_run,
              permission_repair_run_attempt: $permission_repair_attempt,
              permission_repair_receipt_sha256: $permission_repair_receipt,
              permission_repair_artifact_digest: $permission_repair_artifact,
              workflow_run_id: $run_id,
              workflow_run_attempt: $run_attempt
            }' artifacts/remote-receipt.json \
            > artifacts/career-search-entry-batch-cache-refresh-resume.json

          if [ "$remote_status" -eq 0 ] && [ "$MODE" = "preflight" ]; then
            state="$(jq -er '.preflight_state_sha256' artifacts/career-search-entry-batch-cache-refresh-resume.json)"
            targets="$(jq -er '.resume_target_set_sha256' artifacts/career-search-entry-batch-cache-refresh-resume.json)"
            target_count="$(jq -er '.resume_target_count' artifacts/career-search-entry-batch-cache-refresh-resume.json)"
            batch_count="$(jq -er '.resume_batch_count' artifacts/career-search-entry-batch-cache-refresh-resume.json)"
            phrase="I explicitly approve one-time Career search-entry diagnostic-rebased cache-only resume execute for failed run ${FAILED_RUN_ID} attempt ${FAILED_RUN_ATTEMPT}, recovery run ${RECOVERY_RUN_ID} attempt ${RECOVERY_RUN_ATTEMPT}, failed resume preflight run ${FAILED_PREFLIGHT_RUN_ID} attempt ${FAILED_PREFLIGHT_RUN_ATTEMPT} receipt ${FAILED_PREFLIGHT_RECEIPT_SHA256}, diagnostic run ${DIAGNOSTIC_RUN_ID} attempt ${DIAGNOSTIC_RUN_ATTEMPT} receipt ${DIAGNOSTIC_RECEIPT_SHA256}, rebase preflight run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}, active SHA ${EXPECTED_RELEASE_SHA}, manifest ${EXPECTED_MANIFEST_SHA256}, diagnostic state ${DIAGNOSTIC_STATE_SHA256}, state ${state}, target set ${targets}; refresh exactly ${target_count} residual targets in ${batch_count} batches of at most 5 slugs and 10 URLs using the 5000ms offline build budget and zero per-target retry, then require exact quality-package and 100-URL readback, with no DB, CMS, publication, indexability, queue, sitemap, llms, Search Channel, URL submission, deploy, rollback, or non-target write."
            jq --arg phrase "$phrase" \
              '. + {exact_resume_execute_approval_phrase: $phrase}' \
              artifacts/career-search-entry-batch-cache-refresh-resume.json \
              > artifacts/final.json
            mv artifacts/final.json artifacts/career-search-entry-batch-cache-refresh-resume.json
          fi
          test "$remote_status" -eq 0

      - name: Upload sanitized immutable resume receipt
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: career-search-entry-batch-cache-refresh-resume-${{ needs.eligibility.outputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/career-search-entry-batch-cache-refresh-resume.json
          if-no-files-found: error
          retention-days: 90
