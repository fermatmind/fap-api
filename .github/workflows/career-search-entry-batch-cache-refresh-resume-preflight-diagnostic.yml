name: Career Search Entry Batch Cache Refresh Resume Preflight Diagnostic

on:
  workflow_dispatch:
    inputs:
      expected_control_plane_sha:
        description: Exact latest main SHA containing this diagnostic control
        required: true
        type: string
      expected_release_sha:
        description: Exact unchanged active production application SHA
        required: true
        type: string
      expected_release_name:
        description: Exact unchanged active production release name
        required: true
        type: string
      failed_preflight_run_id:
        description: Exact failed resume preflight run
        required: true
        type: string
      failed_preflight_run_attempt:
        description: Exact failed resume preflight attempt
        required: true
        type: string
      expected_failed_preflight_receipt_sha256:
        description: Exact immutable failed resume preflight receipt SHA
        required: true
        type: string
      operator_approval_phrase:
        description: Exact receipt-bound read-only diagnostic phrase
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-${{ github.repository }}-production
  cancel-in-progress: false

jobs:
  eligibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      control_plane_sha: ${{ steps.validate.outputs.control_plane_sha }}
      release_sha: ${{ steps.validate.outputs.release_sha }}
      release_name: ${{ steps.validate.outputs.release_name }}
      failed_preflight_run_id: ${{ steps.validate.outputs.failed_preflight_run_id }}
      failed_preflight_run_attempt: ${{ steps.validate.outputs.failed_preflight_run_attempt }}
      failed_preflight_receipt_sha256: ${{ steps.validate.outputs.failed_preflight_receipt_sha256 }}
      failed_run_id: ${{ steps.validate.outputs.failed_run_id }}
      failed_run_attempt: ${{ steps.validate.outputs.failed_run_attempt }}
      failed_receipt_sha256: ${{ steps.validate.outputs.failed_receipt_sha256 }}
      recovery_run_id: ${{ steps.validate.outputs.recovery_run_id }}
      recovery_run_attempt: ${{ steps.validate.outputs.recovery_run_attempt }}
      recovery_receipt_sha256: ${{ steps.validate.outputs.recovery_receipt_sha256 }}
      recovery_payload_set_sha256: ${{ steps.validate.outputs.recovery_payload_set_sha256 }}
      manifest_sha256: ${{ steps.validate.outputs.manifest_sha256 }}
      bad_href_url_count: ${{ steps.validate.outputs.bad_href_url_count }}
      low_module_url_count: ${{ steps.validate.outputs.low_module_url_count }}
    steps:
      - name: Checkout exact diagnostic control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.expected_control_plane_sha }}
          fetch-depth: 0

      - name: Bind latest main, failed preflight, recovery, and exact diagnostic authorization
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CONTROL_PLANE_SHA: ${{ inputs.expected_control_plane_sha }}
          EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
          EXPECTED_RELEASE_NAME: ${{ inputs.expected_release_name }}
          FAILED_PREFLIGHT_RUN_ID: ${{ inputs.failed_preflight_run_id }}
          FAILED_PREFLIGHT_RUN_ATTEMPT: ${{ inputs.failed_preflight_run_attempt }}
          EXPECTED_FAILED_PREFLIGHT_RECEIPT_SHA256: ${{ inputs.expected_failed_preflight_receipt_sha256 }}
          OPERATOR_APPROVAL_PHRASE: ${{ inputs.operator_approval_phrase }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$EXPECTED_CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_RELEASE_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          [[ "$FAILED_PREFLIGHT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$FAILED_PREFLIGHT_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_FAILED_PREFLIGHT_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]

          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_CONTROL_PLANE_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_CONTROL_PLANE_SHA"
          git merge-base --is-ancestor "$EXPECTED_RELEASE_SHA" origin/main

          failed_run="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_PREFLIGHT_RUN_ID}"
          )"
          jq -e \
            --argjson attempt "$FAILED_PREFLIGHT_RUN_ATTEMPT" \
            '.name == "Career Search Entry Batch Cache Refresh Resume"
             and .path == ".github/workflows/career-search-entry-batch-cache-refresh-resume.yml"
             and .event == "workflow_dispatch"
             and .status == "completed"
             and .conclusion == "failure"
             and .head_branch == "main"
             and .run_attempt == $attempt' <<<"$failed_run" >/dev/null

          failed_dir="$(mktemp -d)"
          gh run download "$FAILED_PREFLIGHT_RUN_ID" \
            --name "career-search-entry-batch-cache-refresh-resume-preflight-${FAILED_PREFLIGHT_RUN_ID}-${FAILED_PREFLIGHT_RUN_ATTEMPT}" \
            --dir "$failed_dir"
          failed_receipt="$failed_dir/career-search-entry-batch-cache-refresh-resume.json"
          actual_failed_receipt_sha256="$(sha256sum "$failed_receipt" | awk '{print $1}')"
          test "$actual_failed_receipt_sha256" = "$EXPECTED_FAILED_PREFLIGHT_RECEIPT_SHA256"
          failed_run_id="$(jq -er '.failed_run_id' "$failed_receipt")"
          failed_run_attempt="$(jq -er '.failed_run_attempt' "$failed_receipt")"
          failed_receipt_sha256="$(jq -er '.failed_receipt_sha256' "$failed_receipt")"
          recovery_run_id="$(jq -er '.recovery_run_id' "$failed_receipt")"
          recovery_run_attempt="$(jq -er '.recovery_run_attempt' "$failed_receipt")"
          recovery_receipt_sha256="$(jq -er '.recovery_receipt_sha256' "$failed_receipt")"
          jq -e \
            --arg release "$EXPECTED_RELEASE_SHA" \
            --arg release_name "$EXPECTED_RELEASE_NAME" \
            --arg control "$(jq -r '.head_sha' <<<"$failed_run")" \
            --argjson run_id "$FAILED_PREFLIGHT_RUN_ID" \
            --argjson run_attempt "$FAILED_PREFLIGHT_RUN_ATTEMPT" \
            '.contract_version == "career.search_entry_batch.cache_refresh.resume.v1"
             and .mode == "preflight"
             and .status == "FAIL_CLOSED"
             and .release_sha == $release
             and .release_name == $release_name
             and .failed_stage == "pre_write_validation"
             and .failure_category == "PUBLIC_SNAPSHOT_INCOMPLETE"
             and .write_state == "none"
             and .production_write_execution == false
             and .cache_refresh_target_count == 0
             and .completed_batch_count == 0
             and .per_target_retry_limit == 0
             and .control_plane_sha == $control
             and .workflow_run_id == $run_id
             and .workflow_run_attempt == $run_attempt
             and (.failed_run_id | type) == "number"
             and (.failed_run_attempt | type) == "number"
             and (.failed_receipt_sha256 | test("^[0-9a-f]{64}$"))
             and (.recovery_run_id | type) == "number"
             and (.recovery_run_attempt | type) == "number"
             and (.recovery_receipt_sha256 | test("^[0-9a-f]{64}$"))
             and .database_write_count == 0
             and .cms_write_count == 0
             and .publication_write_count == 0
             and .indexability_write_count == 0
             and .queue_dispatch_count == 0
             and .sitemap_write_count == 0
             and .llms_write_count == 0
             and .search_channel_action_count == 0
             and .url_submission_count == 0
             and .non_target_write_count == 0
             and .deploy_count == 0
             and .rollback_count == 0' "$failed_receipt" >/dev/null

          recovery_run="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${recovery_run_id}"
          )"
          jq -e \
            --argjson attempt "$recovery_run_attempt" \
            '.name == "Career Search Entry Batch Cache Refresh Recovery Preflight"
             and .path == ".github/workflows/career-search-entry-batch-cache-refresh-recovery-preflight.yml"
             and .event == "workflow_dispatch"
             and .status == "completed"
             and .conclusion == "success"
             and .head_branch == "main"
             and .run_attempt == $attempt' <<<"$recovery_run" >/dev/null
          recovery_dir="$(mktemp -d)"
          gh run download "$recovery_run_id" \
            --name "career-search-entry-batch-cache-refresh-recovery-preflight-${recovery_run_id}-${recovery_run_attempt}" \
            --dir "$recovery_dir"
          recovery_receipt="$recovery_dir/career-search-entry-batch-cache-refresh-recovery-preflight.json"
          test "$(sha256sum "$recovery_receipt" | awk '{print $1}')" = "$recovery_receipt_sha256"
          manifest_sha256="$(jq -er '.manifest_sha256' "$recovery_receipt")"
          recovery_payload_set_sha256="$(jq -er '.current_payload_set_sha256' "$recovery_receipt")"
          bad_href_url_count="$(jq -er '.bad_href_url_count' "$recovery_receipt")"
          low_module_url_count="$(jq -er '.low_module_url_count' "$recovery_receipt")"
          jq -e \
            --arg release "$EXPECTED_RELEASE_SHA" \
            --arg release_name "$EXPECTED_RELEASE_NAME" \
            --arg failed_receipt "$failed_receipt_sha256" \
            --argjson failed_run "$failed_run_id" \
            --argjson failed_attempt "$failed_run_attempt" \
            '.contract_version == "career.search_entry_batch.cache_refresh.recovery_preflight.v1"
             and .status == "PASS_RECOVERY_RESUME_REQUIRED"
             and .release_sha == $release
             and .release_name == $release_name
             and .failed_run_id == $failed_run
             and .failed_run_attempt == $failed_attempt
             and .failed_receipt_sha256 == $failed_receipt
             and (.manifest_sha256 | test("^[0-9a-f]{64}$"))
             and (.current_payload_set_sha256 | test("^[0-9a-f]{64}$"))
             and .bad_href_url_count > 0
             and .low_module_url_count >= 0
             and .write_state == "none"
             and .production_write_execution == false
             and .cache_refresh_target_count == 0
             and .database_write_count == 0
             and .queue_dispatch_count == 0
             and .deploy_count == 0
             and .rollback_count == 0' "$recovery_receipt" >/dev/null

          later_resume="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/career-search-entry-batch-cache-refresh-resume.yml/runs?event=workflow_dispatch&per_page=100"
          )"
          jq -e \
            --argjson failed_preflight "$FAILED_PREFLIGHT_RUN_ID" \
            '[.workflow_runs[] | select(.id > $failed_preflight)] | length == 0' \
            <<<"$later_resume" >/dev/null

          expected_phrase="I explicitly approve one read-only Career search-entry resume-preflight failure diagnostic for failed preflight run ${FAILED_PREFLIGHT_RUN_ID} attempt ${FAILED_PREFLIGHT_RUN_ATTEMPT} receipt ${EXPECTED_FAILED_PREFLIGHT_RECEIPT_SHA256}, active SHA ${EXPECTED_RELEASE_SHA}; inspect only safe aggregate 100-URL snapshot state, with zero cache write, preflight retry, execute, rollback, deploy, or Search Channel operation."
          test "$OPERATOR_APPROVAL_PHRASE" = "$expected_phrase"

          {
            echo "control_plane_sha=$EXPECTED_CONTROL_PLANE_SHA"
            echo "release_sha=$EXPECTED_RELEASE_SHA"
            echo "release_name=$EXPECTED_RELEASE_NAME"
            echo "failed_preflight_run_id=$FAILED_PREFLIGHT_RUN_ID"
            echo "failed_preflight_run_attempt=$FAILED_PREFLIGHT_RUN_ATTEMPT"
            echo "failed_preflight_receipt_sha256=$EXPECTED_FAILED_PREFLIGHT_RECEIPT_SHA256"
            echo "failed_run_id=$failed_run_id"
            echo "failed_run_attempt=$failed_run_attempt"
            echo "failed_receipt_sha256=$failed_receipt_sha256"
            echo "recovery_run_id=$recovery_run_id"
            echo "recovery_run_attempt=$recovery_run_attempt"
            echo "recovery_receipt_sha256=$recovery_receipt_sha256"
            echo "recovery_payload_set_sha256=$recovery_payload_set_sha256"
            echo "manifest_sha256=$manifest_sha256"
            echo "bad_href_url_count=$bad_href_url_count"
            echo "low_module_url_count=$low_module_url_count"
          } >> "$GITHUB_OUTPUT"

  diagnose:
    needs: eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
      DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
      RETIRED_DEPLOY_HOST: ${{ secrets.PRODUCTION_RETIRED_DEPLOY_HOST }}
      DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
      CONTROL_PLANE_SHA: ${{ needs.eligibility.outputs.control_plane_sha }}
      EXPECTED_RELEASE_SHA: ${{ needs.eligibility.outputs.release_sha }}
      EXPECTED_RELEASE_NAME: ${{ needs.eligibility.outputs.release_name }}
      FAILED_PREFLIGHT_RUN_ID: ${{ needs.eligibility.outputs.failed_preflight_run_id }}
      FAILED_PREFLIGHT_RUN_ATTEMPT: ${{ needs.eligibility.outputs.failed_preflight_run_attempt }}
      FAILED_PREFLIGHT_RECEIPT_SHA256: ${{ needs.eligibility.outputs.failed_preflight_receipt_sha256 }}
      FAILED_RUN_ID: ${{ needs.eligibility.outputs.failed_run_id }}
      FAILED_RUN_ATTEMPT: ${{ needs.eligibility.outputs.failed_run_attempt }}
      FAILED_RECEIPT_SHA256: ${{ needs.eligibility.outputs.failed_receipt_sha256 }}
      RECOVERY_RUN_ID: ${{ needs.eligibility.outputs.recovery_run_id }}
      RECOVERY_RUN_ATTEMPT: ${{ needs.eligibility.outputs.recovery_run_attempt }}
      RECOVERY_RECEIPT_SHA256: ${{ needs.eligibility.outputs.recovery_receipt_sha256 }}
      EXPECTED_RECOVERY_PAYLOAD_SET_SHA256: ${{ needs.eligibility.outputs.recovery_payload_set_sha256 }}
      EXPECTED_MANIFEST_SHA256: ${{ needs.eligibility.outputs.manifest_sha256 }}
      EXPECTED_BAD_HREF_URL_COUNT: ${{ needs.eligibility.outputs.bad_href_url_count }}
      EXPECTED_LOW_MODULE_URL_COUNT: ${{ needs.eligibility.outputs.low_module_url_count }}
    steps:
      - name: Checkout exact diagnostic control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.eligibility.outputs.control_plane_sha }}
          fetch-depth: 1

      - name: Validate protected production topology
        shell: bash
        run: |
          set -euo pipefail
          for name in DEPLOY_USER DEPLOY_PORT DEPLOY_HOST RETIRED_DEPLOY_HOST DEPLOY_PATH; do
            test -n "${!name:-}"
          done
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          test "$DEPLOY_PORT" -ge 1
          test "$DEPLOY_PORT" -le 65535
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$RETIRED_DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          test "$DEPLOY_HOST" != "$RETIRED_DEPLOY_HOST"
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_PATH" != *".."* ]]
          echo "Protected production topology validated without disclosing values."

      - name: Set up SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known hosts
        shell: bash
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null \
            || ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f ~/.ssh/known_hosts >/dev/null

      - name: Run failed-preflight-bound aggregate read-only diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          runner="backend/scripts/career/career_search_entry_batch_cache_refresh_resume.php"
          runner_sha256="$(sha256sum "$runner" | awk '{print $1}')"
          for variable in \
            DEPLOY_PATH EXPECTED_RELEASE_SHA EXPECTED_RELEASE_NAME \
            EXPECTED_MANIFEST_SHA256 EXPECTED_RECOVERY_PAYLOAD_SET_SHA256 \
            EXPECTED_BAD_HREF_URL_COUNT EXPECTED_LOW_MODULE_URL_COUNT; do
            printf -v "q_${variable}" '%q' "${!variable}"
          done
          set +e
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -o ServerAliveInterval=20 -o ServerAliveCountMax=30 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "CAREER_CACHE_RESUME_MODE=diagnose DEPLOY_PATH=$q_DEPLOY_PATH EXPECTED_RELEASE_SHA=$q_EXPECTED_RELEASE_SHA EXPECTED_RELEASE_NAME=$q_EXPECTED_RELEASE_NAME EXPECTED_MANIFEST_SHA256=$q_EXPECTED_MANIFEST_SHA256 EXPECTED_RECOVERY_PAYLOAD_SET_SHA256=$q_EXPECTED_RECOVERY_PAYLOAD_SET_SHA256 EXPECTED_BAD_HREF_URL_COUNT=$q_EXPECTED_BAD_HREF_URL_COUNT EXPECTED_LOW_MODULE_URL_COUNT=$q_EXPECTED_LOW_MODULE_URL_COUNT php" \
            < "$runner" > artifacts/remote-receipt.json
          remote_status=$?
          set -e
          jq \
            --arg control "$CONTROL_PLANE_SHA" \
            --arg runner "$runner_sha256" \
            --arg failed_preflight_receipt "$FAILED_PREFLIGHT_RECEIPT_SHA256" \
            --arg failed_receipt "$FAILED_RECEIPT_SHA256" \
            --arg recovery_receipt "$RECOVERY_RECEIPT_SHA256" \
            --argjson failed_preflight_run "$FAILED_PREFLIGHT_RUN_ID" \
            --argjson failed_preflight_attempt "$FAILED_PREFLIGHT_RUN_ATTEMPT" \
            --argjson failed_run "$FAILED_RUN_ID" \
            --argjson failed_attempt "$FAILED_RUN_ATTEMPT" \
            --argjson recovery_run "$RECOVERY_RUN_ID" \
            --argjson recovery_attempt "$RECOVERY_RUN_ATTEMPT" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            '. + {
              control_plane_sha: $control,
              runner_sha256: $runner,
              failed_preflight_run_id: $failed_preflight_run,
              failed_preflight_run_attempt: $failed_preflight_attempt,
              failed_preflight_receipt_sha256: $failed_preflight_receipt,
              failed_run_id: $failed_run,
              failed_run_attempt: $failed_attempt,
              failed_receipt_sha256: $failed_receipt,
              recovery_run_id: $recovery_run,
              recovery_run_attempt: $recovery_attempt,
              recovery_receipt_sha256: $recovery_receipt,
              workflow_run_id: $run_id,
              workflow_run_attempt: $run_attempt
            }' artifacts/remote-receipt.json \
            > artifacts/career-search-entry-batch-cache-refresh-resume-preflight-diagnostic.json
          test "$remote_status" -eq 0

      - name: Upload sanitized immutable diagnostic receipt
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: career-search-entry-batch-cache-refresh-resume-preflight-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/career-search-entry-batch-cache-refresh-resume-preflight-diagnostic.json
          if-no-files-found: error
          retention-days: 90
