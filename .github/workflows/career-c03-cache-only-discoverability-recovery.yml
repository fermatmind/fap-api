              symlink_write_count: 0,
              process_restart_count: 0,
              queue_reload_count: 0,
              sitemap_submission_count: 0,
              llms_submission_count: 0,
              search_submission_count: 0,
              career_link_publication_gate: "CLOSED",
              automatic_retry_allowed: false
            }' > "$RECEIPT"

      - name: Write C03 verification receipt
        if: inputs.mode == 'verify'
        shell: bash
        run: |
          set -euo pipefail
          inspect="$RUNNER_TEMP/career-c03-inspection.json"
          public="$RUNNER_TEMP/career-c03-public-verification.json"
          pre_state="$(jq -Scn --argjson inspect "$(<"$inspect")" --argjson public "$(<"$public")" \
            '{authority_artifact_sha256:$inspect.authority_artifact_sha256,authority:$inspect.authority,coverage:$inspect.coverage,detail_coverage:$inspect.detail_coverage,job_index_converged:$inspect.job_index_converged,directory_converged:$inspect.directory_converged,sitemap_source_converged:$inspect.sitemap_source_converged,public:($public | del(.detail_readback.network_attempt_count,.detail_readback.transport_retry_count,.detail_readback.recovered_transport_failure_count,.detail_readback.recovered_incomplete_transfer_count,.shared_surface_readback) | .surface_diagnostics |= with_entries(.value |= del(.request_count,.transport_class,.latency_class,.transport_retry_count,.recovered_retry_count,.terminal_transport_failure_count,.incomplete_transfer_count,.timeout_count,.other_transport_failure_count,.server_error_count,.non_200_count,.terminal)))}' \
            | sha256sum | awk '{print $1}')"
          incident_sha="$EXPECTED_INCIDENT_CLOSEOUT_RECEIPT_SHA256"
          if [ "$PUBLIC_VERIFY_RC" = 0 ] && jq -e '.internal_converged == true' "$inspect" >/dev/null; then
            status=PASS_C03_REVERIFIED_NO_APPLY_REQUIRED
            expected_phrase=''
          elif jq -e --argjson public "$(<"$public")" '
            .job_index_converged == true
            and ((.coverage.missing_count + .coverage.broken_count) <= 250)
            and $public.private_path_leak_count == 0
            and $public.shared_surface_readback.terminal_transport_failure_count == 0
            and $public.shared_surface_readback.server_error_count == 0
            and $public.shared_surface_readback.non_200_count == 0
            and $public.detail_readback.terminal_transport_failure_count == 0
            and $public.detail_readback.timeout_count == 0
            and $public.detail_readback.server_error_count == 0
            and $public.detail_readback.non_200_count == 0
            and (($public.surface_mismatches | index("jobs")) == null)' "$inspect" >/dev/null; then
            status=PASS_RECOVERY_REQUIRED
            expected_phrase="I explicitly approve Career C03 cache-only discoverability recovery for control ${CONTROL_PLANE_SHA}, active ${EXPECTED_ACTIVE_REVISION}, incident closeout run ${INCIDENT_CLOSEOUT_RUN_ID} attempt ${INCIDENT_CLOSEOUT_RUN_ATTEMPT}, verify run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}, authority ${AUTHORITY_PROJECTION_SHA256}, target set $(jq -r '.target_set_sha256' "$inspect"), pre-state ${pre_state}; repair at most 250 current published detail cache targets, rebuild only en/zh directories, refresh sitemap/llms derived caches, revalidate exact receipt paths, and keep deploy, migration, CMS/database authority, publication, eligibility, restart, queue, and search submission at zero."
          else
            if [ "$PUBLIC_VERIFY_RC" = 0 ]; then
              status=HOLD_NON_RECOVERABLE_DRIFT
              expected_phrase=''
            else
            jq -n \
              --arg mode verify \
              --arg control "$CONTROL_PLANE_SHA" \
              --arg active "$EXPECTED_ACTIVE_REVISION" \
              --arg runner "$RUNNER_SHA256" \
              --arg readback_runner "$PUBLIC_READBACK_RUNNER_SHA256" \
              --arg failure "$PUBLIC_FAILURE_CODE" \
              --arg run_id "$GITHUB_RUN_ID" \
              --arg attempt "$GITHUB_RUN_ATTEMPT" \
              --argjson public "$(<"$public")" '
              {
                contract_version: "career.c03.cache_only_discoverability_recovery.v1",
                mode: $mode,
                status: "HOLD_PUBLIC_READBACK_FAILED",
                safe_failure_code: $failure,
                control_plane_sha: $control,
                active_revision: $active,
                runner_sha256: $runner,
                public_readback_runner_sha256: $readback_runner,
                workflow_run_id: ($run_id | tonumber),
                workflow_run_attempt: ($attempt | tonumber),
                detail_readback: $public.detail_readback,
                surface_mismatch_count: ($public.surface_mismatches | length),
                surface_diagnostics: $public.surface_diagnostics,
                shared_surface_readback: $public.shared_surface_readback,
                private_path_leak_count: $public.private_path_leak_count,
                cache_write_count: 0,
                database_write_count: 0,
                publication_write_count: 0,
                indexability_write_count: 0,
                deploy_count: 0,
                migration_count: 0,
                symlink_write_count: 0,
                process_restart_count: 0,
                queue_reload_count: 0,
                sitemap_submission_count: 0,
                llms_submission_count: 0,
                search_submission_count: 0,
                career_link_publication_gate: "CLOSED",
                automatic_retry_allowed: false
              }' > "$RECEIPT"
            exit 1
            fi
          fi
          jq -n \
            --arg status "$status" \
            --arg control "$CONTROL_PLANE_SHA" \
            --arg active "$EXPECTED_ACTIVE_REVISION" \
            --arg runner "$RUNNER_SHA256" \
            --arg readback_runner "$PUBLIC_READBACK_RUNNER_SHA256" \
            --arg authority "$AUTHORITY_PROJECTION_SHA256" \
            --arg incident_run "$INCIDENT_CLOSEOUT_RUN_ID" \
            --arg incident_attempt "$INCIDENT_CLOSEOUT_RUN_ATTEMPT" \
            --arg incident_sha "$incident_sha" \
            --arg pre_state "$pre_state" \
            --arg expected_phrase "$expected_phrase" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --argjson inspect "$(<"$inspect")" \
            --argjson public "$(<"$public")" '
            {
              contract_version: "career.c03.cache_only_discoverability_recovery.v1",
              mode: "verify",
              status: $status,
              control_plane_sha: $control,
              active_revision: $active,
              runner_sha256: $runner,
              public_readback_runner_sha256: $readback_runner,
              workflow_run_id: ($run_id | tonumber),
              workflow_run_attempt: ($attempt | tonumber),
              incident_closeout_run_id: ($incident_run | tonumber),
              incident_closeout_run_attempt: ($incident_attempt | tonumber),
              incident_closeout_receipt_sha256: $incident_sha,
              authority_artifact_sha256: $authority,
              authority_inventory: $inspect.authority_inventory,
              published_cohort: $inspect.authority,
              detail_coverage: $inspect.detail_coverage,
