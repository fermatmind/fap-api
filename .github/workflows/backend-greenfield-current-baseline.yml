name: Backend Greenfield Current Baseline
run-name: Backend Greenfield Current Baseline ${{ inputs.mode }} [op:${{ inputs.operation_key }}]

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "SELECT-only Greenfield baseline or one-time Career Current authority export"
        required: true
        type: choice
        options:
          - preflight
          - export
          - career-current-authority
      expected_control_plane_sha:
        description: "Exact latest main control-plane SHA"
        required: true
        type: string
      expected_active_revision:
        description: "Exact source API active revision"
        required: true
        type: string
      expected_projection_sha256:
        description: "Exact current Career runtime projection SHA256"
        required: true
        type: string
      expected_media_host_set_sha256:
        description: "Required for export; copied from the successful preflight receipt"
        required: false
        type: string
      operator_approval_phrase:
        description: "Exact SELECT-only Greenfield baseline approval"
        required: true
        type: string
      operation_key:
        description: "Required deterministic operation key for career-current-authority only"
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-${{ github.repository }}-production
  cancel-in-progress: false

jobs:
  operation-gate:
    name: Elect Career Current export owner before Environment access
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      decision: ${{ steps.decision.outputs.decision }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - id: identity
        if: inputs.mode == 'career-current-authority'
        shell: bash
        env:
          IDENTITY: release=${{ inputs.expected_active_revision }}|projection=${{ inputs.expected_projection_sha256 }}|mode=career-current-authority
        run: echo "operation_key=$(node .github/scripts/controlled-operation-gate.cjs key --repository "$GITHUB_REPOSITORY" --workflow .github/workflows/backend-greenfield-current-baseline.yml --scope career-current-authority-export --identity "$IDENTITY")" >> "$GITHUB_OUTPUT"
      - id: gate
        if: inputs.mode == 'career-current-authority'
        uses: ./.github/actions/controlled-operation-gate
        with:
          claimed-key: ${{ inputs.operation_key }}
          expected-key: ${{ steps.identity.outputs.operation_key }}
          workflow-file: backend-greenfield-current-baseline.yml
          receipt-template: career-current-authority-export-{run_id}-{run_attempt}
      - id: decision
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          GATE_DECISION: ${{ steps.gate.outputs.decision }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "career-current-authority" ]; then
            test -n "$GATE_DECISION"
            echo "decision=$GATE_DECISION" >> "$GITHUB_OUTPUT"
          else
            echo "decision=execute" >> "$GITHUB_OUTPUT"
          fi

  current-baseline:
    name: Stream current-published baseline without source writes
    needs: operation-gate
    if: needs.operation-gate.outputs.decision == 'execute'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    env:
      MODE: ${{ inputs.mode }}
      EXPECTED_CONTROL_PLANE_SHA: ${{ inputs.expected_control_plane_sha }}
      EXPECTED_ACTIVE_REVISION: ${{ inputs.expected_active_revision }}
      EXPECTED_PROJECTION_SHA256: ${{ inputs.expected_projection_sha256 }}
      EXPECTED_MEDIA_HOST_SET_SHA256: ${{ inputs.expected_media_host_set_sha256 }}
      OPERATOR_APPROVAL_PHRASE: ${{ inputs.operator_approval_phrase }}
      OPERATION_KEY: ${{ inputs.operation_key }}

    steps:
      - name: Check out exact main control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.expected_control_plane_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate immutable SELECT-only inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$MODE" = "preflight" || "$MODE" = "export" || "$MODE" = "career-current-authority" ]]
          [[ "$EXPECTED_CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_ACTIVE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          if [ "$MODE" = "career-current-authority" ]; then
            test "$EXPECTED_ACTIVE_REVISION" = "$EXPECTED_CONTROL_PLANE_SHA"
            [[ "$EXPECTED_PROJECTION_SHA256" =~ ^[0-9a-f]{64}$ ]]
            test -z "$EXPECTED_MEDIA_HOST_SET_SHA256"
            [[ "$OPERATION_KEY" =~ ^[0-9a-f]{64}$ ]]
            expected="I explicitly approve SELECT-only production Career Current authority export for active SHA ${EXPECTED_ACTIVE_REVISION} control SHA ${EXPECTED_CONTROL_PLANE_SHA} projection SHA256 ${EXPECTED_PROJECTION_SHA256}."
            test "$OPERATOR_APPROVAL_PHRASE" = "$expected"
          elif [ "$MODE" = "export" ]; then
            [[ "$EXPECTED_PROJECTION_SHA256" =~ ^[0-9a-f]{64}$ ]]
            [[ "$EXPECTED_MEDIA_HOST_SET_SHA256" =~ ^[0-9a-f]{64}$ ]]
          else
            [[ "$EXPECTED_PROJECTION_SHA256" =~ ^[0-9a-f]{64}$ ]]
            test -z "$EXPECTED_MEDIA_HOST_SET_SHA256"
          fi
          if [ "$MODE" != "career-current-authority" ]; then
            expected="I explicitly approve SELECT-only production Greenfield current-baseline ${MODE} for active SHA ${EXPECTED_ACTIVE_REVISION} control SHA ${EXPECTED_CONTROL_PLANE_SHA} projection SHA256 ${EXPECTED_PROJECTION_SHA256}."
            if [ "$MODE" = "export" ]; then
              expected="${expected%?} media host-set SHA256 ${EXPECTED_MEDIA_HOST_SET_SHA256}."
            fi
            test "$OPERATOR_APPROVAL_PHRASE" = "$expected"
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_CONTROL_PLANE_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_CONTROL_PLANE_SHA"

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: mbstring, intl, curl, json, openssl, fileinfo, pdo, pdo_sqlite, sqlite3, pdo_mysql

      - name: Cache Composer
        if: inputs.mode != 'career-current-authority'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            backend/vendor
            ~/.composer/cache/files
          key: ${{ runner.os }}-php84-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php84-

      - name: Install control-plane dependencies
        if: inputs.mode != 'career-current-authority'
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p storage/framework/cache/data storage/framework/views storage/framework/sessions storage/logs bootstrap/cache
          composer install --no-interaction --prefer-dist --no-progress

      - name: Set up pinned production SSH identity
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known hosts
        shell: bash
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          RETIRED_DEPLOY_HOST: ${{ secrets.PRODUCTION_RETIRED_DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS"
          for name in DEPLOY_USER DEPLOY_PORT DEPLOY_HOST RETIRED_DEPLOY_HOST DEPLOY_PATH; do
            test -n "${!name:-}"
          done
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          test "$DEPLOY_PORT" -ge 1
          test "$DEPLOY_PORT" -le 65535
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$RETIRED_DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          test "$DEPLOY_HOST" != "$RETIRED_DEPLOY_HOST"
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_PATH" != *".."* ]]
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null \
            || ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f ~/.ssh/known_hosts >/dev/null

      - name: Export one-time Career Current authority
        if: inputs.mode == 'career-current-authority'
        shell: bash
        env:
          DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          dir=artifacts/career-current-authority-export
          mkdir -p "$dir"
          raw="$RUNNER_TEMP/career-current-authority-export.ndjson"
          remote_receipt="$RUNNER_TEMP/career-current-authority-export.remote-receipt.json"
          remote_stderr="$RUNNER_TEMP/career-current-authority-export.stderr"
          jq -n '{
            contract_version: "career.current_authority_export.v1",
            status: "PENDING_CURRENT_AUTHORITY_EXPORT_VALIDATION",
            production_read_only_requested: true,
            zero_write_confirmed: false,
            automatic_retry_allowed: false
          }' > "$dir/receipt.json"
          printf -v q_path '%q' "$DEPLOY_PATH"
          printf -v q_release '%q' "$EXPECTED_ACTIVE_REVISION"
          printf -v q_projection '%q' "$EXPECTED_PROJECTION_SHA256"
          printf -v q_run '%q' "$GITHUB_RUN_ID"
          printf -v q_attempt '%q' "$GITHUB_RUN_ATTEMPT"
          remote="set -euo pipefail; current=\$(readlink -f $q_path/current); test -n \"\$current\"; test \"\$(tr -d '\\r\\n' < \"\$current/REVISION\")\" = $q_release; test ! -e $q_path/.dep/deploy.lock; release_name=\$(basename \"\$current\"); sudo -n -u www-data -- env CAREER_CURRENT_EXPORT_EXECUTE=1 CAREER_CURRENT_EXPORT_BACKEND_ROOT=\"\$current/backend\" CAREER_CURRENT_EXPORT_RELEASE_SHA=$q_release CAREER_CURRENT_EXPORT_EXPECTED_PROJECTION_SHA256=$q_projection CAREER_CURRENT_EXPORT_RELEASE_NAME=\"\$release_name\" CAREER_CURRENT_EXPORT_WORKFLOW_RUN_ID=$q_run CAREER_CURRENT_EXPORT_WORKFLOW_RUN_ATTEMPT=$q_attempt php"
          set +e
          # shellcheck disable=SC2016
          php -r '
            $source = file_get_contents("backend/scripts/operations/career_current_authority_export.php");
            if (! is_string($source)) {
                exit(1);
            }
            echo $source;
          ' | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "$remote" > "$raw" 2> "$remote_stderr"
          pipeline_status=("${PIPESTATUS[@]}")
          producer_status="${pipeline_status[0]}"
          remote_status="${pipeline_status[1]}"
          set -e
          if [ "$producer_status" -ne 0 ]; then
            jq -n '{
              contract_version: "career.current_authority_export.v1",
              status: "FAIL_CURRENT_AUTHORITY_EXPORT",
              safe_error_code: "CAREER_CURRENT_LOCAL_SOURCE_RENDER_FAILED",
              production_read_only_requested: true,
              zero_write_confirmed: false,
              automatic_retry_allowed: false
            }' > "$dir/receipt.json"
            echo "::error::CAREER_CURRENT_LOCAL_SOURCE_RENDER_FAILED"
            exit 1
          fi
          if ! head -n 1 "$raw" | jq -e '.kind == "meta" and (.receipt | type == "object")' >/dev/null 2>&1; then
            jq -n '{
              contract_version: "career.current_authority_export.v1",
              status: "FAIL_CURRENT_AUTHORITY_EXPORT",
              safe_error_code: "CAREER_CURRENT_REMOTE_EXPORT_FAILED",
              production_read_only_requested: true,
              zero_write_confirmed: false,
              automatic_retry_allowed: false
            }' > "$dir/receipt.json"
            echo "::error::CAREER_CURRENT_REMOTE_EXPORT_FAILED"
            exit 1
          fi
          head -n 1 "$raw" | jq -S '.receipt' > "$remote_receipt"
          if [ "$remote_status" -ne 0 ]; then
            if jq -e '.status == "FAIL_CURRENT_AUTHORITY_EXPORT"' "$remote_receipt" >/dev/null; then
              safe_code="$(jq -er '.safe_error_code | select(test("^[A-Z0-9_]+$"))' "$remote_receipt" 2>/dev/null || true)"
              test -n "$safe_code" || safe_code="CAREER_CURRENT_REMOTE_EXPORT_FAILED"
            else
              safe_code="CAREER_CURRENT_REMOTE_STREAM_INTERRUPTED"
              jq -n --arg safe_error_code "$safe_code" '{
                contract_version: "career.current_authority_export.v1",
                status: "FAIL_CURRENT_AUTHORITY_EXPORT",
                safe_error_code: $safe_error_code,
                production_read_only_requested: true,
                zero_write_confirmed: false,
                automatic_retry_allowed: false
              }' > "$dir/receipt.json"
            fi
            echo "::error::$safe_code"
            exit 1
          fi
          test "$(wc -l < "$raw" | tr -d ' ')" = 1047
          tail -n +2 "$raw" > "$dir/assets.jsonl"
          head -n 1 "$raw" | jq -e '.receipt.status == "PASS_CURRENT_AUTHORITY_EXPORT"' >/dev/null
          head -n 1 "$raw" | jq -S '.manifest' > "$dir/manifest.json"

      - name: Validate Career Current artifact and zero-write receipt
        if: inputs.mode == 'career-current-authority'
        shell: bash
        run: |
          set -euo pipefail
          dir=artifacts/career-current-authority-export
          remote_receipt="$RUNNER_TEMP/career-current-authority-export.remote-receipt.json"
          assets_sha="$(sha256sum "$dir/assets.jsonl" | awk '{print $1}')"
          jq -e --arg release "$EXPECTED_ACTIVE_REVISION" --arg projection "$EXPECTED_PROJECTION_SHA256" --arg assets "$assets_sha" '
            .contract_version == "career.current_authority_export.v1"
            and .status == "PASS_CURRENT_AUTHORITY_EXPORT"
            and .release_sha == $release
            and .career_runtime_projection_sha256 == $projection
            and .counts.careers == 1046
            and .counts.locale_pages == 2092
            and .counts.public_projection_locale_pages == 2090
            and .counts.manual_hold_locale_pages == 2
            and .counts.components_per_page == 26
            and .counts.numeric_rating_statement_residue_count == 0
            and .assets_sha256 == $assets
            and .database_query_count > 0
            and .database_query_verbs == ["select"]
            and .database_write_count == 0
            and .cache_write_count == 0
            and .pointer_write_count == 0
            and .discoverability_write_count == 0
            and .cms_write_count == 0
            and .sitemap_write_count == 0
            and .llms_write_count == 0
            and .search_submission_count == 0
            and .remote_file_write_count == 0
            and .database_public_content_sha256 == .active_cache_public_content_sha256
            and .database_public_content_sha256 == .api_public_content_sha256
            and .hashes_match == true
            and .not_repository_authority == true
          ' "$remote_receipt" >/dev/null
          jq -e --arg assets "$assets_sha" '
            .contract_version == "career.current_authority_manifest.v1"
            and .counts.careers == 1046
            and .counts.locale_pages == 2092
            and .counts.public_projection_locale_pages == 2090
            and .counts.manual_hold_locale_pages == 2
            and .counts.components_per_page == 26
            and .files[0].sha256 == $assets
            and (.exported_field_set_sha256 | keys | length) == 13
          ' "$dir/manifest.json" >/dev/null
          test "$(wc -l < "$dir/assets.jsonl" | tr -d ' ')" = 1046
          jq -e -s 'length == 1046 and ([.[].canonical_slug] | unique | length) == 1046 and all(.[].component_order_json; length == 26)' "$dir/assets.jsonl" >/dev/null
          cp "$remote_receipt" "$dir/receipt.json"

      - name: Finalize failed Career Current receipt
        if: failure() && inputs.mode == 'career-current-authority'
        shell: bash
        run: |
          set -euo pipefail
          dir=artifacts/career-current-authority-export
          mkdir -p "$dir"
          jq -n '{
            contract_version: "career.current_authority_export.v1",
            status: "FAIL_CURRENT_AUTHORITY_EXPORT",
            safe_error_code: "CAREER_CURRENT_EXPORT_OR_VALIDATION_FAILED",
            production_read_only_requested: true,
            zero_write_confirmed: false,
            automatic_retry_allowed: false
          }' > "$dir/receipt.json"

      - name: Stream source snapshot through stdin without remote files
        if: inputs.mode != 'career-current-authority'
        shell: bash
        env:
          DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/greenfield"
          printf -v q_deploy_path '%q' "$DEPLOY_PATH"
          printf -v q_active_revision '%q' "$EXPECTED_ACTIVE_REVISION"
          set +e
          php -r '
            require "backend/app/Domain/GreenfieldBaseline/GreenfieldBaselineCatalog.php";
            require "backend/app/Domain/GreenfieldBaseline/GreenfieldBaselineSourceScript.php";
            echo (new App\Domain\GreenfieldBaseline\GreenfieldBaselineSourceScript)->render();
          ' | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH=$q_deploy_path EXPECTED_ACTIVE_REVISION=$q_active_revision php" \
            > "$RUNNER_TEMP/greenfield/source.jsonl" \
            2> "$RUNNER_TEMP/greenfield/source.stderr"
          pipeline_status=("${PIPESTATUS[@]}")
          producer_status="${pipeline_status[0]}"
          remote_status="${pipeline_status[1]}"
          set -e
          if [ "$producer_status" -ne 0 ]; then
            echo "::error::GREENFIELD_LOCAL_SOURCE_RENDER_FAILED"
            exit 1
          fi
          if [ "$remote_status" -ne 0 ]; then
            safe_code="$(grep -E '^(INVALID_[A-Z0-9_]+|ACTIVE_[A-Z0-9_]+|AUTOLOAD_MISSING|SOURCE_[A-Z0-9_]+|REQUIRED_SOURCE_TABLE_MISSING|CAREER_RUNTIME_PROJECTION_[A-Z0-9_]+|GREENFIELD_SOURCE_EXPORT_FAILED_STAGE_[A-Z0-9_]+)$' "$RUNNER_TEMP/greenfield/source.stderr" | tail -n 1 || true)"
            if [ -z "$safe_code" ]; then
              safe_code="GREENFIELD_REMOTE_SOURCE_STREAM_FAILED"
            fi
            echo "::error::$safe_code"
            exit 1
          fi
          test ! -s "$RUNNER_TEMP/greenfield/source.stderr"
          jq -e -c 'select(.type == "header") | .writes_committed == false' \
            "$RUNNER_TEMP/greenfield/source.jsonl" >/dev/null
          jq -e -c 'select(.type == "footer") | .writes_committed == false' \
            "$RUNNER_TEMP/greenfield/source.jsonl" >/dev/null

      - name: Build and verify deterministic package
        if: inputs.mode != 'career-current-authority'
        shell: bash
        env:
          APP_ENV: testing
          APP_KEY: greenfield_runner_only_key_32bytes
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: |
          set -euo pipefail
          package_args=(
            --stream="$RUNNER_TEMP/greenfield/source.jsonl"
            --output="$RUNNER_TEMP/greenfield/package"
            --expected-projection-sha256="$EXPECTED_PROJECTION_SHA256"
            --json
          )
          if [ "$MODE" = "export" ]; then
            package_args+=(
              --download-media
              --expected-media-host-set-sha256="$EXPECTED_MEDIA_HOST_SET_SHA256"
            )
          fi
          php backend/artisan greenfield:baseline:package "${package_args[@]}" \
            > "$RUNNER_TEMP/greenfield/package-summary.json"
          package_sha256="$(jq -er '.package_sha256' "$RUNNER_TEMP/greenfield/package-summary.json")"
          php backend/artisan greenfield:baseline:verify \
            --package="$RUNNER_TEMP/greenfield/package" \
            --expected-package-sha256="$package_sha256" \
            --json > "$RUNNER_TEMP/greenfield/verify.json"
          jq -e '
            .status == "ready"
            and .writes_committed == false
            and .dataset_counts.articles == 129
            and .dataset_counts.content_pages == 56
            and .dataset_counts.landing_surfaces == 15
            and .dataset_counts.personality_public_content_assets == 220
            and .dataset_counts.personality_profiles == 32
            and .dataset_counts.personality_profile_variants == 64
            and .dataset_counts.career_jobs == 378
            and .dataset_counts.career_guides == 20
            and .dataset_counts.occupations == 1046
            and .dataset_counts.career_job_ai_impact_assets == 2092
            and .dataset_counts.career_job_salary_assets == 2092
            and .dataset_counts.career_job_page_assembly_assets == 2092
            and .dataset_counts.media_assets == 111
            and .dataset_counts.media_variants == 660
            and .media.entry_count == 771
            and .media.downloaded == (env.MODE == "export")
            and .career_projection.sha256 == env.EXPECTED_PROJECTION_SHA256
            and .career_projection.tracked_slug_count == 342
            and .career_projection.public_slug_count == 30
            and .career_projection.state_counts.blocked == 622
            and .career_projection.state_counts.quarantined == 2
          ' "$RUNNER_TEMP/greenfield/verify.json" >/dev/null

      - name: Emit sanitized immutable receipt
        if: inputs.mode != 'career-current-authority'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          jq -n \
            --arg mode "$MODE" \
            --arg control_plane_sha "$EXPECTED_CONTROL_PLANE_SHA" \
            --arg active_revision "$EXPECTED_ACTIVE_REVISION" \
            --arg package_sha256 "$(jq -er '.package_sha256' "$RUNNER_TEMP/greenfield/verify.json")" \
            --arg projection_sha256 "$EXPECTED_PROJECTION_SHA256" \
            --arg media_host_set_sha256 "$(jq -er '.media.host_set_sha256' "$RUNNER_TEMP/greenfield/verify.json")" \
            --argjson dataset_counts "$(jq -c '.dataset_counts' "$RUNNER_TEMP/greenfield/verify.json")" \
            --argjson career_projection "$(jq -c '.career_projection' "$RUNNER_TEMP/greenfield/verify.json")" \
            --argjson media "$(jq -c '.media' "$RUNNER_TEMP/greenfield/verify.json")" \
            '{
              schema_version: "backend-greenfield-current-baseline.receipt.v1",
              status: "PASS_GREENFIELD_CURRENT_BASELINE_" + ($mode | ascii_upcase),
              mode: $mode,
              control_plane_sha: $control_plane_sha,
              active_revision: $active_revision,
              package_sha256: $package_sha256,
              projection_sha256: $projection_sha256,
              media_host_set_sha256: $media_host_set_sha256,
              dataset_counts: $dataset_counts,
              career_projection: $career_projection,
              media: $media,
              source_database_write: false,
              source_remote_file_write: false,
              database_import: false,
              deployment: false,
              service_restart: false,
              dns_change: false,
              queue_action: false,
              redis_action: false,
              writes_committed: false
            }' > artifacts/backend-greenfield-current-baseline-receipt.json
          jq -e '.writes_committed == false and .source_remote_file_write == false' \
            artifacts/backend-greenfield-current-baseline-receipt.json >/dev/null
          if [ "$MODE" = "export" ]; then
            cp -R "$RUNNER_TEMP/greenfield/package" artifacts/package
          fi

      - name: Upload preflight receipt
        if: inputs.mode == 'preflight'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-greenfield-current-baseline-preflight-${{ github.run_id }}
          path: artifacts/backend-greenfield-current-baseline-receipt.json
          if-no-files-found: error
          retention-days: 3

      - name: Upload verified current-published package
        if: inputs.mode == 'export'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-greenfield-current-baseline-export-${{ github.run_id }}
          path: artifacts
          if-no-files-found: error
          retention-days: 3

      - name: Upload Career Current authority artifact or failure receipt
        if: always() && inputs.mode == 'career-current-authority'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: career-current-authority-export-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/career-current-authority-export
          if-no-files-found: error
          retention-days: 3
