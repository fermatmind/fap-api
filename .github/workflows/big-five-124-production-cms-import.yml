name: Big Five 124 Production CMS Import

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run validates only; write performs the separately approved CMS import"
        required: true
        default: dry-run
        type: choice
        options: [dry-run, write]
      expected_release_sha:
        description: "Exact deployed release SHA that must contain the locked package"
        required: true
        type: string
      expected_seed_sha256:
        description: "Exact SHA-256 of the locked 124-asset V1 seed"
        required: true
        default: "8bb7166ce5eba0daf30044d990c6356fb108c80f453c964d831c849ef6f9c0ce"
        type: string
      operator_approval_phrase:
        description: "Exact release-SHA and seed-SHA-bound operator approval phrase"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: big-five-124-production-cms-import
  cancel-in-progress: false

jobs:
  production-cms-import:
    name: Big Five 124 CMS import (${{ inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
    env:
      DEPLOY_USER: ubuntu
      DEPLOY_HOST: 139.224.130.204
      DEPLOY_PORT: "22"
      DEPLOY_PATH: /var/www/fap-api
      PACKAGE_RELATIVE_PATH: generated/big-five-124-publish-import-dryrun/big_five_124_merged_v1_seed.json
      EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
      EXPECTED_SEED_SHA256: ${{ inputs.expected_seed_sha256 }}
      IMPORT_MODE: ${{ inputs.mode }}
      OPERATOR_APPROVAL_PHRASE: ${{ inputs.operator_approval_phrase }}

    steps:
      - name: Validate exact authorization inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_RELEASE_SHA" =~ ^[a-fA-F0-9]{40}$ ]]
          [[ "$EXPECTED_SEED_SHA256" =~ ^[a-fA-F0-9]{64}$ ]]
          expected_phrase="批准 BIG5 124 production CMS import, release SHA ${EXPECTED_RELEASE_SHA}, seed SHA-256 ${EXPECTED_SEED_SHA256}"
          test "$OPERATOR_APPROVAL_PHRASE" = "$expected_phrase"
          case "$IMPORT_MODE" in dry-run|write) ;; *) exit 2 ;; esac

      - name: Set up production SSH identity
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known hosts
        shell: bash
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify release, seed, topology, and run bounded importer
        shell: bash
        run: |
          set -euo pipefail
          receipt_dir="$RUNNER_TEMP/big-five-124-cms-import"
          mkdir -p "$receipt_dir"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' PACKAGE_RELATIVE_PATH='$PACKAGE_RELATIVE_PATH' EXPECTED_RELEASE_SHA='$EXPECTED_RELEASE_SHA' EXPECTED_SEED_SHA256='$EXPECTED_SEED_SHA256' IMPORT_MODE='$IMPORT_MODE' bash -s" \
            <<'REMOTE' | tee "$receipt_dir/receipt.txt"
          set -euo pipefail
          RELEASE_ROOT="$DEPLOY_PATH/current"
          BACKEND_ROOT="$RELEASE_ROOT/backend"
          SOURCE="$RELEASE_ROOT/$PACKAGE_RELATIVE_PATH"
          test -d "$BACKEND_ROOT"
          test -f "$SOURCE"

          if [ -f "$RELEASE_ROOT/REVISION" ]; then
            DEPLOYED_SHA="$(tr -d '\n' < "$RELEASE_ROOT/REVISION")"
          else
            DEPLOYED_SHA="$(git -C "$RELEASE_ROOT" rev-parse HEAD)"
          fi
          echo "deployed_release_sha=$DEPLOYED_SHA"
          test "$DEPLOYED_SHA" = "$EXPECTED_RELEASE_SHA"

          ACTUAL_SEED_SHA256="$(sha256sum "$SOURCE" | awk '{print $1}')"
          echo "seed_sha256=$ACTUAL_SEED_SHA256"
          test "$ACTUAL_SEED_SHA256" = "$EXPECTED_SEED_SHA256"

          php -r '
          $payload = json_decode((string) file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR);
          if (($payload["package"] ?? "") !== "big-five-124-publish-import-dryrun-2026-07-11") { throw new RuntimeException("unexpected package"); }
          if (($payload["contract_version"] ?? "") !== "personality_public_asset.v1") { throw new RuntimeException("unexpected contract"); }
          $assets = $payload["assets"] ?? null;
          if (!is_array($assets) || count($assets) !== 124) { throw new RuntimeException("expected exactly 124 assets"); }
          $aliases = array_fill_keys(["emotional-stability", "high-agreeableness", "high-conscientiousness", "high-extraversion", "high-neuroticism", "high-openness", "low-agreeableness", "low-conscientiousness", "low-extraversion", "low-openness"], true);
          $identities = []; $locales = []; $canonical = 0; $redirectOnly = 0;
          foreach ($assets as $asset) {
              if (!is_array($asset) || ($asset["framework"] ?? null) !== "big_five") { throw new RuntimeException("invalid framework"); }
              $locale = (string) ($asset["locale"] ?? "");
              $entityType = (string) ($asset["entity_type"] ?? "");
              $entityKey = (string) ($asset["entity_key"] ?? "");
              $identity = implode("|", [$locale, $entityType, $entityKey]);
              if ($locale === "" || $entityType === "" || $entityKey === "" || isset($identities[$identity])) { throw new RuntimeException("duplicate or empty identity"); }
              $identities[$identity] = true; $locales[$locale] = ($locales[$locale] ?? 0) + 1;
              $isAlias = $locale === "zh-CN" && isset($aliases[$entityKey]);
              if ($isAlias) {
                  $redirectOnly++;
                  if (($asset["robots"] ?? null) !== "noindex,follow" || ($asset["index_eligible"] ?? null) !== false || ($asset["sitemap_eligible"] ?? null) !== false || ($asset["llms_eligible"] ?? null) !== false) { throw new RuntimeException("redirect alias noindex gate failed"); }
              } else {
                  $canonical++;
                  if (!is_array($asset["sections"] ?? null) || count($asset["sections"]) < 9) { throw new RuntimeException("canonical sections gate failed"); }
                  foreach ($asset["sections"] as $section) {
                      if (!is_array($section) || trim((string) ($section["body_md"] ?? "")) === "" || array_key_exists("bodyMd", $section)) { throw new RuntimeException("body_md gate failed"); }
                  }
              }
          }
          if (($locales["zh-CN"] ?? 0) !== 62 || ($locales["en"] ?? 0) !== 62 || count($identities) !== 124 || $canonical !== 114 || $redirectOnly !== 10) { throw new RuntimeException("124 topology gate failed"); }
          echo "assets_found=124\ncanonical_assets=114\nredirect_only_aliases=10\nseed_contract=pass\n";
          ' "$SOURCE"

          cd "$BACKEND_ROOT"
          php artisan personality-public-assets:import --no-ansi --source="../$PACKAGE_RELATIVE_PATH" | tee /tmp/big-five-124-dry-run.txt
          for expected in dry_run=1 assets_found=124 valid_count=124 errors_count=0; do grep -Fx "$expected" /tmp/big-five-124-dry-run.txt >/dev/null; done
          if [ "$IMPORT_MODE" = "write" ]; then
            php artisan personality-public-assets:import --no-ansi --source="../$PACKAGE_RELATIVE_PATH" --write | tee /tmp/big-five-124-write.txt
            for expected in dry_run=0 assets_found=124 valid_count=124 errors_count=0; do grep -Fx "$expected" /tmp/big-five-124-write.txt >/dev/null; done
          fi
          REMOTE

      - name: Publish bounded import receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: big-five-124-cms-import-receipt
          path: ${{ runner.temp }}/big-five-124-cms-import/receipt.txt
          if-no-files-found: warn
          retention-days: 30
