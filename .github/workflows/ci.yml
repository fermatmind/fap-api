name: CI

on:
  push:
    branches: [main]

permissions:
  actions: read
  attestations: write
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.repository }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  classify:
    name: classify exact SHA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      base_sha: ${{ steps.classify.outputs.base_sha }}
      deploy: ${{ steps.classify.outputs.deploy }}
      application: ${{ steps.classify.outputs.application }}
      content: ${{ steps.classify.outputs.content }}
      migration: ${{ steps.classify.outputs.migration }}
      payment: ${{ steps.classify.outputs.payment }}
      cache: ${{ steps.classify.outputs.cache }}
      seo: ${{ steps.classify.outputs.seo }}
      infrastructure: ${{ steps.classify.outputs.infrastructure }}
      tests_changed: ${{ steps.classify.outputs.tests_changed }}
      publisher_required: ${{ steps.classify.outputs.publisher_required }}
      career_current_authority_release: ${{ steps.classify.outputs.career_current_authority_release }}
      personality_current_authority_release: ${{ steps.classify.outputs.personality_current_authority_release }}
      seo_platform_10_closeout: ${{ steps.classify.outputs.seo_platform_10_closeout }}
      seo_platform_11a_closeout: ${{ steps.classify.outputs.seo_platform_11a_closeout }}
      seo_agent_evidence_boundary: ${{ steps.classify.outputs.seo_agent_evidence_boundary }}
      seo_agent_policy_gateway: ${{ steps.classify.outputs.seo_agent_policy_gateway }}
      seo_council_orchestration: ${{ steps.classify.outputs.seo_council_orchestration }}
      seo_competitive_evidence: ${{ steps.classify.outputs.seo_competitive_evidence }}
      classification: ${{ steps.classify.outputs.classification }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
      - id: classify
        name: Resolve deterministic before-to-SHA path union
        shell: bash
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base_sha="$PUSH_BEFORE"
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
          if [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
            echo "Indeterminate/force-push baseline is not deployable." >&2
            exit 1
          fi
          git cat-file -e "${base_sha}^{commit}"
          git merge-base --is-ancestor "$base_sha" "$GITHUB_SHA"
          git diff --no-renames --name-only -z "$base_sha" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-paths"
          test -s "$RUNNER_TEMP/changed-paths"
          node .github/trunk/classify-paths.mjs "$RUNNER_TEMP/changed-paths" > "$RUNNER_TEMP/classification.json"
          compact="$(jq -c . "$RUNNER_TEMP/classification.json")"
          {
            echo "base_sha=$base_sha"
            echo "deploy=$(jq -r .deploy "$RUNNER_TEMP/classification.json")"
            echo "application=$(jq -r .flags.application_code "$RUNNER_TEMP/classification.json")"
            echo "content=$(jq -r .flags.content_assets "$RUNNER_TEMP/classification.json")"
            echo "migration=$(jq -r .flags.backward_compatible_migration "$RUNNER_TEMP/classification.json")"
            echo "payment=$(jq -r .flags.payment "$RUNNER_TEMP/classification.json")"
            echo "cache=$(jq -r .flags.cache_runtime_projection "$RUNNER_TEMP/classification.json")"
            echo "seo=$(jq -r .flags.seo_discoverability "$RUNNER_TEMP/classification.json")"
            echo "infrastructure=$(jq -r .flags.infrastructure_deployment "$RUNNER_TEMP/classification.json")"
            echo "tests_changed=$(jq -r .tests_changed "$RUNNER_TEMP/classification.json")"
            echo "publisher_required=$(jq -r .operations.publisher_required "$RUNNER_TEMP/classification.json")"
            echo "career_current_authority_release=$(jq -r .operations.career_current_authority_release "$RUNNER_TEMP/classification.json")"
            echo "career_data_recovery=$(jq -r .operations.career_data_recovery "$RUNNER_TEMP/classification.json")"
            echo "personality_current_authority_release=$(jq -r .operations.personality_current_authority_release "$RUNNER_TEMP/classification.json")"
            echo "seo_platform_10_closeout=$(jq -r .operations.seo_platform_10_closeout "$RUNNER_TEMP/classification.json")"
            echo "seo_platform_11a_closeout=$(jq -r .operations.seo_platform_11a_closeout "$RUNNER_TEMP/classification.json")"
            echo "seo_agent_evidence_boundary=$(jq -r .operations.seo_agent_evidence_boundary "$RUNNER_TEMP/classification.json")"
            echo "seo_agent_policy_gateway=$(jq -r .operations.seo_agent_policy_gateway "$RUNNER_TEMP/classification.json")"
            echo "seo_council_orchestration=$(jq -r .operations.seo_council_orchestration "$RUNNER_TEMP/classification.json")"
            echo "seo_competitive_evidence=$(jq -r .operations.seo_competitive_evidence "$RUNNER_TEMP/classification.json")"
            echo "classification=$compact"
          } >> "$GITHUB_OUTPUT"
          cp "$RUNNER_TEMP/classification.json" trunk-path-classification.json
      - name: Test classifier and migration policy
        run: node --test .github/trunk/*.test.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trunk-classification-${{ github.sha }}
          path: trunk-path-classification.json
          if-no-files-found: error
          retention-days: 30

  hygiene:
    name: hygiene
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - run: bash backend/scripts/ci/guard_no_committed_secrets.sh
      - run: bash backend/scripts/cae_gate.sh
      - run: git diff --check ${{ needs.classify.outputs.base_sha }} ${{ github.sha }}
      - name: Validate workflow source when deployment control changed
        if: needs.classify.outputs.infrastructure == 'true'
        run: >-
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          .github/workflows/ci.yml
          .github/workflows/deploy.yml
          .github/workflows/nightly.yml
          .github/workflows/recovery.yml

  supply-chain:
    name: supply-chain
    needs: [classify, hygiene]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - working-directory: backend
        run: composer validate --strict
      - name: Focused dependency audit
        if: needs.classify.outputs.application == 'true' || needs.classify.outputs.payment == 'true' || needs.classify.outputs.infrastructure == 'true'
        working-directory: backend
        run: composer audit --locked --no-interaction --ignore-unreachable

  content-pack-build-validate:
    name: content-pack-build-validate
    needs: [classify, hygiene]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        if: needs.classify.outputs.content == 'true' || needs.classify.outputs.personality_current_authority_release == 'true'
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - name: Validate the current authority pack only
        if: needs.classify.outputs.content == 'true' || needs.classify.outputs.personality_current_authority_release == 'true'
        working-directory: backend
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp -n .env.example .env || true
          php artisan key:generate --force
          php artisan career:current-manifest
          php artisan personality:current-manifest
          if [ '${{ needs.classify.outputs.career_current_authority_release }}' = 'true' ]; then
            bash scripts/ci/verify_career_current_authority_release.sh
          fi
          mkdir -p storage/app/private/content_packs_index
          php artisan content-packs:index:build --output=storage/app/private/content_packs_index/content-packs-index.json --json
          php artisan test --filter='(ContentPacksIndexArtifact|ContentLint|ContentCompile)' --no-ansi
      - if: needs.classify.outputs.content != 'true' && needs.classify.outputs.personality_current_authority_release != 'true'
        run: echo "No content authority path changed."

  verify-mbti:
    name: verify-mbti-${{ matrix.mode }}
    needs: [classify, hygiene]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [legacy, v2]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        if: needs.classify.outputs.deploy == 'true' || needs.classify.outputs.tests_changed == 'true'
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: mbstring, intl, pdo_sqlite, sqlite3, pdo_mysql, redis
      - name: Install focused-test dependencies
        if: needs.classify.outputs.deploy == 'true' || needs.classify.outputs.tests_changed == 'true'
        working-directory: backend
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp -n .env.example .env || true
          php artisan key:generate --force
      - name: Validate expand-only migrations
        if: needs.classify.outputs.migration == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t migrations < <(git diff --diff-filter=AM --name-only '${{ needs.classify.outputs.base_sha }}' '${{ github.sha }}' -- 'backend/database/migrations/*.php' 'backend/database/migrations/**/*.php')
          test "${#migrations[@]}" -gt 0
          node .github/trunk/validate-migrations.mjs "${migrations[@]}"
          cd backend
          mapfile -t default_migrations < <(printf '%s\n' "${migrations[@]}" | grep -E '^backend/database/migrations/[^/]+\.php$' || true)
          mapfile -t seo_intel_migrations < <(printf '%s\n' "${migrations[@]}" | grep -E '^backend/database/migrations/seo_intel/[^/]+\.php$' || true)
          if [ "${#default_migrations[@]}" -gt 0 ]; then
            DB_DATABASE="$RUNNER_TEMP/fap-ci.sqlite" bash scripts/ci/prepare_sqlite.sh
            php artisan migrate --force --no-interaction --ansi
          fi
          if [ "${#seo_intel_migrations[@]}" -gt 0 ]; then
            export APP_CONFIG_CACHE="$RUNNER_TEMP/seo-intel-config.php"
            DB_DATABASE="$RUNNER_TEMP/fap-ci-primary.sqlite" bash scripts/ci/prepare_sqlite.sh
            php artisan config:cache --no-ansi
            # shellcheck disable=SC2016
            SEO_INTEL_CI_DATABASE="$RUNNER_TEMP/fap-ci-seo-intel.sqlite" php -r '
              $path = getenv("APP_CONFIG_CACHE");
              $config = require $path;
              $config["database"]["connections"]["seo_intel"] = [
                "driver" => "sqlite", "database" => getenv("SEO_INTEL_CI_DATABASE"),
                "prefix" => "", "foreign_key_constraints" => false,
              ];
              file_put_contents($path, "<?php return ".var_export($config, true).";\n");
            '
            touch "$RUNNER_TEMP/fap-ci-seo-intel.sqlite"
            php artisan migrate --database=seo_intel --path=database/migrations/seo_intel --force --no-interaction --ansi
          fi
      - name: Focused runtime contracts
        if: needs.classify.outputs.deploy == 'true'
        working-directory: backend
        env:
          FEATURE_SELFCHECK_V2: ${{ matrix.mode == 'v2' && 'true' || 'false' }}
          FEATURE_LEGACY_MBTI_REPORT_PAYLOAD_V2: ${{ matrix.mode == 'v2' && 'true' || 'false' }}
          FEATURE_PAYMENT_WEBHOOK_V2: ${{ matrix.mode == 'v2' && 'true' || 'false' }}
          FEATURE_CONTENT_STORE_V2: ${{ matrix.mode == 'v2' && 'true' || 'false' }}
        run: |
          php artisan test tests/Unit/Security/SecurityGuardrailsTest.php --no-ansi
          if [ '${{ needs.classify.outputs.payment }}' = 'true' ]; then php artisan test tests/Feature/Commerce tests/Unit/Services/Commerce --no-ansi; fi
          if [ '${{ needs.classify.outputs.cache }}' = 'true' ]; then php artisan test --filter='(Cache|Projection|Redis|Fence|Lkg)' --no-ansi; fi
          if [ '${{ needs.classify.outputs.seo }}' = 'true' ] && [ '${{ needs.classify.outputs.tests_changed }}' != 'true' ]; then
            echo "::error::SEO runtime changes must include focused changed tests."
            exit 1
          fi
      - name: Execute changed PHP tests for tests-only and mixed scopes
        if: matrix.mode == 'legacy' && needs.classify.outputs.tests_changed == 'true'
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed_php_test_paths < <(git diff --diff-filter=AM --name-only '${{ needs.classify.outputs.base_sha }}' '${{ github.sha }}' | grep -E '^backend/tests/.+Test\.php$' || true)
          mapfile -t changed_tests < <(git diff --diff-filter=AM --name-only '${{ needs.classify.outputs.base_sha }}' '${{ github.sha }}' -- ':(top)backend/tests/**/*Test.php' | sed 's#^backend/##')
          if [ "${#changed_php_test_paths[@]}" -ne "${#changed_tests[@]}" ]; then
            echo "::error::Changed PHP tests were not fully selected: expected ${#changed_php_test_paths[@]}, selected ${#changed_tests[@]}." >&2
            exit 1
          fi
          if [ "${#changed_tests[@]}" -gt 0 ]; then php artisan test "${changed_tests[@]}" --no-ansi; fi
      - if: needs.classify.outputs.deploy != 'true'
        run: echo "Docs/rules/tests-only scope does not deploy."

  verify-bigfive:
    name: verify-bigfive
    needs: [classify, hygiene]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        if: needs.classify.outputs.content == 'true' || needs.classify.outputs.application == 'true'
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: mbstring, intl, pdo_sqlite, sqlite3, redis
      - name: Focused Big Five regression
        if: needs.classify.outputs.content == 'true' || needs.classify.outputs.application == 'true'
        working-directory: backend
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp -n .env.example .env || true
          php artisan key:generate --force
          bash scripts/ci/prepare_sqlite.sh
          php artisan test --filter='(BigFive|Big5|NonMbtiReportContractRegressionTest)' --no-ansi
      - if: needs.classify.outputs.content != 'true' && needs.classify.outputs.application != 'true'
        run: echo "Big Five runtime boundary unchanged."

  career-publisher-parity:
    name: Career Current package scan
    needs: [classify, hygiene]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        if: needs.classify.outputs.publisher_required == 'true'
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: mbstring, intl, pdo_sqlite, sqlite3, redis
      - name: Run fixed slice, deterministic 2092-page package scan, and Redis 6 capacity gate
        if: needs.classify.outputs.publisher_required == 'true'
        working-directory: backend
        env:
          CAREER_PARITY_RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist --no-progress
          cp -n .env.example .env || true
          php artisan key:generate --force
          bash scripts/ci/verify_career_current_authority_parity.sh > career-current-authority-parity.json
          jq -e --arg sha "$GITHUB_SHA" '
            .contract_version == "career.current_authority_package_scan.v1"
            and .status == "pass"
            and .mode == "package"
            and .release_sha == $sha
            and .architecture_slice.status == "pass"
            and .architecture_slice.counts.locale_pages == 4
            and .full_scan.counts.slugs == 1046
            and .full_scan.counts.locale_pages == 2092
            and .full_scan.counts.encoded == 2092
            and .full_scan.counts.decoded == 2092
            and .redis.disposable_probe_write_count == 6276
            and ([.write_counts[]] | all(. == 0))
            and (.receipt_digest | test("^[0-9a-f]{64}$"))
          ' career-current-authority-parity.json >/dev/null
      - name: Record non-required publisher receipt
        if: needs.classify.outputs.publisher_required != 'true'
        run: >-
          jq -n --arg sha "$GITHUB_SHA"
          '{contract_version:"career.current_authority_package_scan.v1",status:"skipped",mode:"package",release_sha:$sha,receipt_digest:null}'
          > backend/career-current-authority-parity.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: career-current-authority-parity-${{ github.sha }}
          path: backend/career-current-authority-parity.json
          if-no-files-found: error
          retention-days: 90

  seo-platform-11a-closeout:
    name: SEO Platform 11A exact-tree reconciliation
    needs: classify
    if: needs.classify.outputs.seo_platform_11a_closeout == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
      - id: web
        name: Resolve frozen fap-web commit
        shell: bash
        run: |
          set -euo pipefail
          web_sha="$(jq -er '.source_repository_snapshots[] | select(.repository == "fap-web") | .sha' backend/docs/seo/generated/seo-platform-11a-inventory.v3.json)"
          [[ "$web_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "web_sha=$web_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: fermatmind/fap-web
          ref: ${{ steps.web.outputs.web_sha }}
          path: _fap-web-exact
          fetch-depth: 1
          persist-credentials: false
      - name: Verify current API tree against exact frozen web tree
        shell: bash
        env:
          WEB_SHA: ${{ steps.web.outputs.web_sha }}
        run: |
          set -euo pipefail
          test "$(git -C _fap-web-exact rev-parse HEAD)" = "$WEB_SHA"
          gate="$(node backend/scripts/seo/reconcile_seo_platform_11a_inventory.mjs \
            --verify-reconciliation --api-root=. --web-root=_fap-web-exact)"
          jq --arg sha "$GITHUB_SHA" --arg web_sha "$WEB_SHA" \
            '. + {delivery_sha:$sha,fap_web_sha:$web_sha}' <<< "$gate" > seo-platform-11a-closeout.json
          jq -e --arg sha "$GITHUB_SHA" --arg web_sha "$WEB_SHA" '
            .ok == true
            and .delivery_sha == $sha
            and .fap_web_sha == $web_sha
            and .missing_paths == 0
            and .unexpected_paths == 0
            and .hash_drift == 0
            and .unclassified == 0
            and .missing_disposition == 0
            and .duplicate_paths == 0
            and .duplicate_asset_id == 0
            and .web_seo_scripts == 139
            and (.api_path_set_hash | test("^[0-9a-f]{64}$"))
            and (.inventory_self_hash | test("^[0-9a-f]{64}$"))
          ' seo-platform-11a-closeout.json >/dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: seo-platform-11a-closeout-${{ github.sha }}
          path: seo-platform-11a-closeout.json
          if-no-files-found: error
          retention-days: 90

  seo-agent-evidence-boundary:
    name: SEO Platform 11B evidence privacy boundary
    needs: classify
    if: needs.classify.outputs.seo_agent_evidence_boundary == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Verify contracts and focused 11B boundaries
        working-directory: backend
        run: |
          set -euo pipefail
          php scripts/seo/export_seo_agent_evidence_contracts.php > "$RUNNER_TEMP/manifest-hash"
          git diff --exit-code -- docs/seo/generated/seo-agent-evidence-contract-manifest.v2.json
          php artisan test --compact tests/Feature/SeoIntel/SeoPlatform11B*.php
          php artisan seo:evidence-boundary-closeout --expected-sha="$GITHUB_SHA" --json > ../seo-agent-evidence-boundary-closeout.json
          jq -e --arg sha "$GITHUB_SHA" '
            .contract_version == "seo.evidence_boundary_closeout.v4"
            and .release_sha == $sha
            and (.dependency_status == "READY" or .dependency_status == "DEPENDENCY_HOLD")
            and .execution_allowed == false
            and .bundle_write_enabled == false
            and .context_build_enabled == false
            and .external_fetch_enabled == false
            and .retention_delete_enabled == false
            and .query_hmac_dual_write_enabled == false
            and .agent_external_egress == false
            and .allowed_sources_count == 0
            and .read_only_gsc == true
            and .search_submission_allowed == false
            and .post12_agent_write_enabled == false
            and .l4_state == "dormant_not_authorized"
            and .self_checks.private_route_probes == {total:36,rejected:36,bypass:0}
            and .self_checks.pii_evasion_probes.bypass == 0
            and .self_checks.invalid_context_scope.ready == 0
            and .self_checks.metadata_privacy_probes == {
              total:52,
              factory:{total:19,rejected:19,bypass:0},
              verifier:{total:27,rejected:27,bypass:0},
              context_builder:{total:6,held:6,fully_sanitized:6,bypass:0}
            }
            and .self_checks.payment_identifier_evasion_probes == {
              malicious_total:9,rejected:9,bypass:0,
              scanner:{total:3,rejected:3,bypass:0},
              factory:{total:3,rejected:3,bypass:0},
              verifier:{total:3,rejected:3,bypass:0},
              valid_hash_chain:{total:3,passed:3},valid_hash_false_positive:0
            }
            and .self_checks.gateway.rate_limit == "pass"
            and .self_checks.gateway.concurrency == "pass"
            and .self_checks.gateway.allowed_fields == "pass"
            and .self_checks.gateway.retention_mapping == "pass"
            and .model_calls == 0 and .tool_calls == 0 and .external_calls == 0 and .business_writes == 0
            and .negative_guarantees.agent_runtime_created == false
            and .negative_guarantees.agent_write_permissions == 0
            and .negative_guarantees.cms_write == 0
            and .negative_guarantees.search_submission == 0
            and .negative_guarantees.url_truth_write == 0
            and (.receipt_hash | test("^[a-f0-9]{64}$"))
