name: Career 1046 Product Data Staging Production Ops

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Zero-write preflight or exact receipt-bound immutable generation staging
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - apply
      expected_control_plane_sha:
        description: Exact latest main SHA containing this control plane
        required: true
        type: string
      expected_release_sha:
        description: Exact active production SHA; must equal the control-plane SHA
        required: true
        type: string
      expected_release_name:
        description: Exact active production release name
        required: true
        type: string
      candidate_artifact_id:
        description: Exact GitHub Actions artifact id containing the immutable candidate
        required: true
        type: string
      expected_candidate_artifact_digest:
        description: Exact GitHub artifact digest in sha256 form
        required: true
        type: string
      expected_candidate_bundle_sha256:
        description: Exact raw career-1046-immutable-candidate.json SHA-256
        required: true
        type: string
      expected_candidate_receipt_sha256:
        description: Exact canonical candidate receipt SHA-256
        required: true
        type: string
      generation_id:
        description: Exact candidate generation id
        required: true
        type: string
      expected_previous_generation_id:
        description: Exact active 342/30 generation id
        required: true
        type: string
      expected_previous_pointer_sha256:
        description: Exact active-generation.json raw SHA-256
        required: true
        type: string
      preflight_run_id:
        description: Apply only; immutable successful preflight run id
        required: false
        default: ""
        type: string
      preflight_run_attempt:
        description: Apply only; immutable successful preflight run attempt
        required: false
        default: ""
        type: string
      expected_preflight_receipt_sha256:
        description: Apply only; exact downloaded preflight receipt SHA-256
        required: false
        default: ""
        type: string
      operator_approval_phrase:
        description: Apply only; exact immutable staging approval phrase
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-${{ github.repository }}-production
  cancel-in-progress: false

jobs:
  control:
    name: Run isolated same-generation product-data staging phase
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      MODE: ${{ inputs.mode }}
      EXPECTED_CONTROL_PLANE_SHA: ${{ inputs.expected_control_plane_sha }}
      EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
      EXPECTED_RELEASE_NAME: ${{ inputs.expected_release_name }}
      CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
      EXPECTED_CANDIDATE_ARTIFACT_DIGEST: ${{ inputs.expected_candidate_artifact_digest }}
      EXPECTED_CANDIDATE_BUNDLE_SHA256: ${{ inputs.expected_candidate_bundle_sha256 }}
      EXPECTED_CANDIDATE_RECEIPT_SHA256: ${{ inputs.expected_candidate_receipt_sha256 }}
      GENERATION_ID: ${{ inputs.generation_id }}
      EXPECTED_PREVIOUS_GENERATION_ID: ${{ inputs.expected_previous_generation_id }}
      EXPECTED_PREVIOUS_POINTER_SHA256: ${{ inputs.expected_previous_pointer_sha256 }}
      PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
      PREFLIGHT_RUN_ATTEMPT: ${{ inputs.preflight_run_attempt }}
      EXPECTED_PREFLIGHT_RECEIPT_SHA256: ${{ inputs.expected_preflight_receipt_sha256 }}
      OPERATOR_APPROVAL_PHRASE: ${{ inputs.operator_approval_phrase }}
      DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
      DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
      RETIRED_DEPLOY_HOST: ${{ secrets.PRODUCTION_RETIRED_DEPLOY_HOST }}
      DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}

    steps:
      - name: Initialize sanitized failure receipt before checkout
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/career-1046-product-data-staging.json"
          jq -n \
            --arg mode "$MODE" \
            --arg control "$EXPECTED_CONTROL_PLANE_SHA" \
            --arg release "$EXPECTED_RELEASE_SHA" \
            --arg generation "$GENERATION_ID" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{
              contract_version: "career.1046.product_data_staging.v2",
              mode: $mode,
              status: "FAIL_CONTROL_INITIALIZATION",
              failed_stage: "initialize",
              control_plane_sha: $control,
              release_sha: $release,
              generation_id: $generation,
              workflow_run_id: ($run_id | tonumber),
              workflow_run_attempt: ($run_attempt | tonumber),
              production_write_execution: false,
              candidate_file_write_count: 0,
              directory_write_count: 0,
              pointer_write_count: 0,
              database_write_count: 0,
              cms_write_count: 0,
              cache_write_count: 0,
              deployment_count: 0,
              migration_count: 0,
              publication_write_count: 0,
              sitemap_write_count: 0,
              llms_write_count: 0,
              search_submission_count: 0,
              automatic_retry_allowed: false,
              automatic_cleanup_allowed: false,
              automatic_rollback_allowed: false,
              write_state: "none",
              writes_committed: false,
              zero_write_guarantee: false
            }' > "$receipt"

      - name: Checkout exact control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.expected_control_plane_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download and validate exact candidate and preflight evidence
        id: eligibility
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/career-1046-product-data-staging.json"
          mark_failure() {
            jq --arg stage "$1" '.status = "FAIL_CONTROL_ELIGIBILITY" | .failed_stage = $stage' \
              "$receipt" > "$receipt.next"
            mv "$receipt.next" "$receipt"
          }
          trap 'mark_failure "control_plane_candidate_or_receipt_validation"' ERR

          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$MODE" =~ ^(preflight|apply)$ ]]
          [[ "$EXPECTED_CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_RELEASE_SHA" = "$EXPECTED_CONTROL_PLANE_SHA"
          [[ "$EXPECTED_RELEASE_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          [[ "$CANDIDATE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_CANDIDATE_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_CANDIDATE_BUNDLE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_CANDIDATE_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$GENERATION_ID" =~ ^career-1046-[0-9a-f]{32}$ ]]
          [[ "$EXPECTED_PREVIOUS_GENERATION_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._:@-]{0,127}$ ]]
          [[ "$EXPECTED_PREVIOUS_POINTER_SHA256" =~ ^[0-9a-f]{64}$ ]]
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_CONTROL_PLANE_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_CONTROL_PLANE_SHA"
          test "$GITHUB_SHA" = "$EXPECTED_CONTROL_PLANE_SHA"
          php -l backend/scripts/operations/career_1046_product_data_staging.php >/dev/null

          artifact_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE_ARTIFACT_ID}")"
          jq -e \
            --arg digest "$EXPECTED_CANDIDATE_ARTIFACT_DIGEST" \
            '.expired == false and .name == "career-1046-immutable-candidate" and .digest == $digest' \
            <<<"$artifact_json" >/dev/null
          candidate_run_id="$(jq -er '.workflow_run.id | select(type == "number")' <<<"$artifact_json")"
          candidate_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_run_id}")"
          jq -e \
            --arg sha "$EXPECTED_CONTROL_PLANE_SHA" \
            '.event == "workflow_dispatch"
             and .head_branch == "main"
             and .head_sha == $sha
             and .status == "completed"
             and .conclusion == "success"' <<<"$candidate_run" >/dev/null
          candidate_dir="$(mktemp -d)"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE_ARTIFACT_ID}/zip" > "$candidate_dir/artifact.zip"
          test "$(unzip -Z1 "$candidate_dir/artifact.zip")" = "career-1046-immutable-candidate.json"
          unzip -q "$candidate_dir/artifact.zip" -d "$candidate_dir/unpacked"
          candidate="$candidate_dir/unpacked/career-1046-immutable-candidate.json"
          test -f "$candidate"
          test "$(find "$candidate_dir/unpacked" -type f | wc -l | tr -d ' ')" = 1
          test "$(sha256sum "$candidate" | awk '{print $1}')" = "$EXPECTED_CANDIDATE_BUNDLE_SHA256"
          test "$(wc -c < "$candidate")" -le 268435456
          jq -e \
            --arg generation "$GENERATION_ID" \
            '.schema_version == "career.1046.immutable_candidate.v2"
             and .generation_id == $generation
             and .counts.unique_slugs == 1046
             and .counts.locale_rows == 2092
             and .counts.missing == 0
             and .counts.duplicate == 0
             and .counts.outside_target == 0
             and (.documents | keys | length) == 8
             and .candidate_receipt.active_pointer_written == false
             and .candidate_receipt.published == false
             and .candidate_receipt.warmed == false' "$candidate" >/dev/null
          receipt_sha="$(jq -cS '.candidate_receipt' "$candidate" | sha256sum | awk '{print $1}')"
          test "$receipt_sha" = "$EXPECTED_CANDIDATE_RECEIPT_SHA256"

          apply_authorized=0
          case "$MODE" in
            preflight)
              test -z "$PREFLIGHT_RUN_ID"
              test -z "$PREFLIGHT_RUN_ATTEMPT"
              test -z "$EXPECTED_PREFLIGHT_RECEIPT_SHA256"
              test -z "$OPERATOR_APPROVAL_PHRASE"
              ;;
            apply)
              [[ "$PREFLIGHT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
              [[ "$PREFLIGHT_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
              [[ "$EXPECTED_PREFLIGHT_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
              preflight_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREFLIGHT_RUN_ID}")"
              jq -e \
                --arg sha "$EXPECTED_CONTROL_PLANE_SHA" \
                --argjson attempt "$PREFLIGHT_RUN_ATTEMPT" \
                '.name == "Career 1046 Product Data Staging Production Ops"
                 and .path == ".github/workflows/career-1046-product-data-staging-production-ops.yml"
                 and .event == "workflow_dispatch"
                 and .head_branch == "main"
                 and .head_sha == $sha
                 and .status == "completed"
                 and .conclusion == "success"
                 and .run_attempt == $attempt' <<<"$preflight_run" >/dev/null
              preflight_dir="$(mktemp -d)"
              gh run download "$PREFLIGHT_RUN_ID" \
                --name "career-1046-product-data-staging-preflight-${PREFLIGHT_RUN_ID}-${PREFLIGHT_RUN_ATTEMPT}" \
                --dir "$preflight_dir"
              preflight="$preflight_dir/career-1046-product-data-staging.json"
              test -f "$preflight"
              test "$(sha256sum "$preflight" | awk '{print $1}')" = "$EXPECTED_PREFLIGHT_RECEIPT_SHA256"
              jq -e \
                --arg control "$EXPECTED_CONTROL_PLANE_SHA" \
                --arg release "$EXPECTED_RELEASE_SHA" \
                --arg generation "$GENERATION_ID" \
                --arg previous "$EXPECTED_PREVIOUS_GENERATION_ID" \
                --arg pointer "$EXPECTED_PREVIOUS_POINTER_SHA256" \
                --arg bundle "$EXPECTED_CANDIDATE_BUNDLE_SHA256" \
                --arg candidate_receipt "$EXPECTED_CANDIDATE_RECEIPT_SHA256" \
                --arg artifact "$EXPECTED_CANDIDATE_ARTIFACT_DIGEST" \
                --argjson run_id "$PREFLIGHT_RUN_ID" \
                --argjson run_attempt "$PREFLIGHT_RUN_ATTEMPT" \
                '.contract_version == "career.1046.product_data_staging.v2"
                 and .mode == "preflight"
                 and .status == "PASS_PREFLIGHT_STAGE_ELIGIBLE"
                 and .control_plane_sha == $control
                 and .release_sha == $release
                 and .generation_id == $generation
                 and .previous_generation_id == $previous
                 and .previous_pointer_sha256 == $pointer
                 and .candidate_bundle_sha256 == $bundle
                 and .candidate_receipt_sha256 == $candidate_receipt
                 and .candidate_artifact_digest == $artifact
                 and .workflow_run_id == $run_id
                 and .workflow_run_attempt == $run_attempt
                 and .document_count == 8
                 and .counts.unique_slugs == 1046
                 and .counts.locale_rows == 2092
                 and .production_write_execution == false
                 and .pointer_write_count == 0
                 and .writes_committed == false
                 and .zero_write_guarantee == true
                 and .automatic_retry_allowed == false' "$preflight" >/dev/null
              expected_phrase="I explicitly approve staging only immutable Career generation ${GENERATION_ID} from preflight run ${PREFLIGHT_RUN_ID} attempt ${PREFLIGHT_RUN_ATTEMPT} receipt ${EXPECTED_PREFLIGHT_RECEIPT_SHA256}, candidate bundle ${EXPECTED_CANDIDATE_BUNDLE_SHA256}, candidate receipt ${EXPECTED_CANDIDATE_RECEIPT_SHA256}, artifact ${EXPECTED_CANDIDATE_ARTIFACT_DIGEST}, control plane ${EXPECTED_CONTROL_PLANE_SHA}, active SHA ${EXPECTED_RELEASE_SHA}, release ${EXPECTED_RELEASE_NAME}, previous generation ${EXPECTED_PREVIOUS_GENERATION_ID}, previous pointer ${EXPECTED_PREVIOUS_POINTER_SHA256}; write and read back only the eight immutable generation documents, do not switch the active or cache pointer, and perform no deploy, migration, DB/CMS/publication/sitemap/llms/Search write, automatic retry, cleanup, or rollback."
              test "$OPERATOR_APPROVAL_PHRASE" = "$expected_phrase"
              apply_authorized=1
              ;;
          esac

          cp "$candidate" "$RUNNER_TEMP/career-1046-immutable-candidate.json"
          echo "apply_authorized=$apply_authorized" >> "$GITHUB_OUTPUT"
          trap - ERR

      - name: Validate protected production topology
        shell: bash
        run: |
          set -euo pipefail
          for name in DEPLOY_USER DEPLOY_PORT DEPLOY_HOST RETIRED_DEPLOY_HOST DEPLOY_PATH SSH_KNOWN_HOSTS; do
            test -n "${!name:-}"
          done
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          test "$DEPLOY_PORT" -ge 1
          test "$DEPLOY_PORT" -le 65535
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$RETIRED_DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          test "$DEPLOY_HOST" != "$RETIRED_DEPLOY_HOST"
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_PATH" != *".."* ]]
          echo "Protected production topology validated without disclosing values."

      - name: Start pinned SSH agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known hosts
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null \
            || ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f ~/.ssh/known_hosts >/dev/null

      - name: Run zero-write preflight or exact immutable staging apply
        shell: bash
        env:
          APPLY_AUTHORIZED: ${{ steps.eligibility.outputs.apply_authorized }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/career-1046-product-data-staging.json"
          remote_receipt="$RUNNER_TEMP/career-1046-product-data-staging.remote.json"
          candidate="$RUNNER_TEMP/career-1046-immutable-candidate.json"
          runner_sha256="$(sha256sum backend/scripts/operations/career_1046_product_data_staging.php | awk '{print $1}')"
          printf -v q_mode '%q' "$MODE"
          printf -v q_deploy_path '%q' "$DEPLOY_PATH"
          printf -v q_control '%q' "$EXPECTED_CONTROL_PLANE_SHA"
          printf -v q_release '%q' "$EXPECTED_RELEASE_SHA"
          printf -v q_release_name '%q' "$EXPECTED_RELEASE_NAME"
          printf -v q_run_id '%q' "$GITHUB_RUN_ID"
          printf -v q_run_attempt '%q' "$GITHUB_RUN_ATTEMPT"
          printf -v q_generation '%q' "$GENERATION_ID"
          printf -v q_bundle '%q' "$EXPECTED_CANDIDATE_BUNDLE_SHA256"
          printf -v q_candidate_receipt '%q' "$EXPECTED_CANDIDATE_RECEIPT_SHA256"
          printf -v q_artifact '%q' "$EXPECTED_CANDIDATE_ARTIFACT_DIGEST"
          printf -v q_previous '%q' "$EXPECTED_PREVIOUS_GENERATION_ID"
          printf -v q_pointer '%q' "$EXPECTED_PREVIOUS_POINTER_SHA256"
          printf -v q_preflight '%q' "$EXPECTED_PREFLIGHT_RECEIPT_SHA256"
          printf -v q_apply '%q' "$APPLY_AUTHORIZED"
          printf -v q_runner '%q' "$runner_sha256"

          set +e
          timeout --signal=TERM --kill-after=5s 180s \
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
              -o ServerAliveInterval=20 -o ServerAliveCountMax=8 \
              -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "set -euo pipefail; current=\$(readlink -f $q_deploy_path/current); release=\$(readlink -f $q_deploy_path/releases/$q_release_name); test -n \"\$current\"; test \"\$current\" = \"\$release\"; test \"\$(tr -d '\\r\\n' < \"\$current/REVISION\")\" = $q_release; test \"\$(sha256sum \"\$current/backend/scripts/operations/career_1046_product_data_staging.php\" | awk '{print \$1}')\" = $q_runner; test ! -e $q_deploy_path/.dep/deploy.lock; test \"\$(ps -eo comm=,args= | awk '\$1 == \"php\" && (\$0 ~ /dep(\\.phar)? .* production/ || \$0 ~ /artisan migrate/ || \$0 ~ /queue:reload-workers/ || \$0 ~ /career_.*(apply|activation|staging)/) {n++} \$1 == \"composer\" && \$0 ~ /install/ {n++} END {print n+0}')\" = 0; CAREER_STAGING_PRIVATE_ROOT=\"\$current/backend/storage/app/private\" CAREER_STAGING_CONTROL_PLANE_SHA=$q_control CAREER_STAGING_RELEASE_SHA=$q_release CAREER_STAGING_RELEASE_NAME=$q_release_name CAREER_STAGING_WORKFLOW_RUN_ID=$q_run_id CAREER_STAGING_WORKFLOW_RUN_ATTEMPT=$q_run_attempt CAREER_STAGING_GENERATION_ID=$q_generation CAREER_STAGING_CANDIDATE_BUNDLE_SHA256=$q_bundle CAREER_STAGING_CANDIDATE_RECEIPT_SHA256=$q_candidate_receipt CAREER_STAGING_CANDIDATE_ARTIFACT_DIGEST=$q_artifact CAREER_STAGING_PREVIOUS_GENERATION_ID=$q_previous CAREER_STAGING_PREVIOUS_POINTER_SHA256=$q_pointer CAREER_STAGING_PREFLIGHT_RECEIPT_SHA256=$q_preflight CAREER_STAGING_APPLY_AUTHORIZED=$q_apply php \"\$current/backend/scripts/operations/career_1046_product_data_staging.php\" $q_mode" \
              < "$candidate" > "$remote_receipt" 2>/dev/null
          remote_status=$?
          set -e

          if jq -e \
            --arg mode "$MODE" \
            '.contract_version == "career.1046.product_data_staging.v2"
             and .mode == $mode
             and (.status | type == "string")
             and (.failed_stage == null or (.failed_stage | type == "string"))' \
            "$remote_receipt" >/dev/null 2>&1; then
            mv "$remote_receipt" "$receipt"
          else
            apply_started=false
            write_state="none"
            if [ "$MODE" = apply ]; then
              apply_started=true
              write_state="indeterminate"
            fi
            jq \
              --argjson apply_started "$apply_started" \
              --arg write_state "$write_state" \
              '.status = "FAIL_REMOTE_OUTCOME_REQUIRES_REVIEW"
               | .failed_stage = "remote_transport_or_receipt_invalid"
               | .production_write_execution = $apply_started
               | .write_state = $write_state
               | .zero_write_guarantee = false' \
              "$receipt" > "$receipt.next"
            mv "$receipt.next" "$receipt"
          fi
          exit "$remote_status"

      - name: Validate sanitized phase receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/career-1046-product-data-staging.json"
          jq -e \
            --arg mode "$MODE" \
            --arg control "$EXPECTED_CONTROL_PLANE_SHA" \
            --arg release "$EXPECTED_RELEASE_SHA" \
            --arg generation "$GENERATION_ID" \
            --arg previous "$EXPECTED_PREVIOUS_GENERATION_ID" \
            --arg pointer "$EXPECTED_PREVIOUS_POINTER_SHA256" \
            --arg bundle "$EXPECTED_CANDIDATE_BUNDLE_SHA256" \
            --arg candidate_receipt "$EXPECTED_CANDIDATE_RECEIPT_SHA256" \
            --arg artifact "$EXPECTED_CANDIDATE_ARTIFACT_DIGEST" \
            '(.contract_version == "career.1046.product_data_staging.v2")
             and (.mode == $mode)
             and (.control_plane_sha == $control)
             and (.release_sha == $release)
             and (.generation_id == $generation)
             and (.previous_generation_id == $previous)
             and (.previous_pointer_sha256 == $pointer)
             and (.active_pointer_sha256_before == $pointer)
             and (.active_pointer_sha256_after == $pointer)
             and (.candidate_bundle_sha256 == $bundle)
             and (.candidate_receipt_sha256 == $candidate_receipt)
             and (.candidate_artifact_digest == $artifact)
             and (.document_count == 8)
             and (.counts.unique_slugs == 1046)
             and (.counts.locale_rows == 2092)
             and (.counts.missing == 0)
             and (.counts.duplicate == 0)
             and (.counts.outside_target == 0)
             and (.pointer_write_count == 0)
             and (.database_write_count == 0)
             and (.cms_write_count == 0)
             and (.cache_write_count == 0)
             and (.deployment_count == 0)
             and (.migration_count == 0)
             and (.publication_write_count == 0)
             and (.sitemap_write_count == 0)
             and (.llms_write_count == 0)
             and (.search_submission_count == 0)
             and (.automatic_retry_allowed == false)
             and (.automatic_cleanup_allowed == false)
             and (.automatic_rollback_allowed == false)
             and (if $mode == "preflight" then
                    .status == "PASS_PREFLIGHT_STAGE_ELIGIBLE"
                    and .production_write_execution == false
                    and .candidate_file_write_count == 0
                    and .writes_committed == false
                    and .zero_write_guarantee == true
                  else
                    .status == "PASS_APPLY_PRODUCT_DATA_STAGED"
                    and .production_write_execution == true
                    and .candidate_file_write_count == 8
                    and .directory_write_count == 1
                    and .writes_committed == true
                    and .zero_write_guarantee == false
                  end)' "$receipt" >/dev/null

      - name: Upload immutable sanitized phase receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: career-1046-product-data-staging-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/career-1046-product-data-staging.json
          if-no-files-found: error
          retention-days: 30
