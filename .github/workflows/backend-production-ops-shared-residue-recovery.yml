name: Backend Production Ops Shared Residue Recovery

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only preflight or exact authorized residue cleanup
        required: true
        type: choice
        options:
          - preflight
          - apply
      expected_control_plane_sha:
        description: Exact latest main SHA containing this recovery control
        required: true
        type: string
      expected_active_revision:
        description: Exact active production application SHA
        required: true
        type: string
      evidence_run_id:
        description: Exact successful pre-migration SHARED v5 queue-control preflight run
        required: true
        type: string
      evidence_run_attempt:
        description: Exact successful pre-migration SHARED v5 queue-control preflight attempt
        required: true
        type: string
      expected_source_control_plane_sha:
        description: Exact control-plane SHA used by the SHARED source evidence
        required: true
        type: string
      current_evidence_run_id:
        description: Exact successful post-migration DEDICATED v5 queue-control preflight run
        required: true
        type: string
      current_evidence_run_attempt:
        description: Exact successful post-migration DEDICATED v5 queue-control preflight attempt
        required: true
        type: string
      failed_run_id:
        description: Exact failed shared migration run that owns the residue
        required: true
        type: string
      failed_run_attempt:
        description: Exact failed shared migration run attempt
        required: true
        type: string
      expected_failed_control_plane_sha:
        description: Exact control-plane SHA used by the failed migration
        required: true
        type: string
      expected_backup_sha256:
        description: Apply-only exact preserved backup SHA256
        required: false
        type: string
      expected_residue_set_sha256:
        description: Apply-only exact sanitized residue-set SHA256
        required: false
        type: string
      expected_residue_file_count:
        description: Apply-only exact bounded residue file count
        required: false
        type: string
      expected_validation_process_state:
        description: Apply-only validation process state; must be absent
        required: false
        type: string
      expected_validation_process_fingerprint_sha256:
        description: Apply-only validation process fingerprint; must be zero SHA256
        required: false
        type: string
      expected_migration_process_state:
        description: Apply-only migration control process state; must be absent
        required: false
        type: string
      expected_migration_process_fingerprint_sha256:
        description: Apply-only migration control process fingerprint; must be zero SHA256
        required: false
        type: string
      preflight_run_id:
        description: Apply-only immutable recovery preflight run id
        required: false
        type: string
      preflight_run_attempt:
        description: Apply-only immutable recovery preflight attempt
        required: false
        type: string
      operator_approval_phrase:
        description: Apply-only exact receipt-bound operator approval
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: backend-production-ops-shared-residue-recovery
  cancel-in-progress: false

jobs:
  eligibility:
    name: Resolve exact residue recovery eligibility
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.validate.outputs.mode }}
      control_plane_sha: ${{ steps.validate.outputs.control_plane_sha }}
      active_revision: ${{ steps.validate.outputs.active_revision }}
      evidence_run_id: ${{ steps.validate.outputs.evidence_run_id }}
      evidence_run_attempt: ${{ steps.validate.outputs.evidence_run_attempt }}
      source_control_plane_sha: ${{ steps.validate.outputs.source_control_plane_sha }}
      current_evidence_run_id: ${{ steps.validate.outputs.current_evidence_run_id }}
      current_evidence_run_attempt: ${{ steps.validate.outputs.current_evidence_run_attempt }}
      failed_run_id: ${{ steps.validate.outputs.failed_run_id }}
      failed_run_attempt: ${{ steps.validate.outputs.failed_run_attempt }}
      source_path_sha256: ${{ steps.validate.outputs.source_path_sha256 }}
      source_original_config_sha256: ${{ steps.validate.outputs.source_original_config_sha256 }}
      source_current_config_sha256: ${{ steps.validate.outputs.source_current_config_sha256 }}
      target_path_sha256: ${{ steps.validate.outputs.target_path_sha256 }}
      target_current_sha256: ${{ steps.validate.outputs.target_current_sha256 }}
      foreign_runtime_fingerprint_sha256: ${{ steps.validate.outputs.foreign_runtime_fingerprint_sha256 }}
    steps:
      - name: Checkout exact control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.expected_control_plane_sha }}
          fetch-depth: 1

      - name: Validate exact controls and immutable evidence
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          EXPECTED_CONTROL_PLANE_SHA: ${{ inputs.expected_control_plane_sha }}
          EXPECTED_ACTIVE_REVISION: ${{ inputs.expected_active_revision }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          EVIDENCE_RUN_ATTEMPT: ${{ inputs.evidence_run_attempt }}
          EXPECTED_SOURCE_CONTROL_PLANE_SHA: ${{ inputs.expected_source_control_plane_sha }}
          CURRENT_EVIDENCE_RUN_ID: ${{ inputs.current_evidence_run_id }}
          CURRENT_EVIDENCE_RUN_ATTEMPT: ${{ inputs.current_evidence_run_attempt }}
          FAILED_RUN_ID: ${{ inputs.failed_run_id }}
          FAILED_RUN_ATTEMPT: ${{ inputs.failed_run_attempt }}
          EXPECTED_FAILED_CONTROL_PLANE_SHA: ${{ inputs.expected_failed_control_plane_sha }}
          EXPECTED_BACKUP_SHA256: ${{ inputs.expected_backup_sha256 }}
          EXPECTED_RESIDUE_SET_SHA256: ${{ inputs.expected_residue_set_sha256 }}
          EXPECTED_RESIDUE_FILE_COUNT: ${{ inputs.expected_residue_file_count }}
          EXPECTED_VALIDATION_PROCESS_STATE: ${{ inputs.expected_validation_process_state }}
          EXPECTED_VALIDATION_PROCESS_FINGERPRINT_SHA256: ${{ inputs.expected_validation_process_fingerprint_sha256 }}
          EXPECTED_MIGRATION_PROCESS_STATE: ${{ inputs.expected_migration_process_state }}
          EXPECTED_MIGRATION_PROCESS_FINGERPRINT_SHA256: ${{ inputs.expected_migration_process_fingerprint_sha256 }}
          PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
          PREFLIGHT_RUN_ATTEMPT: ${{ inputs.preflight_run_attempt }}
          OPERATOR_APPROVAL_PHRASE: ${{ inputs.operator_approval_phrase }}
        run: |
          set -euo pipefail
          control_script="scripts/deploy/control_ops_shared_residue_recovery.sh"
          zero_sha256="$(printf '0%.0s' {1..64})"
          test "$GITHUB_REF" = refs/heads/main
          [[ "$EXPECTED_CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_ACTIVE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_FAILED_CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_SOURCE_CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EVIDENCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$EVIDENCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$CURRENT_EVIDENCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CURRENT_EVIDENCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          test "$CURRENT_EVIDENCE_RUN_ID" != "$EVIDENCE_RUN_ID"
          [[ "$FAILED_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$FAILED_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_CONTROL_PLANE_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_CONTROL_PLANE_SHA"
          bash -n "$control_script"

          failed_run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_RUN_ID}")"
          jq -e \
            --arg sha "$EXPECTED_FAILED_CONTROL_PLANE_SHA" \
            --argjson attempt "$FAILED_RUN_ATTEMPT" \
            '.name == "Backend Production Ops Shared Config Migration"
             and .path == ".github/workflows/backend-production-ops-shared-config-migration.yml"
             and .event == "workflow_dispatch"
             and .status == "completed"
             and (.conclusion == "cancelled" or .conclusion == "failure")
             and .head_branch == "main"
             and .head_sha == $sha
             and .run_attempt == $attempt' <<<"$failed_run_json" >/dev/null

          evidence_run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EVIDENCE_RUN_ID}")"
          jq -e \
            --arg sha "$EXPECTED_SOURCE_CONTROL_PLANE_SHA" \
            --argjson attempt "$EVIDENCE_RUN_ATTEMPT" \
            '.name == "Backend Production Ops Queue Control"
             and .path == ".github/workflows/backend-production-ops-queue-control.yml"
             and .event == "workflow_dispatch"
             and .status == "completed"
             and .conclusion == "success"
             and .head_branch == "main"
             and .head_sha == $sha
             and .run_attempt == $attempt' <<<"$evidence_run_json" >/dev/null
          evidence_dir="$(mktemp -d)"
          gh run download "$EVIDENCE_RUN_ID" \
            --name "backend-production-ops-queue-preflight-${EVIDENCE_RUN_ID}-${EVIDENCE_RUN_ATTEMPT}" \
            --dir "$evidence_dir"
          evidence_receipt="$evidence_dir/backend-production-ops-queue-control.json"
          test -f "$evidence_receipt"
          jq -e \
            --arg control "$EXPECTED_SOURCE_CONTROL_PLANE_SHA" \
            --arg active "$EXPECTED_ACTIVE_REVISION" \
            '.contract_version == "backend.production_ops_queue_control.v5"
             and .mode == "preflight"
             and .status == "PASS_PREFLIGHT"
             and .control_plane_sha == $control
             and .active_revision == $active
             and .config_layout == "SHARED"
             and .config_exact_program_section_count == 1
             and .config_total_section_count == 3
             and .config_foreign_program_section_count == 2
             and .managed_target_current_sha256 == ("0" * 64)
             and .ops_pending_total == 0
             and .live_process_verified == true
             and .production_write_execution == false
             and .config_write_count == 0
             and .application_deploy_count == 0
             and .symlink_write_count == 0
             and .cms_or_database_authority_write_count == 0
             and .publication_or_discoverability_write_count == 0' \
            "$evidence_receipt" >/dev/null

          source_path_sha256="$(jq -r '.config_path_sha256' "$evidence_receipt")"
          source_original_config_sha256="$(jq -r '.current_config_sha256' "$evidence_receipt")"
          source_current_config_sha256="$(jq -r '.stripped_source_sha256' "$evidence_receipt")"
          source_target_path_sha256="$(jq -r '.managed_target_path_sha256' "$evidence_receipt")"
          foreign_runtime_fingerprint_sha256="$(jq -r '.foreign_runtime_fingerprint_sha256' "$evidence_receipt")"

          current_evidence_run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CURRENT_EVIDENCE_RUN_ID}")"
          jq -e \
            --arg sha "$EXPECTED_CONTROL_PLANE_SHA" \
            --argjson attempt "$CURRENT_EVIDENCE_RUN_ATTEMPT" \
            '.name == "Backend Production Ops Queue Control"
             and .path == ".github/workflows/backend-production-ops-queue-control.yml"
             and .event == "workflow_dispatch"
             and .status == "completed"
             and .conclusion == "success"
             and .head_branch == "main"
             and .head_sha == $sha
             and .run_attempt == $attempt' <<<"$current_evidence_run_json" >/dev/null
          current_evidence_dir="$(mktemp -d)"
          gh run download "$CURRENT_EVIDENCE_RUN_ID" \
            --name "backend-production-ops-queue-preflight-${CURRENT_EVIDENCE_RUN_ID}-${CURRENT_EVIDENCE_RUN_ATTEMPT}" \
            --dir "$current_evidence_dir"
          current_evidence_receipt="$current_evidence_dir/backend-production-ops-queue-control.json"
          test -f "$current_evidence_receipt"
          jq -e \
            --arg control "$EXPECTED_CONTROL_PLANE_SHA" \
            --arg active "$EXPECTED_ACTIVE_REVISION" \
            '.contract_version == "backend.production_ops_queue_control.v5"
             and .mode == "preflight"
             and .status == "PASS_PREFLIGHT"
             and .control_plane_sha == $control
             and .active_revision == $active
             and .config_layout == "DEDICATED"
             and .config_exact_program_section_count == 1
             and .config_total_section_count == 1
             and .config_foreign_program_section_count == 0
             and .runtime_cwd_current == true
             and .runtime_config_current == true
             and .convergence_required == false
             and .ops_pending_total == 0
             and .live_process_verified == true
             and .production_write_execution == false
             and .config_write_count == 0
             and .application_deploy_count == 0
             and .symlink_write_count == 0
             and .cms_or_database_authority_write_count == 0
             and .publication_or_discoverability_write_count == 0' \
            "$current_evidence_receipt" >/dev/null

          target_path_sha256="$(jq -r '.config_path_sha256' "$current_evidence_receipt")"
          target_current_sha256="$(jq -r '.current_config_sha256' "$current_evidence_receipt")"
          target_rendered_sha256="$(jq -r '.rendered_sha256' "$current_evidence_receipt")"
          test "$source_target_path_sha256" = "$target_path_sha256"
          test "$target_current_sha256" = "$target_rendered_sha256"
          for hash_value in \
            "$source_path_sha256" "$source_original_config_sha256" \
            "$source_current_config_sha256" "$target_path_sha256" \
            "$target_current_sha256" "$foreign_runtime_fingerprint_sha256"; do
            [[ "$hash_value" =~ ^[0-9a-f]{64}$ ]]
          done

          if [ "$MODE" = preflight ]; then
            test -z "$EXPECTED_BACKUP_SHA256"
            test -z "$EXPECTED_RESIDUE_SET_SHA256"
            test -z "$EXPECTED_RESIDUE_FILE_COUNT"
            test -z "$EXPECTED_VALIDATION_PROCESS_STATE"
            test -z "$EXPECTED_VALIDATION_PROCESS_FINGERPRINT_SHA256"
            test -z "$EXPECTED_MIGRATION_PROCESS_STATE"
            test -z "$EXPECTED_MIGRATION_PROCESS_FINGERPRINT_SHA256"
            test -z "$PREFLIGHT_RUN_ID"
            test -z "$PREFLIGHT_RUN_ATTEMPT"
            test -z "$OPERATOR_APPROVAL_PHRASE"
          else
            test "$MODE" = apply
            [[ "$EXPECTED_BACKUP_SHA256" =~ ^[0-9a-f]{64}$ ]]
            [[ "$EXPECTED_RESIDUE_SET_SHA256" =~ ^[0-9a-f]{64}$ ]]
            [[ "$EXPECTED_RESIDUE_FILE_COUNT" =~ ^[1-5]$ ]]
            test "$EXPECTED_VALIDATION_PROCESS_STATE" = absent
            test "$EXPECTED_VALIDATION_PROCESS_FINGERPRINT_SHA256" = "$zero_sha256"
            test "$EXPECTED_MIGRATION_PROCESS_STATE" = absent
            test "$EXPECTED_MIGRATION_PROCESS_FINGERPRINT_SHA256" = "$zero_sha256"
            [[ "$PREFLIGHT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$PREFLIGHT_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
            expected_phrase="I explicitly approve production fap-api cleanup of stale shared-config migration residue from failed run ${FAILED_RUN_ID} attempt ${FAILED_RUN_ATTEMPT} using recovery preflight run ${PREFLIGHT_RUN_ID} attempt ${PREFLIGHT_RUN_ATTEMPT}, source v5 evidence run ${EVIDENCE_RUN_ID} attempt ${EVIDENCE_RUN_ATTEMPT} at source control-plane SHA ${EXPECTED_SOURCE_CONTROL_PLANE_SHA}, and current v5 evidence run ${CURRENT_EVIDENCE_RUN_ID} attempt ${CURRENT_EVIDENCE_RUN_ATTEMPT} with control-plane SHA ${EXPECTED_CONTROL_PLANE_SHA} active SHA ${EXPECTED_ACTIVE_REVISION} source-path SHA256 ${source_path_sha256} source-original SHA256 ${source_original_config_sha256} source-current SHA256 ${source_current_config_sha256} target-path SHA256 ${target_path_sha256} target-current SHA256 ${target_current_sha256} backup SHA256 ${EXPECTED_BACKUP_SHA256} residue-set SHA256 ${EXPECTED_RESIDUE_SET_SHA256} residue-file-count ${EXPECTED_RESIDUE_FILE_COUNT} validation-process-state ${EXPECTED_VALIDATION_PROCESS_STATE} validation-process-fingerprint SHA256 ${EXPECTED_VALIDATION_PROCESS_FINGERPRINT_SHA256} migration-process-state ${EXPECTED_MIGRATION_PROCESS_STATE} migration-process-fingerprint SHA256 ${EXPECTED_MIGRATION_PROCESS_FINGERPRINT_SHA256} foreign-runtime SHA256 ${foreign_runtime_fingerprint_sha256}; delete only the exact bounded /tmp residue files, preserve the stripped shared source, exact dedicated target, exact backup, main Supervisor programs/PIDs and ops worker, and stop without rollback; no deploy/symlink/application-migration/CMS/database-authority/publication/sitemap/llms/search/PR23."
            test "$OPERATOR_APPROVAL_PHRASE" = "$expected_phrase"

            preflight_run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREFLIGHT_RUN_ID}")"
            jq -e \
              --arg sha "$EXPECTED_CONTROL_PLANE_SHA" \
              --argjson attempt "$PREFLIGHT_RUN_ATTEMPT" \
              '.name == "Backend Production Ops Shared Residue Recovery"
               and .path == ".github/workflows/backend-production-ops-shared-residue-recovery.yml"
               and .event == "workflow_dispatch"
               and .status == "completed"
               and .conclusion == "success"
               and .head_branch == "main"
               and .head_sha == $sha
               and .run_attempt == $attempt' <<<"$preflight_run_json" >/dev/null
            preflight_dir="$(mktemp -d)"
            gh run download "$PREFLIGHT_RUN_ID" \
              --name "backend-production-ops-shared-residue-preflight-${PREFLIGHT_RUN_ID}-${PREFLIGHT_RUN_ATTEMPT}" \
              --dir "$preflight_dir"
            preflight_receipt="$preflight_dir/backend-production-ops-shared-residue-recovery.json"
            test -f "$preflight_receipt"
            jq -e \
              --arg control "$EXPECTED_CONTROL_PLANE_SHA" \
              --arg active "$EXPECTED_ACTIVE_REVISION" \
              --arg evidence_run_id "$EVIDENCE_RUN_ID" \
              --arg evidence_run_attempt "$EVIDENCE_RUN_ATTEMPT" \
              --arg source_control_plane "$EXPECTED_SOURCE_CONTROL_PLANE_SHA" \
              --arg current_evidence_run_id "$CURRENT_EVIDENCE_RUN_ID" \
              --arg current_evidence_run_attempt "$CURRENT_EVIDENCE_RUN_ATTEMPT" \
              --arg failed_run_id "$FAILED_RUN_ID" \
              --arg failed_run_attempt "$FAILED_RUN_ATTEMPT" \
              --arg source_path "$source_path_sha256" \
              --arg source_original_config "$source_original_config_sha256" \
              --arg source_current_config "$source_current_config_sha256" \
              --arg target_path "$target_path_sha256" \
              --arg target_current "$target_current_sha256" \
              --arg backup "$EXPECTED_BACKUP_SHA256" \
              --arg residue_set "$EXPECTED_RESIDUE_SET_SHA256" \
              --argjson residue_count "$EXPECTED_RESIDUE_FILE_COUNT" \
              --arg validation_state "$EXPECTED_VALIDATION_PROCESS_STATE" \
              --arg validation_fingerprint "$EXPECTED_VALIDATION_PROCESS_FINGERPRINT_SHA256" \
              --arg migration_state "$EXPECTED_MIGRATION_PROCESS_STATE" \
              --arg migration_fingerprint "$EXPECTED_MIGRATION_PROCESS_FINGERPRINT_SHA256" \
              --arg foreign_runtime "$foreign_runtime_fingerprint_sha256" \
              --arg run_id "$PREFLIGHT_RUN_ID" \
              --arg run_attempt "$PREFLIGHT_RUN_ATTEMPT" \
              '.contract_version == "backend.production_ops_shared_residue_recovery.v2"
               and .mode == "preflight"
               and .status == "PASS_PREFLIGHT"
               and .run_id == $run_id
               and .run_attempt == $run_attempt
               and .evidence_run_id == $evidence_run_id
               and .evidence_run_attempt == $evidence_run_attempt
               and .source_control_plane_sha == $source_control_plane
               and .current_evidence_run_id == $current_evidence_run_id
               and .current_evidence_run_attempt == $current_evidence_run_attempt
               and .failed_run_id == $failed_run_id
               and .failed_run_attempt == $failed_run_attempt
               and .control_plane_sha == $control
               and .active_revision == $active
               and .source_path_sha256 == $source_path
               and .source_original_config_sha256 == $source_original_config
               and .source_current_config_sha256 == $source_current_config
               and .target_path_sha256 == $target_path
               and .target_current_sha256 == $target_current
               and .backup_sha256 == $backup
               and .residue_set_sha256 == $residue_set
               and .residue_file_count == $residue_count
               and .validation_process_state == $validation_state
               and .validation_process_fingerprint_sha256 == $validation_fingerprint
               and .migration_process_state == $migration_state
               and .migration_process_fingerprint_sha256 == $migration_fingerprint
               and .foreign_runtime_fingerprint_sha256 == $foreign_runtime
               and .ops_worker_process_count == 1
               and .ops_pending_total == 0
               and .production_write_execution == false
               and .deleted_residue_file_count == 0' "$preflight_receipt" >/dev/null
          fi

          {
            echo "mode=$MODE"
            echo "control_plane_sha=$EXPECTED_CONTROL_PLANE_SHA"
            echo "active_revision=$EXPECTED_ACTIVE_REVISION"
            echo "evidence_run_id=$EVIDENCE_RUN_ID"
            echo "evidence_run_attempt=$EVIDENCE_RUN_ATTEMPT"
            echo "source_control_plane_sha=$EXPECTED_SOURCE_CONTROL_PLANE_SHA"
            echo "current_evidence_run_id=$CURRENT_EVIDENCE_RUN_ID"
            echo "current_evidence_run_attempt=$CURRENT_EVIDENCE_RUN_ATTEMPT"
            echo "failed_run_id=$FAILED_RUN_ID"
            echo "failed_run_attempt=$FAILED_RUN_ATTEMPT"
            echo "source_path_sha256=$source_path_sha256"
            echo "source_original_config_sha256=$source_original_config_sha256"
            echo "source_current_config_sha256=$source_current_config_sha256"
            echo "target_path_sha256=$target_path_sha256"
            echo "target_current_sha256=$target_current_sha256"
            echo "foreign_runtime_fingerprint_sha256=$foreign_runtime_fingerprint_sha256"
          } >> "$GITHUB_OUTPUT"

  control:
    name: Preflight or clean exact shared migration residue
    needs: eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout exact control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.eligibility.outputs.control_plane_sha }}
          fetch-depth: 1

      - name: Start pinned SSH agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known hosts
        shell: bash
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null \
            || ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f ~/.ssh/known_hosts >/dev/null

      - name: Run exact bounded residue recovery control
        id: control
        shell: bash
        env:
          MODE: ${{ needs.eligibility.outputs.mode }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
          EXPECTED_ACTIVE_REVISION: ${{ needs.eligibility.outputs.active_revision }}
          FAILED_RUN_ID: ${{ needs.eligibility.outputs.failed_run_id }}
          EVIDENCE_SOURCE_PATH_SHA256: ${{ needs.eligibility.outputs.source_path_sha256 }}
          EVIDENCE_SOURCE_ORIGINAL_CONFIG_SHA256: ${{ needs.eligibility.outputs.source_original_config_sha256 }}
          EVIDENCE_SOURCE_CURRENT_CONFIG_SHA256: ${{ needs.eligibility.outputs.source_current_config_sha256 }}
          EVIDENCE_TARGET_PATH_SHA256: ${{ needs.eligibility.outputs.target_path_sha256 }}
          EVIDENCE_TARGET_CURRENT_SHA256: ${{ needs.eligibility.outputs.target_current_sha256 }}
          EVIDENCE_FOREIGN_RUNTIME_FINGERPRINT_SHA256: ${{ needs.eligibility.outputs.foreign_runtime_fingerprint_sha256 }}
          EXPECTED_BACKUP_SHA256: ${{ inputs.expected_backup_sha256 }}
          EXPECTED_RESIDUE_SET_SHA256: ${{ inputs.expected_residue_set_sha256 }}
          EXPECTED_RESIDUE_FILE_COUNT: ${{ inputs.expected_residue_file_count }}
          EXPECTED_VALIDATION_PROCESS_STATE: ${{ inputs.expected_validation_process_state }}
          EXPECTED_VALIDATION_PROCESS_FINGERPRINT_SHA256: ${{ inputs.expected_validation_process_fingerprint_sha256 }}
          EXPECTED_MIGRATION_PROCESS_STATE: ${{ inputs.expected_migration_process_state }}
          EXPECTED_MIGRATION_PROCESS_FINGERPRINT_SHA256: ${{ inputs.expected_migration_process_fingerprint_sha256 }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          control_b64="$(base64 -w 0 scripts/deploy/control_ops_shared_residue_recovery.sh)"

          set +e
          result="$(timeout --signal=TERM --kill-after=10s 180s \
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "MODE='$MODE' DEPLOY_PATH='$DEPLOY_PATH' EXPECTED_ACTIVE_REVISION='$EXPECTED_ACTIVE_REVISION' FAILED_RUN_ID='$FAILED_RUN_ID' EVIDENCE_SOURCE_PATH_SHA256='$EVIDENCE_SOURCE_PATH_SHA256' EVIDENCE_SOURCE_ORIGINAL_CONFIG_SHA256='$EVIDENCE_SOURCE_ORIGINAL_CONFIG_SHA256' EVIDENCE_SOURCE_CURRENT_CONFIG_SHA256='$EVIDENCE_SOURCE_CURRENT_CONFIG_SHA256' EVIDENCE_TARGET_PATH_SHA256='$EVIDENCE_TARGET_PATH_SHA256' EVIDENCE_TARGET_CURRENT_SHA256='$EVIDENCE_TARGET_CURRENT_SHA256' EVIDENCE_FOREIGN_RUNTIME_FINGERPRINT_SHA256='$EVIDENCE_FOREIGN_RUNTIME_FINGERPRINT_SHA256' EXPECTED_BACKUP_SHA256='$EXPECTED_BACKUP_SHA256' EXPECTED_RESIDUE_SET_SHA256='$EXPECTED_RESIDUE_SET_SHA256' EXPECTED_RESIDUE_FILE_COUNT='$EXPECTED_RESIDUE_FILE_COUNT' EXPECTED_VALIDATION_PROCESS_STATE='$EXPECTED_VALIDATION_PROCESS_STATE' EXPECTED_VALIDATION_PROCESS_FINGERPRINT_SHA256='$EXPECTED_VALIDATION_PROCESS_FINGERPRINT_SHA256' EXPECTED_MIGRATION_PROCESS_STATE='$EXPECTED_MIGRATION_PROCESS_STATE' EXPECTED_MIGRATION_PROCESS_FINGERPRINT_SHA256='$EXPECTED_MIGRATION_PROCESS_FINGERPRINT_SHA256' timeout --signal=TERM --kill-after=10s 150s bash -lc 'printf %s $control_b64 | base64 -d | bash'" \
            2>"$RUNNER_TEMP/ops-shared-residue-recovery.err")"
          ssh_rc=$?
          set -e
          if [ "$ssh_rc" -ne 0 ]; then
            failure_code="$(grep -Eo 'OPS_SHARED_RESIDUE_RECOVERY_GATE_FAILED:[A-Z0-9_]+' \
              "$RUNNER_TEMP/ops-shared-residue-recovery.err" | tail -n 1 || true)"
            if [[ "$failure_code" =~ ^OPS_SHARED_RESIDUE_RECOVERY_GATE_FAILED:[A-Z0-9_]+$ ]]; then
              echo "$failure_code" >&2
            else
              echo "OPS_SHARED_RESIDUE_RECOVERY_REMOTE_FAILED" >&2
            fi
            exit "$ssh_rc"
          fi

          known_keys='^(active_revision|failed_run_id|source_path_sha256|source_original_config_sha256|source_current_config_sha256|target_path_sha256|target_current_sha256|backup_sha256|foreign_runtime_fingerprint_sha256|ops_worker_pid_sha256|ops_worker_process_count|ops_pending_total|residue_file_count|residue_set_sha256|validation_process_state|validation_process_fingerprint_sha256|migration_process_state|migration_process_fingerprint_sha256|deleted_residue_file_count|status|production_write_execution|source_config_write_count|target_config_write_count|backup_write_count|worker_restart_count|validation_process_stop_count|application_deploy_count|symlink_write_count|application_migration_count|cms_or_database_authority_write_count|publication_or_discoverability_write_count)='
          test -z "$(grep -Ev "$known_keys" <<<"$result" || true)"
          value() {
            local key="$1"
            awk -F= -v key="$key" '$1 == key {print substr($0, length(key) + 2)}' <<<"$result"
          }
          for key in \
            active_revision failed_run_id source_path_sha256 \
            source_original_config_sha256 source_current_config_sha256 \
            target_path_sha256 target_current_sha256 backup_sha256 \
            foreign_runtime_fingerprint_sha256 ops_worker_pid_sha256 \
            ops_worker_process_count ops_pending_total residue_file_count \
            residue_set_sha256 validation_process_state \
            validation_process_fingerprint_sha256 migration_process_state \
            migration_process_fingerprint_sha256 deleted_residue_file_count status \
            production_write_execution source_config_write_count target_config_write_count \
            backup_write_count worker_restart_count validation_process_stop_count \
            application_deploy_count symlink_write_count application_migration_count \
            cms_or_database_authority_write_count publication_or_discoverability_write_count; do
            field_value="$(value "$key")"
            test -n "$field_value"
            echo "$key=$field_value" >> "$GITHUB_OUTPUT"
          done
          test "$(value active_revision)" = "$EXPECTED_ACTIVE_REVISION"
          test "$(value failed_run_id)" = "$FAILED_RUN_ID"
          test "$(value source_path_sha256)" = "$EVIDENCE_SOURCE_PATH_SHA256"
          test "$(value source_original_config_sha256)" = "$EVIDENCE_SOURCE_ORIGINAL_CONFIG_SHA256"
          test "$(value source_current_config_sha256)" = "$EVIDENCE_SOURCE_CURRENT_CONFIG_SHA256"
          test "$(value target_path_sha256)" = "$EVIDENCE_TARGET_PATH_SHA256"
          test "$(value target_current_sha256)" = "$EVIDENCE_TARGET_CURRENT_SHA256"
          test "$(value foreign_runtime_fingerprint_sha256)" = "$EVIDENCE_FOREIGN_RUNTIME_FINGERPRINT_SHA256"
          test "$(value ops_worker_process_count)" = 1
          test "$(value ops_pending_total)" = 0
          test "$(value validation_process_state)" = absent
          test "$(value validation_process_fingerprint_sha256)" = "$(printf '0%.0s' {1..64})"
          test "$(value migration_process_state)" = absent
          test "$(value migration_process_fingerprint_sha256)" = "$(printf '0%.0s' {1..64})"
          test "$(value source_config_write_count)" = 0
          test "$(value target_config_write_count)" = 0
          test "$(value backup_write_count)" = 0
          test "$(value worker_restart_count)" = 0
          test "$(value validation_process_stop_count)" = 0
          test "$(value application_deploy_count)" = 0
          test "$(value symlink_write_count)" = 0
          test "$(value application_migration_count)" = 0
          test "$(value cms_or_database_authority_write_count)" = 0
          test "$(value publication_or_discoverability_write_count)" = 0
          if [ "$MODE" = preflight ]; then
            test "$(value status)" = PASS_PREFLIGHT
            test "$(value production_write_execution)" = false
            test "$(value deleted_residue_file_count)" = 0
          else
            test "$(value status)" = PASS_APPLY
            test "$(value production_write_execution)" = true
            test "$(value deleted_residue_file_count)" = "$EXPECTED_RESIDUE_FILE_COUNT"
          fi

      - name: Build sanitized immutable recovery receipt
        shell: bash
        env:
          MODE: ${{ needs.eligibility.outputs.mode }}
          CONTROL_PLANE_SHA: ${{ needs.eligibility.outputs.control_plane_sha }}
          EVIDENCE_RUN_ID: ${{ needs.eligibility.outputs.evidence_run_id }}
          EVIDENCE_RUN_ATTEMPT: ${{ needs.eligibility.outputs.evidence_run_attempt }}
          SOURCE_CONTROL_PLANE_SHA: ${{ needs.eligibility.outputs.source_control_plane_sha }}
          CURRENT_EVIDENCE_RUN_ID: ${{ needs.eligibility.outputs.current_evidence_run_id }}
          CURRENT_EVIDENCE_RUN_ATTEMPT: ${{ needs.eligibility.outputs.current_evidence_run_attempt }}
          FAILED_RUN_ID: ${{ needs.eligibility.outputs.failed_run_id }}
          FAILED_RUN_ATTEMPT: ${{ needs.eligibility.outputs.failed_run_attempt }}
          ACTIVE_REVISION: ${{ steps.control.outputs.active_revision }}
          STATUS: ${{ steps.control.outputs.status }}
          SOURCE_PATH_SHA256: ${{ steps.control.outputs.source_path_sha256 }}
          SOURCE_ORIGINAL_CONFIG_SHA256: ${{ steps.control.outputs.source_original_config_sha256 }}
          SOURCE_CURRENT_CONFIG_SHA256: ${{ steps.control.outputs.source_current_config_sha256 }}
          TARGET_PATH_SHA256: ${{ steps.control.outputs.target_path_sha256 }}
          TARGET_CURRENT_SHA256: ${{ steps.control.outputs.target_current_sha256 }}
          BACKUP_SHA256: ${{ steps.control.outputs.backup_sha256 }}
          FOREIGN_RUNTIME_FINGERPRINT_SHA256: ${{ steps.control.outputs.foreign_runtime_fingerprint_sha256 }}
          OPS_WORKER_PID_SHA256: ${{ steps.control.outputs.ops_worker_pid_sha256 }}
          OPS_WORKER_PROCESS_COUNT: ${{ steps.control.outputs.ops_worker_process_count }}
          OPS_PENDING_TOTAL: ${{ steps.control.outputs.ops_pending_total }}
          RESIDUE_FILE_COUNT: ${{ steps.control.outputs.residue_file_count }}
          RESIDUE_SET_SHA256: ${{ steps.control.outputs.residue_set_sha256 }}
          VALIDATION_PROCESS_STATE: ${{ steps.control.outputs.validation_process_state }}
          VALIDATION_PROCESS_FINGERPRINT_SHA256: ${{ steps.control.outputs.validation_process_fingerprint_sha256 }}
          MIGRATION_PROCESS_STATE: ${{ steps.control.outputs.migration_process_state }}
          MIGRATION_PROCESS_FINGERPRINT_SHA256: ${{ steps.control.outputs.migration_process_fingerprint_sha256 }}
          DELETED_RESIDUE_FILE_COUNT: ${{ steps.control.outputs.deleted_residue_file_count }}
          PRODUCTION_WRITE_EXECUTION: ${{ steps.control.outputs.production_write_execution }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/backend-production-ops-shared-residue-recovery.json"
          jq -n \
            --arg contract_version "backend.production_ops_shared_residue_recovery.v2" \
            --arg mode "$MODE" \
            --arg status "$STATUS" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg evidence_run_id "$EVIDENCE_RUN_ID" \
            --arg evidence_run_attempt "$EVIDENCE_RUN_ATTEMPT" \
            --arg source_control_plane_sha "$SOURCE_CONTROL_PLANE_SHA" \
            --arg current_evidence_run_id "$CURRENT_EVIDENCE_RUN_ID" \
            --arg current_evidence_run_attempt "$CURRENT_EVIDENCE_RUN_ATTEMPT" \
            --arg failed_run_id "$FAILED_RUN_ID" \
            --arg failed_run_attempt "$FAILED_RUN_ATTEMPT" \
            --arg control_plane_sha "$CONTROL_PLANE_SHA" \
            --arg active_revision "$ACTIVE_REVISION" \
            --arg source_path_sha256 "$SOURCE_PATH_SHA256" \
            --arg source_original_config_sha256 "$SOURCE_ORIGINAL_CONFIG_SHA256" \
            --arg source_current_config_sha256 "$SOURCE_CURRENT_CONFIG_SHA256" \
            --arg target_path_sha256 "$TARGET_PATH_SHA256" \
            --arg target_current_sha256 "$TARGET_CURRENT_SHA256" \
            --arg backup_sha256 "$BACKUP_SHA256" \
            --arg foreign_runtime_fingerprint_sha256 "$FOREIGN_RUNTIME_FINGERPRINT_SHA256" \
            --arg ops_worker_pid_sha256 "$OPS_WORKER_PID_SHA256" \
            --argjson ops_worker_process_count "$OPS_WORKER_PROCESS_COUNT" \
            --argjson ops_pending_total "$OPS_PENDING_TOTAL" \
            --argjson residue_file_count "$RESIDUE_FILE_COUNT" \
            --arg residue_set_sha256 "$RESIDUE_SET_SHA256" \
            --arg validation_process_state "$VALIDATION_PROCESS_STATE" \
            --arg validation_process_fingerprint_sha256 "$VALIDATION_PROCESS_FINGERPRINT_SHA256" \
            --arg migration_process_state "$MIGRATION_PROCESS_STATE" \
            --arg migration_process_fingerprint_sha256 "$MIGRATION_PROCESS_FINGERPRINT_SHA256" \
            --argjson deleted_residue_file_count "$DELETED_RESIDUE_FILE_COUNT" \
            --argjson production_write_execution "$PRODUCTION_WRITE_EXECUTION" \
            '{
              contract_version: $contract_version,
              mode: $mode,
              status: $status,
              run_id: $run_id,
              run_attempt: $run_attempt,
              evidence_run_id: $evidence_run_id,
              evidence_run_attempt: $evidence_run_attempt,
              source_control_plane_sha: $source_control_plane_sha,
              current_evidence_run_id: $current_evidence_run_id,
              current_evidence_run_attempt: $current_evidence_run_attempt,
              failed_run_id: $failed_run_id,
              failed_run_attempt: $failed_run_attempt,
              control_plane_sha: $control_plane_sha,
              active_revision: $active_revision,
              source_path_sha256: $source_path_sha256,
              source_original_config_sha256: $source_original_config_sha256,
              source_current_config_sha256: $source_current_config_sha256,
              target_path_sha256: $target_path_sha256,
              target_current_sha256: $target_current_sha256,
              backup_sha256: $backup_sha256,
              foreign_runtime_fingerprint_sha256: $foreign_runtime_fingerprint_sha256,
              ops_worker_pid_sha256: $ops_worker_pid_sha256,
              ops_worker_process_count: $ops_worker_process_count,
              ops_pending_total: $ops_pending_total,
              residue_file_count: $residue_file_count,
              residue_set_sha256: $residue_set_sha256,
              validation_process_state: $validation_process_state,
              validation_process_fingerprint_sha256: $validation_process_fingerprint_sha256,
              migration_process_state: $migration_process_state,
              migration_process_fingerprint_sha256: $migration_process_fingerprint_sha256,
              deleted_residue_file_count: $deleted_residue_file_count,
              production_write_execution: $production_write_execution,
              source_config_write_count: 0,
              target_config_write_count: 0,
              backup_write_count: 0,
              worker_restart_count: 0,
              validation_process_stop_count: 0,
              application_deploy_count: 0,
              symlink_write_count: 0,
              application_migration_count: 0,
              cms_or_database_authority_write_count: 0,
              publication_or_discoverability_write_count: 0
            }' > "$receipt"
          jq -e \
            '.ops_worker_process_count == 1
             and .ops_pending_total == 0
             and .validation_process_state == "absent"
             and .migration_process_state == "absent"
             and .source_config_write_count == 0
             and .target_config_write_count == 0
             and .backup_write_count == 0
             and .worker_restart_count == 0
             and .validation_process_stop_count == 0
             and .application_deploy_count == 0
             and .symlink_write_count == 0
             and .application_migration_count == 0
             and .cms_or_database_authority_write_count == 0
             and .publication_or_discoverability_write_count == 0' "$receipt" >/dev/null

      - name: Upload immutable shared residue recovery receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-production-ops-shared-residue-${{ needs.eligibility.outputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/backend-production-ops-shared-residue-recovery.json
          if-no-files-found: error
          retention-days: 30
