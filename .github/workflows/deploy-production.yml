name: Deploy API Production

on:
  workflow_dispatch:
    inputs:
      expected_release_sha:
        description: "Exact 40-character staged release SHA to deploy"
        required: true
        type: string
      staging_run_id:
        description: "Successful Deploy Application staging run; optional for standard, which resolves the latest exact-SHA success"
        required: false
        default: ""
        type: string
      release_id:
        description: "Operator-approved release identifier; optional for standard, which derives standard-<sha12>"
        required: false
        type: string
      operator_approval_phrase:
        description: "Exact SHA-bound production deploy approval phrase"
        required: true
        type: string
      deploy_mode:
        description: "auto permits strict code-only scope; candidate_only materializes an inactive exact release; schema_only requires one exact approved migration"
        required: true
        type: string
      expected_deployed_revision:
        description: "Required current production REVISION for auto, code_only, or schema_only"
        required: false
        default: ""
        type: string
      approved_migration:
        description: "Exact migration filename required only for schema_only"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

env:
  TARGET: production
  DEPLOYER_VERSION: "7.5.12"
  DEPLOYER_SHA256: "b55c6609653e888c672d327c407f8bba6324b9c9cc24f9dcfb3f4b3922760632"
  SSH_RETRY_ATTEMPTS: "3"
  SSH_RETRY_DELAY_SECONDS: "10"
  DEPLOY_SHA: ${{ inputs.expected_release_sha }}
  RELEASE_ID: ${{ inputs.release_id }}

jobs:
  deployment-eligibility:
    name: Resolve production deployment eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      eligible: ${{ steps.latest_main_guard.outputs.eligible }}
      deploy_sha: ${{ steps.latest_main_guard.outputs.deploy_sha }}
      deploy_mode: ${{ steps.resolve_deploy_mode.outputs.deploy_mode }}
      exact_active_candidate_fast_path: ${{ steps.resolve_deploy_mode.outputs.exact_active_candidate_fast_path }}
      isolated_runtime46: ${{ steps.resolve_deploy_mode.outputs.isolated_runtime46 }}
      isolated_index52: ${{ steps.resolve_deploy_mode.outputs.isolated_index52 }}
      require_ops_queue_reload: ${{ steps.resolve_deploy_mode.outputs.require_ops_queue_reload }}
      require_career_candidate_preflight: ${{ steps.resolve_deploy_mode.outputs.require_career_candidate_preflight }}
      career_public_cache_summary_sha256: ${{ steps.resolve_deploy_mode.outputs.career_public_cache_summary_sha256 }}
      career_expected_candidate_summary_sha256: ${{ steps.resolve_deploy_mode.outputs.career_expected_candidate_summary_sha256 }}
      career_cache_repair_required: ${{ steps.resolve_deploy_mode.outputs.career_cache_repair_required }}
      release_id: ${{ steps.resolve_deploy_mode.outputs.release_id }}
      staging_run_id: ${{ steps.resolve_deploy_mode.outputs.staging_run_id }}
      main_sha: ${{ steps.latest_main_guard.outputs.main_sha }}
      staging_sha: ${{ steps.resolve_deploy_mode.outputs.staging_sha }}
    steps:
      - name: Checkout deploy revision for eligibility
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0

      - name: Validate manual exact-SHA approval and staging evidence
        id: resolve_deploy_mode
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
          RELEASE_ID: ${{ inputs.release_id }}
          OPERATOR_APPROVAL_PHRASE: ${{ inputs.operator_approval_phrase }}
          REQUESTED_DEPLOY_MODE: ${{ inputs.deploy_mode }}
          EXPECTED_DEPLOYED_REVISION: ${{ inputs.expected_deployed_revision }}
          APPROVED_MIGRATION: ${{ inputs.approved_migration }}
          TRUSTED_STAGING_WORKFLOW_SHA256: ${{ vars.PRODUCTION_TRUSTED_STAGING_WORKFLOW_SHA256 }}
        run: |
          set -euo pipefail
          if [[ ! "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_release_sha must be a lowercase 40-character Git SHA." >&2
            exit 2
          fi
          if [ "$REQUESTED_DEPLOY_MODE" = "standard" ] && [ -z "${RELEASE_ID:-}" ]; then
            RELEASE_ID="standard-${DEPLOY_SHA:0:12}"
          fi
          if [[ ! "$RELEASE_ID" =~ ^[A-Za-z0-9._-]{1,80}$ ]]; then
            echo "release_id must use 1-80 safe identifier characters." >&2
            exit 2
          fi
          case "$REQUESTED_DEPLOY_MODE" in
            auto|code_only|candidate_only|schema_only|standard) ;;
            *)
              echo "deploy_mode must be auto, code_only, candidate_only, schema_only, or standard." >&2
              exit 2
              ;;
          esac
          REQUIRE_OPS_QUEUE_RELOAD=false
          REQUIRE_CAREER_CANDIDATE_PREFLIGHT=false
          CAREER_PUBLIC_CACHE_SUMMARY_SHA256=""
          CAREER_EXPECTED_CANDIDATE_SUMMARY_SHA256=""
          CAREER_CACHE_REPAIR_REQUIRED=false
          EXACT_ACTIVE_CANDIDATE_FAST_PATH=false
          case "$REQUESTED_DEPLOY_MODE" in
            standard)
              if [ -n "$APPROVED_MIGRATION" ]; then
                echo "standard deploy requires approved_migration to be omitted; do not submit false. Use schema_only for an exact migration." >&2
                exit 2
              fi
              if [ -z "$STAGING_RUN_ID" ]; then
                RUNS_JSON="$(gh run list --workflow deploy.yml --branch main --commit "$DEPLOY_SHA" --status completed --limit 100 --json databaseId,headSha,name,event,status,conclusion)"
                STAGING_RUN_ID="$(jq -r --arg deploy_sha "$DEPLOY_SHA" '
                  [.[]
                   | select(.name == "Deploy Application"
                       and (.event == "push" or .event == "workflow_dispatch")
                       and .status == "completed"
                       and .conclusion == "success"
                       and .headSha == $deploy_sha)
                   | .databaseId]
                  | max // empty
                ' <<<"$RUNS_JSON")"
                if [[ ! "$STAGING_RUN_ID" =~ ^[0-9]+$ ]]; then
                  echo "standard deploy could not resolve a successful exact-SHA staging run." >&2
                  exit 1
                fi
              fi
              RESOLVED_DEPLOY_MODE=standard
              EXPECTED_APPROVAL="I explicitly approve bounded backend production deploy for exact SHA ${DEPLOY_SHA}, excluding all newer main commits, release ${RELEASE_ID}."
              ;;
            schema_only)
              if [[ ! "$EXPECTED_DEPLOYED_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
                echo "schema_only requires expected_deployed_revision as a lowercase 40-character deployed REVISION." >&2
                exit 2
              fi
              if [[ ! "$APPROVED_MIGRATION" =~ ^[0-9]{4}_[0-9]{2}_[0-9]{2}_[0-9]{6}_[A-Za-z0-9_]+\.php$ ]]; then
                echo "schema_only requires one exact approved_migration filename." >&2
                exit 2
              fi
              MIGRATION_PATH="backend/database/migrations/${APPROVED_MIGRATION}"
              if [ ! -f "$MIGRATION_PATH" ]; then
                echo "schema-only deployment refused: approved migration does not exist at the exact SHA." >&2
                exit 1
              fi
              if ! git cat-file -e "${EXPECTED_DEPLOYED_REVISION}^{commit}"; then
                echo "schema-only scope classification cannot resolve expected_deployed_revision." >&2
                exit 1
              fi
              if ! git merge-base --is-ancestor "$EXPECTED_DEPLOYED_REVISION" "$DEPLOY_SHA"; then
                echo "schema-only scope classification requires expected_deployed_revision to be an ancestor of expected_release_sha." >&2
                exit 1
              fi
              mapfile -t MIGRATION_DIFF < <(git diff --no-renames --name-status "$EXPECTED_DEPLOYED_REVISION" "$DEPLOY_SHA" -- backend/database/migrations)
              if [ "${#MIGRATION_DIFF[@]}" -ne 1 ] || [ "${MIGRATION_DIFF[0]}" != $'A\t'"$MIGRATION_PATH" ]; then
                echo "schema-only deployment refused: cumulative diff must add exactly the approved migration and no other migration." >&2
                exit 1
              fi
              mapfile -t CHANGED_FILES < <(git diff --no-renames --name-only "$EXPECTED_DEPLOYED_REVISION" "$DEPLOY_SHA")
              SCHEMA_ONLY_SCOPE=true
              for path in "${CHANGED_FILES[@]}"; do
                case "$path" in
                  "$MIGRATION_PATH") ;;
                  backend/database/*|backend/content_assets/*|backend/content_packs/*|backend/content_baselines/*|backend/public/*|backend/resources/*|content_assets/*|content_packages/*|content_baselines/*|docs/seo/*|backend/storage/*)
                    SCHEMA_ONLY_SCOPE=false
                    echo "schema-only scope refused authority or database path: $path" >&2
                    ;;
                  backend/app/*|backend/bootstrap/*|backend/config/*|backend/routes/*|backend/tests/*|tests/*|backend/composer.json|backend/composer.lock|deploy.php|.github/workflows/deploy-production.yml|docs/codex/*|generated/*)
                    ;;
                  *)
                    SCHEMA_ONLY_SCOPE=false
                    echo "schema-only scope refused unknown path: $path" >&2
                    ;;
                esac
              done
              if [ "$SCHEMA_ONLY_SCOPE" != true ]; then
                echo "schema-only deployment refused: cumulative deployed-revision diff contains a forbidden or unknown path." >&2
                exit 1
              fi
              RESOLVED_DEPLOY_MODE=schema_only
              EXPECTED_APPROVAL="I explicitly approve backend schema-only production deploy for SHA ${DEPLOY_SHA} release ${RELEASE_ID} migration ${APPROVED_MIGRATION}."
              ;;
            auto|code_only|candidate_only)
              if [ -n "$APPROVED_MIGRATION" ]; then
                echo "auto/code_only/candidate_only refuses approved_migration; use schema_only for an exact migration." >&2
                exit 2
              fi
              if [[ ! "$EXPECTED_DEPLOYED_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
                echo "auto/code_only/candidate_only requires expected_deployed_revision as a lowercase 40-character deployed REVISION." >&2
                exit 2
              fi
              if ! git cat-file -e "${EXPECTED_DEPLOYED_REVISION}^{commit}"; then
                git fetch --no-tags origin "$EXPECTED_DEPLOYED_REVISION" >/dev/null 2>&1 || {
                  echo "code-only scope classification cannot fetch expected_deployed_revision." >&2
                  exit 1
                }
                git cat-file -e "${EXPECTED_DEPLOYED_REVISION}^{commit}" || {
                  echo "code-only scope classification cannot resolve expected_deployed_revision." >&2
                  exit 1
                }
              fi
              if [ "$REQUESTED_DEPLOY_MODE" = candidate_only ] \
                && [ "$DEPLOY_SHA" = "$EXPECTED_DEPLOYED_REVISION" ]; then
                EXACT_ACTIVE_CANDIDATE_FAST_PATH=true
              fi
              if [ "$REQUESTED_DEPLOY_MODE" = candidate_only ]; then
                if [ "$EXACT_ACTIVE_CANDIDATE_FAST_PATH" = true ]; then
                  echo "candidate_only accepted an empty diff for the exact-active same-SHA inactive-release fast path."
                else
                  if ! git merge-base --is-ancestor "$EXPECTED_DEPLOYED_REVISION" "$DEPLOY_SHA"; then
                    echo "candidate_only materialization requires the current active revision to be an ancestor of the candidate." >&2
                    exit 1
                  fi
                  mapfile -t CANDIDATE_CHANGED_FILES < <(git diff --no-renames --name-only "$EXPECTED_DEPLOYED_REVISION" "$DEPLOY_SHA")
                  if [ "${#CANDIDATE_CHANGED_FILES[@]}" -eq 0 ]; then
                    echo "candidate_only materialization refused an unexplained empty active-to-candidate diff." >&2
                    exit 1
                  fi
                  echo "candidate_only accepted an exact staged main-ancestor artifact without reusing the code-only cumulative path allowlist."
                fi
                RESOLVED_DEPLOY_MODE=candidate_only
                if [ "$EXACT_ACTIVE_CANDIDATE_FAST_PATH" = true ]; then
                  EXPECTED_APPROVAL="I explicitly approve backend exact-active inactive candidate materialization for SHA ${DEPLOY_SHA} release ${RELEASE_ID}; same revision, distinct release path, zero activation."
                else
                  EXPECTED_APPROVAL="I explicitly approve bounded backend inactive candidate materialization for exact SHA ${DEPLOY_SHA} using exact staging run ${STAGING_RUN_ID} from active SHA ${EXPECTED_DEPLOYED_REVISION}, excluding all newer main commits, release ${RELEASE_ID}; distinct inactive release path, zero activation."
                fi
              else
                CLASSIFICATION_BASE="$EXPECTED_DEPLOYED_REVISION"
                if ! git merge-base --is-ancestor "$EXPECTED_DEPLOYED_REVISION" "$DEPLOY_SHA"; then
                  AUDITED_RUNTIME46_PRODUCTION_SHA="bc0ed833bc9aae1473ab37f1dead2517e1aff618"
                  AUDITED_RUNTIME46_BRIDGE_SHA="49038deb50cda789e4365ea42068832ed28d6023"
                  if [ "$EXPECTED_DEPLOYED_REVISION" != "$AUDITED_RUNTIME46_PRODUCTION_SHA" ] \
                    || ! git merge-base --is-ancestor "$AUDITED_RUNTIME46_BRIDGE_SHA" "$DEPLOY_SHA"; then
                    echo "code-only scope classification requires a linear deployed revision or the exact audited Runtime 46 subsumed baseline." >&2
                    exit 1
                  fi
                  CLASSIFICATION_BASE="$(git rev-parse "${EXPECTED_DEPLOYED_REVISION}^")"
                  test "$CLASSIFICATION_BASE" = "781d1636b2c74f5852076a5864b681910a1e0e47"
                  expected_runtime46_diff="$(printf '%s\n' \
                    $'A\tbackend/app/Console/Commands/PersonalityMbtiCompRuntime46IntpPromote.php' \
                    $'A\tbackend/app/Console/Commands/PersonalityMbtiCompRuntime46IntpRevision.php' \
                    $'A\tbackend/app/Services/Cms/MbtiCompRuntime46IntpPromotionService.php' \
                    $'M\tbackend/app/Services/Cms/MbtiFullCmsImportService.php' \
                    $'A\tbackend/docs/seo/import-packages/mbti-comp-runtime-46-intp-revision-2026-07-19.json' \
                    $'A\tbackend/tests/Feature/Console/PersonalityMbtiCompRuntime46IntpRevisionCommandTest.php')"
                  actual_runtime46_diff="$(git diff --no-renames --name-status "$CLASSIFICATION_BASE" "$EXPECTED_DEPLOYED_REVISION")"
                  test "$actual_runtime46_diff" = "$expected_runtime46_diff"
                  while IFS= read -r runtime46_path; do
                    test -n "$runtime46_path"
                    test "$(git rev-parse "${EXPECTED_DEPLOYED_REVISION}:${runtime46_path}")" = \
                      "$(git rev-parse "${DEPLOY_SHA}:${runtime46_path}")"
                  done < <(printf '%s\n' "$expected_runtime46_diff" | cut -f2)
                  echo "code-only scope classification accepted the exact audited Runtime 46 subsumed baseline."
                fi
                mapfile -t CHANGED_FILES < <(git diff --no-renames --name-only "$CLASSIFICATION_BASE" "$DEPLOY_SHA")
                if [ "${#CHANGED_FILES[@]}" -eq 0 ]; then
                  echo "code-only scope classification refused an empty deployed-revision diff." >&2
                  exit 1
                fi
                CODE_ONLY_SCOPE=true
                # The W1 content-promotion executor must be deployed before its
                # exact-package workflow can run, but the standard deploy task
                # always invokes Laravel migrations. Keep this exception
                # fail-closed: it accepts one audited active-to-candidate diff,
                # one exact staging receipt, and no migration files. The actual
                # Deployer task remains deploy:code-only, which excludes
                # migration and CMS/discoverability authority mutation.
                W1_CONTENT_EXECUTOR_CODE_ONLY=false
                W1_CONTENT_EXECUTOR_ACTIVE_SHA="beaec277058534189176a6814d2c0f3c116cc4ce"
                W1_CONTENT_EXECUTOR_CANDIDATE_SHA="44bd661c18dd470ae8d2dca48f101f37db306418"
                W1_CONTENT_EXECUTOR_STAGING_RUN_ID="30760540181"
                W1_CONTENT_EXECUTOR_DIFF_SHA256="423f2d9b7a3907648d0769023297a8002383a1da64f554ba03a97a6b5deffa48"
                if [ "$REQUESTED_DEPLOY_MODE" = code_only ] \
                  && [ "$EXPECTED_DEPLOYED_REVISION" = "$W1_CONTENT_EXECUTOR_ACTIVE_SHA" ] \
                  && [ "$DEPLOY_SHA" = "$W1_CONTENT_EXECUTOR_CANDIDATE_SHA" ]; then
                  test "$STAGING_RUN_ID" = "$W1_CONTENT_EXECUTOR_STAGING_RUN_ID"
                  test "$(git diff --binary "$EXPECTED_DEPLOYED_REVISION" "$DEPLOY_SHA" | sha256sum | awk '{print $1}')" = \
                    "$W1_CONTENT_EXECUTOR_DIFF_SHA256"
                  test -z "$(git diff --no-renames --name-only "$EXPECTED_DEPLOYED_REVISION" "$DEPLOY_SHA" -- backend/database/migrations)"
                  W1_CONTENT_EXECUTOR_CODE_ONLY=true
                  echo "code-only scope accepted the exact W1 content-promotion executor release without migrations or authority writes."
                fi
                for path in "${CHANGED_FILES[@]}"; do
                  case "$path" in
                  backend/content_assets/en-content-parity/W9/mbti-results/9325013b-renderer-643b7a80/external_evidence_envelope.json|backend/content_assets/en-content-parity/W9/mbti-results/9325013b-renderer-643b7a80/independent_qa_report.json)
                    if [ "$W1_CONTENT_EXECUTOR_CODE_ONLY" = true ]; then
                      echo "code-only scope accepted the exact immutable W1 external W9 evidence: $path"
                    else
                      CODE_ONLY_SCOPE=false
                      echo "code-only scope refused unbound W1 external W9 evidence: $path" >&2
                    fi
                    ;;
                  backend/app/Services/Cms/PersonalityPublicAssetReadModelCache.php|backend/app/Services/Cms/PersonalityPublicContentAssetContract.php)
                    echo "code-only scope accepted audited personality runtime projection service: $path"
                    ;;
                  backend/app/Filament/Ops/Resources/AdminApprovalResource.php|backend/app/Models/AdminApproval.php)
                    REQUIRE_OPS_QUEUE_RELOAD=true
                    echo "code-only scope accepted approval runtime path and requires ops queue reload: $path"
                    ;;
                  .github/workflows/deploy.yml)
                    if [[ ! "$TRUSTED_STAGING_WORKFLOW_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
                      echo "code-only scope requires an external trusted SHA-256 receipt for deploy.yml." >&2
                      CODE_ONLY_SCOPE=false
                    elif [ "$(sha256sum .github/workflows/deploy.yml | awk '{print $1}')" != "$TRUSTED_STAGING_WORKFLOW_SHA256" ]; then
                      echo "code-only scope refused deploy.yml because its SHA-256 does not match the external trusted receipt." >&2
                      CODE_ONLY_SCOPE=false
                    else
                      echo "code-only scope accepted deploy.yml against the external trusted SHA-256 receipt."
                    fi
                    ;;
                  .github/workflows/mbti-comp-runtime46-production-ops.yml|backend/app/Models/DailyGivingRecord.php|backend/app/Services/Cms/Mbti64CrossTypeComparisonPublicReadModel.php|backend/docs/career/README.md|backend/docs/career/career-detail-stability-train-2026-07-18.md|backend/docs/career/job-detail-cache-coverage.md|backend/docs/seo/generated/mbti-comp-runtime-46-production-acceptance.v1.json|backend/docs/seo/mbti-comp-runtime-46-production-acceptance.md|docs/ops/big-five-en52-release.md|docs/ops/big-five-legacy-alias-hard-purge.md)
                    echo "code-only scope accepted exact audited Root5 runtime or inert evidence path: $path"
                    ;;
                  backend/docs/career/publish_track_reconciliation.json)
                    REQUIRE_CAREER_CANDIDATE_PREFLIGHT=true
                    echo "code-only scope conditionally accepted the exact Career reconciliation authority input pending live-cache and candidate-rebuild equivalence: $path"
                    ;;
                  .github/workflows/career-detail-production-cache-repair.yml|backend/app/Services/Cms/Mbti64CmsInternalLinkDraftWriter.php|backend/app/Services/Cms/MbtiCrossPublisher49ContentService.php|backend/app/Services/Cms/MbtiCrossPublisher49IndexabilityService.php|backend/app/Services/Cms/MbtiCrossPublisher49Package.php|backend/content_assets/personality_public/mbti-cross-approval-48-operator-authorization-r2-2026-07-23.json|backend/content_assets/personality_public/mbti-cross-approval-48-package-2026-07-23.json|docs/04-ops/deploy-incident-runbook.md|docs/seo/career-jobs-index-lkg-resilience-01.md|docs/seo/career-pilot-review-evidence-bridge-01.md)
                    echo "code-only scope accepted exact audited subsumed runtime or inert authority input path: $path"
                    ;;
                  backend/app/Console/Commands/PersonalityMbtiCompRuntime46IntpPromote.php|backend/app/Console/Commands/PersonalityMbtiCompRuntime46IntpRevision.php|backend/app/Services/Cms/MbtiCompRuntime46IntpPromotionService.php|backend/app/Services/Cms/MbtiFullCmsImportService.php|backend/docs/seo/import-packages/mbti-comp-runtime-46-intp-revision-2026-07-19.json|backend/tests/Feature/Console/PersonalityMbtiCompRuntime46IntpRevisionCommandTest.php)
                    echo "code-only scope accepted exact isolated Runtime 46 path: $path"
                    ;;
                  backend/.env.example|backend/scripts/pr71_verify.sh)
                    echo "code-only scope accepted audited non-runtime release metadata or verification path: $path"
                    ;;
                  backend/app/Console/Commands/CareerVerifyPublicDatasetCacheEquivalence.php)
                    EXPECTED_CAREER_EQUIVALENCE_VERIFIER_SHA256="e02a12517b69de48eab515d8ea9f48dadf6bb30345cfba0f99d0538d89b0de30"
                    test "$(sha256sum "$path" | awk '{print $1}')" = \
                      "$EXPECTED_CAREER_EQUIVALENCE_VERIFIER_SHA256" || {
                      CODE_ONLY_SCOPE=false
                      echo "code-only scope refused an unreviewed Career dataset equivalence verifier hash." >&2
                    }
                    ;;
                  backend/scripts/deploy/career_candidate_exact_cache_bootstrap.php)
                    EXPECTED_CAREER_BOOTSTRAP_RUNNER_SHA256="603d5d7f1d53057903ec76baad238a818c8ecefbd0d00f0f312e01d57068de86"
                    test "$(sha256sum "$path" | awk '{print $1}')" = \
                      "$EXPECTED_CAREER_BOOTSTRAP_RUNNER_SHA256" || {
                      CODE_ONLY_SCOPE=false
                      echo "code-only scope refused an unreviewed Career candidate bootstrap runner hash." >&2
                    }
                    ;;
                  backend/scripts/deploy/verify_sitemap_source_cache_warm.sh)
                    EXPECTED_SITEMAP_WARM_VERIFIER_SHA256="04f9d6b6b66b0be10a4996064cdf9150e1b0f1ec300edf93f87e8c0368ea0713"
                    test "$(sha256sum "$path" | awk '{print $1}')" = \
                      "$EXPECTED_SITEMAP_WARM_VERIFIER_SHA256" || {
                      CODE_ONLY_SCOPE=false
                      echo "code-only scope refused an unreviewed sitemap source-cache warm verifier hash." >&2
                    }
                    ;;
                  backend/scripts/deploy/immutable_candidate_sitemap_control.php)
                    EXPECTED_IMMUTABLE_SITEMAP_CONTROL_SHA256="5111aac8197ba8df85698eab2a199475baab7ef7456db01dfb698ed54a928dcf"
                    test "$(sha256sum "$path" | awk '{print $1}')" = \
                      "$EXPECTED_IMMUTABLE_SITEMAP_CONTROL_SHA256" || {
                      CODE_ONLY_SCOPE=false
                      echo "code-only scope refused an unreviewed immutable sitemap control hash." >&2
                    }
                    ;;
                  backend/scripts/deploy/bounded_candidate_public_dns_control.php)
                    EXPECTED_BOUNDED_PUBLIC_DNS_CONTROL_SHA256="5e3b3aa09f971a7b0706a0835a72007eacaa5b2582c37a97898119a1b524784b"
                    test "$(sha256sum "$path" | awk '{print $1}')" = \
                      "$EXPECTED_BOUNDED_PUBLIC_DNS_CONTROL_SHA256" || {
                      CODE_ONLY_SCOPE=false
                      echo "code-only scope refused an unreviewed bounded public-DNS control hash." >&2
                    }
                    ;;
                  backend/scripts/seo/seo_13_article_atomic_promotion_production_ops.sh)
                    EXPECTED_SEO13_PREFLIGHT_RUNNER_SHA256="ceab5aa7d97a27f2d9d5d8f803897296baf00dade2387cd4e59a77884bb0ad26"
                    test "$(sha256sum "$path" | awk '{print $1}')" = \
                      "$EXPECTED_SEO13_PREFLIGHT_RUNNER_SHA256" || {
                      CODE_ONLY_SCOPE=false
                      echo "code-only scope refused an unreviewed SEO13 preflight runner hash." >&2
                    }
                    ;;
                  .github/workflows/backend-production-release-discovery.yml|.github/workflows/backend-production-verify-only.yml|.github/workflows/backend-production-ops-queue-control.yml|deploy/supervisor/fap-queue-ops.conf.template|AGENTS.md|backend/AGENTS.md|backend/docs/career/job-detail-atomic-exposure.md|backend/scripts/deploy/verify_scale_lookup.sh|docs/operations/generated/solo-owner-review-surface-registry.v1.json|docs/operations/solo-owner-review-protocol.md|docs/ops/release-train.md)
                    echo "code-only scope accepted audited release support path: $path"
                    ;;
                  backend/database/*|backend/content_assets/*|backend/content_packs/*|backend/content_baselines/*|content_assets/*|content_packages/*|content_baselines/*|docs/seo/*|backend/storage/*|backend/app/Services/Cms/*|backend/app/Filament/*|backend/app/Models/*|backend/resources/views/*)
                    CODE_ONLY_SCOPE=false
                    echo "code-only scope refused authority path: $path" >&2
                    ;;
                  backend/app/*|backend/bootstrap/*|backend/config/*|backend/public/*|backend/resources/*|backend/routes/*|backend/tests/*|tests/*|backend/composer.json|backend/composer.lock|deploy.php|.github/workflows/deploy-production.yml|docs/codex/*|generated/*)
                    ;;
                  *)
                    CODE_ONLY_SCOPE=false
                    echo "code-only scope refused unknown path: $path" >&2
                    ;;
                  esac
                done
                if [ "$REQUIRE_CAREER_CANDIDATE_PREFLIGHT" = true ]; then
                  EXPECTED_CAREER_RECONCILIATION_SHA256="98880c3de1473e1dd9ff2466e256a888ccad3620540ad7d42b19d556cefff184"
                  EXPECTED_CAREER_PUBLIC_CACHE_SUMMARY_SHA256="53e4e854dadee2260637c0288ead58818808bad098c3fce8e2168ea38746ba09"
                  AUDITED_STALE_CAREER_PUBLIC_CACHE_SUMMARY_SHA256="cb248a673e4827a4dcaae3f41f74cffd50d99f73984286cb733e6ba0b935158b"
                  test "$(sha256sum backend/docs/career/publish_track_reconciliation.json | awk '{print $1}')" = \
                    "$EXPECTED_CAREER_RECONCILIATION_SHA256" || {
                    echo "code-only scope refused an unreviewed Career reconciliation candidate hash." >&2
                    exit 1
                  }
                  read_career_public_cache_summary_sha256() {
                    local dataset summary
                    dataset="$(curl --http1.1 --connect-timeout 3 --max-time 10 -fsS \
                      "https://api.fermatmind.com/api/v0.5/career/datasets/occupations")"
                    summary="$(jq -cS '{
                      contract_version,
                      manifest_version: .collection_summary.manifest_version,
                      member_count: .collection_summary.member_count,
                      tracking_counts: .collection_summary.tracking_counts,
                      publish_track_distribution: .collection_summary.facet_distributions.publish_track,
                      members: [
                        .members[]
                        | {canonical_slug, publish_track}
                      ] | sort_by(.canonical_slug, .publish_track)
                    }' <<<"$dataset")"
                    printf '%s' "$summary" | sha256sum | awk '{print $1}'
                  }
                  first_career_summary_sha256="$(read_career_public_cache_summary_sha256)"
                  second_career_summary_sha256="$(read_career_public_cache_summary_sha256)"
                  test "$first_career_summary_sha256" = "$second_career_summary_sha256"
                  CAREER_PUBLIC_CACHE_SUMMARY_SHA256="$first_career_summary_sha256"
                  CAREER_EXPECTED_CANDIDATE_SUMMARY_SHA256="$EXPECTED_CAREER_PUBLIC_CACHE_SUMMARY_SHA256"
                  case "$CAREER_PUBLIC_CACHE_SUMMARY_SHA256" in
                    "$EXPECTED_CAREER_PUBLIC_CACHE_SUMMARY_SHA256")
                      echo "code-only scope verified the exact candidate-equivalent Career public cache."
                      ;;
                    "$AUDITED_STALE_CAREER_PUBLIC_CACHE_SUMMARY_SHA256")
                      CAREER_CACHE_REPAIR_REQUIRED=true
                      echo "code-only scope accepted the exact audited stale Career cache pending atomic candidate repair and rollback protection."
                      ;;
                    *)
                      echo "code-only scope refused an unreviewed Career public-cache summary." >&2
                      exit 1
                      ;;
                  esac
                fi
                if [ "$CODE_ONLY_SCOPE" != true ]; then
                  echo "code-only deployment refused: cumulative deployed-revision diff contains a forbidden or unknown path; rerun only with an explicit standard deployment approval." >&2
                  exit 1
                fi
                RESOLVED_DEPLOY_MODE=code_only
                EXPECTED_APPROVAL="I explicitly approve backend code-only production deploy for SHA ${DEPLOY_SHA} release ${RELEASE_ID}."
              fi
              ;;
          esac
          if [ "$EXACT_ACTIVE_CANDIDATE_FAST_PATH" = true ]; then
            if [ -n "$STAGING_RUN_ID" ]; then
              echo "exact-active candidate_only fast path requires staging_run_id to be empty." >&2
              exit 2
            fi
          elif [[ ! "$STAGING_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "staging_run_id must be numeric outside the exact-active candidate_only fast path." >&2
            exit 2
          fi
          if [ "$OPERATOR_APPROVAL_PHRASE" != "$EXPECTED_APPROVAL" ]; then
            echo "operator_approval_phrase does not match the exact SHA-bound approval phrase for ${RESOLVED_DEPLOY_MODE}." >&2
            exit 2
          fi
          echo "deploy_mode=$RESOLVED_DEPLOY_MODE" >> "$GITHUB_OUTPUT"
          echo "exact_active_candidate_fast_path=$EXACT_ACTIVE_CANDIDATE_FAST_PATH" >> "$GITHUB_OUTPUT"
          echo "isolated_runtime46=false" >> "$GITHUB_OUTPUT"
          echo "isolated_index52=false" >> "$GITHUB_OUTPUT"
          echo "require_ops_queue_reload=$REQUIRE_OPS_QUEUE_RELOAD" >> "$GITHUB_OUTPUT"
          echo "require_career_candidate_preflight=$REQUIRE_CAREER_CANDIDATE_PREFLIGHT" >> "$GITHUB_OUTPUT"
          echo "career_public_cache_summary_sha256=$CAREER_PUBLIC_CACHE_SUMMARY_SHA256" >> "$GITHUB_OUTPUT"
          echo "career_expected_candidate_summary_sha256=$CAREER_EXPECTED_CANDIDATE_SUMMARY_SHA256" >> "$GITHUB_OUTPUT"
          echo "career_cache_repair_required=$CAREER_CACHE_REPAIR_REQUIRED" >> "$GITHUB_OUTPUT"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "staging_run_id=$STAGING_RUN_ID" >> "$GITHUB_OUTPUT"

          if [ "$EXACT_ACTIVE_CANDIDATE_FAST_PATH" = true ]; then
            echo "staging_sha=" >> "$GITHUB_OUTPUT"
            echo "Exact-active same-SHA candidate_only fast path waived staging evidence."
            exit 0
          fi

          RUN_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${STAGING_RUN_ID}")"
          jq -e \
            '.name == "Deploy Application"
             and .path == ".github/workflows/deploy.yml"
             and (.event == "push" or .event == "workflow_dispatch")
             and .status == "completed"
             and .conclusion == "success"
             and .head_branch == "main"
             and (.head_sha | type == "string" and test("^[0-9a-f]{40}$"))' <<<"$RUN_JSON" >/dev/null
          STAGING_SHA="$(jq -r '.head_sha' <<<"$RUN_JSON")"

          if [ "$STAGING_SHA" != "$DEPLOY_SHA" ]; then
            INDEX52_CANDIDATE_SHA="9d2877a7e519f768fd741398e76777620770fb71"
            INDEX52_ACTIVE_SHA="e7ed3b9e894730ff0f973687eb552337db5c6db9"
            INDEX52_STAGED_MAIN_SHA="e9166c5eae03ad13c7ef616b9ca7c528d14bd582"
            INDEX52_STAGING_RUN_ID="30268270565"
            INDEX52_PATCH_SHA256="2cf768ab7896be204b983c377bce5d1b00771f6a5c2dd62c82d5c265b0748f00"
            index52_expected_files="$(printf '%s\n' \
              backend/app/Http/Controllers/API/V0_5/Cms/PersonalityController.php \
              backend/app/Services/Cms/Mbti64CrossTypeComparisonPublicReadModel.php)"
            if [ "$RESOLVED_DEPLOY_MODE" = code_only ] \
              && [ "$DEPLOY_SHA" = "$INDEX52_CANDIDATE_SHA" ]; then
              test "$EXPECTED_DEPLOYED_REVISION" = "$INDEX52_ACTIVE_SHA"
              test "$STAGING_SHA" = "$INDEX52_STAGED_MAIN_SHA"
              test "$STAGING_RUN_ID" = "$INDEX52_STAGING_RUN_ID"
              test "$(git rev-list --parents -n 1 "$DEPLOY_SHA" | awk '{print NF}')" -eq 2
              test "$(git rev-parse "${DEPLOY_SHA}^")" = "$INDEX52_ACTIVE_SHA"
              test "$(git diff --no-renames --name-only "$INDEX52_ACTIVE_SHA" "$DEPLOY_SHA" | sort)" = "$index52_expected_files"
              test "$(git diff --binary "$INDEX52_ACTIVE_SHA" "$DEPLOY_SHA" | sha256sum | awk '{print $1}')" = "$INDEX52_PATCH_SHA256"
              while IFS= read -r path; do
                test -n "$path"
                test "$(git rev-parse "${DEPLOY_SHA}:${path}")" = "$(git rev-parse "${STAGING_SHA}:${path}")"
              done <<<"$index52_expected_files"
              echo "isolated_index52=true" >> "$GITHUB_OUTPUT"
              echo "staging evidence accepted: exact isolated INDEX-52 runtime candidate is byte-identical to the staged main read model."
            else
              receipt_dir="$(mktemp -d)"
              if gh run download "$STAGING_RUN_ID" --name "mbti-runtime46-isolated-staging-${STAGING_RUN_ID}" --dir "$receipt_dir" >/dev/null 2>&1; then
              receipt="$receipt_dir/isolated-staging-receipt.json"
              test "$RESOLVED_DEPLOY_MODE" = code_only
              test -f "$receipt"
              expected_patch_sha="$(git diff --binary "$EXPECTED_DEPLOYED_REVISION" "$DEPLOY_SHA" | sha256sum | awk '{print $1}')"
              jq -e \
                --arg candidate_sha "$DEPLOY_SHA" \
                --arg base_sha "$EXPECTED_DEPLOYED_REVISION" \
                --arg patch_sha256 "$expected_patch_sha" \
                '.schema_version == "mbti-runtime46-isolated-staging.v1"
                 and .candidate_sha == $candidate_sha
                 and .base_sha == $base_sha
                 and .remote_revision == $candidate_sha
                 and .patch_sha256 == $patch_sha256
                 and .record_scope == "intp-a-vs-intp-t"
                 and .cms_or_db_write_attempted == false
                 and .production_deploy_attempted == false
                 and .publication_or_indexability_changed == false
                 and .sitemap_llms_search_attempted == false' "$receipt" >/dev/null
              echo "isolated_runtime46=true" >> "$GITHUB_OUTPUT"
              echo "staging evidence accepted: exact isolated Runtime 46 receipt matches the deploy candidate."
              else
                if [ "$RESOLVED_DEPLOY_MODE" != standard ]; then
                  echo "non-standard deployment requires exact-SHA staging evidence or an exact isolated Runtime 46 receipt. The pinned isolated INDEX-52 composite receipt is accepted only for its exact candidate." >&2
                  exit 1
                fi
                if ! git cat-file -e "${STAGING_SHA}^{commit}"; then
                  echo "staging-equivalence check cannot resolve the staged revision." >&2
                  exit 1
                fi
                if ! git merge-base --is-ancestor "$STAGING_SHA" "$DEPLOY_SHA"; then
                  echo "staging-equivalence check requires the staged revision to be an ancestor of the deploy SHA." >&2
                  exit 1
                fi

                mapfile -t STAGING_DELTA < <(git diff --no-renames --name-only "$STAGING_SHA" "$DEPLOY_SHA")
                if [ "${#STAGING_DELTA[@]}" -eq 0 ]; then
                  echo "staging-equivalence check refused an unexplained SHA mismatch." >&2
                  exit 1
                fi
                STAGING_EQUIVALENT_SCOPE=true
                for path in "${STAGING_DELTA[@]}"; do
                  case "$path" in
                  .github/workflows/mbti-comp-runtime46-production-ops.yml|.github/workflows/deploy-production.yml|backend/tests/Sre/DeployStorageAndDatabaseConfigTest.php|backend/tests/Sre/ProductionDeploymentStatusTruthTest.php)
                    echo "staging-equivalence accepted audited deployment-control path: $path"
                    ;;
                  *)
                    STAGING_EQUIVALENT_SCOPE=false
                    echo "staging-equivalence refused non-audited delta path: $path" >&2
                    ;;
                  esac
                done
                if [ "$STAGING_EQUIVALENT_SCOPE" != true ]; then
                  echo "staging evidence does not cover the exact deploy artifact." >&2
                  exit 1
                fi
                if ! git diff --quiet "$STAGING_SHA" "$DEPLOY_SHA" -- \
                  backend/app backend/bootstrap backend/config backend/database backend/public \
                  backend/resources backend/routes backend/artisan backend/composer.json backend/composer.lock deploy.php; then
                  echo "staging-equivalence refused a runtime or deployment artifact change." >&2
                  exit 1
                fi
                echo "staging evidence accepted: deployed runtime artifact is byte-equivalent across the audited control-only delta."
              fi
            fi
          fi

          JOBS_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${STAGING_RUN_ID}/jobs?per_page=100")"
          jq -e \
            '([.jobs[] | select(.name == "Deploy checks (staging)" and .conclusion == "success")] | length) == 1
             and ([.jobs[] | select(.name == "Deploy (staging)" and .conclusion == "success")] | length) == 1' \
            <<<"$JOBS_JSON" >/dev/null
          echo "staging_sha=$STAGING_SHA" >> "$GITHUB_OUTPUT"

      - name: Confirm approved release satisfies deployment mode policy
        id: latest_main_guard
        shell: bash
        env:
          DEPLOY_MODE: ${{ steps.resolve_deploy_mode.outputs.deploy_mode }}
          ISOLATED_RUNTIME46: ${{ steps.resolve_deploy_mode.outputs.isolated_runtime46 }}
          ISOLATED_INDEX52: ${{ steps.resolve_deploy_mode.outputs.isolated_index52 }}
          EXACT_ACTIVE_CANDIDATE_FAST_PATH: ${{ steps.resolve_deploy_mode.outputs.exact_active_candidate_fast_path }}
          EXPECTED_DEPLOYED_REVISION: ${{ inputs.expected_deployed_revision }}
          STAGING_SHA: ${{ steps.resolve_deploy_mode.outputs.staging_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          LATEST_MAIN_SHA="$(git rev-parse origin/main)"
          echo "deploy_sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"
          echo "main_sha=$LATEST_MAIN_SHA" >> "$GITHUB_OUTPUT"
          case "$DEPLOY_MODE" in
            standard)
              if ! git merge-base --is-ancestor "$DEPLOY_SHA" "$LATEST_MAIN_SHA"; then
                echo "Manual standard production deploy refused because the staged candidate is not reachable from latest main." >&2
                exit 1
              fi
              if [ "$DEPLOY_SHA" != "$LATEST_MAIN_SHA" ]; then
                if [ "$STAGING_SHA" != "$DEPLOY_SHA" ]; then
                  echo "Immutable standard candidate requires an exact-SHA successful staging run when main has advanced." >&2
                  exit 1
                fi
                echo "Immutable staged release candidate accepted; newer main commits remain intentionally excluded."
              fi
              ;;
            schema_only)
              if [ "$DEPLOY_SHA" != "$LATEST_MAIN_SHA" ]; then
                echo "Manual schema_only production deploy refused because expected_release_sha is not latest main." >&2
                exit 1
              fi
              ;;
            code_only)
              if ! git merge-base --is-ancestor "$DEPLOY_SHA" "$LATEST_MAIN_SHA"; then
                if [ "$ISOLATED_INDEX52" = true ]; then
                  test "$DEPLOY_SHA" = "9d2877a7e519f768fd741398e76777620770fb71"
                  test "$EXPECTED_DEPLOYED_REVISION" = "e7ed3b9e894730ff0f973687eb552337db5c6db9"
                  test "$(git rev-list --parents -n 1 "$DEPLOY_SHA" | awk '{print NF}')" -eq 2
                  test "$(git rev-parse "${DEPLOY_SHA}^")" = "$EXPECTED_DEPLOYED_REVISION"
                  expected_files="$(printf '%s\n' \
                    backend/app/Http/Controllers/API/V0_5/Cms/PersonalityController.php \
                    backend/app/Services/Cms/Mbti64CrossTypeComparisonPublicReadModel.php)"
                  test "$(git diff --no-renames --name-only "$EXPECTED_DEPLOYED_REVISION" "$DEPLOY_SHA" | sort)" = "$expected_files"
                  test "$(git diff --binary "$EXPECTED_DEPLOYED_REVISION" "$DEPLOY_SHA" | sha256sum | awk '{print $1}')" = \
                    "2cf768ab7896be204b983c377bce5d1b00771f6a5c2dd62c82d5c265b0748f00"
                  while IFS= read -r path; do
                    test -n "$path"
                    test "$(git rev-parse "${DEPLOY_SHA}:${path}")" = "$(git rev-parse "${LATEST_MAIN_SHA}:${path}")"
                  done <<<"$expected_files"
                  echo "Code-only production deploy accepted exact isolated INDEX-52 runtime candidate with staged-main-byte-identical scoped files."
                elif [ "$ISOLATED_RUNTIME46" = true ]; then
                  test "$(git rev-list --parents -n 1 "$DEPLOY_SHA" | awk '{print NF}')" -eq 2
                  test "$(git rev-parse "${DEPLOY_SHA}^")" = "$EXPECTED_DEPLOYED_REVISION"
                  expected_files="$(printf '%s\n' \
                    backend/app/Console/Commands/PersonalityMbtiCompRuntime46IntpPromote.php \
                    backend/app/Console/Commands/PersonalityMbtiCompRuntime46IntpRevision.php \
                    backend/app/Services/Cms/MbtiCompRuntime46IntpPromotionService.php \
                    backend/app/Services/Cms/MbtiFullCmsImportService.php \
                    backend/docs/seo/import-packages/mbti-comp-runtime-46-intp-revision-2026-07-19.json \
                    backend/tests/Feature/Console/PersonalityMbtiCompRuntime46IntpRevisionCommandTest.php)"
                  test "$(git diff --no-renames --name-only "$EXPECTED_DEPLOYED_REVISION" "$DEPLOY_SHA" | sort)" = "$expected_files"
                  while IFS= read -r path; do
                    test -n "$path"
                    git show "$LATEST_MAIN_SHA:$path" | cmp - "$path"
                  done <<<"$expected_files"
                  echo "Code-only production deploy accepted exact isolated Runtime 46 candidate with main-byte-identical scoped files."
                else
                  echo "Code-only production deploy refused because expected_release_sha is not reachable from latest main and has no exact isolated receipt." >&2
                  exit 1
                fi
              fi
              ;;
            candidate_only)
              if [ "$EXACT_ACTIVE_CANDIDATE_FAST_PATH" = true ]; then
                if [ "$DEPLOY_SHA" != "$EXPECTED_DEPLOYED_REVISION" ]; then
                  echo "Exact-active candidate_only fast path requires the candidate SHA to equal expected_deployed_revision." >&2
                  exit 1
                fi
                if ! git merge-base --is-ancestor "$DEPLOY_SHA" "$LATEST_MAIN_SHA"; then
                  echo "Exact-active candidate_only fast path requires the active SHA to remain reachable from latest main." >&2
                  exit 1
                fi
                echo "Exact-active same-SHA candidate_only fast path accepted without staging evidence."
              else
                if ! git merge-base --is-ancestor "$DEPLOY_SHA" "$LATEST_MAIN_SHA"; then
                  echo "Inactive candidate materialization requires expected_release_sha to remain reachable from latest main." >&2
                  exit 1
                fi
                if [ "$STAGING_SHA" != "$DEPLOY_SHA" ]; then
                  echo "Inactive candidate materialization requires exact-SHA successful staging evidence." >&2
                  exit 1
                fi
                if [ "$DEPLOY_SHA" != "$LATEST_MAIN_SHA" ]; then
                  echo "Inactive candidate materialization excludes newer main commits from this bounded release."
                fi
              fi
              ;;
            *)
              echo "Resolved deploy mode is invalid." >&2
              exit 2
              ;;
          esac
          echo "eligible=true" >> "$GITHUB_OUTPUT"

  deploy-production:
    name: Deploy fap-api production
    needs: deployment-eligibility
    if: ${{ needs.deployment-eligibility.outputs.eligible == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-${{ github.repository }}-production
      cancel-in-progress: false
    environment:
      name: production
    env:
      DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
      DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
      RETIRED_DEPLOY_HOST: ${{ secrets.PRODUCTION_RETIRED_DEPLOY_HOST }}
      DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
      DEPLOY_USER_PROD: ${{ secrets.PRODUCTION_DEPLOY_USER }}
      DEPLOY_PORT_PROD: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
      DEPLOY_HOST_PROD: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
      DEPLOY_PATH_PROD: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
      HEALTHCHECK_URL: ${{ vars.PRODUCTION_HEALTHCHECK_URL }}
      AUTH_GUEST_CHECK_URL: ${{ vars.PRODUCTION_AUTH_GUEST_CHECK_URL }}
      OPS_HOST: ${{ vars.PRODUCTION_OPS_HOST }}
      DEPLOY_MODE: ${{ needs.deployment-eligibility.outputs.deploy_mode }}
      EXACT_ACTIVE_CANDIDATE_FAST_PATH: ${{ needs.deployment-eligibility.outputs.exact_active_candidate_fast_path }}
      REQUIRE_OPS_QUEUE_RELOAD: ${{ needs.deployment-eligibility.outputs.require_ops_queue_reload }}
      REQUIRE_CAREER_CANDIDATE_PREFLIGHT: ${{ needs.deployment-eligibility.outputs.require_career_candidate_preflight }}
      CAREER_PUBLIC_CACHE_SUMMARY_SHA256: ${{ needs.deployment-eligibility.outputs.career_public_cache_summary_sha256 }}
      CAREER_EXPECTED_CANDIDATE_SUMMARY_SHA256: ${{ needs.deployment-eligibility.outputs.career_expected_candidate_summary_sha256 }}
      CAREER_CACHE_REPAIR_REQUIRED: ${{ needs.deployment-eligibility.outputs.career_cache_repair_required }}
      RELEASE_ID: ${{ needs.deployment-eligibility.outputs.release_id }}
      STAGING_RUN_ID: ${{ needs.deployment-eligibility.outputs.staging_run_id }}
      EXPECTED_DEPLOYED_REVISION: ${{ inputs.expected_deployed_revision }}
      APPROVED_MIGRATION: ${{ inputs.approved_migration }}
      WORKFLOW_CONTROL_SHA: ${{ github.sha }}

    steps:
      - name: Checkout deploy revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.deployment-eligibility.outputs.deploy_sha }}
          fetch-depth: 0

      - name: Prepare exact immutable candidate deployment control
        id: immutable_candidate_control
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="49038deb50cda789e4365ea42068832ed28d6023"
          staging_run_id="29977064260"
          candidate_recipe_sha256="e814b6ff4996669097db0f32fd3caebc1fcd05dd9015e2260016e3f4ece3c068"
          helper_sha256="04f9d6b6b66b0be10a4996064cdf9150e1b0f1ec300edf93f87e8c0368ea0713"
          wrapper_sha256="5111aac8197ba8df85698eab2a199475baab7ef7456db01dfb698ed54a928dcf"
          wrapper_path="backend/scripts/deploy/immutable_candidate_sitemap_control.php"
          helper_path="backend/scripts/deploy/verify_sitemap_source_cache_warm.sh"

          echo "enabled=false" >> "$GITHUB_OUTPUT"
          if [ "$DEPLOY_SHA" != "$candidate_sha" ]; then
            echo "Immutable candidate deployment control is not required for this release."
            exit 0
          fi

          test "$GITHUB_REF" = "refs/heads/main"
          test "$DEPLOY_MODE" = "standard"
          test "$STAGING_RUN_ID" = "$staging_run_id"
          [[ "$WORKFLOW_CONTROL_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$WORKFLOW_CONTROL_SHA"
          git cat-file -e "${WORKFLOW_CONTROL_SHA}^{commit}"
          git merge-base --is-ancestor "$DEPLOY_SHA" "$WORKFLOW_CONTROL_SHA"

          candidate_tree_before="$(git rev-parse HEAD^{tree})"
          test "$(git rev-parse HEAD)" = "$candidate_sha"
          test -z "$(git status --porcelain=v1)"
          test "$(sha256sum deploy.php | awk '{print $1}')" = "$candidate_recipe_sha256"

          control_wrapper="$RUNNER_TEMP/immutable-candidate-sitemap-control.php"
          control_helper="$RUNNER_TEMP/verify-sitemap-source-cache-warm.sh"
          git show "${WORKFLOW_CONTROL_SHA}:${wrapper_path}" > "$control_wrapper"
          git show "${WORKFLOW_CONTROL_SHA}:${helper_path}" > "$control_helper"
          chmod 600 "$control_wrapper" "$control_helper"

          test "$(sha256sum "$control_wrapper" | awk '{print $1}')" = "$wrapper_sha256"
          test "$(sha256sum "$control_helper" | awk '{print $1}')" = "$helper_sha256"
          php -l "$control_wrapper" >/dev/null
          bash -n "$control_helper"

          test "$(git rev-parse HEAD^{tree})" = "$candidate_tree_before"
          test -z "$(git status --porcelain=v1)"

          receipt="$RUNNER_TEMP/backend-immutable-candidate-control-receipt.json"
          jq -n \
            --arg candidate_sha "$candidate_sha" \
            --arg control_sha "$WORKFLOW_CONTROL_SHA" \
            --arg staging_run_id "$staging_run_id" \
            --arg candidate_recipe_sha256 "$candidate_recipe_sha256" \
            --arg helper_sha256 "$helper_sha256" \
            --arg wrapper_sha256 "$wrapper_sha256" \
            '{
              schema_version: "backend-immutable-candidate-control-receipt.v1",
              status: "PASS_IMMUTABLE_CANDIDATE_CONTROL_PREPARED",
              candidate_sha: $candidate_sha,
              control_sha: $control_sha,
              staging_run_id: $staging_run_id,
              candidate_recipe_sha256: $candidate_recipe_sha256,
              sitemap_warm_helper_sha256: $helper_sha256,
              control_wrapper_sha256: $wrapper_sha256,
              control_mode: "candidate_recipe_with_runner_only_sitemap_override",
              candidate_tree_unchanged: true,
              release_overlay: false,
              remote_control_file_write: false
            }' > "$receipt"

          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "recipe_path=$control_wrapper" >> "$GITHUB_OUTPUT"
          echo "helper_path=$control_helper" >> "$GITHUB_OUTPUT"
          echo "receipt_path=$receipt" >> "$GITHUB_OUTPUT"
          echo "Immutable candidate deployment control prepared without changing the candidate tree."

      - name: Prepare bounded candidate public-DNS control
        id: bounded_public_dns_control
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidate_sha="363bbba54f7cac78b9cbb6118c1800dd0c6b7340"
          release_id="standard-363bbba54f7c"
          staging_run_id="31384127889"
          candidate_recipe_sha256="e27282825c2074e56067e6ec4cb9a8a3951ad8d4207c0c3f598fc93a1d02128b"
          wrapper_sha256="5e3b3aa09f971a7b0706a0835a72007eacaa5b2582c37a97898119a1b524784b"
          wrapper_path="backend/scripts/deploy/bounded_candidate_public_dns_control.php"
          incident_run_id="31397650099"
          incident_artifact_name="backend-production-incident-diagnostic-31397650099-1"
          incident_artifact_digest="sha256:4bd544410f69855d589b5305276a5fac6dd1df26907e4cc7fb1b8abdabd41d79"
