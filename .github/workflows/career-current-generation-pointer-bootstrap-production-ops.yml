name: Career Current Generation Pointer Bootstrap Production Ops

on:
  workflow_dispatch:
    inputs:
      mode:
        description: SELECT-only zero-write preflight or exact receipt-bound pointer apply
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - apply
      expected_control_plane_sha:
        description: Exact latest main SHA containing this control plane
        required: true
        type: string
      expected_release_sha:
        description: Exact active production application SHA
        required: true
        type: string
      expected_release_name:
        description: Exact active production release name
        required: true
        type: string
      preflight_run_id:
        description: Apply only; immutable successful preflight run id
        required: false
        default: ""
        type: string
      preflight_run_attempt:
        description: Apply only; immutable successful preflight run attempt
        required: false
        default: ""
        type: string
      expected_preflight_receipt_sha256:
        description: Apply only; exact downloaded preflight receipt SHA-256
        required: false
        default: ""
        type: string
      expected_projection_path_sha256:
        description: Apply only; sanitized exact projection source-path identity
        required: false
        default: ""
        type: string
      expected_ledger_path_sha256:
        description: Apply only; sanitized exact ledger source-path identity
        required: false
        default: ""
        type: string
      operator_approval_phrase:
        description: Apply only; exact receipt and source-path bound pointer approval
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-${{ github.repository }}-production
  cancel-in-progress: false

jobs:
  control:
    name: Run isolated current-generation pointer bootstrap phase
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      MODE: ${{ inputs.mode }}
      EXPECTED_CONTROL_PLANE_SHA: ${{ inputs.expected_control_plane_sha }}
      EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
      EXPECTED_RELEASE_NAME: ${{ inputs.expected_release_name }}
      PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
      PREFLIGHT_RUN_ATTEMPT: ${{ inputs.preflight_run_attempt }}
      EXPECTED_PREFLIGHT_RECEIPT_SHA256: ${{ inputs.expected_preflight_receipt_sha256 }}
      EXPECTED_PROJECTION_PATH_SHA256: ${{ inputs.expected_projection_path_sha256 }}
      EXPECTED_LEDGER_PATH_SHA256: ${{ inputs.expected_ledger_path_sha256 }}
      OPERATOR_APPROVAL_PHRASE: ${{ inputs.operator_approval_phrase }}
      GENERATION_ID: career-current-342-30-bootstrap-v1
      FROZEN_MANIFEST_SHA256: b570ec0cdda65278aa543431886b3529d072de8d67a8e79f1cafbb1c4c8dfc0e
      FREEZE_CONTRACT_PAYLOAD_SHA256: 23c86542bbe9301f60b101d067ad6c2382982041042eaf4a9faa61886c164f88
      FREEZE_RECEIPT_SET_SHA256: 504646d8317e30279688d361e0dfbdb3104b11baea93cae21cacb1b6dc7da098
      PROJECTION_SHA256: 397f2a4ec284e9c0a6cd610447541ad4773fa7a7f3045008fab5efb334ec85c6
      LEDGER_SHA256: 975b311bb346a090f1add678d5a6d9f1be230f87b223e2c3c829f4c7fd7aac6e
      SLUG_SET_SHA256: 8b328b2e002875a9f92d4c406981f3c3724f066ee817d2d5bd1a61915e1eddf5
      LOCALE_ROW_SET_SHA256: 607926991fa51c74d6d6c9606ab3b7f8f35918996006a39c68963c16765d5697
      SLUG_COUNT: "342"
      LOCALE_ROW_COUNT: "684"
      PUBLISHED_SLUG_COUNT: "30"
      PUBLISHED_LOCALE_ROW_COUNT: "60"
      DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
      DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
      RETIRED_DEPLOY_HOST: ${{ secrets.PRODUCTION_RETIRED_DEPLOY_HOST }}
      DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}

    steps:
      - name: Initialize sanitized failure receipt before checkout
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/career-current-generation-pointer-bootstrap.json"
          jq -n \
            --arg mode "$MODE" \
            --arg control "$EXPECTED_CONTROL_PLANE_SHA" \
            --arg release "$EXPECTED_RELEASE_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{
              contract_version: "career.current_generation_pointer_bootstrap.v1",
              mode: $mode,
              status: "FAIL_CONTROL_INITIALIZATION",
              failed_stage: "initialize",
              control_plane_sha: $control,
              release_sha: $release,
              workflow_run_id: ($run_id | tonumber),
              workflow_run_attempt: ($run_attempt | tonumber),
              generation_id: "career-current-342-30-bootstrap-v1",
              production_write_execution: false,
              candidate_file_write_count: 0,
              pointer_write_count: 0,
              directory_write_count: 0,
              database_write_count: 0,
              cms_write_count: 0,
              cache_write_count: 0,
              source_artifact_write_count: 0,
              deployment_count: 0,
              migration_count: 0,
              publication_write_count: 0,
              sitemap_write_count: 0,
              llms_write_count: 0,
              search_submission_count: 0,
              automatic_retry_allowed: false,
              automatic_cleanup_allowed: false,
              automatic_rollback_allowed: false,
              write_state: "none",
              writes_committed: false,
              zero_write_guarantee: false
            }' > "$receipt"

      - name: Checkout exact control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.expected_control_plane_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate latest main and immutable apply evidence
        id: eligibility
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/career-current-generation-pointer-bootstrap.json"
          mark_failure() {
            jq --arg stage "$1" '.status = "FAIL_CONTROL_ELIGIBILITY" | .failed_stage = $stage' \
              "$receipt" > "$receipt.next"
            mv "$receipt.next" "$receipt"
          }
          trap 'mark_failure "control_plane_or_receipt_validation"' ERR

          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$MODE" =~ ^(preflight|apply)$ ]]
          [[ "$EXPECTED_CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_RELEASE_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_CONTROL_PLANE_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_CONTROL_PLANE_SHA"
          test "$GITHUB_SHA" = "$EXPECTED_CONTROL_PLANE_SHA"
          git cat-file -e "${EXPECTED_RELEASE_SHA}^{commit}"
          git merge-base --is-ancestor "$EXPECTED_RELEASE_SHA" origin/main
          freeze_result="$(php backend/scripts/operations/verify_career_1046_current_state_freeze.php)"
          jq -e \
            --arg payload "$FREEZE_CONTRACT_PAYLOAD_SHA256" \
            '.status == "PASS_FROZEN_ZERO_WRITE_CONTRACT"
             and .payload_sha256 == $payload
             and .writes == 0
             and .production_apply_allowed == false' <<<"$freeze_result" >/dev/null
          php -l backend/scripts/operations/career_current_generation_pointer_bootstrap.php >/dev/null

          pointer_timestamp=""
          case "$MODE" in
            preflight)
              test -z "$PREFLIGHT_RUN_ID"
              test -z "$PREFLIGHT_RUN_ATTEMPT"
              test -z "$EXPECTED_PREFLIGHT_RECEIPT_SHA256"
              test -z "$EXPECTED_PROJECTION_PATH_SHA256"
              test -z "$EXPECTED_LEDGER_PATH_SHA256"
              test -z "$OPERATOR_APPROVAL_PHRASE"
              pointer_timestamp="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              ;;
            apply)
              [[ "$PREFLIGHT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
              [[ "$PREFLIGHT_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
              [[ "$EXPECTED_PREFLIGHT_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
              [[ "$EXPECTED_PROJECTION_PATH_SHA256" =~ ^[0-9a-f]{64}$ ]]
              [[ "$EXPECTED_LEDGER_PATH_SHA256" =~ ^[0-9a-f]{64}$ ]]

              run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREFLIGHT_RUN_ID}")"
              jq -e \
                --arg sha "$EXPECTED_CONTROL_PLANE_SHA" \
                --argjson attempt "$PREFLIGHT_RUN_ATTEMPT" \
                '.name == "Career Current Generation Pointer Bootstrap Production Ops"
                 and .path == ".github/workflows/career-current-generation-pointer-bootstrap-production-ops.yml"
                 and .event == "workflow_dispatch"
                 and .head_branch == "main"
                 and .head_sha == $sha
                 and .status == "completed"
                 and .conclusion == "success"
                 and .run_attempt == $attempt' <<<"$run_json" >/dev/null

              evidence_dir="$(mktemp -d)"
              gh run download "$PREFLIGHT_RUN_ID" \
                --name "career-current-generation-pointer-bootstrap-preflight-${PREFLIGHT_RUN_ID}-${PREFLIGHT_RUN_ATTEMPT}" \
                --dir "$evidence_dir"
              preflight_receipt="$evidence_dir/career-current-generation-pointer-bootstrap.json"
              test -f "$preflight_receipt"
              test "$(sha256sum "$preflight_receipt" | awk '{print $1}')" = "$EXPECTED_PREFLIGHT_RECEIPT_SHA256"
              expected_release_name_sha256="$(printf '%s' "$EXPECTED_RELEASE_NAME" | sha256sum | awk '{print $1}')"
              jq -e \
                --arg control "$EXPECTED_CONTROL_PLANE_SHA" \
                --arg release "$EXPECTED_RELEASE_SHA" \
                --arg release_name_sha "$expected_release_name_sha256" \
                --arg projection_path "$EXPECTED_PROJECTION_PATH_SHA256" \
                --arg ledger_path "$EXPECTED_LEDGER_PATH_SHA256" \
                --argjson run_id "$PREFLIGHT_RUN_ID" \
                --argjson run_attempt "$PREFLIGHT_RUN_ATTEMPT" \
                '.contract_version == "career.current_generation_pointer_bootstrap.v1"
                 and .mode == "preflight"
                 and .status == "PASS_PREFLIGHT_APPLY_ELIGIBLE"
                 and .control_plane_sha == $control
                 and .release_sha == $release
                 and .release_name_sha256 == $release_name_sha
                 and .workflow_run_id == $run_id
                 and .workflow_run_attempt == $run_attempt
                 and .generation_id == "career-current-342-30-bootstrap-v1"
                 and .artifact_format == "legacy_exact_bytes_v1"
                 and .freeze_contract_payload_sha256 == "23c86542bbe9301f60b101d067ad6c2382982041042eaf4a9faa61886c164f88"
                 and .authority.projection_sha256 == "397f2a4ec284e9c0a6cd610447541ad4773fa7a7f3045008fab5efb334ec85c6"
                 and .authority.ledger_sha256 == "975b311bb346a090f1add678d5a6d9f1be230f87b223e2c3c829f4c7fd7aac6e"
                 and .authority.slug_set_sha256 == "8b328b2e002875a9f92d4c406981f3c3724f066ee817d2d5bd1a61915e1eddf5"
                 and .authority.locale_row_set_sha256 == "607926991fa51c74d6d6c9606ab3b7f8f35918996006a39c68963c16765d5697"
                 and .authority.slug_count == 342
                 and .authority.locale_row_count == 684
                 and .authority.published_slug_count == 30
                 and .authority.published_locale_row_count == 60
                 and .source_artifacts.projection_path_sha256 == $projection_path
                 and .source_artifacts.ledger_path_sha256 == $ledger_path
                 and .source_artifacts.projection_match_count == 1
                 and .source_artifacts.ledger_match_count == 1
                 and .pointer_state_before.active_pointer_state == "ABSENT"
                 and .pointer_state_before.generation_pointer_state == "ABSENT"
                 and .pointer_state_before.existing_generation_pointer_count == 0
                 and .pointer_state_before.candidate_file_count == 0
                 and .deploy_lock_absent == true
                 and .deploy_process_absent == true
                 and .production_write_execution == false
                 and .pointer_write_count == 0
                 and .source_artifact_write_count == 0
                 and .writes_committed == false
                 and .zero_write_guarantee == true
                 and .automatic_retry_allowed == false' "$preflight_receipt" >/dev/null

              pointer_timestamp="$(jq -er '.pointer_timestamp | select(test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))' "$preflight_receipt")"
              expected_phrase="I explicitly approve bootstrapping only the Career current 342/30 root generation pointer from preflight run ${PREFLIGHT_RUN_ID} attempt ${PREFLIGHT_RUN_ATTEMPT} receipt ${EXPECTED_PREFLIGHT_RECEIPT_SHA256}, control plane ${EXPECTED_CONTROL_PLANE_SHA}, active SHA ${EXPECTED_RELEASE_SHA}, release ${EXPECTED_RELEASE_NAME}, projection path ${EXPECTED_PROJECTION_PATH_SHA256}, ledger path ${EXPECTED_LEDGER_PATH_SHA256}; create the immutable and active pointer documents with previous generation null, do not modify projection or ledger bytes, and perform no deploy, migration, DB/CMS/cache/publication/sitemap/llms/Search write, automatic retry, cleanup, or rollback."
              test "$OPERATOR_APPROVAL_PHRASE" = "$expected_phrase"
              ;;
          esac

          {
            echo "pointer_timestamp=$pointer_timestamp"
            echo "apply_authorized=$([ "$MODE" = apply ] && echo 1 || echo 0)"
          } >> "$GITHUB_OUTPUT"
          trap - ERR

      - name: Validate protected production topology
        shell: bash
        run: |
          set -euo pipefail
          for name in DEPLOY_USER DEPLOY_PORT DEPLOY_HOST RETIRED_DEPLOY_HOST DEPLOY_PATH SSH_KNOWN_HOSTS; do
            test -n "${!name:-}"
          done
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          test "$DEPLOY_PORT" -ge 1
          test "$DEPLOY_PORT" -le 65535
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$RETIRED_DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          test "$DEPLOY_HOST" != "$RETIRED_DEPLOY_HOST"
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_PATH" != *".."* ]]
          echo "Protected production topology validated without disclosing values."

      - name: Start pinned SSH agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known hosts
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null \
            || ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f ~/.ssh/known_hosts >/dev/null

      - name: Run SELECT-only preflight or exact receipt-bound apply
        shell: bash
        env:
          POINTER_TIMESTAMP: ${{ steps.eligibility.outputs.pointer_timestamp }}
          APPLY_AUTHORIZED: ${{ steps.eligibility.outputs.apply_authorized }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/career-current-generation-pointer-bootstrap.json"
          remote_receipt="$RUNNER_TEMP/career-current-generation-pointer-bootstrap.remote.json"
          printf -v q_mode '%q' "$MODE"
          printf -v q_deploy_path '%q' "$DEPLOY_PATH"
          printf -v q_control '%q' "$EXPECTED_CONTROL_PLANE_SHA"
          printf -v q_release '%q' "$EXPECTED_RELEASE_SHA"
          printf -v q_release_name '%q' "$EXPECTED_RELEASE_NAME"
          printf -v q_run_id '%q' "$GITHUB_RUN_ID"
          printf -v q_run_attempt '%q' "$GITHUB_RUN_ATTEMPT"
          printf -v q_generation '%q' "$GENERATION_ID"
          printf -v q_timestamp '%q' "$POINTER_TIMESTAMP"
          printf -v q_manifest '%q' "$FROZEN_MANIFEST_SHA256"
          printf -v q_freeze_payload '%q' "$FREEZE_CONTRACT_PAYLOAD_SHA256"
          printf -v q_receipt_set '%q' "$FREEZE_RECEIPT_SET_SHA256"
          printf -v q_projection '%q' "$PROJECTION_SHA256"
          printf -v q_ledger '%q' "$LEDGER_SHA256"
          printf -v q_slug_set '%q' "$SLUG_SET_SHA256"
          printf -v q_locale_set '%q' "$LOCALE_ROW_SET_SHA256"
          printf -v q_slug_count '%q' "$SLUG_COUNT"
          printf -v q_row_count '%q' "$LOCALE_ROW_COUNT"
          printf -v q_published_slugs '%q' "$PUBLISHED_SLUG_COUNT"
          printf -v q_published_rows '%q' "$PUBLISHED_LOCALE_ROW_COUNT"
          printf -v q_apply '%q' "$APPLY_AUTHORIZED"
          printf -v q_preflight_receipt '%q' "$EXPECTED_PREFLIGHT_RECEIPT_SHA256"
          printf -v q_projection_path '%q' "$EXPECTED_PROJECTION_PATH_SHA256"
          printf -v q_ledger_path '%q' "$EXPECTED_LEDGER_PATH_SHA256"

          set +e
          timeout --signal=TERM --kill-after=5s 120s \
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
              -o ServerAliveInterval=20 -o ServerAliveCountMax=5 \
              -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "set -euo pipefail; current=\$(readlink -f $q_deploy_path/current); release=\$(readlink -f $q_deploy_path/releases/$q_release_name); test -n \"\$current\"; test \"\$current\" = \"\$release\"; test \"\$(tr -d '\\r\\n' < \"\$current/REVISION\")\" = $q_release; test ! -e $q_deploy_path/.dep/deploy.lock; test \"\$(ps -eo comm=,args= | awk '\$1 == \"php\" && (\$0 ~ /dep(\\.phar)? .* production/ || \$0 ~ /artisan migrate/ || \$0 ~ /queue:reload-workers/) {n++} \$1 == \"composer\" && \$0 ~ /install/ {n++} END {print n+0}')\" = 0; CAREER_POINTER_BACKEND_ROOT=\"\$current/backend\" CAREER_POINTER_DEPLOY_PATH=$q_deploy_path CAREER_POINTER_CONTROL_PLANE_SHA=$q_control CAREER_POINTER_EXPECTED_RELEASE_SHA=$q_release CAREER_POINTER_EXPECTED_RELEASE_NAME=$q_release_name CAREER_POINTER_WORKFLOW_RUN_ID=$q_run_id CAREER_POINTER_WORKFLOW_RUN_ATTEMPT=$q_run_attempt CAREER_POINTER_GENERATION_ID=$q_generation CAREER_POINTER_TIMESTAMP=$q_timestamp CAREER_POINTER_FROZEN_MANIFEST_SHA256=$q_manifest CAREER_POINTER_FREEZE_CONTRACT_PAYLOAD_SHA256=$q_freeze_payload CAREER_POINTER_RECEIPT_SET_SHA256=$q_receipt_set CAREER_POINTER_PROJECTION_SHA256=$q_projection CAREER_POINTER_LEDGER_SHA256=$q_ledger CAREER_POINTER_SLUG_SET_SHA256=$q_slug_set CAREER_POINTER_LOCALE_ROW_SET_SHA256=$q_locale_set CAREER_POINTER_SLUG_COUNT=$q_slug_count CAREER_POINTER_LOCALE_ROW_COUNT=$q_row_count CAREER_POINTER_PUBLISHED_SLUG_COUNT=$q_published_slugs CAREER_POINTER_PUBLISHED_LOCALE_ROW_COUNT=$q_published_rows CAREER_POINTER_APPLY_AUTHORIZED=$q_apply CAREER_POINTER_PREFLIGHT_RECEIPT_SHA256=$q_preflight_receipt CAREER_POINTER_EXPECTED_PROJECTION_PATH_SHA256=$q_projection_path CAREER_POINTER_EXPECTED_LEDGER_PATH_SHA256=$q_ledger_path php /dev/stdin $q_mode" \
              < backend/scripts/operations/career_current_generation_pointer_bootstrap.php \
              > "$remote_receipt" 2>/dev/null
          remote_status=$?
          set -e

          if jq -e \
            --arg mode "$MODE" \
            '.contract_version == "career.current_generation_pointer_bootstrap.v1"
             and .mode == $mode
             and (.status | type == "string")
             and (.failed_stage == null or (.failed_stage | type == "string"))' \
            "$remote_receipt" >/dev/null 2>&1; then
            mv "$remote_receipt" "$receipt"
          else
            apply_started=false
            write_state="none"
            if [ "$MODE" = apply ]; then
              apply_started=true
              write_state="indeterminate"
            fi
            jq \
              --argjson apply_started "$apply_started" \
              --arg write_state "$write_state" \
              '.status = "FAIL_REMOTE_OUTCOME_REQUIRES_REVIEW"
               | .failed_stage = "remote_transport_or_receipt_invalid"
               | .production_write_execution = $apply_started
               | .write_state = $write_state
               | .zero_write_guarantee = false' \
              "$receipt" > "$receipt.next"
            mv "$receipt.next" "$receipt"
          fi
          exit "$remote_status"

      - name: Validate sanitized phase receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/career-current-generation-pointer-bootstrap.json"
          # shellcheck disable=SC2016
          common='(.contract_version == "career.current_generation_pointer_bootstrap.v1")
            and (.control_plane_sha == $control)
            and (.release_sha == $release)
            and (.generation_id == "career-current-342-30-bootstrap-v1")
            and (.authority.projection_sha256 == "397f2a4ec284e9c0a6cd610447541ad4773fa7a7f3045008fab5efb334ec85c6")
            and (.authority.ledger_sha256 == "975b311bb346a090f1add678d5a6d9f1be230f87b223e2c3c829f4c7fd7aac6e")
            and (.authority.slug_set_sha256 == "8b328b2e002875a9f92d4c406981f3c3724f066ee817d2d5bd1a61915e1eddf5")
            and (.authority.locale_row_set_sha256 == "607926991fa51c74d6d6c9606ab3b7f8f35918996006a39c68963c16765d5697")
            and (.authority.slug_count == 342)
            and (.authority.locale_row_count == 684)
            and (.authority.published_slug_count == 30)
            and (.authority.published_locale_row_count == 60)
            and (.database_write_count == 0)
            and (.cms_write_count == 0)
            and (.cache_write_count == 0)
            and (.source_artifact_write_count == 0)
            and (.deployment_count == 0)
            and (.migration_count == 0)
            and (.publication_write_count == 0)
            and (.sitemap_write_count == 0)
            and (.llms_write_count == 0)
            and (.search_submission_count == 0)
            and (.automatic_retry_allowed == false)
            and (.automatic_cleanup_allowed == false)
            and (.automatic_rollback_allowed == false)'
          if [ "$MODE" = preflight ]; then
            jq -e \
              --arg control "$EXPECTED_CONTROL_PLANE_SHA" \
              --arg release "$EXPECTED_RELEASE_SHA" \
              "$common and (.mode == \"preflight\")
               and (.status == \"PASS_PREFLIGHT_APPLY_ELIGIBLE\")
               and (.production_write_execution == false)
               and (.pointer_write_count == 0)
               and (.writes_committed == false)
               and (.zero_write_guarantee == true)" "$receipt" >/dev/null
          else
            jq -e \
              --arg control "$EXPECTED_CONTROL_PLANE_SHA" \
              --arg release "$EXPECTED_RELEASE_SHA" \
              "$common and (.mode == \"apply\")
               and (.status == \"PASS_APPLY_POINTER_BOOTSTRAPPED\")
               and (.production_write_execution == true)
               and (.candidate_file_write_count == 2)
               and (.pointer_write_count == 2)
               and (.pointer_document_sha256 | test(\"^[0-9a-f]{64}$\"))
               and (.lineage_previous_generation_id == null)
               and (.rollback_eligible == false)
               and (.write_state == \"active_pointer_committed\")
               and (.writes_committed == true)
               and (.zero_write_guarantee == false)" "$receipt" >/dev/null
          fi

      - name: Upload immutable sanitized receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
