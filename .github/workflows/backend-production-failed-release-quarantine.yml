name: Backend Production Failed Release Quarantine

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only inventory or receipt-bound atomic quarantine
        required: true
        type: choice
        options:
          - inventory
          - apply
      expected_control_plane_sha:
        description: Exact latest main SHA containing this control plane
        required: true
        type: string
      target_release_name:
        description: Exact failed inactive release directory name
        required: true
        type: string
      expected_release_revision:
        description: Exact historical revision from the failed deploy evidence
        required: true
        type: string
      source_deploy_run_id:
        description: Exact failed Deploy API Production run id
        required: true
        type: string
      source_deploy_run_attempt:
        description: Exact failed deploy run attempt
        required: true
        type: string
      discovery_run_id:
        description: Exact successful Backend Production Release Discovery run id
        required: true
        type: string
      discovery_run_attempt:
        description: Exact discovery run attempt
        required: true
        type: string
      expected_discovery_sha256:
        description: Exact SHA256 of the discovery JSON receipt
        required: true
        type: string
      inventory_run_id:
        description: Apply-only successful inventory run id
        required: false
        type: string
      inventory_run_attempt:
        description: Apply-only successful inventory run attempt
        required: false
        type: string
      expected_inventory_receipt_sha256:
        description: Apply-only exact inventory receipt SHA256
        required: false
        type: string
      expected_tree_sha256:
        description: Apply-only exact deterministic tree manifest SHA256
        required: false
        type: string
      operator_approval_phrase:
        description: Apply-only exact receipt-bound production approval phrase
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-${{ github.repository }}-production
  cancel-in-progress: false

jobs:
  quarantine:
    name: Inventory or quarantine one failed backend release
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      MODE: ${{ inputs.mode }}
      EXPECTED_CONTROL_PLANE_SHA: ${{ inputs.expected_control_plane_sha }}
      TARGET_RELEASE_NAME: ${{ inputs.target_release_name }}
      EXPECTED_RELEASE_REVISION: ${{ inputs.expected_release_revision }}
      SOURCE_DEPLOY_RUN_ID: ${{ inputs.source_deploy_run_id }}
      SOURCE_DEPLOY_RUN_ATTEMPT: ${{ inputs.source_deploy_run_attempt }}
      DISCOVERY_RUN_ID: ${{ inputs.discovery_run_id }}
      DISCOVERY_RUN_ATTEMPT: ${{ inputs.discovery_run_attempt }}
      EXPECTED_DISCOVERY_SHA256: ${{ inputs.expected_discovery_sha256 }}
      INVENTORY_RUN_ID: ${{ inputs.inventory_run_id }}
      INVENTORY_RUN_ATTEMPT: ${{ inputs.inventory_run_attempt }}
      EXPECTED_INVENTORY_RECEIPT_SHA256: ${{ inputs.expected_inventory_receipt_sha256 }}
      EXPECTED_TREE_SHA256: ${{ inputs.expected_tree_sha256 }}
      OPERATOR_APPROVAL_PHRASE: ${{ inputs.operator_approval_phrase }}

    steps:
      - name: Check out exact main control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.expected_control_plane_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact failed deploy and discovery evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          case "$MODE" in inventory|apply) ;; *) exit 2 ;; esac
          [[ "$EXPECTED_CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_RELEASE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TARGET_RELEASE_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          [[ "$SOURCE_DEPLOY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_DEPLOY_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$DISCOVERY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$DISCOVERY_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_DISCOVERY_SHA256" =~ ^[0-9a-f]{64}$ ]]

          control_plane_sha="$(git rev-parse HEAD)"
          test "$control_plane_sha" = "$EXPECTED_CONTROL_PLANE_SHA"
          test "$control_plane_sha" = "$GITHUB_SHA"
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$control_plane_sha" = "$(git rev-parse origin/main)"
          git cat-file -e "${EXPECTED_RELEASE_REVISION}^{commit}"
          git merge-base --is-ancestor "$EXPECTED_RELEASE_REVISION" origin/main

          revision_prefix="${EXPECTED_RELEASE_REVISION:0:12}"
          test "$TARGET_RELEASE_NAME" = "standard-${revision_prefix}-${SOURCE_DEPLOY_RUN_ID}-${SOURCE_DEPLOY_RUN_ATTEMPT}"

          source_run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_DEPLOY_RUN_ID}")"
          jq -e \
            --argjson attempt "$SOURCE_DEPLOY_RUN_ATTEMPT" \
            '.name == "Deploy API Production"
             and .path == ".github/workflows/deploy-production.yml"
             and .event == "workflow_dispatch"
             and .head_branch == "main"
             and .status == "completed"
             and .conclusion == "failure"
             and .run_attempt == $attempt' \
            <<<"$source_run_json" >/dev/null

          evidence_dir="$(mktemp -d)"
          gh run download "$SOURCE_DEPLOY_RUN_ID" \
            --name "backend-production-deploy-progress-${SOURCE_DEPLOY_RUN_ID}-${SOURCE_DEPLOY_RUN_ATTEMPT}" \
            --dir "$evidence_dir/progress"
          gh run download "$SOURCE_DEPLOY_RUN_ID" \
            --name "deployer-task-timing-production" \
            --dir "$evidence_dir/timing"
          progress_receipt="$evidence_dir/progress/deployer-progress.json"
          timing_receipt="$evidence_dir/timing/deployer-task-timing.json"
          test -f "$progress_receipt"
          test -f "$timing_receipt"
          jq -e \
            --arg revision "$EXPECTED_RELEASE_REVISION" \
            --arg run_id "$SOURCE_DEPLOY_RUN_ID" \
            --arg attempt "$SOURCE_DEPLOY_RUN_ATTEMPT" \
            '.schema_version == "fermatmind.deployer-progress.v1"
             and .status == "failed"
             and .sha == $revision
             and .workflow_run_id == $run_id
             and .workflow_run_attempt == $attempt' \
            "$progress_receipt" >/dev/null
          jq -e \
            --arg revision "$EXPECTED_RELEASE_REVISION" \
            --arg run_id "$SOURCE_DEPLOY_RUN_ID" \
            --arg attempt "$SOURCE_DEPLOY_RUN_ATTEMPT" \
            '.schema_version == "fermatmind.deployer-task-timing.v1"
             and .plan_status == "complete"
             and .sha == $revision
             and .workflow_run_id == $run_id
             and .workflow_run_attempt == $attempt
             and ([.tasks[] | select(.task == "deploy:release" and .result == "success")] | length) == 1
             and ([.tasks[] | select(.task == "deploy:update_code" and .result == "failure" and .exit_code == 128)] | length) == 1
             and ([.tasks[] | select(.task == "deploy:shared" and .result == "skipped")] | length) == 1
             and ([.tasks[] | select(.task == "artisan:migrate" and .result == "skipped")] | length) == 1
             and ([.tasks[] | select(.task == "career:warm-public-authority-cache" and .result == "skipped")] | length) == 1
             and ([.tasks[] | select(.task == "seo:warm-sitemap-source-cache" and .result == "skipped")] | length) == 1
             and ([.tasks[] | select(.task == "deploy:symlink" and .result == "skipped")] | length) == 1
             and ([.tasks[] | select(.task == "reload:php-fpm" and .result == "skipped")] | length) == 1
             and ([.tasks[] | select(.task == "reload:nginx" and .result == "skipped")] | length) == 1
             and ([.tasks[] | select(.task == "queue:reload-workers" and .result == "skipped")] | length) == 1
             and ([.tasks[] | select(.task == "deploy:cleanup" and .result == "skipped")] | length) == 1' \
            "$timing_receipt" >/dev/null

          discovery_run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${DISCOVERY_RUN_ID}")"
          jq -e \
            --argjson attempt "$DISCOVERY_RUN_ATTEMPT" \
            '.name == "Backend Production Release Discovery"
             and .path == ".github/workflows/backend-production-release-discovery.yml"
             and .event == "workflow_dispatch"
             and .head_branch == "main"
             and .status == "completed"
             and .conclusion == "success"
             and .run_attempt == $attempt' \
            <<<"$discovery_run_json" >/dev/null
          discovery_head_sha="$(jq -r '.head_sha' <<<"$discovery_run_json")"
          [[ "$discovery_head_sha" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$discovery_head_sha" origin/main

          gh run download "$DISCOVERY_RUN_ID" \
            --name "backend-production-release-discovery-${DISCOVERY_RUN_ID}" \
            --dir "$evidence_dir/discovery"
          discovery_receipt="$evidence_dir/discovery/backend-production-release-discovery.json"
          test -f "$discovery_receipt"
          discovery_sha256="$(sha256sum "$discovery_receipt" | awk '{print $1}')"
          test "$discovery_sha256" = "$EXPECTED_DISCOVERY_SHA256"
          jq -e \
            --arg head "$discovery_head_sha" \
            --arg target "$TARGET_RELEASE_NAME" \
            '.schema_version == "backend-production-release-discovery.v1"
             and .status == "BLOCKED_RELEASE_ANOMALIES"
             and .control_plane_sha == $head
             and .active.main_reachable == true
             and .checks.current_symlink_resolved == true
             and .checks.active_revision_valid == true
             and .checks.deploy_lock_absent == true
             and ([.release_anomalies[] | select(.release_name == $target and .reason == "revision_missing")] | length) == 1
             and .negative_guarantees.remote_file_write == false
             and .writes_committed == false' \
            "$discovery_receipt" >/dev/null
          discovery_active_name="$(jq -r '.active.release_name' "$discovery_receipt")"
          discovery_active_revision="$(jq -r '.active.revision' "$discovery_receipt")"
          [[ "$discovery_active_name" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          [[ "$discovery_active_revision" =~ ^[0-9a-f]{40}$ ]]
          printf 'DISCOVERY_ACTIVE_NAME=%s\n' "$discovery_active_name" >> "$GITHUB_ENV"
          printf 'DISCOVERY_ACTIVE_REVISION=%s\n' "$discovery_active_revision" >> "$GITHUB_ENV"

          if [ "$MODE" = apply ]; then
            [[ "$INVENTORY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$INVENTORY_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
            [[ "$EXPECTED_INVENTORY_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
            [[ "$EXPECTED_TREE_SHA256" =~ ^[0-9a-f]{64}$ ]]
            test "$INVENTORY_RUN_ID" != "$GITHUB_RUN_ID"

            inventory_run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${INVENTORY_RUN_ID}")"
            jq -e \
              --arg sha "$EXPECTED_CONTROL_PLANE_SHA" \
              --argjson attempt "$INVENTORY_RUN_ATTEMPT" \
              '.name == "Backend Production Failed Release Quarantine"
               and .path == ".github/workflows/backend-production-failed-release-quarantine.yml"
               and .event == "workflow_dispatch"
               and .head_branch == "main"
               and .head_sha == $sha
               and .status == "completed"
               and .conclusion == "success"
               and .run_attempt == $attempt' \
              <<<"$inventory_run_json" >/dev/null
            gh run download "$INVENTORY_RUN_ID" \
              --name "backend-production-failed-release-inventory-${INVENTORY_RUN_ID}-${INVENTORY_RUN_ATTEMPT}" \
              --dir "$evidence_dir/inventory"
            inventory_receipt="$evidence_dir/inventory/backend-production-failed-release-quarantine.json"
            test -f "$inventory_receipt"
            inventory_receipt_sha256="$(sha256sum "$inventory_receipt" | awk '{print $1}')"
            test "$inventory_receipt_sha256" = "$EXPECTED_INVENTORY_RECEIPT_SHA256"
            jq -e \
              --arg control "$EXPECTED_CONTROL_PLANE_SHA" \
              --arg target "$TARGET_RELEASE_NAME" \
              --arg revision "$EXPECTED_RELEASE_REVISION" \
              --arg source_run "$SOURCE_DEPLOY_RUN_ID" \
              --arg source_attempt "$SOURCE_DEPLOY_RUN_ATTEMPT" \
              --arg discovery_run "$DISCOVERY_RUN_ID" \
              --arg discovery_attempt "$DISCOVERY_RUN_ATTEMPT" \
              --arg discovery_sha "$EXPECTED_DISCOVERY_SHA256" \
              --arg tree "$EXPECTED_TREE_SHA256" \
              '.contract_version == "backend.production_failed_release_quarantine.v1"
               and .mode == "inventory"
               and .status == "PASS_INVENTORY"
               and .control_plane_sha == $control
               and .target_release_name == $target
               and .historical_revision == $revision
               and .source_deploy_run_id == $source_run
               and .source_deploy_run_attempt == $source_attempt
               and .discovery_run_id == $discovery_run
               and .discovery_run_attempt == $discovery_attempt
               and .discovery_sha256 == $discovery_sha
               and .tree_sha256 == $tree
               and .quarantine_eligible == true
               and .writes_committed == false' \
              "$inventory_receipt" >/dev/null
            inventory_destination_name="$(jq -r '.quarantine_destination_name' "$inventory_receipt")"
            [[ "$inventory_destination_name" =~ ^\.quarantine-failed-release-[A-Za-z0-9._-]+-[0-9a-f]{16}$ ]]
            expected_phrase="I explicitly approve atomic quarantine of failed inactive backend production release ${TARGET_RELEASE_NAME} from source deploy run ${SOURCE_DEPLOY_RUN_ID} attempt ${SOURCE_DEPLOY_RUN_ATTEMPT}, historical revision ${EXPECTED_RELEASE_REVISION}, with active release ${discovery_active_name} SHA ${discovery_active_revision}, discovery run ${DISCOVERY_RUN_ID} attempt ${DISCOVERY_RUN_ATTEMPT} artifact ${EXPECTED_DISCOVERY_SHA256}, quarantine inventory ${INVENTORY_RUN_ID} attempt ${INVENTORY_RUN_ATTEMPT} receipt ${EXPECTED_INVENTORY_RECEIPT_SHA256} tree ${EXPECTED_TREE_SHA256}, to ${inventory_destination_name}; atomic rename only, no deletion, deploy, activation, database/CMS write, warm, publication, process restart, or discoverability change."
            test "$OPERATOR_APPROVAL_PHRASE" = "$expected_phrase"
            printf 'INVENTORY_DESTINATION_NAME=%s\n' "$inventory_destination_name" >> "$GITHUB_ENV"
          else
            test -z "$INVENTORY_RUN_ID"
            test -z "$INVENTORY_RUN_ATTEMPT"
            test -z "$EXPECTED_INVENTORY_RECEIPT_SHA256"
            test -z "$EXPECTED_TREE_SHA256"
            test -z "$OPERATOR_APPROVAL_PHRASE"
          fi

      - name: Set up SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known hosts
        shell: bash
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          RETIRED_DEPLOY_HOST: ${{ secrets.PRODUCTION_RETIRED_DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS"
          for name in DEPLOY_USER DEPLOY_PORT DEPLOY_HOST RETIRED_DEPLOY_HOST DEPLOY_PATH; do
            test -n "${!name:-}"
          done
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          test "$DEPLOY_PORT" -ge 1
          test "$DEPLOY_PORT" -le 65535
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$RETIRED_DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          test "$DEPLOY_HOST" != "$RETIRED_DEPLOY_HOST"
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_PATH" != *".."* ]]
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null \
            || ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f ~/.ssh/known_hosts >/dev/null

      - name: Capture deterministic failed release inventory without writes
        shell: bash
        env:
          DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          printf -v q_deploy_path '%q' "$DEPLOY_PATH"
          printf -v q_target_release_name '%q' "$TARGET_RELEASE_NAME"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH=$q_deploy_path TARGET_RELEASE_NAME=$q_target_release_name bash -s" \
            <<'REMOTE' > artifacts/remote-inventory.jsonl
          set -euo pipefail
          command -v jq >/dev/null
          command -v sha256sum >/dev/null
          command -v mountpoint >/dev/null
          releases_root="$(readlink -f "$DEPLOY_PATH/releases")"
          current_release="$(readlink -f "$DEPLOY_PATH/current")"
          target="$releases_root/$TARGET_RELEASE_NAME"
          test -d "$releases_root"
          test -d "$current_release"
          test -d "$target"
          test "$(readlink -f "$target")" = "$target"
          test "$target" != "$current_release"
          test ! -e "$DEPLOY_PATH/.dep/deploy.lock"
          active_release_name="$(basename "$current_release")"
          active_revision="$(tr -d '\r\n' < "$current_release/REVISION")"
          [[ "$active_release_name" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          [[ "$active_revision" =~ ^[0-9a-f]{40}$ ]]

          target_device="$(stat -c '%d' "$target")"
          deploy_device="$(stat -c '%d' "$DEPLOY_PATH")"
          target_inode="$(stat -c '%i' "$target")"
          target_mtime="$(stat -c '%Y' "$target")"
          mountpoint_count="$(find "$target" -xdev -type d -exec mountpoint -q -- {} \; -printf x | wc -c | tr -d ' ')"

          find "$target" -xdev -mindepth 1 -print0 | while IFS= read -r -d '' path; do
            relative="${path#"$target"/}"
            test -n "$relative"
            if LC_ALL=C printf '%s' "$relative" | grep -q '[[:cntrl:]]'; then
              echo FAILED_RELEASE_INVENTORY_CONTROL_CHARACTER_PATH >&2
              exit 1
            fi
            mode="$(stat -c '%a' -- "$path")"
            size="$(stat -c '%s' -- "$path")"
            nlink="$(stat -c '%h' -- "$path")"
            content_sha256=""
            link_target_sha256=""
            link_absolute=false
            link_escape=false
            if [ -L "$path" ]; then
              entry_type=symlink
              link_target="$(readlink -- "$path")"
              if LC_ALL=C printf '%s' "$link_target" | grep -q '[[:cntrl:]]'; then
                echo FAILED_RELEASE_INVENTORY_CONTROL_CHARACTER_LINK >&2
                exit 1
              fi
              link_target_sha256="$(printf '%s' "$link_target" | sha256sum | awk '{print $1}')"
              case "$link_target" in /*) link_absolute=true ;; esac
              resolved_link="$(readlink -m -- "$path")"
              case "$resolved_link" in "$target"|"$target"/*) ;; *) link_escape=true ;; esac
            elif [ -f "$path" ]; then
              entry_type=file
              content_sha256="$(sha256sum -- "$path" | awk '{print $1}')"
            elif [ -d "$path" ]; then
              entry_type=directory
              if mountpoint -q -- "$path"; then
                mountpoint_count=$((mountpoint_count + 1))
              fi
            elif [ -S "$path" ]; then entry_type=socket
            elif [ -p "$path" ]; then entry_type=fifo
            elif [ -b "$path" ]; then entry_type=block_device
            elif [ -c "$path" ]; then entry_type=char_device
            else entry_type=other
            fi
            jq -cn \
              --arg record_kind tree \
              --arg path "$relative" \
              --arg type "$entry_type" \
              --arg mode "$mode" \
              --argjson size "$size" \
              --argjson nlink "$nlink" \
              --arg content_sha256 "$content_sha256" \
              --arg link_target_sha256 "$link_target_sha256" \
              --argjson link_absolute "$link_absolute" \
              --argjson link_escape "$link_escape" \
              '{record_kind: $record_kind, path: $path, type: $type, mode: $mode, size: $size, nlink: $nlink, content_sha256: $content_sha256, link_target_sha256: $link_target_sha256, link_absolute: $link_absolute, link_escape: $link_escape}'
          done

          process_reference_count=0
          for process_root in /proc/[0-9]*; do
            for ref in "$process_root/cwd" "$process_root/exe" "$process_root/root" "$process_root"/fd/*; do
              resolved_ref="$(readlink -f "$ref" 2>/dev/null || true)"
              case "$resolved_ref" in
                "$target"|"$target"/*) process_reference_count=$((process_reference_count + 1)) ;;
              esac
            done
          done

          jq -cn \
            --arg record_kind control \
            --arg active_release_name "$active_release_name" \
            --arg active_revision "$active_revision" \
            --arg target_device "$target_device" \
            --arg deploy_device "$deploy_device" \
            --arg target_inode "$target_inode" \
            --arg target_mtime "$target_mtime" \
            --argjson mountpoint_count "$mountpoint_count" \
            --argjson process_reference_count "$process_reference_count" \
            '{record_kind: $record_kind, active_release_name: $active_release_name, active_revision: $active_revision, target_device: $target_device, deploy_device: $deploy_device, target_inode: $target_inode, target_mtime: $target_mtime, deploy_lock_present: false, target_is_active: false, mountpoint_count: $mountpoint_count, process_reference_count: $process_reference_count}'
          REMOTE

          jq -c 'select(.record_kind == "tree")' artifacts/remote-inventory.jsonl \
            | LC_ALL=C sort > artifacts/tree-manifest.jsonl
          jq -e 'select(.record_kind == "control")' artifacts/remote-inventory.jsonl \
            > artifacts/remote-control.json
          test "$(jq -s 'length' artifacts/remote-control.json)" = 1
          tree_sha256="$(sha256sum artifacts/tree-manifest.jsonl | awk '{print $1}')"
          [[ "$tree_sha256" =~ ^[0-9a-f]{64}$ ]]
          entry_count="$(jq -s 'length' artifacts/tree-manifest.jsonl)"
          directory_count="$(jq -s '[.[] | select(.type == "directory")] | length' artifacts/tree-manifest.jsonl)"
          regular_file_count="$(jq -s '[.[] | select(.type == "file")] | length' artifacts/tree-manifest.jsonl)"
          symlink_count="$(jq -s '[.[] | select(.type == "symlink")] | length' artifacts/tree-manifest.jsonl)"
          hardlink_count="$(jq -s '[.[] | select(.type == "file" and .nlink > 1)] | length' artifacts/tree-manifest.jsonl)"
          special_file_count="$(jq -s '[.[] | select(.type != "directory" and .type != "file" and .type != "symlink")] | length' artifacts/tree-manifest.jsonl)"
          absolute_symlink_count="$(jq -s '[.[] | select(.type == "symlink" and .link_absolute == true)] | length' artifacts/tree-manifest.jsonl)"
          escaping_symlink_count="$(jq -s '[.[] | select(.type == "symlink" and .link_escape == true)] | length' artifacts/tree-manifest.jsonl)"
          total_size_bytes="$(jq -s '[.[] | select(.type == "file") | .size] | add // 0' artifacts/tree-manifest.jsonl)"
          test "$entry_count" -le 250000
          test "$total_size_bytes" -le 5368709120
          test "$special_file_count" = 0
          test "$absolute_symlink_count" = 0
          test "$escaping_symlink_count" = 0
          test "$(jq -r '.mountpoint_count' artifacts/remote-control.json)" = 0
          test "$(jq -r '.process_reference_count' artifacts/remote-control.json)" = 0
          test "$(jq -r '.target_device' artifacts/remote-control.json)" = "$(jq -r '.deploy_device' artifacts/remote-control.json)"
          test "$(jq -r '.active_release_name' artifacts/remote-control.json)" = "$DISCOVERY_ACTIVE_NAME"
          test "$(jq -r '.active_revision' artifacts/remote-control.json)" = "$DISCOVERY_ACTIVE_REVISION"

          destination_name=".quarantine-failed-release-${TARGET_RELEASE_NAME}-${tree_sha256:0:16}"
          [[ "$destination_name" =~ ^\.quarantine-failed-release-[A-Za-z0-9._-]+-[0-9a-f]{16}$ ]]
          test "${#destination_name}" -le 255
          printf -v q_destination_name '%q' "$destination_name"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH=$q_deploy_path TARGET_RELEASE_NAME=$q_target_release_name DESTINATION_NAME=$q_destination_name bash -s" \
            <<'REMOTE' > artifacts/remote-destination.json
          set -euo pipefail
          releases_root="$(readlink -f "$DEPLOY_PATH/releases")"
          current_release="$(readlink -f "$DEPLOY_PATH/current")"
          target="$releases_root/$TARGET_RELEASE_NAME"
          destination="$DEPLOY_PATH/$DESTINATION_NAME"
          test -d "$target"
          test "$(readlink -f "$target")" = "$target"
          test "$target" != "$current_release"
          test ! -e "$DEPLOY_PATH/.dep/deploy.lock"
          test ! -e "$destination"
          test "$(stat -c '%d' "$target")" = "$(stat -c '%d' "$DEPLOY_PATH")"
          jq -n --arg destination_name "$DESTINATION_NAME" '{destination_name: $destination_name, destination_absent: true, same_filesystem: true}'
          REMOTE

          test "$(jq -r '.destination_absent' artifacts/remote-destination.json)" = true
          test "$(jq -r '.same_filesystem' artifacts/remote-destination.json)" = true
          test "$(jq -r '.destination_name' artifacts/remote-destination.json)" = "$destination_name"

          printf 'CURRENT_TREE_SHA256=%s\n' "$tree_sha256" >> "$GITHUB_ENV"
          printf 'CURRENT_DESTINATION_NAME=%s\n' "$destination_name" >> "$GITHUB_ENV"
          if [ "$MODE" = apply ]; then
            test "$tree_sha256" = "$EXPECTED_TREE_SHA256"
            test "$destination_name" = "$INVENTORY_DESTINATION_NAME"
          fi

          jq -n \
            --arg contract_version backend.production_failed_release_quarantine.v1 \
            --arg status PASS_INVENTORY \
            --arg mode inventory \
            --arg control_plane_sha "$EXPECTED_CONTROL_PLANE_SHA" \
            --arg target_release_name "$TARGET_RELEASE_NAME" \
            --arg historical_revision "$EXPECTED_RELEASE_REVISION" \
            --arg source_deploy_run_id "$SOURCE_DEPLOY_RUN_ID" \
            --arg source_deploy_run_attempt "$SOURCE_DEPLOY_RUN_ATTEMPT" \
            --arg discovery_run_id "$DISCOVERY_RUN_ID" \
            --arg discovery_run_attempt "$DISCOVERY_RUN_ATTEMPT" \
            --arg discovery_sha256 "$EXPECTED_DISCOVERY_SHA256" \
            --arg active_release_name "$DISCOVERY_ACTIVE_NAME" \
            --arg active_revision "$DISCOVERY_ACTIVE_REVISION" \
            --arg tree_sha256 "$tree_sha256" \
            --arg quarantine_destination_name "$destination_name" \
            --argjson entry_count "$entry_count" \
            --argjson directory_count "$directory_count" \
            --argjson regular_file_count "$regular_file_count" \
            --argjson symlink_count "$symlink_count" \
            --argjson hardlink_count "$hardlink_count" \
            --argjson special_file_count "$special_file_count" \
            --argjson total_size_bytes "$total_size_bytes" \
            --slurpfile control artifacts/remote-control.json \
            '{
              contract_version: $contract_version,
              status: $status,
              mode: $mode,
              control_plane_sha: $control_plane_sha,
              target_release_name: $target_release_name,
              historical_revision: $historical_revision,
              source_deploy_run_id: $source_deploy_run_id,
              source_deploy_run_attempt: $source_deploy_run_attempt,
              discovery_run_id: $discovery_run_id,
              discovery_run_attempt: $discovery_run_attempt,
              discovery_sha256: $discovery_sha256,
              active_release_name: $active_release_name,
              active_revision: $active_revision,
              tree_sha256: $tree_sha256,
              quarantine_destination_name: $quarantine_destination_name,
              counts: {entries: $entry_count, directories: $directory_count, regular_files: $regular_file_count, symlinks: $symlink_count, hardlinks: $hardlink_count, special_files: $special_file_count, total_size_bytes: $total_size_bytes},
              checks: {target_is_active: false, deploy_lock_present: false, mountpoint_count: $control[0].mountpoint_count, process_reference_count: $control[0].process_reference_count, same_filesystem: true, destination_absent: true, absolute_symlink_count: 0, escaping_symlink_count: 0},
              quarantine_eligible: true,
              negative_guarantees: {deploy: false, activation: false, file_delete: false, database_write: false, cms_write: false, cache_warm: false, publication: false, process_restart: false, discoverability_write: false, remote_file_write: false},
              writes_committed: false
            }' > artifacts/backend-production-failed-release-quarantine.json

      - name: Atomically quarantine exact failed inactive release
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        env:
          DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          test "$CURRENT_TREE_SHA256" = "$EXPECTED_TREE_SHA256"
          test "$CURRENT_DESTINATION_NAME" = "$INVENTORY_DESTINATION_NAME"
          printf -v q_deploy_path '%q' "$DEPLOY_PATH"
          printf -v q_target_release_name '%q' "$TARGET_RELEASE_NAME"
          printf -v q_destination_name '%q' "$CURRENT_DESTINATION_NAME"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH=$q_deploy_path TARGET_RELEASE_NAME=$q_target_release_name DESTINATION_NAME=$q_destination_name EXPECTED_ACTIVE_NAME=$DISCOVERY_ACTIVE_NAME EXPECTED_ACTIVE_REVISION=$DISCOVERY_ACTIVE_REVISION EXPECTED_TREE_SHA256=$EXPECTED_TREE_SHA256 bash -s" \
            <<'REMOTE' > artifacts/remote-apply.json
          set -euo pipefail
          releases_root="$(readlink -f "$DEPLOY_PATH/releases")"
          current_release="$(readlink -f "$DEPLOY_PATH/current")"
          target="$releases_root/$TARGET_RELEASE_NAME"
          destination="$DEPLOY_PATH/$DESTINATION_NAME"
          test -d "$target"
          test "$(readlink -f "$target")" = "$target"
          test "$target" != "$current_release"
          test "$(basename "$current_release")" = "$EXPECTED_ACTIVE_NAME"
          test "$(tr -d '\r\n' < "$current_release/REVISION")" = "$EXPECTED_ACTIVE_REVISION"
          test ! -e "$DEPLOY_PATH/.dep/deploy.lock"
          test ! -e "$destination"
          test "$(stat -c '%d' "$target")" = "$(stat -c '%d' "$DEPLOY_PATH")"

          current_tree_sha256="$(find "$target" -xdev -mindepth 1 -print0 \
            | while IFS= read -r -d '' path; do
              relative="${path#"$target"/}"
              test -n "$relative"
              if LC_ALL=C printf '%s' "$relative" | grep -q '[[:cntrl:]]'; then
                exit 1
              fi
              mode="$(stat -c '%a' -- "$path")"
              size="$(stat -c '%s' -- "$path")"
              nlink="$(stat -c '%h' -- "$path")"
              content_sha256=""
              link_target_sha256=""
              link_absolute=false
              link_escape=false
              if [ -L "$path" ]; then
                entry_type=symlink
                link_target="$(readlink -- "$path")"
                if LC_ALL=C printf '%s' "$link_target" | grep -q '[[:cntrl:]]'; then
                  exit 1
                fi
                link_target_sha256="$(printf '%s' "$link_target" | sha256sum | awk '{print $1}')"
                case "$link_target" in /*) link_absolute=true ;; esac
                resolved_link="$(readlink -m -- "$path")"
                case "$resolved_link" in "$target"|"$target"/*) ;; *) link_escape=true ;; esac
              elif [ -f "$path" ]; then
                entry_type=file
                content_sha256="$(sha256sum -- "$path" | awk '{print $1}')"
              elif [ -d "$path" ]; then entry_type=directory
              elif [ -S "$path" ]; then entry_type=socket
              elif [ -p "$path" ]; then entry_type=fifo
              elif [ -b "$path" ]; then entry_type=block_device
              elif [ -c "$path" ]; then entry_type=char_device
              else entry_type=other
              fi
              jq -cn \
                --arg record_kind tree \
                --arg path "$relative" \
                --arg type "$entry_type" \
                --arg mode "$mode" \
                --argjson size "$size" \
                --argjson nlink "$nlink" \
                --arg content_sha256 "$content_sha256" \
                --arg link_target_sha256 "$link_target_sha256" \
                --argjson link_absolute "$link_absolute" \
                --argjson link_escape "$link_escape" \
                '{record_kind: $record_kind, path: $path, type: $type, mode: $mode, size: $size, nlink: $nlink, content_sha256: $content_sha256, link_target_sha256: $link_target_sha256, link_absolute: $link_absolute, link_escape: $link_escape}'
            done \
            | LC_ALL=C sort \
            | sha256sum \
            | awk '{print $1}')"
          test "$current_tree_sha256" = "$EXPECTED_TREE_SHA256"
          test ! -L "$target"
          test ! -L "$destination"
          test ! -e "$destination"
          test ! -e "$DEPLOY_PATH/.dep/deploy.lock"
          ! mountpoint -q -- "$target"

          process_reference_count=0
          for process_root in /proc/[0-9]*; do
            for ref in "$process_root/cwd" "$process_root/exe" "$process_root/root" "$process_root"/fd/*; do
              resolved_ref="$(readlink -f "$ref" 2>/dev/null || true)"
              case "$resolved_ref" in
                "$target"|"$target"/*) process_reference_count=$((process_reference_count + 1)) ;;
              esac
            done
          done
          test "$process_reference_count" = 0

          mv -T -- "$target" "$destination"

          test ! -e "$target"
          test -d "$destination"
          test "$(readlink -f "$DEPLOY_PATH/current")" = "$current_release"
          test "$(basename "$current_release")" = "$EXPECTED_ACTIVE_NAME"
          test "$(tr -d '\r\n' < "$current_release/REVISION")" = "$EXPECTED_ACTIVE_REVISION"
          test ! -e "$DEPLOY_PATH/.dep/deploy.lock"
          jq -n \
            --arg destination_name "$DESTINATION_NAME" \
            '{status: "PASS_QUARANTINE", destination_name: $destination_name, active_release_unchanged: true, target_absent: true, destination_present: true, rename_count: 1, file_delete_count: 0, deploy_count: 0, database_write_count: 0, cms_write_count: 0, cache_warm_count: 0, process_restart_count: 0, discoverability_write_count: 0, writes_committed: true}'
          REMOTE

          jq -e \
            --arg destination "$CURRENT_DESTINATION_NAME" \
            '.status == "PASS_QUARANTINE"
             and .destination_name == $destination
             and .active_release_unchanged == true
             and .target_absent == true
             and .destination_present == true
             and .rename_count == 1
             and .file_delete_count == 0
             and .writes_committed == true' \
            artifacts/remote-apply.json >/dev/null
          jq -n \
            --arg contract_version backend.production_failed_release_quarantine.v1 \
            --arg status PASS_QUARANTINE \
            --arg mode apply \
            --arg control_plane_sha "$EXPECTED_CONTROL_PLANE_SHA" \
            --arg target_release_name "$TARGET_RELEASE_NAME" \
            --arg historical_revision "$EXPECTED_RELEASE_REVISION" \
            --arg source_deploy_run_id "$SOURCE_DEPLOY_RUN_ID" \
            --arg source_deploy_run_attempt "$SOURCE_DEPLOY_RUN_ATTEMPT" \
            --arg discovery_run_id "$DISCOVERY_RUN_ID" \
            --arg discovery_run_attempt "$DISCOVERY_RUN_ATTEMPT" \
            --arg discovery_sha256 "$EXPECTED_DISCOVERY_SHA256" \
            --arg inventory_run_id "$INVENTORY_RUN_ID" \
            --arg inventory_run_attempt "$INVENTORY_RUN_ATTEMPT" \
            --arg inventory_receipt_sha256 "$EXPECTED_INVENTORY_RECEIPT_SHA256" \
            --arg tree_sha256 "$EXPECTED_TREE_SHA256" \
            --arg active_release_name "$DISCOVERY_ACTIVE_NAME" \
            --arg active_revision "$DISCOVERY_ACTIVE_REVISION" \
            --arg quarantine_destination_name "$CURRENT_DESTINATION_NAME" \
            '{contract_version: $contract_version, status: $status, mode: $mode, control_plane_sha: $control_plane_sha, target_release_name: $target_release_name, historical_revision: $historical_revision, source_deploy_run_id: $source_deploy_run_id, source_deploy_run_attempt: $source_deploy_run_attempt, discovery_run_id: $discovery_run_id, discovery_run_attempt: $discovery_run_attempt, discovery_sha256: $discovery_sha256, inventory_run_id: $inventory_run_id, inventory_run_attempt: $inventory_run_attempt, inventory_receipt_sha256: $inventory_receipt_sha256, tree_sha256: $tree_sha256, active_release_name: $active_release_name, active_revision: $active_revision, quarantine_destination_name: $quarantine_destination_name, rename_count: 1, file_delete_count: 0, deploy_count: 0, database_write_count: 0, cms_write_count: 0, cache_warm_count: 0, process_restart_count: 0, discoverability_write_count: 0, writes_committed: true}' \
            > artifacts/backend-production-failed-release-quarantine.json

      - name: Upload failed release inventory receipt
        if: ${{ inputs.mode == 'inventory' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-production-failed-release-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/backend-production-failed-release-quarantine.json
            artifacts/tree-manifest.jsonl
          if-no-files-found: error
          retention-days: 30

      - name: Upload failed release quarantine receipt
        if: ${{ inputs.mode == 'apply' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-production-failed-release-quarantine-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/backend-production-failed-release-quarantine.json
          if-no-files-found: error
          retention-days: 30

      - name: Summarize protected result
        shell: bash
        run: |
          set -euo pipefail
          status="$(jq -r '.status' artifacts/backend-production-failed-release-quarantine.json)"
          tree_sha256="$(jq -r '.tree_sha256' artifacts/backend-production-failed-release-quarantine.json)"
          destination="$(jq -r '.quarantine_destination_name' artifacts/backend-production-failed-release-quarantine.json)"
          writes_committed="$(jq -r '.writes_committed' artifacts/backend-production-failed-release-quarantine.json)"
          {
            echo "## Backend production failed release quarantine"
            echo "- Mode: ${MODE}"
            echo "- Status: ${status}"
            echo "- Tree SHA256: ${tree_sha256}"
            echo "- Quarantine destination name: ${destination}"
            echo "- Writes committed: ${writes_committed}"
          } >> "$GITHUB_STEP_SUMMARY"
