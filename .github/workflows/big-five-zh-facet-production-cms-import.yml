name: Big Five ZH Facet Production CMS Import

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run validates only; write performs the approved CMS import"
        required: true
        default: dry-run
        type: choice
        options: [dry-run, write]
      expected_release_sha:
        description: "Exact deployed release SHA that must own the package"
        required: true
        type: string
      expected_seed_sha256:
        description: "Exact SHA-256 of generated/big-five-zh-facet-import-dryrun/big_five_zh_facet_31_seed.json"
        required: true
        default: "47605736590fab6f6eac6d374f947925946ef125f39a273f4d136b6d30df5815"
        type: string
      operator_approval_phrase:
        description: "Exact SHA-bound operator approval phrase; required even for dry-run"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: big-five-zh-facet-production-cms-import
  cancel-in-progress: false

jobs:
  production-cms-import:
    name: Big Five ZH Facet CMS import (${{ inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    env:
      DEPLOY_USER: ubuntu
      DEPLOY_HOST: 139.224.130.204
      DEPLOY_PORT: "22"
      DEPLOY_PATH: /var/www/fap-api
      PACKAGE_RELATIVE_PATH: generated/big-five-zh-facet-import-dryrun/big_five_zh_facet_31_seed.json
      EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
      EXPECTED_SEED_SHA256: ${{ inputs.expected_seed_sha256 }}
      IMPORT_MODE: ${{ inputs.mode }}
      OPERATOR_APPROVAL_PHRASE: ${{ inputs.operator_approval_phrase }}

    steps:
      - name: Validate SHA-bound dispatch inputs
        shell: bash
        run: |
          set -euo pipefail

          if ! [[ "$EXPECTED_RELEASE_SHA" =~ ^[a-fA-F0-9]{40}$ ]]; then
            echo "expected_release_sha must be a 40-character Git SHA."
            exit 2
          fi

          if ! [[ "$EXPECTED_SEED_SHA256" =~ ^[a-fA-F0-9]{64}$ ]]; then
            echo "expected_seed_sha256 must be a 64-character SHA-256 value."
            exit 2
          fi

          expected_phrase="批准 BIG5 ZH Facet production CMS import, release SHA ${EXPECTED_RELEASE_SHA}, seed SHA-256 ${EXPECTED_SEED_SHA256}"
          if [ "$OPERATOR_APPROVAL_PHRASE" != "$expected_phrase" ]; then
            echo "operator_approval_phrase does not match the exact SHA-bound approval phrase."
            exit 2
          fi

          case "$IMPORT_MODE" in
            dry-run|write) ;;
            *) echo "mode must be dry-run or write."; exit 2 ;;
          esac

      - name: Set up production SSH identity
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known hosts
        shell: bash
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify and run bounded CMS importer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/big-five-zh-facet-cms-import"

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' PACKAGE_RELATIVE_PATH='$PACKAGE_RELATIVE_PATH' EXPECTED_RELEASE_SHA='$EXPECTED_RELEASE_SHA' EXPECTED_SEED_SHA256='$EXPECTED_SEED_SHA256' IMPORT_MODE='$IMPORT_MODE' bash -s" \
            <<'REMOTE' | tee "$RUNNER_TEMP/big-five-zh-facet-cms-import/receipt.txt"
          set -euo pipefail

          RELEASE_ROOT="$DEPLOY_PATH/current"
          BACKEND_ROOT="$RELEASE_ROOT/backend"
          SOURCE="$RELEASE_ROOT/$PACKAGE_RELATIVE_PATH"
          test -d "$BACKEND_ROOT"
          test -f "$SOURCE"

          if [ -f "$RELEASE_ROOT/REVISION" ]; then
            DEPLOYED_SHA="$(tr -d '\n' < "$RELEASE_ROOT/REVISION")"
          else
            DEPLOYED_SHA="$(git -C "$RELEASE_ROOT" rev-parse HEAD)"
          fi
          echo "deployed_release_sha=$DEPLOYED_SHA"
          test "$DEPLOYED_SHA" = "$EXPECTED_RELEASE_SHA"

          ACTUAL_SEED_SHA256="$(sha256sum "$SOURCE" | awk '{print $1}')"
          echo "seed_sha256=$ACTUAL_SEED_SHA256"
          test "$ACTUAL_SEED_SHA256" = "$EXPECTED_SEED_SHA256"

          php -r '
          $payload = json_decode((string) file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR);
          if (($payload["package"] ?? "") !== "big-five-zh-facet-31-page-import-dryrun-2026-07-10") { throw new RuntimeException("unexpected package"); }
          $assets = $payload["assets"] ?? null;
          if (!is_array($assets) || count($assets) !== 31) { throw new RuntimeException("expected exactly 31 assets"); }
          $identities = [];
          $hubCount = 0;
          $facetCount = 0;
          foreach ($assets as $asset) {
              if (!is_array($asset) || ($asset["framework"] ?? null) !== "big_five" || ($asset["locale"] ?? null) !== "zh-CN") { throw new RuntimeException("invalid asset identity"); }
              $entityType = $asset["entity_type"] ?? null;
              if ($entityType === "facet_hub") { $hubCount++; } elseif ($entityType === "facet") { $facetCount++; } else { throw new RuntimeException("unexpected entity type"); }
              $identity = implode("|", [$asset["framework"], $entityType, $asset["entity_key"] ?? "", $asset["locale"]]);
              if (($asset["entity_key"] ?? "") === "" || isset($identities[$identity])) { throw new RuntimeException("duplicate or empty identity"); }
              $identities[$identity] = true;
              if (($asset["launch_state"] ?? null) !== "content_ready") { throw new RuntimeException("launch state gate failed"); }
              if (($asset["robots"] ?? null) !== "noindex,follow" || ($asset["index_eligible"] ?? null) !== false || ($asset["sitemap_eligible"] ?? null) !== false || ($asset["llms_eligible"] ?? null) !== false) { throw new RuntimeException("indexability gate failed"); }
              if (!is_array($asset["internal_links"] ?? null) || count($asset["internal_links"]) < 7) { throw new RuntimeException("expected at least seven internal links"); }
              if (!is_array($asset["sections"] ?? null) || count($asset["sections"]) < 9) { throw new RuntimeException("expected at least nine sections"); }
              foreach ($asset["sections"] as $section) {
                  if (!is_array($section) || !isset($section["body_md"]) || array_key_exists("bodyMd", $section)) { throw new RuntimeException("body_md contract failed"); }
              }
              if (!is_array($asset["faq"] ?? null) || count($asset["faq"]) < 5) { throw new RuntimeException("expected at least five FAQ items"); }
          }
          if ($hubCount !== 1 || $facetCount !== 30 || count($identities) !== 31) { throw new RuntimeException("31-row composition gate failed"); }
          echo "seed_contract=pass\n";
          ' "$SOURCE"

          cd "$BACKEND_ROOT"
          php artisan personality-public-assets:import --no-ansi --source="../$PACKAGE_RELATIVE_PATH" | tee /tmp/big-five-zh-facet-dry-run.txt
          for expected in dry_run=1 assets_found=31 valid_count=31 errors_count=0 indexable_count=0 sitemap_eligible_count=0 llms_eligible_count=0; do
            grep -Fx "$expected" /tmp/big-five-zh-facet-dry-run.txt >/dev/null
          done

          if [ "$IMPORT_MODE" = "write" ]; then
            php artisan personality-public-assets:import --no-ansi --source="../$PACKAGE_RELATIVE_PATH" --write | tee /tmp/big-five-zh-facet-write.txt
            for expected in dry_run=0 assets_found=31 valid_count=31 errors_count=0 indexable_count=0 sitemap_eligible_count=0 llms_eligible_count=0; do
              grep -Fx "$expected" /tmp/big-five-zh-facet-write.txt >/dev/null
            done
          fi
          REMOTE

      - name: Publish bounded import receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: big-five-zh-facet-cms-import-receipt
          path: ${{ runner.temp }}/big-five-zh-facet-cms-import/receipt.txt
          if-no-files-found: warn
          retention-days: 30
