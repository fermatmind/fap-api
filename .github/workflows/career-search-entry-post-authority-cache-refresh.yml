name: Career Search Entry Post-Authority Cache Refresh

on:
  workflow_dispatch:
    inputs:
      expected_control_plane_sha:
        description: Exact latest main SHA containing this control
        required: true
        type: string
      expected_release_sha:
        description: Exact unchanged active production application SHA
        required: true
        type: string
      expected_release_name:
        description: Exact unchanged active production release name
        required: true
        type: string
      expected_manifest_sha256:
        description: Exact 50-slug manifest SHA
        required: true
        type: string
      authority_repair_run_id:
        description: Exact successful combined authority repair run
        required: true
        type: string
      authority_repair_run_attempt:
        description: Exact successful combined authority repair attempt
        required: true
        type: string
      expected_authority_repair_receipt_sha256:
        description: Exact immutable combined authority repair receipt SHA256
        required: true
        type: string
      expected_authority_repair_artifact_digest:
        description: Exact immutable combined authority repair artifact digest
        required: true
        type: string
      expected_repair_set_sha256:
        description: Exact combined authority repair set SHA256
        required: true
        type: string
      expected_repair_payload_set_sha256:
        description: Exact combined authority repair payload set SHA256
        required: true
        type: string
      expected_target_set_sha256:
        description: Exact five-slug and ten-URL cache target set SHA256
        required: true
        type: string
      operator_approval_phrase:
        description: Exact one-time cache-only production-write approval
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-${{ github.repository }}-production
  cancel-in-progress: false

jobs:
  eligibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      control_plane_sha: ${{ steps.validate.outputs.control_plane_sha }}
      release_sha: ${{ steps.validate.outputs.release_sha }}
      release_name: ${{ steps.validate.outputs.release_name }}
      manifest_sha256: ${{ steps.validate.outputs.manifest_sha256 }}
      authority_repair_receipt_sha256: ${{ steps.validate.outputs.authority_repair_receipt_sha256 }}
      authority_repair_artifact_digest: ${{ steps.validate.outputs.authority_repair_artifact_digest }}
      repair_set_sha256: ${{ steps.validate.outputs.repair_set_sha256 }}
      repair_payload_set_sha256: ${{ steps.validate.outputs.repair_payload_set_sha256 }}
      target_set_sha256: ${{ steps.validate.outputs.target_set_sha256 }}
    steps:
      - name: Checkout exact cache refresh control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.expected_control_plane_sha }}
          fetch-depth: 0

      - name: Bind latest main, exact authority repair, and exact write authorization
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CONTROL_PLANE_SHA: ${{ inputs.expected_control_plane_sha }}
          EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
          EXPECTED_RELEASE_NAME: ${{ inputs.expected_release_name }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.expected_manifest_sha256 }}
          AUTHORITY_REPAIR_RUN_ID: ${{ inputs.authority_repair_run_id }}
          AUTHORITY_REPAIR_RUN_ATTEMPT: ${{ inputs.authority_repair_run_attempt }}
          EXPECTED_AUTHORITY_REPAIR_RECEIPT_SHA256: ${{ inputs.expected_authority_repair_receipt_sha256 }}
          EXPECTED_AUTHORITY_REPAIR_ARTIFACT_DIGEST: ${{ inputs.expected_authority_repair_artifact_digest }}
          EXPECTED_REPAIR_SET_SHA256: ${{ inputs.expected_repair_set_sha256 }}
          EXPECTED_REPAIR_PAYLOAD_SET_SHA256: ${{ inputs.expected_repair_payload_set_sha256 }}
          EXPECTED_TARGET_SET_SHA256: ${{ inputs.expected_target_set_sha256 }}
          OPERATOR_APPROVAL_PHRASE: ${{ inputs.operator_approval_phrase }}
          AUTHORITY_REPAIR_CONTROL_SHA: efd7f2bd0acace0fd7463dbfb13897bd78a1cad5
          FAILED_PREWRITE_RUN_ID: "30602511379"
          FAILED_PREWRITE_RUN_ATTEMPT: "1"
          FAILED_PREWRITE_CONTROL_SHA: 012392aaf0d83375414f8eb9ad010f6c7c577714
          EXPECTED_VERIFICATION_SHA256: a4b038b0c782aa33248f9d664a207d99cd475b040bf0ac0858fdb2de7a11616c
          EXPECTED_NON_TARGET_STATE_SHA256: a3fa4d66f8691760d6b04c630dbb500258a1111a6622753982bfeece17e9c1b5
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$EXPECTED_CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_RELEASE_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          [[ "$EXPECTED_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$AUTHORITY_REPAIR_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$AUTHORITY_REPAIR_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_AUTHORITY_REPAIR_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_AUTHORITY_REPAIR_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_REPAIR_SET_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_REPAIR_PAYLOAD_SET_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_TARGET_SET_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$EXPECTED_TARGET_SET_SHA256" = "33c4418a4491c901dc35fd7ee3ddf739b7e6d2b62e32d97fe5e924d80dea1a6a"

          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_CONTROL_PLANE_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_CONTROL_PLANE_SHA"
          git merge-base --is-ancestor "$EXPECTED_RELEASE_SHA" origin/main

          failed_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_PREWRITE_RUN_ID}")"
          jq -e \
            --arg control "$FAILED_PREWRITE_CONTROL_SHA" \
            --argjson attempt "$FAILED_PREWRITE_RUN_ATTEMPT" \
            '.name == "Career Search Entry Post-Authority Cache Refresh"
             and .path == ".github/workflows/career-search-entry-post-authority-cache-refresh.yml"
             and .event == "workflow_dispatch"
             and .status == "completed"
             and .conclusion == "failure"
             and .head_branch == "main"
             and .head_sha == $control
             and .run_attempt == $attempt' <<<"$failed_run" >/dev/null
          failed_jobs="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_PREWRITE_RUN_ID}/jobs?filter=latest&per_page=100"
          )"
          jq -e \
            '.total_count == 2
             and ([.jobs[] | select(.name == "eligibility" and .conclusion == "success")] | length) == 1
             and ([.jobs[] |
               select(.name == "refresh"
                 and .conclusion == "failure"
                 and ([.steps[] |
                   select(.name == "Validate protected production target shape"
                     and .conclusion == "failure")] | length) == 1
                 and ([.steps[] |
                   select((.name == "Set up SSH"
                     or .name == "Install pinned SSH known hosts"
                     or .name == "Run exact post-authority cache-only refresh and full readback")
                     and .conclusion == "skipped")] | length) == 3)] | length) == 1' \
            <<<"$failed_jobs" >/dev/null
          failed_artifacts="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_PREWRITE_RUN_ID}/artifacts?per_page=100"
          )"
          jq -e '.total_count == 0 and (.artifacts | length) == 0' <<<"$failed_artifacts" >/dev/null

          repair_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${AUTHORITY_REPAIR_RUN_ID}")"
          jq -e \
            --arg control "$AUTHORITY_REPAIR_CONTROL_SHA" \
            --argjson attempt "$AUTHORITY_REPAIR_RUN_ATTEMPT" \
            '.name == "Career Search Entry Thin Authority Repair"
             and .path == ".github/workflows/career-search-entry-thin-authority-repair.yml"
             and .event == "workflow_dispatch"
             and .status == "completed"
             and .conclusion == "success"
             and .head_branch == "main"
             and .head_sha == $control
             and .run_attempt == $attempt' <<<"$repair_run" >/dev/null

          artifact_name="career-search-entry-thin-authority-repair-${AUTHORITY_REPAIR_RUN_ID}-${AUTHORITY_REPAIR_RUN_ATTEMPT}"
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${AUTHORITY_REPAIR_RUN_ID}/artifacts?per_page=100")"
          jq -e \
            --arg name "$artifact_name" \
            --arg digest "sha256:${EXPECTED_AUTHORITY_REPAIR_ARTIFACT_DIGEST}" \
            '[.artifacts[] | select(.name == $name and .expired == false and .digest == $digest)] | length == 1' \
            <<<"$artifacts" >/dev/null
          repair_dir="$(mktemp -d)"
          gh run download "$AUTHORITY_REPAIR_RUN_ID" --name "$artifact_name" --dir "$repair_dir"
          repair_receipt="$repair_dir/career-search-entry-thin-authority-repair.json"
          test "$(sha256sum "$repair_receipt" | awk '{print $1}')" = "$EXPECTED_AUTHORITY_REPAIR_RECEIPT_SHA256"
          jq -e \
            --arg release "$EXPECTED_RELEASE_SHA" \
            --arg manifest "$EXPECTED_MANIFEST_SHA256" \
            --arg repair_set "$EXPECTED_REPAIR_SET_SHA256" \
            --arg payload_set "$EXPECTED_REPAIR_PAYLOAD_SET_SHA256" \
            --arg verification "$EXPECTED_VERIFICATION_SHA256" \
            --arg non_target "$EXPECTED_NON_TARGET_STATE_SHA256" \
            --argjson run_id "$AUTHORITY_REPAIR_RUN_ID" \
            --argjson attempt "$AUTHORITY_REPAIR_RUN_ATTEMPT" \
            '.contract_version == "career.search_entry_batch.thin_authority_repair.v1"
             and .status == "PASS_AUTHORITY_REPAIR_COMPLETE"
             and .mode == "repair"
             and .release_sha == $release
             and .manifest_sha256 == $manifest
             and .manifest_positions == [30, 33, 34, 40, 42]
             and .repair_set_sha256 == $repair_set
             and .repair_payload_set_sha256 == $payload_set
             and .verification_sha256 == $verification
             and .non_target_state_sha256 == $non_target
             and (.verification_rows | length) == 10
             and ([.verification_rows[].module_count] | all(. == 26))
             and .write_state == "committed_verified"
             and .database_write_count == 15
             and .crosswalk_write_count == 10
             and .display_write_count == 5
             and .cache_write_count == 0
             and .workflow_run_id == $run_id
             and .workflow_run_attempt == $attempt' "$repair_receipt" >/dev/null

          expected_phrase="I explicitly approve one-time Career search-entry topology-repaired post-authority cache-only refresh for failed pre-write run ${FAILED_PREWRITE_RUN_ID} attempt ${FAILED_PREWRITE_RUN_ATTEMPT} with SSH and execute skipped and zero artifacts, authority repair run ${AUTHORITY_REPAIR_RUN_ID} attempt ${AUTHORITY_REPAIR_RUN_ATTEMPT} receipt ${EXPECTED_AUTHORITY_REPAIR_RECEIPT_SHA256} artifact ${EXPECTED_AUTHORITY_REPAIR_ARTIFACT_DIGEST}, control-plane SHA ${EXPECTED_CONTROL_PLANE_SHA}, active SHA ${EXPECTED_RELEASE_SHA}, manifest ${EXPECTED_MANIFEST_SHA256}, combined repair set ${EXPECTED_REPAIR_SET_SHA256}, repair payload set ${EXPECTED_REPAIR_PAYLOAD_SET_SHA256}, target set ${EXPECTED_TARGET_SET_SHA256}; refresh exactly five manifest-position slugs and 10 bilingual cache targets in one batch using the 5000ms offline build budget and zero per-target retry, then require exact quality-package and complete 100-URL public readback, with no DB, CMS, publication, indexability, queue, sitemap, llms, Search Channel, URL submission, deploy, rollback, or non-target write."
          test "$OPERATOR_APPROVAL_PHRASE" = "$expected_phrase"

          {
            echo "control_plane_sha=$EXPECTED_CONTROL_PLANE_SHA"
            echo "release_sha=$EXPECTED_RELEASE_SHA"
            echo "release_name=$EXPECTED_RELEASE_NAME"
            echo "manifest_sha256=$EXPECTED_MANIFEST_SHA256"
            echo "authority_repair_receipt_sha256=$EXPECTED_AUTHORITY_REPAIR_RECEIPT_SHA256"
            echo "authority_repair_artifact_digest=$EXPECTED_AUTHORITY_REPAIR_ARTIFACT_DIGEST"
            echo "repair_set_sha256=$EXPECTED_REPAIR_SET_SHA256"
            echo "repair_payload_set_sha256=$EXPECTED_REPAIR_PAYLOAD_SET_SHA256"
            echo "target_set_sha256=$EXPECTED_TARGET_SET_SHA256"
          } >> "$GITHUB_OUTPUT"

  refresh:
    needs: eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
      DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
      RETIRED_DEPLOY_HOST: ${{ secrets.PRODUCTION_RETIRED_DEPLOY_HOST }}
      DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
      CONTROL_PLANE_SHA: ${{ needs.eligibility.outputs.control_plane_sha }}
      EXPECTED_RELEASE_SHA: ${{ needs.eligibility.outputs.release_sha }}
      EXPECTED_RELEASE_NAME: ${{ needs.eligibility.outputs.release_name }}
      EXPECTED_MANIFEST_SHA256: ${{ needs.eligibility.outputs.manifest_sha256 }}
      AUTHORITY_REPAIR_RUN_ID: ${{ inputs.authority_repair_run_id }}
      AUTHORITY_REPAIR_RUN_ATTEMPT: ${{ inputs.authority_repair_run_attempt }}
      AUTHORITY_REPAIR_RECEIPT_SHA256: ${{ needs.eligibility.outputs.authority_repair_receipt_sha256 }}
      AUTHORITY_REPAIR_ARTIFACT_DIGEST: ${{ needs.eligibility.outputs.authority_repair_artifact_digest }}
      REPAIR_SET_SHA256: ${{ needs.eligibility.outputs.repair_set_sha256 }}
      REPAIR_PAYLOAD_SET_SHA256: ${{ needs.eligibility.outputs.repair_payload_set_sha256 }}
      EXPECTED_TARGET_SET_SHA256: ${{ needs.eligibility.outputs.target_set_sha256 }}
    steps:
      - name: Checkout exact cache refresh control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.eligibility.outputs.control_plane_sha }}

      - name: Validate protected production target shape
        shell: bash
        run: |
          set -euo pipefail
          for name in DEPLOY_USER DEPLOY_PORT DEPLOY_HOST RETIRED_DEPLOY_HOST DEPLOY_PATH; do
            test -n "${!name:-}"
          done
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          test "$DEPLOY_PORT" -ge 1
          test "$DEPLOY_PORT" -le 65535
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$RETIRED_DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          test "$DEPLOY_HOST" != "$RETIRED_DEPLOY_HOST"
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_PATH" != *".."* ]]

      - name: Set up SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known hosts
        shell: bash
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null \
            || ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f ~/.ssh/known_hosts >/dev/null

      - name: Run exact post-authority cache-only refresh and full readback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          runner="backend/scripts/career/career_search_entry_batch_cache_refresh_resume.php"
          runner_sha256="$(sha256sum "$runner" | awk '{print $1}')"
          for variable in DEPLOY_PATH EXPECTED_RELEASE_SHA EXPECTED_RELEASE_NAME \
            EXPECTED_MANIFEST_SHA256 AUTHORITY_REPAIR_RECEIPT_SHA256 \
            EXPECTED_TARGET_SET_SHA256; do
            printf -v "q_${variable}" '%q' "${!variable}"
          done
          set +e
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -o ServerAliveInterval=20 -o ServerAliveCountMax=30 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "CAREER_CACHE_RESUME_MODE=post_authority_execute DEPLOY_PATH=$q_DEPLOY_PATH EXPECTED_RELEASE_SHA=$q_EXPECTED_RELEASE_SHA EXPECTED_RELEASE_NAME=$q_EXPECTED_RELEASE_NAME EXPECTED_MANIFEST_SHA256=$q_EXPECTED_MANIFEST_SHA256 EXPECTED_AUTHORITY_REPAIR_RECEIPT_SHA256=$q_AUTHORITY_REPAIR_RECEIPT_SHA256 EXPECTED_RESUME_TARGET_SET_SHA256=$q_EXPECTED_TARGET_SET_SHA256 php" \
            < "$runner" > artifacts/remote-receipt.json
          remote_status=$?
          set -e
          jq \
            --arg control "$CONTROL_PLANE_SHA" \
            --arg runner "$runner_sha256" \
            --arg authority_receipt "$AUTHORITY_REPAIR_RECEIPT_SHA256" \
            --arg authority_artifact "$AUTHORITY_REPAIR_ARTIFACT_DIGEST" \
            --arg repair_set "$REPAIR_SET_SHA256" \
            --arg repair_payload_set "$REPAIR_PAYLOAD_SET_SHA256" \
            --argjson authority_run "$AUTHORITY_REPAIR_RUN_ID" \
            --argjson authority_attempt "$AUTHORITY_REPAIR_RUN_ATTEMPT" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            '. + {
              contract_version: "career.search_entry_batch.post_authority_cache_refresh.v1",
              control_plane_sha: $control,
              runner_sha256: $runner,
              authority_repair_run_id: $authority_run,
              authority_repair_run_attempt: $authority_attempt,
              authority_repair_receipt_sha256: $authority_receipt,
              authority_repair_artifact_digest: $authority_artifact,
              authority_repair_set_sha256: $repair_set,
              authority_repair_payload_set_sha256: $repair_payload_set,
              workflow_run_id: $run_id,
              workflow_run_attempt: $run_attempt
            }' artifacts/remote-receipt.json \
            > artifacts/career-search-entry-post-authority-cache-refresh.json
          if [ "$remote_status" -eq 0 ]; then
            jq -e '.status == "PASS_POST_AUTHORITY_EXECUTE_AND_READBACK"
              and .mode == "post_authority_execute"
              and .resume_target_count == 10
              and .resume_batch_count == 1
              and .cache_refresh_target_count == 10
              and .cache_write_count == 10
              and .completed_batch_count == 1
              and .candidate_count == 50
              and .bilingual_url_count == 100
              and .review_target_count == 300
              and .post_bad_href_url_count == 0
              and .post_low_module_url_count == 0
              and .offline_build_budget_ms == 5000
              and .per_target_retry_limit == 0
              and .write_state == "committed_verified"
              and .production_write_execution == true
              and .database_write_count == 0
              and .cms_write_count == 0
              and .publication_write_count == 0
              and .indexability_write_count == 0
              and .queue_dispatch_count == 0
              and .sitemap_write_count == 0
              and .llms_write_count == 0
              and .search_channel_action_count == 0
              and .url_submission_count == 0
              and .deploy_count == 0
              and .rollback_count == 0
              and .non_target_write_count == 0' \
              artifacts/career-search-entry-post-authority-cache-refresh.json >/dev/null
          fi
          test "$remote_status" -eq 0

      - name: Upload sanitized immutable cache refresh receipt
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: career-search-entry-post-authority-cache-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/career-search-entry-post-authority-cache-refresh.json
          if-no-files-found: error
          retention-days: 90
