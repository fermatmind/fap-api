name: Backend Production Auto Deploy
run-name: Backend Production Auto Deploy staging-${{ github.event.workflow_run.id }}

on:
  workflow_run:
    workflows: ["Deploy Application"]
    types: [completed]
    branches: [main]

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: deploy-${{ github.repository }}-production-auto-dispatch
  cancel-in-progress: false

jobs:
  operation-gate:
    name: Elect automatic production dispatcher owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      decision: ${{ steps.gate.outputs.decision }}
      operation_key: ${{ steps.identity.outputs.operation_key }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - id: identity
        shell: bash
        env:
          STAGING_RUN_ID: ${{ github.event.workflow_run.id }}
          STAGING_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          STAGING_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          identity="staging_run=${STAGING_RUN_ID}|staging_attempt=${STAGING_RUN_ATTEMPT}|sha=${STAGING_SHA}"
          echo "operation_key=$(node .github/scripts/controlled-operation-gate.cjs key --repository "$GITHUB_REPOSITORY" --workflow .github/workflows/backend-production-auto-deploy.yml --scope production-auto-dispatch --identity "$identity")" >> "$GITHUB_OUTPUT"
      - id: gate
        uses: ./.github/actions/controlled-operation-gate
        with:
          claimed-key: ${{ steps.identity.outputs.operation_key }}
          expected-key: ${{ steps.identity.outputs.operation_key }}
          workflow-file: backend-production-auto-deploy.yml
          receipt-template: backend-production-auto-dispatch-{operation_key}-{run_id}-{run_attempt}
          event-name: workflow_run
          candidate-marker: staging-${{ github.event.workflow_run.id }}

  dispatch-production:
    name: Dispatch exact staged main release
    needs: operation-gate
    if: >-
      ${{
        needs.operation-gate.outputs.decision == 'execute' &&
        github.event.workflow_run.status == 'completed' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate exact staging and merged main identity
        id: release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const stagingRunId = Number(context.payload.workflow_run.id);
            if (!Number.isSafeInteger(stagingRunId) || stagingRunId <= 0) {
              core.setFailed('Automatic production dispatch requires a valid staging run id.');
              return;
            }

            const staging = (await github.rest.actions.getWorkflowRun({
              owner,
              repo,
              run_id: stagingRunId,
            })).data;
            const deploySha = String(staging.head_sha || '');
            const expectedRepository = `${owner}/${repo}`;
            if (
              staging.name !== 'Deploy Application' ||
              staging.path !== '.github/workflows/deploy.yml' ||
              staging.status !== 'completed' ||
              staging.conclusion !== 'success' ||
              staging.event !== 'push' ||
              staging.head_branch !== 'main' ||
              staging.head_repository?.full_name !== expectedRepository ||
              !/^[0-9a-f]{40}$/.test(deploySha)
            ) {
              core.setFailed('Automatic production dispatch rejected non-exact staging evidence.');
              return;
            }

            const stagingArtifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { owner, repo, run_id: stagingRunId, per_page: 100 },
            );
            const stagingOperationReceipts = stagingArtifacts.filter((artifact) => (
              !artifact.expired &&
              /^backend-staging-operation-[0-9a-f]{64}-[0-9]+-[0-9]+$/.test(artifact.name) &&
              /^sha256:[0-9a-f]{64}$/.test(String(artifact.digest || ''))
            ));
            if (stagingOperationReceipts.length !== 1) {
              core.setFailed('Automatic production dispatch requires one immutable staging owner receipt.');
              return;
            }

            const main = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            if (main.data.commit.sha !== deploySha) {
              core.setOutput('skip', 'true');
              core.notice('Skipping superseded staging success; a newer main release owns production promotion.');
              return;
            }

            const associatedPulls = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              { owner, repo, commit_sha: deploySha, per_page: 100 },
            );
            const mergedMainPulls = associatedPulls.filter((pull) => (
              pull.base?.ref === 'main' &&
              Boolean(pull.merged_at) &&
              pull.merge_commit_sha === deploySha
            ));
            if (mergedMainPulls.length !== 1) {
              core.setFailed(
                `Automatic production dispatch requires exactly one merged main PR; found ${mergedMainPulls.length}.`,
              );
              return;
            }

            const crypto = require('node:crypto');
            const sha256 = (value) => crypto.createHash('sha256').update(value, 'utf8').digest('hex');
            const releaseId = `standard-${deploySha.slice(0, 12)}`;
            const productionIdentity = `release_sha=${deploySha}|staging_run=${stagingRunId}|release_id=${releaseId}|mode=standard|active=|migration=`;
            const productionOperationKey = sha256([
              'fermatmind.operation.v1',
              `repository=${owner}/${repo}`,
              'workflow=.github/workflows/deploy-production.yml',
              'scope=production-deploy',
              `identity_sha256=${sha256(productionIdentity)}`,
              '',
            ].join('\n'));
            const expectedRunTitle = `Deploy API Production ${deploySha} staging-${stagingRunId} [op:${productionOperationKey}]`;
            const productionRuns = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner,
                repo,
                workflow_id: 'deploy-production.yml',
                event: 'workflow_dispatch',
                per_page: 100,
              },
            );
            if (productionRuns.some((run) => run.display_title === expectedRunTitle)) {
              core.setOutput('skip', 'true');
              core.notice('Exact staging run already has a production dispatch; automatic retry is refused.');
              return;
            }

            core.setOutput('skip', 'false');
            core.setOutput('deploy_sha', deploySha);
            core.setOutput('staging_run_id', String(stagingRunId));
            core.setOutput('release_id', releaseId);
            core.setOutput('operation_key', productionOperationKey);
            core.setOutput('merged_pr', String(mergedMainPulls[0].number));

      - name: Check out exact staged main
        if: steps.release.outputs.skip != 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ steps.release.outputs.deploy_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve latest successful active production receipt
        if: steps.release.outputs.skip != 'true'
        id: active_run
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner,
                repo,
                workflow_id: 'deploy-production.yml',
                status: 'success',
                per_page: 100,
              },
            );
            for (const run of runs) {
              const jobs = await github.paginate(
                github.rest.actions.listJobsForWorkflowRun,
                { owner, repo, run_id: run.id, per_page: 100 },
              );
              const activated = jobs.some((job) => (
                job.conclusion === 'success' &&
                (job.steps || []).some((step) => (
                  step.name === 'Record production release candidate' && step.conclusion === 'success'
                ))
              ));
              if (!activated) continue;

              core.setOutput('run_id', String(run.id));
              core.setOutput('run_attempt', String(run.run_attempt));
              return;
            }
            core.setFailed('Automatic production dispatch could not resolve an active production receipt.');

      - name: Verify active revision receipt and cumulative no-migration scope
        if: steps.release.outputs.skip != 'true'
        id: active
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIVE_RUN_ID: ${{ steps.active_run.outputs.run_id }}
          ACTIVE_RUN_ATTEMPT: ${{ steps.active_run.outputs.run_attempt }}
          DEPLOY_SHA: ${{ steps.release.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          [[ "$ACTIVE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$ACTIVE_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]

          receipt_dir="$RUNNER_TEMP/backend-production-active-receipt"
          mkdir -p "$receipt_dir"
          gh run download "$ACTIVE_RUN_ID" \
            --pattern "backend-production-deploy-progress-${ACTIVE_RUN_ID}-*" \
            --dir "$receipt_dir"
          mapfile -t receipt_files < <(find "$receipt_dir" -type f -name 'deployer-progress.json' -print)
          test "${#receipt_files[@]}" -eq 1
          receipt_file="${receipt_files[0]}"
          active_sha="$(jq -er \
            --arg run_id "$ACTIVE_RUN_ID" \
            --arg run_attempt "$ACTIVE_RUN_ATTEMPT" '
              select(
                .schema_version == "fermatmind.deployer-progress.v1"
                and .environment == "production"
                and .workflow_run_id == $run_id
                and .workflow_run_attempt == $run_attempt
                and .status == "completed"
                and (.sha | type == "string" and test("^[0-9a-f]{40}$"))
              )
              | .sha
            ' "$receipt_file")"
          git cat-file -e "${active_sha}^{commit}"
          git merge-base --is-ancestor "$active_sha" "$DEPLOY_SHA"
          test "$active_sha" != "$DEPLOY_SHA"
          test -n "$(git diff --no-renames --name-only "$active_sha" "$DEPLOY_SHA")"
          test -z "$(git diff --no-renames --name-only "$active_sha" "$DEPLOY_SHA" -- backend/database/migrations)"
          echo "active_sha=$active_sha" >> "$GITHUB_OUTPUT"

      - name: Dispatch exact standard production release
        if: steps.release.outputs.skip != 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          DEPLOY_SHA: ${{ steps.release.outputs.deploy_sha }}
          STAGING_RUN_ID: ${{ steps.release.outputs.staging_run_id }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          MERGED_PR: ${{ steps.release.outputs.merged_pr }}
          ACTIVE_SHA: ${{ steps.active.outputs.active_sha }}
          OPERATION_KEY: ${{ steps.release.outputs.operation_key }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const deploySha = process.env.DEPLOY_SHA;
            const stagingRunId = process.env.STAGING_RUN_ID;
            const releaseId = process.env.RELEASE_ID;
            const operationKey = process.env.OPERATION_KEY;
            const approvalPhrase = [
              'I explicitly approve bounded backend production deploy for exact SHA',
              deploySha + ',',
              'excluding all newer main commits, release',
              releaseId + '.',
            ].join(' ');
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'deploy-production.yml',
              ref: 'main',
              inputs: {
                expected_release_sha: deploySha,
                staging_run_id: stagingRunId,
                release_id: releaseId,
                operator_approval_phrase: approvalPhrase,
                deploy_mode: 'standard',
                operation_key: operationKey,
              },
            });

            await core.summary
              .addHeading('Backend production auto deploy')
              .addRaw(`Dispatched exact staged main SHA ${deploySha}.`)
              .addEOL()
              .addRaw(`Staging run: ${stagingRunId}.`)
              .addEOL()
              .addRaw(`Merged PR: #${process.env.MERGED_PR}.`)
              .addEOL()
              .addRaw(`Verified active ancestor: ${process.env.ACTIVE_SHA}.`)
              .write();

      - name: Write automatic dispatch owner receipt
        if: steps.release.outputs.skip != 'true'
        shell: bash
        env:
          OPERATION_KEY: ${{ needs.operation-gate.outputs.operation_key }}
        run: |
          mkdir -p "$RUNNER_TEMP/production-auto-dispatch"
          jq -n --arg key "$OPERATION_KEY" --argjson run "$GITHUB_RUN_ID" --argjson attempt "$GITHUB_RUN_ATTEMPT" \
            '{schema:"fermatmind.production_auto_dispatch_receipt.v1",operation_key:$key,workflow_run_id:$run,workflow_run_attempt:$attempt,result:"dispatched"}' \
            > "$RUNNER_TEMP/production-auto-dispatch/receipt.json"

      - name: Upload automatic dispatch owner receipt
        if: steps.release.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-production-auto-dispatch-${{ needs.operation-gate.outputs.operation_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-auto-dispatch/receipt.json
          if-no-files-found: error
          retention-days: 30
