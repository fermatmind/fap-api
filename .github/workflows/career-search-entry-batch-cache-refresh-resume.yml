name: Career Search Entry Batch Cache Refresh Permission-Repaired Resume

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preflight is read-only; execute requires its exact production-write phrase
        required: true
        type: choice
        options:
          - preflight
          - execute
      expected_control_plane_sha:
        description: Exact latest main SHA containing this resume control
        required: true
        type: string
      expected_release_sha:
        description: Exact unchanged active production application SHA
        required: true
        type: string
      expected_release_name:
        description: Exact unchanged active production release name
        required: true
        type: string
      failed_run_id:
        description: Exact indeterminate cache-refresh execute run
        required: true
        type: string
      failed_run_attempt:
        description: Exact indeterminate cache-refresh execute attempt
        required: true
        type: string
      recovery_run_id:
        description: Exact successful indeterminate recovery preflight run
        required: true
        type: string
      recovery_run_attempt:
        description: Exact successful indeterminate recovery preflight attempt
        required: true
        type: string
      expected_manifest_sha256:
        description: Exact 50-slug manifest SHA from recovery
        required: true
        type: string
      expected_recovery_readback_sha256:
        description: Exact current readback SHA from recovery
        required: true
        type: string
      expected_bad_href_url_count:
        description: Exact locale-unsafe-href URL count from diagnostic
        required: true
        type: string
      expected_low_module_url_count:
        description: Exact thin-module URL count from diagnostic
        required: true
        type: string
      failed_preflight_run_id:
        description: Exact failed resume preflight diagnosed before rebase
        required: true
        type: string
      failed_preflight_run_attempt:
        description: Exact failed resume preflight attempt diagnosed before rebase
        required: true
        type: string
      expected_failed_preflight_receipt_sha256:
        description: Exact immutable failed resume preflight receipt SHA
        required: true
        type: string
      diagnostic_run_id:
        description: Exact successful resume-preflight failure diagnostic run
        required: true
        type: string
      diagnostic_run_attempt:
        description: Exact successful resume-preflight failure diagnostic attempt
        required: true
        type: string
      expected_diagnostic_receipt_sha256:
        description: Exact immutable diagnostic receipt SHA
        required: true
        type: string
      preflight_run_id:
        description: Execute only; exact successful resume preflight run
        required: false
        default: ""
        type: string
      preflight_run_attempt:
        description: Execute only; exact successful resume preflight attempt
        required: false
        default: ""
        type: string
      expected_preflight_state_sha256:
        description: Execute only; exact resume preflight state SHA
        required: false
        default: ""
        type: string
      expected_resume_target_set_sha256:
        description: Execute only; exact residual target-set SHA
        required: false
        default: ""
        type: string
      expected_resume_target_count:
        description: Execute only; exact residual target count
        required: false
        default: ""
        type: string
      expected_resume_batch_count:
        description: Execute only; exact bounded batch count
        required: false
        default: ""
        type: string
      operator_approval_phrase:
        description: Exact mode-specific operator phrase
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-${{ github.repository }}-production
  cancel-in-progress: false

jobs:
  eligibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.validate.outputs.mode }}
      control_plane_sha: ${{ steps.validate.outputs.control_plane_sha }}
      release_sha: ${{ steps.validate.outputs.release_sha }}
      release_name: ${{ steps.validate.outputs.release_name }}
      failed_run_id: ${{ steps.validate.outputs.failed_run_id }}
      failed_run_attempt: ${{ steps.validate.outputs.failed_run_attempt }}
      failed_receipt_sha256: ${{ steps.validate.outputs.failed_receipt_sha256 }}
      recovery_run_id: ${{ steps.validate.outputs.recovery_run_id }}
      recovery_run_attempt: ${{ steps.validate.outputs.recovery_run_attempt }}
      recovery_receipt_sha256: ${{ steps.validate.outputs.recovery_receipt_sha256 }}
      baseline_payload_set_sha256: ${{ steps.validate.outputs.baseline_payload_set_sha256 }}
      manifest_sha256: ${{ steps.validate.outputs.manifest_sha256 }}
      recovery_readback_sha256: ${{ steps.validate.outputs.recovery_readback_sha256 }}
      bad_href_url_count: ${{ steps.validate.outputs.bad_href_url_count }}
      low_module_url_count: ${{ steps.validate.outputs.low_module_url_count }}
      failed_preflight_run_id: ${{ steps.validate.outputs.failed_preflight_run_id }}
      failed_preflight_run_attempt: ${{ steps.validate.outputs.failed_preflight_run_attempt }}
      failed_preflight_receipt_sha256: ${{ steps.validate.outputs.failed_preflight_receipt_sha256 }}
      diagnostic_run_id: ${{ steps.validate.outputs.diagnostic_run_id }}
      diagnostic_run_attempt: ${{ steps.validate.outputs.diagnostic_run_attempt }}
      diagnostic_receipt_sha256: ${{ steps.validate.outputs.diagnostic_receipt_sha256 }}
      diagnostic_state_sha256: ${{ steps.validate.outputs.diagnostic_state_sha256 }}
      diagnostic_payload_set_sha256: ${{ steps.validate.outputs.diagnostic_payload_set_sha256 }}
      preflight_state_sha256: ${{ steps.validate.outputs.preflight_state_sha256 }}
      resume_target_set_sha256: ${{ steps.validate.outputs.resume_target_set_sha256 }}
      resume_target_count: ${{ steps.validate.outputs.resume_target_count }}
      resume_batch_count: ${{ steps.validate.outputs.resume_batch_count }}
      failed_resume_execute_run_id: ${{ steps.validate.outputs.failed_resume_execute_run_id }}
      failed_resume_execute_run_attempt: ${{ steps.validate.outputs.failed_resume_execute_run_attempt }}
      failed_resume_execute_receipt_sha256: ${{ steps.validate.outputs.failed_resume_execute_receipt_sha256 }}
      failed_resume_execute_artifact_digest: ${{ steps.validate.outputs.failed_resume_execute_artifact_digest }}
      permission_repair_run_id: ${{ steps.validate.outputs.permission_repair_run_id }}
      permission_repair_run_attempt: ${{ steps.validate.outputs.permission_repair_run_attempt }}
      permission_repair_receipt_sha256: ${{ steps.validate.outputs.permission_repair_receipt_sha256 }}
      permission_repair_artifact_digest: ${{ steps.validate.outputs.permission_repair_artifact_digest }}
    steps:
      - name: Checkout exact resume control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.expected_control_plane_sha }}
          fetch-depth: 0

      - name: Bind latest main, recovery receipt, and exact mode authorization
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          EXPECTED_CONTROL_PLANE_SHA: ${{ inputs.expected_control_plane_sha }}
          EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
          EXPECTED_RELEASE_NAME: ${{ inputs.expected_release_name }}
          FAILED_RUN_ID: ${{ inputs.failed_run_id }}
          FAILED_RUN_ATTEMPT: ${{ inputs.failed_run_attempt }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
          RECOVERY_RUN_ATTEMPT: ${{ inputs.recovery_run_attempt }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.expected_manifest_sha256 }}
          EXPECTED_RECOVERY_READBACK_SHA256: ${{ inputs.expected_recovery_readback_sha256 }}
          EXPECTED_BAD_HREF_URL_COUNT: ${{ inputs.expected_bad_href_url_count }}
          EXPECTED_LOW_MODULE_URL_COUNT: ${{ inputs.expected_low_module_url_count }}
          FAILED_PREFLIGHT_RUN_ID: ${{ inputs.failed_preflight_run_id }}
          FAILED_PREFLIGHT_RUN_ATTEMPT: ${{ inputs.failed_preflight_run_attempt }}
          EXPECTED_FAILED_PREFLIGHT_RECEIPT_SHA256: ${{ inputs.expected_failed_preflight_receipt_sha256 }}
          DIAGNOSTIC_RUN_ID: ${{ inputs.diagnostic_run_id }}
          DIAGNOSTIC_RUN_ATTEMPT: ${{ inputs.diagnostic_run_attempt }}
          EXPECTED_DIAGNOSTIC_RECEIPT_SHA256: ${{ inputs.expected_diagnostic_receipt_sha256 }}
          PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
          PREFLIGHT_RUN_ATTEMPT: ${{ inputs.preflight_run_attempt }}
          EXPECTED_PREFLIGHT_STATE_SHA256: ${{ inputs.expected_preflight_state_sha256 }}
          EXPECTED_RESUME_TARGET_SET_SHA256: ${{ inputs.expected_resume_target_set_sha256 }}
          EXPECTED_RESUME_TARGET_COUNT: ${{ inputs.expected_resume_target_count }}
          EXPECTED_RESUME_BATCH_COUNT: ${{ inputs.expected_resume_batch_count }}
          FAILED_RESUME_EXECUTE_RUN_ID: "30557073777"
          FAILED_RESUME_EXECUTE_RUN_ATTEMPT: "1"
          EXPECTED_FAILED_RESUME_EXECUTE_RECEIPT_SHA256: 42bf4d8ed96513b83603a8f8aa7d2e7619a811abb9fa7691c3f5390cf7a2b203
          EXPECTED_FAILED_RESUME_EXECUTE_ARTIFACT_DIGEST: bc1ac3e250a1a248de072102089d2b00aacc348e43be7741f47ebb88f456f677
          FAILED_PERMISSION_REPAIRED_ELIGIBILITY_RUN_ID: "30587810948"
          FAILED_PERMISSION_REPAIRED_ELIGIBILITY_RUN_ATTEMPT: "1"
          FAILED_PERMISSION_REPAIRED_ELIGIBILITY_CONTROL_PLANE_SHA: 22b3d47c5d7956f215d9d1edf2ff63ddab818fb8
          PREFLIGHT_CONTROL_PLANE_SHA: 2284f5d9f0528722c7a58486f86c0716e526ed5c
          PERMISSION_REPAIR_RUN_ID: "30586605927"
          PERMISSION_REPAIR_RUN_ATTEMPT: "1"
          EXPECTED_PERMISSION_REPAIR_RECEIPT_SHA256: 346adeed33a71db9b82d2513a9728f45980c8a45724adf1df3f788a1e23dbc12
          EXPECTED_PERMISSION_REPAIR_ARTIFACT_DIGEST: c2256ef80b6b69958747137b9ef2e46a476b792d81192772dd62577468c343c4
          OPERATOR_APPROVAL_PHRASE: ${{ inputs.operator_approval_phrase }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$MODE" == "preflight" || "$MODE" == "execute" ]]
          [[ "$EXPECTED_CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_RELEASE_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          [[ "$FAILED_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$FAILED_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$RECOVERY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RECOVERY_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_RECOVERY_READBACK_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_BAD_HREF_URL_COUNT" =~ ^[1-9][0-9]{0,2}$ ]]
          [[ "$EXPECTED_LOW_MODULE_URL_COUNT" =~ ^(0|[1-9][0-9]{0,2})$ ]]
          [[ "$FAILED_PREFLIGHT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$FAILED_PREFLIGHT_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_FAILED_PREFLIGHT_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$DIAGNOSTIC_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$DIAGNOSTIC_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_DIAGNOSTIC_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$FAILED_RESUME_EXECUTE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$FAILED_RESUME_EXECUTE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_FAILED_RESUME_EXECUTE_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_FAILED_RESUME_EXECUTE_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$FAILED_PERMISSION_REPAIRED_ELIGIBILITY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$FAILED_PERMISSION_REPAIRED_ELIGIBILITY_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$FAILED_PERMISSION_REPAIRED_ELIGIBILITY_CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PREFLIGHT_CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PERMISSION_REPAIR_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PERMISSION_REPAIR_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_PERMISSION_REPAIR_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_PERMISSION_REPAIR_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          test "$EXPECTED_BAD_HREF_URL_COUNT" -le 100
          test "$EXPECTED_LOW_MODULE_URL_COUNT" -le 100
          test "$FAILED_PREFLIGHT_RUN_ID" -gt "$RECOVERY_RUN_ID"
          test "$DIAGNOSTIC_RUN_ID" -gt "$FAILED_PREFLIGHT_RUN_ID"

          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_CONTROL_PLANE_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_CONTROL_PLANE_SHA"
          git merge-base --is-ancestor "$EXPECTED_RELEASE_SHA" origin/main

          recovery_run="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RECOVERY_RUN_ID}"
          )"
            jq -e \
            --argjson attempt "$RECOVERY_RUN_ATTEMPT" \
            '.name == "Career Search Entry Batch Cache Refresh Recovery Preflight"
             and .path == ".github/workflows/career-search-entry-batch-cache-refresh-recovery-preflight.yml"
             and .event == "workflow_dispatch"
             and .status == "completed"
             and .conclusion == "success"
             and .head_branch == "main"
             and .run_attempt == $attempt' <<<"$recovery_run" >/dev/null

          receipt_dir="$(mktemp -d)"
          gh run download "$RECOVERY_RUN_ID" \
            --name "career-search-entry-batch-cache-refresh-recovery-preflight-${RECOVERY_RUN_ID}-${RECOVERY_RUN_ATTEMPT}" \
            --dir "$receipt_dir"
          recovery_receipt="$receipt_dir/career-search-entry-batch-cache-refresh-recovery-preflight.json"
          recovery_receipt_sha256="$(sha256sum "$recovery_receipt" | awk '{print $1}')"
          failed_receipt_sha256="$(jq -er '.failed_receipt_sha256' "$recovery_receipt")"
          jq -e \
            --arg release "$EXPECTED_RELEASE_SHA" \
            --arg release_name "$EXPECTED_RELEASE_NAME" \
            --arg manifest "$EXPECTED_MANIFEST_SHA256" \
            --arg readback "$EXPECTED_RECOVERY_READBACK_SHA256" \
            --argjson failed_run "$FAILED_RUN_ID" \
            --argjson failed_attempt "$FAILED_RUN_ATTEMPT" \
            --argjson recovery_run "$RECOVERY_RUN_ID" \
            --argjson recovery_attempt "$RECOVERY_RUN_ATTEMPT" \
            --argjson bad_href "$EXPECTED_BAD_HREF_URL_COUNT" \
            --argjson low_module "$EXPECTED_LOW_MODULE_URL_COUNT" \
            '.contract_version == "career.search_entry_batch.cache_refresh.recovery_preflight.v1"
             and .status == "PASS_RECOVERY_RESUME_REQUIRED"
             and .release_sha == $release
             and .release_name == $release_name
             and .failed_run_id == $failed_run
             and .failed_run_attempt == $failed_attempt
             and .workflow_run_id == $recovery_run
             and .workflow_run_attempt == $recovery_attempt
             and .manifest_sha256 == $manifest
             and .current_readback_sha256 == $readback
             and .bad_href_url_count == $bad_href
             and .low_module_url_count == $low_module
             and (.failed_receipt_sha256 | test("^[0-9a-f]{64}$"))
             and (.current_payload_set_sha256 | test("^[0-9a-f]{64}$"))
             and .candidate_count == 50
             and .bilingual_url_count == 100
             and .write_state == "none"
             and .production_write_execution == false
             and .recovery_action_authorized == false
             and .retry_execution_count == 0
             and .cache_refresh_target_count == 0
             and .database_write_count == 0
             and .cms_write_count == 0
             and .publication_write_count == 0
             and .indexability_write_count == 0
             and .queue_dispatch_count == 0
             and .sitemap_write_count == 0
             and .llms_write_count == 0
             and .search_channel_action_count == 0
             and .url_submission_count == 0
             and .non_target_write_count == 0
             and .deploy_count == 0
             and .rollback_count == 0' "$recovery_receipt" >/dev/null

          failed_preflight_run="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_PREFLIGHT_RUN_ID}"
          )"
          failed_preflight_control_sha="$(jq -er '.head_sha' <<<"$failed_preflight_run")"
          jq -e \
            --argjson attempt "$FAILED_PREFLIGHT_RUN_ATTEMPT" \
            '.name == "Career Search Entry Batch Cache Refresh Resume"
             and .path == ".github/workflows/career-search-entry-batch-cache-refresh-resume.yml"
             and .event == "workflow_dispatch"
             and .status == "completed"
             and .conclusion == "failure"
             and .head_branch == "main"
             and .run_attempt == $attempt' <<<"$failed_preflight_run" >/dev/null
          failed_preflight_dir="$(mktemp -d)"
          gh run download "$FAILED_PREFLIGHT_RUN_ID" \
            --name "career-search-entry-batch-cache-refresh-resume-preflight-${FAILED_PREFLIGHT_RUN_ID}-${FAILED_PREFLIGHT_RUN_ATTEMPT}" \
            --dir "$failed_preflight_dir"
          failed_preflight_receipt="$failed_preflight_dir/career-search-entry-batch-cache-refresh-resume.json"
          test "$(sha256sum "$failed_preflight_receipt" | awk '{print $1}')" \
            = "$EXPECTED_FAILED_PREFLIGHT_RECEIPT_SHA256"
          jq -e \
            --arg release "$EXPECTED_RELEASE_SHA" \
            --arg release_name "$EXPECTED_RELEASE_NAME" \
            --arg manifest "$EXPECTED_MANIFEST_SHA256" \
            --arg recovery_receipt "$recovery_receipt_sha256" \
            --arg control "$failed_preflight_control_sha" \
            --argjson failed_run "$FAILED_RUN_ID" \
            --argjson failed_attempt "$FAILED_RUN_ATTEMPT" \
            --argjson recovery_run "$RECOVERY_RUN_ID" \
            --argjson recovery_attempt "$RECOVERY_RUN_ATTEMPT" \
            --argjson preflight_run "$FAILED_PREFLIGHT_RUN_ID" \
            --argjson preflight_attempt "$FAILED_PREFLIGHT_RUN_ATTEMPT" \
            '.contract_version == "career.search_entry_batch.cache_refresh.resume.v1"
             and .mode == "preflight"
             and .status == "FAIL_CLOSED"
             and .release_sha == $release
             and .release_name == $release_name
             and .manifest_sha256 == $manifest
             and .control_plane_sha == $control
             and .failed_run_id == $failed_run
             and .failed_run_attempt == $failed_attempt
             and .recovery_run_id == $recovery_run
             and .recovery_run_attempt == $recovery_attempt
             and .recovery_receipt_sha256 == $recovery_receipt
             and .workflow_run_id == $preflight_run
             and .workflow_run_attempt == $preflight_attempt
             and .failed_stage == "pre_write_validation"
             and .failure_category == "PUBLIC_SNAPSHOT_INCOMPLETE"
             and .write_state == "none"
             and .production_write_execution == false
             and .cache_refresh_target_count == 0
             and .completed_batch_count == 0
             and .database_write_count == 0
             and .cms_write_count == 0
             and .publication_write_count == 0
             and .indexability_write_count == 0
             and .queue_dispatch_count == 0
             and .sitemap_write_count == 0
             and .llms_write_count == 0
             and .search_channel_action_count == 0
             and .url_submission_count == 0
             and .non_target_write_count == 0
             and .deploy_count == 0
             and .rollback_count == 0' "$failed_preflight_receipt" >/dev/null

          diagnostic_run="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${DIAGNOSTIC_RUN_ID}"
          )"
          diagnostic_control_sha="$(jq -er '.head_sha' <<<"$diagnostic_run")"
          jq -e \
            --argjson attempt "$DIAGNOSTIC_RUN_ATTEMPT" \
            '.name == "Career Search Entry Batch Cache Refresh Resume Preflight Diagnostic"
             and .path == ".github/workflows/career-search-entry-batch-cache-refresh-resume-preflight-diagnostic.yml"
             and .event == "workflow_dispatch"
             and .status == "completed"
             and .conclusion == "success"
             and .head_branch == "main"
             and .run_attempt == $attempt' <<<"$diagnostic_run" >/dev/null
          diagnostic_dir="$(mktemp -d)"
          gh run download "$DIAGNOSTIC_RUN_ID" \
            --name "career-search-entry-batch-cache-refresh-resume-preflight-diagnostic-${DIAGNOSTIC_RUN_ID}-${DIAGNOSTIC_RUN_ATTEMPT}" \
            --dir "$diagnostic_dir"
          diagnostic_receipt="$diagnostic_dir/career-search-entry-batch-cache-refresh-resume-preflight-diagnostic.json"
          diagnostic_receipt_sha256="$(sha256sum "$diagnostic_receipt" | awk '{print $1}')"
          test "$diagnostic_receipt_sha256" = "$EXPECTED_DIAGNOSTIC_RECEIPT_SHA256"
          diagnostic_state_sha256="$(jq -er '.diagnostic_state_sha256' "$diagnostic_receipt")"
          diagnostic_payload_set_sha256="$(jq -er '.observed_payload_set_sha256' "$diagnostic_receipt")"
          [[ "$diagnostic_state_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$diagnostic_payload_set_sha256" =~ ^[0-9a-f]{64}$ ]]
          jq -e \
            --arg release "$EXPECTED_RELEASE_SHA" \
            --arg release_name "$EXPECTED_RELEASE_NAME" \
            --arg manifest "$EXPECTED_MANIFEST_SHA256" \
            --arg control "$diagnostic_control_sha" \
            --arg state "$diagnostic_state_sha256" \
            --arg payload_set "$diagnostic_payload_set_sha256" \
            --arg failed_preflight_receipt "$EXPECTED_FAILED_PREFLIGHT_RECEIPT_SHA256" \
            --arg failed_receipt "$failed_receipt_sha256" \
            --arg recovery_receipt "$recovery_receipt_sha256" \
            --argjson failed_preflight_run "$FAILED_PREFLIGHT_RUN_ID" \
            --argjson failed_preflight_attempt "$FAILED_PREFLIGHT_RUN_ATTEMPT" \
            --argjson failed_run "$FAILED_RUN_ID" \
            --argjson failed_attempt "$FAILED_RUN_ATTEMPT" \
            --argjson recovery_run "$RECOVERY_RUN_ID" \
            --argjson recovery_attempt "$RECOVERY_RUN_ATTEMPT" \
            --argjson diagnostic_run "$DIAGNOSTIC_RUN_ID" \
            --argjson diagnostic_attempt "$DIAGNOSTIC_RUN_ATTEMPT" \
            --argjson bad_href "$EXPECTED_BAD_HREF_URL_COUNT" \
            --argjson low_module "$EXPECTED_LOW_MODULE_URL_COUNT" \
            '.contract_version == "career.search_entry_batch.cache_refresh.resume.v1"
             and .mode == "diagnose"
             and .status == "PASS_DIAGNOSTIC_COMPLETE_STATE_DRIFT"
             and .release_sha == $release
             and .release_name == $release_name
             and .manifest_sha256 == $manifest
             and .control_plane_sha == $control
             and .diagnostic_state_sha256 == $state
             and .observed_payload_set_sha256 == $payload_set
             and .failed_preflight_run_id == $failed_preflight_run
             and .failed_preflight_run_attempt == $failed_preflight_attempt
             and .failed_preflight_receipt_sha256 == $failed_preflight_receipt
             and .failed_run_id == $failed_run
             and .failed_run_attempt == $failed_attempt
             and .failed_receipt_sha256 == $failed_receipt
             and .recovery_run_id == $recovery_run
             and .recovery_run_attempt == $recovery_attempt
             and .recovery_receipt_sha256 == $recovery_receipt
             and .workflow_run_id == $diagnostic_run
             and .workflow_run_attempt == $diagnostic_attempt
             and .observed_slug_count == 50
             and .observed_url_count == 100
             and .observed_http_200_count == 100
             and .observed_transport_failure_count == 0
             and .observed_non_200_response_count == 0
             and .observed_canonical_ok_count == 100
             and .observed_robots_ok_count == 100
             and .observed_locale_ok_count == 100
             and .observed_bad_href_url_count == $bad_href
             and .observed_low_module_url_count == $low_module
             and .snapshot_complete == true
             and .recovery_baseline_match == false
             and .write_state == "none"
