name: Career detail production cache repair

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "verify_only is read-only; direct_repair warms bounded cache batches inside the exact inactive candidate runtime"
        required: true
        default: verify_only
        type: choice
        options:
          - verify_only
          - direct_repair
      expected_active_revision:
        description: "Exact 40-character REVISION currently active on production"
        required: true
        type: string
      candidate_release_revision:
        description: "Exact 40-character REVISION materialized in the inactive candidate release"
        required: true
        type: string
      candidate_release_name:
        description: "Exact inactive Deployer release directory name"
        required: true
        type: string
      staging_run_id:
        description: "Successful exact-SHA Deploy Application staging run"
        required: true
        type: string
      expected_missing_pointer_count:
        description: "Exact read-only preflight missing_pointer_count (0-2092)"
        required: true
        default: "2090"
        type: string
      operator_approval_phrase:
        description: "Required only for direct_repair; must match the exact revision/count-bound phrase"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

jobs:
  production-cache-repair:
    name: Career detail production cache repair (${{ inputs.mode }})
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120
    concurrency:
      group: deploy-${{ github.repository }}-production
      cancel-in-progress: false
    env:
      DEPLOY_USER: ${{ vars.PRODUCTION_DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.PRODUCTION_DEPLOY_PORT }}
      DEPLOY_HOST: ${{ vars.PRODUCTION_DEPLOY_HOST }}
      RETIRED_DEPLOY_HOST: ${{ vars.PRODUCTION_RETIRED_DEPLOY_HOST }}
      DEPLOY_PATH: ${{ vars.PRODUCTION_DEPLOY_PATH }}
      MINIMUM_TARGETS: "2092"
      REPAIR_BATCH_SIZE: "250"

    steps:
      - name: Validate exact production cache operation contract
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          EXPECTED_ACTIVE_REVISION: ${{ inputs.expected_active_revision }}
          CANDIDATE_RELEASE_REVISION: ${{ inputs.candidate_release_revision }}
          CANDIDATE_RELEASE_NAME: ${{ inputs.candidate_release_name }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
          EXPECTED_MISSING_POINTER_COUNT: ${{ inputs.expected_missing_pointer_count }}
          OPERATOR_APPROVAL_PHRASE: ${{ inputs.operator_approval_phrase }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          for name in DEPLOY_USER DEPLOY_PORT DEPLOY_HOST RETIRED_DEPLOY_HOST DEPLOY_PATH; do
            test -n "${!name:-}"
          done
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          test "$DEPLOY_PORT" -ge 1
          test "$DEPLOY_PORT" -le 65535
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$RETIRED_DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          test "$DEPLOY_HOST" != "$RETIRED_DEPLOY_HOST"
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_PATH" != *".."* ]]
          [[ "$EXPECTED_ACTIVE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_RELEASE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_ACTIVE_REVISION" != "$CANDIDATE_RELEASE_REVISION"
          [[ "$CANDIDATE_RELEASE_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          [[ "$STAGING_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_MISSING_POINTER_COUNT" =~ ^(0|[1-9][0-9]{0,3})$ ]]
          test "$EXPECTED_MISSING_POINTER_COUNT" -le "$MINIMUM_TARGETS"

          case "$MODE" in
            verify_only)
              if [ -n "$OPERATOR_APPROVAL_PHRASE" ]; then
                echo "verify_only refuses an operator approval phrase." >&2
                exit 2
              fi
              ;;
            direct_repair)
              test "$EXPECTED_MISSING_POINTER_COUNT" -gt 0
              expected_phrase="I explicitly approve production Career detail cache repair with active SHA ${EXPECTED_ACTIVE_REVISION} using exact staging run ${STAGING_RUN_ID} and inactive candidate SHA ${CANDIDATE_RELEASE_REVISION} release ${CANDIDATE_RELEASE_NAME} for exactly ${EXPECTED_MISSING_POINTER_COUNT} missing pointers across ${MINIMUM_TARGETS} targets; cache-only, candidate-runtime-direct, zero queue dispatch, no CMS/DB-authority/publication/indexability/sitemap/llms/search."
              if [ "$OPERATOR_APPROVAL_PHRASE" != "$expected_phrase" ]; then
                echo "operator_approval_phrase does not match the exact production cache repair authorization." >&2
                exit 2
              fi
              ;;
            *)
              echo "unsupported mode: $MODE" >&2
              exit 2
              ;;
          esac

      - name: Check out exact candidate revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ inputs.candidate_release_revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify candidate ancestry and exact staging evidence
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_ACTIVE_REVISION: ${{ inputs.expected_active_revision }}
          CANDIDATE_RELEASE_REVISION: ${{ inputs.candidate_release_revision }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
        run: |
          set -euo pipefail
          AUDITED_RUNTIME46_PRODUCTION_SHA="bc0ed833bc9aae1473ab37f1dead2517e1aff618"
          AUDITED_RUNTIME46_BRIDGE_SHA="49038deb50cda789e4365ea42068832ed28d6023"
          AUDITED_RUNTIME46_PATHS=(
            backend/app/Console/Commands/PersonalityMbtiCompRuntime46IntpPromote.php
            backend/app/Console/Commands/PersonalityMbtiCompRuntime46IntpRevision.php
            backend/app/Services/Cms/MbtiCompRuntime46IntpPromotionService.php
            backend/app/Services/Cms/MbtiFullCmsImportService.php
            backend/docs/seo/import-packages/mbti-comp-runtime-46-intp-revision-2026-07-19.json
            backend/tests/Feature/Console/PersonalityMbtiCompRuntime46IntpRevisionCommandTest.php
          )
          verify_audited_runtime46_subsumed_baseline() {
            local production_parent actual_diff expected_diff path production_blob candidate_blob
            local -a production_commit
            [ "$EXPECTED_ACTIVE_REVISION" = "$AUDITED_RUNTIME46_PRODUCTION_SHA" ] || {
              echo "Cache repair refused an unreviewed divergent production revision." >&2
              return 1
            }
            git cat-file -e "${AUDITED_RUNTIME46_BRIDGE_SHA}^{commit}" || {
              echo "Cache repair cannot resolve the audited Runtime 46 bridge." >&2
              return 1
            }
            git merge-base --is-ancestor "$AUDITED_RUNTIME46_BRIDGE_SHA" "$CANDIDATE_RELEASE_REVISION" || {
              echo "Cache repair requires a candidate descended from the audited Runtime 46 bridge." >&2
              return 1
            }
            read -r -a production_commit <<<"$(git rev-list --parents -n 1 "$EXPECTED_ACTIVE_REVISION")"
            [ "${#production_commit[@]}" -eq 2 ] || {
              echo "Cache repair requires a divergent production commit with exactly one parent." >&2
              return 1
            }
            production_parent="${production_commit[1]}"
            git merge-base --is-ancestor "$production_parent" "$CANDIDATE_RELEASE_REVISION" || {
              echo "Cache repair requires the divergent production parent to be an ancestor of the candidate." >&2
              return 1
            }
            expected_diff="$(printf '%s\n' \
              $'A\tbackend/app/Console/Commands/PersonalityMbtiCompRuntime46IntpPromote.php' \
              $'A\tbackend/app/Console/Commands/PersonalityMbtiCompRuntime46IntpRevision.php' \
              $'A\tbackend/app/Services/Cms/MbtiCompRuntime46IntpPromotionService.php' \
              $'M\tbackend/app/Services/Cms/MbtiFullCmsImportService.php' \
              $'A\tbackend/docs/seo/import-packages/mbti-comp-runtime-46-intp-revision-2026-07-19.json' \
              $'A\tbackend/tests/Feature/Console/PersonalityMbtiCompRuntime46IntpRevisionCommandTest.php')"
            actual_diff="$(git diff --no-renames --name-status "$production_parent" "$EXPECTED_ACTIVE_REVISION")"
            [ "$actual_diff" = "$expected_diff" ] || {
              echo "Cache repair refused an unknown, deleted, renamed, or status-drifted production path." >&2
              return 1
            }
            for path in "${AUDITED_RUNTIME46_PATHS[@]}"; do
              production_blob="$(git rev-parse "${EXPECTED_ACTIVE_REVISION}:${path}")" || return 1
              candidate_blob="$(git rev-parse "${CANDIDATE_RELEASE_REVISION}:${path}")" || return 1
              git cat-file -e "${production_blob}^{blob}" || return 1
              git cat-file -e "${candidate_blob}^{blob}" || return 1
              [ "$production_blob" = "$candidate_blob" ] || {
                echo "Cache repair refused Runtime 46 blob drift." >&2
                return 1
              }
            done
          }
          test "$(git rev-parse HEAD)" = "$CANDIDATE_RELEASE_REVISION"
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git cat-file -e "${EXPECTED_ACTIVE_REVISION}^{commit}"; then
            git fetch --no-tags origin "$EXPECTED_ACTIVE_REVISION"
          fi
          git cat-file -e "${EXPECTED_ACTIVE_REVISION}^{commit}"
          if ! git merge-base --is-ancestor "$EXPECTED_ACTIVE_REVISION" "$CANDIDATE_RELEASE_REVISION"; then
            verify_audited_runtime46_subsumed_baseline
          fi
          git merge-base --is-ancestor "$CANDIDATE_RELEASE_REVISION" origin/main

          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${STAGING_RUN_ID}")"
          jq -e \
            --arg candidate_sha "$CANDIDATE_RELEASE_REVISION" \
            '.name == "Deploy Application"
             and .path == ".github/workflows/deploy.yml"
             and (.event == "push" or .event == "workflow_dispatch")
             and .status == "completed"
             and .conclusion == "success"
             and .head_branch == "main"
             and .head_sha == $candidate_sha' \
            <<<"$run_json" >/dev/null

          jobs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${STAGING_RUN_ID}/jobs?per_page=100")"
          jq -e \
            '([.jobs[] | select(.name == "Deploy checks (staging)" and .conclusion == "success")] | length) == 1
             and ([.jobs[] | select(.name == "Deploy (staging)" and .conclusion == "success")] | length) == 1' \
            <<<"$jobs_json" >/dev/null

      - name: Set up SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known hosts
        shell: bash
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null \
            || ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f ~/.ssh/known_hosts >/dev/null

      - name: Verify exact active and inactive production releases
        shell: bash
        env:
          EXPECTED_ACTIVE_REVISION: ${{ inputs.expected_active_revision }}
          CANDIDATE_RELEASE_REVISION: ${{ inputs.candidate_release_revision }}
          CANDIDATE_RELEASE_NAME: ${{ inputs.candidate_release_name }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -euo pipefail; current=\$(readlink -f '$DEPLOY_PATH/current'); candidate=\$(readlink -f '$DEPLOY_PATH/releases/$CANDIDATE_RELEASE_NAME'); test -n \"\$current\"; test -n \"\$candidate\"; test \"\$current\" != \"\$candidate\"; test \"\$(tr -d '\\r\\n' < \"\$current/REVISION\")\" = '$EXPECTED_ACTIVE_REVISION'; test \"\$(tr -d '\\r\\n' < \"\$candidate/REVISION\")\" = '$CANDIDATE_RELEASE_REVISION'; test ! -e '$DEPLOY_PATH/.dep/deploy.lock'"

      - name: Read-only exact coverage preflight
        shell: bash
        env:
          CANDIDATE_RELEASE_NAME: ${{ inputs.candidate_release_name }}
          EXPECTED_MISSING_POINTER_COUNT: ${{ inputs.expected_missing_pointer_count }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          set +e
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH/releases/$CANDIDATE_RELEASE_NAME/backend' && php artisan career:verify-job-detail-cache-coverage --verify-only --locales=en,zh-CN --minimum-targets=$MINIMUM_TARGETS --json --no-interaction --no-ansi" \
            > artifacts/preflight.json
          command_status=$?
          set -e
          if [ "$command_status" -ne 0 ] && [ "$command_status" -ne 1 ]; then
            echo "coverage preflight failed unexpectedly with exit $command_status" >&2
            exit "$command_status"
          fi

          jq -e \
            --argjson expected_missing "$EXPECTED_MISSING_POINTER_COUNT" \
            --argjson expected_targets "$MINIMUM_TARGETS" \
            '.contract_version == "career.job_detail_cache_coverage.v1"
             and .expected_target_count == $expected_targets
             and .eligible_target_count == $expected_targets
             and .minimum_target_count_met == true
             and .missing_pointer_count == $expected_missing
             and .missing_payload_count == 0
             and .broken_count == 0
             and .excluded_count == 0
             and .covered_target_count == ($expected_targets - $expected_missing)' \
            artifacts/preflight.json >/dev/null

      - name: Run bounded repair inside exact candidate runtime
        if: inputs.mode == 'direct_repair'
        shell: bash
        env:
          CANDIDATE_RELEASE_NAME: ${{ inputs.candidate_release_name }}
          CANDIDATE_RELEASE_REVISION: ${{ inputs.candidate_release_revision }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -euo pipefail; cd '$DEPLOY_PATH/releases/$CANDIDATE_RELEASE_NAME/backend'; test -x /usr/bin/timeout; sudo -n -u www-data -- test -w storage/framework/cache/data"
          resume_key="production-bootstrap-${CANDIDATE_RELEASE_REVISION}"
          completed=false
          for batch in $(seq 1 9); do
            reset_flag=""
            if [ "$batch" -eq 1 ]; then
              reset_flag="--reset"
            fi
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
              -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "cd '$DEPLOY_PATH/releases/$CANDIDATE_RELEASE_NAME/backend' && sudo -n -u www-data -- /usr/bin/timeout 600 php artisan career:verify-job-detail-cache-coverage --repair-missing-direct --locales=en,zh-CN --minimum-targets=$MINIMUM_TARGETS --batch-size=$REPAIR_BATCH_SIZE --resume-key='$resume_key' $reset_flag --confirm-production-write --json --no-interaction --no-ansi" \
              | tee "artifacts/direct-repair-batch-${batch}.json"
            coverage_status="$(jq -r '.coverage_status' "artifacts/direct-repair-batch-${batch}.json")"
            remaining="$(jq -r '.repair.remaining_targets' "artifacts/direct-repair-batch-${batch}.json")"
            if [ "$coverage_status" = "ready" ]; then
              completed=true
              break
            fi
            test "$remaining" -gt 0
          done
          test "$completed" = true

      - name: Read back exact full coverage
        if: inputs.mode == 'direct_repair'
        shell: bash
        env:
          CANDIDATE_RELEASE_NAME: ${{ inputs.candidate_release_name }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH/releases/$CANDIDATE_RELEASE_NAME/backend' && php artisan career:verify-job-detail-cache-coverage --verify-only --locales=en,zh-CN --minimum-targets=$MINIMUM_TARGETS --json --no-interaction --no-ansi" \
            > artifacts/post-repair.json
          jq -e \
            --argjson expected_targets "$MINIMUM_TARGETS" \
            '.status == "ready"
             and .expected_target_count == $expected_targets
             and .eligible_target_count == $expected_targets
             and .covered_target_count == $expected_targets
             and .missing_count == 0
             and .broken_count == 0
             and .excluded_count == 0
             and .coverage_ratio == 1' \
            artifacts/post-repair.json >/dev/null

      - name: Upload production cache repair receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: career-detail-production-cache-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 30
