name: MBTI W1 English Comparison Publish Diagnostic

on:
  workflow_dispatch:
    inputs:
      expected_control_plane_sha:
        description: Exact main SHA containing this read-only diagnostic
        required: true
        type: string
      expected_active_revision:
        description: Exact deployed runtime SHA for the W1 English projection
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mbti-w1-comparison-english-publish-diagnostic
  cancel-in-progress: false

jobs:
  controlled-read-only-diagnostic:
    name: Read seven exact English comparison authority rows without mutation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout exact control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.expected_control_plane_sha }}
          fetch-depth: 1

      - name: Verify immutable diagnostic approval and control-plane contract
        shell: bash
        env:
          EXPECTED_CONTROL_PLANE_SHA: ${{ inputs.expected_control_plane_sha }}
          EXPECTED_ACTIVE_REVISION: ${{ inputs.expected_active_revision }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$EXPECTED_CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_ACTIVE_REVISION" = 660280d00a57e58bd8bc76608e19de2492c03f53
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_CONTROL_PLANE_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_CONTROL_PLANE_SHA"
          printf '%s  %s\n' \
            78b5cbe1bc0a26f41a183996f62808233800c3ffb677397ebbe46d8f8dcf232a backend/content_assets/en-content-parity/CONTROL-approvals/W1-MBTI-COMPARISONS/publish-diagnostic-readback-approval-2026-08-02.json \
            | sha256sum -c -
          jq -e '
            .artifact_kind == "controlled_transition_approval" and
            .approval_owner == "human_operator" and
            .subscope_id == "W1-MBTI-COMPARISONS" and
            .package_sha256 == "deecc8175fb43ba3730d6513b496a0ab6834459108e3b24e25550bbf40e001a2" and
            .target_authority_receipt_sha256 == "b44e50a252f48d85ca93f572f4bf5ee7f334d6155a19713cfd3c8185359edae8" and
            .prior_publish_approval_sha256 == "3a9a929dcfecc64a02d40453540a0d0ad71c002f10304d8d544c597f808a3f1c" and
            .gate == "publish_diagnostic_readback" and .verdict == "APPROVED" and
            .permissions.target_authority_readback_authorized == true and
            .permissions.publish_authorized == false and
            .permissions.activation_authorized == false and
            .permissions.active_pointer_authorized == false and
            .permissions.indexability_authorized == false and
            .permissions.sitemap_authorized == false and
            .permissions.hreflang_authorized == false and
            .permissions.llms_authorized == false and
            .permissions.json_ld_authorized == false and
            .permissions.search_submission_authorized == false and
            .permissions.deployment_authorized == false and
            .permissions.private_result_read_authorized == false and
            .permissions.attempt_report_order_payment_read_authorized == false
          ' backend/content_assets/en-content-parity/CONTROL-approvals/W1-MBTI-COMPARISONS/publish-diagnostic-readback-approval-2026-08-02.json >/dev/null

      - name: Set up pinned production SSH identity
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known hosts
        shell: bash
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS"
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null || ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f ~/.ssh/known_hosts >/dev/null

      - name: Execute one read-only authority and projection diagnostic
        shell: bash
        env:
          DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
          CONTROL_PLANE_SHA: ${{ inputs.expected_control_plane_sha }}
          ACTIVE_REVISION: ${{ inputs.expected_active_revision }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ && "$DEPLOY_PATH" != *".."* ]]
          run_dir="/tmp/mbti-w1-comparison-english-publish-diagnostic-${GITHUB_RUN_ID}"
          bundle="$RUNNER_TEMP/mbti-w1-comparison-english-publish-diagnostic-input.tgz"
          artifact_dir="$RUNNER_TEMP/mbti-w1-comparison-english-publish-diagnostic"
          receipt_path="$artifact_dir/mbti-comparison-english-publish-diagnostic.json"
          mkdir -p "$artifact_dir"
          emit_failure_receipt() {
            jq -n \
              --arg control "$CONTROL_PLANE_SHA" \
              --arg revision "$ACTIVE_REVISION" \
              --arg stage "$1" \
              '{artifact:"EN-PARITY-W1-MBTI-COMPARISON-PUBLISH-DIAGNOSTIC-FAILURE-RECEIPT",schema_version:"fermatmind.en_parity.comparison_publish_diagnostic_failure_receipt.v1",status:"BLOCKED",ok:false,failed_stage:$stage,control_plane_sha:$control,active_revision:$revision,read_only:true,cms_write_attempted:false,publish_attempted:false,activation_attempted:false,active_pointer_changed:false,indexability_attempted:false,sitemap_attempted:false,llms_attempted:false,search_submission_attempted:false,deploy_attempted:false}' \
              > "$receipt_path"
          }
          tar -C "$GITHUB_WORKSPACE" -czf "$bundle" \
            backend/scripts/mbti_comparison_english_publish_diagnostic.php \
            backend/app/Services/Cms/MbtiComparisonEnglishPublishDiagnosticService.php \
            backend/app/Services/ContentImport/MbtiComparisonEnglishPackageImporter.php \
            backend/content_assets/en-content-parity/CONTROL-approvals/W1-MBTI-COMPARISONS/publish-diagnostic-readback-approval-2026-08-02.json
          set +e
          scp -P "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$bundle" "$DEPLOY_USER@$DEPLOY_HOST:$run_dir.tgz"
          bundle_status=$?
          set -e
          if [ "$bundle_status" -ne 0 ]; then
            emit_failure_receipt source_bundle_transfer_failed
            exit "$bundle_status"
          fi
          set +e
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' RUN_DIR='$run_dir' CONTROL_PLANE_SHA='$CONTROL_PLANE_SHA' ACTIVE_REVISION='$ACTIVE_REVISION' bash -s" > "$receipt_path" <<'REMOTE'
          set -euo pipefail
          current="$(readlink -f "$DEPLOY_PATH/current")"
          test -d "$current/backend"
          test -f "$current/REVISION"
          test "$(tr -d '\r\n' < "$current/REVISION")" = "$ACTIVE_REVISION"
          test ! -e "$DEPLOY_PATH/.dep/deploy.lock"
          mkdir -p "$RUN_DIR/input"
          tar -xzf "$RUN_DIR.tgz" -C "$RUN_DIR/input"
          php -d display_errors=0 -d log_errors=0 "$RUN_DIR/input/backend/scripts/mbti_comparison_english_publish_diagnostic.php" \
            --backend-root="$current/backend" \
            --source-backend-root="$RUN_DIR/input/backend" \
            --control-plane-sha="$CONTROL_PLANE_SHA" \
            --active-revision="$ACTIVE_REVISION"
          REMOTE
          remote_status=$?
          set -e
          if [ "$remote_status" -ne 0 ]; then
            emit_failure_receipt remote_diagnostic_execution_failed
            exit "$remote_status"
          fi
          jq -e '.status == "PASS" and .ok == true and .read_only == true and .row_count == 7 and (.authority_state == "draft_exact_english_comparison" or .authority_state == "published_exact_english_comparison") and .cms_write_attempted == false and .publish_attempted == false and .activation_attempted == false and .active_pointer_changed == false and .indexability_attempted == false and .sitemap_attempted == false and .llms_attempted == false and .search_submission_attempted == false and .deploy_attempted == false and .runtime_projection.meta_robots == "noindex,follow" and .runtime_projection.sitemap_excluded == true and .runtime_projection.llms_withheld == true and .runtime_projection.search_submission_held == true' "$receipt_path" >/dev/null

      - name: Publish immutable read-only diagnostic receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mbti-w1-comparison-english-publish-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mbti-w1-comparison-english-publish-diagnostic
          if-no-files-found: warn
          retention-days: 90
