name: Enneagram llms.txt Production Ops

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact deployed fap-api SHA (40 lowercase hex)
        required: true
        type: string
      operation_mode:
        description: Read-only dry-run or exact-cohort write
        required: true
        type: choice
        options: [dry_run, write]
      cohort_sha256:
        description: Exact dry-run cohort SHA256; required for write
        required: false
        default: ""
        type: string
      operator_approval_phrase:
        description: Exact SHA- and cohort-bound operator phrase
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: enneagram-llms-txt-production-ops
  cancel-in-progress: false

jobs:
  gate:
    name: Validate exact 116-target Enneagram llms.txt cohort
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    env:
      DEPLOY_USER: ${{ vars.PRODUCTION_DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.PRODUCTION_DEPLOY_PORT }}
      DEPLOY_HOST: ${{ vars.PRODUCTION_DEPLOY_HOST }}
      RETIRED_DEPLOY_HOST: ${{ vars.PRODUCTION_RETIRED_DEPLOY_HOST }}
      DEPLOY_PATH: ${{ vars.PRODUCTION_DEPLOY_PATH }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      OPERATION_MODE: ${{ inputs.operation_mode }}
      COHORT_SHA256: ${{ inputs.cohort_sha256 }}
      OPERATOR_APPROVAL_PHRASE: ${{ inputs.operator_approval_phrase }}

    steps:
      - name: Validate exact operation approval
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          case "$OPERATION_MODE" in
            dry_run)
              test -z "$COHORT_SHA256"
              expected="Approve ENNEAGRAM llms.txt dry-run for SHA ${RELEASE_SHA}"
              ;;
            write)
              [[ "$COHORT_SHA256" =~ ^[0-9a-f]{64}$ ]]
              expected="I explicitly approve ENNEAGRAM llms.txt release for SHA ${RELEASE_SHA} cohort ${COHORT_SHA256}."
              ;;
            *) exit 2 ;;
          esac
          test "$OPERATOR_APPROVAL_PHRASE" = "$expected"

      - name: Validate protected production topology
        shell: bash
        run: |
          set -euo pipefail
          for name in DEPLOY_USER DEPLOY_PORT DEPLOY_HOST RETIRED_DEPLOY_HOST DEPLOY_PATH; do test -n "${!name:-}"; done
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$RETIRED_DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_PATH" != *".."* ]]
          test "$DEPLOY_HOST" != "$RETIRED_DEPLOY_HOST"

      - name: Set up SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known hosts
        shell: bash
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null \
            || ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f ~/.ssh/known_hosts >/dev/null

      - name: Run mandatory dry-run then optional bounded write
        shell: bash
        run: |
          set -euo pipefail
          target="$DEPLOY_USER@$DEPLOY_HOST"
          printf -v q_path '%q' "$DEPLOY_PATH"
          printf -v q_sha '%q' "$RELEASE_SHA"
          printf -v q_mode '%q' "$OPERATION_MODE"
          printf -v q_cohort '%q' "$COHORT_SHA256"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -p "$DEPLOY_PORT" "$target" \
            "DEPLOY_PATH=$q_path RELEASE_SHA=$q_sha OPERATION_MODE=$q_mode COHORT_SHA256=$q_cohort bash -s" <<'REMOTE' > summary.json
          set -Eeuo pipefail
          cd "$DEPLOY_PATH/current"
          deployed_sha="$(if [ -f REVISION ]; then tr -d '\r\n' < REVISION; else git rev-parse HEAD; fi)"
          test "$deployed_sha" = "$RELEASE_SHA"
          cd backend
          php artisan personality:enneagram-llms-txt-release-gate --dry-run --deployed-sha="$RELEASE_SHA" --json > /tmp/enneagram-llms-txt-dry-run.json
          jq -e '.ok == true and (.status == "dry_run_ready" or .status == "already_released") and .target_count == 116 and (.issues | length) == 0' /tmp/enneagram-llms-txt-dry-run.json >/dev/null
          actual_cohort="$(jq -r '.cohort_sha256' /tmp/enneagram-llms-txt-dry-run.json)"
          if [ "$OPERATION_MODE" = write ]; then
            test "$actual_cohort" = "$COHORT_SHA256"
            token="ENNEAGRAM-LLMS-TXT-RELEASE-01:${RELEASE_SHA}:${COHORT_SHA256}"
            ENNEAGRAM_LLMS_TXT_WRITE_ENABLED=true php artisan personality:enneagram-llms-txt-release-gate \
              --write --deployed-sha="$RELEASE_SHA" --confirm-cohort-sha256="$COHORT_SHA256" \
              --operator-approved="$token" --json > /tmp/enneagram-llms-txt-write.json
            jq -e '.ok == true and (.status == "released" or .status == "already_released") and .target_count == 116 and (.issues | length) == 0' /tmp/enneagram-llms-txt-write.json >/dev/null
          fi
          jq -n \
            --arg schema_version "enneagram-llms-txt-production-ops.v1" \
            --arg status "success" \
            --arg release_sha "$RELEASE_SHA" \
            --arg operation_mode "$OPERATION_MODE" \
            --arg cohort_sha256 "$actual_cohort" \
            --slurpfile dry_run /tmp/enneagram-llms-txt-dry-run.json \
            --slurpfile write /tmp/enneagram-llms-txt-write.json 2>/dev/null \
            '{schema_version:$schema_version,status:$status,release_sha:$release_sha,operation_mode:$operation_mode,cohort_sha256:$cohort_sha256,dry_run:$dry_run[0],write:($write[0] // null),negative_guarantees:{llms_full_release:false,search_queue_write_or_submit:false,sitemap_index_or_robots_write:false,cache_warm:false,deploy:false,private_payload_exposed:false}}' \
            || jq -n --arg schema_version "enneagram-llms-txt-production-ops.v1" --arg status "success" --arg release_sha "$RELEASE_SHA" --arg operation_mode "$OPERATION_MODE" --arg cohort_sha256 "$actual_cohort" --slurpfile dry_run /tmp/enneagram-llms-txt-dry-run.json \
              '{schema_version:$schema_version,status:$status,release_sha:$release_sha,operation_mode:$operation_mode,cohort_sha256:$cohort_sha256,dry_run:$dry_run[0],write:null,negative_guarantees:{llms_full_release:false,search_queue_write_or_submit:false,sitemap_index_or_robots_write:false,cache_warm:false,deploy:false,private_payload_exposed:false}}'
          rm -f /tmp/enneagram-llms-txt-dry-run.json /tmp/enneagram-llms-txt-write.json
          REMOTE

      - name: Upload sanitized aggregate summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: enneagram-llms-txt-production-ops-${{ github.run_id }}
          path: summary.json
          if-no-files-found: error
          retention-days: 14
