name: Career Search Entry Batch Cache Refresh Production Ops

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preflight is read-only; execute refreshes only the exact 100 detail cache targets
        required: true
        type: choice
        options:
          - preflight
          - execute
      expected_control_plane_sha:
        description: Exact latest main SHA containing this control plane
        required: true
        type: string
      expected_release_sha:
        description: Exact active production application SHA
        required: true
        type: string
      expected_release_name:
        description: Exact active production release name
        required: true
        type: string
      expected_manifest_sha256:
        description: Execute only; exact 50-slug manifest SHA
        required: false
        default: ""
        type: string
      expected_pre_refresh_readback_sha256:
        description: Execute only; exact immutable pre-refresh public readback SHA
        required: false
        default: ""
        type: string
      expected_bad_href_url_count:
        description: Execute only; exact preflight URL count with locale-unsafe hrefs
        required: false
        default: ""
        type: string
      expected_low_module_url_count:
        description: Execute only; exact preflight URL count with thin display modules
        required: false
        default: ""
        type: string
      preflight_run_id:
        description: Execute only; immutable successful cache-refresh preflight run
        required: false
        default: ""
        type: string
      preflight_run_attempt:
        description: Execute only; immutable successful cache-refresh preflight attempt
        required: false
        default: ""
        type: string
      operator_approval_phrase:
        description: Execute only; exact receipt-bound production cache-only approval phrase
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-${{ github.repository }}-production
  cancel-in-progress: false

jobs:
  eligibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.validate.outputs.mode }}
      control_plane_sha: ${{ steps.validate.outputs.control_plane_sha }}
      release_sha: ${{ steps.validate.outputs.release_sha }}
      release_name: ${{ steps.validate.outputs.release_name }}
      manifest_sha256: ${{ steps.validate.outputs.manifest_sha256 }}
      pre_refresh_readback_sha256: ${{ steps.validate.outputs.pre_refresh_readback_sha256 }}
      bad_href_url_count: ${{ steps.validate.outputs.bad_href_url_count }}
      low_module_url_count: ${{ steps.validate.outputs.low_module_url_count }}
    steps:
      - name: Checkout exact control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.expected_control_plane_sha }}
          fetch-depth: 0

      - name: Validate latest main and immutable cache-refresh authorization
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          EXPECTED_CONTROL_PLANE_SHA: ${{ inputs.expected_control_plane_sha }}
          EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
          EXPECTED_RELEASE_NAME: ${{ inputs.expected_release_name }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.expected_manifest_sha256 }}
          EXPECTED_PRE_REFRESH_READBACK_SHA256: ${{ inputs.expected_pre_refresh_readback_sha256 }}
          EXPECTED_BAD_HREF_URL_COUNT: ${{ inputs.expected_bad_href_url_count }}
          EXPECTED_LOW_MODULE_URL_COUNT: ${{ inputs.expected_low_module_url_count }}
          PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
          PREFLIGHT_RUN_ATTEMPT: ${{ inputs.preflight_run_attempt }}
          OPERATOR_APPROVAL_PHRASE: ${{ inputs.operator_approval_phrase }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$EXPECTED_CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_RELEASE_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_CONTROL_PLANE_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_CONTROL_PLANE_SHA"
          git merge-base --is-ancestor "$EXPECTED_RELEASE_SHA" origin/main

          if [ "$MODE" = "preflight" ]; then
            test -z "$EXPECTED_MANIFEST_SHA256"
            test -z "$EXPECTED_PRE_REFRESH_READBACK_SHA256"
            test -z "$EXPECTED_BAD_HREF_URL_COUNT"
            test -z "$EXPECTED_LOW_MODULE_URL_COUNT"
            test -z "$PREFLIGHT_RUN_ID"
            test -z "$PREFLIGHT_RUN_ATTEMPT"
            test -z "$OPERATOR_APPROVAL_PHRASE"
          else
            [[ "$EXPECTED_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
            [[ "$EXPECTED_PRE_REFRESH_READBACK_SHA256" =~ ^[0-9a-f]{64}$ ]]
            [[ "$EXPECTED_BAD_HREF_URL_COUNT" =~ ^[1-9][0-9]{0,2}$ ]]
            test "$EXPECTED_BAD_HREF_URL_COUNT" -le 100
            [[ "$EXPECTED_LOW_MODULE_URL_COUNT" =~ ^(0|[1-9][0-9]{0,2})$ ]]
            test "$EXPECTED_LOW_MODULE_URL_COUNT" -le 100
            [[ "$PREFLIGHT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$PREFLIGHT_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
            run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREFLIGHT_RUN_ID}")"
            jq -e \
              --arg sha "$EXPECTED_CONTROL_PLANE_SHA" \
              --argjson attempt "$PREFLIGHT_RUN_ATTEMPT" \
              '.name == "Career Search Entry Batch Cache Refresh Production Ops"
               and .path == ".github/workflows/career-search-entry-batch-cache-refresh-production-ops.yml"
               and .event == "workflow_dispatch"
               and .status == "completed"
               and .conclusion == "success"
               and .head_branch == "main"
               and .head_sha == $sha
               and .run_attempt == $attempt' <<<"$run_json" >/dev/null
            receipt_dir="$(mktemp -d)"
            gh run download "$PREFLIGHT_RUN_ID" \
              --name "career-search-entry-batch-cache-refresh-preflight-${PREFLIGHT_RUN_ID}-${PREFLIGHT_RUN_ATTEMPT}" \
              --dir "$receipt_dir"
            receipt="$receipt_dir/career-search-entry-batch-cache-refresh-production-ops.json"
            jq -e \
              --arg release "$EXPECTED_RELEASE_SHA" \
              --arg release_name "$EXPECTED_RELEASE_NAME" \
              --arg manifest "$EXPECTED_MANIFEST_SHA256" \
              --arg readback "$EXPECTED_PRE_REFRESH_READBACK_SHA256" \
              --argjson bad_href "$EXPECTED_BAD_HREF_URL_COUNT" \
              --argjson low_module "$EXPECTED_LOW_MODULE_URL_COUNT" \
              '.contract_version == "career.search_entry_batch.cache_refresh.production_ops.v1"
               and .status == "PASS_PREFLIGHT_REFRESH_REQUIRED"
               and .release_sha == $release
               and .release_name == $release_name
               and .manifest_sha256 == $manifest
               and .pre_refresh_readback_sha256 == $readback
               and .candidate_count == 50
               and .bilingual_url_count == 100
               and .bad_href_url_count == $bad_href
               and .low_module_url_count == $low_module
               and .write_state == "none"
               and .production_write_execution == false
               and .cache_refresh_target_count == 0
               and .database_write_count == 0
               and .cms_write_count == 0
               and .publication_write_count == 0
               and .indexability_write_count == 0
               and .queue_dispatch_count == 0
               and .sitemap_write_count == 0
               and .llms_write_count == 0
               and .search_channel_action_count == 0
               and .url_submission_count == 0
               and .non_target_write_count == 0
               and .deploy_count == 0
               and .rollback_count == 0' "$receipt" >/dev/null
            expected_phrase="I explicitly approve Career search-entry exact cache-only refresh for SHA ${EXPECTED_RELEASE_SHA} release ${EXPECTED_RELEASE_NAME} preflight run ${PREFLIGHT_RUN_ID} attempt ${PREFLIGHT_RUN_ATTEMPT} manifest ${EXPECTED_MANIFEST_SHA256} pre-refresh readback ${EXPECTED_PRE_REFRESH_READBACK_SHA256} with ${EXPECTED_BAD_HREF_URL_COUNT} locale-unsafe-href URLs and ${EXPECTED_LOW_MODULE_URL_COUNT} thin-module URLs; refresh exactly 50 slugs and 100 bilingual detail cache targets, then require exact quality-package and 100-URL public readback, with no DB, CMS, publication, indexability, queue, sitemap, llms, Search Channel, URL submission, deploy, rollback, or non-target write."
            test "$OPERATOR_APPROVAL_PHRASE" = "$expected_phrase"
          fi

          {
            echo "mode=$MODE"
            echo "control_plane_sha=$EXPECTED_CONTROL_PLANE_SHA"
            echo "release_sha=$EXPECTED_RELEASE_SHA"
            echo "release_name=$EXPECTED_RELEASE_NAME"
            echo "manifest_sha256=$EXPECTED_MANIFEST_SHA256"
            echo "pre_refresh_readback_sha256=$EXPECTED_PRE_REFRESH_READBACK_SHA256"
            echo "bad_href_url_count=$EXPECTED_BAD_HREF_URL_COUNT"
            echo "low_module_url_count=$EXPECTED_LOW_MODULE_URL_COUNT"
          } >> "$GITHUB_OUTPUT"

  operate:
    needs: eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
      DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
      RETIRED_DEPLOY_HOST: ${{ secrets.PRODUCTION_RETIRED_DEPLOY_HOST }}
      DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
      MODE: ${{ needs.eligibility.outputs.mode }}
      CONTROL_PLANE_SHA: ${{ needs.eligibility.outputs.control_plane_sha }}
      EXPECTED_RELEASE_SHA: ${{ needs.eligibility.outputs.release_sha }}
      EXPECTED_RELEASE_NAME: ${{ needs.eligibility.outputs.release_name }}
      EXPECTED_MANIFEST_SHA256: ${{ needs.eligibility.outputs.manifest_sha256 }}
      EXPECTED_PRE_REFRESH_READBACK_SHA256: ${{ needs.eligibility.outputs.pre_refresh_readback_sha256 }}
      EXPECTED_BAD_HREF_URL_COUNT: ${{ needs.eligibility.outputs.bad_href_url_count }}
      EXPECTED_LOW_MODULE_URL_COUNT: ${{ needs.eligibility.outputs.low_module_url_count }}
    steps:
      - name: Checkout exact control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.eligibility.outputs.control_plane_sha }}
          fetch-depth: 1

      - name: Validate protected production topology
        shell: bash
        run: |
          set -euo pipefail
          for name in DEPLOY_USER DEPLOY_PORT DEPLOY_HOST RETIRED_DEPLOY_HOST DEPLOY_PATH; do
            test -n "${!name:-}"
          done
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          test "$DEPLOY_PORT" -ge 1
          test "$DEPLOY_PORT" -le 65535
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$RETIRED_DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          test "$DEPLOY_HOST" != "$RETIRED_DEPLOY_HOST"
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_PATH" != *".."* ]]
          echo "Protected production topology validated without disclosing values."

      - name: Set up SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known hosts
        shell: bash
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null \
            || ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f ~/.ssh/known_hosts >/dev/null

      - name: Run exact cache-refresh phase against active release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          printf -v q_mode '%q' "$MODE"
          printf -v q_path '%q' "$DEPLOY_PATH"
          printf -v q_sha '%q' "$EXPECTED_RELEASE_SHA"
          printf -v q_name '%q' "$EXPECTED_RELEASE_NAME"
          printf -v q_manifest '%q' "$EXPECTED_MANIFEST_SHA256"
          printf -v q_readback '%q' "$EXPECTED_PRE_REFRESH_READBACK_SHA256"
          printf -v q_bad_href '%q' "$EXPECTED_BAD_HREF_URL_COUNT"
          printf -v q_low_module '%q' "$EXPECTED_LOW_MODULE_URL_COUNT"
          set +e
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -o ServerAliveInterval=20 -o ServerAliveCountMax=30 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "CAREER_CACHE_REFRESH_MODE=$q_mode DEPLOY_PATH=$q_path EXPECTED_RELEASE_SHA=$q_sha EXPECTED_RELEASE_NAME=$q_name EXPECTED_MANIFEST_SHA256=$q_manifest EXPECTED_PRE_REFRESH_READBACK_SHA256=$q_readback EXPECTED_BAD_HREF_URL_COUNT=$q_bad_href EXPECTED_LOW_MODULE_URL_COUNT=$q_low_module bash -s" \
            < backend/scripts/career/career_search_entry_batch_cache_refresh_production_ops.sh \
            > artifacts/remote-receipt.json
          remote_status=$?
          set -e
          jq \
            --arg control "$CONTROL_PLANE_SHA" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            '. + {
              control_plane_sha: $control,
              workflow_run_id: $run_id,
              workflow_run_attempt: $run_attempt
            }' artifacts/remote-receipt.json \
            > artifacts/career-search-entry-batch-cache-refresh-production-ops.json
          test "$remote_status" -eq 0
          if [ "$MODE" = "preflight" ]; then
            manifest="$(jq -er '.manifest_sha256' artifacts/career-search-entry-batch-cache-refresh-production-ops.json)"
            readback="$(jq -er '.pre_refresh_readback_sha256' artifacts/career-search-entry-batch-cache-refresh-production-ops.json)"
            bad_href="$(jq -er '.bad_href_url_count' artifacts/career-search-entry-batch-cache-refresh-production-ops.json)"
            low_module="$(jq -er '.low_module_url_count' artifacts/career-search-entry-batch-cache-refresh-production-ops.json)"
            phrase="I explicitly approve Career search-entry exact cache-only refresh for SHA ${EXPECTED_RELEASE_SHA} release ${EXPECTED_RELEASE_NAME} preflight run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT} manifest ${manifest} pre-refresh readback ${readback} with ${bad_href} locale-unsafe-href URLs and ${low_module} thin-module URLs; refresh exactly 50 slugs and 100 bilingual detail cache targets, then require exact quality-package and 100-URL public readback, with no DB, CMS, publication, indexability, queue, sitemap, llms, Search Channel, URL submission, deploy, rollback, or non-target write."
            jq --arg phrase "$phrase" '. + {exact_cache_refresh_approval_phrase: $phrase}' \
              artifacts/career-search-entry-batch-cache-refresh-production-ops.json \
              > artifacts/final.json
            mv artifacts/final.json artifacts/career-search-entry-batch-cache-refresh-production-ops.json
          fi

      - name: Upload sanitized immutable receipt
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: career-search-entry-batch-cache-refresh-${{ needs.eligibility.outputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/career-search-entry-batch-cache-refresh-production-ops.json
          if-no-files-found: error
          retention-days: 90
