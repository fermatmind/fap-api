name: MBTI W1 English Comparison Publish Live QA

on:
  workflow_dispatch:
    inputs:
      expected_control_plane_sha:
        description: Exact main SHA containing this controlled publish executor
        required: true
        type: string
      expected_active_revision:
        description: Exact deployed runtime SHA approved for English projection live QA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mbti-w1-comparison-english-publish-live-qa
  cancel-in-progress: false

jobs:
  controlled-publish-live-qa:
    name: Publish seven exact English comparisons and verify noindex projection
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout exact control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.expected_control_plane_sha }}
          fetch-depth: 1

      - name: Verify immutable approval and control-plane contract
        shell: bash
        env:
          EXPECTED_CONTROL_PLANE_SHA: ${{ inputs.expected_control_plane_sha }}
          EXPECTED_ACTIVE_REVISION: ${{ inputs.expected_active_revision }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$EXPECTED_CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_ACTIVE_REVISION" = 660280d00a57e58bd8bc76608e19de2492c03f53
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_CONTROL_PLANE_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_CONTROL_PLANE_SHA"
          printf '%s  %s\n' \
            3a9a929dcfecc64a02d40453540a0d0ad71c002f10304d8d544c597f808a3f1c backend/content_assets/en-content-parity/CONTROL-approvals/W1-MBTI-COMPARISONS/publish-live-approval-2026-08-01.json \
            | sha256sum -c -
          jq -e '
            .artifact_kind == "controlled_transition_approval" and
            .approval_owner == "human_operator" and
            .subscope_id == "W1-MBTI-COMPARISONS" and
            .package_sha256 == "deecc8175fb43ba3730d6513b496a0ab6834459108e3b24e25550bbf40e001a2" and
            .target_authority_receipt_sha256 == "b44e50a252f48d85ca93f572f4bf5ee7f334d6155a19713cfd3c8185359edae8" and
            .gate == "published" and .verdict == "APPROVED" and
            .permissions.publish_authorized == true and
            .permissions.target_authority_readback_authorized == true and
            .permissions.activation_authorized == false and
            .permissions.active_pointer_authorized == false and
            .permissions.indexability_authorized == false and
            .permissions.sitemap_authorized == false and
            .permissions.hreflang_authorized == false and
            .permissions.llms_authorized == false and
            .permissions.json_ld_authorized == false and
            .permissions.search_submission_authorized == false and
            .permissions.deployment_authorized == false and
            .permissions.private_result_read_authorized == false and
            .permissions.attempt_report_order_payment_read_authorized == false
          ' backend/content_assets/en-content-parity/CONTROL-approvals/W1-MBTI-COMPARISONS/publish-live-approval-2026-08-01.json >/dev/null

      - name: Set up pinned production SSH identity
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known hosts
        shell: bash
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS"
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null || ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f ~/.ssh/known_hosts >/dev/null

      - name: Execute exact publish and live QA without deployment
        shell: bash
        env:
          DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
          CONTROL_PLANE_SHA: ${{ inputs.expected_control_plane_sha }}
          ACTIVE_REVISION: ${{ inputs.expected_active_revision }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ && "$DEPLOY_PATH" != *".."* ]]
          run_dir="/tmp/mbti-w1-comparison-english-publish-${GITHUB_RUN_ID}"
          bundle="$RUNNER_TEMP/mbti-w1-comparison-english-publish-input.tgz"
          tar -C "$GITHUB_WORKSPACE" -czf "$bundle" \
            backend/scripts/mbti_comparison_english_publish_live_qa.php \
            backend/app/Services/Cms/MbtiComparisonEnglishPublishService.php \
            backend/content_assets/en-content-parity/CONTROL-approvals/W1-MBTI-COMPARISONS/publish-live-approval-2026-08-01.json
          scp -P "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$bundle" "$DEPLOY_USER@$DEPLOY_HOST:$run_dir.tgz"
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' RUN_DIR='$run_dir' CONTROL_PLANE_SHA='$CONTROL_PLANE_SHA' ACTIVE_REVISION='$ACTIVE_REVISION' bash -s" <<'REMOTE'
          set -euo pipefail
          current="$(readlink -f "$DEPLOY_PATH/current")"
          test -d "$current/backend"
          test -f "$current/REVISION"
          test "$(tr -d '\r\n' < "$current/REVISION")" = "$ACTIVE_REVISION"
          test ! -e "$DEPLOY_PATH/.dep/deploy.lock"
          mkdir -p "$RUN_DIR/input" "$RUN_DIR/receipts"
          tar -xzf "$RUN_DIR.tgz" -C "$RUN_DIR/input"
          set +e
          php "$RUN_DIR/input/backend/scripts/mbti_comparison_english_publish_live_qa.php" \
            --backend-root="$current/backend" \
            --source-backend-root="$RUN_DIR/input/backend" \
            --receipt-dir="$RUN_DIR/receipts" \
            --control-plane-sha="$CONTROL_PLANE_SHA" \
            --active-revision="$ACTIVE_REVISION" \
            >"$RUN_DIR/executor.stdout" 2>"$RUN_DIR/executor.stderr"
          executor_status=$?
          set -e
          if [ "$executor_status" -ne 0 ]; then
            printf '%s\n' 'comparison_english_publish_live_qa_failed' >&2
            exit "$executor_status"
          fi
          jq -e '.status == "PASS" and .row_count == 7 and .publish_attempted == true and .activation_attempted == false and .active_pointer_changed == false and .indexability_attempted == false and .sitemap_attempted == false and .llms_attempted == false and .deploy_attempted == false and .runtime_live_qa.exact_row_count == 7 and .runtime_live_qa.meta_robots == "noindex,follow" and .runtime_live_qa.sitemap_excluded == true and .runtime_live_qa.llms_withheld == true' "$RUN_DIR/receipts/comparison-english-publish-live-qa-receipt.json" >/dev/null
          REMOTE
          mkdir -p "$RUNNER_TEMP/mbti-w1-comparison-english-publish-receipts"
          scp -r -P "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST:$run_dir/receipts/." "$RUNNER_TEMP/mbti-w1-comparison-english-publish-receipts/"

      - name: Publish immutable live-QA receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mbti-w1-comparison-english-publish-live-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mbti-w1-comparison-english-publish-receipts
          if-no-files-found: warn
          retention-days: 90
