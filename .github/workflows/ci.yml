              and .technical_diagnosis.dependency_mode == "OFFLINE_FIXTURE"
              and .technical_diagnosis.closeout_state == "CANDIDATE_READY"
              and .technical_diagnosis.candidate_sha == $sha and .technical_diagnosis.observed_active_sha == null
              and .technical_diagnosis."SEO-PLATFORM-11E" == "HOLD" and .technical_diagnosis.ready_for_11F == false
              and .technical_diagnosis.fixture_metrics.false_positive == 0
