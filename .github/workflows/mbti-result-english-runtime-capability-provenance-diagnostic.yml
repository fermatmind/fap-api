name: MBTI W1 English Result Runtime Capability Stdout Provenance Diagnostic

on:
  workflow_dispatch:
    inputs:
      expected_control_plane_sha:
        description: Exact latest main SHA containing this read-only diagnostic control
        required: true
        type: string
      expected_active_revision:
        description: Exact active production application SHA to inspect without mutation
        required: true
        type: string
      expected_approval_sha:
        description: Exact human-operator provenance-diagnostic approval SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mbti-w1-result-runtime-capability-provenance-diagnostic
  cancel-in-progress: false

jobs:
  read-only-stdout-provenance-diagnostic:
    name: Diagnose exact result preflight stdout provenance without mutation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout exact control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.expected_control_plane_sha }}
          fetch-depth: 1

      - name: Verify immutable diagnostic inputs
        shell: bash
        env:
          EXPECTED_CONTROL_PLANE_SHA: ${{ inputs.expected_control_plane_sha }}
          EXPECTED_ACTIVE_REVISION: ${{ inputs.expected_active_revision }}
          EXPECTED_APPROVAL_SHA: ${{ inputs.expected_approval_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$EXPECTED_CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_ACTIVE_REVISION" = 660280d00a57e58bd8bc76608e19de2492c03f53
          test "$EXPECTED_APPROVAL_SHA" = 31681314c75d04c9670e8f013362f609d02e2a053cbbff7977e5b5fa5a41e92b
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_CONTROL_PLANE_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_CONTROL_PLANE_SHA"
          printf '%s  %s\n' \
            31681314c75d04c9670e8f013362f609d02e2a053cbbff7977e5b5fa5a41e92b backend/content_assets/en-content-parity/CONTROL-approvals/W1-MBTI-RESULT-CONTENT/runtime-capability-provenance-diagnostic-approval-2026-08-02.json \
            | sha256sum -c -
          jq -e '
            .artifact_kind == "controlled_transition_approval" and
            .schema_version == "fermatmind.en_content_parity_controlled_transition_approval.v1" and
            .control_id == "EN-PARITY-W1-MBTI-RESULT-RUNTIME-CAPABILITY-PROVENANCE-DIAGNOSTIC-01" and
            .approval_owner == "human_operator" and
            .subscope_id == "W1-MBTI-RESULT-CONTENT" and
            .package_sha256 == "9325013b870fd2496efc0882656240f91ce28ff4faaf1da42fb3dde3577b0ed3" and
            .target_authority_receipt_sha256 == "f093096ff881bfabc633407d51ee01061dc17b9dbc43da41dc03ae7881b13756" and
            .target_manifest_sha256 == "649a61633a05728618477b97036718c582673c96a82c24d142287991b3d2d0e1" and
            .active_runtime_revision == "660280d00a57e58bd8bc76608e19de2492c03f53" and
            .gate == "runtime_capability_provenance_diagnostic" and .verdict == "APPROVED" and
            .permissions.target_authority_readback_authorized == true and
            .permissions.runtime_projection_readback_authorized == true and
            .permissions.publish_authorized == false and .permissions.activation_authorized == false and
            .permissions.active_pointer_authorized == false and .permissions.indexability_authorized == false and
            .permissions.sitemap_authorized == false and .permissions.hreflang_authorized == false and
            .permissions.llms_authorized == false and .permissions.json_ld_authorized == false and
            .permissions.search_submission_authorized == false and .permissions.deployment_authorized == false and
            .permissions.private_result_read_authorized == false and .permissions.attempt_report_order_payment_read_authorized == false
          ' backend/content_assets/en-content-parity/CONTROL-approvals/W1-MBTI-RESULT-CONTENT/runtime-capability-provenance-diagnostic-approval-2026-08-02.json >/dev/null

      - name: Set up pinned production SSH identity
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known hosts
        shell: bash
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS"
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null || ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f ~/.ssh/known_hosts >/dev/null

      - name: Execute one read-only stdout provenance diagnostic
        shell: bash
        env:
          DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
          CONTROL_PLANE_SHA: ${{ inputs.expected_control_plane_sha }}
          ACTIVE_REVISION: ${{ inputs.expected_active_revision }}
          APPROVAL_SHA: ${{ inputs.expected_approval_sha }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ && "$DEPLOY_PATH" != *".."* ]]
          receipt_path="$RUNNER_TEMP/mbti-result-english-runtime-capability-provenance-diagnostic.json"
          candidate_receipt_path="$RUNNER_TEMP/mbti-result-english-runtime-capability-provenance-diagnostic.candidate.json"
          emit_runner_failure_receipt() {
            jq -n --arg stage "$1" --arg error_code "$2" --arg control_plane_sha "$CONTROL_PLANE_SHA" --arg active_revision "$ACTIVE_REVISION" --arg approval_sha "$APPROVAL_SHA" '{artifact:"EN-PARITY-W1-MBTI-RESULT-RUNTIME-CAPABILITY-PROVENANCE-DIAGNOSTIC-RECEIPT",schema_version:"fermatmind.en_parity.result_runtime_capability_provenance_diagnostic_receipt.v1",status:"BLOCKED",ok:false,mode:"controlled_read_only_runtime_capability_provenance_diagnostic",read_only:true,stage:$stage,error_code:$error_code,control_plane_sha:$control_plane_sha,active_revision:$active_revision,approval_sha256:$approval_sha,cms_write_attempted:false,publish_attempted:false,activation_attempted:false,active_pointer_changed:false,indexability_attempted:false,sitemap_attempted:false,hreflang_attempted:false,llms_attempted:false,json_ld_attempted:false,search_submission_attempted:false,deploy_attempted:false,private_authority_read_attempted:false,attempt_report_order_payment_read_attempted:false,probes:[]}' > "$receipt_path"
          }
          bundle="$RUNNER_TEMP/mbti-result-english-runtime-capability-provenance-diagnostic-input.tgz"
          tar -C "$GITHUB_WORKSPACE" -czf "$bundle" \
            backend/app/Services/Cms/MbtiResultEnglishRuntimeCapabilityPreflightService.php \
            backend/scripts/mbti_result_english_runtime_capability_preflight.php \
            backend/content_assets/en-content-parity/CONTROL-approvals/W1-MBTI-RESULT-CONTENT/runtime-capability-preflight-approval-2026-08-02.json \
            backend/content_assets/en-content-parity/CONTROL-approvals/W1-MBTI-RESULT-CONTENT/runtime-capability-provenance-diagnostic-approval-2026-08-02.json
          run_dir="/tmp/mbti-w1-result-runtime-capability-provenance-${GITHUB_RUN_ID}"
          if ! scp -P "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$bundle" "$DEPLOY_USER@$DEPLOY_HOST:$run_dir.tgz"; then
            emit_runner_failure_receipt remote_transport_or_bootstrap_failed remote_transport_or_bootstrap_failed
            exit 1
          fi
          set +e
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' RUN_DIR='$run_dir' CONTROL_PLANE_SHA='$CONTROL_PLANE_SHA' ACTIVE_REVISION='$ACTIVE_REVISION' APPROVAL_SHA='$APPROVAL_SHA' bash -s" > "$candidate_receipt_path" 2>"$RUNNER_TEMP/mbti-result-runtime-provenance.stderr" <<'REMOTE'
          set -euo pipefail
          current="$(readlink -f "$DEPLOY_PATH/current")"
          test -d "$current/backend"
          test -f "$current/REVISION"
          test "$(tr -d '\r\n' < "$current/REVISION")" = "$ACTIVE_REVISION"
          test ! -e "$DEPLOY_PATH/.dep/deploy.lock"
          trap 'rm -rf "$RUN_DIR" "$RUN_DIR.tgz"' EXIT
          mkdir -p "$RUN_DIR/input"
          tar -xzf "$RUN_DIR.tgz" -C "$RUN_DIR/input"
          cat > "$RUN_DIR/bootstrap-probe.php" <<'PHP'
          <?php
          declare(strict_types=1);
          require getenv('DEPLOYED_BACKEND_ROOT').'/vendor/autoload.php';
          $app = require getenv('DEPLOYED_BACKEND_ROOT').'/bootstrap/app.php';
          $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          PHP
          cat > "$RUN_DIR/service-probe.php" <<'PHP'
          <?php
          declare(strict_types=1);
          require getenv('DEPLOYED_BACKEND_ROOT').'/vendor/autoload.php';
          require getenv('SOURCE_BACKEND_ROOT').'/app/Services/Cms/MbtiResultEnglishRuntimeCapabilityPreflightService.php';
          $app = require getenv('DEPLOYED_BACKEND_ROOT').'/bootstrap/app.php';
          $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $app->make(\App\Services\Cms\MbtiResultEnglishRuntimeCapabilityPreflightService::class)->inspect(
              getenv('SOURCE_BACKEND_ROOT').'/content_assets/en-content-parity/CONTROL-approvals/W1-MBTI-RESULT-CONTENT/runtime-capability-preflight-approval-2026-08-02.json',
              '7d20ee867a1a2eb0f69d0d3a4441615690d836f3e8f3a47222b6dfb43f6c5a3b',
          );
          PHP
          probe_records="$RUN_DIR/probes.ndjson"
          : > "$probe_records"
          run_probe() {
            local name="$1"
            shift
            local stdout_path="$RUN_DIR/$name.stdout"
            local stderr_path="$RUN_DIR/$name.stderr"
            set +e
            "$@" > "$stdout_path" 2> "$stderr_path"
            local exit_status=$?
            set -e
            local stdout_bytes newline_count stdout_sha256 json_document_count json_valid classification receipt_valid
            stdout_bytes="$(wc -c < "$stdout_path" | tr -d '[:space:]')"
            newline_count="$(wc -l < "$stdout_path" | tr -d '[:space:]')"
            stdout_sha256="$(sha256sum "$stdout_path" | awk '{print $1}')"
            json_document_count=0
            json_valid=false
            receipt_valid=false
            if jq -e -s 'type == "array"' "$stdout_path" >/dev/null 2>&1; then
              json_document_count="$(jq -s 'length' "$stdout_path")"
              json_valid=true
            fi
            if [ "$exit_status" -ne 0 ]; then
              classification=probe_failed
            elif [ "$stdout_bytes" = 0 ]; then
              classification=empty
            elif [ "$json_valid" = true ] && [ "$json_document_count" -gt 1 ]; then
              classification=multiple_json_documents
            elif [ "$name" = bootstrap ]; then
              classification=bootstrap_stdout_observed
            elif [ "$name" = service ]; then
              classification=runtime_stdout_observed
            elif jq -e -s --arg control_plane_sha "$CONTROL_PLANE_SHA" --arg active_revision "$ACTIVE_REVISION" '
              length == 1 and (.[0] | .artifact == "EN-PARITY-W1-MBTI-RESULT-RUNTIME-CAPABILITY-PREFLIGHT-RECEIPT" and .schema_version == "fermatmind.en_parity.result_runtime_capability_preflight_receipt.v1" and .mode == "controlled_read_only_runtime_capability_preflight" and .read_only == true and .control_plane_sha == $control_plane_sha and .active_revision == $active_revision)
            ' "$stdout_path" >/dev/null 2>&1; then
              classification=null
              receipt_valid=true
            else
              classification=single_json_contract_mismatch
            fi
            jq -nc --arg name "$name" --arg classification "$classification" --arg stdout_sha256 "$stdout_sha256" --argjson exit_status "$exit_status" --argjson stdout_bytes "$stdout_bytes" --argjson newline_count "$newline_count" --argjson json_document_count "$json_document_count" --argjson json_valid "$json_valid" --argjson receipt_valid "$receipt_valid" '{name:$name,exit_status:$exit_status,stdout_bytes:$stdout_bytes,newline_count:$newline_count,json_document_count:$json_document_count,json_valid:$json_valid,stdout_sha256:$stdout_sha256,classification:(if $classification == "null" then null else $classification end),receipt_valid:$receipt_valid}' >> "$probe_records"
          }
          run_probe bootstrap env DEPLOYED_BACKEND_ROOT="$current/backend" php -d display_errors=0 -d log_errors=0 "$RUN_DIR/bootstrap-probe.php"
          run_probe service env DEPLOYED_BACKEND_ROOT="$current/backend" SOURCE_BACKEND_ROOT="$RUN_DIR/input/backend" php -d display_errors=0 -d log_errors=0 "$RUN_DIR/service-probe.php"
          run_probe executor php -d display_errors=0 -d log_errors=0 "$RUN_DIR/input/backend/scripts/mbti_result_english_runtime_capability_preflight.php" --backend-root="$current/backend" --source-backend-root="$RUN_DIR/input/backend" --control-plane-sha="$CONTROL_PLANE_SHA" --active-revision="$ACTIVE_REVISION"
          probes="$(jq -s '.' "$probe_records")"
          if jq -e 'any(.[]; .classification != null)' <<< "$probes" >/dev/null; then
            status=BLOCKED
            ok=false
            error_code=stdout_provenance_observed
          else
            status=PASS
            ok=true
            error_code=null
          fi
          jq -nc --arg status "$status" --argjson ok "$ok" --arg error_code "$error_code" --arg control_plane_sha "$CONTROL_PLANE_SHA" --arg active_revision "$ACTIVE_REVISION" --arg approval_sha "$APPROVAL_SHA" --argjson probes "$probes" '{artifact:"EN-PARITY-W1-MBTI-RESULT-RUNTIME-CAPABILITY-PROVENANCE-DIAGNOSTIC-RECEIPT",schema_version:"fermatmind.en_parity.result_runtime_capability_provenance_diagnostic_receipt.v1",status:$status,ok:$ok,mode:"controlled_read_only_runtime_capability_provenance_diagnostic",read_only:true,stage:"stdout_provenance_diagnostic",error_code:(if $error_code == "null" then null else $error_code end),control_plane_sha:$control_plane_sha,active_revision:$active_revision,approval_sha256:$approval_sha,cms_write_attempted:false,publish_attempted:false,activation_attempted:false,active_pointer_changed:false,indexability_attempted:false,sitemap_attempted:false,hreflang_attempted:false,llms_attempted:false,json_ld_attempted:false,search_submission_attempted:false,deploy_attempted:false,private_authority_read_attempted:false,attempt_report_order_payment_read_attempted:false,probes:$probes}'
          REMOTE
          remote_status=$?
          set -e
          if [ "$remote_status" -ne 0 ]; then
            emit_runner_failure_receipt remote_transport_or_bootstrap_failed remote_transport_or_bootstrap_failed
            exit 1
          fi
          if ! test -s "$candidate_receipt_path" || ! jq -e -s --arg control_plane_sha "$CONTROL_PLANE_SHA" --arg active_revision "$ACTIVE_REVISION" --arg approval_sha "$APPROVAL_SHA" '
            length == 1 and (.[0] |
              .artifact == "EN-PARITY-W1-MBTI-RESULT-RUNTIME-CAPABILITY-PROVENANCE-DIAGNOSTIC-RECEIPT" and
              .schema_version == "fermatmind.en_parity.result_runtime_capability_provenance_diagnostic_receipt.v1" and
              (.status == "PASS" or .status == "BLOCKED") and
              .mode == "controlled_read_only_runtime_capability_provenance_diagnostic" and .read_only == true and
              .control_plane_sha == $control_plane_sha and .active_revision == $active_revision and .approval_sha256 == $approval_sha and
              .cms_write_attempted == false and .publish_attempted == false and .activation_attempted == false and .active_pointer_changed == false and
              .indexability_attempted == false and .sitemap_attempted == false and .hreflang_attempted == false and .llms_attempted == false and
              .json_ld_attempted == false and .search_submission_attempted == false and .deploy_attempted == false and
              .private_authority_read_attempted == false and .attempt_report_order_payment_read_attempted == false and
              (.probes | type == "array" and length == 3 and all(.[]; (. | keys | sort) == ["classification","exit_status","json_document_count","json_valid","name","newline_count","receipt_valid","stdout_bytes","stdout_sha256"]))
            )
          ' "$candidate_receipt_path" >/dev/null; then
            emit_runner_failure_receipt runner_receipt_contract_failed runner_receipt_contract_failed
            exit 1
          fi
          mv "$candidate_receipt_path" "$receipt_path"
          if jq -e '.status == "BLOCKED"' "$receipt_path" >/dev/null; then
            exit 1
          fi

      - name: Publish immutable read-only provenance receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mbti-w1-result-english-runtime-capability-provenance-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mbti-result-english-runtime-capability-provenance-diagnostic.json
          if-no-files-found: warn
          retention-days: 90
