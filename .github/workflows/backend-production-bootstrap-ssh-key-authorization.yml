name: Backend Production Bootstrap SSH Key Authorization

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Strict zero-write preflight or separately approved apply
        required: true
        type: choice
        options:
          - preflight
          - apply
      expected_control_plane_sha:
        description: Exact latest main SHA containing this control
        required: true
        type: string
      expected_active_revision:
        description: Exact active backend production revision
        required: true
        type: string
      failed_bootstrap_run_id:
        description: Failed v2 root-bootstrap preflight run ID
        required: true
        type: string
      failed_bootstrap_run_attempt:
        description: Failed v2 root-bootstrap preflight run attempt
        required: true
        type: string
      failed_bootstrap_receipt_sha256:
        description: Failed v2 root-bootstrap receipt SHA256
        required: true
        type: string
      failed_bootstrap_control_plane_sha:
        description: Failed v2 root-bootstrap control-plane SHA
        required: true
        type: string
      key_preflight_run_id:
        description: Apply only - SSH key authorization preflight run ID
        required: false
        type: string
      key_preflight_run_attempt:
        description: Apply only - SSH key authorization preflight run attempt
        required: false
        type: string
      key_preflight_receipt_sha256:
        description: Apply only - SSH key authorization preflight receipt SHA256
        required: false
        type: string
      operator_approval_phrase:
        description: Apply only - exact receipt-bound authorized_keys approval
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-${{ github.repository }}-production
  cancel-in-progress: false

jobs:
  control:
    name: Preflight or apply exact bootstrap SSH key authorization
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      MODE: ${{ inputs.mode }}
      EXPECTED_CONTROL_PLANE_SHA: ${{ inputs.expected_control_plane_sha }}
      EXPECTED_ACTIVE_REVISION: ${{ inputs.expected_active_revision }}
      FAILED_BOOTSTRAP_RUN_ID: ${{ inputs.failed_bootstrap_run_id }}
      FAILED_BOOTSTRAP_RUN_ATTEMPT: ${{ inputs.failed_bootstrap_run_attempt }}
      FAILED_BOOTSTRAP_RECEIPT_SHA256: ${{ inputs.failed_bootstrap_receipt_sha256 }}
      FAILED_BOOTSTRAP_CONTROL_PLANE_SHA: ${{ inputs.failed_bootstrap_control_plane_sha }}
      KEY_PREFLIGHT_RUN_ID: ${{ inputs.key_preflight_run_id }}
      KEY_PREFLIGHT_RUN_ATTEMPT: ${{ inputs.key_preflight_run_attempt }}
      KEY_PREFLIGHT_RECEIPT_SHA256: ${{ inputs.key_preflight_receipt_sha256 }}
      OPERATOR_APPROVAL_PHRASE: ${{ inputs.operator_approval_phrase }}
      BOOTSTRAP_SSH_USER: ${{ secrets.PRODUCTION_ROOT_BOOTSTRAP_SSH_USER }}
      BOOTSTRAP_PASSWORD: ${{ secrets.PRODUCTION_ROOT_BOOTSTRAP_SUDO_PASSWORD }}
      DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
      DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
      DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}

    steps:
      - name: Initialize sanitized failure receipt
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/backend-production-bootstrap-ssh-key-authorization.json"
          jq -n \
            --arg mode "$MODE" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg control "$EXPECTED_CONTROL_PLANE_SHA" \
            --arg active "$EXPECTED_ACTIVE_REVISION" \
            --arg source_run "$FAILED_BOOTSTRAP_RUN_ID" \
            --arg source_attempt "$FAILED_BOOTSTRAP_RUN_ATTEMPT" \
            --arg source_receipt "$FAILED_BOOTSTRAP_RECEIPT_SHA256" \
            --arg source_control "$FAILED_BOOTSTRAP_CONTROL_PLANE_SHA" \
            '{
              schema_version: "backend.production_bootstrap_ssh_key_authorization.v2",
              mode: $mode,
              status: "FAIL_SSH_KEY_AUTHORIZATION_INITIALIZATION",
              failed_stage: "initialize",
              run_id: $run_id,
              run_attempt: $run_attempt,
              control_plane_sha: $control,
              active_revision: $active,
              failed_bootstrap: {
                run_id: $source_run,
                run_attempt: $source_attempt,
                receipt_sha256: $source_receipt,
                control_plane_sha: $source_control
              },
              target_user_sha256: ("0" * 64),
              public_key_sha256: ("0" * 64),
              public_key_fingerprint: "UNAVAILABLE",
              authorized_keys_sha256_before: ("0" * 64),
              authorized_keys_sha256_after: ("0" * 64),
              authorized_keys_state: "UNKNOWN",
              authorized_key_count_before: 0,
              authorized_key_count_after: 0,
              target_key_present_before: false,
              target_key_present_after: false,
              password_ssh_tested: false,
              password_ssh_accepted: false,
              exact_key_login_tested: false,
              exact_key_login_accepted: false,
              key_ssh_authorized_after: false,
              target_key_count_before: 0,
              target_key_count_after: 0,
              candidate_created: false,
              candidate_cleanup_attempted: false,
              candidate_absent_after: true,
              candidate_identity_rechecked: false,
              apply_eligible: false,
              secret_retirement_required: true,
              write_state: "NOT_ATTEMPTED",
              production_write_execution: false,
              authorized_keys_write_count: 0,
              remote_temp_file_write_count: 0,
              ssh_config_write_count: 0,
              service_restart_count: 0,
              deploy_count: 0,
              database_or_cms_write_count: 0,
              warm_or_publication_count: 0,
              discoverability_write_count: 0,
              writes_committed: false,
              checks: {
                target_identity_match: false,
                active_revision_match: false,
                deploy_lock_absent: false,
                deploy_like_process_count: 0,
                home_safe: false,
                ssh_directory_safe: false,
                authorized_keys_safe: false,
                authorized_keys_ends_with_lf: false,
                authorized_keys_size: 0,
                authorized_keys_nlink: 0,
                same_filesystem: false,
                existing_key_login_rejected: false
              }
            }' > "$receipt"

      - name: Check out exact main control plane
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0

      - name: Validate latest main and failed bootstrap receipt chain
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$MODE" = preflight || test "$MODE" = apply
          [[ "$EXPECTED_CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_ACTIVE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$FAILED_BOOTSTRAP_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$FAILED_BOOTSTRAP_CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$FAILED_BOOTSTRAP_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$FAILED_BOOTSTRAP_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          git fetch --no-tags origin main
          test "$GITHUB_SHA" = "$EXPECTED_CONTROL_PLANE_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_CONTROL_PLANE_SHA"

          source_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_BOOTSTRAP_RUN_ID}")"
          jq -e \
            --arg attempt "$FAILED_BOOTSTRAP_RUN_ATTEMPT" \
            --arg control "$FAILED_BOOTSTRAP_CONTROL_PLANE_SHA" \
            '.name == "Backend Production Supervisor Root Bootstrap"
             and .path == ".github/workflows/backend-production-supervisor-root-bootstrap.yml"
             and .event == "workflow_dispatch"
             and .status == "completed"
             and .conclusion == "failure"
             and (.run_attempt | tostring) == $attempt
             and .head_sha == $control' <<<"$source_run" >/dev/null
          source_dir="$(mktemp -d)"
          gh run download "$FAILED_BOOTSTRAP_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "backend-production-supervisor-root-bootstrap-preflight-${FAILED_BOOTSTRAP_RUN_ID}-${FAILED_BOOTSTRAP_RUN_ATTEMPT}" \
            --dir "$source_dir"
          source_receipt="$source_dir/backend-production-supervisor-root-bootstrap.json"
          test -f "$source_receipt"
          test "$(sha256sum "$source_receipt" | awk '{print $1}')" = "$FAILED_BOOTSTRAP_RECEIPT_SHA256"
          jq -e \
            --arg run "$FAILED_BOOTSTRAP_RUN_ID" \
            --arg attempt "$FAILED_BOOTSTRAP_RUN_ATTEMPT" \
            --arg control "$FAILED_BOOTSTRAP_CONTROL_PLANE_SHA" \
            --arg active "$EXPECTED_ACTIVE_REVISION" \
            '.schema_version == "backend.production_supervisor_root_bootstrap.v2"
             and .mode == "preflight"
             and .status == "FAIL_ROOT_BOOTSTRAP_BOOTSTRAP_SSH"
             and .failed_stage == "bootstrap_ssh"
             and .run_id == $run
             and .run_attempt == $attempt
             and .control_plane_sha == $control
             and .active_revision == $active
             and .credential_present == true
             and .credential_tested == false
             and .production_write_execution == false
             and .sudoers_rule_write_count == 0
             and .remote_temp_file_write_count == 0
             and .writes_committed == false' "$source_receipt" >/dev/null
          rm -rf "$source_dir"

      - name: Start pinned existing production SSH agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Validate protected password and derive exact existing public key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BOOTSTRAP_SSH_USER"
          [[ "$BOOTSTRAP_SSH_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]]
          test -n "$BOOTSTRAP_PASSWORD"
          test "${BOOTSTRAP_PASSWORD//$'\n'/}" = "$BOOTSTRAP_PASSWORD"
          test -n "$DEPLOY_HOST"
          [[ "$DEPLOY_PORT" =~ ^[1-9][0-9]{0,4}$ ]]
          (( DEPLOY_PORT <= 65535 ))
          [[ "$DEPLOY_PATH" = /* ]]
          test "${DEPLOY_PATH//$'\n'/}" = "$DEPLOY_PATH"
          test -n "$SSH_KNOWN_HOSTS"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          chmod 600 "$RUNNER_TEMP/known_hosts"
          ssh-add -L > "$RUNNER_TEMP/production-key.pub"
          .github/scripts/normalize-single-ssh-public-key.sh \
            < "$RUNNER_TEMP/production-key.pub" > "$RUNNER_TEMP/normalized-key.pub"
          test "$(wc -l < "$RUNNER_TEMP/normalized-key.pub" | tr -d ' ')" = 1
          key_sha="$(sha256sum "$RUNNER_TEMP/normalized-key.pub" | awk '{print $1}')"
          fingerprint="$(ssh-keygen -lf "$RUNNER_TEMP/normalized-key.pub" -E sha256 | awk '{print $2}')"
          [[ "$key_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$fingerprint" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]
          printf 'PUBLIC_KEY_SHA256=%s\n' "$key_sha" >> "$GITHUB_ENV"
          printf 'PUBLIC_KEY_FINGERPRINT=%s\n' "$fingerprint" >> "$GITHUB_ENV"
          echo "Protected password and exact existing SSH public-key fingerprint are available."

      - name: Prepare password-only bootstrap SSH transport
        shell: bash
        run: |
          set -euo pipefail
          askpass="$RUNNER_TEMP/bootstrap-askpass"
          cat > "$askpass" <<'ASKPASS'
          #!/usr/bin/env bash
          printf '%s\n' "$BOOTSTRAP_PASSWORD"
          ASKPASS
          chmod 700 "$askpass"
          printf 'BOOTSTRAP_ASKPASS=%s\n' "$askpass" >> "$GITHUB_ENV"

      - name: Run strict zero-write authorized_keys preflight
        if: ${{ inputs.mode == 'preflight' }}
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/backend-production-bootstrap-ssh-key-authorization.json"
          zero_sha="$(printf '0%.0s' {1..64})"
          target_expected_sha="$(printf '%s' "$BOOTSTRAP_SSH_USER" | sha256sum | awk '{print $1}')"
          deploy_path_b64="$(printf '%s' "$DEPLOY_PATH" | base64 -w0)"
          ssh_base=(ssh -F /dev/null -o BatchMode=no -o PubkeyAuthentication=no -o KbdInteractiveAuthentication=no -o PreferredAuthentications=password -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o ConnectTimeout=10 -p "$DEPLOY_PORT" "$BOOTSTRAP_SSH_USER@$DEPLOY_HOST")

          set +e
          export SSH_ASKPASS="$BOOTSTRAP_ASKPASS" SSH_ASKPASS_REQUIRE=force DISPLAY=:0
          password_result="$(setsid -w "${ssh_base[@]}" \
              "bash -s -- '$deploy_path_b64' '$EXPECTED_ACTIVE_REVISION' '$PUBLIC_KEY_SHA256' '$PUBLIC_KEY_FINGERPRINT'" 2>/dev/null <<'REMOTE'
          set -u
          DEPLOY_PATH="$(printf '%s' "$1" | base64 -d)"; EXPECTED_ACTIVE_REVISION="$2"; TARGET_KEY_SHA="$3"; TARGET_KEY_FINGERPRINT="$4"
          actor_sha="$(printf '%s' "$(id -un)" | sha256sum | awk '{print $1}')"
          home_dir="$(getent passwd "$(id -un)" | cut -d: -f6)"
          home_safe=false; ssh_dir_safe=false; authorized_keys_safe=false; authorized_keys_ends_with_lf=false; same_filesystem=false
          authorized_keys_state=UNKNOWN; authorized_keys_sha="$(printf '0%.0s' {1..64})"
          key_count=0; target_count=0; active_match=false; lock_absent=false; deploy_process_count=0; auth_size=0; auth_nlink=0
          if [ -n "$home_dir" ] && [ -d "$home_dir" ] && [ ! -L "$home_dir" ] && [ "$(stat -Lc '%U' "$home_dir" 2>/dev/null)" = "$(id -un)" ]; then
            home_mode="$(stat -Lc '%a' "$home_dir")"
            if [[ "$home_mode" =~ ^[0-7]{3,4}$ ]] && (( (8#$home_mode & 0100) != 0 )) && (( (8#$home_mode & 0022) == 0 )) && [ -x "$home_dir" ]; then home_safe=true; fi
          fi
          ssh_dir="$home_dir/.ssh"; auth="$ssh_dir/authorized_keys"
          if [ -d "$ssh_dir" ] && [ ! -L "$ssh_dir" ] && [ "$(stat -Lc '%U' "$ssh_dir" 2>/dev/null)" = "$(id -un)" ]; then
            ssh_mode="$(stat -Lc '%a' "$ssh_dir")"
            if [[ "$ssh_mode" =~ ^[0-7]{3,4}$ ]] && (( (8#$ssh_mode & 0700) == 0700 )) && (( (8#$ssh_mode & 0077) == 0 )) && [ -r "$ssh_dir" ] && [ -w "$ssh_dir" ] && [ -x "$ssh_dir" ]; then ssh_dir_safe=true; fi
          fi
          ssh_dev="$(stat -Lc '%d' "$ssh_dir" 2>/dev/null || true)"
          if [ "$ssh_dir_safe" = true ] && [ ! -e "$auth" ] && [ ! -L "$auth" ]; then
            authorized_keys_state=ABSENT; authorized_keys_safe=true; authorized_keys_ends_with_lf=true; same_filesystem=true
          elif [ "$ssh_dir_safe" = true ] && [ -f "$auth" ] && [ ! -L "$auth" ] && [ -r "$auth" ] && [ "$(stat -Lc '%U' "$auth" 2>/dev/null)" = "$(id -un)" ]; then
            auth_mode="$(stat -Lc '%a' "$auth")"
            auth_size="$(stat -Lc '%s' "$auth" 2>/dev/null || printf invalid)"; auth_nlink="$(stat -Lc '%h' "$auth" 2>/dev/null || printf invalid)"; auth_dev="$(stat -Lc '%d' "$auth" 2>/dev/null || true)"
            if [[ "$auth_mode" =~ ^[0-7]{3,4}$ ]] && (( (8#$auth_mode & 0022) == 0 )) && [[ "$auth_size" =~ ^[0-9]+$ ]] && (( auth_size <= 1048576 )) && [ "$auth_nlink" = 1 ] && [ -n "$ssh_dev" ] && [ "$auth_dev" = "$ssh_dev" ]; then
              authorized_keys_state=PRESENT; authorized_keys_safe=true; same_filesystem=true
              authorized_keys_sha="$(sha256sum "$auth" | awk '{print $1}')"
              if [ "$auth_size" -eq 0 ] || [ "$(tail -c 1 "$auth" | od -An -t x1 | tr -d ' \n')" = 0a ]; then authorized_keys_ends_with_lf=true; fi
              while IFS= read -r line || [ -n "$line" ]; do
                trimmed="${line#"${line%%[![:space:]]*}"}"
                [ -n "$trimmed" ] || continue
                [[ "$trimmed" = \#* ]] && continue
                if [[ ! "$trimmed" =~ ^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp(256|384|521))[[:space:]]+ ]] && \
                   [[ ! "$trimmed" =~ ^(cert-authority|restrict|no-agent-forwarding|no-port-forwarding|no-pty|no-user-rc|no-X11-forwarding|command=|environment=|expiry-time=|from=|permitlisten=|permitopen=|principals=|tunnel=)[^[:cntrl:]]*[[:space:]]+(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp(256|384|521))[[:space:]]+ ]]; then
                  authorized_keys_safe=false
                  continue
                fi
                fingerprint="$(printf '%s\n' "$line" | ssh-keygen -lf /dev/stdin -E sha256 2>/dev/null | awk 'NR==1{print $2}')"
                if [[ "$fingerprint" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]; then
                  key_count=$((key_count + 1))
                  if [ "$fingerprint" = "$TARGET_KEY_FINGERPRINT" ]; then target_count=$((target_count + 1)); fi
                else
                  authorized_keys_safe=false
                fi
              done < "$auth"
            fi
          else
            authorized_keys_state=UNSAFE
          fi
          if [ -r "$DEPLOY_PATH/current/REVISION" ] && [ "$(tr -d '\r\n' < "$DEPLOY_PATH/current/REVISION")" = "$EXPECTED_ACTIVE_REVISION" ]; then active_match=true; fi
          if [ ! -e "$DEPLOY_PATH/.dep/deploy.lock" ]; then lock_absent=true; fi
          deploy_process_count="$(ps -eo comm=,args= | awk '$1=="php" && ($0 ~ /dep\.phar/ || $0 ~ /artisan migrate/ || $0 ~ /queue:reload-workers/) {n++} $1=="composer" && $0 ~ /install/ {n++} END {print n+0}')"
          printf 'REMOTE_INVENTORY_V2|%s|%s|%s|%s|%s|%s|%s|%s|%s|%s|%s|%s|%s|%s|%s|%s|%s\n' "$actor_sha" "$home_safe" "$ssh_dir_safe" "$authorized_keys_safe" "$authorized_keys_state" "$authorized_keys_sha" "$key_count" "$target_count" "$authorized_keys_ends_with_lf" "$active_match" "$lock_absent" "$deploy_process_count" "$auth_size" "$auth_nlink" "$same_filesystem" "$ssh_dev" "${auth_dev:-$ssh_dev}"
          REMOTE
            )"
          password_rc=$?
          existing_key_rc=0
          ssh -F /dev/null -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityFile="$RUNNER_TEMP/normalized-key.pub" -o PreferredAuthentications=publickey -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no -o NumberOfPasswordPrompts=0 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o ConnectTimeout=10 -p "$DEPLOY_PORT" "$BOOTSTRAP_SSH_USER@$DEPLOY_HOST" true >/dev/null 2>&1 || existing_key_rc=$?
          set -e

          protocol=INVALID; target_user_sha="$zero_sha"; home_safe=false; ssh_dir_safe=false; authorized_keys_safe=false
          authorized_keys_state=UNKNOWN; authorized_keys_sha="$zero_sha"; key_count=0; target_count=0; authorized_keys_ends_with_lf=false
          active_match=false; lock_absent=false; deploy_process_count=0; auth_size=0; auth_nlink=0; same_filesystem=false; ssh_dev=0; auth_dev=0
          if [ "$password_rc" -eq 0 ]; then
            IFS='|' read -r protocol target_user_sha home_safe ssh_dir_safe authorized_keys_safe authorized_keys_state authorized_keys_sha key_count target_count authorized_keys_ends_with_lf active_match lock_absent deploy_process_count auth_size auth_nlink same_filesystem ssh_dev auth_dev extra <<<"$password_result"
          fi
          protocol_valid=true
          [ "$protocol" = REMOTE_INVENTORY_V2 ] || protocol_valid=false
          [ -z "${extra:-}" ] || protocol_valid=false
          [[ "$target_user_sha" =~ ^[0-9a-f]{64}$ ]] || protocol_valid=false
          [[ "$authorized_keys_sha" =~ ^[0-9a-f]{64}$ ]] || protocol_valid=false
          for value in "$key_count" "$target_count" "$deploy_process_count" "$auth_size" "$auth_nlink" "$ssh_dev" "$auth_dev"; do [[ "$value" =~ ^[0-9]+$ ]] || protocol_valid=false; done
          for value in "$home_safe" "$ssh_dir_safe" "$authorized_keys_safe" "$authorized_keys_ends_with_lf" "$active_match" "$lock_absent" "$same_filesystem"; do [[ "$value" =~ ^(true|false)$ ]] || protocol_valid=false; done
          [[ "$authorized_keys_state" =~ ^(ABSENT|PRESENT|UNSAFE|UNKNOWN)$ ]] || protocol_valid=false
          if [ "$protocol_valid" != true ]; then
            target_user_sha="$zero_sha"; home_safe=false; ssh_dir_safe=false; authorized_keys_safe=false
            authorized_keys_state=UNKNOWN; authorized_keys_sha="$zero_sha"; key_count=0; target_count=0
            authorized_keys_ends_with_lf=false; active_match=false; lock_absent=false; deploy_process_count=0
            auth_size=0; auth_nlink=0; same_filesystem=false; ssh_dev=0; auth_dev=0
          fi

          target_identity_match=false; existing_key_login_rejected=false; password_accepted=false; apply_eligible=false
          if [ "$target_user_sha" = "$target_expected_sha" ]; then target_identity_match=true; fi
          if [ "$existing_key_rc" -ne 0 ]; then existing_key_login_rejected=true; fi
          if [ "$password_rc" -eq 0 ]; then password_accepted=true; fi
          status=PASS_SSH_KEY_AUTHORIZATION_PREFLIGHT; failed_stage=""
          if [ "$password_rc" -ne 0 ]; then status=FAIL_PASSWORD_SSH_AUTH; failed_stage=password_ssh
          elif [ "$protocol_valid" != true ]; then status=FAIL_REMOTE_INVENTORY_PROTOCOL; failed_stage=remote_inventory_protocol
          elif [ "$target_identity_match" != true ]; then status=BLOCKED_TARGET_IDENTITY; failed_stage=target_identity
          elif [ "$active_match" != true ]; then status=BLOCKED_ACTIVE_REVISION; failed_stage=active_revision
          elif [ "$lock_absent" != true ]; then status=BLOCKED_DEPLOY_LOCK; failed_stage=deploy_lock
          elif [ "$deploy_process_count" -ne 0 ]; then status=BLOCKED_DEPLOY_PROCESS; failed_stage=deploy_process
          elif [ "$home_safe" != true ] || [ "$ssh_dir_safe" != true ] || [ "$authorized_keys_safe" != true ] || [ "$authorized_keys_ends_with_lf" != true ] || [ "$same_filesystem" != true ]; then status=BLOCKED_UNSAFE_AUTHORIZED_KEYS; failed_stage=authorized_keys_safety
          elif [ "$target_count" -gt 0 ] && [ "$existing_key_rc" -ne 0 ]; then status=BLOCKED_TARGET_KEY_PRESENT_BUT_UNUSABLE; failed_stage=target_key_unusable
          elif [ "$existing_key_rc" -eq 0 ] && [ "$target_count" -gt 0 ]; then status=NOOP_KEY_ALREADY_AUTHORIZED; failed_stage=already_authorized
          elif [ "$existing_key_rc" -eq 0 ]; then status=BLOCKED_EXACT_LOGIN_WITHOUT_TARGET; failed_stage=exact_login_inconsistent
          else apply_eligible=true
          fi

          jq \
            --arg status "$status" --arg stage "$failed_stage" --arg user_sha "$target_user_sha" \
            --arg key_sha "$PUBLIC_KEY_SHA256" --arg fingerprint "$PUBLIC_KEY_FINGERPRINT" \
            --arg auth_sha "$authorized_keys_sha" --arg auth_state "$authorized_keys_state" \
            --argjson key_count "$key_count" --argjson target_count "$target_count" \
            --argjson password_accepted "$password_accepted" --argjson eligible "$apply_eligible" \
            --argjson identity "$target_identity_match" --argjson active "$active_match" \
            --argjson lock "$lock_absent" --argjson process_count "$deploy_process_count" \
            --argjson home_safe "$home_safe" --argjson ssh_safe "$ssh_dir_safe" \
            --argjson auth_safe "$authorized_keys_safe" --argjson key_rejected "$existing_key_login_rejected" \
            --argjson ends_lf "$authorized_keys_ends_with_lf" --argjson auth_size "$auth_size" --argjson auth_nlink "$auth_nlink" \
            --argjson same_fs "$same_filesystem" --argjson exact_login "$([ "$existing_key_rc" -eq 0 ] && echo true || echo false)" \
            '.status=$status | .failed_stage=$stage | .target_user_sha256=$user_sha
             | .public_key_sha256=$key_sha | .public_key_fingerprint=$fingerprint
             | .authorized_keys_sha256_before=$auth_sha | .authorized_keys_sha256_after=$auth_sha
