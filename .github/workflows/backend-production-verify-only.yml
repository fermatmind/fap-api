name: Backend Production Verify Only

on:
  workflow_dispatch:
    inputs:
      expected_release_sha:
        description: Exact deployed backend SHA (40 lowercase hex characters)
        required: true
        type: string
      release_name:
        description: Exact deployed backend release directory name
        required: true
        type: string
      operator_approval_phrase:
        description: Exact SHA-bound read-only production verification approval phrase
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.repository }}-production
  cancel-in-progress: false

jobs:
  eligibility:
    name: Validate main and exact read-only approval
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
      RELEASE_NAME: ${{ inputs.release_name }}
      OPERATOR_APPROVAL_PHRASE: ${{ inputs.operator_approval_phrase }}
    steps:
      - name: Validate exact SHA-bound read-only approval
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$EXPECTED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          expected="I explicitly approve read-only backend production verification for SHA ${EXPECTED_RELEASE_SHA} release ${RELEASE_NAME}."
          test "$OPERATOR_APPROVAL_PHRASE" = "$expected"

      - name: Checkout main authority
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Verify release SHA is reachable from origin main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git cat-file -e "${EXPECTED_RELEASE_SHA}^{commit}"
          git merge-base --is-ancestor "$EXPECTED_RELEASE_SHA" origin/main

  verify:
    name: Verify exact backend production release without writes
    needs: eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
      DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
      RETIRED_DEPLOY_HOST: ${{ secrets.PRODUCTION_RETIRED_DEPLOY_HOST }}
      DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
      HEALTHCHECK_URL: ${{ vars.PRODUCTION_HEALTHCHECK_URL }}
      EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
      RELEASE_NAME: ${{ inputs.release_name }}

    steps:
      - name: Initialize sanitized verification receipt
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/backend-production-verification.json"
          checked_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          jq -n \
            --arg release_sha "$EXPECTED_RELEASE_SHA" \
            --arg release_name "$RELEASE_NAME" \
            --arg checked_at "$checked_at" \
            '{
              schema_version: "backend-production-verify-only.v2",
              status: "FAIL_BACKEND_PRODUCTION_VERIFY_ONLY",
              release_sha: $release_sha,
              release_name: $release_name,
              checked_at: $checked_at,
              failed_check: "checkout_main",
              last_completed_check: null,
              failure_exit_code: null,
              checks: {
                active_symlink_resolved: false,
                release_name_match: false,
                revision_file_present: false,
                deployed_revision_match: false,
                internal_health: false,
                public_health_policy_404: false,
                flags_api: false,
                big_five_public_authority: false,
                big_five_internal_authority: false,
                personality_source_hash_match: false,
                scale_lookup_count: 0,
                riasec_60_questions: 0,
                riasec_140_questions: 0,
                schema_verified: false,
                php_fpm_running: false,
                nginx_running: false,
                queue_total: 0,
                queue_running: 0
              },
              negative_guarantees: {
                deploy: false,
                migration: false,
                database_write: false,
                cms_write: false,
                publisher: false,
                queue_restart: false,
                process_restart: false,
                deploy_lock_mutation: false,
                remote_file_write: false,
                raw_log_read: false,
                search_submit: false
              },
              writes_committed: false
            }' > "$receipt"

      - name: Checkout main authority
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Validate protected production topology
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/backend-production-verification.json"
          receipt_tmp="${receipt}.tmp"
          jq '.failed_check = "production_topology"' "$receipt" > "$receipt_tmp"
          mv "$receipt_tmp" "$receipt"
          for name in DEPLOY_USER DEPLOY_PORT DEPLOY_HOST RETIRED_DEPLOY_HOST DEPLOY_PATH HEALTHCHECK_URL; do
            test -n "${!name:-}"
          done
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          test "$DEPLOY_PORT" -ge 1
          test "$DEPLOY_PORT" -le 65535
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$RETIRED_DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          test "$DEPLOY_HOST" != "$RETIRED_DEPLOY_HOST"
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_PATH" != *".."* ]]
          [[ "$HEALTHCHECK_URL" =~ ^https://[A-Za-z0-9.-]+/api/healthz$ ]]
          jq '
            .last_completed_check = "production_topology"
            | .failed_check = "public_scale_lookups"
          ' "$receipt" > "$receipt_tmp"
          mv "$receipt_tmp" "$receipt"
          echo "Protected production topology validation passed without disclosing values."

      - name: Verify all public scale lookups with bounded retry
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/backend-production-verification.json"
          receipt_tmp="${receipt}.tmp"
          public_api_base_url="${HEALTHCHECK_URL%/api/healthz}"
          [[ "$public_api_base_url" =~ ^https://[A-Za-z0-9.-]+$ ]]
          scale_lookup_count=0
          for slug in \
            mbti-personality-test-16-personality-types \
            big-five-personality-test-ocean-model \
            enneagram-personality-test-nine-types \
            iq-test-intelligence-quotient-assessment \
            clinical-depression-anxiety-assessment-professional-edition
          do
            SCALE_LOOKUP_BASE_URL="$public_api_base_url" \
            SCALE_LOOKUP_SLUG="$slug" \
            SCALE_LOOKUP_USE_RESOLVE=false \
            SCALE_LOOKUP_ATTEMPTS=1 \
            SCALE_LOOKUP_RETRY_DELAY_SECONDS=0 \
            SCALE_LOOKUP_CONNECT_TIMEOUT_SECONDS=3 \
            SCALE_LOOKUP_MAX_TIME_SECONDS=10 \
              bash backend/scripts/deploy/verify_scale_lookup.sh >/dev/null 2>&1
            scale_lookup_count=$((scale_lookup_count + 1))
          done
          test "$scale_lookup_count" -eq 5
          jq '
            .checks.scale_lookup_count = 5
            | .last_completed_check = "public_scale_lookups"
            | .failed_check = "ssh_agent"
          ' "$receipt" > "$receipt_tmp"
          mv "$receipt_tmp" "$receipt"

      - name: Set up SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known hosts
        shell: bash
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/backend-production-verification.json"
          receipt_tmp="${receipt}.tmp"
          jq '.failed_check = "ssh_known_hosts"' "$receipt" > "$receipt_tmp"
          mv "$receipt_tmp" "$receipt"
          test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null \
            || ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f ~/.ssh/known_hosts >/dev/null
          jq '
            .last_completed_check = "ssh_known_hosts"
            | .failed_check = "ssh_session"
          ' "$receipt" > "$receipt_tmp"
          mv "$receipt_tmp" "$receipt"

      - name: Verify deployed release and runtime without writes
        shell: bash
        run: |
          set -euo pipefail
          printf -v q_deploy_path '%q' "$DEPLOY_PATH"
          printf -v q_expected_sha '%q' "$EXPECTED_RELEASE_SHA"
          printf -v q_release_name '%q' "$RELEASE_NAME"
          printf -v q_healthcheck_url '%q' "$HEALTHCHECK_URL"

          set +e
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH=$q_deploy_path EXPECTED_RELEASE_SHA=$q_expected_sha RELEASE_NAME=$q_release_name HEALTHCHECK_URL=$q_healthcheck_url bash -s" \
            <<'REMOTE' > "$RUNNER_TEMP/backend-production-verification.remote.json"
          set -uo pipefail

          active_symlink_resolved=false
          release_name_match=false
          revision_file_present=false
          deployed_revision_match=false
          internal_health_ok=false
          public_health_policy_404=false
          flags_api_ok=false
          big_five_public_authority=false
          big_five_internal_authority=false
          personality_source_hash_match=false
          riasec_60_questions=0
          riasec_140_questions=0
          schema_verified=false
          php_fpm_running=false
          nginx_running=false
          queue_total=0
          queue_running=0
          last_completed_check="ssh_session"

          emit_receipt() {
            local status="$1"
            local failed_check="$2"
            local failure_exit_code="$3"
            local checked_at
            checked_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            jq -n \
              --arg status "$status" \
              --arg release_sha "$EXPECTED_RELEASE_SHA" \
              --arg release_name "$RELEASE_NAME" \
              --arg checked_at "$checked_at" \
              --arg failed_check "$failed_check" \
              --arg last_completed_check "$last_completed_check" \
              --argjson failure_exit_code "$failure_exit_code" \
              --argjson active_symlink_resolved "$active_symlink_resolved" \
              --argjson release_name_match "$release_name_match" \
              --argjson revision_file_present "$revision_file_present" \
              --argjson deployed_revision_match "$deployed_revision_match" \
              --argjson internal_health "$internal_health_ok" \
              --argjson public_health_policy_404 "$public_health_policy_404" \
              --argjson flags_api "$flags_api_ok" \
              --argjson big_five_public_authority "$big_five_public_authority" \
              --argjson big_five_internal_authority "$big_five_internal_authority" \
              --argjson personality_source_hash_match "$personality_source_hash_match" \
              --argjson riasec_60_questions "$riasec_60_questions" \
              --argjson riasec_140_questions "$riasec_140_questions" \
              --argjson schema_verified "$schema_verified" \
              --argjson php_fpm_running "$php_fpm_running" \
              --argjson nginx_running "$nginx_running" \
              --argjson queue_total "$queue_total" \
              --argjson queue_running "$queue_running" \
              '{
                schema_version: "backend-production-verify-only.v2",
                status: $status,
                release_sha: $release_sha,
                release_name: $release_name,
                checked_at: $checked_at,
                failed_check: (if $failed_check == "" then null else $failed_check end),
                last_completed_check: $last_completed_check,
                failure_exit_code: $failure_exit_code,
                checks: {
                  active_symlink_resolved: $active_symlink_resolved,
                  release_name_match: $release_name_match,
                  revision_file_present: $revision_file_present,
                  deployed_revision_match: $deployed_revision_match,
                  internal_health: $internal_health,
                  public_health_policy_404: $public_health_policy_404,
                  flags_api: $flags_api,
                  big_five_public_authority: $big_five_public_authority,
                  big_five_internal_authority: $big_five_internal_authority,
                  personality_source_hash_match: $personality_source_hash_match,
                  scale_lookup_count: 5,
                  riasec_60_questions: $riasec_60_questions,
                  riasec_140_questions: $riasec_140_questions,
                  schema_verified: $schema_verified,
                  php_fpm_running: $php_fpm_running,
                  nginx_running: $nginx_running,
                  queue_total: $queue_total,
                  queue_running: $queue_running
                },
                negative_guarantees: {
                  deploy: false,
                  migration: false,
                  database_write: false,
                  cms_write: false,
                  publisher: false,
                  queue_restart: false,
                  process_restart: false,
                  deploy_lock_mutation: false,
                  remote_file_write: false,
                  raw_log_read: false,
                  search_submit: false
                },
                writes_committed: false
              }'
          }

          fail_check() {
            emit_receipt "FAIL_BACKEND_PRODUCTION_VERIFY_ONLY" "$1" 1
            exit 1
          }

          public_api_base_url="${HEALTHCHECK_URL%/api/healthz}"
          healthcheck_host="${public_api_base_url#https://}"
          if ! [[ "$public_api_base_url" =~ ^https://[A-Za-z0-9.-]+$ ]] \
            || ! [[ "$healthcheck_host" =~ ^[A-Za-z0-9.-]+$ ]]; then
            fail_check "healthcheck_url_contract"
          fi
          last_completed_check="healthcheck_url_contract"

          if ! current_release="$(readlink -f "$DEPLOY_PATH/current" 2>/dev/null)" \
            || ! test -d "$current_release"; then
            fail_check "active_symlink"
          fi
          active_symlink_resolved=true
          last_completed_check="active_symlink"

          if ! test "$(basename "$current_release")" = "$RELEASE_NAME"; then
            fail_check "release_name"
          fi
          release_name_match=true
          last_completed_check="release_name"

          if ! test -f "$current_release/REVISION"; then
            fail_check "revision_file"
          fi
          revision_file_present=true
          last_completed_check="revision_file"

          if ! deployed_revision="$(tr -d '\r\n' < "$current_release/REVISION" 2>/dev/null)" \
            || ! test "$deployed_revision" = "$EXPECTED_RELEASE_SHA"; then
            fail_check "revision_match"
          fi
          deployed_revision_match=true
          last_completed_check="revision_match"

          if ! internal_health="$(curl -fsS --connect-timeout 3 --max-time 10 \
            --resolve "${healthcheck_host}:443:127.0.0.1" \
            "https://${healthcheck_host}/api/healthz" 2>/dev/null)" \
            || ! jq -e '.ok == true' <<<"$internal_health" >/dev/null 2>&1; then
            fail_check "internal_health"
          fi
          internal_health_ok=true
          last_completed_check="internal_health"

          if ! public_health_status="$(curl -sS --connect-timeout 3 --max-time 10 \
            -o /dev/null -w '%{http_code}' "${public_api_base_url}/api/healthz" 2>/dev/null)" \
            || ! test "$public_health_status" = "404"; then
            fail_check "public_health_policy_404"
          fi
          public_health_policy_404=true
          last_completed_check="public_health_policy_404"

          if ! flags_payload="$(curl -fsS --connect-timeout 3 --max-time 10 \
            "${public_api_base_url}/api/v0.3/flags" 2>/dev/null)" \
            || ! jq -e 'type == "object"' <<<"$flags_payload" >/dev/null 2>&1; then
            fail_check "flags_api"
          fi
          flags_api_ok=true
          last_completed_check="flags_api"

          hub_path='/api/v0.5/personality-content-assets/big_five/hub/big-five?locale=zh-CN'
          if ! public_hub="$(curl -fsS --connect-timeout 3 --max-time 10 \
            "${public_api_base_url}${hub_path}" 2>/dev/null)" \
            || ! public_source_hash="$(jq -er '
            select(.ok == true)
            | .personality_public_content_asset_v1.source_hash
            | select(type == "string" and test("^[0-9a-f]{64}$"))
          ' <<<"$public_hub" 2>/dev/null)"; then
            fail_check "big_five_public_authority"
          fi
          big_five_public_authority=true
          last_completed_check="big_five_public_authority"

          if ! internal_hub="$(curl -fsS --connect-timeout 3 --max-time 10 \
            --resolve "${healthcheck_host}:443:127.0.0.1" \
            "https://${healthcheck_host}${hub_path}" 2>/dev/null)" \
            || ! internal_source_hash="$(jq -er '
            select(.ok == true)
            | .personality_public_content_asset_v1.source_hash
            | select(type == "string" and test("^[0-9a-f]{64}$"))
          ' <<<"$internal_hub" 2>/dev/null)"; then
            fail_check "big_five_internal_authority"
          fi
          big_five_internal_authority=true
          last_completed_check="big_five_internal_authority"

          if ! test "$internal_source_hash" = "$public_source_hash"; then
            fail_check "personality_source_hash_match"
          fi
          personality_source_hash_match=true
          last_completed_check="personality_source_hash_match"

          if ! riasec_60="$(curl -fsS --connect-timeout 3 --max-time 10 \
            "${public_api_base_url}/api/v0.3/scales/RIASEC/questions?locale=zh-CN&form_code=riasec_60" 2>/dev/null)" \
            || ! jq -e '.ok == true and .form_code == "riasec_60" and (.questions.items | length) == 60' \
              <<<"$riasec_60" >/dev/null 2>&1; then
            fail_check "riasec_60"
          fi
          riasec_60_questions=60
          last_completed_check="riasec_60"

          if ! riasec_140="$(curl -fsS --connect-timeout 3 --max-time 10 \
            "${public_api_base_url}/api/v0.3/scales/RIASEC/questions?locale=zh-CN&form_code=riasec_140" 2>/dev/null)" \
            || ! jq -e '.ok == true and .form_code == "riasec_140" and (.questions.items | length) == 140' \
              <<<"$riasec_140" >/dev/null 2>&1; then
            fail_check "riasec_140"
          fi
          riasec_140_questions=140
          last_completed_check="riasec_140"

          if ! (cd "$current_release/backend" && \
            php artisan fap:schema:verify --no-interaction --no-ansi >/dev/null 2>&1); then
            fail_check "schema_verify"
          fi
          schema_verified=true
          last_completed_check="schema_verify"

          if ! pgrep -f '[p]hp-fpm' >/dev/null; then
            fail_check "php_fpm"
          fi
          php_fpm_running=true
          last_completed_check="php_fpm"

          if ! pgrep -x nginx >/dev/null && ! pgrep -f '[n]ginx' >/dev/null; then
            fail_check "nginx"
          fi
          nginx_running=true
          last_completed_check="nginx"

          if ! queue_status="$(sudo -n /usr/bin/supervisorctl status 2>/dev/null)"; then
            fail_check "queue_status"
          fi
          queue_total="$(awk '$1 ~ /^fap-queue/ {count++} END {print count+0}' <<<"$queue_status")"
          queue_running="$(awk '$1 ~ /^fap-queue/ && $2 == "RUNNING" {count++} END {print count+0}' <<<"$queue_status")"
          if ! test "$queue_total" -gt 0 || ! test "$queue_running" -eq "$queue_total"; then
            fail_check "queue_runtime"
          fi
          last_completed_check="queue_runtime"

          emit_receipt "PASS_BACKEND_PRODUCTION_VERIFY_ONLY" "" null
          REMOTE
          ssh_status=$?
          set -e

          receipt="$RUNNER_TEMP/backend-production-verification.json"
          remote_receipt="$RUNNER_TEMP/backend-production-verification.remote.json"
          receipt_tmp="${receipt}.tmp"
          if jq -e '
            .schema_version == "backend-production-verify-only.v2" and
            .release_sha == env.EXPECTED_RELEASE_SHA and
            .release_name == env.RELEASE_NAME and
            .checks.scale_lookup_count == 5 and
            ((.status == "PASS_BACKEND_PRODUCTION_VERIFY_ONLY" and
                .failed_check == null and .failure_exit_code == null) or
              (.status == "FAIL_BACKEND_PRODUCTION_VERIFY_ONLY" and
                (.failed_check | type) == "string")) and
            (.negative_guarantees | to_entries | all(.value == false)) and
            .writes_committed == false
          ' "$remote_receipt" >/dev/null 2>&1; then
            mv "$remote_receipt" "$receipt"
          elif test "$ssh_status" -ne 0; then
            jq --argjson code "$ssh_status" '
              .failed_check = "ssh_session"
              | .failure_exit_code = $code
            ' "$receipt" > "$receipt_tmp"
            mv "$receipt_tmp" "$receipt"
          else
            jq '
              .failed_check = "remote_receipt_validation"
              | .failure_exit_code = 1
            ' "$receipt" > "$receipt_tmp"
            mv "$receipt_tmp" "$receipt"
            exit 1
          fi

          if test "$ssh_status" -ne 0; then
            exit "$ssh_status"
          fi

          jq -e '
            .status == "PASS_BACKEND_PRODUCTION_VERIFY_ONLY" and
            .failed_check == null and
            .failure_exit_code == null and
            .checks.riasec_60_questions == 60 and
            .checks.riasec_140_questions == 140 and
            .checks.queue_total > 0 and
            .checks.queue_running == .checks.queue_total
          ' "$receipt" >/dev/null

      - name: Validate sanitized verification receipt
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/backend-production-verification.json"
          jq -e '
            .schema_version == "backend-production-verify-only.v2" and
            .release_sha == env.EXPECTED_RELEASE_SHA and
            .release_name == env.RELEASE_NAME and
            ((.status == "PASS_BACKEND_PRODUCTION_VERIFY_ONLY" and
                .failed_check == null and .failure_exit_code == null) or
              (.status == "FAIL_BACKEND_PRODUCTION_VERIFY_ONLY" and
                (.failed_check | type) == "string")) and
            (.failed_check == null or (.failed_check as $failed | [
              "checkout_main",
              "production_topology",
              "public_scale_lookups",
              "ssh_agent",
              "ssh_known_hosts",
              "ssh_session",
              "remote_receipt_validation",
              "healthcheck_url_contract",
              "active_symlink",
              "release_name",
              "revision_file",
              "revision_match",
              "internal_health",
              "public_health_policy_404",
              "flags_api",
              "big_five_public_authority",
              "big_five_internal_authority",
              "personality_source_hash_match",
              "riasec_60",
              "riasec_140",
              "schema_verify",
              "php_fpm",
              "nginx",
              "queue_status",
              "queue_runtime"
            ] | index($failed) != null)) and
            (.negative_guarantees | to_entries | all(.value == false)) and
            .writes_committed == false
          ' "$receipt" >/dev/null

      - name: Publish safe verification summary
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/backend-production-verification.json"
          status="$(jq -r '.status' "$receipt")"
          checked_at="$(jq -r '.checked_at' "$receipt")"
          failed_check="$(jq -r '.failed_check // "none"' "$receipt")"
          last_completed_check="$(jq -r '.last_completed_check // "none"' "$receipt")"
          queue_total="$(jq -r '.checks.queue_total' "$receipt")"
          {
            echo "## Backend production verify-only"
            echo
            echo "- Status: ${status}"
            echo "- Checked at: ${checked_at}"
            echo "- Failed check: ${failed_check}"
            echo "- Last completed check: ${last_completed_check}"
            echo "- Scale lookups: $(jq -r '.checks.scale_lookup_count' "$receipt")"
            echo "- RIASEC question counts: $(jq -r '.checks.riasec_60_questions' "$receipt") / $(jq -r '.checks.riasec_140_questions' "$receipt")"
            echo "- Running queues: ${queue_total}"
            echo "- Writes committed: false"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload safe verification artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-production-verify-only-${{ github.run_id }}
          path: ${{ runner.temp }}/backend-production-verification.json
          if-no-files-found: error
          retention-days: 30
