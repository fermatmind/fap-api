name: Enneagram Search Queue Production Inspect

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact deployed fap-api release SHA (40 lowercase hex characters)
        required: true
        type: string
      operator_approval_phrase:
        description: "Exact phrase: Approve ENNEAGRAM Search Queue inspect for SHA <release_sha>"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: enneagram-search-queue-production-inspect
  cancel-in-progress: false

jobs:
  inspect:
    name: Run read-only Enneagram Search Queue inspection
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    env:
      DEPLOY_USER: ${{ vars.PRODUCTION_DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.PRODUCTION_DEPLOY_PORT }}
      DEPLOY_HOST: ${{ vars.PRODUCTION_DEPLOY_HOST }}
      RETIRED_DEPLOY_HOST: ${{ vars.PRODUCTION_RETIRED_DEPLOY_HOST }}
      DEPLOY_PATH: ${{ vars.PRODUCTION_DEPLOY_PATH }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      OPERATOR_APPROVAL_PHRASE: ${{ inputs.operator_approval_phrase }}

    steps:
      - name: Validate exact SHA-bound read-only approval
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          expected="Approve ENNEAGRAM Search Queue inspect for SHA ${RELEASE_SHA}"
          test "$OPERATOR_APPROVAL_PHRASE" = "$expected"

      - name: Validate protected production topology
        shell: bash
        run: |
          set -euo pipefail
          for name in DEPLOY_USER DEPLOY_PORT DEPLOY_HOST RETIRED_DEPLOY_HOST DEPLOY_PATH; do
            test -n "${!name:-}"
          done
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$RETIRED_DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_PATH" != *".."* ]]
          test "$DEPLOY_HOST" != "$RETIRED_DEPLOY_HOST"
          echo "Protected production topology validation passed without disclosing values."

      - name: Set up SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known hosts
        shell: bash
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null \
            || ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f ~/.ssh/known_hosts >/dev/null

      - name: Inspect deployed Queue state without writes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          target="$DEPLOY_USER@$DEPLOY_HOST"
          run_dir="/tmp/enneagram-search-queue-inspect-${GITHUB_RUN_ID}"
          printf -v q_deploy_path '%q' "$DEPLOY_PATH"
          printf -v q_release_sha '%q' "$RELEASE_SHA"
          printf -v q_run_dir '%q' "$run_dir"

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -p "$DEPLOY_PORT" "$target" \
            "DEPLOY_PATH=$q_deploy_path RELEASE_SHA=$q_release_sha RUN_DIR=$q_run_dir bash -s" <<'REMOTE' > artifacts/readiness.json
          set -Eeuo pipefail
          mkdir -p "$RUN_DIR"
          trap 'rm -rf "$RUN_DIR"' EXIT
          cd "$DEPLOY_PATH/current"
          deployed_sha="$(if [ -f REVISION ]; then tr -d '\r\n' < REVISION; else git rev-parse HEAD; fi)"
          test "$deployed_sha" = "$RELEASE_SHA"
          cd backend
          php artisan personality:enneagram-search-queue-inspect --dry-run --json --no-ansi > "$RUN_DIR/report.json"
          jq -e '
            .schema_version == "enneagram-search-queue-inspect.v1" and
            .dry_run == true and .write == false and .target_count == 116 and
            .negative_guarantees.database_write == false and
            .negative_guarantees.queue_write == false and
            .negative_guarantees.queue_approve == false and
            .negative_guarantees.queue_enqueue == false and
            .negative_guarantees.search_submit == false and
            .negative_guarantees.external_search_api_call == false and
            .negative_guarantees.cms_write == false and
            .negative_guarantees.llms_sitemap_cache_mutation == false and
            .negative_guarantees.deploy == false
          ' "$RUN_DIR/report.json" >/dev/null
          cat "$RUN_DIR/report.json"
          REMOTE

          jq -e '
            .schema_version == "enneagram-search-queue-inspect.v1" and
            .dry_run == true and .write == false and .target_count == 116
          ' artifacts/readiness.json >/dev/null

      - name: Upload safe inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: enneagram-search-queue-inspect-${{ github.run_id }}
          path: artifacts/readiness.json
          if-no-files-found: error
