name: Backend Production Ops Runtime Recovery

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only preflight or exact-authorized runtime apply
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - apply
      expected_control_plane_sha:
        description: Exact latest main SHA containing this control plane
        required: true
        type: string
      expected_active_revision:
        description: Exact active backend REVISION
        required: true
        type: string
      expected_runner_sha256:
        description: Exact SHA-256 of the ops runtime recovery runner
        required: true
        type: string
      expected_target_set_sha256:
        description: Apply only; target-set SHA-256 from preflight
        required: false
        default: ""
        type: string
      expected_state_sha256:
        description: Apply only; state SHA-256 from preflight
        required: false
        default: ""
        type: string
      expected_config_path_sha256:
        description: Apply only; config-path SHA-256 from preflight
        required: false
        default: ""
        type: string
      expected_config_sha256:
        description: Apply only; config SHA-256 from preflight
        required: false
        default: ""
        type: string
      expected_foreign_runtime_sha256:
        description: Apply only; foreign runtime SHA-256 from preflight
        required: false
        default: ""
        type: string
      preflight_run_id:
        description: Apply only; immutable successful preflight run id
        required: false
        default: ""
        type: string
      preflight_run_attempt:
        description: Apply only; immutable successful preflight run attempt
        required: false
        default: ""
        type: string
      operator_approval_phrase:
        description: Apply only; exact receipt-bound authorization phrase
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: backend-production-ops-runtime-recovery
  cancel-in-progress: false

jobs:
  eligibility:
    name: Validate ops runtime recovery eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.validate.outputs.mode }}
      control_plane_sha: ${{ steps.validate.outputs.control_plane_sha }}
      active_revision: ${{ steps.validate.outputs.active_revision }}
      runner_sha256: ${{ steps.validate.outputs.runner_sha256 }}
      target_set_sha256: ${{ steps.validate.outputs.target_set_sha256 }}
      state_sha256: ${{ steps.validate.outputs.state_sha256 }}
      config_path_sha256: ${{ steps.validate.outputs.config_path_sha256 }}
      config_sha256: ${{ steps.validate.outputs.config_sha256 }}
      foreign_runtime_sha256: ${{ steps.validate.outputs.foreign_runtime_sha256 }}
    steps:
      - name: Checkout exact main control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Validate exact control and immutable preflight binding
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          EXPECTED_CONTROL_PLANE_SHA: ${{ inputs.expected_control_plane_sha }}
          EXPECTED_ACTIVE_REVISION: ${{ inputs.expected_active_revision }}
          EXPECTED_RUNNER_SHA256: ${{ inputs.expected_runner_sha256 }}
          EXPECTED_TARGET_SET_SHA256: ${{ inputs.expected_target_set_sha256 }}
          EXPECTED_STATE_SHA256: ${{ inputs.expected_state_sha256 }}
          EXPECTED_CONFIG_PATH_SHA256: ${{ inputs.expected_config_path_sha256 }}
          EXPECTED_CONFIG_SHA256: ${{ inputs.expected_config_sha256 }}
          EXPECTED_FOREIGN_RUNTIME_SHA256: ${{ inputs.expected_foreign_runtime_sha256 }}
          PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
          PREFLIGHT_RUN_ATTEMPT: ${{ inputs.preflight_run_attempt }}
          OPERATOR_APPROVAL_PHRASE: ${{ inputs.operator_approval_phrase }}
        run: |
          set -euo pipefail
          runner="backend/scripts/deploy/control_ops_supervisor_runtime.sh"
          test "$GITHUB_REF" = refs/heads/main
          [[ "$EXPECTED_CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_ACTIVE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_RUNNER_SHA256" =~ ^[0-9a-f]{64}$ ]]
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_CONTROL_PLANE_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_CONTROL_PLANE_SHA"
          test "$(sha256sum "$runner" | awk '{print $1}')" = "$EXPECTED_RUNNER_SHA256"

          case "$MODE" in
            preflight)
              test -z "$EXPECTED_TARGET_SET_SHA256"
              test -z "$EXPECTED_STATE_SHA256"
              test -z "$EXPECTED_CONFIG_PATH_SHA256"
              test -z "$EXPECTED_CONFIG_SHA256"
              test -z "$EXPECTED_FOREIGN_RUNTIME_SHA256"
              test -z "$PREFLIGHT_RUN_ID"
              test -z "$PREFLIGHT_RUN_ATTEMPT"
              test -z "$OPERATOR_APPROVAL_PHRASE"
              ;;
            apply)
              for value in \
                "$EXPECTED_TARGET_SET_SHA256" "$EXPECTED_STATE_SHA256" \
                "$EXPECTED_CONFIG_PATH_SHA256" "$EXPECTED_CONFIG_SHA256" \
                "$EXPECTED_FOREIGN_RUNTIME_SHA256"; do
                [[ "$value" =~ ^[0-9a-f]{64}$ ]]
              done
              [[ "$PREFLIGHT_RUN_ID" =~ ^[0-9]+$ ]]
              [[ "$PREFLIGHT_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
              expected_phrase="I explicitly approve production fap-api ops worker runtime recovery from preflight run ${PREFLIGHT_RUN_ID} attempt ${PREFLIGHT_RUN_ATTEMPT} with control-plane SHA ${EXPECTED_CONTROL_PLANE_SHA} active SHA ${EXPECTED_ACTIVE_REVISION} runner SHA256 ${EXPECTED_RUNNER_SHA256} target-set SHA256 ${EXPECTED_TARGET_SET_SHA256} state SHA256 ${EXPECTED_STATE_SHA256} config-path SHA256 ${EXPECTED_CONFIG_PATH_SHA256} config SHA256 ${EXPECTED_CONFIG_SHA256} foreign-runtime SHA256 ${EXPECTED_FOREIGN_RUNTIME_SHA256}; restart only non-running fap-queue-ops with zero queued ops jobs, no config write/deploy/symlink/migration/CMS/database-authority/publication/schema/hreflang/revalidation/sitemap/llms/search."
              test "$OPERATOR_APPROVAL_PHRASE" = "$expected_phrase"
              run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREFLIGHT_RUN_ID}")"
              jq -e \
                --arg sha "$EXPECTED_CONTROL_PLANE_SHA" \
                --argjson attempt "$PREFLIGHT_RUN_ATTEMPT" \
                '.name == "Backend Production Ops Runtime Recovery"
                 and .path == ".github/workflows/backend-production-ops-runtime-recovery.yml"
                 and .event == "workflow_dispatch"
                 and .status == "completed"
                 and .conclusion == "success"
                 and .head_branch == "main"
                 and .head_sha == $sha
                 and .run_attempt == $attempt' <<<"$run_json" >/dev/null
              receipt_dir="$(mktemp -d)"
              gh run download "$PREFLIGHT_RUN_ID" \
                --name "backend-production-ops-runtime-preflight-${PREFLIGHT_RUN_ID}-${PREFLIGHT_RUN_ATTEMPT}" \
                --dir "$receipt_dir"
              receipt="$receipt_dir/backend-production-ops-runtime-recovery.json"
              test -f "$receipt"
              jq -e \
                --arg control "$EXPECTED_CONTROL_PLANE_SHA" \
                --arg active "$EXPECTED_ACTIVE_REVISION" \
                --arg runner "$EXPECTED_RUNNER_SHA256" \
                --arg target "$EXPECTED_TARGET_SET_SHA256" \
                --arg state "$EXPECTED_STATE_SHA256" \
                --arg config_path "$EXPECTED_CONFIG_PATH_SHA256" \
                --arg config "$EXPECTED_CONFIG_SHA256" \
                --arg foreign "$EXPECTED_FOREIGN_RUNTIME_SHA256" \
                --arg run_id "$PREFLIGHT_RUN_ID" \
                --arg run_attempt "$PREFLIGHT_RUN_ATTEMPT" \
                '.contract_version == "backend.production_ops_runtime_recovery.v1"
                 and .mode == "preflight"
                 and .status == "PASS_PREFLIGHT"
                 and .run_id == $run_id
                 and .run_attempt == $run_attempt
                 and .control_plane_sha == $control
                 and .active_revision == $active
                 and .runner_sha256 == $runner
                 and .target_set_sha256 == $target
                 and .state_sha256 == $state
                 and .config_path_sha256 == $config_path
                 and .config_sha256 == $config
                 and .foreign_runtime_sha256 == $foreign
                 and .program_state == "NOT_RUNNING"
                 and .ops_pending_total == 0
                 and .recovery_required == true
                 and .apply_supported == true
                 and .production_write_execution == false' "$receipt" >/dev/null
              ;;
            *)
              exit 2
              ;;
          esac
          {
            echo "mode=$MODE"
            echo "control_plane_sha=$EXPECTED_CONTROL_PLANE_SHA"
            echo "active_revision=$EXPECTED_ACTIVE_REVISION"
            echo "runner_sha256=$EXPECTED_RUNNER_SHA256"
            echo "target_set_sha256=$EXPECTED_TARGET_SET_SHA256"
            echo "state_sha256=$EXPECTED_STATE_SHA256"
            echo "config_path_sha256=$EXPECTED_CONFIG_PATH_SHA256"
            echo "config_sha256=$EXPECTED_CONFIG_SHA256"
            echo "foreign_runtime_sha256=$EXPECTED_FOREIGN_RUNTIME_SHA256"
          } >> "$GITHUB_OUTPUT"

  control:
    name: Preflight or apply ops runtime recovery
    needs: eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    steps:
      - name: Checkout exact control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.eligibility.outputs.control_plane_sha }}
          fetch-depth: 1

      - name: Start pinned SSH agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known hosts
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_PORT"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null \
            || ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f ~/.ssh/known_hosts >/dev/null

      - name: Execute bounded ops runtime control
        id: execute
        shell: bash
        env:
          MODE: ${{ needs.eligibility.outputs.mode }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
          EXPECTED_ACTIVE_REVISION: ${{ needs.eligibility.outputs.active_revision }}
          EXPECTED_RUNNER_SHA256: ${{ needs.eligibility.outputs.runner_sha256 }}
          EXPECTED_TARGET_SET_SHA256: ${{ needs.eligibility.outputs.target_set_sha256 }}
          EXPECTED_STATE_SHA256: ${{ needs.eligibility.outputs.state_sha256 }}
          EXPECTED_CONFIG_PATH_SHA256: ${{ needs.eligibility.outputs.config_path_sha256 }}
          EXPECTED_CONFIG_SHA256: ${{ needs.eligibility.outputs.config_sha256 }}
          EXPECTED_FOREIGN_RUNTIME_SHA256: ${{ needs.eligibility.outputs.foreign_runtime_sha256 }}
        run: |
          set -euo pipefail
          runner="backend/scripts/deploy/control_ops_supervisor_runtime.sh"
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_PATH" != *".."* ]]
          test "$(sha256sum "$runner" | awk '{print $1}')" = "$EXPECTED_RUNNER_SHA256"
          printf -v q_mode '%q' "$MODE"
          printf -v q_path '%q' "$DEPLOY_PATH"
          printf -v q_active '%q' "$EXPECTED_ACTIVE_REVISION"
          printf -v q_target '%q' "$EXPECTED_TARGET_SET_SHA256"
          printf -v q_state '%q' "$EXPECTED_STATE_SHA256"
          printf -v q_config_path '%q' "$EXPECTED_CONFIG_PATH_SHA256"
          printf -v q_config '%q' "$EXPECTED_CONFIG_SHA256"
          printf -v q_foreign '%q' "$EXPECTED_FOREIGN_RUNTIME_SHA256"
          set +e
          result="$(
            timeout --signal=TERM --kill-after=10s 180s \
              ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
                -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
                "MODE=$q_mode DEPLOY_PATH=$q_path EXPECTED_ACTIVE_REVISION=$q_active EXPECTED_TARGET_SET_SHA256=$q_target EXPECTED_STATE_SHA256=$q_state EXPECTED_CONFIG_PATH_SHA256=$q_config_path EXPECTED_CONFIG_SHA256=$q_config EXPECTED_FOREIGN_RUNTIME_SHA256=$q_foreign bash -s" \
                < "$runner" 2>"$RUNNER_TEMP/ops-runtime-control.err"
          )"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            safe_failure="$(grep -Eo 'OPS_RUNTIME_CONTROL_FAILED:[A-Z0-9_-]+' \
              "$RUNNER_TEMP/ops-runtime-control.err" | tail -n 1 || true)"
            if [[ "$safe_failure" =~ ^OPS_RUNTIME_CONTROL_FAILED:[A-Z0-9_-]+$ ]]; then
              echo "$safe_failure" >&2
            else
              echo OPS_RUNTIME_CONTROL_REMOTE_FAILURE >&2
            fi
            exit "$rc"
          fi
          if [ "$MODE" = preflight ]; then
            [[ "$result" != *$'\n'* ]]
            test "$(awk -F $'\t' '{print NF}' <<<"$result")" -eq 11
            IFS=$'\t' read -r active target state program_state pending config_path config layout foreign recovery apply_supported <<<"$result"
            test "$active" = "$EXPECTED_ACTIVE_REVISION"
            for value in "$target" "$state" "$config_path" "$config" "$foreign"; do
              [[ "$value" =~ ^[0-9a-f]{64}$ ]]
            done
            [[ "$program_state" =~ ^(RUNNING|NOT_RUNNING)$ ]]
            [[ "$pending" =~ ^[0-9]+$ ]]
            [[ "$layout" =~ ^(DEDICATED|SHARED)$ ]]
            [[ "$recovery" =~ ^(true|false)$ ]]
            [[ "$apply_supported" =~ ^(true|false)$ ]]
            after_state="$(printf '0%.0s' {1..64})"
          else
            test "$(awk -F $'\t' '{print NF}' <<<"$result")" -eq 4
            IFS=$'\t' read -r active target state after_state <<<"$result"
            test "$active" = "$EXPECTED_ACTIVE_REVISION"
            test "$target" = "$EXPECTED_TARGET_SET_SHA256"
            test "$state" = "$EXPECTED_STATE_SHA256"
            [[ "$after_state" =~ ^[0-9a-f]{64}$ ]]
            program_state=RUNNING
            pending=0
            config_path="$EXPECTED_CONFIG_PATH_SHA256"
            config="$EXPECTED_CONFIG_SHA256"
            foreign="$EXPECTED_FOREIGN_RUNTIME_SHA256"
            layout=UNCHANGED
            recovery=false
            apply_supported=false
          fi
          {
            echo "target_set_sha256=$target"
            echo "state_sha256=$state"
            echo "after_state_sha256=$after_state"
            echo "program_state=$program_state"
            echo "ops_pending_total=$pending"
            echo "config_path_sha256=$config_path"
            echo "config_sha256=$config"
            echo "config_layout=$layout"
            echo "foreign_runtime_sha256=$foreign"
            echo "recovery_required=$recovery"
            echo "apply_supported=$apply_supported"
          } >> "$GITHUB_OUTPUT"

      - name: Generate sanitized immutable receipt
        shell: bash
        env:
          MODE: ${{ needs.eligibility.outputs.mode }}
          CONTROL_PLANE_SHA: ${{ needs.eligibility.outputs.control_plane_sha }}
          ACTIVE_REVISION: ${{ needs.eligibility.outputs.active_revision }}
          RUNNER_SHA256: ${{ needs.eligibility.outputs.runner_sha256 }}
          TARGET_SET_SHA256: ${{ steps.execute.outputs.target_set_sha256 }}
          STATE_SHA256: ${{ steps.execute.outputs.state_sha256 }}
          AFTER_STATE_SHA256: ${{ steps.execute.outputs.after_state_sha256 }}
          PROGRAM_STATE: ${{ steps.execute.outputs.program_state }}
          OPS_PENDING_TOTAL: ${{ steps.execute.outputs.ops_pending_total }}
          CONFIG_PATH_SHA256: ${{ steps.execute.outputs.config_path_sha256 }}
          CONFIG_SHA256: ${{ steps.execute.outputs.config_sha256 }}
          CONFIG_LAYOUT: ${{ steps.execute.outputs.config_layout }}
          FOREIGN_RUNTIME_SHA256: ${{ steps.execute.outputs.foreign_runtime_sha256 }}
          RECOVERY_REQUIRED: ${{ steps.execute.outputs.recovery_required }}
          APPLY_SUPPORTED: ${{ steps.execute.outputs.apply_supported }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          status=PASS_APPLY
          write=true
          restart_count=1
          if [ "$MODE" = preflight ]; then
            status=PASS_PREFLIGHT
            write=false
            restart_count=0
          fi
          jq -n \
            --arg mode "$MODE" --arg status "$status" \
            --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg control "$CONTROL_PLANE_SHA" --arg active "$ACTIVE_REVISION" \
            --arg runner "$RUNNER_SHA256" --arg target "$TARGET_SET_SHA256" \
            --arg state "$STATE_SHA256" --arg after "$AFTER_STATE_SHA256" \
            --arg program_state "$PROGRAM_STATE" --argjson pending "$OPS_PENDING_TOTAL" \
            --arg config_path "$CONFIG_PATH_SHA256" --arg config "$CONFIG_SHA256" \
            --arg layout "$CONFIG_LAYOUT" --arg foreign "$FOREIGN_RUNTIME_SHA256" \
            --argjson recovery "$RECOVERY_REQUIRED" --argjson apply_supported "$APPLY_SUPPORTED" \
            --argjson write "$write" --argjson restart_count "$restart_count" \
            '{
              contract_version: "backend.production_ops_runtime_recovery.v1",
              mode: $mode, status: $status, run_id: $run_id, run_attempt: $run_attempt,
              control_plane_sha: $control, active_revision: $active,
              runner_sha256: $runner, target_set_sha256: $target,
              state_sha256: $state, after_state_sha256: $after,
              program_state: $program_state, ops_pending_total: $pending,
              config_path_sha256: $config_path, config_sha256: $config,
              config_layout: $layout, foreign_runtime_sha256: $foreign,
              recovery_required: $recovery, apply_supported: $apply_supported,
              production_write_execution: $write, worker_restart_count: $restart_count,
              config_write_count: 0, deploy_count: 0, symlink_write_count: 0,
              migration_count: 0, cms_or_database_authority_write_count: 0,
              publication_or_discoverability_write_count: 0,
              search_submission_count: 0
            }' > artifacts/backend-production-ops-runtime-recovery.json

      - name: Publish exact runtime recovery authorization
        if: needs.eligibility.outputs.mode == 'preflight' && steps.execute.outputs.apply_supported == 'true'
        shell: bash
        env:
          CONTROL_PLANE_SHA: ${{ needs.eligibility.outputs.control_plane_sha }}
          ACTIVE_REVISION: ${{ needs.eligibility.outputs.active_revision }}
          RUNNER_SHA256: ${{ needs.eligibility.outputs.runner_sha256 }}
          TARGET_SET_SHA256: ${{ steps.execute.outputs.target_set_sha256 }}
          STATE_SHA256: ${{ steps.execute.outputs.state_sha256 }}
          CONFIG_PATH_SHA256: ${{ steps.execute.outputs.config_path_sha256 }}
          CONFIG_SHA256: ${{ steps.execute.outputs.config_sha256 }}
          FOREIGN_RUNTIME_SHA256: ${{ steps.execute.outputs.foreign_runtime_sha256 }}
        run: |
          set -euo pipefail
          phrase="I explicitly approve production fap-api ops worker runtime recovery from preflight run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT} with control-plane SHA ${CONTROL_PLANE_SHA} active SHA ${ACTIVE_REVISION} runner SHA256 ${RUNNER_SHA256} target-set SHA256 ${TARGET_SET_SHA256} state SHA256 ${STATE_SHA256} config-path SHA256 ${CONFIG_PATH_SHA256} config SHA256 ${CONFIG_SHA256} foreign-runtime SHA256 ${FOREIGN_RUNTIME_SHA256}; restart only non-running fap-queue-ops with zero queued ops jobs, no config write/deploy/symlink/migration/CMS/database-authority/publication/schema/hreflang/revalidation/sitemap/llms/search."
          {
            echo "## Ops worker runtime recovery preflight"
            echo
            echo '```text'
            echo "$phrase"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable runtime recovery receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-production-ops-runtime-${{ needs.eligibility.outputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/backend-production-ops-runtime-recovery.json
          if-no-files-found: error
          retention-days: 30
