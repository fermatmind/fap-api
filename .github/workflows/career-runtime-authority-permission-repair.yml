name: Career Runtime Authority Permission Repair

on:
  workflow_dispatch:
    inputs:
      expected_control_plane_sha:
        description: Exact latest main SHA containing this v2 repair control
        required: true
        type: string
      expected_active_revision:
        description: Exact active production revision that must remain active
        required: true
        type: string
      preflight_run_id:
        description: Exact successful v2 permission preflight run id
        required: true
        type: string
      preflight_run_attempt:
        description: Exact successful v2 permission preflight run attempt
        required: true
        type: string
      expected_preflight_receipt_sha256:
        description: Exact SHA256 of the v2 preflight receipt
        required: true
        type: string
      expected_preflight_artifact_digest:
        description: Exact GitHub artifact digest in sha256 form
        required: true
        type: string
      operator_approval_phrase:
        description: Exact workflow-generated receipt-bound approval phrase
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-${{ github.repository }}-production
  cancel-in-progress: false

jobs:
  repair:
    name: Apply exact pointer-bound metadata repair once
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      CONTROL_PLANE_SHA: ${{ inputs.expected_control_plane_sha }}
      EXPECTED_ACTIVE_REVISION: ${{ inputs.expected_active_revision }}
      PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
      PREFLIGHT_RUN_ATTEMPT: ${{ inputs.preflight_run_attempt }}
      EXPECTED_PREFLIGHT_RECEIPT_SHA256: ${{ inputs.expected_preflight_receipt_sha256 }}
      EXPECTED_PREFLIGHT_ARTIFACT_DIGEST: ${{ inputs.expected_preflight_artifact_digest }}
      OPERATOR_APPROVAL_PHRASE: ${{ inputs.operator_approval_phrase }}
      GENERATION_ID: 'career-current-342-30-bootstrap-v1'
      POINTER_DOCUMENT_SHA256: '1ebfd2826be9d3b63d810d33050034e3d424c95b3db81fa49b0822c5e6b2ec08'
      PROJECTION_SHA256_EXPECTED: '397f2a4ec284e9c0a6cd610447541ad4773fa7a7f3045008fab5efb334ec85c6'
      LEDGER_SHA256_EXPECTED: '975b311bb346a090f1add678d5a6d9f1be230f87b223e2c3c829f4c7fd7aac6e'
      PROJECTION_PATH_SHA256_EXPECTED: '32e4e5f30b56f96c7fda9b3eff03b02e23a406869d78ed9d223d59f0749586d1'
      LEDGER_PATH_SHA256_EXPECTED: 'a7501519b6ca3f8c529e0ca2283985bd3900c0b9679c871c2c56197f324e013e'
      DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
      DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
      RETIRED_DEPLOY_HOST: ${{ secrets.PRODUCTION_RETIRED_DEPLOY_HOST }}
      DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}

    steps:
      - name: Initialize failure-safe no-retry receipt
        shell: bash
        run: |
          set -euo pipefail
          REPAIR_RECEIPT="$RUNNER_TEMP/career-runtime-authority-permission-repair.json"
          printf 'REPAIR_RECEIPT=%s\n' "$REPAIR_RECEIPT" >> "$GITHUB_ENV"
          jq -n --arg control "$CONTROL_PLANE_SHA" --arg active "$EXPECTED_ACTIVE_REVISION" --arg preflight "$PREFLIGHT_RUN_ID" --arg attempt "$PREFLIGHT_RUN_ATTEMPT" --arg run "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{schema_version:"career.runtime_authority_pointer_permission_repair.v2",status:"HOLD_APPLY_INCOMPLETE_NO_RETRY",control_plane_sha:$control,active_revision:$active,preflight_run_id:(if ($preflight|test("^[1-9][0-9]*$")) then ($preflight|tonumber) else null end),preflight_run_attempt:(if ($attempt|test("^[1-9][0-9]*$")) then ($attempt|tonumber) else null end),workflow_run_id:($run|tonumber),workflow_run_attempt:($run_attempt|tonumber),possible_metadata_write_state:"unknown",content_write_count:0,database_write_count:0,cms_write_count:0,cache_write_count:0,publication_write_count:0,discoverability_write_count:0,migration_count:0,deployment_count:0,restart_count:0,automatic_retry_allowed:false,automatic_rollback_allowed:false}' \
            > "$REPAIR_RECEIPT"

      - name: Checkout exact control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.expected_control_plane_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate latest main and fresh v2 preflight lineage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          inspector="backend/scripts/deploy/career_runtime_authority_permission_control.sh"
          test "$GITHUB_REF" = refs/heads/main
          [[ "$CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_ACTIVE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PREFLIGHT_RUN_ID" =~ ^[1-9][0-9]*$ ]] && [[ "$PREFLIGHT_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_PREFLIGHT_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_PREFLIGHT_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$PREFLIGHT_RUN_ID" != "$GITHUB_RUN_ID"
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$CONTROL_PLANE_SHA"
          test "$(git rev-parse origin/main)" = "$CONTROL_PLANE_SHA"
          git cat-file -e "${EXPECTED_ACTIVE_REVISION}^{commit}"
          git merge-base --is-ancestor "$EXPECTED_ACTIVE_REVISION" "$CONTROL_PLANE_SHA"
          git diff --quiet "$EXPECTED_ACTIVE_REVISION" "$CONTROL_PLANE_SHA" -- backend/database/migrations
          test -f "$inspector" && test ! -L "$inspector"
          bash -n "$inspector"
          INSPECTOR_SHA256="$(sha256sum "$inspector" | awk '{print $1}')"

          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREFLIGHT_RUN_ID}")"
          jq -e --arg sha "$CONTROL_PLANE_SHA" --argjson attempt "$PREFLIGHT_RUN_ATTEMPT" \
            '.name=="Career Runtime Authority Permission Preflight" and .path==".github/workflows/career-runtime-authority-permission-preflight.yml" and .event=="workflow_dispatch" and .head_branch=="main" and .head_sha==$sha and .status=="completed" and .conclusion=="success" and .run_attempt==$attempt' \
            <<<"$run_json" >/dev/null
          artifact_name="career-runtime-authority-permission-preflight-${PREFLIGHT_RUN_ID}-${PREFLIGHT_RUN_ATTEMPT}"
          artifacts_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREFLIGHT_RUN_ID}/artifacts?per_page=100")"
          jq -e --arg name "$artifact_name" --arg digest "$EXPECTED_PREFLIGHT_ARTIFACT_DIGEST" \
            '[.artifacts[]|select(.name==$name)]|length==1 and .[0].expired==false and .[0].digest==$digest' <<<"$artifacts_json" >/dev/null
          evidence_dir="$(mktemp -d)"
          gh run download "$PREFLIGHT_RUN_ID" --name "$artifact_name" --dir "$evidence_dir"
          receipt="$evidence_dir/career-runtime-authority-permission-preflight.json"
          test "$(sha256sum "$receipt" | awk '{print $1}')" = "$EXPECTED_PREFLIGHT_RECEIPT_SHA256"
          jq -e --arg control "$CONTROL_PLANE_SHA" --arg active "$EXPECTED_ACTIVE_REVISION" --arg inspector "$INSPECTOR_SHA256" \
            --arg generation "$GENERATION_ID" --arg pointer "$POINTER_DOCUMENT_SHA256" --arg projection "$PROJECTION_SHA256_EXPECTED" --arg ledger "$LEDGER_SHA256_EXPECTED" \
            --arg projection_path "$PROJECTION_PATH_SHA256_EXPECTED" --arg ledger_path "$LEDGER_PATH_SHA256_EXPECTED" --argjson run "$PREFLIGHT_RUN_ID" --argjson attempt "$PREFLIGHT_RUN_ATTEMPT" \
            '.schema_version=="career.runtime_authority_pointer_permission_preflight.v2" and .status=="PASS_POINTER_BOUND_PERMISSION_REPAIR_REQUIRED" and .control_plane_sha==$control and .active_revision==$active and .inspector_sha256==$inspector and .workflow_run_id==$run and .workflow_run_attempt==$attempt and .pointer_apply_run_id==31593321673 and .pointer_apply_artifact_digest=="sha256:101508066a741afd44d29b4c28bd866b1fa3d4772dfda14c71da71c320c545c7" and .pointer_apply_receipt_sha256=="e0898f6fbb438495319cf0acc8bd6f808eba18c3f3beeb4a4e7d690312c27bc4" and .diagnostic_run_id==31627080908 and .diagnostic_artifact_digest=="sha256:870897b74bbf1cb8fdd07c82a8bddde99209a93ac1d6bc67e31cd94d0579e557" and .diagnostic_receipt_sha256=="dabb89d4c42c83a000102ca0ceaae859f70e5c538815434f4cf9d8c5727f6ef4" and .generation_id==$generation and .pointer_document_sha256==$pointer and .projection_path_sha256==$projection_path and .ledger_path_sha256==$ledger_path and .projection_sha256==$projection and .ledger_sha256==$ledger and .projection_unique_slug_count==342 and .projection_locale_row_count==684 and .published_slug_count==30 and .published_locale_row_count==60 and .ledger_member_count==342 and (.target_set_sha256|test("^[0-9a-f]{64}$")) and (.snapshot_sha256|test("^[0-9a-f]{64}$")) and .repair_target_count>=1 and .repair_target_count<=4 and .active_revision_unchanged==true and .deploy_lock_absent==true and .deploy_process_absent==true and .migration_process_absent==true and .remote_write_count==0 and .metadata_write_count==0 and .content_write_count==0 and .database_write_count==0 and .cms_write_count==0 and .cache_write_count==0 and .publication_write_count==0 and .discoverability_write_count==0 and .migration_count==0 and .deployment_count==0 and .restart_count==0 and .automatic_retry_allowed==false' \
            "$receipt" >/dev/null

          prior_repairs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/career-runtime-authority-permission-repair.yml/runs?event=workflow_dispatch&per_page=100")"
          jq -e --argjson preflight "$PREFLIGHT_RUN_ID" --argjson current "$GITHUB_RUN_ID" \
            '[.workflow_runs[]|select(.id>$preflight and .id<$current)]|length==0' <<<"$prior_repairs" >/dev/null

          TARGET_SET_SHA256="$(jq -r .target_set_sha256 "$receipt")"
          PREFLIGHT_SNAPSHOT_SHA256="$(jq -r .snapshot_sha256 "$receipt")"
          REPAIR_TARGET_COUNT="$(jq -r .repair_target_count "$receipt")"
          expected_phrase="I approve one pointer-bound Career production metadata repair for control ${CONTROL_PLANE_SHA}, active ${EXPECTED_ACTIVE_REVISION}, preflight ${PREFLIGHT_RUN_ID}/${PREFLIGHT_RUN_ATTEMPT}, receipt ${EXPECTED_PREFLIGHT_RECEIPT_SHA256}, target ${TARGET_SET_SHA256}, snapshot ${PREFLIGHT_SNAPSHOT_SHA256}, pointer ${POINTER_DOCUMENT_SHA256}, projection path ${PROJECTION_PATH_SHA256_EXPECTED}, ledger path ${LEDGER_PATH_SHA256_EXPECTED}, repair targets ${REPAIR_TARGET_COUNT}; exact metadata only, no retry."
          test "$OPERATOR_APPROVAL_PHRASE" = "$expected_phrase"
          {
            echo "INSPECTOR_SHA256=$INSPECTOR_SHA256"
            echo "TARGET_SET_SHA256=$TARGET_SET_SHA256"
            echo "PREFLIGHT_SNAPSHOT_SHA256=$PREFLIGHT_SNAPSHOT_SHA256"
            echo "REPAIR_TARGET_COUNT=$REPAIR_TARGET_COUNT"
          } >> "$GITHUB_ENV"
          rm -rf -- "$evidence_dir"

      - name: Validate protected production topology
        shell: bash
        run: |
          set -euo pipefail
          for name in DEPLOY_USER DEPLOY_PORT DEPLOY_HOST RETIRED_DEPLOY_HOST DEPLOY_PATH; do test -n "${!name:-}"; done
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] && test "$DEPLOY_PORT" -ge 1 && test "$DEPLOY_PORT" -le 65535
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]] && [[ "$RETIRED_DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          test "$DEPLOY_HOST" != "$RETIRED_DEPLOY_HOST"
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] && [[ "$DEPLOY_PATH" != *"/../"* ]]

      - name: Set up SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known hosts
        shell: bash
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null || ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f ~/.ssh/known_hosts >/dev/null

      - name: Mark metadata operation dispatched and prohibit retry
        shell: bash
        run: |
          set -euo pipefail
          jq '.status="HOLD_APPLY_DISPATCHED_NO_VERIFIED_READBACK"|.possible_metadata_write_state="unknown"|.automatic_retry_allowed=false|.automatic_rollback_allowed=false' "$REPAIR_RECEIPT" > "$RUNNER_TEMP/repair.tmp"
          mv "$RUNNER_TEMP/repair.tmp" "$REPAIR_RECEIPT"

      - name: Apply and read back exact pointer-bound metadata
        shell: bash
        run: |
          set -euo pipefail
          inspector="backend/scripts/deploy/career_runtime_authority_permission_control.sh"
          printf -v q_root '%q' "$DEPLOY_PATH/shared/backend/storage/app/private"
          printf -v q_path '%q' "$DEPLOY_PATH"
          printf -v q_user '%q' "$DEPLOY_USER"
          printf -v q_active '%q' "$EXPECTED_ACTIVE_REVISION"
          printf -v q_target '%q' "$TARGET_SET_SHA256"
          printf -v q_snapshot '%q' "$PREFLIGHT_SNAPSHOT_SHA256"
          printf -v q_count '%q' "$REPAIR_TARGET_COUNT"
          printf -v q_pointer '%q' "$POINTER_DOCUMENT_SHA256"
          printf -v q_projection_path '%q' "$PROJECTION_PATH_SHA256_EXPECTED"
          printf -v q_ledger_path '%q' "$LEDGER_PATH_SHA256_EXPECTED"
          result="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo -n env DEPLOY_PATH=$q_path EXPECTED_ACTIVE_REVISION=$q_active CAREER_AUTHORITY_PERMISSION_MODE=apply CAREER_AUTHORITY_PERMISSION_ROOT=$q_root CAREER_AUTHORITY_PERMISSION_OWNER=$q_user CAREER_AUTHORITY_PERMISSION_GROUP=www-data CAREER_AUTHORITY_PERMISSION_RUNTIME_USER=www-data CAREER_AUTHORITY_PERMISSION_APPLY_CONFIRMATION=true CAREER_AUTHORITY_PERMISSION_EXPECTED_TARGET_SET_SHA256=$q_target CAREER_AUTHORITY_PERMISSION_EXPECTED_SNAPSHOT_SHA256=$q_snapshot CAREER_AUTHORITY_PERMISSION_EXPECTED_REPAIR_TARGET_COUNT=$q_count CAREER_AUTHORITY_PERMISSION_EXPECTED_POINTER_SHA256=$q_pointer CAREER_AUTHORITY_PERMISSION_EXPECTED_PROJECTION_PATH_SHA256=$q_projection_path CAREER_AUTHORITY_PERMISSION_EXPECTED_LEDGER_PATH_SHA256=$q_ledger_path bash -s" < "$inspector")"
          jq -e --arg pointer "$POINTER_DOCUMENT_SHA256" --arg projection "$PROJECTION_SHA256_EXPECTED" --arg ledger "$LEDGER_SHA256_EXPECTED" --arg projection_path "$PROJECTION_PATH_SHA256_EXPECTED" --arg ledger_path "$LEDGER_PATH_SHA256_EXPECTED" --arg target "$TARGET_SET_SHA256" --argjson writes "$REPAIR_TARGET_COUNT" \
            '.schema_version=="career.runtime_authority_pointer_permission_control.v2" and .status=="PASS_POINTER_BOUND_PERMISSION_REPAIR_VERIFIED" and .pointer_document_sha256==$pointer and .projection_sha256==$projection and .ledger_sha256==$ledger and .projection_path_sha256==$projection_path and .ledger_path_sha256==$ledger_path and .target_set_sha256==$target and (.snapshot_sha256|test("^[0-9a-f]{64}$")) and .repair_target_count==0 and .runtime_readable==true and .metadata_write_count==$writes and .bytes_unchanged==true and .active_revision_unchanged==true and .deploy_lock_absent==true and .deploy_process_absent==true and .migration_process_absent==true and .content_write_count==0 and .database_write_count==0 and .cms_write_count==0 and .cache_write_count==0 and .publication_write_count==0 and .discoverability_write_count==0 and .migration_count==0 and .deployment_count==0 and .restart_count==0 and .automatic_retry_allowed==false' \
            <<<"$result" >/dev/null
          POST_SNAPSHOT_SHA256="$(jq -r .snapshot_sha256 <<<"$result")"
          echo "POST_SNAPSHOT_SHA256=$POST_SNAPSHOT_SHA256" >> "$GITHUB_ENV"

      - name: Write verified metadata-only v2 receipt
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg control "$CONTROL_PLANE_SHA" --arg active "$EXPECTED_ACTIVE_REVISION" --arg preflight "$PREFLIGHT_RUN_ID" --arg preflight_attempt "$PREFLIGHT_RUN_ATTEMPT" --arg preflight_sha "$EXPECTED_PREFLIGHT_RECEIPT_SHA256" --arg preflight_digest "$EXPECTED_PREFLIGHT_ARTIFACT_DIGEST" --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" --arg inspector "$INSPECTOR_SHA256" --arg generation "$GENERATION_ID" --arg pointer "$POINTER_DOCUMENT_SHA256" --arg projection_path "$PROJECTION_PATH_SHA256_EXPECTED" --arg ledger_path "$LEDGER_PATH_SHA256_EXPECTED" --arg projection "$PROJECTION_SHA256_EXPECTED" --arg ledger "$LEDGER_SHA256_EXPECTED" --arg target "$TARGET_SET_SHA256" --arg pre_snapshot "$PREFLIGHT_SNAPSHOT_SHA256" --arg post_snapshot "$POST_SNAPSHOT_SHA256" --argjson writes "$REPAIR_TARGET_COUNT" \
            '{schema_version:"career.runtime_authority_pointer_permission_repair.v2",status:"PASS_POINTER_BOUND_PERMISSION_REPAIR_VERIFIED",control_plane_sha:$control,active_revision:$active,preflight_run_id:($preflight|tonumber),preflight_run_attempt:($preflight_attempt|tonumber),preflight_receipt_sha256:$preflight_sha,preflight_artifact_digest:$preflight_digest,workflow_run_id:($run|tonumber),workflow_run_attempt:($attempt|tonumber),inspector_sha256:$inspector,generation_id:$generation,pointer_document_sha256:$pointer,projection_path_sha256:$projection_path,ledger_path_sha256:$ledger_path,projection_sha256:$projection,ledger_sha256:$ledger,projection_unique_slug_count:342,projection_locale_row_count:684,published_slug_count:30,published_locale_row_count:60,ledger_member_count:342,target_set_sha256:$target,preflight_snapshot_sha256:$pre_snapshot,post_snapshot_sha256:$post_snapshot,metadata_write_count:$writes,repair_target_count:0,runtime_readable:true,bytes_unchanged:true,active_revision_unchanged:true,deploy_lock_absent:true,deploy_process_absent:true,migration_process_absent:true,possible_metadata_write_state:"verified_complete",content_write_count:0,database_write_count:0,cms_write_count:0,cache_write_count:0,publication_write_count:0,discoverability_write_count:0,migration_count:0,deployment_count:0,restart_count:0,automatic_retry_allowed:false,automatic_rollback_allowed:false}' \
            > "$REPAIR_RECEIPT"
          receipt_sha="$(sha256sum "$REPAIR_RECEIPT" | awk '{print $1}')"
          {
            echo '## Career pointer-bound permission repair v2'
            echo
            echo '- status: PASS_POINTER_BOUND_PERMISSION_REPAIR_VERIFIED'
            echo "- metadata_targets_changed: $REPAIR_TARGET_COUNT"
            echo '- bytes_unchanged: true'
            echo '- runtime_readable: true'
            echo "- receipt_sha256: $receipt_sha"
            echo '- all non-metadata writes: 0'
            echo '- retry_allowed: false'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bounded repair receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: career-runtime-authority-permission-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/career-runtime-authority-permission-repair.json
          if-no-files-found: error
          retention-days: 30
