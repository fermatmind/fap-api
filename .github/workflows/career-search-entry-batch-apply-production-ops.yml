name: Career Search Entry Batch Apply Production Ops

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preflight is zero-write; apply/rollback each append one exact receipt
        required: true
        type: choice
        options:
          - preflight
          - apply
          - rollback
      expected_control_plane_sha:
        description: Exact latest main SHA containing this control plane
        required: true
        type: string
      expected_release_sha:
        description: Exact active production application SHA
        required: true
        type: string
      expected_release_name:
        description: Exact active production release name
        required: true
        type: string
      actor_admin_user_id:
        description: Exact configured solo-owner admin user ID
        required: true
        default: "1"
        type: string
      operation_id:
        description: Exact bounded operation ID
        required: true
        type: string
      rollback_identifier:
        description: Exact rollback identifier
        required: true
        type: string
      review_bind_run_id:
        description: Successful exact review-bind workflow run
        required: true
        type: string
      review_bind_run_attempt:
        description: Successful exact review-bind workflow attempt
        required: true
        type: string
      expected_review_evidence_sha256:
        description: Exact approved-all review evidence SHA
        required: true
        type: string
      expected_state_sha256:
        description: Apply only; immutable apply preflight state SHA
        required: false
        default: ""
        type: string
      expected_quality_package_sha256:
        description: Apply only; exact quality package SHA
        required: false
        default: ""
        type: string
      expected_review_package_sha256:
        description: Apply only; exact review package SHA
        required: false
        default: ""
        type: string
      expected_target_set_sha256:
        description: Apply only; exact review target-set SHA
        required: false
        default: ""
        type: string
      preflight_run_id:
        description: Apply only; immutable successful preflight run
        required: false
        default: ""
        type: string
      preflight_run_attempt:
        description: Apply only; immutable successful preflight attempt
        required: false
        default: ""
        type: string
      expected_apply_receipt_sha256:
        description: Rollback only; exact active apply receipt
        required: false
        default: ""
        type: string
      expected_rollback_authorization_sha256:
        description: Rollback only; exact rollback authorization
        required: false
        default: ""
        type: string
      operator_approval_phrase:
        description: Apply/rollback only; exact receipt-bound approval phrase
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: career-search-entry-batch-apply-production-ops
  cancel-in-progress: false

jobs:
  eligibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.validate.outputs.mode }}
      control_plane_sha: ${{ steps.validate.outputs.control_plane_sha }}
      release_sha: ${{ steps.validate.outputs.release_sha }}
      release_name: ${{ steps.validate.outputs.release_name }}
      actor_admin_user_id: ${{ steps.validate.outputs.actor_admin_user_id }}
      operation_id: ${{ steps.validate.outputs.operation_id }}
      rollback_identifier: ${{ steps.validate.outputs.rollback_identifier }}
      review_evidence_sha256: ${{ steps.validate.outputs.review_evidence_sha256 }}
    steps:
      - name: Checkout exact control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.expected_control_plane_sha }}
          fetch-depth: 0

      - name: Validate latest main, review receipt, and exact operation approval
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          EXPECTED_CONTROL_PLANE_SHA: ${{ inputs.expected_control_plane_sha }}
          EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
          EXPECTED_RELEASE_NAME: ${{ inputs.expected_release_name }}
          ACTOR_ADMIN_USER_ID: ${{ inputs.actor_admin_user_id }}
          OPERATION_ID: ${{ inputs.operation_id }}
          ROLLBACK_IDENTIFIER: ${{ inputs.rollback_identifier }}
          REVIEW_BIND_RUN_ID: ${{ inputs.review_bind_run_id }}
          REVIEW_BIND_RUN_ATTEMPT: ${{ inputs.review_bind_run_attempt }}
          EXPECTED_REVIEW_EVIDENCE_SHA256: ${{ inputs.expected_review_evidence_sha256 }}
          EXPECTED_STATE_SHA256: ${{ inputs.expected_state_sha256 }}
          EXPECTED_QUALITY_PACKAGE_SHA256: ${{ inputs.expected_quality_package_sha256 }}
          EXPECTED_REVIEW_PACKAGE_SHA256: ${{ inputs.expected_review_package_sha256 }}
          EXPECTED_TARGET_SET_SHA256: ${{ inputs.expected_target_set_sha256 }}
          PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
          PREFLIGHT_RUN_ATTEMPT: ${{ inputs.preflight_run_attempt }}
          EXPECTED_APPLY_RECEIPT_SHA256: ${{ inputs.expected_apply_receipt_sha256 }}
          EXPECTED_ROLLBACK_AUTHORIZATION_SHA256: ${{ inputs.expected_rollback_authorization_sha256 }}
          OPERATOR_APPROVAL_PHRASE: ${{ inputs.operator_approval_phrase }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$EXPECTED_CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_RELEASE_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          [[ "$ACTOR_ADMIN_USER_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$OPERATION_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$ ]]
          [[ "$ROLLBACK_IDENTIFIER" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{0,190}$ ]]
          [[ "$REVIEW_BIND_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$REVIEW_BIND_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_REVIEW_EVIDENCE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_CONTROL_PLANE_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_CONTROL_PLANE_SHA"
          test "$EXPECTED_RELEASE_SHA" = "$EXPECTED_CONTROL_PLANE_SHA"
          git merge-base --is-ancestor "$EXPECTED_RELEASE_SHA" origin/main

          review_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${REVIEW_BIND_RUN_ID}")"
          jq -e \
            --arg sha "$EXPECTED_CONTROL_PLANE_SHA" \
            --argjson attempt "$REVIEW_BIND_RUN_ATTEMPT" \
            '.name == "Career Search Entry Batch Review Production Ops"
             and .path == ".github/workflows/career-search-entry-batch-review-production-ops.yml"
             and .event == "workflow_dispatch"
             and .status == "completed"
             and .conclusion == "success"
             and .head_branch == "main"
             and .head_sha == $sha
             and .run_attempt == $attempt' <<<"$review_run" >/dev/null
          review_dir="$(mktemp -d)"
          gh run download "$REVIEW_BIND_RUN_ID" \
            --name "career-search-entry-batch-review-bind-${REVIEW_BIND_RUN_ID}-${REVIEW_BIND_RUN_ATTEMPT}" \
            --dir "$review_dir"
          review_receipt="$review_dir/career-search-entry-batch-review-production-ops.json"
          jq -e \
            --arg release "$EXPECTED_RELEASE_SHA" \
            --arg release_name "$EXPECTED_RELEASE_NAME" \
            --arg evidence "$EXPECTED_REVIEW_EVIDENCE_SHA256" \
            --argjson actor "$ACTOR_ADMIN_USER_ID" \
            '.contract_version == "career.search_entry_batch.review.production_ops.v1"
             and .status == "PASS_BIND"
             and .release_sha == $release
             and .release_name == $release_name
             and .review_evidence_sha256 == $evidence
             and .actor_admin_user_id == $actor
             and .candidate_count == 50
             and .bilingual_url_count == 100
             and .review_target_count == 300
             and (.review_write_count == 301 or .review_write_count == 0)
             and .publication_write_count == 0
             and .indexability_write_count == 0
             and .cache_write_count == 0
             and .queue_dispatch_count == 0
             and .sitemap_write_count == 0
             and .llms_write_count == 0
             and .search_channel_action_count == 0
             and .url_submission_count == 0
             and .deploy_count == 0' "$review_receipt" >/dev/null

          case "$MODE" in
            preflight)
              test -z "$EXPECTED_STATE_SHA256"
              test -z "$PREFLIGHT_RUN_ID"
              test -z "$PREFLIGHT_RUN_ATTEMPT"
              test -z "$OPERATOR_APPROVAL_PHRASE"
              ;;
            apply)
              [[ "$EXPECTED_STATE_SHA256" =~ ^[0-9a-f]{64}$ ]]
              [[ "$EXPECTED_QUALITY_PACKAGE_SHA256" =~ ^[0-9a-f]{64}$ ]]
              [[ "$EXPECTED_REVIEW_PACKAGE_SHA256" =~ ^[0-9a-f]{64}$ ]]
              [[ "$EXPECTED_TARGET_SET_SHA256" =~ ^[0-9a-f]{64}$ ]]
              [[ "$PREFLIGHT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
              [[ "$PREFLIGHT_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
              preflight_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREFLIGHT_RUN_ID}")"
              jq -e \
                --arg sha "$EXPECTED_CONTROL_PLANE_SHA" \
                --argjson attempt "$PREFLIGHT_RUN_ATTEMPT" \
                '.name == "Career Search Entry Batch Apply Production Ops"
                 and .path == ".github/workflows/career-search-entry-batch-apply-production-ops.yml"
                 and .event == "workflow_dispatch"
                 and .status == "completed"
                 and .conclusion == "success"
                 and .head_branch == "main"
                 and .head_sha == $sha
                 and .run_attempt == $attempt' <<<"$preflight_run" >/dev/null
              preflight_dir="$(mktemp -d)"
              gh run download "$PREFLIGHT_RUN_ID" \
                --name "career-search-entry-batch-apply-preflight-${PREFLIGHT_RUN_ID}-${PREFLIGHT_RUN_ATTEMPT}" \
                --dir "$preflight_dir"
              receipt="$preflight_dir/career-search-entry-batch-apply-production-ops.json"
              jq -e \
                --arg release "$EXPECTED_RELEASE_SHA" \
                --arg release_name "$EXPECTED_RELEASE_NAME" \
                --arg operation "$OPERATION_ID" \
                --arg rollback "$ROLLBACK_IDENTIFIER" \
                --arg state "$EXPECTED_STATE_SHA256" \
                --arg quality "$EXPECTED_QUALITY_PACKAGE_SHA256" \
                --arg review "$EXPECTED_REVIEW_PACKAGE_SHA256" \
                --arg targets "$EXPECTED_TARGET_SET_SHA256" \
                --arg evidence "$EXPECTED_REVIEW_EVIDENCE_SHA256" \
                '.contract_version == "career.search_entry_batch.apply.production_ops.v1"
                 and .status == "PASS_PREFLIGHT"
                 and .release_sha == $release
                 and .release_name == $release_name
                 and .operation_id == $operation
                 and .rollback_identifier == $rollback
                 and .preflight_state_sha256 == $state
                 and .quality_package_sha256 == $quality
                 and .review_package_sha256 == $review
                 and .target_set_sha256 == $targets
                 and .review_evidence_sha256 == $evidence
                 and .candidate_count == 50
                 and .bilingual_url_count == 100
                 and .operation_write_count == 0
                 and .publication_write_count == 0
                 and .indexability_write_count == 0
                 and .cache_write_count == 0
                 and .queue_dispatch_count == 0
                 and .sitemap_write_count == 0
                 and .llms_write_count == 0
                 and .search_channel_action_count == 0
                 and .url_submission_count == 0
                 and .deploy_count == 0' "$receipt" >/dev/null
              expected_phrase="I explicitly approve Career search-entry batch apply for SHA ${EXPECTED_RELEASE_SHA} release ${EXPECTED_RELEASE_NAME} preflight run ${PREFLIGHT_RUN_ID} attempt ${PREFLIGHT_RUN_ATTEMPT} state ${EXPECTED_STATE_SHA256} operation ${OPERATION_ID} quality package ${EXPECTED_QUALITY_PACKAGE_SHA256} review package ${EXPECTED_REVIEW_PACKAGE_SHA256} target set ${EXPECTED_TARGET_SET_SHA256} review evidence ${EXPECTED_REVIEW_EVIDENCE_SHA256} actor ${ACTOR_ADMIN_USER_ID} rollback ${ROLLBACK_IDENTIFIER}; append exactly one apply receipt for 50 slugs and 100 bilingual URLs and keep CMS, publication, indexability, cache warm, queue, sitemap, llms, Search Channel, URL submission, and deploy held."
              test "$OPERATOR_APPROVAL_PHRASE" = "$expected_phrase"
              ;;
            rollback)
              [[ "$EXPECTED_APPLY_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
              [[ "$EXPECTED_ROLLBACK_AUTHORIZATION_SHA256" =~ ^[0-9a-f]{64}$ ]]
              expected_phrase="I explicitly approve Career search-entry batch rollback for SHA ${EXPECTED_RELEASE_SHA} release ${EXPECTED_RELEASE_NAME} operation ${OPERATION_ID} apply receipt ${EXPECTED_APPLY_RECEIPT_SHA256} rollback authorization ${EXPECTED_ROLLBACK_AUTHORIZATION_SHA256} rollback ${ROLLBACK_IDENTIFIER} actor ${ACTOR_ADMIN_USER_ID}; append exactly one rollback receipt and keep CMS, publication, indexability, cache warm, queue, sitemap, llms, Search Channel, URL submission, and deploy held."
              test "$OPERATOR_APPROVAL_PHRASE" = "$expected_phrase"
              ;;
            *)
              exit 2
              ;;
          esac
          {
            echo "mode=$MODE"
            echo "control_plane_sha=$EXPECTED_CONTROL_PLANE_SHA"
            echo "release_sha=$EXPECTED_RELEASE_SHA"
            echo "release_name=$EXPECTED_RELEASE_NAME"
            echo "actor_admin_user_id=$ACTOR_ADMIN_USER_ID"
            echo "operation_id=$OPERATION_ID"
            echo "rollback_identifier=$ROLLBACK_IDENTIFIER"
            echo "review_evidence_sha256=$EXPECTED_REVIEW_EVIDENCE_SHA256"
          } >> "$GITHUB_OUTPUT"

  operate:
    needs: eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    concurrency:
      group: deploy-${{ github.repository }}-production
      cancel-in-progress: false
    env:
      DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
      DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
      RETIRED_DEPLOY_HOST: ${{ secrets.PRODUCTION_RETIRED_DEPLOY_HOST }}
      DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
      MODE: ${{ needs.eligibility.outputs.mode }}
      CONTROL_PLANE_SHA: ${{ needs.eligibility.outputs.control_plane_sha }}
      EXPECTED_RELEASE_SHA: ${{ needs.eligibility.outputs.release_sha }}
      EXPECTED_RELEASE_NAME: ${{ needs.eligibility.outputs.release_name }}
      ACTOR_ADMIN_USER_ID: ${{ needs.eligibility.outputs.actor_admin_user_id }}
      OPERATION_ID: ${{ needs.eligibility.outputs.operation_id }}
      ROLLBACK_IDENTIFIER: ${{ needs.eligibility.outputs.rollback_identifier }}
      EXPECTED_REVIEW_EVIDENCE_SHA256: ${{ needs.eligibility.outputs.review_evidence_sha256 }}
      EXPECTED_APPLY_RECEIPT_SHA256: ${{ inputs.expected_apply_receipt_sha256 }}
      EXPECTED_ROLLBACK_AUTHORIZATION_SHA256: ${{ inputs.expected_rollback_authorization_sha256 }}
    steps:
      - name: Checkout exact control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.eligibility.outputs.control_plane_sha }}
          fetch-depth: 1

      - name: Validate protected production topology
        shell: bash
        run: |
          set -euo pipefail
          for name in DEPLOY_USER DEPLOY_PORT DEPLOY_HOST RETIRED_DEPLOY_HOST DEPLOY_PATH; do
            test -n "${!name:-}"
          done
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          test "$DEPLOY_PORT" -ge 1
          test "$DEPLOY_PORT" -le 65535
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$RETIRED_DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          test "$DEPLOY_HOST" != "$RETIRED_DEPLOY_HOST"
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_PATH" != *".."* ]]
          echo "Protected production topology validated without disclosing values."

      - name: Set up SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known hosts
        shell: bash
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null \
            || ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f ~/.ssh/known_hosts >/dev/null

      - name: Run exact apply phase against active release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for name in MODE DEPLOY_PATH EXPECTED_RELEASE_SHA EXPECTED_RELEASE_NAME ACTOR_ADMIN_USER_ID OPERATION_ID ROLLBACK_IDENTIFIER EXPECTED_REVIEW_EVIDENCE_SHA256 EXPECTED_APPLY_RECEIPT_SHA256 EXPECTED_ROLLBACK_AUTHORIZATION_SHA256; do
            printf -v "q_${name,,}" '%q' "${!name}"
          done
          set +e
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "CAREER_APPLY_MODE=$q_mode DEPLOY_PATH=$q_deploy_path EXPECTED_RELEASE_SHA=$q_expected_release_sha EXPECTED_RELEASE_NAME=$q_expected_release_name ACTOR_ADMIN_USER_ID=$q_actor_admin_user_id OPERATION_ID=$q_operation_id ROLLBACK_IDENTIFIER=$q_rollback_identifier EXPECTED_REVIEW_EVIDENCE_SHA256=$q_expected_review_evidence_sha256 EXPECTED_APPLY_RECEIPT_SHA256=$q_expected_apply_receipt_sha256 EXPECTED_ROLLBACK_AUTHORIZATION_SHA256=$q_expected_rollback_authorization_sha256 bash -s" \
            < backend/scripts/career/career_search_entry_batch_apply_production_ops.sh \
            > artifacts/remote-receipt.json
          remote_status=$?
          set -e
          jq \
            --arg control "$CONTROL_PLANE_SHA" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            '. + {
              control_plane_sha: $control,
              workflow_run_id: $run_id,
              workflow_run_attempt: $run_attempt
            }' artifacts/remote-receipt.json \
            > artifacts/career-search-entry-batch-apply-production-ops.json
          test "$remote_status" -eq 0
          if [ "$MODE" = "preflight" ]; then
            state="$(jq -er '.preflight_state_sha256' artifacts/career-search-entry-batch-apply-production-ops.json)"
            quality="$(jq -er '.quality_package_sha256' artifacts/career-search-entry-batch-apply-production-ops.json)"
            review="$(jq -er '.review_package_sha256' artifacts/career-search-entry-batch-apply-production-ops.json)"
            targets="$(jq -er '.target_set_sha256' artifacts/career-search-entry-batch-apply-production-ops.json)"
            phrase="I explicitly approve Career search-entry batch apply for SHA ${EXPECTED_RELEASE_SHA} release ${EXPECTED_RELEASE_NAME} preflight run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT} state ${state} operation ${OPERATION_ID} quality package ${quality} review package ${review} target set ${targets} review evidence ${EXPECTED_REVIEW_EVIDENCE_SHA256} actor ${ACTOR_ADMIN_USER_ID} rollback ${ROLLBACK_IDENTIFIER}; append exactly one apply receipt for 50 slugs and 100 bilingual URLs and keep CMS, publication, indexability, cache warm, queue, sitemap, llms, Search Channel, URL submission, and deploy held."
            jq --arg phrase "$phrase" '. + {exact_apply_approval_phrase: $phrase}' \
              artifacts/career-search-entry-batch-apply-production-ops.json \
              > artifacts/final.json
            mv artifacts/final.json artifacts/career-search-entry-batch-apply-production-ops.json
          fi

      - name: Upload sanitized immutable receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: career-search-entry-batch-apply-${{ needs.eligibility.outputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/career-search-entry-batch-apply-production-ops.json
          if-no-files-found: error
          retention-days: 90
