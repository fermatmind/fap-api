name: Backend Production Bootstrap Password Auth Diagnostic

on:
  workflow_dispatch:
    inputs:
      expected_control_plane_sha:
        description: Exact latest main SHA containing this diagnostic control
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-${{ github.repository }}-production
  cancel-in-progress: false

jobs:
  diagnose:
    name: Diagnose bootstrap password-only SSH without production writes
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      EXPECTED_CONTROL_PLANE_SHA: ${{ inputs.expected_control_plane_sha }}
      EXPECTED_ACTIVE_REVISION: ff8e9b5d2021f171cbceeb7a33677307c74df58c
      SOURCE_RUN_ID: "31260377996"
      SOURCE_RUN_ATTEMPT: "1"
      SOURCE_ARTIFACT_DIGEST_SHA256: 6ac8c6c7dd8687438c959806dfd9ec8420a32bf803ecb26b132c89a22ee00973
      SOURCE_RECEIPT_SHA256: 72ed1c5ff65cca98eb1807ba2554a5aacb4542acbb647e9784d7340a4cadc802
      SOURCE_CONTROL_PLANE_SHA: 226c95c20a421b03e2c367792d213da357ff51d6
      BOOTSTRAP_SSH_USER: ${{ secrets.PRODUCTION_ROOT_BOOTSTRAP_SSH_USER }}
      BOOTSTRAP_PASSWORD: ${{ secrets.PRODUCTION_ROOT_BOOTSTRAP_SUDO_PASSWORD }}
      DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
      DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
      DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}

    steps:
      - name: Initialize sanitized diagnostic receipt
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/backend-production-bootstrap-password-auth-diagnostic.json"
          jq -n \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg control "$EXPECTED_CONTROL_PLANE_SHA" \
            --arg active "$EXPECTED_ACTIVE_REVISION" \
            --arg source_run "$SOURCE_RUN_ID" \
            --arg source_attempt "$SOURCE_RUN_ATTEMPT" \
            --arg source_artifact "$SOURCE_ARTIFACT_DIGEST_SHA256" \
            --arg source_receipt "$SOURCE_RECEIPT_SHA256" \
            --arg source_control "$SOURCE_CONTROL_PLANE_SHA" \
            '{
              schema_version: "backend.production_bootstrap_password_auth_diagnostic.v1",
              status: "FAIL_DIAGNOSTIC_PROTOCOL",
              failed_stage: "initialize",
              run_id: $run_id,
              run_attempt: $run_attempt,
              control_plane_sha: $control,
              expected_active_revision: $active,
              source_authorization: {
                run_id: $source_run,
                run_attempt: $source_attempt,
                artifact_digest_sha256: $source_artifact,
                receipt_sha256: $source_receipt,
                control_plane_sha: $source_control
              },
              bootstrap_user_sha256: ("0" * 64),
              remote_user_sha256: ("0" * 64),
              secret_present: false,
              method_probe_attempted: false,
              password_method_offered: null,
              password_secret_tested: false,
              password_secret_accepted: false,
              remote_identity_match: false,
              active_revision_match: false,
              method_capture_deleted: true,
              password_capture_deleted: true,
              askpass_helper_deleted: true,
              raw_diagnostic_retained: false,
              checks: {
                source_receipt_valid: false,
                host_key_verified: false,
                transport_connected: false,
                remote_protocol_valid: false
              },
              production_write_execution: false,
              authorized_keys_write_count: 0,
              ssh_config_write_count: 0,
              account_password_write_count: 0,
              sudo_command_count: 0,
              remote_file_write_count: 0,
              service_restart_count: 0,
              deploy_count: 0,
              database_or_cms_write_count: 0,
              warm_or_publication_count: 0,
              discoverability_write_count: 0,
              writes_committed: false
            }' > "$receipt"

      - name: Check out exact main control plane
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0

      - name: Validate latest main and failed authorization evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/backend-production-bootstrap-password-auth-diagnostic.json"
          test "$GITHUB_REF" = refs/heads/main
          [[ "$EXPECTED_CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_ACTIVE_REVISION" = ff8e9b5d2021f171cbceeb7a33677307c74df58c
          test "$SOURCE_RUN_ID" = 31260377996
          test "$SOURCE_RUN_ATTEMPT" = 1
          test "$SOURCE_ARTIFACT_DIGEST_SHA256" = 6ac8c6c7dd8687438c959806dfd9ec8420a32bf803ecb26b132c89a22ee00973
          test "$SOURCE_RECEIPT_SHA256" = 72ed1c5ff65cca98eb1807ba2554a5aacb4542acbb647e9784d7340a4cadc802
          test "$SOURCE_CONTROL_PLANE_SHA" = 226c95c20a421b03e2c367792d213da357ff51d6
          git fetch --no-tags origin main
          test "$GITHUB_SHA" = "$EXPECTED_CONTROL_PLANE_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_CONTROL_PLANE_SHA"

          source_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
          jq -e \
            --arg attempt "$SOURCE_RUN_ATTEMPT" \
            --arg control "$SOURCE_CONTROL_PLANE_SHA" \
            '.name == "Backend Production Bootstrap SSH Key Authorization"
             and .path == ".github/workflows/backend-production-bootstrap-ssh-key-authorization.yml"
             and .event == "workflow_dispatch"
             and .status == "completed"
             and .conclusion == "failure"
             and (.run_attempt | tostring) == $attempt
             and .head_sha == $control' <<< "$source_run" >/dev/null

          artifact_name="backend-production-bootstrap-ssh-key-authorization-preflight-${SOURCE_RUN_ID}-${SOURCE_RUN_ATTEMPT}"
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100")"
          artifact_id="$(jq -er \
            --arg name "$artifact_name" \
            --arg digest "sha256:${SOURCE_ARTIFACT_DIGEST_SHA256}" \
            '[.artifacts[] | select(.name == $name)]
             | select(length == 1)
             | .[0]
             | select(.expired == false and .digest == $digest)
             | .id' <<< "$artifacts")"
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]

          source_dir="$(mktemp -d)"
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$artifact_name" \
            --dir "$source_dir"
          source_receipt="$source_dir/backend-production-bootstrap-ssh-key-authorization.json"
          test -f "$source_receipt"
          test ! -L "$source_receipt"
          test "$(sha256sum "$source_receipt" | awk '{print $1}')" = "$SOURCE_RECEIPT_SHA256"
          jq -e \
            --arg run "$SOURCE_RUN_ID" \
            --arg attempt "$SOURCE_RUN_ATTEMPT" \
            --arg control "$SOURCE_CONTROL_PLANE_SHA" \
            --arg active "$EXPECTED_ACTIVE_REVISION" \
            '.schema_version == "backend.production_bootstrap_ssh_key_authorization.v2"
             and .mode == "preflight"
             and .status == "FAIL_PASSWORD_SSH_AUTH"
             and .failed_stage == "password_ssh"
             and .run_id == $run
             and .run_attempt == $attempt
             and .control_plane_sha == $control
             and .active_revision == $active
             and .password_ssh_tested == true
             and .password_ssh_accepted == false
             and .exact_key_login_tested == true
             and .exact_key_login_accepted == false
             and .apply_eligible == false
             and .write_state == "NOT_ATTEMPTED"
             and .production_write_execution == false
             and .authorized_keys_write_count == 0
             and .remote_temp_file_write_count == 0
             and .ssh_config_write_count == 0
             and .service_restart_count == 0
             and .deploy_count == 0
             and .database_or_cms_write_count == 0
             and .warm_or_publication_count == 0
             and .discoverability_write_count == 0
             and .writes_committed == false' "$source_receipt" >/dev/null
          rm -r "$source_dir"

          jq '.checks.source_receipt_valid=true' "$receipt" > "$receipt.tmp"
          mv "$receipt.tmp" "$receipt"

      - name: Run isolated zero-write password authentication diagnostic
        shell: bash
        run: |
          set -Eeo pipefail
          receipt="$RUNNER_TEMP/backend-production-bootstrap-password-auth-diagnostic.json"
          zero_sha="$(printf '0%.0s' {1..64})"
          status=FAIL_DIAGNOSTIC_PROTOCOL
          failed_stage=diagnostic_input
          bootstrap_user_sha="$zero_sha"
          remote_user_sha="$zero_sha"
          secret_present=false
          method_probe_attempted=false
          password_method_offered=null
          password_secret_tested=false
          password_secret_accepted=false
          remote_identity_match=false
          active_revision_match=false
          host_key_verified=false
          transport_connected=false
          remote_protocol_valid=false
          method_capture=""
          password_capture=""
          askpass=""
          known_hosts=""
          method_capture_deleted=true
          password_capture_deleted=true
          askpass_helper_deleted=true

          cleanup_runner_files() {
            set +e
            if [ -n "$method_capture" ]; then rm -f -- "$method_capture"; fi
            if [ -n "$password_capture" ]; then rm -f -- "$password_capture"; fi
            if [ -n "$askpass" ]; then rm -f -- "$askpass"; fi
            if [ -n "$known_hosts" ]; then rm -f -- "$known_hosts"; fi
            if [ -z "$method_capture" ] || { [ ! -e "$method_capture" ] && [ ! -L "$method_capture" ]; }; then method_capture_deleted=true; else method_capture_deleted=false; fi
            if [ -z "$password_capture" ] || { [ ! -e "$password_capture" ] && [ ! -L "$password_capture" ]; }; then password_capture_deleted=true; else password_capture_deleted=false; fi
            if [ -z "$askpass" ] || { [ ! -e "$askpass" ] && [ ! -L "$askpass" ]; }; then askpass_helper_deleted=true; else askpass_helper_deleted=false; fi
          }

          update_receipt() {
            jq \
              --arg status "$status" \
              --arg failed_stage "$failed_stage" \
              --arg bootstrap_user_sha "$bootstrap_user_sha" \
              --arg remote_user_sha "$remote_user_sha" \
              --argjson secret_present "$secret_present" \
              --argjson method_probe_attempted "$method_probe_attempted" \
              --argjson password_method_offered "$password_method_offered" \
              --argjson password_secret_tested "$password_secret_tested" \
              --argjson password_secret_accepted "$password_secret_accepted" \
              --argjson remote_identity_match "$remote_identity_match" \
              --argjson active_revision_match "$active_revision_match" \
              --argjson method_capture_deleted "$method_capture_deleted" \
              --argjson password_capture_deleted "$password_capture_deleted" \
              --argjson askpass_helper_deleted "$askpass_helper_deleted" \
              --argjson host_key_verified "$host_key_verified" \
              --argjson transport_connected "$transport_connected" \
              --argjson remote_protocol_valid "$remote_protocol_valid" \
              '.status=$status
               | .failed_stage=$failed_stage
               | .bootstrap_user_sha256=$bootstrap_user_sha
               | .remote_user_sha256=$remote_user_sha
               | .secret_present=$secret_present
               | .method_probe_attempted=$method_probe_attempted
               | .password_method_offered=$password_method_offered
               | .password_secret_tested=$password_secret_tested
               | .password_secret_accepted=$password_secret_accepted
               | .remote_identity_match=$remote_identity_match
               | .active_revision_match=$active_revision_match
               | .method_capture_deleted=$method_capture_deleted
               | .password_capture_deleted=$password_capture_deleted
               | .askpass_helper_deleted=$askpass_helper_deleted
               | .raw_diagnostic_retained=false
               | .checks.host_key_verified=$host_key_verified
               | .checks.transport_connected=$transport_connected
               | .checks.remote_protocol_valid=$remote_protocol_valid' \
              "$receipt" > "$receipt.tmp"
            mv "$receipt.tmp" "$receipt"
            printf 'CONTROL_STATUS=%s\n' "$status" >> "$GITHUB_ENV"
          }

          finish() {
            trap - ERR
            set +e
            cleanup_runner_files
            update_receipt
            exit 0
          }

          # Invoked by the ERR trap below.
          # shellcheck disable=SC2329
          unexpected_failure() {
            trap - ERR
            set +e
            status=FAIL_DIAGNOSTIC_PROTOCOL
            failed_stage=unexpected_runner_failure
            finish
          }
          trap unexpected_failure ERR

          if [ -n "$BOOTSTRAP_PASSWORD" ]; then secret_present=true; fi
          if [ -z "$BOOTSTRAP_SSH_USER" ] || [[ ! "$BOOTSTRAP_SSH_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]]; then finish; fi
          bootstrap_user_sha="$(printf '%s' "$BOOTSTRAP_SSH_USER" | sha256sum | awk '{print $1}')"
          if [ "$secret_present" != true ] || [ "${BOOTSTRAP_PASSWORD//$'\n'/}" != "$BOOTSTRAP_PASSWORD" ] || [ "${BOOTSTRAP_PASSWORD//$'\r'/}" != "$BOOTSTRAP_PASSWORD" ]; then finish; fi
          if [ -z "$DEPLOY_HOST" ] || [[ ! "$DEPLOY_PORT" =~ ^[1-9][0-9]{0,4}$ ]] || (( DEPLOY_PORT > 65535 )); then finish; fi
          if [[ "$DEPLOY_PATH" != /* ]] || [ "${DEPLOY_PATH//$'\n'/}" != "$DEPLOY_PATH" ] || [ -z "$SSH_KNOWN_HOSTS" ]; then finish; fi

          known_hosts="$RUNNER_TEMP/bootstrap-password-diagnostic-known-hosts"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$known_hosts"
          chmod 600 "$known_hosts"
          method_capture="$(mktemp "$RUNNER_TEMP/bootstrap-auth-methods.XXXXXX")"
          chmod 600 "$method_capture"
          method_probe_attempted=true
          failed_stage=method_probe

          if ssh -F /dev/null -vv \
            -o BatchMode=yes \
            -o PubkeyAuthentication=no \
            -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no \
            -o GSSAPIAuthentication=no \
            -o HostbasedAuthentication=no \
            -o NumberOfPasswordPrompts=0 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" \
            -o ConnectTimeout=10 \
            -p "$DEPLOY_PORT" \
            "$BOOTSTRAP_SSH_USER@$DEPLOY_HOST" true \
            >/dev/null 2>"$method_capture"; then
            method_rc=0
          else
            method_rc=$?
          fi
          classification="$(.github/scripts/classify-bootstrap-ssh-auth-methods.sh "$method_capture")"
          rm -f -- "$method_capture"
          if [ -e "$method_capture" ] || [ -L "$method_capture" ]; then
            status=FAIL_DIAGNOSTIC_PROTOCOL
            finish
          fi
          method_capture_deleted=true
          method_capture=""
          if [ "$method_rc" -eq 0 ]; then
            status=FAIL_DIAGNOSTIC_PROTOCOL
            finish
          fi

          case "$classification" in
            PASSWORD_OFFERED)
              password_method_offered=true
              host_key_verified=true
              transport_connected=true
              ;;
            PASSWORD_NOT_OFFERED)
              password_method_offered=false
              host_key_verified=true
              transport_connected=true
              status=BLOCKED_PASSWORD_AUTH_NOT_OFFERED
              finish
              ;;
            FAIL_HOST_KEY|FAIL_TRANSPORT)
              status=FAIL_TRANSPORT_OR_HOST_KEY
              finish
              ;;
            *)
              status=FAIL_DIAGNOSTIC_PROTOCOL
              finish
              ;;
          esac

          askpass="$RUNNER_TEMP/bootstrap-password-diagnostic-askpass"
          cat > "$askpass" <<'ASKPASS'
          #!/usr/bin/env bash
          printf '%s\n' "$BOOTSTRAP_PASSWORD"
          ASKPASS
          chmod 700 "$askpass"
          password_capture="$(mktemp "$RUNNER_TEMP/bootstrap-password-auth.XXXXXX")"
          chmod 600 "$password_capture"
          deploy_path_b64="$(printf '%s' "$DEPLOY_PATH" | base64 -w0)"
          password_secret_tested=true
          failed_stage=password_probe

          export SSH_ASKPASS="$askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=:0
          if password_result="$(setsid -w ssh -F /dev/null \
            -o BatchMode=no \
            -o PubkeyAuthentication=no \
            -o PasswordAuthentication=yes \
            -o KbdInteractiveAuthentication=no \
            -o GSSAPIAuthentication=no \
            -o HostbasedAuthentication=no \
            -o PreferredAuthentications=password \
            -o NumberOfPasswordPrompts=1 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" \
            -o ConnectTimeout=10 \
            -p "$DEPLOY_PORT" \
            "$BOOTSTRAP_SSH_USER@$DEPLOY_HOST" \
            "bash -s -- '$deploy_path_b64' '$EXPECTED_ACTIVE_REVISION'" \
            2>"$password_capture" <<'REMOTE'
          set -euo pipefail
          DEPLOY_PATH="$(printf '%s' "$1" | base64 -d)"
          EXPECTED_ACTIVE_REVISION="$2"
          remote_user_sha="$(printf '%s' "$(id -un)" | sha256sum | awk '{print $1}')"
          active_match=false
          if [ -r "$DEPLOY_PATH/current/REVISION" ] && [ "$(tr -d '\r\n' < "$DEPLOY_PATH/current/REVISION")" = "$EXPECTED_ACTIVE_REVISION" ]; then
            active_match=true
          fi
          printf 'PASSWORD_AUTH_DIAGNOSTIC_V1|%s|%s\n' "$remote_user_sha" "$active_match"
          REMOTE
          )"; then
            password_rc=0
          else
            password_rc=$?
          fi
          unset SSH_ASKPASS SSH_ASKPASS_REQUIRE DISPLAY

          password_classification=""
          if [ "$password_rc" -ne 0 ]; then
            password_classification="$(.github/scripts/classify-bootstrap-ssh-auth-methods.sh "$password_capture" password-result)"
          fi
          rm -f -- "$password_capture" "$askpass"
          if [ -e "$password_capture" ] || [ -L "$password_capture" ] || [ -e "$askpass" ] || [ -L "$askpass" ]; then
            status=FAIL_DIAGNOSTIC_PROTOCOL
            finish
          fi
          password_capture_deleted=true
          askpass_helper_deleted=true
          password_capture=""
          askpass=""
          unset BOOTSTRAP_PASSWORD

          if [ "$password_rc" -ne 0 ]; then
            password_secret_accepted=false
            case "$password_classification" in
              FAIL_HOST_KEY|FAIL_TRANSPORT) status=FAIL_TRANSPORT_OR_HOST_KEY ;;
              PASSWORD_REJECTED) status=FAIL_SECRET_PASSWORD_REJECTED ;;
              *) status=FAIL_DIAGNOSTIC_PROTOCOL ;;
            esac
            finish
          fi

          password_secret_accepted=true
          protocol=INVALID
          active_match=false
          extra=""
          IFS='|' read -r protocol remote_user_sha active_match extra <<< "$password_result"
          if [ "$protocol" != PASSWORD_AUTH_DIAGNOSTIC_V1 ] || [[ ! "$remote_user_sha" =~ ^[0-9a-f]{64}$ ]] || [[ ! "$active_match" =~ ^(true|false)$ ]] || [ -n "$extra" ]; then
            status=FAIL_DIAGNOSTIC_PROTOCOL
            finish
          fi
          remote_protocol_valid=true
          if [ "$remote_user_sha" != "$bootstrap_user_sha" ]; then
            status=FAIL_REMOTE_IDENTITY
            finish
          fi
          remote_identity_match=true
          if [ "$active_match" != true ]; then
            status=FAIL_ACTIVE_REVISION
            finish
          fi
          active_revision_match=true
          status=PASS_PASSWORD_AUTH_DIAGNOSTIC
          failed_stage=none
          finish

      - name: Upload immutable password auth diagnostic receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-production-bootstrap-password-auth-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/backend-production-bootstrap-password-auth-diagnostic.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce terminal password auth diagnostic result
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/backend-production-bootstrap-password-auth-diagnostic.json"
          jq -e \
            '.schema_version == "backend.production_bootstrap_password_auth_diagnostic.v1"
             and .status == "PASS_PASSWORD_AUTH_DIAGNOSTIC"
             and .failed_stage == "none"
             and .secret_present == true
             and .method_probe_attempted == true
             and .password_method_offered == true
             and .password_secret_tested == true
             and .password_secret_accepted == true
             and .remote_identity_match == true
             and .active_revision_match == true
             and .method_capture_deleted == true
             and .password_capture_deleted == true
             and .askpass_helper_deleted == true
             and .raw_diagnostic_retained == false
             and .checks.source_receipt_valid == true
             and .checks.host_key_verified == true
             and .checks.transport_connected == true
             and .checks.remote_protocol_valid == true
             and .production_write_execution == false
             and .authorized_keys_write_count == 0
             and .ssh_config_write_count == 0
             and .account_password_write_count == 0
             and .sudo_command_count == 0
             and .remote_file_write_count == 0
             and .service_restart_count == 0
             and .deploy_count == 0
             and .database_or_cms_write_count == 0
             and .warm_or_publication_count == 0
             and .discoverability_write_count == 0
             and .writes_committed == false' "$receipt" >/dev/null
          echo "PASS_PASSWORD_AUTH_DIAGNOSTIC"
