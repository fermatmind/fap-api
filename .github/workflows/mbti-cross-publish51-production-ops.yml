name: MBTI Cross Publish 51 Production Ops

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Exact controlled phase; preflight is read-only and apply requires its immutable receipt
        required: true
        type: choice
        options:
          - content_preflight
          - content_apply
          - indexability_preflight
          - indexability_apply
      expected_control_plane_sha:
        description: Exact latest main SHA containing this control plane
        required: true
        type: string
      expected_active_revision:
        description: Exact active production application SHA
        required: true
        type: string
      expected_state_sha256:
        description: Apply only; current-state SHA for content or content-readback SHA for indexability
        required: false
        default: ""
        type: string
      preflight_run_id:
        description: Apply only; immutable successful matching preflight run
        required: false
        default: ""
        type: string
      preflight_run_attempt:
        description: Apply only; immutable successful matching preflight attempt
        required: false
        default: ""
        type: string
      operator_approval_phrase:
        description: Apply only; exact Publisher 49 command-generated production authorization
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: mbti-cross-publish51-production-ops
  cancel-in-progress: false

jobs:
  eligibility:
    name: Resolve exact MBTI cross publish eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.validate.outputs.mode }}
      control_plane_sha: ${{ steps.validate.outputs.control_plane_sha }}
      active_revision: ${{ steps.validate.outputs.active_revision }}
      expected_state_sha256: ${{ steps.validate.outputs.expected_state_sha256 }}
    steps:
      - name: Checkout exact control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.expected_control_plane_sha }}
          fetch-depth: 1

      - name: Validate latest control plane and immutable phase receipt
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          EXPECTED_CONTROL_PLANE_SHA: ${{ inputs.expected_control_plane_sha }}
          EXPECTED_ACTIVE_REVISION: ${{ inputs.expected_active_revision }}
          EXPECTED_STATE_SHA256: ${{ inputs.expected_state_sha256 }}
          PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
          PREFLIGHT_RUN_ATTEMPT: ${{ inputs.preflight_run_attempt }}
          OPERATOR_APPROVAL_PHRASE: ${{ inputs.operator_approval_phrase }}
          PACKAGE_SHA256: 604851b56031d22d48036e87a5358bf85c9e13268655dbe36d2ab798b3f58dae
          EDITORIAL_AUTHORIZATION_SHA256: be4f17484334074cf2c90d57898ab80b6074093b2510a4b7b4b0432a164b4670
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$EXPECTED_CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_ACTIVE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_CONTROL_PLANE_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_CONTROL_PLANE_SHA"

          case "$MODE" in
            content_preflight|indexability_preflight)
              test -z "$EXPECTED_STATE_SHA256"
              test -z "$PREFLIGHT_RUN_ID"
              test -z "$PREFLIGHT_RUN_ATTEMPT"
              test -z "$OPERATOR_APPROVAL_PHRASE"
              ;;
            content_apply|indexability_apply)
              [[ "$EXPECTED_STATE_SHA256" =~ ^[0-9a-f]{64}$ ]]
              [[ "$PREFLIGHT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
              [[ "$PREFLIGHT_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
              if [ "$MODE" = content_apply ]; then
                preflight_mode=content_preflight
                expected_phrase="I explicitly approve MBTI-CROSS-PUBLISHER-49 production content write for package SHA ${PACKAGE_SHA256} authorization SHA ${EDITORIAL_AUTHORIZATION_SHA256} current state SHA ${EXPECTED_STATE_SHA256} covering only enfp-vs-entp, estj-vs-entj, and isfp-vs-infp; keep noindex, sitemap, llms, llms-full, and search submission held."
              else
                preflight_mode=indexability_preflight
                expected_phrase="I explicitly approve MBTI-CROSS-PUBLISHER-49 production indexability release for package SHA ${PACKAGE_SHA256} authorization SHA ${EDITORIAL_AUTHORIZATION_SHA256} successful content readback SHA ${EXPECTED_STATE_SHA256} covering only enfp-vs-entp, estj-vs-entj, and isfp-vs-infp; release indexability, sitemap, llms, and llms-full without body changes or search submission."
              fi
              test "$OPERATOR_APPROVAL_PHRASE" = "$expected_phrase"

              run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREFLIGHT_RUN_ID}")"
              jq -e \
                --arg sha "$EXPECTED_CONTROL_PLANE_SHA" \
                --argjson attempt "$PREFLIGHT_RUN_ATTEMPT" \
                '.name == "MBTI Cross Publish 51 Production Ops"
                 and .path == ".github/workflows/mbti-cross-publish51-production-ops.yml"
                 and .event == "workflow_dispatch"
                 and .status == "completed"
                 and .conclusion == "success"
                 and .head_branch == "main"
                 and .head_sha == $sha
                 and .run_attempt == $attempt' <<<"$run_json" >/dev/null

              receipt_dir="$(mktemp -d)"
              gh run download "$PREFLIGHT_RUN_ID" \
                --name "mbti-cross-publish51-${preflight_mode}-${PREFLIGHT_RUN_ID}-${PREFLIGHT_RUN_ATTEMPT}" \
                --dir "$receipt_dir"
              receipt="$receipt_dir/mbti-cross-publish51-production-ops.json"
              test -f "$receipt"
              jq -e \
                --arg mode "$preflight_mode" \
                --arg control "$EXPECTED_CONTROL_PLANE_SHA" \
                --arg active "$EXPECTED_ACTIVE_REVISION" \
                --arg package "$PACKAGE_SHA256" \
                --arg authorization "$EDITORIAL_AUTHORIZATION_SHA256" \
                --arg state "$EXPECTED_STATE_SHA256" \
                '.contract_version == "mbti.cross.publish51.production_ops.v1"
                 and .mode == $mode
                 and .status == "PASS_PREFLIGHT"
                 and .control_plane_sha == $control
                 and .active_revision == $active
                 and .package_sha256 == $package
                 and .editorial_authorization_sha256 == $authorization
                 and .record_count == 3
                 and .exact_slugs == ["enfp-vs-entp","estj-vs-entj","isfp-vs-infp"]
                 and .production_write_execution == false
                 and .content_write_count == 0
                 and .indexability_write_count == 0
                 and .search_submission_count == 0
                 and .frontend_revision == "841280ab35945e2c1454f5ac18ea3ededdfab5b6"
                 and (if $mode == "indexability_preflight"
                      then .cache_closeout_ready == true
                           and .frontend_revalidation_endpoint_count > 0
                      else true
                      end)
                 and (if $mode == "content_preflight"
                      then .current_state_sha256 == $state
                           and .cache_closeout_ready == true
                           and .frontend_revalidation_endpoint_count > 0
                      else .content_readback_sha256 == $state
                      end)' "$receipt" >/dev/null
              ;;
            *)
              echo "Unsupported MBTI cross production mode." >&2
              exit 2
              ;;
          esac

          {
            echo "mode=$MODE"
            echo "control_plane_sha=$EXPECTED_CONTROL_PLANE_SHA"
            echo "active_revision=$EXPECTED_ACTIVE_REVISION"
            echo "expected_state_sha256=$EXPECTED_STATE_SHA256"
          } >> "$GITHUB_OUTPUT"

  production-control:
    name: Run exact MBTI cross ${{ needs.eligibility.outputs.mode }}
    needs: eligibility
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    concurrency:
      group: deploy-${{ github.repository }}-production
      cancel-in-progress: false
    steps:
      - name: Checkout exact control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.eligibility.outputs.control_plane_sha }}
          fetch-depth: 1

      - name: Start pinned SSH agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known hosts
        shell: bash
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS"
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null \
            || ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f ~/.ssh/known_hosts >/dev/null

      - name: Revalidate latest control plane immediately before production operation
        shell: bash
        env:
          EXPECTED_CONTROL_PLANE_SHA: ${{ needs.eligibility.outputs.control_plane_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_CONTROL_PLANE_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_CONTROL_PLANE_SHA"

      - name: Run fixed production publisher phase
        id: operation
        shell: bash
        env:
          MODE: ${{ needs.eligibility.outputs.mode }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
          EXPECTED_ACTIVE_REVISION: ${{ needs.eligibility.outputs.active_revision }}
          EXPECTED_STATE_SHA256: ${{ needs.eligibility.outputs.expected_state_sha256 }}
          EXPECTED_FRONTEND_REVISION: 841280ab35945e2c1454f5ac18ea3ededdfab5b6
          OPERATOR_APPROVAL_PHRASE: ${{ inputs.operator_approval_phrase }}
          PACKAGE_SHA256: 604851b56031d22d48036e87a5358bf85c9e13268655dbe36d2ab798b3f58dae
          EDITORIAL_AUTHORIZATION_SHA256: be4f17484334074cf2c90d57898ab80b6074093b2510a4b7b4b0432a164b4670
        run: |
          set -euo pipefail
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_PATH" != *".."* ]]
          approval_b64="$(printf '%s' "$OPERATOR_APPROVAL_PHRASE" | base64 -w 0)"

          set +e
          result="$(timeout --signal=TERM --kill-after=10s 300s \
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "MODE='$MODE' DEPLOY_PATH='$DEPLOY_PATH' EXPECTED_ACTIVE_REVISION='$EXPECTED_ACTIVE_REVISION' EXPECTED_STATE_SHA256='$EXPECTED_STATE_SHA256' EXPECTED_FRONTEND_REVISION='$EXPECTED_FRONTEND_REVISION' APPROVAL_B64='$approval_b64' timeout --signal=TERM --kill-after=10s 270s bash -s" \
            2>"$RUNNER_TEMP/mbti-cross-publish51.err" <<'REMOTE'
          set -euo pipefail
          current="$(readlink -f "$DEPLOY_PATH/current")"
          test -d "$current/backend"
          test "$(tr -d '\r\n' < "$current/REVISION")" = "$EXPECTED_ACTIVE_REVISION"
          test ! -e "$DEPLOY_PATH/.dep/deploy.lock"
          cd "$current/backend"
          frontend_revision="$(
            curl -fsS --proto '=https' --max-redirs 0 \
              --connect-timeout 10 --max-time 30 \
              -H 'Accept: application/json' \
              -H 'Cache-Control: no-cache' \
              https://fermatmind.com/revision \
              | jq -er --arg expected "$EXPECTED_FRONTEND_REVISION" \
                  '.revision | select(. == $expected)'
          )"
          test "$frontend_revision" = "$EXPECTED_FRONTEND_REVISION"
          case "$MODE" in
            content_preflight)
              publisher_result="$(php artisan personality:mbti-cross-publisher49-content \
                --json --no-interaction --no-ansi)"
              cache_endpoint_count="$(php -r '
              require getcwd()."/vendor/autoload.php";
              $app = require getcwd()."/bootstrap/app.php";
              $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
              $endpoints = array_values(array_filter(array_map(
                  static fn (mixed $value): string => trim((string) $value),
                  (array) config("ops.content_release_observability.cache_invalidation_urls", [])
              )));
              $secret = trim((string) config("ops.content_release_observability.cache_invalidation_secret", ""));
              if ($endpoints === [] || $secret === "") {
                  throw new RuntimeException("Bounded frontend cache revalidation is not configured.");
              }
              echo count($endpoints);
              ')"
              jq -c \
                --argjson endpoint_count "$cache_endpoint_count" \
                --arg frontend_revision "$frontend_revision" \
                '. + {
                  cache_closeout_ready: true,
                  frontend_revalidation_endpoint_count: $endpoint_count,
                  frontend_revision: $frontend_revision
                }' <<<"$publisher_result"
              ;;
            content_apply)
              approval="$(printf '%s' "$APPROVAL_B64" | base64 -d)"
              publisher_result="$(php artisan personality:mbti-cross-publisher49-content \
                --execute \
                --expected-current-state-sha256="$EXPECTED_STATE_SHA256" \
                --production-authorization="$approval" \
                --json --no-interaction --no-ansi)"
              jq -e '
                .ok == true
                and .artifact == "mbti.cross.publisher49.content.v1"
                and .mode == "write"
                and (.status == "published_noindex" or .status == "already_applied")' \
                <<<"$publisher_result" >/dev/null

              php -r '
              require getcwd()."/vendor/autoload.php";
              $app = require getcwd()."/bootstrap/app.php";
              $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();

              $paths = [
                  "/zh/personality/enfp-vs-entp",
                  "/zh/personality/estj-vs-entj",
                  "/zh/personality/isfp-vs-infp",
              ];
              $endpoints = array_values(array_filter(array_map(
                  static fn (mixed $value): string => trim((string) $value),
                  (array) config("ops.content_release_observability.cache_invalidation_urls", [])
              )));
              $secret = trim((string) config("ops.content_release_observability.cache_invalidation_secret", ""));
              if ($endpoints === [] || $secret === "") {
                  throw new RuntimeException("Bounded frontend cache revalidation is not configured.");
              }
              $payload = [
                  "event" => "content_release_revalidate",
                  "source" => "mbti_cross_publish51_content_apply",
                  "content" => [
                      "type" => "mbti-cross-comparison",
                      "id" => 0,
                      "org_id" => 0,
                      "title" => "MBTI cross comparison exact-three noindex publish",
                      "slug" => "exact-three",
                      "locale" => "zh-CN",
                      "status" => "published",
                      "visibility" => "public",
                  ],
                  "cache_signal" => [
                      "kind" => "invalidate",
                      "paths" => $paths,
                      "urls" => $paths,
                  ],
              ];
              foreach ($endpoints as $endpoint) {
                  $response = Illuminate\Support\Facades\Http::acceptJson()
                      ->timeout(15)
                      ->withHeaders([
                          "X-FM-Content-Release-Source" => "mbti_cross_publish51_content_apply",
                          "X-FM-Content-Release-Token" => $secret,
                      ])
                      ->post($endpoint, $payload);
                  $body = $response->json();
                  $revalidated = is_array($body) ? (array) ($body["revalidated_paths"] ?? []) : [];
                  $rejected = is_array($body) ? (array) ($body["rejected_paths"] ?? []) : [];
                  sort($revalidated);
                  $expected = $paths;
                  sort($expected);
                  if (! $response->successful() || $rejected !== [] || $revalidated !== $expected) {
                      throw new RuntimeException("Bounded frontend noindex revalidation failed.");
                  }
              }
              ' >/dev/null

              page_readback_dir="$(mktemp -d)"
              trap 'rm -rf "$page_readback_dir"' EXIT
              for slug in enfp-vs-entp estj-vs-entj isfp-vs-infp; do
                page_url="https://fermatmind.com/zh/personality/$slug"
                curl -fsS --retry 3 --retry-delay 2 --retry-all-errors \
                  --connect-timeout 10 --max-time 60 \
                  -H 'Cache-Control: no-cache' \
                  "$page_url" >"$page_readback_dir/$slug.html"
                grep -F '<meta name="robots" content="noindex, follow"/>' \
                  "$page_readback_dir/$slug.html" >/dev/null
                grep -F "<link rel=\"canonical\" href=\"$page_url\"/>" \
                  "$page_readback_dir/$slug.html" >/dev/null
              done
              rm -rf "$page_readback_dir"
              trap - EXIT

              jq -c \
                --arg frontend_revision "$frontend_revision" \
                '. + {
                  content_cache_closeout_completed: true,
                  content_frontend_revalidation_path_count: 3,
                  frontend_revision: $frontend_revision,
                  public_page_readback_completed: true,
                  public_page_count: 3
                }' <<<"$publisher_result"
              ;;
            indexability_preflight)
              publisher_result="$(php artisan personality:mbti-cross-publisher49-indexability \
                --json --no-interaction --no-ansi)"
              cache_endpoint_count="$(php -r '
              require getcwd()."/vendor/autoload.php";
              $app = require getcwd()."/bootstrap/app.php";
              $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
              $endpoints = array_values(array_filter(array_map(
                  static fn (mixed $value): string => trim((string) $value),
                  (array) config("ops.content_release_observability.cache_invalidation_urls", [])
              )));
              $secret = trim((string) config("ops.content_release_observability.cache_invalidation_secret", ""));
              if ($endpoints === [] || $secret === "") {
                  throw new RuntimeException("Bounded frontend cache revalidation is not configured.");
              }
              echo count($endpoints);
              ')"
              jq -c \
                --argjson endpoint_count "$cache_endpoint_count" \
                --arg frontend_revision "$frontend_revision" \
                '. + {
                  cache_closeout_ready: true,
                  frontend_revalidation_endpoint_count: $endpoint_count,
                  frontend_revision: $frontend_revision
                }' <<<"$publisher_result"
              ;;
            indexability_apply)
              approval="$(printf '%s' "$APPROVAL_B64" | base64 -d)"
              publisher_result="$(php artisan personality:mbti-cross-publisher49-indexability \
                --execute \
                --content-readback-sha256="$EXPECTED_STATE_SHA256" \
                --production-authorization="$approval" \
                --json --no-interaction --no-ansi)"
              jq -e '
                .ok == true
                and .artifact == "mbti.cross.publisher49.indexability.v1"
                and .mode == "write"
                and (.status == "released" or .status == "already_released")' \
                <<<"$publisher_result" >/dev/null

              php -r '
              require getcwd()."/vendor/autoload.php";
              $app = require getcwd()."/bootstrap/app.php";
              $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();

              foreach ([
                  "seo:sitemap-source:v1:fresh",
                  "seo:sitemap:xml:v6",
                  "seo:sitemap:etag:v6",
                  "seo:llms-txt:v1:body",
                  "seo:llms-full-txt:v1:body",
              ] as $key) {
                  Illuminate\Support\Facades\Cache::forget($key);
              }
              ' >/dev/null

              sitemap_warm="$(php artisan seo:warm-sitemap-source-cache --json --no-interaction --no-ansi)"
              jq -e '.status == "warmed" and .count > 0' <<<"$sitemap_warm" >/dev/null

              php -r '
              require getcwd()."/vendor/autoload.php";
              $app = require getcwd()."/bootstrap/app.php";
              $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();

              $paths = [
                  "/zh/personality/enfp-vs-entp",
                  "/zh/personality/estj-vs-entj",
                  "/zh/personality/isfp-vs-infp",
                  "/sitemap.xml",
                  "/llms.txt",
                  "/llms-full.txt",
              ];
              $endpoints = array_values(array_filter(array_map(
                  static fn (mixed $value): string => trim((string) $value),
                  (array) config("ops.content_release_observability.cache_invalidation_urls", [])
              )));
              $secret = trim((string) config("ops.content_release_observability.cache_invalidation_secret", ""));
              if ($endpoints === [] || $secret === "") {
                  throw new RuntimeException("Bounded frontend cache revalidation is not configured.");
              }
              $payload = [
                  "event" => "content_release_revalidate",
                  "source" => "mbti_cross_publish51_indexability_apply",
                  "content" => [
                      "type" => "mbti-cross-comparison",
                      "id" => 0,
                      "org_id" => 0,
                      "title" => "MBTI cross comparison exact-three release",
                      "slug" => "exact-three",
                      "locale" => "zh-CN",
                      "status" => "published",
                      "visibility" => "public",
                  ],
                  "cache_signal" => [
                      "kind" => "invalidate",
                      "paths" => $paths,
                      "urls" => $paths,
                  ],
              ];
              foreach ($endpoints as $endpoint) {
                  $response = Illuminate\Support\Facades\Http::acceptJson()
                      ->timeout(15)
                      ->withHeaders([
                          "X-FM-Content-Release-Source" => "mbti_cross_publish51_indexability_apply",
                          "X-FM-Content-Release-Token" => $secret,
                      ])
                      ->post($endpoint, $payload);
                  $body = $response->json();
                  $revalidated = is_array($body) ? (array) ($body["revalidated_paths"] ?? []) : [];
                  $rejected = is_array($body) ? (array) ($body["rejected_paths"] ?? []) : [];
                  sort($revalidated);
                  $expected = $paths;
                  sort($expected);
                  if (! $response->successful() || $rejected !== [] || $revalidated !== $expected) {
                      throw new RuntimeException("Bounded frontend cache revalidation failed.");
                  }
              }
              ' >/dev/null

              readback_dir="$(mktemp -d)"
              trap 'rm -rf "$readback_dir"' EXIT
              readback_pids=()
              for surface in sitemap.xml llms.txt llms-full.txt; do
                (
                  curl -fsS --retry 3 --retry-delay 2 --retry-all-errors \
                    --connect-timeout 10 --max-time 60 \
                    -H 'Cache-Control: no-cache' \
                    "https://fermatmind.com/${surface}" \
                    >"$readback_dir/$surface"
                ) &
                readback_pids+=("$!")
              done
              for readback_pid in "${readback_pids[@]}"; do
                wait "$readback_pid"
              done
              for slug in enfp-vs-entp estj-vs-entj isfp-vs-infp; do
                expected_url="https://fermatmind.com/zh/personality/$slug"
                grep -F "$expected_url" "$readback_dir/sitemap.xml" >/dev/null
                grep -F "$expected_url" "$readback_dir/llms.txt" >/dev/null
                grep -F "$expected_url" "$readback_dir/llms-full.txt" >/dev/null
                curl -fsS --retry 3 --retry-delay 2 --retry-all-errors \
                  --connect-timeout 10 --max-time 60 \
                  -H 'Cache-Control: no-cache' \
                  "$expected_url" >"$readback_dir/$slug.html"
                grep -F '<meta name="robots" content="index, follow"/>' \
                  "$readback_dir/$slug.html" >/dev/null
                grep -F "<link rel=\"canonical\" href=\"$expected_url\"/>" \
                  "$readback_dir/$slug.html" >/dev/null
              done
              rm -rf "$readback_dir"
              trap - EXIT

              jq -c \
                --arg frontend_revision "$frontend_revision" \
                '. + {
                  cache_closeout_completed: true,
                  backend_cache_key_count: 5,
                  frontend_revalidation_path_count: 6,
                  frontend_revision: $frontend_revision,
                  public_page_readback_completed: true,
                  public_page_count: 3,
                  public_feed_readback_completed: true,
                  public_feed_count: 3
                }' <<<"$publisher_result"
              ;;
          esac
          post_current="$(readlink -f "$DEPLOY_PATH/current")"
          test "$post_current" = "$current"
          test "$(tr -d '\r\n' < "$post_current/REVISION")" = "$EXPECTED_ACTIVE_REVISION"
          test ! -e "$DEPLOY_PATH/.dep/deploy.lock"
          REMOTE
          )"
          ssh_rc=$?
          set -e
          if [ "$ssh_rc" -ne 0 ] || ! jq -e 'type == "object"' <<<"$result" >/dev/null 2>&1; then
            echo "MBTI_CROSS_PUBLISH51_REMOTE_OPERATION_FAILED" >&2
            exit 1
          fi

          jq -e \
            --arg package "$PACKAGE_SHA256" \
            --arg authorization "$EDITORIAL_AUTHORIZATION_SHA256" \
            '.ok == true
             and .record_count == 3
             and .exact_slugs == ["enfp-vs-entp","estj-vs-entj","isfp-vs-infp"]
             and .package_sha256 == $package
             and .editorial_authorization_sha256 == $authorization
             and .search_submission_executed == false' <<<"$result" >/dev/null

          case "$MODE" in
            content_preflight)
              jq -e '
                .artifact == "mbti.cross.publisher49.content.v1"
                and .mode == "dry_run"
                and (.status == "ready" or .status == "already_applied")
                and (.current_state_sha256 | test("^[0-9a-f]{64}$"))
                and (.desired_state_sha256 | test("^[0-9a-f]{64}$"))
                and .writes_committed == false
                and .indexability_mutated == false
                and .sitemap_or_llms_mutated == false
                and .cache_closeout_ready == true
                and .frontend_revalidation_endpoint_count > 0
                and .frontend_revision == "841280ab35945e2c1454f5ac18ea3ededdfab5b6"
                and (.readback | length) == 3' <<<"$result" >/dev/null
              ;;
            content_apply)
              jq -e \
                --arg state "$EXPECTED_STATE_SHA256" \
                '.artifact == "mbti.cross.publisher49.content.v1"
                 and .mode == "write"
                 and (.status == "published_noindex" or .status == "already_applied")
                 and .prewrite_state_sha256 == $state
                 and (.postwrite_state_sha256 | test("^[0-9a-f]{64}$"))
                 and (.content_readback_sha256 | test("^[0-9a-f]{64}$"))
                 and .indexability_mutated == false
                 and .sitemap_or_llms_mutated == false
                 and .frontend_revision == "841280ab35945e2c1454f5ac18ea3ededdfab5b6"
                 and .content_cache_closeout_completed == true
                 and .content_frontend_revalidation_path_count == 3
                 and .public_page_readback_completed == true
                 and .public_page_count == 3
                 and (.readback | length) == 3
                 and all(.readback[];
                   .publish_status == "published"
                   and .review_status == "approved"
                   and .is_public == true
                   and .is_indexable == false
                   and .sitemap_eligible == false
                   and .llms_eligible == false
                   and .search_submission_eligible == false
                   and .content_payload_json.robots == "noindex,follow"
                   and (.content_payload_json.sections | length) == 8
                   and (.content_payload_json.faq | length) == 8
                   and (.content_payload_json.internal_links | length) == 7)' <<<"$result" >/dev/null
              ;;
            indexability_preflight)
              jq -e '
                .artifact == "mbti.cross.publisher49.indexability.v1"
                and .mode == "dry_run"
                and (.status == "ready" or .status == "already_released")
                and (.required_content_readback_sha256 | test("^[0-9a-f]{64}$"))
                and (.content_fingerprint_sha256 | test("^[0-9a-f]{64}$"))
                and (.discoverability_state == "held" or .discoverability_state == "released")
                and .indexability_write_committed == false
                and .body_mutated == false
                and .cache_closeout_ready == true
                and .frontend_revalidation_endpoint_count > 0
                and .frontend_revision == "841280ab35945e2c1454f5ac18ea3ededdfab5b6"
                and (.readback | length) == 3' <<<"$result" >/dev/null
              ;;
            indexability_apply)
              jq -e \
                --arg state "$EXPECTED_STATE_SHA256" \
                '.artifact == "mbti.cross.publisher49.indexability.v1"
                 and .mode == "write"
                 and (.status == "released" or .status == "already_released")
                 and .required_content_readback_sha256 == $state
                 and (.content_fingerprint_sha256 | test("^[0-9a-f]{64}$"))
                 and .discoverability_state == "released"
                 and .body_mutated == false
                 and .cache_closeout_completed == true
                 and .backend_cache_key_count == 5
                 and .frontend_revalidation_path_count == 6
                 and .frontend_revision == "841280ab35945e2c1454f5ac18ea3ededdfab5b6"
                 and .public_page_readback_completed == true
                 and .public_page_count == 3
                 and .public_feed_readback_completed == true
                 and .public_feed_count == 3
                 and (.readback | length) == 3
                 and all(.readback[];
                   .publish_status == "published"
                   and .review_status == "approved"
                   and .is_public == true
                   and .is_indexable == true
                   and .sitemap_eligible == true
                   and .llms_eligible == true
                   and .search_submission_eligible == false
                   and .content_payload_json.robots == "index,follow"
                   and (.content_payload_json.sections | length) == 8
                   and (.content_payload_json.faq | length) == 8
                   and (.content_payload_json.internal_links | length) == 7)' <<<"$result" >/dev/null
              ;;
          esac

          mkdir -p artifacts
          rollback_sha256="$(jq -S -c '.rollback_manifest' <<<"$result" | sha256sum | awk '{print $1}')"
          approval_sha256="$(printf '%s' "$OPERATOR_APPROVAL_PHRASE" | sha256sum | awk '{print $1}')"
          jq -n \
            --arg mode "$MODE" \
            --arg control "${{ needs.eligibility.outputs.control_plane_sha }}" \
            --arg active "$EXPECTED_ACTIVE_REVISION" \
            --arg package "$PACKAGE_SHA256" \
            --arg authorization "$EDITORIAL_AUTHORIZATION_SHA256" \
            --arg current_state "$(jq -r '.current_state_sha256 // .prewrite_state_sha256 // ""' <<<"$result")" \
            --arg desired_state "$(jq -r '.desired_state_sha256 // .postwrite_state_sha256 // ""' <<<"$result")" \
            --arg content_readback "$(jq -r '.content_readback_sha256 // .required_content_readback_sha256 // ""' <<<"$result")" \
            --arg content_fingerprint "$(jq -r '.content_fingerprint_sha256 // ""' <<<"$result")" \
            --arg frontend_revision "$(jq -r '.frontend_revision // ""' <<<"$result")" \
            --arg discoverability "$(jq -r '.discoverability_state // "held"' <<<"$result")" \
            --arg rollback "$rollback_sha256" \
            --arg approval "$approval_sha256" \
            --arg operation_status "$(jq -r '.status' <<<"$result")" \
            --argjson writes_committed "$(jq '.writes_committed // false' <<<"$result")" \
            --argjson indexability_committed "$(jq '.indexability_write_committed // false' <<<"$result")" \
            --argjson cache_ready "$(jq '.cache_closeout_ready // false' <<<"$result")" \
            --argjson cache_closeout "$(jq '.cache_closeout_completed // false' <<<"$result")" \
            --argjson content_cache_closeout "$(jq '.content_cache_closeout_completed // false' <<<"$result")" \
            --argjson page_readback "$(jq '.public_page_readback_completed // false' <<<"$result")" \
            --argjson feed_readback "$(jq '.public_feed_readback_completed // false' <<<"$result")" \
            '{
              contract_version: "mbti.cross.publish51.production_ops.v1",
              mode: $mode,
              status: (if ($mode | endswith("_preflight")) then "PASS_PREFLIGHT" else "PASS_APPLY" end),
              operation_status: $operation_status,
              run_id: "${{ github.run_id }}",
              run_attempt: "${{ github.run_attempt }}",
              control_plane_sha: $control,
              active_revision: $active,
              package_sha256: $package,
              editorial_authorization_sha256: $authorization,
              record_count: 3,
              exact_slugs: ["enfp-vs-entp","estj-vs-entj","isfp-vs-infp"],
              current_state_sha256: $current_state,
              desired_state_sha256: $desired_state,
              content_readback_sha256: $content_readback,
              content_fingerprint_sha256: $content_fingerprint,
              frontend_revision: $frontend_revision,
              discoverability_state: $discoverability,
              rollback_manifest_sha256: $rollback,
              operator_approval_phrase_sha256: $approval,
              production_write_execution: ($mode | endswith("_apply")),
              content_write_count: (if $writes_committed then 3 else 0 end),
              indexability_write_count: (if $indexability_committed then 3 else 0 end),
              body_mutation_count: 0,
              search_submission_count: 0,
              application_deploy_count: 0,
              symlink_write_count: 0,
              worker_restart_count: 0,
              cache_closeout_ready: $cache_ready,
              cache_closeout_completed: $cache_closeout,
              content_cache_closeout_completed: $content_cache_closeout,
              public_page_readback_completed: $page_readback,
              public_feed_readback_completed: $feed_readback
            }' > artifacts/mbti-cross-publish51-production-ops.json

      - name: Upload sanitized immutable phase receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mbti-cross-publish51-${{ needs.eligibility.outputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mbti-cross-publish51-production-ops.json
          if-no-files-found: error
          retention-days: 90
