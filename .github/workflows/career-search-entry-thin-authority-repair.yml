name: Career Search Entry Thin Authority Repair

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only preflight or separately authorized repair
        required: true
        type: choice
        options:
          - preflight
          - repair
      expected_control_plane_sha:
        description: Exact latest main SHA containing this control
        required: true
        type: string
      expected_release_sha:
        description: Exact unchanged active production application SHA
        required: true
        type: string
      expected_release_name:
        description: Exact unchanged active production release name
        required: true
        type: string
      expected_manifest_sha256:
        description: Exact 50-slug manifest SHA256
        required: true
        type: string
      source_diagnostic_run_id:
        description: Exact successful thin-source diagnostic run
        required: true
        type: string
      source_diagnostic_run_attempt:
        description: Exact successful thin-source diagnostic attempt
        required: true
        type: string
      expected_source_receipt_sha256:
        description: Exact thin-source diagnostic receipt SHA256
        required: true
        type: string
      expected_source_artifact_digest:
        description: Exact thin-source diagnostic artifact digest
        required: true
        type: string
      expected_diagnostic_state_sha256:
        description: Exact thin-source diagnostic state SHA256
        required: true
        type: string
      expected_authority_state_sha256:
        description: Exact thin-source authority state SHA256
        required: true
        type: string
      expected_thin_target_set_sha256:
        description: Exact 10-URL thin target set SHA256
        required: true
        type: string
      failed_preflight_run_id:
        description: Exact workbook-unavailable preflight run
        required: true
        type: string
      failed_preflight_run_attempt:
        description: Exact workbook-unavailable preflight attempt
        required: true
        type: string
      expected_failed_preflight_receipt_sha256:
        description: Exact workbook-unavailable preflight receipt SHA256
        required: true
        type: string
      expected_failed_preflight_artifact_digest:
        description: Exact workbook-unavailable preflight artifact digest
        required: true
        type: string
      failed_crosswalk_preflight_lineage:
        description: Exact run:attempt:receipt:artifact crosswalk-drift lineage
        required: true
        type: string
      source_workbook_release_tag:
        description: Exact private draft-release transport tag for the reviewed workbook
        required: true
        type: string
      preflight_run_id:
        description: Repair mode only; exact successful diagnostic preflight run
        required: false
        type: string
      preflight_run_attempt:
        description: Repair mode only; exact successful preflight attempt
        required: false
        type: string
      expected_preflight_receipt_sha256:
        description: Repair mode only; exact preflight receipt SHA256
        required: false
        type: string
      expected_preflight_artifact_digest:
        description: Repair mode only; exact preflight artifact digest
        required: false
        type: string
      expected_repair_set_sha256:
        description: Repair mode only; exact combined authority repair set SHA256
        required: false
        type: string
      expected_repair_payload_set_sha256:
        description: Repair mode only; exact reviewed payload set SHA256
        required: false
        type: string
      operator_approval_phrase:
        description: Exact mode-specific operator approval phrase
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-${{ github.repository }}-production
  cancel-in-progress: false

jobs:
  eligibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.validate.outputs.mode }}
      control_plane_sha: ${{ steps.validate.outputs.control_plane_sha }}
      release_sha: ${{ steps.validate.outputs.release_sha }}
      release_name: ${{ steps.validate.outputs.release_name }}
      manifest_sha256: ${{ steps.validate.outputs.manifest_sha256 }}
      repair_set_sha256: ${{ steps.validate.outputs.repair_set_sha256 }}
      repair_payload_set_sha256: ${{ steps.validate.outputs.repair_payload_set_sha256 }}
      crosswalk_diagnostic_state_sha256: ${{ steps.validate.outputs.crosswalk_diagnostic_state_sha256 }}
      source_workbook_release_tag: ${{ steps.validate.outputs.source_workbook_release_tag }}
    steps:
      - name: Checkout exact authority repair control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.expected_control_plane_sha }}
          fetch-depth: 0

      - name: Bind source diagnostic, optional preflight, and authorization
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          EXPECTED_CONTROL_PLANE_SHA: ${{ inputs.expected_control_plane_sha }}
          EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
          EXPECTED_RELEASE_NAME: ${{ inputs.expected_release_name }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.expected_manifest_sha256 }}
          SOURCE_DIAGNOSTIC_RUN_ID: ${{ inputs.source_diagnostic_run_id }}
          SOURCE_DIAGNOSTIC_RUN_ATTEMPT: ${{ inputs.source_diagnostic_run_attempt }}
          EXPECTED_SOURCE_RECEIPT_SHA256: ${{ inputs.expected_source_receipt_sha256 }}
          EXPECTED_SOURCE_ARTIFACT_DIGEST: ${{ inputs.expected_source_artifact_digest }}
          EXPECTED_DIAGNOSTIC_STATE_SHA256: ${{ inputs.expected_diagnostic_state_sha256 }}
          EXPECTED_AUTHORITY_STATE_SHA256: ${{ inputs.expected_authority_state_sha256 }}
          EXPECTED_THIN_TARGET_SET_SHA256: ${{ inputs.expected_thin_target_set_sha256 }}
          FAILED_PREFLIGHT_RUN_ID: ${{ inputs.failed_preflight_run_id }}
          FAILED_PREFLIGHT_RUN_ATTEMPT: ${{ inputs.failed_preflight_run_attempt }}
          EXPECTED_FAILED_PREFLIGHT_RECEIPT_SHA256: ${{ inputs.expected_failed_preflight_receipt_sha256 }}
          EXPECTED_FAILED_PREFLIGHT_ARTIFACT_DIGEST: ${{ inputs.expected_failed_preflight_artifact_digest }}
          FAILED_CROSSWALK_PREFLIGHT_LINEAGE: ${{ inputs.failed_crosswalk_preflight_lineage }}
          SOURCE_WORKBOOK_RELEASE_TAG: ${{ inputs.source_workbook_release_tag }}
          PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
          PREFLIGHT_RUN_ATTEMPT: ${{ inputs.preflight_run_attempt }}
          EXPECTED_PREFLIGHT_RECEIPT_SHA256: ${{ inputs.expected_preflight_receipt_sha256 }}
          EXPECTED_PREFLIGHT_ARTIFACT_DIGEST: ${{ inputs.expected_preflight_artifact_digest }}
          EXPECTED_REPAIR_SET_SHA256: ${{ inputs.expected_repair_set_sha256 }}
          EXPECTED_REPAIR_PAYLOAD_SET_SHA256: ${{ inputs.expected_repair_payload_set_sha256 }}
          OPERATOR_APPROVAL_PHRASE: ${{ inputs.operator_approval_phrase }}
          SOURCE_CONTROL_PLANE_SHA: b5370fde71f9e94194270f10ffe4fd4fc9be6a45
          WORKBOOK_ASSET_NAME: fermat_career_assets_v4_2_v9_d23b_schema_repaired.xlsx
          WORKBOOK_SHA256: c30f8743cfd0d8baa14ac931cc7270807425164952f6a44953b5b4ab448778ef
          WORKBOOK_SIZE: "29974136"
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$EXPECTED_CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_RELEASE_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          [[ "$EXPECTED_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$SOURCE_DIAGNOSTIC_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_DIAGNOSTIC_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_SOURCE_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_SOURCE_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_DIAGNOSTIC_STATE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_AUTHORITY_STATE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_THIN_TARGET_SET_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$FAILED_PREFLIGHT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$FAILED_PREFLIGHT_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_FAILED_PREFLIGHT_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_FAILED_PREFLIGHT_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          IFS=: read -r FAILED_CROSSWALK_PREFLIGHT_RUN_ID FAILED_CROSSWALK_PREFLIGHT_RUN_ATTEMPT \
            EXPECTED_FAILED_CROSSWALK_RECEIPT_SHA256 EXPECTED_FAILED_CROSSWALK_ARTIFACT_DIGEST \
            <<<"$FAILED_CROSSWALK_PREFLIGHT_LINEAGE"
          test "$FAILED_CROSSWALK_PREFLIGHT_LINEAGE" = "${FAILED_CROSSWALK_PREFLIGHT_RUN_ID}:${FAILED_CROSSWALK_PREFLIGHT_RUN_ATTEMPT}:${EXPECTED_FAILED_CROSSWALK_RECEIPT_SHA256}:${EXPECTED_FAILED_CROSSWALK_ARTIFACT_DIGEST}"
          [[ "$FAILED_CROSSWALK_PREFLIGHT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$FAILED_CROSSWALK_PREFLIGHT_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_FAILED_CROSSWALK_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_FAILED_CROSSWALK_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$SOURCE_WORKBOOK_RELEASE_TAG" =~ ^career-thin-authority-workbook-[0-9a-f]{8}-[0-9a-f]{8}$ ]]
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_CONTROL_PLANE_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_CONTROL_PLANE_SHA"
          git merge-base --is-ancestor "$EXPECTED_RELEASE_SHA" origin/main

          source_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_DIAGNOSTIC_RUN_ID}")"
          jq -e \
            --arg control "$SOURCE_CONTROL_PLANE_SHA" \
            --argjson attempt "$SOURCE_DIAGNOSTIC_RUN_ATTEMPT" \
            '.name == "Career Search Entry Cache Thin-Source Diagnostic"
             and .path == ".github/workflows/career-search-entry-cache-thin-source-diagnostic.yml"
             and .event == "workflow_dispatch"
             and .status == "completed"
             and .conclusion == "success"
             and .head_branch == "main"
             and .head_sha == $control
             and .run_attempt == $attempt' <<<"$source_run" >/dev/null
          source_name="career-search-entry-cache-thin-source-diagnostic-${SOURCE_DIAGNOSTIC_RUN_ID}-${SOURCE_DIAGNOSTIC_RUN_ATTEMPT}"
          source_artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_DIAGNOSTIC_RUN_ID}/artifacts?per_page=100")"
          jq -e \
            --arg name "$source_name" \
            --arg digest "sha256:${EXPECTED_SOURCE_ARTIFACT_DIGEST}" \
            '[.artifacts[] | select(.name == $name and .expired == false and .digest == $digest)] | length == 1' \
            <<<"$source_artifacts" >/dev/null
          source_dir="$(mktemp -d)"
          gh run download "$SOURCE_DIAGNOSTIC_RUN_ID" --name "$source_name" --dir "$source_dir"
          source_receipt="$source_dir/career-search-entry-cache-thin-source-diagnostic.json"
          test "$(sha256sum "$source_receipt" | awk '{print $1}')" = "$EXPECTED_SOURCE_RECEIPT_SHA256"
          jq -e \
            --arg release "$EXPECTED_RELEASE_SHA" \
            --arg release_name "$EXPECTED_RELEASE_NAME" \
            --arg manifest "$EXPECTED_MANIFEST_SHA256" \
            --arg diagnostic "$EXPECTED_DIAGNOSTIC_STATE_SHA256" \
            --arg authority "$EXPECTED_AUTHORITY_STATE_SHA256" \
            --arg thin_set "$EXPECTED_THIN_TARGET_SET_SHA256" \
            --argjson run_id "$SOURCE_DIAGNOSTIC_RUN_ID" \
            --argjson attempt "$SOURCE_DIAGNOSTIC_RUN_ATTEMPT" \
            '.contract_version == "career.search_entry_batch.cache_thin_source_diagnostic.v1"
             and .status == "PASS_THIN_SOURCE_AUTHORITY_REPAIR_REQUIRED"
             and .release_sha == $release
             and .release_name == $release_name
             and .manifest_sha256 == $manifest
             and .diagnostic_state_sha256 == $diagnostic
             and .authority_state_sha256 == $authority
             and .thin_target_set_sha256 == $thin_set
             and .thin_url_count == 10
             and .thin_slug_count == 5
             and ([.authority_rows[].manifest_position] == [30, 33, 34, 40, 42])
             and ([.authority_rows[].classification] | all(. == "exact_display_asset_missing"))
             and .write_state == "none"
             and .server_write_count == 0
             and .cache_write_count == 0
             and .database_write_count == 0
             and .cms_write_count == 0
             and .workflow_run_id == $run_id
             and .workflow_run_attempt == $attempt' "$source_receipt" >/dev/null

          failed_preflight_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_PREFLIGHT_RUN_ID}")"
          jq -e \
            --arg control "cc111cc27aab9eba5d9232ef7a409f7374779eee" \
            --argjson attempt "$FAILED_PREFLIGHT_RUN_ATTEMPT" \
            '.name == "Career Search Entry Thin Authority Repair"
             and .path == ".github/workflows/career-search-entry-thin-authority-repair.yml"
             and .event == "workflow_dispatch"
             and .status == "completed"
             and .conclusion == "failure"
             and .head_branch == "main"
             and .head_sha == $control
             and .run_attempt == $attempt' <<<"$failed_preflight_run" >/dev/null
          failed_preflight_name="career-search-entry-thin-authority-preflight-${FAILED_PREFLIGHT_RUN_ID}-${FAILED_PREFLIGHT_RUN_ATTEMPT}"
          failed_preflight_artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_PREFLIGHT_RUN_ID}/artifacts?per_page=100")"
          jq -e \
            --arg name "$failed_preflight_name" \
            --arg digest "sha256:${EXPECTED_FAILED_PREFLIGHT_ARTIFACT_DIGEST}" \
            '[.artifacts[] | select(.name == $name and .expired == false and .digest == $digest)] | length == 1' \
            <<<"$failed_preflight_artifacts" >/dev/null
          failed_preflight_dir="$(mktemp -d)"
          gh run download "$FAILED_PREFLIGHT_RUN_ID" --name "$failed_preflight_name" --dir "$failed_preflight_dir"
          failed_preflight_receipt="$failed_preflight_dir/career-search-entry-thin-authority-repair.json"
          test "$(sha256sum "$failed_preflight_receipt" | awk '{print $1}')" = "$EXPECTED_FAILED_PREFLIGHT_RECEIPT_SHA256"
          jq -e \
            --arg release "$EXPECTED_RELEASE_SHA" \
            --arg manifest "$EXPECTED_MANIFEST_SHA256" \
            --arg workbook "$WORKBOOK_SHA256" \
            --argjson run_id "$FAILED_PREFLIGHT_RUN_ID" \
            --argjson attempt "$FAILED_PREFLIGHT_RUN_ATTEMPT" \
            '.contract_version == "career.search_entry_batch.thin_authority_repair.v1"
             and .status == "HOLD_APPROVED_WORKBOOK_UNAVAILABLE"
             and .mode == "preflight"
             and .release_sha == $release
             and .manifest_sha256 == $manifest
             and .workbook_sha256 == $workbook
             and .manifest_positions == [30, 33, 34, 40, 42]
             and .repair_count == 0
             and .write_state == "none"
             and .server_write_count == 0
             and .database_write_count == 0
             and .cache_write_count == 0
             and .workflow_run_id == $run_id
             and .workflow_run_attempt == $attempt' "$failed_preflight_receipt" >/dev/null

          failed_crosswalk_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_CROSSWALK_PREFLIGHT_RUN_ID}")"
          jq -e \
            --arg control "15eb6a2fbf55630f3d1e53fd3bf891930ebcb60b" \
            --argjson attempt "$FAILED_CROSSWALK_PREFLIGHT_RUN_ATTEMPT" \
            '.name == "Career Search Entry Thin Authority Repair"
             and .path == ".github/workflows/career-search-entry-thin-authority-repair.yml"
             and .event == "workflow_dispatch"
             and .status == "completed"
             and .conclusion == "failure"
             and .head_branch == "main"
             and .head_sha == $control
             and .run_attempt == $attempt' <<<"$failed_crosswalk_run" >/dev/null
          failed_crosswalk_name="career-search-entry-thin-authority-preflight-${FAILED_CROSSWALK_PREFLIGHT_RUN_ID}-${FAILED_CROSSWALK_PREFLIGHT_RUN_ATTEMPT}"
          failed_crosswalk_artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_CROSSWALK_PREFLIGHT_RUN_ID}/artifacts?per_page=100")"
          jq -e \
            --arg name "$failed_crosswalk_name" \
            --arg digest "sha256:${EXPECTED_FAILED_CROSSWALK_ARTIFACT_DIGEST}" \
            '[.artifacts[] | select(.name == $name and .expired == false and .digest == $digest)] | length == 1' \
            <<<"$failed_crosswalk_artifacts" >/dev/null
          failed_crosswalk_dir="$(mktemp -d)"
          gh run download "$FAILED_CROSSWALK_PREFLIGHT_RUN_ID" --name "$failed_crosswalk_name" --dir "$failed_crosswalk_dir"
          failed_crosswalk_receipt="$failed_crosswalk_dir/career-search-entry-thin-authority-repair.json"
          test "$(sha256sum "$failed_crosswalk_receipt" | awk '{print $1}')" = "$EXPECTED_FAILED_CROSSWALK_RECEIPT_SHA256"
          jq -e \
            --arg release "$EXPECTED_RELEASE_SHA" \
            --arg manifest "$EXPECTED_MANIFEST_SHA256" \
            --argjson run_id "$FAILED_CROSSWALK_PREFLIGHT_RUN_ID" \
            --argjson attempt "$FAILED_CROSSWALK_PREFLIGHT_RUN_ATTEMPT" \
            '.contract_version == "career.search_entry_batch.thin_authority_repair.v1"
             and .status == "FAIL_CLOSED"
             and .mode == "preflight"
             and .failure_category == "CROSSWALK_AUTHORITY_DRIFT"
             and .release_sha == $release
             and .manifest_sha256 == $manifest
             and .write_state == "none_or_transaction_rolled_back"
             and .server_write_count == 1
             and .server_delete_count == 1
             and .persistent_server_write_count == 0
             and .database_write_count == 0
             and .cache_write_count == 0
             and .workflow_run_id == $run_id
             and .workflow_run_attempt == $attempt' "$failed_crosswalk_receipt" >/dev/null

          repair_set=""
          repair_payload_set=""
          crosswalk_diagnostic_state=""
          if [ "$MODE" = "preflight" ]; then
            test -z "$PREFLIGHT_RUN_ID"
            test -z "$PREFLIGHT_RUN_ATTEMPT"
            test -z "$EXPECTED_PREFLIGHT_RECEIPT_SHA256"
            test -z "$EXPECTED_PREFLIGHT_ARTIFACT_DIGEST"
            test -z "$EXPECTED_REPAIR_SET_SHA256"
            test -z "$EXPECTED_REPAIR_PAYLOAD_SET_SHA256"
            expected_phrase="I explicitly approve one-time Career search-entry crosswalk-diagnostic thin-authority repair preflight for failed crosswalk preflight run ${FAILED_CROSSWALK_PREFLIGHT_RUN_ID} attempt ${FAILED_CROSSWALK_PREFLIGHT_RUN_ATTEMPT} receipt ${EXPECTED_FAILED_CROSSWALK_RECEIPT_SHA256} artifact ${EXPECTED_FAILED_CROSSWALK_ARTIFACT_DIGEST}, failed workbook-unavailable preflight run ${FAILED_PREFLIGHT_RUN_ID} attempt ${FAILED_PREFLIGHT_RUN_ATTEMPT} receipt ${EXPECTED_FAILED_PREFLIGHT_RECEIPT_SHA256} artifact ${EXPECTED_FAILED_PREFLIGHT_ARTIFACT_DIGEST}, source diagnostic run ${SOURCE_DIAGNOSTIC_RUN_ID} attempt ${SOURCE_DIAGNOSTIC_RUN_ATTEMPT} receipt ${EXPECTED_SOURCE_RECEIPT_SHA256}, control-plane SHA ${EXPECTED_CONTROL_PLANE_SHA}, active SHA ${EXPECTED_RELEASE_SHA}, manifest ${EXPECTED_MANIFEST_SHA256}, private draft release ${SOURCE_WORKBOOK_RELEASE_TAG}, workbook SHA ${WORKBOOK_SHA256} size ${WORKBOOK_SIZE}; stage exactly one ephemeral production /tmp workbook, verify and remove it, then inspect only safe aggregate crosswalk authority state for exact five manifest positions, with zero persistent server write, cache write, CMS/DB write, retry, rollback, deploy, or Search Channel operation."
          elif [ "$MODE" = "repair" ]; then
            [[ "$PREFLIGHT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$PREFLIGHT_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
            [[ "$EXPECTED_PREFLIGHT_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
            [[ "$EXPECTED_PREFLIGHT_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
            [[ "$EXPECTED_REPAIR_SET_SHA256" =~ ^[0-9a-f]{64}$ ]]
            [[ "$EXPECTED_REPAIR_PAYLOAD_SET_SHA256" =~ ^[0-9a-f]{64}$ ]]
            preflight_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREFLIGHT_RUN_ID}")"
            jq -e \
              --arg control "71a75bf4e6951fd57116cd0c3f8bde5ee3f8d96f" \
              --argjson attempt "$PREFLIGHT_RUN_ATTEMPT" \
              '.name == "Career Search Entry Thin Authority Repair"
               and .path == ".github/workflows/career-search-entry-thin-authority-repair.yml"
               and .event == "workflow_dispatch"
               and .status == "completed"
               and .conclusion == "success"
               and .head_branch == "main"
               and .head_sha == $control
               and .run_attempt == $attempt' <<<"$preflight_run" >/dev/null
            preflight_name="career-search-entry-thin-authority-preflight-${PREFLIGHT_RUN_ID}-${PREFLIGHT_RUN_ATTEMPT}"
            preflight_artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREFLIGHT_RUN_ID}/artifacts?per_page=100")"
            jq -e \
              --arg name "$preflight_name" \
              --arg digest "sha256:${EXPECTED_PREFLIGHT_ARTIFACT_DIGEST}" \
              '[.artifacts[] | select(.name == $name and .expired == false and .digest == $digest)] | length == 1' \
              <<<"$preflight_artifacts" >/dev/null
            preflight_dir="$(mktemp -d)"
            gh run download "$PREFLIGHT_RUN_ID" --name "$preflight_name" --dir "$preflight_dir"
            preflight_receipt="$preflight_dir/career-search-entry-thin-authority-repair.json"
            test "$(sha256sum "$preflight_receipt" | awk '{print $1}')" = "$EXPECTED_PREFLIGHT_RECEIPT_SHA256"
            jq -e \
              --arg release "$EXPECTED_RELEASE_SHA" \
              --arg manifest "$EXPECTED_MANIFEST_SHA256" \
              --arg source_receipt "$EXPECTED_SOURCE_RECEIPT_SHA256" \
              --arg diagnostic_state "69d1b64c7d61467ab7a7470f69597d988dff3c70745f41ec30d0b1a43c731e08" \
              --argjson run_id "$PREFLIGHT_RUN_ID" \
              --argjson attempt "$PREFLIGHT_RUN_ATTEMPT" \
              '.contract_version == "career.search_entry_batch.thin_authority_repair.v1"
               and .status == "HOLD_CROSSWALK_AUTHORITY_REPAIR_REQUIRED"
               and .mode == "preflight"
               and .release_sha == $release
               and .manifest_sha256 == $manifest
               and .source_diagnostic_receipt_sha256 == $source_receipt
               and .repair_count == 0
               and .manifest_positions == [30, 33, 34, 40, 42]
               and .crosswalk_diagnostic_state_sha256 == $diagnostic_state
               and (.crosswalk_diagnostics | length) == 5
               and ([.crosswalk_diagnostics[].classification] | all(. == "missing"))
               and ([.crosswalk_diagnostics[] |
                 .us_soc_total + .us_soc_match + .onet_soc_2019_total + .onet_soc_2019_match] | all(. == 0))
               and .write_state == "none"
               and .server_write_count == 1
               and .server_delete_count == 1
               and .persistent_server_write_count == 0
               and .database_write_count == 0
               and .workflow_run_id == $run_id
               and .workflow_run_attempt == $attempt' "$preflight_receipt" >/dev/null
            later_runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/career-search-entry-thin-authority-repair.yml/runs?event=workflow_dispatch&per_page=100")"
            jq -e \
              --argjson preflight "$PREFLIGHT_RUN_ID" \
              --argjson current "$GITHUB_RUN_ID" \
              '[.workflow_runs[] | select(.id > $preflight and .id != $current)] | length == 0' \
              <<<"$later_runs" >/dev/null
            repair_set="$EXPECTED_REPAIR_SET_SHA256"
            repair_payload_set="$EXPECTED_REPAIR_PAYLOAD_SET_SHA256"
            crosswalk_diagnostic_state="69d1b64c7d61467ab7a7470f69597d988dff3c70745f41ec30d0b1a43c731e08"
            expected_phrase="I explicitly approve one-time Career search-entry combined crosswalk and thin-authority repair for diagnostic preflight run ${PREFLIGHT_RUN_ID} attempt ${PREFLIGHT_RUN_ATTEMPT} receipt ${EXPECTED_PREFLIGHT_RECEIPT_SHA256} artifact ${EXPECTED_PREFLIGHT_ARTIFACT_DIGEST}, diagnostic state ${crosswalk_diagnostic_state}, source diagnostic run ${SOURCE_DIAGNOSTIC_RUN_ID} attempt ${SOURCE_DIAGNOSTIC_RUN_ATTEMPT} receipt ${EXPECTED_SOURCE_RECEIPT_SHA256}, control-plane SHA ${EXPECTED_CONTROL_PLANE_SHA}, active SHA ${EXPECTED_RELEASE_SHA}, manifest ${EXPECTED_MANIFEST_SHA256}, private draft release ${SOURCE_WORKBOOK_RELEASE_TAG}, combined repair set ${EXPECTED_REPAIR_SET_SHA256}, repair payload set ${EXPECTED_REPAIR_PAYLOAD_SET_SHA256}; stage and remove exactly one ephemeral production /tmp workbook, atomically create exactly ten missing reviewed-workbook occupation crosswalk rows and five normalized career display-authority rows, verify exact crosswalk authority and 10 bilingual surfaces, and delete the private draft-release transport, with zero persistent server write, cache write, publication, indexability, queue, sitemap, llms, Search Channel, URL submission, deploy, rollback, or non-target write."
          else
            exit 2
          fi
          test "$OPERATOR_APPROVAL_PHRASE" = "$expected_phrase"
          {
            echo "mode=$MODE"
            echo "control_plane_sha=$EXPECTED_CONTROL_PLANE_SHA"
            echo "release_sha=$EXPECTED_RELEASE_SHA"
            echo "release_name=$EXPECTED_RELEASE_NAME"
            echo "manifest_sha256=$EXPECTED_MANIFEST_SHA256"
            echo "repair_set_sha256=$repair_set"
            echo "repair_payload_set_sha256=$repair_payload_set"
            echo "crosswalk_diagnostic_state_sha256=$crosswalk_diagnostic_state"
            echo "source_workbook_release_tag=$SOURCE_WORKBOOK_RELEASE_TAG"
          } >> "$GITHUB_OUTPUT"

  operate:
    needs: eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout exact authority repair control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.eligibility.outputs.control_plane_sha }}
          fetch-depth: 1

      - name: Download exact private reviewed-workbook transport
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_WORKBOOK_RELEASE_TAG: ${{ needs.eligibility.outputs.source_workbook_release_tag }}
          WORKBOOK_ASSET_NAME: fermat_career_assets_v4_2_v9_d23b_schema_repaired.xlsx
          WORKBOOK_SHA256: c30f8743cfd0d8baa14ac931cc7270807425164952f6a44953b5b4ab448778ef
          WORKBOOK_SIZE: "29974136"
          WORKBOOK_TRANSPORT_CONTROL_SHA: 0a354eb6397d13a4c6b3aa45734fc02342ece2d1
        run: |
          set -euo pipefail
          mkdir -p transport
          workbook_release_pages="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
          workbook_release="$(jq -ce \
            --arg tag "$SOURCE_WORKBOOK_RELEASE_TAG" \
            '[.[][] | select(.tag_name == $tag)]
             | if length == 1 then .[0] else error("WORKBOOK_TRANSPORT_RELEASE_CARDINALITY") end' \
            <<<"$workbook_release_pages")"
          jq -e \
            --arg tag "$SOURCE_WORKBOOK_RELEASE_TAG" \
            --arg target "$WORKBOOK_TRANSPORT_CONTROL_SHA" \
            --arg asset "$WORKBOOK_ASSET_NAME" \
            --arg digest "sha256:${WORKBOOK_SHA256}" \
            --argjson size "$WORKBOOK_SIZE" \
            '.tag_name == $tag
             and .target_commitish == $target
             and .draft == true
             and .prerelease == false
             and ([.assets[] | select(.name == $asset and .state == "uploaded" and .size == $size and .digest == $digest)] | length == 1)
             and (.assets | length) == 1' <<<"$workbook_release" >/dev/null
          source_workbook_asset_id="$(jq -er \
            --arg asset "$WORKBOOK_ASSET_NAME" \
            '.assets[] | select(.name == $asset) | .id' <<<"$workbook_release")"
          [[ "$source_workbook_asset_id" =~ ^[1-9][0-9]*$ ]]
          workbook="transport/$WORKBOOK_ASSET_NAME"
          gh api \
            -H "Accept: application/octet-stream" \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${source_workbook_asset_id}" > "$workbook"
          test "$(sha256sum "$workbook" | awk '{print $1}')" = "$WORKBOOK_SHA256"
          test "$(stat -c '%s' "$workbook")" = "$WORKBOOK_SIZE"

      - name: Validate protected production topology
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          RETIRED_DEPLOY_HOST: ${{ secrets.PRODUCTION_RETIRED_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$RETIRED_DEPLOY_HOST"
          test "$DEPLOY_HOST" != "$RETIRED_DEPLOY_HOST"

      - name: Set up SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known hosts
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null \
            || ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f ~/.ssh/known_hosts >/dev/null

      - name: Run exact bounded authority operation
        shell: bash
        env:
          DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
          MODE: ${{ needs.eligibility.outputs.mode }}
          CONTROL_PLANE_SHA: ${{ needs.eligibility.outputs.control_plane_sha }}
          EXPECTED_RELEASE_SHA: ${{ needs.eligibility.outputs.release_sha }}
          EXPECTED_RELEASE_NAME: ${{ needs.eligibility.outputs.release_name }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.eligibility.outputs.manifest_sha256 }}
          EXPECTED_REPAIR_SET_SHA256: ${{ needs.eligibility.outputs.repair_set_sha256 }}
          EXPECTED_REPAIR_PAYLOAD_SET_SHA256: ${{ needs.eligibility.outputs.repair_payload_set_sha256 }}
          EXPECTED_CROSSWALK_DIAGNOSTIC_STATE_SHA256: ${{ needs.eligibility.outputs.crosswalk_diagnostic_state_sha256 }}
          SOURCE_DIAGNOSTIC_RUN_ID: ${{ inputs.source_diagnostic_run_id }}
          SOURCE_DIAGNOSTIC_RUN_ATTEMPT: ${{ inputs.source_diagnostic_run_attempt }}
          EXPECTED_SOURCE_RECEIPT_SHA256: ${{ inputs.expected_source_receipt_sha256 }}
          EXPECTED_SOURCE_ARTIFACT_DIGEST: ${{ inputs.expected_source_artifact_digest }}
          EXPECTED_DIAGNOSTIC_STATE_SHA256: ${{ inputs.expected_diagnostic_state_sha256 }}
          EXPECTED_AUTHORITY_STATE_SHA256: ${{ inputs.expected_authority_state_sha256 }}
          EXPECTED_THIN_TARGET_SET_SHA256: ${{ inputs.expected_thin_target_set_sha256 }}
          SOURCE_WORKBOOK_RELEASE_TAG: ${{ needs.eligibility.outputs.source_workbook_release_tag }}
          WORKBOOK_ASSET_NAME: fermat_career_assets_v4_2_v9_d23b_schema_repaired.xlsx
          WORKBOOK_SHA256: c30f8743cfd0d8baa14ac931cc7270807425164952f6a44953b5b4ab448778ef
          WORKBOOK_SIZE: "29974136"
        run: |
          set -euo pipefail
          mkdir -p artifacts
          workbook="transport/$WORKBOOK_ASSET_NAME"
          probe="backend/scripts/career/career_search_entry_thin_authority_repair.php"
          probe_sha256="$(sha256sum "$probe" | awk '{print $1}')"
          for variable in DEPLOY_PATH MODE EXPECTED_RELEASE_SHA EXPECTED_RELEASE_NAME \
            EXPECTED_MANIFEST_SHA256 EXPECTED_REPAIR_SET_SHA256 EXPECTED_REPAIR_PAYLOAD_SET_SHA256 \
            EXPECTED_CROSSWALK_DIAGNOSTIC_STATE_SHA256; do
            printf -v "q_${variable}" '%q' "${!variable}"
          done
          remote_env="DEPLOY_PATH=$q_DEPLOY_PATH CAREER_THIN_AUTHORITY_REPAIR_MODE=$q_MODE EXPECTED_RELEASE_SHA=$q_EXPECTED_RELEASE_SHA EXPECTED_RELEASE_NAME=$q_EXPECTED_RELEASE_NAME EXPECTED_MANIFEST_SHA256=$q_EXPECTED_MANIFEST_SHA256"
          if [ "$MODE" = "repair" ]; then
            remote_env="$remote_env EXPECTED_REPAIR_SET_SHA256=$q_EXPECTED_REPAIR_SET_SHA256 EXPECTED_REPAIR_PAYLOAD_SET_SHA256=$q_EXPECTED_REPAIR_PAYLOAD_SET_SHA256 EXPECTED_CROSSWALK_DIAGNOSTIC_STATE_SHA256=$q_EXPECTED_CROSSWALK_DIAGNOSTIC_STATE_SHA256"
          fi
          ssh_base=(
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10
            -o ServerAliveInterval=20 -o ServerAliveCountMax=30
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST"
          )
          remote_workbook="/tmp/${WORKBOOK_ASSET_NAME%.xlsx}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.xlsx"
          printf -v q_remote_workbook '%q' "$remote_workbook"
          remote_env="$remote_env CAREER_THIN_AUTHORITY_WORKBOOK_PATH=$q_remote_workbook"
          cleanup_remote_workbook() {
            "${ssh_base[@]}" "rm -f -- $q_remote_workbook"
          }
          trap cleanup_remote_workbook EXIT
          "${ssh_base[@]}" "test ! -e $q_remote_workbook && umask 077 && cat > $q_remote_workbook" < "$workbook"
          "${ssh_base[@]}" \
            "test -f $q_remote_workbook && test ! -L $q_remote_workbook && test \"\$(sha256sum $q_remote_workbook | awk '{print \$1}')\" = '$WORKBOOK_SHA256' && test \"\$(stat -c '%s' $q_remote_workbook)\" = '$WORKBOOK_SIZE' && test \"\$(stat -c '%a' $q_remote_workbook)\" = '600'"
          set +e
          "${ssh_base[@]}" "$remote_env /usr/bin/php" < "$probe" > artifacts/probe.json
          probe_status=$?
          set -e
          cleanup_remote_workbook
          trap - EXIT
          "${ssh_base[@]}" "test ! -e $q_remote_workbook"
          jq \
            --arg control "$CONTROL_PLANE_SHA" \
            --arg probe "$probe_sha256" \
            --arg workbook_release "$SOURCE_WORKBOOK_RELEASE_TAG" \
            --arg workbook_asset "$WORKBOOK_ASSET_NAME" \
            --arg workbook_sha "$WORKBOOK_SHA256" \
            --argjson workbook_size "$WORKBOOK_SIZE" \
            --arg source_receipt "$EXPECTED_SOURCE_RECEIPT_SHA256" \
            --arg source_artifact "$EXPECTED_SOURCE_ARTIFACT_DIGEST" \
            --arg source_state "$EXPECTED_DIAGNOSTIC_STATE_SHA256" \
            --arg authority_state "$EXPECTED_AUTHORITY_STATE_SHA256" \
            --arg thin_set "$EXPECTED_THIN_TARGET_SET_SHA256" \
            --argjson source_run "$SOURCE_DIAGNOSTIC_RUN_ID" \
            --argjson source_attempt "$SOURCE_DIAGNOSTIC_RUN_ATTEMPT" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            '. + {
              contract_version: "career.search_entry_batch.thin_authority_repair.v1",
              control_plane_sha: $control,
              probe_sha256: $probe,
              workbook_transport_release_tag: $workbook_release,
              workbook_transport_asset_name: $workbook_asset,
              workbook_transport_sha256: $workbook_sha,
              workbook_transport_size: $workbook_size,
              probe_server_write_count: .server_write_count,
              server_write_count: 1,
              server_delete_count: 1,
              persistent_server_write_count: 0,
              source_diagnostic_run_id: $source_run,
              source_diagnostic_run_attempt: $source_attempt,
              source_diagnostic_receipt_sha256: $source_receipt,
              source_diagnostic_artifact_digest: $source_artifact,
              source_diagnostic_state_sha256: $source_state,
              source_authority_state_sha256: $authority_state,
              source_thin_target_set_sha256: $thin_set,
              workflow_run_id: $run_id,
              workflow_run_attempt: $run_attempt
            }' artifacts/probe.json > artifacts/career-search-entry-thin-authority-repair.json
          test "$probe_status" -eq 0
          if [ "$MODE" = "preflight" ]; then
            jq -e '(.status == "PASS_AUTHORITY_REPAIR_PREFLIGHT"
                or (.status == "HOLD_CROSSWALK_AUTHORITY_REPAIR_REQUIRED"
                    and .repair_count == 0
                    and (.crosswalk_diagnostics | length) == 5
                    and ([.crosswalk_diagnostics[].manifest_position] == [30, 33, 34, 40, 42])
                    and ([.crosswalk_diagnostics[].classification] | any(. != "exact"))
                    and (.crosswalk_diagnostic_state_sha256 | test("^[0-9a-f]{64}$"))))
              and .write_state == "none"
              and .server_write_count == 1
              and .server_delete_count == 1
              and .persistent_server_write_count == 0
              and .database_write_count == 0
              and .cache_write_count == 0' \
              artifacts/career-search-entry-thin-authority-repair.json >/dev/null
          else
            jq -e '.status == "PASS_AUTHORITY_REPAIR_COMPLETE"
              and .write_state == "committed_verified"
              and .server_write_count == 1
              and .server_delete_count == 1
              and .persistent_server_write_count == 0
              and .database_write_count == 15
              and .crosswalk_write_count == 10
              and .display_write_count == 5
              and .cache_write_count == 0
              and (.verification_rows | length) == 10' \
              artifacts/career-search-entry-thin-authority-repair.json >/dev/null
          fi

      - name: Upload sanitized immutable authority receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: career-search-entry-thin-authority-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/career-search-entry-thin-authority-repair.json
          if-no-files-found: error
          retention-days: 90

      - name: Delete exact private workbook transport after repair
        if: success() && inputs.mode == 'repair'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_WORKBOOK_RELEASE_TAG: ${{ needs.eligibility.outputs.source_workbook_release_tag }}
        run: |
          set -euo pipefail
          release_pages="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
          release="$(jq -ce \
            --arg tag "$SOURCE_WORKBOOK_RELEASE_TAG" \
            '[.[][] | select(.tag_name == $tag)]
             | if length == 1 then .[0] else error("WORKBOOK_TRANSPORT_RELEASE_CARDINALITY") end' \
            <<<"$release_pages")"
          release_id="$(jq -er '.id' <<<"$release")"
          test "$(jq -r '.draft' <<<"$release")" = "true"
          test "$(jq -r '.assets | length' <<<"$release")" = "1"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}"
          remaining_releases="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
          jq -e \
            --arg tag "$SOURCE_WORKBOOK_RELEASE_TAG" \
            '[.[][] | select(.tag_name == $tag)] | length == 0' \
            <<<"$remaining_releases" >/dev/null
