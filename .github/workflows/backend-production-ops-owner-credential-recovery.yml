name: Backend Production Ops Owner Credential Recovery

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only preflight or receipt-bound apply
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - apply
      expected_control_plane_sha:
        description: Exact latest main SHA containing this control plane
        required: true
        type: string
      expected_active_revision:
        description: Exact active backend REVISION
        required: true
        type: string
      expected_runner_sha256:
        description: Exact SHA-256 of the credential recovery runner
        required: true
        type: string
      expected_account_sha256:
        description: Apply only; opaque account SHA-256 from preflight
        required: false
        default: ""
        type: string
      expected_state_sha256:
        description: Apply only; immutable account-state SHA-256 from preflight
        required: false
        default: ""
        type: string
      preflight_run_id:
        description: Apply only; immutable successful preflight run id
        required: false
        default: ""
        type: string
      preflight_run_attempt:
        description: Apply only; immutable successful preflight run attempt
        required: false
        default: ""
        type: string
      operator_approval_phrase:
        description: Apply only; exact receipt-bound authorization phrase
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-${{ github.repository }}-production
  cancel-in-progress: false

jobs:
  control:
    name: Preflight or recover exact Ops owner credential
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    steps:
      - name: Initialize failure-safe sanitized receipt
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/backend-production-ops-owner-credential-recovery.json"
          jq -n \
            --arg mode "${{ inputs.mode }}" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{
              contract_version: "backend.production_ops_owner_credential_recovery.v1",
              mode: $mode,
              status: "FAIL_CLOSED",
              failed_stage: "receipt_initialized",
              run_id: $run_id,
              run_attempt: $run_attempt,
              control_plane_sha: null,
              active_revision: null,
              runner_sha256: null,
              email_sha256: null,
              account_sha256: null,
              account_count: null,
              is_active_before: null,
              is_locked_before: null,
              password_matches_before: null,
              totp_enrolled: null,
              role_count: null,
              state_sha256_before: null,
              state_sha256_after: null,
              recovery_required: null,
              apply_supported: null,
              totp_preserved: null,
              roles_preserved: null,
              recovery_succeeded: null,
              secret_present: false,
              secret_transmitted_via_stdin: false,
              secret_retirement_required: true,
              production_write_execution: false,
              admin_user_write_count: 0,
              deploy_count: 0,
              migration_count: 0,
              cms_write_count: 0,
              publication_count: 0,
              discoverability_write_count: 0,
              search_submit_count: 0,
              remote_file_write_count: 0,
              process_restart_count: 0,
              write_state: "confirmed_zero_write",
              checked_at: null
            }' > "$receipt"

      - name: Checkout exact main control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Start pinned SSH agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known hosts
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_PORT"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null \
            || ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f ~/.ssh/known_hosts >/dev/null

      - name: Execute bounded credential control
        id: execute
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          EXPECTED_CONTROL_PLANE_SHA: ${{ inputs.expected_control_plane_sha }}
          EXPECTED_ACTIVE_REVISION: ${{ inputs.expected_active_revision }}
          EXPECTED_RUNNER_SHA256: ${{ inputs.expected_runner_sha256 }}
          EXPECTED_ACCOUNT_SHA256: ${{ inputs.expected_account_sha256 }}
          EXPECTED_STATE_SHA256: ${{ inputs.expected_state_sha256 }}
          PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
          PREFLIGHT_RUN_ATTEMPT: ${{ inputs.preflight_run_attempt }}
          OPERATOR_APPROVAL_PHRASE: ${{ inputs.operator_approval_phrase }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
          RECOVERY_EMAIL: ${{ secrets.PRODUCTION_OPS_OWNER_RECOVERY_EMAIL }}
          RECOVERY_PASSWORD: ${{ secrets.PRODUCTION_OPS_OWNER_RECOVERY_PASSWORD }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/backend-production-ops-owner-credential-recovery.json"
          runner="backend/scripts/deploy/control_ops_owner_credential_recovery.php"
          safe_err="$RUNNER_TEMP/ops-owner-credential-recovery.err"
          preflight_dir="$RUNNER_TEMP/ops-owner-credential-preflight"
          stage="eligibility"

          fail() {
            local code="$1"
            jq \
              --arg stage "$stage" \
              --arg code "$code" \
              --arg checked_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '.status="FAIL_CLOSED"
               | .failed_stage=$stage
               | .failure_code=$code
               | .checked_at=$checked_at' \
              "$receipt" > "$receipt.tmp"
            mv "$receipt.tmp" "$receipt"
            rm -f "$safe_err"
            exit 1
          }

          trap 'fail UNEXPECTED_RUNNER_FAILURE' ERR

          test "$GITHUB_REF" = refs/heads/main || fail CONTROL_NOT_MAIN
          [[ "$EXPECTED_CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]] || fail INVALID_CONTROL_SHA
          [[ "$EXPECTED_ACTIVE_REVISION" =~ ^[0-9a-f]{40}$ ]] || fail INVALID_ACTIVE_SHA
          [[ "$EXPECTED_RUNNER_SHA256" =~ ^[0-9a-f]{64}$ ]] || fail INVALID_RUNNER_SHA
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_CONTROL_PLANE_SHA" || fail CONTROL_SHA_MISMATCH
          test "$(git rev-parse origin/main)" = "$EXPECTED_CONTROL_PLANE_SHA" || fail CONTROL_NOT_LATEST_MAIN
          actual_runner_sha="$(sha256sum "$runner" | awk '{print $1}')"
          test "$actual_runner_sha" = "$EXPECTED_RUNNER_SHA256" || fail RUNNER_SHA_MISMATCH

          jq \
            --arg control "$EXPECTED_CONTROL_PLANE_SHA" \
            --arg active "$EXPECTED_ACTIVE_REVISION" \
            --arg runner "$EXPECTED_RUNNER_SHA256" \
            '.control_plane_sha=$control | .active_revision=$active | .runner_sha256=$runner' \
            "$receipt" > "$receipt.tmp"
          mv "$receipt.tmp" "$receipt"

          case "$MODE" in
            preflight)
              test -z "$EXPECTED_ACCOUNT_SHA256" || fail UNEXPECTED_ACCOUNT_BINDING
              test -z "$EXPECTED_STATE_SHA256" || fail UNEXPECTED_STATE_BINDING
              test -z "$PREFLIGHT_RUN_ID" || fail UNEXPECTED_PREFLIGHT_RUN
              test -z "$PREFLIGHT_RUN_ATTEMPT" || fail UNEXPECTED_PREFLIGHT_ATTEMPT
              test -z "$OPERATOR_APPROVAL_PHRASE" || fail UNEXPECTED_APPROVAL
              ;;
            apply)
              [[ "$EXPECTED_ACCOUNT_SHA256" =~ ^[0-9a-f]{64}$ ]] || fail INVALID_ACCOUNT_BINDING
              [[ "$EXPECTED_STATE_SHA256" =~ ^[0-9a-f]{64}$ ]] || fail INVALID_STATE_BINDING
              [[ "$PREFLIGHT_RUN_ID" =~ ^[0-9]+$ ]] || fail INVALID_PREFLIGHT_RUN
              [[ "$PREFLIGHT_RUN_ATTEMPT" =~ ^[0-9]+$ ]] || fail INVALID_PREFLIGHT_ATTEMPT
              expected_phrase="I explicitly approve one bounded production Ops owner credential recovery from preflight run ${PREFLIGHT_RUN_ID} attempt ${PREFLIGHT_RUN_ATTEMPT} for active SHA ${EXPECTED_ACTIVE_REVISION} control SHA ${EXPECTED_CONTROL_PLANE_SHA} runner SHA256 ${EXPECTED_RUNNER_SHA256} account SHA256 ${EXPECTED_ACCOUNT_SHA256} state SHA256 ${EXPECTED_STATE_SHA256}; set only the existing AdminUser password to the protected recovery secret, is_active=1, locked_until=null, failed_login_count=0, preserve TOTP, roles and permissions, with zero deploy, migration, CMS, publication, discoverability or search action."
              test "$OPERATOR_APPROVAL_PHRASE" = "$expected_phrase" || fail APPROVAL_MISMATCH

              run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREFLIGHT_RUN_ID}")"
              jq -e \
                --arg sha "$EXPECTED_CONTROL_PLANE_SHA" \
                --argjson attempt "$PREFLIGHT_RUN_ATTEMPT" \
                '.name == "Backend Production Ops Owner Credential Recovery"
                 and .path == ".github/workflows/backend-production-ops-owner-credential-recovery.yml"
                 and .event == "workflow_dispatch"
                 and .status == "completed"
                 and .conclusion == "success"
                 and .head_branch == "main"
                 and .head_sha == $sha
                 and .run_attempt == $attempt' <<<"$run_json" >/dev/null || fail INVALID_PREFLIGHT_RUN
              mkdir -p "$preflight_dir"
              gh run download "$PREFLIGHT_RUN_ID" \
                --name "backend-production-ops-owner-credential-recovery-${PREFLIGHT_RUN_ID}-${PREFLIGHT_RUN_ATTEMPT}" \
                --dir "$preflight_dir"
              preflight_receipt="$preflight_dir/backend-production-ops-owner-credential-recovery.json"
              test -f "$preflight_receipt" || fail MISSING_PREFLIGHT_RECEIPT
              jq -e \
                --arg control "$EXPECTED_CONTROL_PLANE_SHA" \
                --arg active "$EXPECTED_ACTIVE_REVISION" \
                --arg runner "$EXPECTED_RUNNER_SHA256" \
                --arg account "$EXPECTED_ACCOUNT_SHA256" \
                --arg state "$EXPECTED_STATE_SHA256" \
                --arg run_id "$PREFLIGHT_RUN_ID" \
                --arg run_attempt "$PREFLIGHT_RUN_ATTEMPT" \
                '.contract_version == "backend.production_ops_owner_credential_recovery.v1"
                 and .mode == "preflight"
                 and .status == "PASS_PREFLIGHT"
                 and .run_id == $run_id
                 and .run_attempt == $run_attempt
                 and .control_plane_sha == $control
                 and .active_revision == $active
                 and .runner_sha256 == $runner
                 and .account_sha256 == $account
                 and .state_sha256_before == $state
                 and .account_count == 1
                 and .apply_supported == true
                 and .production_write_execution == false
                 and .write_state == "confirmed_zero_write"' "$preflight_receipt" >/dev/null || fail INVALID_PREFLIGHT_RECEIPT
              checked_epoch="$(date -u -d "$(jq -r '.checked_at' "$preflight_receipt")" +%s)"
              now_epoch="$(date -u +%s)"
              age="$((now_epoch - checked_epoch))"
              test "$age" -ge 0 && test "$age" -le 1800 || fail EXPIRED_PREFLIGHT_RECEIPT
              ;;
            *)
              fail INVALID_MODE
              ;;
          esac

          stage="secret_preflight"
          test -n "$RECOVERY_EMAIL" && test -n "$RECOVERY_PASSWORD" || fail RECOVERY_SECRET_MISSING
          test "${RECOVERY_EMAIL//$'\n'/}" = "$RECOVERY_EMAIL" || fail INVALID_RECOVERY_SECRET
          test "${RECOVERY_EMAIL//$'\r'/}" = "$RECOVERY_EMAIL" || fail INVALID_RECOVERY_SECRET
          test "${RECOVERY_PASSWORD//$'\n'/}" = "$RECOVERY_PASSWORD" || fail INVALID_RECOVERY_SECRET
          test "${RECOVERY_PASSWORD//$'\r'/}" = "$RECOVERY_PASSWORD" || fail INVALID_RECOVERY_SECRET

          jq '.secret_present=true' "$receipt" > "$receipt.tmp"
          mv "$receipt.tmp" "$receipt"

          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]] || fail INVALID_DEPLOY_USER
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] || fail INVALID_DEPLOY_PORT
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || fail INVALID_DEPLOY_HOST
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || fail INVALID_DEPLOY_PATH
          [[ "$DEPLOY_PATH" != *".."* ]] || fail INVALID_DEPLOY_PATH

          stage="remote_control"
          payload="$(jq -nc --arg email "$RECOVERY_EMAIL" --arg password "$RECOVERY_PASSWORD" '{email:$email,password:$password}')"
          runner_b64="$(tail -n +2 "$runner" | base64 -w0)"
          printf -v q_mode '%q' "$MODE"
          printf -v q_path '%q' "$DEPLOY_PATH"
          printf -v q_active '%q' "$EXPECTED_ACTIVE_REVISION"
          printf -v q_state '%q' "$EXPECTED_STATE_SHA256"
          printf -v q_runner '%q' "$runner_b64"

          if [ "$MODE" = apply ]; then
            jq '.write_state="ambiguous"' "$receipt" > "$receipt.tmp"
            mv "$receipt.tmp" "$receipt"
          fi

          set +e
          result="$({ printf '%s' "$payload"; } | timeout --signal=TERM --kill-after=10s 180s \
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
              -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "MODE=$q_mode DEPLOY_PATH=$q_path EXPECTED_ACTIVE_REVISION=$q_active EXPECTED_STATE_SHA256=$q_state RECOVERY_RUNNER_B64=$q_runner php -r 'eval(base64_decode((string) getenv(\"RECOVERY_RUNNER_B64\")));'" \
              2>"$safe_err")"
          rc=$?
          set -e
          unset payload RECOVERY_EMAIL RECOVERY_PASSWORD runner_b64

          if [ "$rc" -ne 0 ]; then
            safe_failure="$(grep -Eo 'OPS_OWNER_RECOVERY_FAILED:[A-Z0-9_]+' "$safe_err" | tail -n 1 || true)"
            rm -f "$safe_err"
            if [[ "$safe_failure" =~ ^OPS_OWNER_RECOVERY_FAILED:[A-Z0-9_]+$ ]]; then
              fail "$safe_failure"
            fi
            fail REMOTE_CONTROL_FAILURE
          fi
          rm -f "$safe_err"

          if [ "$MODE" = preflight ]; then
            test "$(awk -F $'\t' '{print NF}' <<<"$result")" -eq 12 || fail INVALID_PREFLIGHT_OUTPUT
            IFS=$'\t' read -r active email_sha account_sha account_count is_active is_locked password_matches totp_enrolled role_count state_sha recovery_required apply_supported <<<"$result"
            test "$active" = "$EXPECTED_ACTIVE_REVISION" || fail ACTIVE_REVISION_MISMATCH
            for value in "$email_sha" "$account_sha" "$state_sha"; do [[ "$value" =~ ^[0-9a-f]{64}$ ]] || fail INVALID_PREFLIGHT_OUTPUT; done
            [[ "$account_count" =~ ^[0-2]$ ]] || fail INVALID_PREFLIGHT_OUTPUT
            [[ "$role_count" =~ ^[0-9]+$ ]] || fail INVALID_PREFLIGHT_OUTPUT
            for value in "$is_active" "$is_locked" "$password_matches" "$totp_enrolled" "$recovery_required" "$apply_supported"; do [[ "$value" =~ ^(true|false)$ ]] || fail INVALID_PREFLIGHT_OUTPUT; done

            jq \
              --arg email "$email_sha" --arg account "$account_sha" --argjson count "$account_count" \
              --argjson active "$is_active" --argjson locked "$is_locked" --argjson matches "$password_matches" \
              --argjson totp "$totp_enrolled" --argjson roles "$role_count" --arg state "$state_sha" \
              --argjson required "$recovery_required" --argjson supported "$apply_supported" \
              --arg checked_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '.status="PASS_PREFLIGHT" | .failed_stage=null | .failure_code=null
               | .email_sha256=$email | .account_sha256=$account | .account_count=$count
               | .is_active_before=$active | .is_locked_before=$locked | .password_matches_before=$matches
               | .totp_enrolled=$totp | .role_count=$roles | .state_sha256_before=$state
               | .recovery_required=$required | .apply_supported=$supported
               | .secret_transmitted_via_stdin=true | .checked_at=$checked_at' \
              "$receipt" > "$receipt.tmp"
          else
            test "$(awk -F $'\t' '{print NF}' <<<"$result")" -eq 7 || fail INVALID_APPLY_OUTPUT
            IFS=$'\t' read -r active email_sha account_sha state_after totp_preserved roles_preserved recovery_succeeded <<<"$result"
            test "$active" = "$EXPECTED_ACTIVE_REVISION" || fail ACTIVE_REVISION_MISMATCH
            test "$account_sha" = "$EXPECTED_ACCOUNT_SHA256" || fail ACCOUNT_BINDING_MISMATCH
            [[ "$email_sha" =~ ^[0-9a-f]{64}$ ]] || fail INVALID_APPLY_OUTPUT
            [[ "$state_after" =~ ^[0-9a-f]{64}$ ]] || fail INVALID_APPLY_OUTPUT
            test "$totp_preserved" = true && test "$roles_preserved" = true && test "$recovery_succeeded" = true || fail POST_WRITE_VERIFICATION_FAILED

            jq \
              --arg email "$email_sha" --arg account "$account_sha" --arg before "$EXPECTED_STATE_SHA256" \
              --arg after "$state_after" --arg checked_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '.status="PASS_APPLY" | .failed_stage=null | .failure_code=null
               | .email_sha256=$email | .account_sha256=$account | .account_count=1
               | .state_sha256_before=$before | .state_sha256_after=$after
               | .totp_preserved=true | .roles_preserved=true | .recovery_succeeded=true
               | .secret_transmitted_via_stdin=true | .production_write_execution=true
               | .admin_user_write_count=1 | .write_state="committed_and_verified"
               | .checked_at=$checked_at' \
              "$receipt" > "$receipt.tmp"
          fi
          mv "$receipt.tmp" "$receipt"
          trap - ERR

      - name: Upload sanitized credential recovery receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-production-ops-owner-credential-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/backend-production-ops-owner-credential-recovery.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce terminal result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/backend-production-ops-owner-credential-recovery.json"
          test "${{ steps.execute.outcome }}" = success
          if [ "${{ inputs.mode }}" = preflight ]; then
            jq -e '.status == "PASS_PREFLIGHT" and .production_write_execution == false and .write_state == "confirmed_zero_write"' "$receipt" >/dev/null
          else
            jq -e '.status == "PASS_APPLY" and .production_write_execution == true and .admin_user_write_count == 1 and .write_state == "committed_and_verified" and .totp_preserved == true and .roles_preserved == true' "$receipt" >/dev/null
          fi
