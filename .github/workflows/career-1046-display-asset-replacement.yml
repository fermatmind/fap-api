name: Career 1046 Display Asset Replacement
run-name: Career 1046 display asset execute [op:${{ inputs.operation_key }}]

on:
  workflow_dispatch:
    inputs:
      expected_control_plane_sha:
        description: Exact deployed main-ancestor SHA containing this workflow and package
        required: true
        type: string
      expected_package_sha256:
        description: Exact normalized assets.jsonl SHA-256
        required: true
        type: string
      operation_key:
        description: Deterministic controlled-operation key
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.repository }}-production
  cancel-in-progress: false

jobs:
  operation_gate:
    name: Elect display-asset operation owner before Environment access
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      decision: ${{ steps.gate.outputs.decision }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - id: identity
        shell: bash
        env:
          IDENTITY: control=${{ inputs.expected_control_plane_sha }}|package=${{ inputs.expected_package_sha256 }}|mode=execute
        run: echo "operation_key=$(node .github/scripts/controlled-operation-gate.cjs key --repository "$GITHUB_REPOSITORY" --workflow .github/workflows/career-1046-display-asset-replacement.yml --scope career-1046-display-asset-replacement --identity "$IDENTITY")" >> "$GITHUB_OUTPUT"
      - id: gate
        uses: ./.github/actions/controlled-operation-gate
        with:
          claimed-key: ${{ inputs.operation_key }}
          expected-key: ${{ steps.identity.outputs.operation_key }}
          workflow-file: career-1046-display-asset-replacement.yml
          receipt-template: career-1046-display-asset-execute-{run_id}-{run_attempt}

  execute:
    name: Execute Career 1046 replacement once
    needs: operation_gate
    if: needs.operation_gate.outputs.decision == 'execute'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    steps:
      - name: Check out exact control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.expected_control_plane_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate immutable main-ancestor package
        shell: bash
        env:
          CONTROL: ${{ inputs.expected_control_plane_sha }}
          PACKAGE: ${{ inputs.expected_package_sha256 }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$CONTROL" =~ ^[a-f0-9]{40}$ ]]
          [[ "$PACKAGE" =~ ^[a-f0-9]{64}$ ]]
          test "$(git rev-parse HEAD)" = "$CONTROL"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$CONTROL" origin/main
          package_path=backend/content_assets/career/workbuddy-1046-display-v1
          test "$(sha256sum "$package_path/assets.jsonl" | awk '{print $1}')" = "$PACKAGE"
          delivery_sha="$(sha256sum "$package_path/w12_s3_delivery_report.json" | awk '{print $1}')"
          jq -e --arg package "$PACKAGE" --arg delivery "$delivery_sha" '
            .contract_version == "career.workbuddy_1046_display_asset_package.v2"
            and .counts.careers == 1046
            and .counts.locale_rows == 2092
            and .counts.content_blocks == 4184
            and .files[0].sha256 == $package
            and .files[1].sha256 == $delivery
            and .source_delivery_report.sha256 == $delivery
            and .mapping.numeric_rating_statement_residue_count == 0
            and .negative_guarantees.discoverability_change == false
            and .negative_guarantees.search_submission == false
          ' "$package_path/manifest.json" >/dev/null

      - name: Set up pinned production SSH identity
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known hosts
        shell: bash
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS"
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null || ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f ~/.ssh/known_hosts >/dev/null

      - name: Execute exact production replacement without mutation retry
        shell: bash
        env:
          CONTROL: ${{ inputs.expected_control_plane_sha }}
          PACKAGE: ${{ inputs.expected_package_sha256 }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ && "$DEPLOY_PATH" != *".."* ]]
          mkdir -p artifacts
          receipt=artifacts/career-1046-display-asset-replacement.json
          remote_receipt="$RUNNER_TEMP/career-1046-display-asset-remote-receipt.json"
          ssh_stderr="$RUNNER_TEMP/career-1046-display-asset-ssh-stderr.log"
          : > "$ssh_stderr"
          chmod 0600 "$ssh_stderr"
          trap 'rm -f -- "$ssh_stderr"' EXIT
          jq -n --arg control "$CONTROL" --arg package "$PACKAGE" '{contract_version:"career.1046.display_asset_replacement.v2",mode:"execute",status:"FAIL_DISPLAY_ASSET_REPLACEMENT",failed_stage:"remote_transport",safe_error_code:"REMOTE_TRANSPORT_FAILURE",control_plane_sha:$control,release_sha:$control,package_sha256:$package,production_write_execution:true,write_commit_state:"ambiguous",writes_committed:false,automatic_retry_allowed:false}' > "$receipt"
          printf -v q_path '%q' "$DEPLOY_PATH"
          printf -v q_control '%q' "$CONTROL"
          printf -v q_package '%q' "$PACKAGE"
          printf -v q_run '%q' "$GITHUB_RUN_ID"
          printf -v q_attempt '%q' "$GITHUB_RUN_ATTEMPT"
          remote_command="set -euo pipefail; current=\$(readlink -f $q_path/current); test -n \"\$current\"; test \"\$(tr -d '\\r\\n' < \"\$current/REVISION\")\" = $q_control; test ! -e $q_path/.dep/deploy.lock; release_name=\$(basename \"\$current\"); sudo -n -u www-data -- env CAREER_DISPLAY_REPLACEMENT_EXECUTE=1 CAREER_DISPLAY_REPLACEMENT_BACKEND_ROOT=\"\$current/backend\" CAREER_DISPLAY_REPLACEMENT_CONTROL_PLANE_SHA=$q_control CAREER_DISPLAY_REPLACEMENT_RELEASE_SHA=$q_control CAREER_DISPLAY_REPLACEMENT_RELEASE_NAME=\"\$release_name\" CAREER_DISPLAY_REPLACEMENT_PACKAGE_SHA256=$q_package CAREER_DISPLAY_REPLACEMENT_WORKFLOW_RUN_ID=$q_run CAREER_DISPLAY_REPLACEMENT_WORKFLOW_RUN_ATTEMPT=$q_attempt php \"\$current/backend/scripts/operations/career_1046_display_asset_replacement.php\""
          set +e
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command" > "$remote_receipt" 2> "$ssh_stderr"
          ssh_rc=$?
          set -e
          if [ "$ssh_rc" -ne 0 ]; then
            if [ -s "$remote_receipt" ] && jq -e --arg control "$CONTROL" --arg package "$PACKAGE" '
              .contract_version == "career.1046.display_asset_replacement.v2"
              and .mode == "execute"
              and .status == "FAIL_DISPLAY_ASSET_REPLACEMENT"
              and .control_plane_sha == $control
              and .release_sha == $control
              and .package_sha256 == $package
              and (.safe_error_code | type == "string" and length > 0)
              and .production_write_execution == true
              and .automatic_retry_allowed == false
            ' "$remote_receipt" >/dev/null 2>&1; then
              mv "$remote_receipt" "$receipt"
            else
              safe_error_code=REMOTE_TRANSPORT_FAILURE
              if grep -Eiq 'host key verification failed|remote host identification has changed' "$ssh_stderr"; then
                safe_error_code=REMOTE_HOST_KEY_FAILURE
              elif grep -Eiq 'permission denied|authentication failed' "$ssh_stderr"; then
                safe_error_code=REMOTE_AUTHENTICATION_FAILURE
              elif grep -Eiq 'connection timed out|operation timed out' "$ssh_stderr"; then
                safe_error_code=REMOTE_CONNECTION_TIMEOUT
              elif grep -Eiq 'connection refused' "$ssh_stderr"; then
                safe_error_code=REMOTE_CONNECTION_REFUSED
              elif grep -Eiq 'connection reset|broken pipe' "$ssh_stderr"; then
                safe_error_code=REMOTE_CONNECTION_RESET
              elif grep -Eiq 'no route to host|network is unreachable|could not resolve hostname' "$ssh_stderr"; then
                safe_error_code=REMOTE_NETWORK_FAILURE
              fi
              jq --arg safe_error_code "$safe_error_code" '.safe_error_code = $safe_error_code' "$receipt" > "$receipt.tmp"
              mv "$receipt.tmp" "$receipt"
            fi
            exit "$ssh_rc"
          fi
          if [ ! -s "$remote_receipt" ] || ! jq -e . "$remote_receipt" >/dev/null 2>&1; then
            jq '.safe_error_code = "REMOTE_RECEIPT_INVALID"' "$receipt" > "$receipt.tmp"
            mv "$receipt.tmp" "$receipt"
            exit 1
          fi
          mv "$remote_receipt" "$receipt"
          jq -e --arg control "$CONTROL" --arg package "$PACKAGE" '
            .contract_version == "career.1046.display_asset_replacement.v2"
            and .mode == "execute"
            and .status == "PASS_EXECUTE_DISPLAY_ASSET_REPLACEMENT"
            and .control_plane_sha == $control
            and .release_sha == $control
            and .package_sha256 == $package
            and .package.career_count == 1046
            and .package.locale_row_count == 2092
            and .package.content_block_count == 4184
            and .package.numeric_rating_statement_residue_count == 0
            and .authority.target_count == 1046
            and .authority.component_order_after_count == 1046
            and .authority.occupation_crosswalk_after_count == 24
            and (.authority.occupation_crosswalk_set_sha256 | test("^[0-9a-f]{64}$"))
            and .cache.ready_active_count == 2092
            and .cache.component_26_count == 2092
            and .cache.content_match_count == 2092
            and .cache.career_ai_description_block_sha256 == .package.career_ai_description_block_sha256
            and .cache.career_path_block_sha256 == .package.career_path_block_sha256
            and .cache.display_block_aggregate_sha256 == .package.display_block_aggregate_sha256
            and .production_write_execution == true
            and .automatic_retry_allowed == false
            and (if .idempotent_noop then
              .write_commit_state == "confirmed_zero_write"
              and .writes_committed == false
              and ([.write_counts[]] | add) == 0
            else
              .write_commit_state == "committed"
              and .writes_committed == true
              and .write_counts.database_update_count == 1034
              and .write_counts.database_insert_count == 12
              and .write_counts.occupation_crosswalk_insert_count == 24
              and .write_counts.cache_pointer_activation_count == 2092
            end)
          ' "$receipt" >/dev/null

      - name: Validate all 2092 public pages
        shell: bash
        run: bash backend/scripts/operations/career_1046_display_asset_live_validate.sh backend/content_assets/career/workbuddy-1046-display-v1/assets.jsonl artifacts/career-1046-display-asset-replacement.json | tee artifacts/career-1046-display-asset-live-validation.json >/dev/null

      - name: Upload immutable operation receipt
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: career-1046-display-asset-execute-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/career-1046-display-asset-replacement.json
            artifacts/career-1046-display-asset-live-validation.json
          if-no-files-found: error
          retention-days: 30
