name: Backend Greenfield Current Baseline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "SELECT-only preflight or current-published export"
        required: true
        type: choice
        options:
          - preflight
          - export
      expected_control_plane_sha:
        description: "Exact latest main control-plane SHA"
        required: true
        type: string
      expected_active_revision:
        description: "Exact source API active revision"
        required: true
        type: string
      expected_projection_sha256:
        description: "Exact current Career runtime projection SHA256"
        required: true
        type: string
      expected_media_host_set_sha256:
        description: "Required for export; copied from the successful preflight receipt"
        required: false
        type: string
      operator_approval_phrase:
        description: "Exact SELECT-only Greenfield baseline approval"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.repository }}-production
  cancel-in-progress: false

jobs:
  current-baseline:
    name: Stream current-published baseline without source writes
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    env:
      MODE: ${{ inputs.mode }}
      EXPECTED_CONTROL_PLANE_SHA: ${{ inputs.expected_control_plane_sha }}
      EXPECTED_ACTIVE_REVISION: ${{ inputs.expected_active_revision }}
      EXPECTED_PROJECTION_SHA256: ${{ inputs.expected_projection_sha256 }}
      EXPECTED_MEDIA_HOST_SET_SHA256: ${{ inputs.expected_media_host_set_sha256 }}
      OPERATOR_APPROVAL_PHRASE: ${{ inputs.operator_approval_phrase }}

    steps:
      - name: Check out exact main control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.expected_control_plane_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate immutable SELECT-only inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$MODE" = "preflight" || "$MODE" = "export" ]]
          [[ "$EXPECTED_CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_ACTIVE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_PROJECTION_SHA256" =~ ^[0-9a-f]{64}$ ]]
          if [ "$MODE" = "export" ]; then
            [[ "$EXPECTED_MEDIA_HOST_SET_SHA256" =~ ^[0-9a-f]{64}$ ]]
          else
            test -z "$EXPECTED_MEDIA_HOST_SET_SHA256"
          fi
          expected="I explicitly approve SELECT-only production Greenfield current-baseline ${MODE} for active SHA ${EXPECTED_ACTIVE_REVISION} control SHA ${EXPECTED_CONTROL_PLANE_SHA} projection SHA256 ${EXPECTED_PROJECTION_SHA256}."
          if [ "$MODE" = "export" ]; then
            expected="${expected%?} media host-set SHA256 ${EXPECTED_MEDIA_HOST_SET_SHA256}."
          fi
          test "$OPERATOR_APPROVAL_PHRASE" = "$expected"
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_CONTROL_PLANE_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_CONTROL_PLANE_SHA"

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: mbstring, intl, curl, json, openssl, fileinfo, pdo, pdo_sqlite, sqlite3, pdo_mysql

      - name: Cache Composer
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            backend/vendor
            ~/.composer/cache/files
          key: ${{ runner.os }}-php84-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php84-

      - name: Install control-plane dependencies
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p storage/framework/cache/data storage/framework/views storage/framework/sessions storage/logs bootstrap/cache
          composer install --no-interaction --prefer-dist --no-progress

      - name: Set up pinned production SSH identity
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known hosts
        shell: bash
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS"
          for name in DEPLOY_USER DEPLOY_PORT DEPLOY_HOST DEPLOY_PATH; do
            test -n "${!name:-}"
          done
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          test "$DEPLOY_PORT" -ge 1
          test "$DEPLOY_PORT" -le 65535
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_PATH" != *".."* ]]
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null \
            || ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f ~/.ssh/known_hosts >/dev/null

      - name: Stream source snapshot through stdin without remote files
        shell: bash
        env:
          DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/greenfield"
          printf -v q_deploy_path '%q' "$DEPLOY_PATH"
          printf -v q_active_revision '%q' "$EXPECTED_ACTIVE_REVISION"
          php -r '
            require "backend/app/Domain/GreenfieldBaseline/GreenfieldBaselineCatalog.php";
            require "backend/app/Domain/GreenfieldBaseline/GreenfieldBaselineSourceScript.php";
            echo (new App\Domain\GreenfieldBaseline\GreenfieldBaselineSourceScript)->render();
          ' | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH=$q_deploy_path EXPECTED_ACTIVE_REVISION=$q_active_revision php" \
            > "$RUNNER_TEMP/greenfield/source.jsonl" \
            2> "$RUNNER_TEMP/greenfield/source.stderr"
          test ! -s "$RUNNER_TEMP/greenfield/source.stderr"
          jq -e -c 'select(.type == "header") | .writes_committed == false' \
            "$RUNNER_TEMP/greenfield/source.jsonl" >/dev/null
          jq -e -c 'select(.type == "footer") | .writes_committed == false' \
            "$RUNNER_TEMP/greenfield/source.jsonl" >/dev/null

      - name: Build and verify deterministic package
        shell: bash
        env:
          APP_ENV: testing
          APP_KEY: greenfield_runner_only_key_32bytes
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: |
          set -euo pipefail
          package_args=(
            --stream="$RUNNER_TEMP/greenfield/source.jsonl"
            --output="$RUNNER_TEMP/greenfield/package"
            --expected-projection-sha256="$EXPECTED_PROJECTION_SHA256"
            --json
          )
          if [ "$MODE" = "export" ]; then
            package_args+=(
              --download-media
              --expected-media-host-set-sha256="$EXPECTED_MEDIA_HOST_SET_SHA256"
            )
          fi
          php backend/artisan greenfield:baseline:package "${package_args[@]}" \
            > "$RUNNER_TEMP/greenfield/package-summary.json"
          package_sha256="$(jq -er '.package_sha256' "$RUNNER_TEMP/greenfield/package-summary.json")"
          php backend/artisan greenfield:baseline:verify \
            --package="$RUNNER_TEMP/greenfield/package" \
            --expected-package-sha256="$package_sha256" \
            --json > "$RUNNER_TEMP/greenfield/verify.json"
          jq -e '
            .status == "ready"
            and .writes_committed == false
            and .dataset_counts.articles == 129
            and .dataset_counts.content_pages == 56
            and .dataset_counts.landing_surfaces == 15
            and .dataset_counts.personality_public_content_assets == 220
            and .dataset_counts.personality_profiles == 32
            and .dataset_counts.personality_profile_variants == 64
            and .dataset_counts.career_jobs == 378
            and .dataset_counts.career_guides == 20
            and .dataset_counts.occupations == 1046
            and .dataset_counts.career_job_ai_impact_assets == 2092
            and .dataset_counts.career_job_salary_assets == 2092
            and .dataset_counts.career_job_page_assembly_assets == 2092
            and .dataset_counts.media_assets == 111
            and .dataset_counts.media_variants == 660
            and .media.entry_count == 771
            and .media.downloaded == (env.MODE == "export")
            and .career_projection.sha256 == env.EXPECTED_PROJECTION_SHA256
            and .career_projection.tracked_slug_count == 342
            and .career_projection.public_slug_count == 30
            and .career_projection.state_counts.blocked == 622
            and .career_projection.state_counts.quarantined == 2
          ' "$RUNNER_TEMP/greenfield/verify.json" >/dev/null

      - name: Emit sanitized immutable receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          jq -n \
            --arg mode "$MODE" \
            --arg control_plane_sha "$EXPECTED_CONTROL_PLANE_SHA" \
            --arg active_revision "$EXPECTED_ACTIVE_REVISION" \
            --arg package_sha256 "$(jq -er '.package_sha256' "$RUNNER_TEMP/greenfield/verify.json")" \
            --arg projection_sha256 "$EXPECTED_PROJECTION_SHA256" \
            --arg media_host_set_sha256 "$(jq -er '.media.host_set_sha256' "$RUNNER_TEMP/greenfield/verify.json")" \
            --argjson dataset_counts "$(jq -c '.dataset_counts' "$RUNNER_TEMP/greenfield/verify.json")" \
            --argjson career_projection "$(jq -c '.career_projection' "$RUNNER_TEMP/greenfield/verify.json")" \
            --argjson media "$(jq -c '.media' "$RUNNER_TEMP/greenfield/verify.json")" \
            '{
              schema_version: "backend-greenfield-current-baseline.receipt.v1",
              status: "PASS_GREENFIELD_CURRENT_BASELINE_" + ($mode | ascii_upcase),
              mode: $mode,
              control_plane_sha: $control_plane_sha,
              active_revision: $active_revision,
              package_sha256: $package_sha256,
              projection_sha256: $projection_sha256,
              media_host_set_sha256: $media_host_set_sha256,
              dataset_counts: $dataset_counts,
              career_projection: $career_projection,
              media: $media,
              source_database_write: false,
              source_remote_file_write: false,
              database_import: false,
              deployment: false,
              service_restart: false,
              dns_change: false,
              queue_action: false,
              redis_action: false,
              writes_committed: false
            }' > artifacts/backend-greenfield-current-baseline-receipt.json
          jq -e '.writes_committed == false and .source_remote_file_write == false' \
            artifacts/backend-greenfield-current-baseline-receipt.json >/dev/null
          if [ "$MODE" = "export" ]; then
            cp -R "$RUNNER_TEMP/greenfield/package" artifacts/package
          fi

      - name: Upload preflight receipt
        if: ${{ inputs.mode == 'preflight' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-greenfield-current-baseline-preflight-${{ github.run_id }}
          path: artifacts/backend-greenfield-current-baseline-receipt.json
          if-no-files-found: error
          retention-days: 3

      - name: Upload verified current-published package
        if: ${{ inputs.mode == 'export' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-greenfield-current-baseline-export-${{ github.run_id }}
          path: artifacts
          if-no-files-found: error
          retention-days: 3
