              private_path_leak_count: $public.private_path_leak_count,
              non_career_url_set_sha256: $public.non_career_url_set_sha256,
              expected_apply_approval_phrase: $expected_phrase,
              cache_write_count: 0,
              database_write_count: 0,
              publication_write_count: 0,
              indexability_write_count: 0,
              deploy_count: 0,
              migration_count: 0,
              symlink_write_count: 0,
              process_restart_count: 0,
              queue_reload_count: 0,
              sitemap_submission_count: 0,
              llms_submission_count: 0,
              search_submission_count: 0,
              career_link_publication_gate: "CLOSED",
              automatic_retry_allowed: false
            }' > "$RECEIPT"
          case "$status" in
            PASS_C03_REVERIFIED_NO_APPLY_REQUIRED|PASS_RECOVERY_REQUIRED) ;;
            *) exit 1 ;;
          esac

      - name: Apply exact cache-only recovery
        if: inputs.mode == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          verify="$RUNNER_TEMP/validated-verify.json"
          current_pre_state="$(jq -Scn \
            --argjson inspect "$(<"$RUNNER_TEMP/career-c03-inspection.json")" \
            --argjson public "$(<"$RUNNER_TEMP/career-c03-public-verification.json")" \
            '{authority_artifact_sha256:$inspect.authority_artifact_sha256,authority:$inspect.authority,coverage:$inspect.coverage,detail_coverage:$inspect.detail_coverage,job_index_converged:$inspect.job_index_converged,directory_converged:$inspect.directory_converged,sitemap_source_converged:$inspect.sitemap_source_converged,public:($public | del(.detail_readback.network_attempt_count,.detail_readback.transport_retry_count,.detail_readback.recovered_transport_failure_count,.detail_readback.recovered_incomplete_transfer_count,.shared_surface_readback) | .surface_diagnostics |= with_entries(.value |= del(.request_count,.transport_class,.latency_class,.transport_retry_count,.recovered_retry_count,.terminal_transport_failure_count,.incomplete_transfer_count,.timeout_count,.other_transport_failure_count,.server_error_count,.non_200_count,.terminal)))}' \
            | sha256sum | awk '{print $1}')"
          test "$current_pre_state" = "$(jq -r '.pre_state_sha256' "$verify")"
          test "$(jq -Sc '.cache_key_manifest' "$RUNNER_TEMP/career-c03-inspection.json")" = "$(jq -Sc '.cache_key_manifest' "$verify")"
          test "$(jq -r '.cache_key_manifest_sha256' "$RUNNER_TEMP/career-c03-inspection.json")" = "$(jq -r '.cache_key_manifest_sha256' "$verify")"
          test "$(jq -Sc '.revalidation_path_manifest' "$RUNNER_TEMP/career-c03-inspection.json")" = "$(jq -Sc '.revalidation_path_manifest' "$verify")"
          test "$(jq -r '.revalidation_path_manifest_sha256' "$RUNNER_TEMP/career-c03-inspection.json")" = "$(jq -r '.revalidation_path_manifest_sha256' "$verify")"
          printf -v q_deploy_path '%q' "$DEPLOY_PATH"
          printf -v q_active '%q' "$EXPECTED_ACTIVE_REVISION"
          printf -v q_authority '%q' "$AUTHORITY_PROJECTION_SHA256"
          printf -v q_backup '%q' "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          set +e
          result="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -euo pipefail; current=\$(readlink -f $q_deploy_path/current); test -f \"\$current/REVISION\"; test \"\$(tr -d '\\r\\n' < \"\$current/REVISION\")\" = $q_active; test ! -e $q_deploy_path/.dep/deploy.lock; test \"\$(ps -eo comm=,args= | awk '\$1 == \"php\" && (\$0 ~ /dep(\\.phar)? .* production/ || \$0 ~ /artisan migrate/) {n++} END {print n+0}')\" = 0; CAREER_C03_BACKEND_ROOT=\"\$current/backend\" CAREER_C03_EXPECTED_AUTHORITY_SHA256=$q_authority CAREER_C03_CACHE_APPLY_AUTHORIZED=1 CAREER_C03_BACKUP_ID=$q_backup php /dev/stdin apply" \
            < "$RUNNER")"
          apply_rc=$?
          set -e
          printf '%s' "$result" > "$RUNNER_TEMP/career-c03-apply-result.json"
          if [ "$apply_rc" -ne 0 ] || ! jq -e '.status == "PASS_CACHE_APPLY_INTERNAL"' "$RUNNER_TEMP/career-c03-apply-result.json" >/dev/null; then
            if jq -e '.status == "HOLD_APPLY_ROLLED_BACK" and .rollback_verified == true' "$RUNNER_TEMP/career-c03-apply-result.json" >/dev/null; then
              status=HOLD_APPLY_ROLLED_BACK
              rollback_verified=true
            else
              status=HOLD_ROLLBACK_INCOMPLETE
              rollback_verified=false
            fi
            jq -n \
              --arg status "$status" \
              --arg control "$CONTROL_PLANE_SHA" \
              --arg active "$EXPECTED_ACTIVE_REVISION" \
              --argjson rollback_verified "$rollback_verified" '
              {
                contract_version: "career.c03.cache_only_discoverability_recovery.v1",
                mode: "apply",
                status: $status,
                control_plane_sha: $control,
                active_revision: $active,
                rollback_verified: $rollback_verified,
                automatic_retry_allowed: false,
                database_write_count: 0,
                publication_write_count: 0,
                indexability_write_count: 0,
                deploy_count: 0,
                migration_count: 0,
                symlink_write_count: 0,
                process_restart_count: 0,
                queue_reload_count: 0,
                sitemap_submission_count: 0,
                llms_submission_count: 0,
                search_submission_count: 0,
                career_link_publication_gate: "CLOSED"
              }' > "$RECEIPT"
            echo 'CAREER_C03_CACHE_APPLY_FAILED' >&2
            exit 1
          fi
          test "$(jq -r '.authority_artifact_sha256' "$RUNNER_TEMP/career-c03-apply-result.json")" = "$AUTHORITY_PROJECTION_SHA256"
          test "$(jq -r '.target_set_sha256' "$verify")" = "$(jq -r '.target_set_sha256' "$RUNNER_TEMP/career-c03-inspection.json")"

      - name: Capture post-apply public readback
        if: inputs.mode == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          verify="$RUNNER_TEMP/validated-verify.json"
          capture_public() {
            local inspection="$1" dir="$2" output="$3"
            mkdir -p "$dir"
            safe_empty() {
              local kind="$1" destination="$2"
              case "$kind" in
                collection) printf '%s' '{"items":[]}' > "$destination" ;;
                sitemap_source) printf '%s' '{"ok":true,"source":"backend_sitemap_generator","items":[]}' > "$destination" ;;
                text) : > "$destination" ;;
                *) return 2 ;;
              esac
            }
            fetch() {
              local id="$1" kind="$2" url="$3" destination="$4"
              local metadata rc http retries elapsed elapsed_ms
              set +e
              metadata="$(curl --http1.1 --proto '=https' --request GET --max-redirs 0 \
                -fsS --retry 2 --retry-delay 2 --retry-all-errors \
                --connect-timeout 10 --max-time 60 -H 'Cache-Control: no-cache' \
                --output "$destination" --write-out $'%{http_code}\t%{num_retries}\t%{time_total}' "$url" \
                2>"$dir/$id.stderr")"
              rc=$?
              set -e
              rm -f "$dir/$id.stderr"
              IFS=$'\t' read -r http retries elapsed <<<"$metadata"
              if [[ ! "${http:-}" =~ ^[0-9]{3}$ ]] || [[ ! "${retries:-}" =~ ^[0-2]$ ]] \
                || [[ ! "${elapsed:-}" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
                http=000
                retries=0
                elapsed=0
                rc=99
              fi
              elapsed_ms="$(awk -v seconds="$elapsed" 'BEGIN {printf "%d", (seconds * 1000) + 0.5}')"
              if [ "$rc" -ne 0 ] || [ "$http" != 200 ]; then
                safe_empty "$kind" "$destination"
              fi
              printf '%s\t%s\t%s\t%s\t%s\n' "$id" "$http" "$rc" "$retries" "$elapsed_ms" \
                > "$dir/status-$id.tsv"
            }
            fetch jobs_en collection 'https://api.fermatmind.com/api/v0.5/career/jobs?locale=en' "$dir/jobs-en.json" &
            local first=$!
            fetch jobs_zh collection 'https://api.fermatmind.com/api/v0.5/career/jobs?locale=zh-CN' "$dir/jobs-zh.json" &
            local second=$!
            wait "$first"; wait "$second"
            fetch directory_en collection 'https://api.fermatmind.com/api/v0.5/career/directory?locale=en' "$dir/directory-en.json" &
            first=$!
            fetch directory_zh collection 'https://api.fermatmind.com/api/v0.5/career/directory?locale=zh-CN' "$dir/directory-zh.json" &
            second=$!
            wait "$first"; wait "$second"
            fetch sitemap_source sitemap_source 'https://api.fermatmind.com/api/v0.5/seo/sitemap-source' "$dir/sitemap-source.json" &
            first=$!
            fetch sitemap text 'https://fermatmind.com/sitemap.xml' "$dir/sitemap.xml" &
            second=$!
            wait "$first"; wait "$second"
            fetch llms text 'https://fermatmind.com/llms.txt' "$dir/llms.txt" &
            first=$!
            fetch llms_full text 'https://fermatmind.com/llms-full.txt' "$dir/llms-full.txt" &
            second=$!
            wait "$first"; wait "$second"
            : > "$dir/shared-surface-status.tsv"
            for id in jobs_en jobs_zh directory_en directory_zh sitemap_source sitemap llms llms_full; do
              test -f "$dir/status-$id.tsv"
              while IFS= read -r line; do
                printf '%s\n' "$line" >> "$dir/shared-surface-status.tsv"
              done < "$dir/status-$id.tsv"
            done
            bash "$PUBLIC_READBACK_RUNNER" "$inspection" "$dir/detail-status.tsv"
            set +e
            php "$RUNNER" public-verify \
              "$inspection" \
              "$dir/jobs-en.json" "$dir/jobs-zh.json" \
              "$dir/directory-en.json" "$dir/directory-zh.json" \
              "$dir/sitemap-source.json" "$dir/sitemap.xml" \
              "$dir/llms.txt" "$dir/llms-full.txt" "$dir/detail-status.tsv" \
              "$dir/shared-surface-status.tsv" > "$output"
            CAPTURE_RC=$?
            set -e
            jq -e 'type == "object"' "$output" >/dev/null
          }

          post="$RUNNER_TEMP/career-c03-public-post.json"
          capture_public "$RUNNER_TEMP/career-c03-inspection.json" "$RUNNER_TEMP/career-c03-public-post" "$post"
          if [ "$CAPTURE_RC" = 0 ] && jq -e --argjson expected "$(jq '.non_career_url_set_sha256' "$verify")" \
            '.converged == true and .non_career_url_set_sha256 == $expected' "$post" >/dev/null; then
            cp "$post" "$RUNNER_TEMP/career-c03-public-verification.json"
            exit 0
          fi

          printf -v q_deploy_path '%q' "$DEPLOY_PATH"
          printf -v q_active '%q' "$EXPECTED_ACTIVE_REVISION"
          printf -v q_authority '%q' "$AUTHORITY_PROJECTION_SHA256"
          printf -v q_backup '%q' "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          set +e
          rollback_result="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -euo pipefail; current=\$(readlink -f $q_deploy_path/current); test -f \"\$current/REVISION\"; test \"\$(tr -d '\\r\\n' < \"\$current/REVISION\")\" = $q_active; CAREER_C03_BACKEND_ROOT=\"\$current/backend\" CAREER_C03_EXPECTED_AUTHORITY_SHA256=$q_authority CAREER_C03_CACHE_APPLY_AUTHORIZED=1 CAREER_C03_BACKUP_ID=$q_backup php /dev/stdin rollback" \
            < "$RUNNER")"
          rollback_rc=$?
          set -e
          printf '%s' "$rollback_result" > "$RUNNER_TEMP/career-c03-rollback-result.json"

          rollback_complete=false
          if [ "$rollback_rc" = 0 ] && jq -e '.status == "PASS_ROLLBACK_VERIFIED" and .rollback_verified == true' \
            "$RUNNER_TEMP/career-c03-rollback-result.json" >/dev/null; then
            set +e
            restored_inspection="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
              -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "set -euo pipefail; current=\$(readlink -f $q_deploy_path/current); test -f \"\$current/REVISION\"; test \"\$(tr -d '\\r\\n' < \"\$current/REVISION\")\" = $q_active; CAREER_C03_BACKEND_ROOT=\"\$current/backend\" CAREER_C03_EXPECTED_AUTHORITY_SHA256=$q_authority php /dev/stdin inspect" \
              < "$RUNNER")"
            inspect_rc=$?
            set -e
            printf '%s' "$restored_inspection" > "$RUNNER_TEMP/career-c03-restored-inspection.json"
            if [ "$inspect_rc" = 0 ] && jq -e '.status == "PASS_AUTHORITY_READABLE"' "$RUNNER_TEMP/career-c03-restored-inspection.json" >/dev/null; then
              capture_public "$RUNNER_TEMP/career-c03-restored-inspection.json" "$RUNNER_TEMP/career-c03-public-restored" "$RUNNER_TEMP/career-c03-public-restored.json"
              restored_pre_state="$(jq -Scn \
                --argjson inspect "$(<"$RUNNER_TEMP/career-c03-restored-inspection.json")" \
                --argjson public "$(<"$RUNNER_TEMP/career-c03-public-restored.json")" \
                '{authority_artifact_sha256:$inspect.authority_artifact_sha256,authority:$inspect.authority,coverage:$inspect.coverage,detail_coverage:$inspect.detail_coverage,job_index_converged:$inspect.job_index_converged,directory_converged:$inspect.directory_converged,sitemap_source_converged:$inspect.sitemap_source_converged,public:($public | del(.detail_readback.network_attempt_count,.detail_readback.transport_retry_count,.detail_readback.recovered_transport_failure_count,.detail_readback.recovered_incomplete_transfer_count,.shared_surface_readback) | .surface_diagnostics |= with_entries(.value |= del(.request_count,.transport_class,.latency_class,.transport_retry_count,.recovered_retry_count,.terminal_transport_failure_count,.incomplete_transfer_count,.timeout_count,.other_transport_failure_count,.server_error_count,.non_200_count,.terminal)))}' \
                | sha256sum | awk '{print $1}')"
              if [ "$restored_pre_state" = "$(jq -r '.pre_state_sha256' "$verify")" ]; then
                rollback_complete=true
              fi
            fi
          fi

          if [ "$rollback_complete" = true ]; then
            status=HOLD_APPLY_ROLLED_BACK
          else
            status=HOLD_ROLLBACK_INCOMPLETE
          fi
          jq -n \
            --arg mode apply \
            --arg status "$status" \
            --arg control "$CONTROL_PLANE_SHA" \
            --arg active "$EXPECTED_ACTIVE_REVISION" \
            --argjson rollback_verified "$rollback_complete" \
            '{
              contract_version: "career.c03.cache_only_discoverability_recovery.v1",
              mode: $mode,
              status: $status,
              control_plane_sha: $control,
              active_revision: $active,
              rollback_verified: $rollback_verified,
              automatic_retry_allowed: false,
              database_write_count: 0,
              publication_write_count: 0,
              indexability_write_count: 0,
              deploy_count: 0,
              migration_count: 0,
              symlink_write_count: 0,
              process_restart_count: 0,
              queue_reload_count: 0,
              sitemap_submission_count: 0,
              llms_submission_count: 0,
              search_submission_count: 0,
              career_link_publication_gate: "CLOSED"
            }' > "$RECEIPT"
          exit 1

      - name: Write recovered C03 receipt
        if: inputs.mode == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          apply="$RUNNER_TEMP/career-c03-apply-result.json"
          public="$RUNNER_TEMP/career-c03-public-verification.json"
          verify="$RUNNER_TEMP/validated-verify.json"
          approval_sha="$(printf '%s' "$OPERATOR_APPROVAL_PHRASE" | sha256sum | awk '{print $1}')"
          jq -n \
            --arg control "$CONTROL_PLANE_SHA" \
            --arg active "$EXPECTED_ACTIVE_REVISION" \
            --arg runner "$RUNNER_SHA256" \
            --arg readback_runner "$PUBLIC_READBACK_RUNNER_SHA256" \
            --arg authority "$AUTHORITY_PROJECTION_SHA256" \
            --arg incident_run "$INCIDENT_CLOSEOUT_RUN_ID" \
            --arg incident_sha "$EXPECTED_INCIDENT_CLOSEOUT_RECEIPT_SHA256" \
            --arg verify_run "$VERIFY_RUN_ID" \
            --arg verify_sha "$EXPECTED_VERIFY_RECEIPT_SHA256" \
            --arg approval_sha "$approval_sha" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --argjson apply "$(<"$apply")" \
            --argjson public "$(<"$public")" \
            --argjson verify "$(<"$verify")" '
            {
              contract_version: "career.c03.cache_only_discoverability_recovery.v1",
              mode: "apply",
              status: "PASS_C03_RECOVERED",
              control_plane_sha: $control,
              active_revision: $active,
              runner_sha256: $runner,
              public_readback_runner_sha256: $readback_runner,
              workflow_run_id: ($run_id | tonumber),
              workflow_run_attempt: ($attempt | tonumber),
              incident_closeout_run_id: ($incident_run | tonumber),
              incident_closeout_receipt_sha256: $incident_sha,
              verify_run_id: ($verify_run | tonumber),
              verify_receipt_sha256: $verify_sha,
              authority_artifact_sha256: $authority,
              target_set_sha256: $verify.target_set_sha256,
              pre_state_sha256: $verify.pre_state_sha256,
              backup_sha256: $apply.backup_sha256,
              backup_state_sha256: $apply.backup_state_sha256,
              published_cohort: $apply.cohort,
              detail_repair_target_count: $apply.detail_repair_target_count,
              frontend_revalidation_path_count: $apply.frontend_revalidation_path_count,
              surface_diagnostics: $public.surface_diagnostics,
              shared_surface_readback: $public.shared_surface_readback,
              public_timeout_count: $public.detail_readback.timeout_count,
              public_transport_retry_count: $public.detail_readback.transport_retry_count,
              public_recovered_transport_failure_count: $public.detail_readback.recovered_transport_failure_count,
              public_recovered_incomplete_transfer_count: $public.detail_readback.recovered_incomplete_transfer_count,
              public_terminal_transport_failure_count: $public.detail_readback.terminal_transport_failure_count,
              public_incomplete_transfer_count: $public.detail_readback.incomplete_transfer_count,
              public_other_transport_failure_count: $public.detail_readback.other_transport_failure_count,
              public_5xx_count: $public.detail_readback.server_error_count,
              public_non_200_count: $public.detail_readback.non_200_count,
              private_path_leak_count: $public.private_path_leak_count,
              non_career_url_set_sha256: $public.non_career_url_set_sha256,
              operator_approval_phrase_sha256: $approval_sha,
              rollback_status: "not_required",
              cache_write_count: ($apply.detail_repair_target_count + $apply.directory_locale_count + $apply.backend_cache_key_count),
              database_write_count: 0,
              publication_write_count: 0,
              indexability_write_count: 0,
              deploy_count: 0,
              migration_count: 0,
              symlink_write_count: 0,
              process_restart_count: 0,
              queue_reload_count: 0,
              sitemap_submission_count: 0,
              llms_submission_count: 0,
              search_submission_count: 0,
              career_link_publication_gate: "CLOSED",
              automatic_retry_allowed: false
            }' > "$RECEIPT"

      - name: Validate final receipt
        shell: bash
        run: |
          set -euo pipefail
          case "$MODE" in
            incident_closeout) expected=PASS_INCIDENT_CLOSED ;;
            verify) expected_re='^(PASS_C03_REVERIFIED_NO_APPLY_REQUIRED|PASS_RECOVERY_REQUIRED)$' ;;
            apply) expected=PASS_C03_RECOVERED ;;
          esac
          jq -e --arg mode "$MODE" --arg control "$CONTROL_PLANE_SHA" --arg active "$EXPECTED_ACTIVE_REVISION" \
            --arg readback_runner "$PUBLIC_READBACK_RUNNER_SHA256" '
            .contract_version == "career.c03.cache_only_discoverability_recovery.v1"
            and .mode == $mode
            and .control_plane_sha == $control
            and .active_revision == $active
            and .public_readback_runner_sha256 == $readback_runner
            and .career_link_publication_gate == "CLOSED"
            and .database_write_count == 0
            and .publication_write_count == 0
            and .indexability_write_count == 0
            and .deploy_count == 0
            and .migration_count == 0
            and .symlink_write_count == 0
            and .process_restart_count == 0
            and .queue_reload_count == 0
            and .sitemap_submission_count == 0
            and .llms_submission_count == 0
            and .search_submission_count == 0' "$RECEIPT" >/dev/null
          if [ "$MODE" = verify ]; then
            jq -e --arg re "$expected_re" '.status | test($re)' "$RECEIPT" >/dev/null
          else
            test "$(jq -r '.status' "$RECEIPT")" = "$expected"
          fi

      - name: Publish safe summary
        if: success()
        shell: bash
        run: |
          {
            echo '## Career C03 cache-only discoverability control'
            echo
            echo "- mode: $MODE"
            echo "- status: $(jq -r '.status' "$RECEIPT")"
            echo "- active revision unchanged: true"
            echo "- Career link publication gate: CLOSED"
            echo "- deploy/migration/database/publication/search writes: 0"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable sanitized receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: career-c03-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/career-c03-cache-only-discoverability-recovery.json
          if-no-files-found: error
          retention-days: 30
