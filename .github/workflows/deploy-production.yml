          artifact_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${incident_run_id}/artifacts")"
          artifact_count="$(jq --arg name "$incident_artifact_name" '[.artifacts[] | select(.name == $name)] | length' <<<"$artifact_json")"
          test "$artifact_count" = "1"
          observed_artifact_digest="$(jq -r --arg name "$incident_artifact_name" '.artifacts[] | select(.name == $name) | .digest' <<<"$artifact_json")"
          observed_artifact_expired="$(jq -r --arg name "$incident_artifact_name" '.artifacts[] | select(.name == $name) | .expired' <<<"$artifact_json")"
          test "$observed_artifact_digest" = "$incident_artifact_digest"
          test "$observed_artifact_expired" = "false"

          incident_dir="$RUNNER_TEMP/bounded-public-dns-incident"
