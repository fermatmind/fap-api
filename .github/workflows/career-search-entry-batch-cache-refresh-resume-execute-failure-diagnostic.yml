name: Career Search Entry Batch Cache Refresh Resume Execute Failure Diagnostic

on:
  workflow_dispatch:
    inputs:
      expected_control_plane_sha:
        description: Exact latest main SHA containing this diagnostic control
        required: true
        type: string
      expected_release_sha:
        description: Exact unchanged active production application SHA
        required: true
        type: string
      expected_release_name:
        description: Exact unchanged active production release name
        required: true
        type: string
      failed_resume_execute_run_id:
        description: Exact failed cache-only resume execute run
        required: true
        type: string
      failed_resume_execute_run_attempt:
        description: Exact failed cache-only resume execute attempt
        required: true
        type: string
      expected_failed_resume_execute_receipt_sha256:
        description: Exact immutable failed resume execute receipt SHA
        required: true
        type: string
      preflight_run_id:
        description: Exact successful diagnostic-rebased resume preflight run
        required: true
        type: string
      preflight_run_attempt:
        description: Exact successful diagnostic-rebased resume preflight attempt
        required: true
        type: string
      expected_preflight_receipt_sha256:
        description: Exact immutable diagnostic-rebased resume preflight receipt SHA
        required: true
        type: string
      expected_manifest_sha256:
        description: Exact bound 50-slug manifest SHA
        required: true
        type: string
      expected_preflight_state_sha256:
        description: Exact bound resume preflight state SHA
        required: true
        type: string
      expected_resume_target_set_sha256:
        description: Exact bound residual target-set SHA
        required: true
        type: string
      expected_failed_target_index_sha256:
        description: Exact safe failed-target index SHA
        required: true
        type: string
      expected_observed_payload_set_sha256:
        description: Exact complete 100-URL payload-set SHA observed by the failed execute
        required: true
        type: string
      operator_approval_phrase:
        description: Exact receipt-bound read-only diagnostic phrase
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-${{ github.repository }}-production
  cancel-in-progress: false

jobs:
  eligibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      control_plane_sha: ${{ steps.validate.outputs.control_plane_sha }}
      release_sha: ${{ steps.validate.outputs.release_sha }}
      release_name: ${{ steps.validate.outputs.release_name }}
      failed_resume_execute_run_id: ${{ steps.validate.outputs.failed_resume_execute_run_id }}
      failed_resume_execute_run_attempt: ${{ steps.validate.outputs.failed_resume_execute_run_attempt }}
      failed_resume_execute_receipt_sha256: ${{ steps.validate.outputs.failed_resume_execute_receipt_sha256 }}
      failed_execute_input_binding_sha256: ${{ steps.validate.outputs.failed_execute_input_binding_sha256 }}
      preflight_run_id: ${{ steps.validate.outputs.preflight_run_id }}
      preflight_run_attempt: ${{ steps.validate.outputs.preflight_run_attempt }}
      preflight_receipt_sha256: ${{ steps.validate.outputs.preflight_receipt_sha256 }}
      manifest_sha256: ${{ steps.validate.outputs.manifest_sha256 }}
      preflight_state_sha256: ${{ steps.validate.outputs.preflight_state_sha256 }}
      resume_target_set_sha256: ${{ steps.validate.outputs.resume_target_set_sha256 }}
      failed_target_index_sha256: ${{ steps.validate.outputs.failed_target_index_sha256 }}
      observed_payload_set_sha256: ${{ steps.validate.outputs.observed_payload_set_sha256 }}
      bad_href_url_count: ${{ steps.validate.outputs.bad_href_url_count }}
      low_module_url_count: ${{ steps.validate.outputs.low_module_url_count }}
      failed_run_id: ${{ steps.validate.outputs.failed_run_id }}
      failed_run_attempt: ${{ steps.validate.outputs.failed_run_attempt }}
      failed_receipt_sha256: ${{ steps.validate.outputs.failed_receipt_sha256 }}
      recovery_run_id: ${{ steps.validate.outputs.recovery_run_id }}
      recovery_run_attempt: ${{ steps.validate.outputs.recovery_run_attempt }}
      recovery_receipt_sha256: ${{ steps.validate.outputs.recovery_receipt_sha256 }}
      failed_preflight_run_id: ${{ steps.validate.outputs.failed_preflight_run_id }}
      failed_preflight_run_attempt: ${{ steps.validate.outputs.failed_preflight_run_attempt }}
      failed_preflight_receipt_sha256: ${{ steps.validate.outputs.failed_preflight_receipt_sha256 }}
      diagnostic_run_id: ${{ steps.validate.outputs.diagnostic_run_id }}
      diagnostic_run_attempt: ${{ steps.validate.outputs.diagnostic_run_attempt }}
      diagnostic_receipt_sha256: ${{ steps.validate.outputs.diagnostic_receipt_sha256 }}
    steps:
      - name: Checkout exact execute-failure diagnostic control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.expected_control_plane_sha }}
          fetch-depth: 0

      - name: Bind latest main, failed execute receipt, and exact diagnostic authorization
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CONTROL_PLANE_SHA: ${{ inputs.expected_control_plane_sha }}
          EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
          EXPECTED_RELEASE_NAME: ${{ inputs.expected_release_name }}
          FAILED_RESUME_EXECUTE_RUN_ID: ${{ inputs.failed_resume_execute_run_id }}
          FAILED_RESUME_EXECUTE_RUN_ATTEMPT: ${{ inputs.failed_resume_execute_run_attempt }}
          EXPECTED_FAILED_RESUME_EXECUTE_RECEIPT_SHA256: ${{ inputs.expected_failed_resume_execute_receipt_sha256 }}
          PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
          PREFLIGHT_RUN_ATTEMPT: ${{ inputs.preflight_run_attempt }}
          EXPECTED_PREFLIGHT_RECEIPT_SHA256: ${{ inputs.expected_preflight_receipt_sha256 }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.expected_manifest_sha256 }}
          EXPECTED_PREFLIGHT_STATE_SHA256: ${{ inputs.expected_preflight_state_sha256 }}
          EXPECTED_RESUME_TARGET_SET_SHA256: ${{ inputs.expected_resume_target_set_sha256 }}
          EXPECTED_FAILED_TARGET_INDEX_SHA256: ${{ inputs.expected_failed_target_index_sha256 }}
          EXPECTED_OBSERVED_PAYLOAD_SET_SHA256: ${{ inputs.expected_observed_payload_set_sha256 }}
          OPERATOR_APPROVAL_PHRASE: ${{ inputs.operator_approval_phrase }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$EXPECTED_CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_RELEASE_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          [[ "$FAILED_RESUME_EXECUTE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$FAILED_RESUME_EXECUTE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$PREFLIGHT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PREFLIGHT_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          for hash in \
            "$EXPECTED_FAILED_RESUME_EXECUTE_RECEIPT_SHA256" \
            "$EXPECTED_PREFLIGHT_RECEIPT_SHA256" \
            "$EXPECTED_MANIFEST_SHA256" \
            "$EXPECTED_PREFLIGHT_STATE_SHA256" \
            "$EXPECTED_RESUME_TARGET_SET_SHA256" \
            "$EXPECTED_FAILED_TARGET_INDEX_SHA256" \
            "$EXPECTED_OBSERVED_PAYLOAD_SET_SHA256"; do
            [[ "$hash" =~ ^[0-9a-f]{64}$ ]]
          done

          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_CONTROL_PLANE_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_CONTROL_PLANE_SHA"
          git merge-base --is-ancestor "$EXPECTED_RELEASE_SHA" origin/main

          failed_run="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_RESUME_EXECUTE_RUN_ID}"
          )"
          failed_control_sha="$(jq -er '.head_sha' <<<"$failed_run")"
          jq -e \
            --argjson attempt "$FAILED_RESUME_EXECUTE_RUN_ATTEMPT" \
            '.name == "Career Search Entry Batch Cache Refresh Resume"
             and .path == ".github/workflows/career-search-entry-batch-cache-refresh-resume.yml"
             and .event == "workflow_dispatch"
             and .status == "completed"
             and .conclusion == "failure"
             and .head_branch == "main"
             and .run_attempt == $attempt' <<<"$failed_run" >/dev/null

          failed_dir="$(mktemp -d)"
          gh run download "$FAILED_RESUME_EXECUTE_RUN_ID" \
            --name "career-search-entry-batch-cache-refresh-resume-execute-${FAILED_RESUME_EXECUTE_RUN_ID}-${FAILED_RESUME_EXECUTE_RUN_ATTEMPT}" \
            --dir "$failed_dir"
          failed_receipt="$failed_dir/career-search-entry-batch-cache-refresh-resume.json"
          actual_failed_receipt_sha256="$(sha256sum "$failed_receipt" | awk '{print $1}')"
          test "$actual_failed_receipt_sha256" = "$EXPECTED_FAILED_RESUME_EXECUTE_RECEIPT_SHA256"

          jq -e \
            --arg release "$EXPECTED_RELEASE_SHA" \
            --arg release_name "$EXPECTED_RELEASE_NAME" \
            --arg control "$failed_control_sha" \
            --arg manifest "$EXPECTED_MANIFEST_SHA256" \
            --arg preflight_state "$EXPECTED_PREFLIGHT_STATE_SHA256" \
            --arg targets "$EXPECTED_RESUME_TARGET_SET_SHA256" \
            --arg failed_target "$EXPECTED_FAILED_TARGET_INDEX_SHA256" \
            --arg payload_set "$EXPECTED_OBSERVED_PAYLOAD_SET_SHA256" \
            --argjson run_id "$FAILED_RESUME_EXECUTE_RUN_ID" \
            --argjson run_attempt "$FAILED_RESUME_EXECUTE_RUN_ATTEMPT" \
            '.contract_version == "career.search_entry_batch.cache_refresh.resume.v1"
             and .mode == "execute"
             and .status == "FAIL_CLOSED"
             and .release_sha == $release
             and .release_name == $release_name
             and .manifest_sha256 == $manifest
             and .control_plane_sha == $control
             and .failed_stage == "publish_cache_payload"
             and .failure_category == "cache_publish_failed"
             and .failed_target_index_sha256 == $failed_target
             and .observed_payload_set_sha256 == $payload_set
             and .observed_url_count == 100
             and .observed_http_200_count == 100
             and .observed_transport_failure_count == 0
             and .observed_non_200_response_count == 0
             and .observed_canonical_ok_count == 100
             and .observed_robots_ok_count == 100
             and .observed_locale_ok_count == 100
             and .observed_bad_href_url_count > 0
             and .observed_low_module_url_count >= 0
             and .write_state == "none"
             and .production_write_execution == false
             and .cache_refresh_target_count == 0
             and .completed_batch_count == 0
             and .per_target_retry_limit == 0
             and .workflow_run_id == $run_id
             and .workflow_run_attempt == $run_attempt
             and .database_write_count == 0
             and .cms_write_count == 0
             and .publication_write_count == 0
             and .indexability_write_count == 0
             and .queue_dispatch_count == 0
             and .sitemap_write_count == 0
             and .llms_write_count == 0
             and .search_channel_action_count == 0
             and .url_submission_count == 0
             and .non_target_write_count == 0
             and .deploy_count == 0
             and .rollback_count == 0' "$failed_receipt" >/dev/null

          failed_execute_log="$(gh run view "$FAILED_RESUME_EXECUTE_RUN_ID" --log)"
          for binding in \
            "PREFLIGHT_RUN_ID: ${PREFLIGHT_RUN_ID}" \
            "PREFLIGHT_RUN_ATTEMPT: ${PREFLIGHT_RUN_ATTEMPT}" \
            "EXPECTED_PREFLIGHT_STATE_SHA256: ${EXPECTED_PREFLIGHT_STATE_SHA256}" \
            "EXPECTED_RESUME_TARGET_SET_SHA256: ${EXPECTED_RESUME_TARGET_SET_SHA256}"; do
            awk -v binding="$binding" \
              'length($0) >= length(binding) && substr($0, length($0) - length(binding) + 1) == binding {
                 found = 1
               }
               END { exit(found ? 0 : 1) }' \
              <<<"$failed_execute_log"
          done
          unset failed_execute_log
          failed_execute_input_binding_sha256="$(
            printf '%s\n' \
              "preflight_run_id=${PREFLIGHT_RUN_ID}" \
              "preflight_run_attempt=${PREFLIGHT_RUN_ATTEMPT}" \
              "preflight_state_sha256=${EXPECTED_PREFLIGHT_STATE_SHA256}" \
              "resume_target_set_sha256=${EXPECTED_RESUME_TARGET_SET_SHA256}" \
              | sha256sum | awk '{print $1}'
          )"

          preflight_run="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREFLIGHT_RUN_ID}"
          )"
          preflight_control_sha="$(jq -er '.head_sha' <<<"$preflight_run")"
          jq -e \
            --argjson attempt "$PREFLIGHT_RUN_ATTEMPT" \
            '.name == "Career Search Entry Batch Cache Refresh Resume"
             and .path == ".github/workflows/career-search-entry-batch-cache-refresh-resume.yml"
             and .event == "workflow_dispatch"
             and .status == "completed"
             and .conclusion == "success"
             and .head_branch == "main"
             and .run_attempt == $attempt' <<<"$preflight_run" >/dev/null
          git merge-base --is-ancestor "$preflight_control_sha" origin/main
          preflight_dir="$(mktemp -d)"
          gh run download "$PREFLIGHT_RUN_ID" \
            --name "career-search-entry-batch-cache-refresh-resume-preflight-${PREFLIGHT_RUN_ID}-${PREFLIGHT_RUN_ATTEMPT}" \
            --dir "$preflight_dir"
          preflight_receipt="$preflight_dir/career-search-entry-batch-cache-refresh-resume.json"
          actual_preflight_receipt_sha256="$(sha256sum "$preflight_receipt" | awk '{print $1}')"
          test "$actual_preflight_receipt_sha256" = "$EXPECTED_PREFLIGHT_RECEIPT_SHA256"
          jq -e \
            --arg release "$EXPECTED_RELEASE_SHA" \
            --arg release_name "$EXPECTED_RELEASE_NAME" \
            --arg control "$preflight_control_sha" \
            --arg manifest "$EXPECTED_MANIFEST_SHA256" \
            --arg preflight_state "$EXPECTED_PREFLIGHT_STATE_SHA256" \
            --arg targets "$EXPECTED_RESUME_TARGET_SET_SHA256" \
            --arg payload_set "$EXPECTED_OBSERVED_PAYLOAD_SET_SHA256" \
            --argjson run_id "$PREFLIGHT_RUN_ID" \
            --argjson run_attempt "$PREFLIGHT_RUN_ATTEMPT" \
            --slurpfile failed "$failed_receipt" \
            '.contract_version == "career.search_entry_batch.cache_refresh.resume.v1"
             and .mode == "preflight"
             and .status == "PASS_PREFLIGHT_RESUME_REQUIRED"
             and .release_sha == $release
             and .release_name == $release_name
             and .control_plane_sha == $control
             and .manifest_sha256 == $manifest
             and .preflight_state_sha256 == $preflight_state
             and .resume_target_set_sha256 == $targets
             and .pre_refresh_payload_set_sha256 == $payload_set
             and .candidate_count == 50
             and .bilingual_url_count == 100
             and .bad_href_url_count == $failed[0].observed_bad_href_url_count
             and .low_module_url_count == $failed[0].observed_low_module_url_count
             and .resume_target_count == 75
             and .resume_batch_count == 10
             and .max_batch_target_count == 10
             and .max_batch_slug_count == 5
             and .offline_build_budget_ms == 5000
             and .per_target_retry_limit == 0
             and .write_state == "none"
             and .production_write_execution == false
             and .cache_refresh_target_count == 0
             and .completed_batch_count == 0
             and .workflow_run_id == $run_id
             and .workflow_run_attempt == $run_attempt
             and .failed_run_id == $failed[0].failed_run_id
             and .failed_run_attempt == $failed[0].failed_run_attempt
             and .failed_receipt_sha256 == $failed[0].failed_receipt_sha256
             and .recovery_run_id == $failed[0].recovery_run_id
             and .recovery_run_attempt == $failed[0].recovery_run_attempt
             and .recovery_receipt_sha256 == $failed[0].recovery_receipt_sha256
             and .failed_preflight_run_id == $failed[0].failed_preflight_run_id
             and .failed_preflight_run_attempt == $failed[0].failed_preflight_run_attempt
             and .failed_preflight_receipt_sha256 == $failed[0].failed_preflight_receipt_sha256
             and .diagnostic_run_id == $failed[0].diagnostic_run_id
             and .diagnostic_run_attempt == $failed[0].diagnostic_run_attempt
             and .diagnostic_receipt_sha256 == $failed[0].diagnostic_receipt_sha256
             and .diagnostic_state_sha256 == $failed[0].diagnostic_state_sha256
             and .diagnostic_payload_set_sha256 == $payload_set
             and .database_write_count == 0
             and .cms_write_count == 0
             and .publication_write_count == 0
             and .indexability_write_count == 0
             and .queue_dispatch_count == 0
             and .sitemap_write_count == 0
             and .llms_write_count == 0
             and .search_channel_action_count == 0
             and .url_submission_count == 0
             and .non_target_write_count == 0
             and .deploy_count == 0
             and .rollback_count == 0' "$preflight_receipt" >/dev/null
          test "$PREFLIGHT_RUN_ID" -lt "$FAILED_RESUME_EXECUTE_RUN_ID"

          bad_href_url_count="$(jq -er '.observed_bad_href_url_count' "$failed_receipt")"
          low_module_url_count="$(jq -er '.observed_low_module_url_count' "$failed_receipt")"
          failed_run_id="$(jq -er '.failed_run_id' "$failed_receipt")"
          failed_run_attempt="$(jq -er '.failed_run_attempt' "$failed_receipt")"
          failed_receipt_sha256="$(jq -er '.failed_receipt_sha256' "$failed_receipt")"
          recovery_run_id="$(jq -er '.recovery_run_id' "$failed_receipt")"
          recovery_run_attempt="$(jq -er '.recovery_run_attempt' "$failed_receipt")"
          recovery_receipt_sha256="$(jq -er '.recovery_receipt_sha256' "$failed_receipt")"
          failed_preflight_run_id="$(jq -er '.failed_preflight_run_id' "$failed_receipt")"
          failed_preflight_run_attempt="$(jq -er '.failed_preflight_run_attempt' "$failed_receipt")"
          failed_preflight_receipt_sha256="$(jq -er '.failed_preflight_receipt_sha256' "$failed_receipt")"
          diagnostic_run_id="$(jq -er '.diagnostic_run_id' "$failed_receipt")"
          diagnostic_run_attempt="$(jq -er '.diagnostic_run_attempt' "$failed_receipt")"
          diagnostic_receipt_sha256="$(jq -er '.diagnostic_receipt_sha256' "$failed_receipt")"

          latest_resume="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/career-search-entry-batch-cache-refresh-resume.yml/runs?event=workflow_dispatch&per_page=100"
          )"
          jq -e \
            --argjson failed_execute "$FAILED_RESUME_EXECUTE_RUN_ID" \
            '[.workflow_runs[] | select(.id > $failed_execute)] | length == 0' \
            <<<"$latest_resume" >/dev/null

          later_diagnostic="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/career-search-entry-batch-cache-refresh-resume-execute-failure-diagnostic.yml/runs?event=workflow_dispatch&per_page=100"
          )"
          jq -e \
            --argjson failed_execute "$FAILED_RESUME_EXECUTE_RUN_ID" \
            --argjson current_run "$GITHUB_RUN_ID" \
            '[.workflow_runs[] | select(.id > $failed_execute and .id != $current_run)] | length == 0' \
            <<<"$later_diagnostic" >/dev/null

          expected_phrase="I explicitly approve one read-only Career search-entry cache-only resume execute-failure diagnostic for failed resume execute run ${FAILED_RESUME_EXECUTE_RUN_ID} attempt ${FAILED_RESUME_EXECUTE_RUN_ATTEMPT} receipt ${EXPECTED_FAILED_RESUME_EXECUTE_RECEIPT_SHA256}, preflight run ${PREFLIGHT_RUN_ID} attempt ${PREFLIGHT_RUN_ATTEMPT} receipt ${EXPECTED_PREFLIGHT_RECEIPT_SHA256}, control-plane SHA ${EXPECTED_CONTROL_PLANE_SHA}, active SHA ${EXPECTED_RELEASE_SHA}, manifest ${EXPECTED_MANIFEST_SHA256}, state ${EXPECTED_PREFLIGHT_STATE_SHA256}, target set ${EXPECTED_RESUME_TARGET_SET_SHA256}, failed target index ${EXPECTED_FAILED_TARGET_INDEX_SHA256}, observed payload set ${EXPECTED_OBSERVED_PAYLOAD_SET_SHA256}; inspect only safe aggregate cache runtime-identity and 100-URL snapshot state, with zero cache write, retry, rollback, deploy, CMS/DB write, or Search Channel operation."
          test "$OPERATOR_APPROVAL_PHRASE" = "$expected_phrase"

          {
            echo "control_plane_sha=$EXPECTED_CONTROL_PLANE_SHA"
            echo "release_sha=$EXPECTED_RELEASE_SHA"
            echo "release_name=$EXPECTED_RELEASE_NAME"
            echo "failed_resume_execute_run_id=$FAILED_RESUME_EXECUTE_RUN_ID"
            echo "failed_resume_execute_run_attempt=$FAILED_RESUME_EXECUTE_RUN_ATTEMPT"
            echo "failed_resume_execute_receipt_sha256=$EXPECTED_FAILED_RESUME_EXECUTE_RECEIPT_SHA256"
            echo "failed_execute_input_binding_sha256=$failed_execute_input_binding_sha256"
            echo "preflight_run_id=$PREFLIGHT_RUN_ID"
            echo "preflight_run_attempt=$PREFLIGHT_RUN_ATTEMPT"
            echo "preflight_receipt_sha256=$EXPECTED_PREFLIGHT_RECEIPT_SHA256"
            echo "manifest_sha256=$EXPECTED_MANIFEST_SHA256"
            echo "preflight_state_sha256=$EXPECTED_PREFLIGHT_STATE_SHA256"
            echo "resume_target_set_sha256=$EXPECTED_RESUME_TARGET_SET_SHA256"
            echo "failed_target_index_sha256=$EXPECTED_FAILED_TARGET_INDEX_SHA256"
            echo "observed_payload_set_sha256=$EXPECTED_OBSERVED_PAYLOAD_SET_SHA256"
            echo "bad_href_url_count=$bad_href_url_count"
            echo "low_module_url_count=$low_module_url_count"
            echo "failed_run_id=$failed_run_id"
            echo "failed_run_attempt=$failed_run_attempt"
            echo "failed_receipt_sha256=$failed_receipt_sha256"
            echo "recovery_run_id=$recovery_run_id"
            echo "recovery_run_attempt=$recovery_run_attempt"
            echo "recovery_receipt_sha256=$recovery_receipt_sha256"
            echo "failed_preflight_run_id=$failed_preflight_run_id"
            echo "failed_preflight_run_attempt=$failed_preflight_run_attempt"
            echo "failed_preflight_receipt_sha256=$failed_preflight_receipt_sha256"
            echo "diagnostic_run_id=$diagnostic_run_id"
            echo "diagnostic_run_attempt=$diagnostic_run_attempt"
            echo "diagnostic_receipt_sha256=$diagnostic_receipt_sha256"
          } >> "$GITHUB_OUTPUT"

  diagnose:
    needs: eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
      DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
      RETIRED_DEPLOY_HOST: ${{ secrets.PRODUCTION_RETIRED_DEPLOY_HOST }}
      DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
      CONTROL_PLANE_SHA: ${{ needs.eligibility.outputs.control_plane_sha }}
      EXPECTED_RELEASE_SHA: ${{ needs.eligibility.outputs.release_sha }}
      EXPECTED_RELEASE_NAME: ${{ needs.eligibility.outputs.release_name }}
      FAILED_RESUME_EXECUTE_RUN_ID: ${{ needs.eligibility.outputs.failed_resume_execute_run_id }}
      FAILED_RESUME_EXECUTE_RUN_ATTEMPT: ${{ needs.eligibility.outputs.failed_resume_execute_run_attempt }}
      FAILED_RESUME_EXECUTE_RECEIPT_SHA256: ${{ needs.eligibility.outputs.failed_resume_execute_receipt_sha256 }}
      FAILED_EXECUTE_INPUT_BINDING_SHA256: ${{ needs.eligibility.outputs.failed_execute_input_binding_sha256 }}
      PREFLIGHT_RUN_ID: ${{ needs.eligibility.outputs.preflight_run_id }}
      PREFLIGHT_RUN_ATTEMPT: ${{ needs.eligibility.outputs.preflight_run_attempt }}
      PREFLIGHT_RECEIPT_SHA256: ${{ needs.eligibility.outputs.preflight_receipt_sha256 }}
      EXPECTED_MANIFEST_SHA256: ${{ needs.eligibility.outputs.manifest_sha256 }}
      EXPECTED_PREFLIGHT_STATE_SHA256: ${{ needs.eligibility.outputs.preflight_state_sha256 }}
      EXPECTED_RESUME_TARGET_SET_SHA256: ${{ needs.eligibility.outputs.resume_target_set_sha256 }}
      EXPECTED_FAILED_TARGET_INDEX_SHA256: ${{ needs.eligibility.outputs.failed_target_index_sha256 }}
      EXPECTED_OBSERVED_PAYLOAD_SET_SHA256: ${{ needs.eligibility.outputs.observed_payload_set_sha256 }}
      EXPECTED_BAD_HREF_URL_COUNT: ${{ needs.eligibility.outputs.bad_href_url_count }}
      EXPECTED_LOW_MODULE_URL_COUNT: ${{ needs.eligibility.outputs.low_module_url_count }}
      FAILED_RUN_ID: ${{ needs.eligibility.outputs.failed_run_id }}
      FAILED_RUN_ATTEMPT: ${{ needs.eligibility.outputs.failed_run_attempt }}
      FAILED_RECEIPT_SHA256: ${{ needs.eligibility.outputs.failed_receipt_sha256 }}
      RECOVERY_RUN_ID: ${{ needs.eligibility.outputs.recovery_run_id }}
      RECOVERY_RUN_ATTEMPT: ${{ needs.eligibility.outputs.recovery_run_attempt }}
      RECOVERY_RECEIPT_SHA256: ${{ needs.eligibility.outputs.recovery_receipt_sha256 }}
      FAILED_PREFLIGHT_RUN_ID: ${{ needs.eligibility.outputs.failed_preflight_run_id }}
      FAILED_PREFLIGHT_RUN_ATTEMPT: ${{ needs.eligibility.outputs.failed_preflight_run_attempt }}
      FAILED_PREFLIGHT_RECEIPT_SHA256: ${{ needs.eligibility.outputs.failed_preflight_receipt_sha256 }}
      DIAGNOSTIC_RUN_ID: ${{ needs.eligibility.outputs.diagnostic_run_id }}
      DIAGNOSTIC_RUN_ATTEMPT: ${{ needs.eligibility.outputs.diagnostic_run_attempt }}
      DIAGNOSTIC_RECEIPT_SHA256: ${{ needs.eligibility.outputs.diagnostic_receipt_sha256 }}
    steps:
      - name: Checkout exact execute-failure diagnostic control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.eligibility.outputs.control_plane_sha }}
          fetch-depth: 1

      - name: Validate protected production topology
        shell: bash
        run: |
          set -euo pipefail
          for name in DEPLOY_USER DEPLOY_PORT DEPLOY_HOST RETIRED_DEPLOY_HOST DEPLOY_PATH; do
            test -n "${!name:-}"
          done
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          test "$DEPLOY_PORT" -ge 1
          test "$DEPLOY_PORT" -le 65535
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$RETIRED_DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          test "$DEPLOY_HOST" != "$RETIRED_DEPLOY_HOST"
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_PATH" != *".."* ]]
          echo "Protected production topology validated without disclosing values."

      - name: Set up SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known hosts
        shell: bash
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null \
            || ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f ~/.ssh/known_hosts >/dev/null

      - name: Inspect safe aggregate cache runtime-identity state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for variable in DEPLOY_PATH EXPECTED_RELEASE_SHA EXPECTED_RELEASE_NAME; do
            printf -v "q_${variable}" '%q' "${!variable}"
          done
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -o ServerAliveInterval=20 -o ServerAliveCountMax=30 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -euo pipefail
             current=\$(readlink -f ${q_DEPLOY_PATH}/current)
             test -n \"\$current\"
             test \"\$(basename \"\$current\")\" = ${q_EXPECTED_RELEASE_NAME}
             test \"\$(tr -d '\\r\\n' < \"\$current/REVISION\")\" = ${q_EXPECTED_RELEASE_SHA}
             test ! -e ${q_DEPLOY_PATH}/.dep/deploy.lock
             cache_dir=\"\$current/backend/storage/framework/cache/data\"
             runner_cache_readable=false
             runner_cache_writable=false
             runner_cache_tree_scan_complete=false
             runner_cache_tree_permission_ok=false
             runtime_identity_available=false
             runtime_cache_readable=false
             runtime_cache_writable=false
             runtime_cache_tree_scan_complete=false
             runtime_cache_tree_permission_ok=false
             test -r \"\$cache_dir\" && runner_cache_readable=true
             test -w \"\$cache_dir\" && runner_cache_writable=true
             runner_tree_issue=unscanned
             if runner_tree_issue=\"\$(/usr/bin/timeout 15s /usr/bin/find \"\$cache_dir\" \
               -maxdepth 3 \
               \\( \
                 -type d \\( ! -readable -o ! -writable -o ! -executable \\) \
                 -o -type f \\( ! -readable -o ! -writable \\) \
               \\) \
               -printf issue -quit 2>/dev/null)\"; then
               runner_cache_tree_scan_complete=true
               test -z \"\$runner_tree_issue\" && runner_cache_tree_permission_ok=true
             fi
             if sudo -n -u www-data -- true; then
               runtime_identity_available=true
               sudo -n -u www-data -- test -r \"\$cache_dir\" && runtime_cache_readable=true
               sudo -n -u www-data -- test -w \"\$cache_dir\" && runtime_cache_writable=true
               runtime_tree_issue=unscanned
               if runtime_tree_issue=\"\$(sudo -n -u www-data -- \
                 /usr/bin/timeout 15s /usr/bin/find \"\$cache_dir\" \
                   -maxdepth 3 \
                   \\( \
                     -type d \\( ! -readable -o ! -writable -o ! -executable \\) \
                     -o -type f \\( ! -readable -o ! -writable \\) \
                   \\) \
                   -printf issue -quit 2>/dev/null)\"; then
                 runtime_cache_tree_scan_complete=true
                 test -z \"\$runtime_tree_issue\" && runtime_cache_tree_permission_ok=true
               fi
             fi
             runtime_identity_remediation_candidate=false
             if [ \"\$runner_cache_tree_permission_ok\" = false ] \
               && [ \"\$runtime_cache_tree_permission_ok\" = true ]; then
               runtime_identity_remediation_candidate=true
             fi
             jq -n \
               --argjson runner_readable \"\$runner_cache_readable\" \
               --argjson runner_writable \"\$runner_cache_writable\" \
               --argjson runner_tree_scan \"\$runner_cache_tree_scan_complete\" \
               --argjson runner_tree_ok \"\$runner_cache_tree_permission_ok\" \
               --argjson runtime_available \"\$runtime_identity_available\" \
               --argjson runtime_readable \"\$runtime_cache_readable\" \
               --argjson runtime_writable \"\$runtime_cache_writable\" \
               --argjson runtime_tree_scan \"\$runtime_cache_tree_scan_complete\" \
               --argjson runtime_tree_ok \"\$runtime_cache_tree_permission_ok\" \
               --argjson remediation \"\$runtime_identity_remediation_candidate\" \
               '{
                 runner_cache_readable: \$runner_readable,
                 runner_cache_writable: \$runner_writable,
                 runner_cache_tree_scan_complete: \$runner_tree_scan,
                 runner_cache_tree_permission_ok: \$runner_tree_ok,
                 runtime_identity_available: \$runtime_available,
                 runtime_cache_readable: \$runtime_readable,
                 runtime_cache_writable: \$runtime_writable,
                 runtime_cache_tree_scan_complete: \$runtime_tree_scan,
                 runtime_cache_tree_permission_ok: \$runtime_tree_ok,
                 runtime_identity_remediation_candidate: \$remediation
               }'" \
            > artifacts/cache-runtime-identity.json

      - name: Run failed-execute-bound aggregate read-only snapshot
        shell: bash
        run: |
          set -euo pipefail
          runner="backend/scripts/career/career_search_entry_batch_cache_refresh_resume.php"
          runner_sha256="$(sha256sum "$runner" | awk '{print $1}')"
          for variable in \
            DEPLOY_PATH EXPECTED_RELEASE_SHA EXPECTED_RELEASE_NAME \
            EXPECTED_MANIFEST_SHA256 EXPECTED_OBSERVED_PAYLOAD_SET_SHA256 \
            EXPECTED_BAD_HREF_URL_COUNT EXPECTED_LOW_MODULE_URL_COUNT; do
            printf -v "q_${variable}" '%q' "${!variable}"
          done
          set +e
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -o ServerAliveInterval=20 -o ServerAliveCountMax=30 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "CAREER_CACHE_RESUME_MODE=diagnose DEPLOY_PATH=$q_DEPLOY_PATH EXPECTED_RELEASE_SHA=$q_EXPECTED_RELEASE_SHA EXPECTED_RELEASE_NAME=$q_EXPECTED_RELEASE_NAME EXPECTED_MANIFEST_SHA256=$q_EXPECTED_MANIFEST_SHA256 EXPECTED_BASELINE_PAYLOAD_SET_SHA256=$q_EXPECTED_OBSERVED_PAYLOAD_SET_SHA256 EXPECTED_BAD_HREF_URL_COUNT=$q_EXPECTED_BAD_HREF_URL_COUNT EXPECTED_LOW_MODULE_URL_COUNT=$q_EXPECTED_LOW_MODULE_URL_COUNT php" \
            < "$runner" > artifacts/snapshot.json
          remote_status=$?
          set -e

          jq -e \
            '.contract_version == "career.search_entry_batch.cache_refresh.resume.v1"
             and .mode == "diagnose"
             and (.status | IN(
               "HOLD_DIAGNOSTIC_SNAPSHOT_INCOMPLETE",
               "PASS_DIAGNOSTIC_COMPLETE_BASELINE_MATCH",
               "PASS_DIAGNOSTIC_COMPLETE_STATE_DRIFT"
             ))
             and .write_state == "none"
             and .production_write_execution == false
             and .cache_refresh_target_count == 0
             and .completed_batch_count == 0
             and .database_write_count == 0
             and .cms_write_count == 0
             and .publication_write_count == 0
             and .indexability_write_count == 0
             and .queue_dispatch_count == 0
             and .sitemap_write_count == 0
             and .llms_write_count == 0
             and .search_channel_action_count == 0
             and .url_submission_count == 0
             and .non_target_write_count == 0
             and .deploy_count == 0
             and .rollback_count == 0' artifacts/snapshot.json >/dev/null

          diagnostic_state_sha256="$(
            jq -cS -s \
              '{permissions: .[0], snapshot: {
                diagnostic_state_sha256: .[1].diagnostic_state_sha256,
                observed_payload_set_sha256: .[1].observed_payload_set_sha256,
                observed_url_count: .[1].observed_url_count,
                observed_http_200_count: .[1].observed_http_200_count,
                observed_transport_failure_count: .[1].observed_transport_failure_count,
                observed_non_200_response_count: .[1].observed_non_200_response_count,
                observed_bad_href_url_count: .[1].observed_bad_href_url_count,
                observed_low_module_url_count: .[1].observed_low_module_url_count,
                snapshot_complete: .[1].snapshot_complete,
                failed_execute_baseline_match: .[1].recovery_baseline_match
              }}' \
              artifacts/cache-runtime-identity.json artifacts/snapshot.json \
              | sha256sum | awk '{print $1}'
          )"
          jq -s \
            --arg control "$CONTROL_PLANE_SHA" \
            --arg runner "$runner_sha256" \
            --arg diagnostic_state "$diagnostic_state_sha256" \
            --arg failed_resume_receipt "$FAILED_RESUME_EXECUTE_RECEIPT_SHA256" \
            --arg failed_execute_input_binding "$FAILED_EXECUTE_INPUT_BINDING_SHA256" \
            --arg preflight_receipt "$PREFLIGHT_RECEIPT_SHA256" \
            --arg preflight_state "$EXPECTED_PREFLIGHT_STATE_SHA256" \
            --arg targets "$EXPECTED_RESUME_TARGET_SET_SHA256" \
            --arg failed_target "$EXPECTED_FAILED_TARGET_INDEX_SHA256" \
            --arg failed_receipt "$FAILED_RECEIPT_SHA256" \
            --arg recovery_receipt "$RECOVERY_RECEIPT_SHA256" \
            --arg failed_preflight_receipt "$FAILED_PREFLIGHT_RECEIPT_SHA256" \
            --arg diagnostic_receipt "$DIAGNOSTIC_RECEIPT_SHA256" \
            --argjson failed_resume_run "$FAILED_RESUME_EXECUTE_RUN_ID" \
            --argjson failed_resume_attempt "$FAILED_RESUME_EXECUTE_RUN_ATTEMPT" \
            --argjson preflight_run "$PREFLIGHT_RUN_ID" \
            --argjson preflight_attempt "$PREFLIGHT_RUN_ATTEMPT" \
            --argjson failed_run "$FAILED_RUN_ID" \
            --argjson failed_attempt "$FAILED_RUN_ATTEMPT" \
            --argjson recovery_run "$RECOVERY_RUN_ID" \
            --argjson recovery_attempt "$RECOVERY_RUN_ATTEMPT" \
            --argjson failed_preflight_run "$FAILED_PREFLIGHT_RUN_ID" \
            --argjson failed_preflight_attempt "$FAILED_PREFLIGHT_RUN_ATTEMPT" \
            --argjson diagnostic_run "$DIAGNOSTIC_RUN_ID" \
            --argjson diagnostic_attempt "$DIAGNOSTIC_RUN_ATTEMPT" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            '.[0] as $permissions
             | .[1] as $snapshot
             | {
                 contract_version: "career.search_entry_batch.cache_refresh.resume_execute_failure_diagnostic.v1",
                 status: (
                   if $snapshot.snapshot_complete != true then
                     "HOLD_DIAGNOSTIC_SNAPSHOT_INCOMPLETE"
                   elif $snapshot.recovery_baseline_match != true then
                     "HOLD_DIAGNOSTIC_PUBLIC_STATE_DRIFT"
                   elif $permissions.runtime_identity_available != true
                     or $permissions.runtime_cache_readable != true
                     or $permissions.runtime_cache_writable != true
                     or $permissions.runtime_cache_tree_scan_complete != true
                     or $permissions.runtime_cache_tree_permission_ok != true then
                     "HOLD_DIAGNOSTIC_RUNTIME_CACHE_UNAVAILABLE"
                   elif $permissions.runtime_identity_remediation_candidate == true then
                     "PASS_DIAGNOSTIC_RUNTIME_IDENTITY_MISMATCH"
                   else
                     "PASS_DIAGNOSTIC_PERMISSION_STATE_COMPLETE"
                   end
                 ),
                 release_sha: $snapshot.release_sha,
                 release_name: $snapshot.release_name,
                 manifest_sha256: $snapshot.manifest_sha256,
                 diagnostic_state_sha256: $diagnostic_state,
                 observed_payload_set_sha256: $snapshot.observed_payload_set_sha256,
                 observed_url_count: $snapshot.observed_url_count,
                 observed_http_200_count: $snapshot.observed_http_200_count,
                 observed_transport_failure_count: $snapshot.observed_transport_failure_count,
                 observed_non_200_response_count: $snapshot.observed_non_200_response_count,
                 observed_canonical_ok_count: $snapshot.observed_canonical_ok_count,
                 observed_robots_ok_count: $snapshot.observed_robots_ok_count,
                 observed_locale_ok_count: $snapshot.observed_locale_ok_count,
                 observed_bad_href_url_count: $snapshot.observed_bad_href_url_count,
                 observed_low_module_url_count: $snapshot.observed_low_module_url_count,
                 snapshot_complete: $snapshot.snapshot_complete,
                 failed_execute_baseline_match: $snapshot.recovery_baseline_match,
                 runner_cache_readable: $permissions.runner_cache_readable,
                 runner_cache_writable: $permissions.runner_cache_writable,
                 runner_cache_tree_scan_complete: $permissions.runner_cache_tree_scan_complete,
                 runner_cache_tree_permission_ok: $permissions.runner_cache_tree_permission_ok,
                 runtime_identity_available: $permissions.runtime_identity_available,
                 runtime_cache_readable: $permissions.runtime_cache_readable,
                 runtime_cache_writable: $permissions.runtime_cache_writable,
                 runtime_cache_tree_scan_complete: $permissions.runtime_cache_tree_scan_complete,
                 runtime_cache_tree_permission_ok: $permissions.runtime_cache_tree_permission_ok,
                 runtime_identity_remediation_candidate: $permissions.runtime_identity_remediation_candidate,
                 failed_stage: "publish_cache_payload",
                 failure_category: "cache_publish_failed",
                 failed_target_index_sha256: $failed_target,
                 preflight_state_sha256: $preflight_state,
                 resume_target_set_sha256: $targets,
                 write_state: "none",
                 production_write_execution: false,
                 cache_refresh_target_count: 0,
                 completed_batch_count: 0,
                 retry_execution_count: 0,
                 database_write_count: 0,
                 cms_write_count: 0,
                 publication_write_count: 0,
                 indexability_write_count: 0,
                 queue_dispatch_count: 0,
                 sitemap_write_count: 0,
                 llms_write_count: 0,
                 search_channel_action_count: 0,
                 url_submission_count: 0,
                 non_target_write_count: 0,
                 deploy_count: 0,
                 rollback_count: 0,
                 control_plane_sha: $control,
                 runner_sha256: $runner,
                 failed_resume_execute_run_id: $failed_resume_run,
                 failed_resume_execute_run_attempt: $failed_resume_attempt,
                 failed_resume_execute_receipt_sha256: $failed_resume_receipt,
                 failed_execute_input_binding_sha256: $failed_execute_input_binding,
                 preflight_run_id: $preflight_run,
                 preflight_run_attempt: $preflight_attempt,
                 preflight_receipt_sha256: $preflight_receipt,
                 failed_run_id: $failed_run,
                 failed_run_attempt: $failed_attempt,
                 failed_receipt_sha256: $failed_receipt,
                 recovery_run_id: $recovery_run,
                 recovery_run_attempt: $recovery_attempt,
                 recovery_receipt_sha256: $recovery_receipt,
                 failed_preflight_run_id: $failed_preflight_run,
                 failed_preflight_run_attempt: $failed_preflight_attempt,
                 failed_preflight_receipt_sha256: $failed_preflight_receipt,
                 diagnostic_run_id: $diagnostic_run,
                 diagnostic_run_attempt: $diagnostic_attempt,
                 diagnostic_receipt_sha256: $diagnostic_receipt,
                 workflow_run_id: $run_id,
                 workflow_run_attempt: $run_attempt
               }' \
            artifacts/cache-runtime-identity.json artifacts/snapshot.json \
            > artifacts/career-search-entry-batch-cache-refresh-resume-execute-failure-diagnostic.json
          test "$remote_status" -eq 0

      - name: Upload sanitized immutable execute-failure diagnostic receipt
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: career-search-entry-batch-cache-refresh-resume-execute-failure-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/career-search-entry-batch-cache-refresh-resume-execute-failure-diagnostic.json
          if-no-files-found: error
          retention-days: 90
