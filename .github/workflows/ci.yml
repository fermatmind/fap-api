              and .technical_diagnosis.real_dependency_binding_bypass == 0
              and .technical_diagnosis.dependency_ref_mismatch_bypass == 0
              and .technical_diagnosis.detector_ref_mismatch_bypass == 0
              and .technical_diagnosis.cross_source_field_bypass == 0
              and .technical_diagnosis.cross_source_overwrite_bypass == 0
              and .technical_diagnosis.bundle_order_variance_count == 0
              and .technical_diagnosis.hardcoded_negative_guarantee_count == 0
              and .technical_diagnosis.orchestrator_runner_bypass == 0
              and .technical_diagnosis.model_calls == 0 and .technical_diagnosis.tool_calls == 0
              and .technical_diagnosis.external_calls == 0 and .technical_diagnosis.production_permissions == 0
              and .technical_diagnosis.execution_allowed == false
              and ."SEO-PLATFORM-11F" == "HOLD" and .ready_for_11G == false
              and .measurement_review.receipt_version == "seo.measurement_closeout.v3"
              and .measurement_review.environment == "ci_candidate"
              and .measurement_review.closeout_state == "OFFLINE_EVAL_READY"
              and .measurement_review.mode_state == "OFFLINE_EVAL_READY"
              and .measurement_review.candidate_sha == $sha
