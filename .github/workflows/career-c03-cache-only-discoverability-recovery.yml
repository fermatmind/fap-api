          jq -e '.migration_record_present == true and .public_topic_edges_table_present == true' "$inspect" >/dev/null
          jq -n \
            --arg control "$CONTROL_PLANE_SHA" \
            --arg active "$EXPECTED_ACTIVE_REVISION" \
