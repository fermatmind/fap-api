name: Career detail staging cache repair

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "verify_only is read-only; repair warms exactly three zh-CN cache entries"
        required: true
        default: verify_only
        type: choice
        options:
          - verify_only
          - repair
      expected_active_revision:
        description: "Exact 40-character REVISION currently active on staging"
        required: true
        type: string
      candidate_release_revision:
        description: "Exact 40-character REVISION materialized in the inactive candidate release"
        required: true
        type: string
      candidate_release_name:
        description: "Exact inactive Deployer release directory name (run_id-attempt)"
        required: true
        type: string
      operator_approval_phrase:
        description: "Required only for repair mode; must match the exact revision-bound phrase"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: career-detail-staging-cache-repair
  cancel-in-progress: false

jobs:
  staging-cache-repair:
    name: Career detail staging cache repair (${{ inputs.mode }})
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    env:
      DEPLOY_HOST: "49.234.55.28"
      DEPLOY_USER: "ubuntu"
      DEPLOY_PORT: "22"
      DEPLOY_PATH: "/var/www/fap-api-staging"
      TARGET_SLUGS: "library-technicians,purchasing-managers-buyers-and-purchasing-agents,tire-builders"
      TARGET_LOCALE: "zh-CN"

    steps:
      - name: Validate staging-only authorization contract
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          EXPECTED_ACTIVE_REVISION: ${{ inputs.expected_active_revision }}
          CANDIDATE_RELEASE_REVISION: ${{ inputs.candidate_release_revision }}
          CANDIDATE_RELEASE_NAME: ${{ inputs.candidate_release_name }}
          OPERATOR_APPROVAL_PHRASE: ${{ inputs.operator_approval_phrase }}
        run: |
          set -euo pipefail

          if [[ ! "$EXPECTED_ACTIVE_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_active_revision must be a lowercase 40-character revision." >&2
            exit 2
          fi
          if [[ ! "$CANDIDATE_RELEASE_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "candidate_release_revision must be a lowercase 40-character revision." >&2
            exit 2
          fi
          if [[ ! "$CANDIDATE_RELEASE_NAME" =~ ^[0-9]+-[1-9][0-9]*$ ]]; then
            echo "candidate_release_name must use the exact run_id-attempt format." >&2
            exit 2
          fi

          case "$MODE" in
            verify_only)
              if [ -n "$OPERATOR_APPROVAL_PHRASE" ]; then
                echo "verify_only refuses an operator approval phrase." >&2
                exit 2
              fi
              ;;
            repair)
              expected_phrase="I explicitly approve staging Career detail cache repair with active SHA ${EXPECTED_ACTIVE_REVISION} using inactive candidate SHA ${CANDIDATE_RELEASE_REVISION} release ${CANDIDATE_RELEASE_NAME} for slugs ${TARGET_SLUGS} locale ${TARGET_LOCALE}; cache-only, no CMS/DB/publication/indexability/sitemap/llms/search."
              if [ "$OPERATOR_APPROVAL_PHRASE" != "$expected_phrase" ]; then
                echo "operator_approval_phrase does not match the exact staging cache repair authorization." >&2
                exit 2
              fi
              ;;
            *)
              echo "unsupported mode: $MODE" >&2
              exit 2
              ;;
          esac

      - name: Set up SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known_hosts
        shell: bash
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null \
            || ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f ~/.ssh/known_hosts >/dev/null

      - name: Verify active staging revision and deployment quiescence
        shell: bash
        env:
          EXPECTED_ACTIVE_REVISION: ${{ inputs.expected_active_revision }}
          CANDIDATE_RELEASE_REVISION: ${{ inputs.candidate_release_revision }}
          CANDIDATE_RELEASE_NAME: ${{ inputs.candidate_release_name }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -euo pipefail; test -L '$DEPLOY_PATH/current'; test \"\$(tr -d '\\r\\n' < '$DEPLOY_PATH/current/REVISION')\" = '$EXPECTED_ACTIVE_REVISION'; test -d '$DEPLOY_PATH/releases/$CANDIDATE_RELEASE_NAME'; test \"\$(tr -d '\\r\\n' < '$DEPLOY_PATH/releases/$CANDIDATE_RELEASE_NAME/REVISION')\" = '$CANDIDATE_RELEASE_REVISION'; test ! -e '$DEPLOY_PATH/.dep/deploy.lock'"

      - name: Read-only cache coverage preflight
        id: preflight
        shell: bash
        env:
          CANDIDATE_RELEASE_NAME: ${{ inputs.candidate_release_name }}
        run: |
          set -euo pipefail
          set +e
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH/releases/$CANDIDATE_RELEASE_NAME/backend' && php artisan career:verify-job-detail-cache-coverage --verify-only --locales=en,zh-CN --minimum-targets=2092 --json --no-interaction --no-ansi" \
            > preflight.json
          command_status=$?
          set -e
          if [ "$command_status" -ne 0 ] && [ "$command_status" -ne 1 ]; then
            echo "coverage preflight failed unexpectedly with exit $command_status" >&2
            exit "$command_status"
          fi

          # shellcheck disable=SC2016
          php -r '
          $payload = json_decode((string) file_get_contents("preflight.json"), true, 512, JSON_THROW_ON_ERROR);
          $expected = [
              "library-technicians|zh-CN",
              "purchasing-managers-buyers-and-purchasing-agents|zh-CN",
              "tire-builders|zh-CN",
          ];
          $actual = array_map(
              static fn (array $item): string => (string) ($item["slug"] ?? "")."|".(string) ($item["locale"] ?? ""),
              (array) (($payload["examples"] ?? [])["missing_pointer"] ?? []),
          );
          sort($actual, SORT_STRING);
          if (
              ($payload["contract_version"] ?? null) !== "career.job_detail_cache_coverage.v1"
              || (int) ($payload["expected_target_count"] ?? -1) !== 2092
              || (int) ($payload["eligible_target_count"] ?? -1) !== 2092
              || (int) ($payload["missing_pointer_count"] ?? -1) !== 3
              || (int) ($payload["missing_payload_count"] ?? -1) !== 0
              || (int) ($payload["broken_count"] ?? -1) !== 0
              || $actual !== $expected
          ) {
              fwrite(STDERR, "staging coverage mismatch is outside the exact three-pointer repair scope\n");
              exit(1);
          }
          '

      - name: Warm exactly three missing zh-CN detail caches
        if: inputs.mode == 'repair'
        shell: bash
        env:
          CANDIDATE_RELEASE_NAME: ${{ inputs.candidate_release_name }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH/releases/$CANDIDATE_RELEASE_NAME/backend' && php artisan career:warm-public-authority-cache --job-detail-slugs='$TARGET_SLUGS' --job-detail-locales='$TARGET_LOCALE' --job-detail-only --json --no-interaction --no-ansi" \
            | tee repair.json

      - name: Verify exact post-repair coverage
        if: inputs.mode == 'repair'
        shell: bash
        env:
          CANDIDATE_RELEASE_NAME: ${{ inputs.candidate_release_name }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH/releases/$CANDIDATE_RELEASE_NAME/backend' && php artisan career:verify-job-detail-cache-coverage --verify-only --locales=en,zh-CN --minimum-targets=2092 --json --no-interaction --no-ansi" \
            | tee post-repair.json

          # shellcheck disable=SC2016
          php -r '
          $payload = json_decode((string) file_get_contents("post-repair.json"), true, 512, JSON_THROW_ON_ERROR);
          if (
              ($payload["status"] ?? null) !== "ready"
              || (int) ($payload["expected_target_count"] ?? -1) !== 2092
              || (int) ($payload["eligible_target_count"] ?? -1) !== 2092
              || (int) ($payload["covered_target_count"] ?? -1) !== 2092
              || (int) ($payload["missing_count"] ?? -1) !== 0
              || (int) ($payload["broken_count"] ?? -1) !== 0
          ) {
              fwrite(STDERR, "staging cache repair did not reach exact full coverage\n");
              exit(1);
          }
          '

      - name: Upload cache repair receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: career-detail-staging-cache-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            preflight.json
            repair.json
            post-repair.json
          if-no-files-found: ignore
          retention-days: 14
