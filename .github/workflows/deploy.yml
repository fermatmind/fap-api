name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  attestations: read
  contents: read

concurrency:
  group: trunk-deploy-${{ github.repository }}
  cancel-in-progress: false

env:
  DEPLOYER_VERSION: "7.5.12"
  DEPLOYER_SHA256: "b55c6609653e888c672d327c407f8bba6324b9c9cc24f9dcfb3f4b3922760632"
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  policy:
    name: Bind successful main CI receipt
    if: >-
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.receipt.outputs.deploy }}
      classification: ${{ steps.receipt.outputs.classification }}
      artifact_digest: ${{ steps.artifact.outputs.digest }}
      config_fingerprint: ${{ steps.receipt.outputs.config_fingerprint }}
    steps:
      - name: Refuse non-main, PR, failed, or ambiguous CI runs
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CI_EVENT: ${{ github.event.workflow_run.event }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$CI_RUN_ATTEMPT" = 1
          test "$HEAD_BRANCH" = main
          test "$CI_EVENT" = push
          test "$CI_CONCLUSION" = success
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
      - id: artifact
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        with:
          script: |
            const runId = Number(process.env.CI_RUN_ID);
            const expected = `trunk-validation-${process.env.DEPLOY_SHA}`;
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner, repo: context.repo.repo, run_id: runId, per_page: 100,
            });
            const matches = data.artifacts.filter((artifact) => artifact.name === expected && !artifact.expired);
            if (matches.length !== 1) return core.setFailed(`Expected one ${expected} artifact; found ${matches.length}`);
            if (!/^sha256:[0-9a-f]{64}$/.test(String(matches[0].digest || ""))) return core.setFailed("Validation artifact digest is missing");
            core.setOutput("id", String(matches[0].id));
            core.setOutput("digest", matches[0].digest);
      - id: receipt
        name: Verify exact-SHA receipt bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.id }}
          EXPECTED_DIGEST: ${{ steps.artifact.outputs.digest }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/validation.zip"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" -o "$zip"
          test "sha256:$(sha256sum "$zip" | awk '{print $1}')" = "$EXPECTED_DIGEST"
          unzip -q "$zip" -d "$RUNNER_TEMP/validation"
          receipt="$RUNNER_TEMP/validation/trunk-validation.json"
          jq -e --arg sha "$DEPLOY_SHA" --arg run "$CI_RUN_ID" \
            '.schema_version == "fermatmind.trunk-validation.v1" and .sha == $sha and .ci_run_id == $run and .result == "success"' \
            "$receipt" >/dev/null
          classification="$(jq -c .classification "$receipt")"
          {
            echo "deploy=$(jq -r .classification.deploy "$receipt")"
            echo "classification=$classification"
            echo "config_fingerprint=$(sha256sum "$receipt" | awk '{print $1}')"
          } >> "$GITHUB_OUTPUT"

  staging:
    name: Staging exact-SHA deploy and smoke
    needs: policy
    if: needs.policy.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    env:
      TARGET: staging
      DEPLOY_USER: ${{ secrets.STAGING_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.STAGING_DEPLOY_PORT }}
      DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
      DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
      DEPLOY_USER_STG: ${{ secrets.STAGING_DEPLOY_USER }}
      DEPLOY_PORT_STG: ${{ secrets.STAGING_DEPLOY_PORT }}
      DEPLOY_HOST_STG: ${{ secrets.STAGING_DEPLOY_HOST }}
      DEPLOY_PATH_STG: ${{ secrets.STAGING_DEPLOY_PATH }}
      HEALTHCHECK_URL: ${{ secrets.STAGING_HEALTHCHECK_URL }}
      AUTH_GUEST_CHECK_URL: ${{ secrets.STAGING_AUTH_GUEST_CHECK_URL }}
      OPS_HOST: ${{ secrets.STAGING_OPS_HOST }}
      DEPLOY_REVISION: ${{ github.event.workflow_run.head_sha }}
      DEPLOY_MODE: standard
      CI_PARITY_RECEIPT_VERIFIED: "true"
      CI_PARITY_RECEIPT_SHA: ${{ github.event.workflow_run.head_sha }}
      CI_PARITY_RECEIPT_ARTIFACT_DIGEST: ${{ needs.policy.outputs.artifact_digest }}
      CI_PARITY_RECEIPT_CONFIG_FINGERPRINT: ${{ needs.policy.outputs.config_fingerprint }}
      CI_PARITY_RECEIPT_RUN_ID: ${{ github.event.workflow_run.id }}
      CI_PARITY_RECEIPT_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Install pinned Deployer
        run: |
          curl -fsSL -o /tmp/dep.phar "https://github.com/deployphp/deployer/releases/download/v${DEPLOYER_VERSION}/deployer.phar"
          printf '%s  /tmp/dep.phar\n' "$DEPLOYER_SHA256" | sha256sum -c -
      - name: Configure staging SSH identities
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          STAGING_REPO_READ_SSH_KEY: ${{ secrets.STAGING_REPO_READ_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$STAGING_REPO_READ_SSH_KEY"
          install -d -m 700 ~/.ssh
          host_key="$RUNNER_TEMP/staging-host-key"
          install -m 600 /dev/null "$host_key"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$host_key"
          printf 'DEPLOY_IDENTITY_FILE_STG=%s\n' "$host_key" >> "$GITHUB_ENV"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          eval "$(ssh-agent -s)" >/dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          printf '%s\n' "$STAGING_REPO_READ_SSH_KEY" | ssh-add - >/dev/null 2>&1
      - name: Deploy staging and run repository smoke chain
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          php /tmp/dep.phar deploy staging -f deploy.php --revision "$DEPLOY_SHA" \
            -o release_name="trunk-${DEPLOY_SHA:0:12}-${GITHUB_RUN_ID}" -o deploy_mode=standard --no-interaction
      - name: Record staging timing
        if: always()
        run: |
          jq -n --arg sha "$DEPLOY_SHA" --arg run "$GITHUB_RUN_ID" --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schema_version:"fermatmind.trunk-deploy-timing.v1",sha:$sha,phase:"staging",run_id:$run,completed_at:$at}' > staging-timing.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: trunk-staging-${{ github.event.workflow_run.head_sha }}
          path: staging-timing.json
          if-no-files-found: error
          retention-days: 90

  production:
    name: Production exact-SHA activation, smoke, and LKG fallback
    needs: [policy, staging]
    if: needs.staging.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      TARGET: production
      DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
      DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
      RETIRED_DEPLOY_HOST: ${{ secrets.PRODUCTION_RETIRED_DEPLOY_HOST }}
      DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
      DEPLOY_USER_PROD: ${{ secrets.PRODUCTION_DEPLOY_USER }}
      DEPLOY_PORT_PROD: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
      DEPLOY_HOST_PROD: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
      DEPLOY_PATH_PROD: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
      HEALTHCHECK_URL: ${{ vars.PRODUCTION_HEALTHCHECK_URL }}
      AUTH_GUEST_CHECK_URL: ${{ vars.PRODUCTION_AUTH_GUEST_CHECK_URL }}
      OPS_HOST: ${{ vars.PRODUCTION_OPS_HOST }}
      DEPLOY_REVISION: ${{ github.event.workflow_run.head_sha }}
      DEPLOY_MODE: standard
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Install pinned Deployer
        run: |
          curl -fsSL -o /tmp/dep.phar "https://github.com/deployphp/deployer/releases/download/v${DEPLOYER_VERSION}/deployer.phar"
          printf '%s  /tmp/dep.phar\n' "$DEPLOYER_SHA256" | sha256sum -c -
      - name: Start SSH agent without key metadata output
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          eval "$(ssh-agent -s)" >/dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          printf '%s\n' "$SSH_PRIVATE_KEY" | ssh-add - >/dev/null 2>&1
      - name: Install pinned known_hosts
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Refuse stale or non-forward production activation
        id: baseline
        run: |
          set -euo pipefail
          test "$DEPLOY_HOST" != "$RETIRED_DEPLOY_HOST"
          active="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "tr -d '\r\n' < '$DEPLOY_PATH/current/REVISION'")"
          [[ "$active" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$active"
          if ! git merge-base --is-ancestor "$active" "$DEPLOY_SHA"; then
            echo "Candidate is older than or divergent from active production; skip out-of-order activation."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$active" != "$DEPLOY_SHA"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "active=$active" >> "$GITHUB_OUTPUT"
      - name: Deploy once and automatically restore LKG after committed smoke failure
        if: steps.baseline.outputs.skip != 'true'
        run: |
          set -euo pipefail
          release="trunk-${DEPLOY_SHA:0:12}-${GITHUB_RUN_ID}"
          set +e
          php /tmp/dep.phar deploy production -f deploy.php --revision "$DEPLOY_SHA" \
            -o release_name="$release" -o deploy_mode=standard -vvv --no-interaction
          deploy_rc=$?
          set -e
          if [ "$deploy_rc" -eq 0 ]; then exit 0; fi
          current="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "tr -d '\r\n' < '$DEPLOY_PATH/current/REVISION'" || true)"
          if [ "$current" = "$DEPLOY_SHA" ]; then
            echo "Production activation committed but smoke failed; restoring previous LKG once."
            export DEPLOY_SHA='${{ steps.baseline.outputs.active }}'
            php /tmp/dep.phar rollback production -f deploy.php --no-interaction
            restored="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "tr -d '\r\n' < '$DEPLOY_PATH/current/REVISION'")"
            test "$restored" = '${{ steps.baseline.outputs.active }}'
          fi
          exit "$deploy_rc"
      - name: Persist push-to-production timing receipt
        if: always()
        env:
          PUSHED_AT: ${{ github.event.workflow_run.created_at }}
          CI_COMPLETED_AT: ${{ github.event.workflow_run.updated_at }}
        run: |
          jq -n --arg sha "$DEPLOY_SHA" --arg pushed "$PUSHED_AT" --arg ci "$CI_COMPLETED_AT" \
            --arg completed "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg run "$GITHUB_RUN_ID" \
            '{schema_version:"fermatmind.trunk-delivery-timing.v1",sha:$sha,pushed_at:$pushed,ci_completed_at:$ci,production_smoke_completed_at:$completed,deploy_run_id:$run}' \
            > trunk-delivery-timing.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: trunk-production-${{ github.event.workflow_run.head_sha }}
          path: trunk-delivery-timing.json
          if-no-files-found: error
          retention-days: 90

  career-current-export:
    name: Export Career Current authority once
    needs: [policy, production]
    if: needs.production.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      EXPECTED_PROJECTION_SHA256: 397f2a4ec284e9c0a6cd610447541ad4773fa7a7f3045008fab5efb334ec85c6
      DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
      DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
      RETIRED_DEPLOY_HOST: ${{ secrets.PRODUCTION_RETIRED_DEPLOY_HOST }}
      DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Start SSH agent without key metadata output
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          eval "$(ssh-agent -s)" >/dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          printf '%s\n' "$SSH_PRIVATE_KEY" | ssh-add - >/dev/null 2>&1
      - name: Install pinned known_hosts
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$DEPLOY_HOST" != "$RETIRED_DEPLOY_HOST"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Stream and validate SELECT-only Career Current export
        shell: bash
        run: |
          set -euo pipefail
          dir=artifacts/career-current-authority-export
          raw="$RUNNER_TEMP/career-current-authority-export.ndjson"
          remote_receipt="$RUNNER_TEMP/career-current-authority-export.receipt.json"
          remote_stderr="$RUNNER_TEMP/career-current-authority-export.stderr"
          mkdir -p "$dir"
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_PROJECTION_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf -v q_path '%q' "$DEPLOY_PATH"
          printf -v q_release '%q' "$DEPLOY_SHA"
          printf -v q_projection '%q' "$EXPECTED_PROJECTION_SHA256"
          printf -v q_run '%q' "$GITHUB_RUN_ID"
          printf -v q_attempt '%q' "$GITHUB_RUN_ATTEMPT"
          remote="set -euo pipefail; current=\$(readlink -f $q_path/current); releases=\$(readlink -f $q_path/releases); test -n \"\$current\"; test -n \"\$releases\"; case \"\$current\" in \"\$releases\"/*) ;; *) exit 1 ;; esac; test \"\$(tr -d '\\r\\n' < \"\$current/REVISION\")\" = $q_release; test ! -e $q_path/.dep/deploy.lock; release_name=\$(basename \"\$current\"); sudo -n -u www-data -- env CAREER_CURRENT_EXPORT_EXECUTE=1 CAREER_CURRENT_EXPORT_BACKEND_ROOT=\"\$current/backend\" CAREER_CURRENT_EXPORT_RELEASE_SHA=$q_release CAREER_CURRENT_EXPORT_EXPECTED_PROJECTION_SHA256=$q_projection CAREER_CURRENT_EXPORT_RELEASE_NAME=\"\$release_name\" CAREER_CURRENT_EXPORT_WORKFLOW_RUN_ID=$q_run CAREER_CURRENT_EXPORT_WORKFLOW_RUN_ATTEMPT=$q_attempt php"
          set +e
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" "$remote" \
            < backend/scripts/operations/career_current_authority_export.php \
            > "$raw" 2> "$remote_stderr"
          remote_status=$?
          set -e
          if ! head -n 1 "$raw" | jq -e '.kind == "meta" and (.receipt | type == "object")' >/dev/null 2>&1; then
            jq -n '{
              contract_version: "career.current_authority_export.v1",
              status: "FAIL_CURRENT_AUTHORITY_EXPORT",
              safe_error_code: "CAREER_CURRENT_REMOTE_EXPORT_FAILED",
              production_read_only_requested: true,
              zero_write_confirmed: false,
              automatic_retry_allowed: false
            }' > "$dir/receipt.json"
            exit 1
          fi
          head -n 1 "$raw" | jq -S '.receipt' > "$remote_receipt"
          if [ "$remote_status" -ne 0 ]; then
            cp "$remote_receipt" "$dir/receipt.json"
            exit 1
          fi
          test "$(wc -l < "$raw" | tr -d ' ')" = 1047
          head -n 1 "$raw" | jq -e '.kind == "meta" and .receipt.status == "PASS_CURRENT_AUTHORITY_EXPORT"' >/dev/null
          head -n 1 "$raw" | jq -S '.manifest' > "$dir/manifest.json"
          tail -n +2 "$raw" > "$dir/assets.jsonl"
          assets_sha="$(sha256sum "$dir/assets.jsonl" | awk '{print $1}')"
          manifest_sha="$(jq -S -c '.' "$dir/manifest.json" | sha256sum | awk '{print $1}')"
          jq -e --arg release "$DEPLOY_SHA" --arg projection "$EXPECTED_PROJECTION_SHA256" \
            --arg assets "$assets_sha" --arg manifest "$manifest_sha" '
              .release_sha == $release
              and .career_runtime_projection_sha256 == $projection
              and .counts.careers == 1046
              and .counts.locale_pages == 2092
              and .counts.components_per_page == 26
              and .counts.numeric_rating_statement_residue_count == 0
              and .assets_sha256 == $assets
              and .manifest_sha256 == $manifest
              and .database_query_count > 0
              and .database_query_verbs == ["select"]
              and .database_write_count == 0
              and .cache_write_count == 0
              and .pointer_write_count == 0
              and .discoverability_write_count == 0
              and .cms_write_count == 0
              and .sitemap_write_count == 0
              and .llms_write_count == 0
              and .search_submission_count == 0
              and .remote_file_write_count == 0
              and .database_public_content_sha256 == .active_cache_public_content_sha256
              and .database_public_content_sha256 == .api_public_content_sha256
              and .hashes_match == true
            ' "$remote_receipt" >/dev/null
          jq -e --arg assets "$assets_sha" '
              .contract_version == "career.current_authority_manifest.v1"
              and .counts.careers == 1046
              and .counts.locale_pages == 2092
              and .counts.components_per_page == 26
              and .files[0].sha256 == $assets
              and (.exported_field_set_sha256 | keys | length) == 13
            ' "$dir/manifest.json" >/dev/null
          jq -e -s 'length == 1046 and ([.[].canonical_slug] | unique | length) == 1046 and all(.[].component_order_json; length == 26)' \
            "$dir/assets.jsonl" >/dev/null
          cp "$remote_receipt" "$dir/receipt.json"
      - name: Upload Career Current export artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: career-current-authority-export-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/career-current-authority-export
          if-no-files-found: error
          retention-days: 3

  docs-only:
    name: Docs-only deployment skip receipt
    needs: policy
    if: needs.policy.outputs.deploy != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Validated docs/rules/tests-only SHA; application deployment intentionally skipped."
