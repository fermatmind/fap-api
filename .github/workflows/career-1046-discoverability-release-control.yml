name: Career 1046 Discoverability Release Control

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Zero-write preflight or receipt-bound same-generation release
        required: true
        default: preflight
        type: choice
        options: [preflight, apply]
      expected_control_plane_sha:
        required: true
        type: string
      expected_release_sha:
        required: true
        type: string
      expected_release_name:
        required: true
        type: string
      generation_id:
        required: true
        type: string
      expected_active_pointer_sha256:
        required: true
        type: string
      task7a_run_id:
        required: true
        type: string
      task7a_run_attempt:
        required: true
        type: string
      expected_task7a_artifact_digest:
        required: true
        type: string
      expected_task7a_receipt_sha256:
        required: true
        type: string
      preflight_run_id:
        required: false
        default: ""
        type: string
      preflight_run_attempt:
        required: false
        default: ""
        type: string
      expected_preflight_receipt_sha256:
        required: false
        default: ""
        type: string
      operator_approval_phrase:
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-${{ github.repository }}-production
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      MODE: ${{ inputs.mode }}
      CONTROL: ${{ inputs.expected_control_plane_sha }}
      RELEASE: ${{ inputs.expected_release_sha }}
      RELEASE_NAME: ${{ inputs.expected_release_name }}
      GENERATION: ${{ inputs.generation_id }}
      POINTER: ${{ inputs.expected_active_pointer_sha256 }}
      TASK7A_RUN_ID: ${{ inputs.task7a_run_id }}
      TASK7A_RUN_ATTEMPT: ${{ inputs.task7a_run_attempt }}
      TASK7A_ARTIFACT: ${{ inputs.expected_task7a_artifact_digest }}
      TASK7A_RECEIPT: ${{ inputs.expected_task7a_receipt_sha256 }}
      PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
      PREFLIGHT_RUN_ATTEMPT: ${{ inputs.preflight_run_attempt }}
      PREFLIGHT_RECEIPT: ${{ inputs.expected_preflight_receipt_sha256 }}
      APPROVAL: ${{ inputs.operator_approval_phrase }}
      DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
      DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
      RETIRED_DEPLOY_HOST: ${{ secrets.PRODUCTION_RETIRED_DEPLOY_HOST }}
      DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}

    steps:
      - name: Initialize sanitized receipt before checkout
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg mode "$MODE" --arg control "$CONTROL" --arg release "$RELEASE" --arg generation "$GENERATION" --arg preflight "$PREFLIGHT_RECEIPT" \
            '{contract_version:"career.1046.discoverability_release_control.v1",mode:$mode,status:"FAIL_DISCOVERABILITY_RELEASE_CONTROL",failed_stage:"initialize",control_plane_sha:$control,release_sha:$release,generation_id:$generation,preflight_receipt_sha256:(if $preflight=="" then null else $preflight end),production_write_execution:false,write_commit_state:"confirmed_zero_write",discoverability_release_write_count:0,pointer_write_count:0,database_write_count:0,cms_write_count:0,cache_write_count:0,sitemap_write_count:0,llms_write_count:0,search_submission_count:0,deploy_count:0,migration_count:0,restart_count:0,warm_count:0,writes_committed:false,automatic_retry_allowed:false}' \
            > "$RUNNER_TEMP/career-1046-discoverability-release-control.json"

      - name: Checkout exact control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.expected_control_plane_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact Task 7A receipt and apply lineage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/career-1046-discoverability-release-control.json"
          fail() { jq --arg stage "$1" '.failed_stage=$stage' "$receipt" > "$receipt.next" && mv "$receipt.next" "$receipt"; }
          trap 'fail evidence_validation' ERR
          test "$GITHUB_REF" = refs/heads/main
          [[ "$MODE" =~ ^(preflight|apply)$ ]]
          [[ "$CONTROL" =~ ^[0-9a-f]{40}$ && "$RELEASE" =~ ^[0-9a-f]{40}$ && "$CONTROL" = "$RELEASE" ]]
          [[ "$RELEASE_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ && "$GENERATION" =~ ^career-1046-[0-9a-f]{32}$ && "$POINTER" =~ ^[0-9a-f]{64}$ ]]
          [[ "$TASK7A_RUN_ID" =~ ^[1-9][0-9]*$ && "$TASK7A_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ && "$TASK7A_ARTIFACT" =~ ^sha256:[0-9a-f]{64}$ && "$TASK7A_RECEIPT" =~ ^[0-9a-f]{64}$ ]]
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$CONTROL"
          test "$(git rev-parse origin/main)" = "$CONTROL"
          php -l backend/scripts/operations/career_1046_discoverability_release_control.php >/dev/null
          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${TASK7A_RUN_ID}")"
          jq -e --arg sha "$CONTROL" --argjson attempt "$TASK7A_RUN_ATTEMPT" '.name == "Career 1046 Public Product Verify Only" and .path == ".github/workflows/career-1046-public-product-verify-only.yml" and .event == "workflow_dispatch" and .head_branch == "main" and .head_sha == $sha and .status == "completed" and .conclusion == "success" and .run_attempt == $attempt' <<<"$run" >/dev/null
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${TASK7A_RUN_ID}/artifacts?per_page=100")"
          name="career-1046-public-product-verify-only-${TASK7A_RUN_ID}-${TASK7A_RUN_ATTEMPT}"
          id="$(jq -er --arg name "$name" --arg digest "$TASK7A_ARTIFACT" '[.artifacts[]|select(.name==$name and .expired==false and .digest==$digest)]|select(length==1)|.[0].id' <<<"$artifacts")"
          evidence="$(mktemp -d)"; gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "$evidence/a.zip"
          test "$(unzip -Z1 "$evidence/a.zip")" = career-1046-public-product-verify-only.json
          unzip -q "$evidence/a.zip" -d "$evidence/unpacked"; task7a="$evidence/unpacked/career-1046-public-product-verify-only.json"
          test "$(sha256sum "$task7a" | awk '{print $1}')" = "$TASK7A_RECEIPT"
          jq -e --arg control "$CONTROL" --arg release "$RELEASE" --arg generation "$GENERATION" --arg pointer "$POINTER" --argjson run "$TASK7A_RUN_ID" --argjson attempt "$TASK7A_RUN_ATTEMPT" '.contract_version=="career.1046.public_product_verify_only.v1" and .status=="PASS_PUBLIC_PRODUCT_VERIFY_ONLY" and .control_plane_sha==$control and .release_sha==$release and .generation_id==$generation and .workflow_run_id==$run and .workflow_run_attempt==$attempt and .active_pointer_sha256_before==$pointer and .active_pointer_sha256_after==$pointer and .immutable_pointer_sha256==$pointer and .counts.directory_en==1046 and .counts.directory_zh==1046 and .counts.detail_targets==2092 and .counts.detail_http_200==2092 and .counts.missing==0 and .counts.duplicate==0 and .counts.extra==0 and .counts.generation_mismatch==0 and .production_read_only_evidence==true and .database_write_count==0 and .cms_write_count==0 and .cache_write_count==0 and .pointer_write_count==0 and .sitemap_write_count==0 and .llms_write_count==0 and .search_submission_count==0 and .writes_committed==false' "$task7a" >/dev/null
          if [ "$MODE" = preflight ]; then
            test -z "$PREFLIGHT_RUN_ID$PREFLIGHT_RUN_ATTEMPT$PREFLIGHT_RECEIPT$APPROVAL"
          else
            [[ "$PREFLIGHT_RUN_ID" =~ ^[1-9][0-9]*$ && "$PREFLIGHT_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ && "$PREFLIGHT_RECEIPT" =~ ^[0-9a-f]{64}$ ]]
            preflight_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREFLIGHT_RUN_ID}")"
            jq -e --arg sha "$CONTROL" --argjson attempt "$PREFLIGHT_RUN_ATTEMPT" '.name=="Career 1046 Discoverability Release Control" and .path==".github/workflows/career-1046-discoverability-release-control.yml" and .event=="workflow_dispatch" and .head_branch=="main" and .head_sha==$sha and .status=="completed" and .conclusion=="success" and .run_attempt==$attempt' <<<"$preflight_run" >/dev/null
            preflight_name="career-1046-discoverability-release-preflight-${PREFLIGHT_RUN_ID}-${PREFLIGHT_RUN_ATTEMPT}"
            preflight_artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREFLIGHT_RUN_ID}/artifacts?per_page=100")"
            preflight_id="$(jq -er --arg name "$preflight_name" '[.artifacts[]|select(.name==$name and .expired==false)]|select(length==1)|.[0].id' <<<"$preflight_artifacts")"
            preflight_dir="$(mktemp -d)"; gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${preflight_id}/zip" > "$preflight_dir/a.zip"
            test "$(unzip -Z1 "$preflight_dir/a.zip")" = career-1046-discoverability-release-control.json
            unzip -q "$preflight_dir/a.zip" -d "$preflight_dir/unpacked"; preflight="$preflight_dir/unpacked/career-1046-discoverability-release-control.json"
            test "$(sha256sum "$preflight" | awk '{print $1}')" = "$PREFLIGHT_RECEIPT"
            jq -e --arg control "$CONTROL" --arg release "$RELEASE" --arg generation "$GENERATION" --arg pointer "$POINTER" --arg task7a "$TASK7A_RECEIPT" --argjson task7a_run "$TASK7A_RUN_ID" --argjson task7a_attempt "$TASK7A_RUN_ATTEMPT" --argjson run "$PREFLIGHT_RUN_ID" --argjson attempt "$PREFLIGHT_RUN_ATTEMPT" '.contract_version=="career.1046.discoverability_release_control.v1" and .mode=="preflight" and .status=="PASS_PREFLIGHT_DISCOVERABILITY_RELEASE" and .control_plane_sha==$control and .release_sha==$release and .generation_id==$generation and .active_pointer_sha256==$pointer and .immutable_pointer_sha256==$pointer and .task7a_receipt_sha256==$task7a and .task7a_run_id==$task7a_run and .task7a_run_attempt==$task7a_attempt and .workflow_run_id==$run and .workflow_run_attempt==$attempt and .preflight_receipt_sha256==null and .slug_count==1046 and .locale_row_count==2092 and .production_write_execution==false and .write_commit_state=="confirmed_zero_write" and .discoverability_release_write_count==0 and .pointer_write_count==0 and .database_write_count==0 and .cms_write_count==0 and .cache_write_count==0 and .sitemap_write_count==0 and .llms_write_count==0 and .search_submission_count==0 and .deploy_count==0 and .migration_count==0 and .restart_count==0 and .warm_count==0 and .writes_committed==false and .automatic_retry_allowed==false' "$preflight" >/dev/null
            expected="I explicitly approve Career 1046 discoverability release for generation ${GENERATION} from preflight receipt ${PREFLIGHT_RECEIPT}; release exactly 2092 sitemap locale URLs and 1046 llms slugs, keep Search, IndexNow, GSC, and URL Inspection disabled."
            test "$APPROVAL" = "$expected"
          fi

      - name: Set up pinned SSH transport
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Run exact preflight or apply runner
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/career-1046-discoverability-release-control.json"
          runner_receipt="$(mktemp "$RUNNER_TEMP/career-1046-discoverability-runner.XXXXXX")"
          trap 'rm -f "$runner_receipt"' EXIT
          fail() { jq --arg stage "$1" '.failed_stage=$stage' "$receipt" > "$receipt.next" && mv "$receipt.next" "$receipt"; }
          mkdir -p ~/.ssh; printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null || ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f ~/.ssh/known_hosts >/dev/null
          for name in DEPLOY_USER DEPLOY_PORT DEPLOY_HOST RETIRED_DEPLOY_HOST DEPLOY_PATH; do test -n "${!name:-}"; done
          [[ "$DEPLOY_HOST" != "$RETIRED_DEPLOY_HOST" && "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ && "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ && "$DEPLOY_PATH" != *..* ]]
          apply_authorized=0; test "$MODE" != apply || apply_authorized=1
          for key in MODE CONTROL RELEASE RELEASE_NAME GENERATION POINTER TASK7A_RUN_ID TASK7A_RUN_ATTEMPT TASK7A_ARTIFACT TASK7A_RECEIPT PREFLIGHT_RECEIPT APPROVAL DEPLOY_PATH GITHUB_RUN_ID GITHUB_RUN_ATTEMPT; do printf -v "q_$key" '%q' "${!key}"; done
          printf -v q_apply_authorized '%q' "$apply_authorized"
          trap - ERR
          if [ "$MODE" = apply ]; then
            jq '.failed_stage="remote_apply_transport_ambiguous" | .production_write_execution=true | .write_commit_state="ambiguous"' "$receipt" > "$receipt.next" && mv "$receipt.next" "$receipt"
          else
            jq '.failed_stage="remote_preflight_transport_failure"' "$receipt" > "$receipt.next" && mv "$receipt.next" "$receipt"
          fi
          set +e
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "test -L ${q_DEPLOY_PATH}/current && test \"\$(readlink -f ${q_DEPLOY_PATH}/current)\" = \"${q_DEPLOY_PATH}/releases/${q_RELEASE_NAME}\" && test \"\$(tr -d '\\n' < ${q_DEPLOY_PATH}/current/REVISION)\" = ${q_RELEASE} && CAREER_DISCOVERABILITY_MODE=${q_MODE} CAREER_DISCOVERABILITY_BACKEND_ROOT=${q_DEPLOY_PATH}/current/backend CAREER_DISCOVERABILITY_AUTHORITY_ROOT=${q_DEPLOY_PATH}/current/backend/storage/app/private/career_generation_authority CAREER_DISCOVERABILITY_CONTROL_PLANE_SHA=${q_CONTROL} CAREER_DISCOVERABILITY_RELEASE_SHA=${q_RELEASE} CAREER_DISCOVERABILITY_RELEASE_NAME=${q_RELEASE_NAME} CAREER_DISCOVERABILITY_GENERATION_ID=${q_GENERATION} CAREER_DISCOVERABILITY_ACTIVE_POINTER_SHA256=${q_POINTER} CAREER_DISCOVERABILITY_TASK7A_RUN_ID=${q_TASK7A_RUN_ID} CAREER_DISCOVERABILITY_TASK7A_RUN_ATTEMPT=${q_TASK7A_RUN_ATTEMPT} CAREER_DISCOVERABILITY_TASK7A_ARTIFACT_DIGEST=${q_TASK7A_ARTIFACT} CAREER_DISCOVERABILITY_TASK7A_RECEIPT_SHA256=${q_TASK7A_RECEIPT} CAREER_DISCOVERABILITY_WORKFLOW_RUN_ID=${q_GITHUB_RUN_ID} CAREER_DISCOVERABILITY_WORKFLOW_RUN_ATTEMPT=${q_GITHUB_RUN_ATTEMPT} CAREER_DISCOVERABILITY_PREFLIGHT_RECEIPT_SHA256=${q_PREFLIGHT_RECEIPT} CAREER_DISCOVERABILITY_OPERATOR_APPROVAL_PHRASE=${q_APPROVAL} CAREER_DISCOVERABILITY_APPLY_AUTHORIZED=${q_apply_authorized} php" < backend/scripts/operations/career_1046_discoverability_release_control.php > "$runner_receipt" 2>/dev/null
          status=$?
          set -e
          test "$status" -eq 0
          trap 'fail remote_runner_receipt_validation' ERR
          jq -e --arg mode "$MODE" --arg control "$CONTROL" --arg release "$RELEASE" --arg generation "$GENERATION" '.contract_version=="career.1046.discoverability_release_control.v1" and .mode==$mode and .control_plane_sha==$control and .release_sha==$release and .generation_id==$generation and .pointer_write_count==0 and .database_write_count==0 and .cms_write_count==0 and .cache_write_count==0 and .search_submission_count==0 and .deploy_count==0 and .migration_count==0 and .restart_count==0 and .warm_count==0 and .automatic_retry_allowed==false' "$runner_receipt" >/dev/null
          if [ "$MODE" = preflight ]; then jq -e '.status=="PASS_PREFLIGHT_DISCOVERABILITY_RELEASE" and .preflight_receipt_sha256==null and .production_write_execution==false and .write_commit_state=="confirmed_zero_write" and .discoverability_release_write_count==0 and .writes_committed==false' "$runner_receipt" >/dev/null; else jq -e --arg preflight "$PREFLIGHT_RECEIPT" '.status=="PASS_APPLY_DISCOVERABILITY_RELEASE" and .preflight_receipt_sha256==$preflight and .production_write_execution==true and .write_commit_state=="committed" and .discoverability_release_write_count==1 and .sitemap_write_count==0 and .llms_write_count==0 and .writes_committed==true' "$runner_receipt" >/dev/null; fi
          mv "$runner_receipt" "$receipt"
          trap - ERR

      - name: Upload sanitized receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: career-1046-discoverability-release-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/career-1046-discoverability-release-control.json
          if-no-files-found: error
          retention-days: 30
