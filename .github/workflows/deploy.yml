      - run: echo "Validated docs/rules/tests-only SHA; application deployment intentionally skipped."

  council-a08-activation:
    name: Council A08 scoped read-only activation
    needs: [policy, staging, production]
    if: >-
      always() && github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.run_attempt == 1 && github.run_attempt == 1 &&
      github.event.workflow_run.name == 'CI' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      needs.production.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
      DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
      DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Configure production SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          key="$RUNNER_TEMP/production-key"
          install -m 600 /dev/null "$key"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          echo "PRODUCTION_IDENTITY=$key" >> "$GITHUB_ENV"
      - id: evidence
        name: Resolve immutable exact-SHA workflow artifacts
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CURRENT_DEPLOY_RUN_ID: ${{ github.run_id }}
        with:
          script: |
            const fs = require("fs");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = process.env.SOURCE_SHA;
            const artifacts = async (runId) => (await github.rest.actions.listWorkflowRunArtifacts({
              owner, repo, run_id: Number(runId), per_page: 100,
            })).data.artifacts.filter((artifact) => !artifact.expired);
            const one = (items, name) => {
              const found = items.filter((item) => item.name === name);
              if (found.length !== 1 || !/^sha256:[a-f0-9]{64}$/.test(String(found[0].digest || ""))) {
                throw new Error(`Expected one digest-bound ${name} artifact; found ${found.length}`);
              }
              return found[0];
            };
            const ci = (await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: Number(process.env.SOURCE_RUN_ID),
            })).data;
            const deploy = (await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: Number(process.env.CURRENT_DEPLOY_RUN_ID),
            })).data;
            const ciArtifact = one(await artifacts(ci.id), `trunk-validation-${sha}`);
            const productionArtifact = one(await artifacts(deploy.id), `trunk-production-${sha}`);
            const stagingArtifact = one(await artifacts(deploy.id), `trunk-staging-${sha}`);
            if (ci.name !== "CI" || ci.path !== ".github/workflows/ci.yml" || ci.head_branch !== "main"
              || ci.event !== "push" || ci.head_sha !== sha || ci.run_attempt !== 1 || ci.conclusion !== "success") {
              throw new Error("CI metadata mismatch");
            }
            if (deploy.name !== "Deploy" || deploy.path !== ".github/workflows/deploy.yml" || deploy.head_branch !== "main"
              || deploy.event !== "workflow_run" || deploy.head_sha !== sha || deploy.run_attempt !== 1) {
              throw new Error("Deploy metadata mismatch");
            }
            const metadata = { ci: { repository: `${owner}/${repo}`, workflow_name: ci.name, workflow_path: ci.path,
                head_branch: ci.head_branch, event: ci.event, run_id: ci.id, run_attempt: ci.run_attempt,
                artifact_id: ciArtifact.id, artifact_digest: ciArtifact.digest },
              deploy: { repository: `${owner}/${repo}`, workflow_name: deploy.name, workflow_path: deploy.path,
                head_branch: deploy.head_branch, event: deploy.event, run_id: deploy.id, run_attempt: deploy.run_attempt,
                artifact_id: productionArtifact.id, artifact_digest: productionArtifact.digest },
              staging: { artifact_id: stagingArtifact.id, artifact_digest: stagingArtifact.digest } };
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/a08-metadata.json`, JSON.stringify(metadata));
            core.setOutput("ci_artifact_id", String(metadata.ci.artifact_id));
            core.setOutput("ci_artifact_digest", metadata.ci.artifact_digest);
            core.setOutput("production_artifact_id", String(metadata.deploy.artifact_id));
            core.setOutput("production_artifact_digest", metadata.deploy.artifact_digest);
            core.setOutput("staging_artifact_id", String(metadata.staging.artifact_id));
            core.setOutput("staging_artifact_digest", metadata.staging.artifact_digest);
      - name: Read actual production SHA, pause intent, vector, and prior evidence
        shell: bash
        run: |
          set -euo pipefail
          ssh_base=(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -i "$PRODUCTION_IDENTITY" \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST")
          printf -v q_path '%q' "$DEPLOY_PATH"
          active="$("${ssh_base[@]}" "tr -d '\\r\\n' < $q_path/current/REVISION")"
          test "$active" = "$SOURCE_SHA"
          "${ssh_base[@]}" "cd $q_path/current/backend && php artisan seo:council-runtime status --no-interaction --no-ansi" > "$RUNNER_TEMP/runtime-status.json"
          jq -e '.pause_intent | IN("UNSET","UNKNOWN","PAUSED","RUNNING")' "$RUNNER_TEMP/runtime-status.json" >/dev/null
          "${ssh_base[@]}" "file=$q_path/shared/backend/storage/app/release-receipts/seo-council-a08/activation.json; if test -f \"\$file\" && test ! -L \"\$file\"; then cat \"\$file\"; fi" \
            > "$RUNNER_TEMP/prior-activation.json"
          node .github/trunk/seo-platform-12a08-activation.mjs fingerprint "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/fingerprint.json"
      - name: Download and verify exact validation artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          CI_ARTIFACT_ID: ${{ steps.evidence.outputs.ci_artifact_id }}
          CI_ARTIFACT_DIGEST: ${{ steps.evidence.outputs.ci_artifact_digest }}
          STAGING_ARTIFACT_ID: ${{ steps.evidence.outputs.staging_artifact_id }}
          STAGING_ARTIFACT_DIGEST: ${{ steps.evidence.outputs.staging_artifact_digest }}
          PRODUCTION_ARTIFACT_ID: ${{ steps.evidence.outputs.production_artifact_id }}
          PRODUCTION_ARTIFACT_DIGEST: ${{ steps.evidence.outputs.production_artifact_digest }}
        run: |
          set -euo pipefail
          download() {
            local id="$1" digest="$2" target="$3"
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" -o "$target"
            test "sha256:$(sha256sum "$target" | awk '{print $1}')" = "$digest"
          }
          download "$CI_ARTIFACT_ID" "$CI_ARTIFACT_DIGEST" "$RUNNER_TEMP/ci.zip"
          download "$STAGING_ARTIFACT_ID" "$STAGING_ARTIFACT_DIGEST" "$RUNNER_TEMP/staging.zip"
          download "$PRODUCTION_ARTIFACT_ID" "$PRODUCTION_ARTIFACT_DIGEST" "$RUNNER_TEMP/production.zip"
          for name in ci staging production; do unzip -q "$RUNNER_TEMP/$name.zip" -d "$RUNNER_TEMP/$name"; done
          staging="$RUNNER_TEMP/staging/artifacts/seo-council-a08-staging/receipt.json"
          ci="$RUNNER_TEMP/ci/trunk-validation.json"
          production="$RUNNER_TEMP/production/trunk-delivery-timing.json"
          test -f "$ci" && test -f "$production"
          jq -e --arg sha "$SOURCE_SHA" '.sha == $sha and .result == "success"' "$ci" >/dev/null
          jq -e --arg sha "$SOURCE_SHA" '.sha == $sha and .phase == "staging"' "$RUNNER_TEMP/staging/staging-timing.json" >/dev/null
          jq -e --arg sha "$SOURCE_SHA" '.sha == $sha and .production_smoke_completed_at != null' "$production" >/dev/null
          if test -f "$staging"; then
            jq -e --arg sha "$SOURCE_SHA" '.schema_version == "seo.platform12_a08_staging_acceptance.v2"
              and .sha == $sha and .status == "pass" and .source_connected == true and .mission_count == 3
              and .trigger_mode == "controlled_acceptance" and .natural_slot_receipt == false
              and .notification_delivery_verified == true and .pause_resume_verified == true
              and .receipt_to_ui_verified == true
              and .model_calls == 0 and .tool_calls == 0 and .external_calls == 0 and .business_writes == 0' "$staging" >/dev/null
            echo true > "$RUNNER_TEMP/a08-scoped-required"
          else
            echo false > "$RUNNER_TEMP/a08-scoped-required"
          fi
      - id: manifest
        name: Build exact or compatible descendant activation manifest
        shell: bash
        env:
          CI_ARTIFACT_DIGEST: ${{ steps.evidence.outputs.ci_artifact_digest }}
          PRODUCTION_ARTIFACT_DIGEST: ${{ steps.evidence.outputs.production_artifact_digest }}
          STAGING_ARTIFACT_DIGEST: ${{ steps.evidence.outputs.staging_artifact_digest }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/seo-council-a08-activation
          output=artifacts/seo-council-a08-activation/activation.json
          vector="$(jq -c .version_vector "$RUNNER_TEMP/runtime-status.json")"
          vector_hash="$(jq -r .version_vector_hash "$RUNNER_TEMP/runtime-status.json")"
          fingerprint="$(cat "$RUNNER_TEMP/fingerprint.json")"
          metadata="$(cat "$RUNNER_TEMP/a08-metadata.json")"
          if test "$(cat "$RUNNER_TEMP/a08-scoped-required")" = true; then
            metadata="$(cat "$RUNNER_TEMP/a08-metadata.json")"
            staging="$(cat "$RUNNER_TEMP/staging/artifacts/seo-council-a08-staging/receipt.json")"
            jq -n --arg sha "$SOURCE_SHA" --argjson metadata "$metadata" --argjson staging "$staging" \
              --argjson fingerprint "$fingerprint" --argjson vector "$vector" \
              --arg vector_hash "$vector_hash" \
              '{schema_version:"seo.platform12_a08_activation.v2",repository:"fermatmind/fap-api",
                activation_basis:"A08_SCOPED_READ_ONLY_ACCEPTANCE",activation_state:"CONTROLLED_ACCEPTANCE_ONLY",
                bound_production_sha:$sha,
                validation:{ci:($metadata.ci + {sha:$sha,status:"success"}|del(.artifact_id)),
                  deploy:($metadata.deploy + {sha:$sha,status:"success"}|del(.artifact_id)),
                  staging_acceptance:{sha:$sha,status:$staging.status,source_connected:$staging.source_connected,
                    mission_count:$staging.mission_count,trigger_mode:$staging.trigger_mode,
                    natural_slot_receipt:$staging.natural_slot_receipt,
                    notification_delivery_verified:$staging.notification_delivery_verified,
                    pause_resume_verified:$staging.pause_resume_verified,
                    receipt_to_ui_verified:$staging.receipt_to_ui_verified,
                    deploy_run_id:$metadata.deploy.run_id,deploy_run_attempt:$metadata.deploy.run_attempt,
                    artifact_digest:$metadata.staging.artifact_digest},
                  production_smoke:{sha:$sha,status:"pass",deploy_run_id:$metadata.deploy.run_id,
                    deploy_run_attempt:$metadata.deploy.run_attempt,artifact_digest:$metadata.deploy.artifact_digest},
                  production_controlled_acceptance:{status:"pending",source_connected:false,mission_count:0,
                    enabled_daily_missions:0,notification_configuration_verified:false,
                    receipt_to_ui_verified:false,receipt_hashes:[]}},
                compatibility:{mode:"exact_sha",source_sha:$sha,bound_sha:$sha,fingerprint:$fingerprint},
                runtime:{version_vector:$vector,version_vector_hash:$vector_hash},
                permissions:{model_runtime_enabled:false,tool_broker_enabled:false,post12_agent_write_enabled:false,
                  L2:"artifact_only",L3:false,L4:false,cms_agent_write:false,publish:false,canonical_write:false,
                  robots_write:false,url_truth_write:false,search_submission:false,business_write_enabled:false,
                  active_action_manifest_count:0,trusted_signing_key_count:0},
                measurement:{day_28_started:false,baseline_state:"MEASUREMENT_BASELINE_HOLD",
                  efficiency_claim_allowed:false}}' > "$output"
            echo "decision=accept" >> "$GITHUB_OUTPUT"
          else
            if ! jq -e --argjson fingerprint "$fingerprint" --argjson vector "$vector" '
              .schema_version == "seo.platform12_a08_activation.v2"
              and .activation_state == "ACTIVE_READ_ONLY"
              and .activation_basis == "A08_SCOPED_READ_ONLY_ACCEPTANCE"
              and .compatibility.fingerprint == $fingerprint
              and .runtime.version_vector == $vector' "$RUNNER_TEMP/prior-activation.json" >/dev/null 2>&1; then
              jq -n --arg sha "$SOURCE_SHA" '{schema_version:"seo.platform12_a08_activation_hold.v2",sha:$sha,
                status:"HOLD",reason:"NOT_ACTIVATED_OR_RELATED_DEPENDENCY_CHANGED",business_writes:false}' > "$output"
              echo "decision=hold" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            jq --arg sha "$SOURCE_SHA" --argjson metadata "$metadata" '
              .bound_production_sha=$sha
              | .validation.ci=($metadata.ci + {sha:$sha,status:"success"}|del(.artifact_id))
              | .validation.deploy=($metadata.deploy + {sha:$sha,status:"success"}|del(.artifact_id))
              | .validation.production_smoke={sha:$sha,status:"pass",deploy_run_id:$metadata.deploy.run_id,
                  deploy_run_attempt:$metadata.deploy.run_attempt,artifact_digest:$metadata.deploy.artifact_digest}
              | .compatibility.mode="compatible_descendant"
              | .compatibility.bound_sha=$sha' "$RUNNER_TEMP/prior-activation.json" > "$output"
            echo "decision=carry" >> "$GITHUB_OUTPUT"
          fi
          jq -cS . "$output" > "$output.canonical"
          mv "$output.canonical" "$output"
          sha256sum "$output" | awk '{print $1}' > "$output.sha256"
      - name: Install scoped candidate or compatible manifest without changing pause intent
        if: steps.manifest.outputs.decision == 'accept' || steps.manifest.outputs.decision == 'carry'
        shell: bash
        run: |
          set -euo pipefail
          ssh_base=(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -i "$PRODUCTION_IDENTITY" \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST")
          remote_tmp="/tmp/seo-council-a08-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          "${ssh_base[@]}" "set -euo pipefail; umask 077; test ! -e '$remote_tmp'; mkdir '$remote_tmp'"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -i "$PRODUCTION_IDENTITY" \
            -P "$DEPLOY_PORT" artifacts/seo-council-a08-activation/activation.json* "$DEPLOY_USER@$DEPLOY_HOST:$remote_tmp/"
          printf -v q_path '%q' "$DEPLOY_PATH"
          printf -v q_sha '%q' "$SOURCE_SHA"
          remote="set -euo pipefail; trap 'rm -rf \"$remote_tmp\"' EXIT; test \"\$(tr -d '\\r\\n' < $q_path/current/REVISION)\" = $q_sha; \
            test \"\$(sha256sum '$remote_tmp/activation.json' | awk '{print \$1}')\" = \"\$(cat '$remote_tmp/activation.json.sha256')\"; \
            target=$q_path/shared/backend/storage/app/release-receipts/seo-council-a08; sudo -n -u www-data -- mkdir -p \"\$target\"; \
            sudo -n -u www-data -- install -m 0640 '$remote_tmp/activation.json' \"\$target/activation.json.next\"; \
            sudo -n -u www-data -- install -m 0640 '$remote_tmp/activation.json.sha256' \"\$target/activation.json.sha256.next\"; \
            sudo -n -u www-data -- mv -f \"\$target/activation.json.next\" \"\$target/activation.json\"; \
            sudo -n -u www-data -- mv -f \"\$target/activation.json.sha256.next\" \"\$target/activation.json.sha256\""
          "${ssh_base[@]}" "$remote"
      - name: Run first production controlled acceptance
        if: steps.manifest.outputs.decision == 'accept'
        shell: bash
        run: |
          set -euo pipefail
          cp artifacts/seo-council-a08-activation/activation.json artifacts/seo-council-a08-activation/receipt.json
          ssh_base=(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -i "$PRODUCTION_IDENTITY" \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST")
          printf -v q_path '%q' "$DEPLOY_PATH"
          printf -v q_sha '%q' "$SOURCE_SHA"
          operation="deploy:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:${SOURCE_SHA}"
          sitemap_refresh="$("${ssh_base[@]}" "set -euo pipefail; test \"\$(tr -d '\\r\\n' < $q_path/current/REVISION)\" = $q_sha; cd $q_path/current/backend; php artisan seo:warm-sitemap-source-cache --refresh-if-changed --json --no-interaction --no-ansi")"
          jq -e '((keys | sort) == ["count","elapsed_seconds","status"])
            and (.status | IN("verified_unchanged","rebuilt"))
            and (.count | type == "number" and . >= 1)
            and (.elapsed_seconds | type == "number" and . >= 0)' <<<"$sitemap_refresh" >/dev/null
          begun="$("${ssh_base[@]}" "cd $q_path/current/backend && php artisan seo:council-runtime acceptance-begin --operation-ref='$operation' --no-interaction --no-ansi")"
          jq -e --arg operation "$operation" '.state == "CONTROLLED_ACCEPTANCE_ONLY"
            and .controlled_acceptance_enabled == true and .operation_ref == $operation
            and .pause_source == "acceptance_protection" and (.generation | test("^[a-f0-9]{32}$"))
            and .notification_configuration_verified == true
            and .business_write_enabled == false' <<<"$begun" >/dev/null
          generation="$(jq -r .generation <<<"$begun")"
          abort_acceptance() {
            "${ssh_base[@]}" "cd $q_path/current/backend && php artisan seo:council-runtime acceptance-abort --operation-ref='$operation' --expected-generation='$generation' --no-interaction --no-ansi" >/dev/null || true
          }
          trap abort_acceptance ERR
          results='[]'
          for mission in seo.platform12.daily_gsc_core_runtime seo.platform12.daily_url_truth_reconciliation seo.platform12.daily_private_policy_evidence_drift; do
            result="$("${ssh_base[@]}" "cd $q_path/current/backend && php artisan seo:council-scheduled --acceptance=$mission --acceptance-operation='$operation' --json --no-interaction --no-ansi")"
            jq -e '(.status == "TERMINAL_COMMITTED" or .status == "TERMINAL_REPLAY")
              and .terminal_committed == true and .source_gaps == []
              and (.mission_verdict | type == "string") and (.receipt_hash | test("^[a-f0-9]{64}$"))
              and .execution_allowed == false and .business_write_enabled == false' <<<"$result" >/dev/null
            results="$(jq -c --argjson result "$result" '. + [$result]' <<<"$results")"
          done
          hashes="$(jq -c '[.[].receipt_hash]' <<<"$results")"
          hash_csv="$(jq -r 'join(",")' <<<"$hashes")"
          readback="$("${ssh_base[@]}" "cd $q_path/current/backend && php artisan seo:council-acceptance-readback --receipt-hashes='$hash_csv' --no-interaction --no-ansi")"
          jq -e '.status == "pass" and .receipt_to_ui_verified == true
            and .notification_configuration_verified == true
            and .controlled_acceptance_verified == true and .receipt_count == 3
            and .business_write_enabled == false' <<<"$readback" >/dev/null
          output=artifacts/seo-council-a08-activation/activation.json
          jq --argjson hashes "$hashes" '
            .activation_state="ACTIVE_READ_ONLY"
            | .validation.production_controlled_acceptance={status:"pass",source_connected:true,
                mission_count:3,enabled_daily_missions:3,notification_configuration_verified:true,
                receipt_to_ui_verified:true,receipt_hashes:$hashes}' "$output" > "$output.next"
          jq -cS . "$output.next" > "$output"
          rm "$output.next"
          sha256sum "$output" | awk '{print $1}' > "$output.sha256"
          remote_tmp="/tmp/seo-council-a08-final-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          "${ssh_base[@]}" "set -euo pipefail; umask 077; test ! -e '$remote_tmp'; mkdir '$remote_tmp'"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -i "$PRODUCTION_IDENTITY" \
            -P "$DEPLOY_PORT" "$output" "$output.sha256" "$DEPLOY_USER@$DEPLOY_HOST:$remote_tmp/"
          remote="set -euo pipefail; trap 'rm -rf \"$remote_tmp\"' EXIT; test \"\$(tr -d '\\r\\n' < $q_path/current/REVISION)\" = $q_sha; \
            test \"\$(sha256sum '$remote_tmp/activation.json' | awk '{print \$1}')\" = \"\$(cat '$remote_tmp/activation.json.sha256')\"; \
            target=$q_path/shared/backend/storage/app/release-receipts/seo-council-a08; \
            sudo -n -u www-data -- install -m 0640 '$remote_tmp/activation.json' \"\$target/activation.json.next\"; \
            sudo -n -u www-data -- install -m 0640 '$remote_tmp/activation.json.sha256' \"\$target/activation.json.sha256.next\"; \
            sudo -n -u www-data -- mv -f \"\$target/activation.json.next\" \"\$target/activation.json\"; \
            sudo -n -u www-data -- mv -f \"\$target/activation.json.sha256.next\" \"\$target/activation.json.sha256\""
          "${ssh_base[@]}" "$remote"
          completed="$("${ssh_base[@]}" "cd $q_path/current/backend && php artisan seo:council-runtime acceptance-complete --operation-ref='$operation' --expected-generation='$generation' --no-interaction --no-ansi")"
          jq -e '(.state == "ACTIVE_READ_ONLY" or (.state == "MANUAL_PAUSE_HOLD" and .pause_source == "manual"))
            and .controlled_acceptance_enabled == false and .activation_basis == "A08_SCOPED_READ_ONLY_ACCEPTANCE"
            and .business_write_enabled == false' <<<"$completed" >/dev/null
          jq --argjson missions "$results" --argjson runtime "$completed" '
            . + {activation_status:"ACTIVE_READ_ONLY",controlled_acceptance:$missions,runtime_status:$runtime}' \
            "$output" > artifacts/seo-council-a08-activation/receipt.json
          trap - ERR
      - name: Record compatible carry or HOLD receipt
        if: steps.manifest.outputs.decision != 'accept'
        run: cp artifacts/seo-council-a08-activation/activation.json artifacts/seo-council-a08-activation/receipt.json
      - name: Upload Council A08 activation receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: seo-council-a08-activation-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/seo-council-a08-activation
          if-no-files-found: error
          retention-days: 90
