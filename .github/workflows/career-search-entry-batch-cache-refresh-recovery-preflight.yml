name: Career Search Entry Batch Cache Refresh Recovery Preflight

on:
  workflow_dispatch:
    inputs:
      expected_control_plane_sha:
        description: Exact latest main SHA containing this recovery preflight
        required: true
        type: string
      expected_release_sha:
        description: Exact active production application SHA from the failed execute
        required: true
        type: string
      expected_release_name:
        description: Exact active production release name from the failed execute
        required: true
        type: string
      failed_run_id:
        description: Exact indeterminate cache-refresh execute run
        required: true
        type: string
      failed_run_attempt:
        description: Exact indeterminate cache-refresh execute attempt
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-${{ github.repository }}-production
  cancel-in-progress: false

jobs:
  eligibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      control_plane_sha: ${{ steps.validate.outputs.control_plane_sha }}
      release_sha: ${{ steps.validate.outputs.release_sha }}
      release_name: ${{ steps.validate.outputs.release_name }}
      failed_run_id: ${{ steps.validate.outputs.failed_run_id }}
      failed_run_attempt: ${{ steps.validate.outputs.failed_run_attempt }}
      failed_run_control_plane_sha: ${{ steps.validate.outputs.failed_run_control_plane_sha }}
      failed_receipt_sha256: ${{ steps.validate.outputs.failed_receipt_sha256 }}
    steps:
      - name: Checkout exact recovery control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.expected_control_plane_sha }}
          fetch-depth: 0

      - name: Bind latest main and exact indeterminate failed receipt
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CONTROL_PLANE_SHA: ${{ inputs.expected_control_plane_sha }}
          EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
          EXPECTED_RELEASE_NAME: ${{ inputs.expected_release_name }}
          FAILED_RUN_ID: ${{ inputs.failed_run_id }}
          FAILED_RUN_ATTEMPT: ${{ inputs.failed_run_attempt }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$EXPECTED_CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_RELEASE_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          [[ "$FAILED_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$FAILED_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]

          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_CONTROL_PLANE_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_CONTROL_PLANE_SHA"
          git merge-base --is-ancestor "$EXPECTED_RELEASE_SHA" origin/main

          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_RUN_ID}")"
          failed_run_control_plane_sha="$(jq -er '.head_sha' <<<"$run_json")"
          jq -e \
            --arg release "$EXPECTED_RELEASE_SHA" \
            --argjson attempt "$FAILED_RUN_ATTEMPT" \
            '.name == "Career Search Entry Batch Cache Refresh Production Ops"
             and .path == ".github/workflows/career-search-entry-batch-cache-refresh-production-ops.yml"
             and .event == "workflow_dispatch"
             and .status == "completed"
             and .conclusion == "failure"
             and .head_branch == "main"
             and (.head_sha | test("^[0-9a-f]{40}$"))
             and .run_attempt == $attempt' <<<"$run_json" >/dev/null
          git merge-base --is-ancestor "$failed_run_control_plane_sha" origin/main

          receipt_dir="$(mktemp -d)"
          gh run download "$FAILED_RUN_ID" \
            --name "career-search-entry-batch-cache-refresh-execute-${FAILED_RUN_ID}-${FAILED_RUN_ATTEMPT}" \
            --dir "$receipt_dir"
          receipt="$receipt_dir/career-search-entry-batch-cache-refresh-production-ops.json"
          failed_receipt_sha256="$(sha256sum "$receipt" | awk '{print $1}')"
          [[ "$failed_receipt_sha256" =~ ^[0-9a-f]{64}$ ]]
          jq -e \
            --arg release "$EXPECTED_RELEASE_SHA" \
            --arg release_name "$EXPECTED_RELEASE_NAME" \
            --arg control "$failed_run_control_plane_sha" \
            --argjson run_id "$FAILED_RUN_ID" \
            --argjson run_attempt "$FAILED_RUN_ATTEMPT" \
            '.contract_version == "career.search_entry_batch.cache_refresh.production_ops.v1"
             and .status == "FAIL_CLOSED"
             and .mode == "execute"
             and .release_sha == $release
             and .release_name == $release_name
             and .failed_stage == "exact_cache_refresh"
             and .write_state == "indeterminate"
             and .production_write_execution == true
             and .control_plane_sha == $control
             and .workflow_run_id == $run_id
             and .workflow_run_attempt == $run_attempt
             and .database_write_count == 0
             and .cms_write_count == 0
             and .publication_write_count == 0
             and .indexability_write_count == 0
             and .queue_dispatch_count == 0
             and .sitemap_write_count == 0
             and .llms_write_count == 0
             and .search_channel_action_count == 0
             and .url_submission_count == 0
             and .non_target_write_count == 0
             and .deploy_count == 0
             and .rollback_count == 0' "$receipt" >/dev/null

          workflow_runs="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/career-search-entry-batch-cache-refresh-production-ops.yml/runs?event=workflow_dispatch&per_page=100"
          )"
          jq -e \
            --argjson failed_run "$FAILED_RUN_ID" \
            '[.workflow_runs[] | select(.id > $failed_run)] | length == 0' \
            <<<"$workflow_runs" >/dev/null

          {
            echo "control_plane_sha=$EXPECTED_CONTROL_PLANE_SHA"
            echo "release_sha=$EXPECTED_RELEASE_SHA"
            echo "release_name=$EXPECTED_RELEASE_NAME"
            echo "failed_run_id=$FAILED_RUN_ID"
            echo "failed_run_attempt=$FAILED_RUN_ATTEMPT"
            echo "failed_run_control_plane_sha=$failed_run_control_plane_sha"
            echo "failed_receipt_sha256=$failed_receipt_sha256"
          } >> "$GITHUB_OUTPUT"

  diagnose:
    needs: eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
      DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
      RETIRED_DEPLOY_HOST: ${{ secrets.PRODUCTION_RETIRED_DEPLOY_HOST }}
      DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
      CONTROL_PLANE_SHA: ${{ needs.eligibility.outputs.control_plane_sha }}
      EXPECTED_RELEASE_SHA: ${{ needs.eligibility.outputs.release_sha }}
      EXPECTED_RELEASE_NAME: ${{ needs.eligibility.outputs.release_name }}
      FAILED_RUN_ID: ${{ needs.eligibility.outputs.failed_run_id }}
      FAILED_RUN_ATTEMPT: ${{ needs.eligibility.outputs.failed_run_attempt }}
      FAILED_RUN_CONTROL_PLANE_SHA: ${{ needs.eligibility.outputs.failed_run_control_plane_sha }}
      FAILED_RECEIPT_SHA256: ${{ needs.eligibility.outputs.failed_receipt_sha256 }}
    steps:
      - name: Checkout exact recovery control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.eligibility.outputs.control_plane_sha }}
          fetch-depth: 1

      - name: Validate protected production topology
        shell: bash
        run: |
          set -euo pipefail
          for name in DEPLOY_USER DEPLOY_PORT DEPLOY_HOST RETIRED_DEPLOY_HOST DEPLOY_PATH; do
            test -n "${!name:-}"
          done
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          test "$DEPLOY_PORT" -ge 1
          test "$DEPLOY_PORT" -le 65535
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$RETIRED_DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          test "$DEPLOY_HOST" != "$RETIRED_DEPLOY_HOST"
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_PATH" != *".."* ]]
          echo "Protected production topology validated without disclosing values."

      - name: Set up SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known hosts
        shell: bash
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null \
            || ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f ~/.ssh/known_hosts >/dev/null

      - name: Run failed-receipt-bound read-only recovery diagnosis
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          runner="backend/scripts/career/career_search_entry_batch_cache_refresh_recovery_preflight.sh"
          runner_sha256="$(sha256sum "$runner" | awk '{print $1}')"
          printf -v q_path '%q' "$DEPLOY_PATH"
          printf -v q_sha '%q' "$EXPECTED_RELEASE_SHA"
          printf -v q_name '%q' "$EXPECTED_RELEASE_NAME"
          printf -v q_failed_run '%q' "$FAILED_RUN_ID"
          printf -v q_failed_attempt '%q' "$FAILED_RUN_ATTEMPT"
          printf -v q_failed_receipt '%q' "$FAILED_RECEIPT_SHA256"
          set +e
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -o ServerAliveInterval=20 -o ServerAliveCountMax=30 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH=$q_path EXPECTED_RELEASE_SHA=$q_sha EXPECTED_RELEASE_NAME=$q_name FAILED_RUN_ID=$q_failed_run FAILED_RUN_ATTEMPT=$q_failed_attempt FAILED_RECEIPT_SHA256=$q_failed_receipt bash -s" \
            < "$runner" > artifacts/remote-receipt.json
          remote_status=$?
          set -e
          jq \
            --arg control "$CONTROL_PLANE_SHA" \
            --arg runner "$runner_sha256" \
            --arg failed_control "$FAILED_RUN_CONTROL_PLANE_SHA" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            '. + {
              control_plane_sha: $control,
              runner_sha256: $runner,
              failed_run_control_plane_sha: $failed_control,
              workflow_run_id: $run_id,
              workflow_run_attempt: $run_attempt
            }' artifacts/remote-receipt.json \
            > artifacts/career-search-entry-batch-cache-refresh-recovery-preflight.json

          if [ "$remote_status" -eq 0 ]; then
            status="$(jq -er '.status' artifacts/career-search-entry-batch-cache-refresh-recovery-preflight.json)"
            manifest="$(jq -er '.manifest_sha256' artifacts/career-search-entry-batch-cache-refresh-recovery-preflight.json)"
            readback="$(jq -er '.current_readback_sha256' artifacts/career-search-entry-batch-cache-refresh-recovery-preflight.json)"
            bad_href="$(jq -er '.bad_href_url_count' artifacts/career-search-entry-batch-cache-refresh-recovery-preflight.json)"
            low_module="$(jq -er '.low_module_url_count' artifacts/career-search-entry-batch-cache-refresh-recovery-preflight.json)"
            if [ "$status" = "PASS_RECOVERY_RESUME_REQUIRED" ]; then
              phrase="I explicitly approve design of a separate cache-only resume control for failed run ${FAILED_RUN_ID} attempt ${FAILED_RUN_ATTEMPT}, recovery preflight run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}, active SHA ${EXPECTED_RELEASE_SHA}, manifest ${manifest}, current readback ${readback}, with ${bad_href} locale-unsafe-href URLs and ${low_module} thin-module URLs; this authorizes control-plane design only and does not authorize production retry, write, rollback, deploy, or Search Channel operation."
              jq --arg phrase "$phrase" \
                '. + {exact_resume_control_design_approval_phrase: $phrase}' \
                artifacts/career-search-entry-batch-cache-refresh-recovery-preflight.json \
                > artifacts/final.json
            else
              phrase="I explicitly approve read-only recovery closeout for failed run ${FAILED_RUN_ID} attempt ${FAILED_RUN_ATTEMPT}, recovery preflight run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}, active SHA ${EXPECTED_RELEASE_SHA}, manifest ${manifest}, current readback ${readback}, and one fresh Task 12 review preflight; no cache retry, write, rollback, deploy, or Search Channel operation is authorized."
              jq --arg phrase "$phrase" \
                '. + {exact_recovery_closeout_approval_phrase: $phrase}' \
                artifacts/career-search-entry-batch-cache-refresh-recovery-preflight.json \
                > artifacts/final.json
            fi
            mv artifacts/final.json artifacts/career-search-entry-batch-cache-refresh-recovery-preflight.json
          fi
          test "$remote_status" -eq 0

      - name: Upload sanitized immutable recovery receipt
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: career-search-entry-batch-cache-refresh-recovery-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/career-search-entry-batch-cache-refresh-recovery-preflight.json
          if-no-files-found: error
          retention-days: 90
