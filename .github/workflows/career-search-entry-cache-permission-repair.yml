name: Career Search Entry Cache Permission Repair Drift Recovery

on:
  workflow_dispatch:
    inputs:
      expected_control_plane_sha:
        description: Exact latest main SHA containing this repair control
        required: true
        type: string
      expected_release_sha:
        description: Exact unchanged active production application SHA
        required: true
        type: string
      expected_release_name:
        description: Exact unchanged active production release name
        required: true
        type: string
      permission_diagnostic_run_id:
        description: Exact successful bounded permission diagnostic run
        required: true
        type: string
      permission_diagnostic_run_attempt:
        description: Exact bounded permission diagnostic attempt
        required: true
        type: string
      expected_permission_diagnostic_receipt_sha256:
        description: SHA256 of the immutable permission diagnostic receipt
        required: true
        type: string
      expected_permission_diagnostic_artifact_digest:
        description: GitHub permission diagnostic artifact digest without sha256 prefix
        required: true
        type: string
      failed_repair_run_id:
        description: Exact failed pre-write permission repair run used as the drift baseline
        required: true
        type: string
      failed_repair_run_attempt:
        description: Exact failed pre-write permission repair attempt
        required: true
        type: string
      expected_failed_repair_receipt_sha256:
        description: SHA256 of the immutable failed pre-write repair receipt
        required: true
        type: string
      expected_failed_repair_artifact_digest:
        description: GitHub failed repair artifact digest without sha256 prefix
        required: true
        type: string
      expected_manifest_sha256:
        description: Exact bound 50-slug manifest SHA
        required: true
        type: string
      expected_repair_candidate_count:
        description: Exact attested permission repair node count
        required: true
        type: string
      expected_repair_candidate_set_sha256:
        description: Exact attested opaque permission repair set SHA
        required: true
        type: string
      operator_approval_phrase:
        description: Exact one-time production permission metadata write authorization
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-${{ github.repository }}-production
  cancel-in-progress: false

jobs:
  eligibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      control_plane_sha: ${{ steps.validate.outputs.control_plane_sha }}
      release_sha: ${{ steps.validate.outputs.release_sha }}
      release_name: ${{ steps.validate.outputs.release_name }}
      diagnostic_run_id: ${{ steps.validate.outputs.diagnostic_run_id }}
      diagnostic_run_attempt: ${{ steps.validate.outputs.diagnostic_run_attempt }}
      diagnostic_receipt_sha256: ${{ steps.validate.outputs.diagnostic_receipt_sha256 }}
      diagnostic_artifact_digest: ${{ steps.validate.outputs.diagnostic_artifact_digest }}
      failed_repair_run_id: ${{ steps.validate.outputs.failed_repair_run_id }}
      failed_repair_run_attempt: ${{ steps.validate.outputs.failed_repair_run_attempt }}
      failed_repair_receipt_sha256: ${{ steps.validate.outputs.failed_repair_receipt_sha256 }}
      failed_repair_artifact_digest: ${{ steps.validate.outputs.failed_repair_artifact_digest }}
      manifest_sha256: ${{ steps.validate.outputs.manifest_sha256 }}
      repair_candidate_count: ${{ steps.validate.outputs.repair_candidate_count }}
      repair_candidate_set_sha256: ${{ steps.validate.outputs.repair_candidate_set_sha256 }}
    steps:
      - name: Checkout exact permission repair control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.expected_control_plane_sha }}
          fetch-depth: 0

      - name: Bind exact diagnostic repair set and one-time write authorization
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CONTROL_PLANE_SHA: ${{ inputs.expected_control_plane_sha }}
          EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
          EXPECTED_RELEASE_NAME: ${{ inputs.expected_release_name }}
          DIAGNOSTIC_RUN_ID: ${{ inputs.permission_diagnostic_run_id }}
          DIAGNOSTIC_RUN_ATTEMPT: ${{ inputs.permission_diagnostic_run_attempt }}
          EXPECTED_DIAGNOSTIC_RECEIPT_SHA256: ${{ inputs.expected_permission_diagnostic_receipt_sha256 }}
          EXPECTED_DIAGNOSTIC_ARTIFACT_DIGEST: ${{ inputs.expected_permission_diagnostic_artifact_digest }}
          FAILED_REPAIR_RUN_ID: ${{ inputs.failed_repair_run_id }}
          FAILED_REPAIR_RUN_ATTEMPT: ${{ inputs.failed_repair_run_attempt }}
          EXPECTED_FAILED_REPAIR_RECEIPT_SHA256: ${{ inputs.expected_failed_repair_receipt_sha256 }}
          EXPECTED_FAILED_REPAIR_ARTIFACT_DIGEST: ${{ inputs.expected_failed_repair_artifact_digest }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.expected_manifest_sha256 }}
          EXPECTED_REPAIR_CANDIDATE_COUNT: ${{ inputs.expected_repair_candidate_count }}
          EXPECTED_REPAIR_CANDIDATE_SET_SHA256: ${{ inputs.expected_repair_candidate_set_sha256 }}
          OPERATOR_APPROVAL_PHRASE: ${{ inputs.operator_approval_phrase }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$EXPECTED_CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_RELEASE_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          [[ "$DIAGNOSTIC_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$DIAGNOSTIC_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$FAILED_REPAIR_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$FAILED_REPAIR_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          test "$EXPECTED_REPAIR_CANDIDATE_COUNT" = "9554"
          for hash in \
            "$EXPECTED_DIAGNOSTIC_RECEIPT_SHA256" \
            "$EXPECTED_DIAGNOSTIC_ARTIFACT_DIGEST" \
            "$EXPECTED_FAILED_REPAIR_RECEIPT_SHA256" \
            "$EXPECTED_FAILED_REPAIR_ARTIFACT_DIGEST" \
            "$EXPECTED_MANIFEST_SHA256" \
            "$EXPECTED_REPAIR_CANDIDATE_SET_SHA256"; do
            [[ "$hash" =~ ^[0-9a-f]{64}$ ]]
          done
          test "$(git rev-parse HEAD)" = "$EXPECTED_CONTROL_PLANE_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_CONTROL_PLANE_SHA"

          diagnostic_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${DIAGNOSTIC_RUN_ID}")"
          jq -e \
            --argjson attempt "$DIAGNOSTIC_RUN_ATTEMPT" \
            '.name == "Career Search Entry Cache Permission Diagnostic"
             and .event == "workflow_dispatch"
             and .head_branch == "main"
             and .status == "completed"
             and .conclusion == "success"
             and .run_attempt == $attempt' \
            <<<"$diagnostic_run" >/dev/null

          diagnostic_artifact_name="career-search-entry-cache-permission-diagnostic-${DIAGNOSTIC_RUN_ID}-${DIAGNOSTIC_RUN_ATTEMPT}"
          diagnostic_artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${DIAGNOSTIC_RUN_ID}/artifacts?per_page=100")"
          jq -e \
            --arg name "$diagnostic_artifact_name" \
            --arg digest "sha256:${EXPECTED_DIAGNOSTIC_ARTIFACT_DIGEST}" \
            '[.artifacts[] | select(.name == $name and .expired == false and .digest == $digest)] | length == 1' \
            <<<"$diagnostic_artifacts" >/dev/null
          mkdir -p diagnostic-artifact
          gh run download "$DIAGNOSTIC_RUN_ID" --name "$diagnostic_artifact_name" --dir diagnostic-artifact
          diagnostic_receipt="diagnostic-artifact/career-search-entry-cache-permission-diagnostic.json"
          test -f "$diagnostic_receipt"
          test "$(sha256sum "$diagnostic_receipt" | awk '{print $1}')" = "$EXPECTED_DIAGNOSTIC_RECEIPT_SHA256"
          jq -e \
            --arg release "$EXPECTED_RELEASE_SHA" \
            --arg release_name "$EXPECTED_RELEASE_NAME" \
            --arg manifest "$EXPECTED_MANIFEST_SHA256" \
            --arg set_sha "d7d4911bdfaccdb26117e48c3608f87a2a96e66977fc8f1800c92ee7ff4edd54" \
            --argjson count "9532" \
            '.contract_version == "career.search_entry_batch.cache_permission_diagnostic.v1"
             and .status == "PASS_PERMISSION_REPAIR_REQUIRED_BOUNDED_CACHE_TREE"
             and .repair_scope == "attested_hash_directories_and_exact_stable_key_files"
             and .release_sha == $release
             and .release_name == $release_name
             and .manifest_sha256 == $manifest
             and .production_permission_read_executed == true
             and .server_write_count == 0
             and .cache_write_count == 0
             and .retry_execution_count == 0
             and .deploy_runner.fixed_cache_chain_capability_failure_count == 0
             and .deploy_runner.fixed_cache_chain_policy_mismatch_count == 0
             and .php_runtime.fixed_cache_chain_capability_failure_count == 0
             and .php_runtime.fixed_cache_chain_policy_mismatch_count == 0
             and .deploy_runner.first_level_hash_directory_count == 256
             and .deploy_runner.second_level_hash_directory_count == 9176
             and .php_runtime.first_level_hash_directory_count == 256
             and .php_runtime.second_level_hash_directory_count == 9176
             and .deploy_runner.hash_directory_policy_mismatch_count == 9432
             and .php_runtime.hash_directory_policy_mismatch_count == 9432
             and .deploy_runner.existing_target_file_count == 100
             and .php_runtime.existing_target_file_count == 100
             and .deploy_runner.target_file_owner_group_mismatch_count == 100
             and .php_runtime.target_file_owner_group_mismatch_count == 100
             and .deploy_runner.repair_candidate_count == $count
             and .php_runtime.repair_candidate_count == $count
             and .deploy_runner.repair_candidate_set_sha256 == $set_sha
             and .php_runtime.repair_candidate_set_sha256 == $set_sha
             and .database_write_count == 0
             and .cms_write_count == 0
             and .publication_write_count == 0
             and .indexability_write_count == 0
             and .queue_dispatch_count == 0
             and .sitemap_write_count == 0
             and .llms_write_count == 0
             and .search_channel_action_count == 0
             and .url_submission_count == 0
             and .deploy_count == 0
             and .rollback_count == 0' \
            "$diagnostic_receipt" >/dev/null

          later_diagnostics="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/career-search-entry-cache-permission-diagnostic.yml/runs?event=workflow_dispatch&per_page=100"
          )"
          jq -e \
            --argjson diagnostic "$DIAGNOSTIC_RUN_ID" \
            '[.workflow_runs[] | select(.id > $diagnostic)] | length == 0' \
            <<<"$later_diagnostics" >/dev/null
          failed_repair_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_REPAIR_RUN_ID}")"
          jq -e \
            --arg control "75d28c49618ef7c46e3374575e8d9ea8ebcc7b50" \
            --argjson attempt "$FAILED_REPAIR_RUN_ATTEMPT" \
            '.name == "Career Search Entry Cache Permission Repair"
             and .event == "workflow_dispatch"
             and .head_branch == "main"
             and .head_sha == $control
             and .status == "completed"
             and .conclusion == "failure"
             and .run_attempt == $attempt' \
            <<<"$failed_repair_run" >/dev/null
          failed_repair_artifact_name="career-search-entry-cache-permission-repair-${FAILED_REPAIR_RUN_ID}-${FAILED_REPAIR_RUN_ATTEMPT}"
          failed_repair_artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_REPAIR_RUN_ID}/artifacts?per_page=100")"
          jq -e \
            --arg name "$failed_repair_artifact_name" \
            --arg digest "sha256:${EXPECTED_FAILED_REPAIR_ARTIFACT_DIGEST}" \
            '[.artifacts[] | select(.name == $name and .expired == false and .digest == $digest)] | length == 1' \
            <<<"$failed_repair_artifacts" >/dev/null
          mkdir -p failed-repair-artifact
          gh run download "$FAILED_REPAIR_RUN_ID" \
            --name "$failed_repair_artifact_name" \
            --dir failed-repair-artifact
          failed_repair_receipt="failed-repair-artifact/career-search-entry-cache-permission-repair.json"
          test -f "$failed_repair_receipt"
          test "$(sha256sum "$failed_repair_receipt" | awk '{print $1}')" = "$EXPECTED_FAILED_REPAIR_RECEIPT_SHA256"
          jq -e \
            --arg release "$EXPECTED_RELEASE_SHA" \
            --arg release_name "$EXPECTED_RELEASE_NAME" \
            --arg manifest "$EXPECTED_MANIFEST_SHA256" \
            --arg set_sha "$EXPECTED_REPAIR_CANDIDATE_SET_SHA256" \
            --argjson count "$EXPECTED_REPAIR_CANDIDATE_COUNT" \
            --argjson run_id "$FAILED_REPAIR_RUN_ID" \
            --argjson attempt "$FAILED_REPAIR_RUN_ATTEMPT" \
            '.contract_version == "career.search_entry_batch.cache_permission_repair_control.v1"
             and .status == "FAIL_PERMISSION_REPAIR"
             and .release_sha == $release
             and .release_name == $release_name
             and .manifest_sha256 == $manifest
             and .repair_candidate_count == 9532
             and .repair_candidate_set_sha256 == "d7d4911bdfaccdb26117e48c3608f87a2a96e66977fc8f1800c92ee7ff4edd54"
             and .pre_deploy_runner.status == "PASS_PERMISSION_PROBE_COMPLETE"
             and .pre_php_runtime.status == "PASS_PERMISSION_PROBE_COMPLETE"
             and .pre_deploy_runner.first_level_hash_directory_count == 256
             and .pre_php_runtime.first_level_hash_directory_count == 256
             and .pre_deploy_runner.second_level_hash_directory_count == 9198
             and .pre_php_runtime.second_level_hash_directory_count == 9198
             and .pre_deploy_runner.repair_candidate_count == $count
             and .pre_php_runtime.repair_candidate_count == $count
             and .pre_deploy_runner.repair_candidate_set_sha256 == $set_sha
             and .pre_php_runtime.repair_candidate_set_sha256 == $set_sha
             and .repair.status == "UNAVAILABLE"
             and .post_deploy_runner.status == "UNAVAILABLE"
             and .post_php_runtime.status == "UNAVAILABLE"
             and .permission_metadata_write_count == 0
             and .cache_payload_write_count == 0
             and .retry_execution_count == 0
             and .database_write_count == 0
             and .cms_write_count == 0
             and .search_channel_action_count == 0
             and .deploy_count == 0
             and .rollback_count == 0
             and .run_id == $run_id
             and .run_attempt == $attempt' \
            "$failed_repair_receipt" >/dev/null

          prior_repairs="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/career-search-entry-cache-permission-repair.yml/runs?event=workflow_dispatch&per_page=100"
          )"
          jq -e \
            --argjson current "$GITHUB_RUN_ID" \
            --argjson failed "$FAILED_REPAIR_RUN_ID" \
            '[.workflow_runs[] | select(.id != $current) | .id] == [$failed]' \
            <<<"$prior_repairs" >/dev/null

          expected_phrase="I explicitly approve one-time Career search-entry bounded cache permission drift recovery for failed pre-write repair run ${FAILED_REPAIR_RUN_ID} attempt ${FAILED_REPAIR_RUN_ATTEMPT} receipt ${EXPECTED_FAILED_REPAIR_RECEIPT_SHA256} artifact ${EXPECTED_FAILED_REPAIR_ARTIFACT_DIGEST}, control-plane SHA ${EXPECTED_CONTROL_PLANE_SHA}, active SHA ${EXPECTED_RELEASE_SHA}, baseline repair set ${EXPECTED_REPAIR_CANDIDATE_SET_SHA256} count ${EXPECTED_REPAIR_CANDIDATE_COUNT}; at execution permit only up to 256 additional well-formed hash directories under the same bounded cache tree and no additional stable-key files, change only owner/group/mode metadata for the live dual-attested set, then require zero-candidate verification and unchanged cache payload aggregate, with zero retry, rollback, deploy, CMS/DB write, or Search Channel operation."
          test "$OPERATOR_APPROVAL_PHRASE" = "$expected_phrase"

          {
            echo "control_plane_sha=$EXPECTED_CONTROL_PLANE_SHA"
            echo "release_sha=$EXPECTED_RELEASE_SHA"
            echo "release_name=$EXPECTED_RELEASE_NAME"
            echo "diagnostic_run_id=$DIAGNOSTIC_RUN_ID"
            echo "diagnostic_run_attempt=$DIAGNOSTIC_RUN_ATTEMPT"
            echo "diagnostic_receipt_sha256=$EXPECTED_DIAGNOSTIC_RECEIPT_SHA256"
            echo "diagnostic_artifact_digest=$EXPECTED_DIAGNOSTIC_ARTIFACT_DIGEST"
            echo "failed_repair_run_id=$FAILED_REPAIR_RUN_ID"
            echo "failed_repair_run_attempt=$FAILED_REPAIR_RUN_ATTEMPT"
            echo "failed_repair_receipt_sha256=$EXPECTED_FAILED_REPAIR_RECEIPT_SHA256"
            echo "failed_repair_artifact_digest=$EXPECTED_FAILED_REPAIR_ARTIFACT_DIGEST"
            echo "manifest_sha256=$EXPECTED_MANIFEST_SHA256"
            echo "repair_candidate_count=$EXPECTED_REPAIR_CANDIDATE_COUNT"
            echo "repair_candidate_set_sha256=$EXPECTED_REPAIR_CANDIDATE_SET_SHA256"
          } >> "$GITHUB_OUTPUT"

  repair:
    needs: eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
      DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
      RETIRED_DEPLOY_HOST: ${{ secrets.PRODUCTION_RETIRED_DEPLOY_HOST }}
      DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
      EXPECTED_CONTROL_PLANE_SHA: ${{ needs.eligibility.outputs.control_plane_sha }}
      EXPECTED_RELEASE_SHA: ${{ needs.eligibility.outputs.release_sha }}
      EXPECTED_RELEASE_NAME: ${{ needs.eligibility.outputs.release_name }}
      DIAGNOSTIC_RUN_ID: ${{ needs.eligibility.outputs.diagnostic_run_id }}
      DIAGNOSTIC_RUN_ATTEMPT: ${{ needs.eligibility.outputs.diagnostic_run_attempt }}
      DIAGNOSTIC_RECEIPT_SHA256: ${{ needs.eligibility.outputs.diagnostic_receipt_sha256 }}
      DIAGNOSTIC_ARTIFACT_DIGEST: ${{ needs.eligibility.outputs.diagnostic_artifact_digest }}
      FAILED_REPAIR_RUN_ID: ${{ needs.eligibility.outputs.failed_repair_run_id }}
      FAILED_REPAIR_RUN_ATTEMPT: ${{ needs.eligibility.outputs.failed_repair_run_attempt }}
      FAILED_REPAIR_RECEIPT_SHA256: ${{ needs.eligibility.outputs.failed_repair_receipt_sha256 }}
      FAILED_REPAIR_ARTIFACT_DIGEST: ${{ needs.eligibility.outputs.failed_repair_artifact_digest }}
      EXPECTED_MANIFEST_SHA256: ${{ needs.eligibility.outputs.manifest_sha256 }}
      EXPECTED_REPAIR_CANDIDATE_COUNT: ${{ needs.eligibility.outputs.repair_candidate_count }}
      EXPECTED_REPAIR_CANDIDATE_SET_SHA256: ${{ needs.eligibility.outputs.repair_candidate_set_sha256 }}
    steps:
      - name: Checkout exact permission repair control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.eligibility.outputs.control_plane_sha }}
          fetch-depth: 1

      - name: Validate protected production topology
        shell: bash
        run: |
          set -euo pipefail
          for name in DEPLOY_USER DEPLOY_PORT DEPLOY_HOST RETIRED_DEPLOY_HOST DEPLOY_PATH; do
            test -n "${!name:-}"
          done
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          test "$DEPLOY_PORT" -ge 1
          test "$DEPLOY_PORT" -le 65535
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$RETIRED_DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          test "$DEPLOY_HOST" != "$RETIRED_DEPLOY_HOST"
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_PATH" != *".."* ]]
          echo "Protected production topology validated without disclosing values."

      - name: Set up SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known hosts
        shell: bash
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null \
            || ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f ~/.ssh/known_hosts >/dev/null

      - name: Re-attest exact dual-identity repair set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          probe="backend/scripts/career/career_search_entry_cache_permission_probe.php"
          for variable in DEPLOY_PATH EXPECTED_RELEASE_SHA EXPECTED_RELEASE_NAME EXPECTED_MANIFEST_SHA256 DEPLOY_USER; do
            printf -v "q_${variable}" '%q' "${!variable}"
          done
          remote_env="DEPLOY_PATH=${q_DEPLOY_PATH} EXPECTED_RELEASE_SHA=${q_EXPECTED_RELEASE_SHA} EXPECTED_RELEASE_NAME=${q_EXPECTED_RELEASE_NAME} EXPECTED_MANIFEST_SHA256=${q_EXPECTED_MANIFEST_SHA256} EXPECTED_SHARED_OWNER=${q_DEPLOY_USER} EXPECTED_SHARED_GROUP=www-data"
          ssh_options=(
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=10
            -o ServerAliveInterval=20
            -o ServerAliveCountMax=30
            -p "$DEPLOY_PORT"
          )
          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "env ${remote_env} PROBE_IDENTITY_ROLE=deploy_runner php" \
            < "$probe" > artifacts/pre-deploy-runner-probe.json
          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo -n -u www-data -- env ${remote_env} PROBE_IDENTITY_ROLE=php_runtime php" \
            < "$probe" > artifacts/pre-php-runtime-probe.json
          baseline_count="$EXPECTED_REPAIR_CANDIDATE_COUNT"
          maximum_count="$((baseline_count + 256))"
          for receipt in artifacts/pre-deploy-runner-probe.json artifacts/pre-php-runtime-probe.json; do
            jq -e \
              --argjson baseline_count "$baseline_count" \
              --argjson maximum_count "$maximum_count" \
              '.status == "PASS_PERMISSION_PROBE_COMPLETE"
               and .fixed_cache_chain_capability_failure_count == 0
               and .fixed_cache_chain_policy_mismatch_count == 0
               and .first_level_hash_directory_count == 256
               and .second_level_hash_directory_count >= 9198
               and .second_level_hash_directory_count <= 9454
               and .hash_directory_policy_mismatch_count == (256 + .second_level_hash_directory_count)
               and .existing_target_file_count == 100
               and .target_file_owner_group_mismatch_count == 100
               and .repair_candidate_count >= $baseline_count
               and .repair_candidate_count <= $maximum_count
               and .repair_candidate_count == (.hash_directory_policy_mismatch_count + 100)
               and .server_write_count == 0
               and .cache_write_count == 0' \
              "$receipt" >/dev/null
          done
          live_candidate_count="$(jq -r '.repair_candidate_count' artifacts/pre-deploy-runner-probe.json)"
          live_candidate_set_sha256="$(jq -r '.repair_candidate_set_sha256' artifacts/pre-deploy-runner-probe.json)"
          test "$(jq -r '.repair_candidate_count' artifacts/pre-php-runtime-probe.json)" = "$live_candidate_count"
          test "$(jq -r '.repair_candidate_set_sha256' artifacts/pre-php-runtime-probe.json)" = "$live_candidate_set_sha256"
          [[ "$live_candidate_set_sha256" =~ ^[0-9a-f]{64}$ ]]
          {
            echo "REMOTE_ENV=$remote_env"
            echo "LIVE_REPAIR_CANDIDATE_COUNT=$live_candidate_count"
            echo "LIVE_REPAIR_CANDIDATE_SET_SHA256=$live_candidate_set_sha256"
          } >> "$GITHUB_ENV"

      - name: Apply exact non-recursive permission metadata repair
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          repair="backend/scripts/career/career_search_entry_cache_permission_repair.php"
          repair_sha256="$(sha256sum "$repair" | awk '{print $1}')"
          printf -v q_EXPECTED_REPAIR_CANDIDATE_COUNT '%q' "$LIVE_REPAIR_CANDIDATE_COUNT"
          printf -v q_EXPECTED_REPAIR_CANDIDATE_SET_SHA256 '%q' "$LIVE_REPAIR_CANDIDATE_SET_SHA256"
          set +e
          # shellcheck disable=SC2029
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -o ServerAliveInterval=20 -o ServerAliveCountMax=30 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo -n -- env ${REMOTE_ENV} EXPECTED_REPAIR_CANDIDATE_COUNT=${q_EXPECTED_REPAIR_CANDIDATE_COUNT} EXPECTED_REPAIR_CANDIDATE_SET_SHA256=${q_EXPECTED_REPAIR_CANDIDATE_SET_SHA256} EXPECTED_STABLE_FILE_COUNT=100 PERMISSION_REPAIR_APPLY=true php" \
            < "$repair" > artifacts/permission-repair.json
          repair_status=$?
          set -e
          test -s artifacts/permission-repair.json
          jq -e '.contract_version == "career.search_entry_batch.cache_permission_repair.v1"' \
            artifacts/permission-repair.json >/dev/null
          {
            echo "remote_status=$repair_status"
            echo "repair_sha256=$repair_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Verify dual-identity zero-candidate state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          probe="backend/scripts/career/career_search_entry_cache_permission_probe.php"
          if [ -z "${REMOTE_ENV:-}" ]; then
            exit 1
          fi
          ssh_options=(
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=10
            -o ServerAliveInterval=20
            -o ServerAliveCountMax=30
            -p "$DEPLOY_PORT"
          )
          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "env ${REMOTE_ENV} PROBE_IDENTITY_ROLE=deploy_runner php" \
            < "$probe" > artifacts/post-deploy-runner-probe.json
          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo -n -u www-data -- env ${REMOTE_ENV} PROBE_IDENTITY_ROLE=php_runtime php" \
            < "$probe" > artifacts/post-php-runtime-probe.json

      - name: Build sanitized immutable permission repair receipt
        if: always()
        shell: bash
        env:
          REPAIR_REMOTE_STATUS: ${{ steps.apply.outputs.remote_status }}
          REPAIR_SHA256: ${{ steps.apply.outputs.repair_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for item in \
            pre-deploy-runner-probe \
            pre-php-runtime-probe \
            permission-repair \
            post-deploy-runner-probe \
            post-php-runtime-probe; do
            if [ ! -s "artifacts/${item}.json" ]; then
              printf '%s\n' '{"status":"UNAVAILABLE"}' > "artifacts/${item}.json"
            fi
          done
          jq -s \
            --arg control "$EXPECTED_CONTROL_PLANE_SHA" \
            --arg release "$EXPECTED_RELEASE_SHA" \
            --arg release_name "$EXPECTED_RELEASE_NAME" \
            --arg manifest "$EXPECTED_MANIFEST_SHA256" \
            --arg diagnostic_receipt "$DIAGNOSTIC_RECEIPT_SHA256" \
            --arg diagnostic_artifact "$DIAGNOSTIC_ARTIFACT_DIGEST" \
            --arg failed_repair_receipt "$FAILED_REPAIR_RECEIPT_SHA256" \
            --arg failed_repair_artifact "$FAILED_REPAIR_ARTIFACT_DIGEST" \
            --arg baseline_set_sha "$EXPECTED_REPAIR_CANDIDATE_SET_SHA256" \
            --arg live_set_sha "$LIVE_REPAIR_CANDIDATE_SET_SHA256" \
            --arg repair_sha "${REPAIR_SHA256:-unavailable}" \
            --argjson baseline_candidate_count "$EXPECTED_REPAIR_CANDIDATE_COUNT" \
            --argjson live_candidate_count "$LIVE_REPAIR_CANDIDATE_COUNT" \
            --argjson diagnostic_run "$DIAGNOSTIC_RUN_ID" \
            --argjson diagnostic_attempt "$DIAGNOSTIC_RUN_ATTEMPT" \
            --argjson failed_repair_run "$FAILED_REPAIR_RUN_ID" \
            --argjson failed_repair_attempt "$FAILED_REPAIR_RUN_ATTEMPT" \
            --argjson remote_status "${REPAIR_REMOTE_STATUS:-255}" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            '.[0] as $pre_runner
             | .[1] as $pre_runtime
             | .[2] as $repair
             | .[3] as $post_runner
             | .[4] as $post_runtime
             | {
                 contract_version: "career.search_entry_batch.cache_permission_repair_control.v1",
                 status: (
                   if $remote_status == 0
                     and $repair.status == "PASS_PERMISSION_REPAIR_COMMITTED"
                     and $repair.write_state == "committed"
                     and $repair.permission_metadata_write_count == $live_candidate_count
                     and $repair.permission_directory_write_count == ($live_candidate_count - 100)
                     and $repair.permission_file_write_count == 100
                     and $repair.payload_unchanged == true
                     and $repair.post_repair_candidate_count == 0
                     and $post_runner.status == "PASS_PERMISSION_PROBE_COMPLETE"
                     and $post_runtime.status == "PASS_PERMISSION_PROBE_COMPLETE"
                     and $post_runner.repair_candidate_count == 0
                     and $post_runtime.repair_candidate_count == 0
                   then "PASS_PERMISSION_REPAIR_VERIFIED"
                   else "FAIL_PERMISSION_REPAIR"
                   end
                 ),
                 release_sha: $release,
                 release_name: $release_name,
                 manifest_sha256: $manifest,
                 diagnostic_run_id: $diagnostic_run,
                 diagnostic_run_attempt: $diagnostic_attempt,
                 diagnostic_receipt_sha256: $diagnostic_receipt,
                 diagnostic_artifact_digest: $diagnostic_artifact,
                 failed_repair_run_id: $failed_repair_run,
                 failed_repair_run_attempt: $failed_repair_attempt,
                 failed_repair_receipt_sha256: $failed_repair_receipt,
                 failed_repair_artifact_digest: $failed_repair_artifact,
                 control_plane_sha: $control,
                 repair_runner_sha256: $repair_sha,
                 baseline_repair_candidate_count: $baseline_candidate_count,
                 baseline_repair_candidate_set_sha256: $baseline_set_sha,
                 live_repair_candidate_count: $live_candidate_count,
                 live_repair_candidate_set_sha256: $live_set_sha,
                 pre_deploy_runner: $pre_runner,
                 pre_php_runtime: $pre_runtime,
                 repair: $repair,
                 post_deploy_runner: $post_runner,
                 post_php_runtime: $post_runtime,
                 permission_metadata_write_count: ($repair.permission_metadata_write_count // 0),
                 cache_payload_write_count: 0,
                 retry_execution_count: 0,
                 database_write_count: 0,
                 cms_write_count: 0,
                 publication_write_count: 0,
                 indexability_write_count: 0,
                 queue_dispatch_count: 0,
                 sitemap_write_count: 0,
                 llms_write_count: 0,
                 search_channel_action_count: 0,
                 url_submission_count: 0,
                 deploy_count: 0,
                 rollback_count: 0,
                 run_id: $run_id,
                 run_attempt: $run_attempt
               }' \
            artifacts/pre-deploy-runner-probe.json \
            artifacts/pre-php-runtime-probe.json \
            artifacts/permission-repair.json \
            artifacts/post-deploy-runner-probe.json \
            artifacts/post-php-runtime-probe.json \
            > artifacts/career-search-entry-cache-permission-repair.json

      - name: Upload sanitized immutable permission repair receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: career-search-entry-cache-permission-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/career-search-entry-cache-permission-repair.json
          if-no-files-found: error
          retention-days: 90

      - name: Enforce exact permission repair completion
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          jq -e \
            '.status == "PASS_PERMISSION_REPAIR_VERIFIED"
             and .permission_metadata_write_count == .live_repair_candidate_count
             and .live_repair_candidate_count >= .baseline_repair_candidate_count
             and .live_repair_candidate_count <= (.baseline_repair_candidate_count + 256)
             and .cache_payload_write_count == 0
             and .retry_execution_count == 0
             and .database_write_count == 0
             and .cms_write_count == 0
             and .publication_write_count == 0
             and .indexability_write_count == 0
             and .queue_dispatch_count == 0
             and .sitemap_write_count == 0
             and .llms_write_count == 0
             and .search_channel_action_count == 0
             and .url_submission_count == 0
             and .deploy_count == 0
             and .rollback_count == 0' \
            artifacts/career-search-entry-cache-permission-repair.json >/dev/null
