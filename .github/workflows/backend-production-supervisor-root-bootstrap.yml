name: Backend Production Supervisor Root Bootstrap

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Strict zero-write preflight or separately approved apply
        required: true
        type: choice
        options:
          - preflight
          - apply
      expected_control_plane_sha:
        description: Exact latest main SHA containing this control
        required: true
        type: string
      expected_active_revision:
        description: Exact active backend production revision
        required: true
        type: string
      source_preflight_run_id:
        description: Supervisor sudo-control preflight run ID
        required: true
        type: string
      source_preflight_run_attempt:
        description: Supervisor sudo-control preflight run attempt
        required: true
        type: string
      source_preflight_receipt_sha256:
        description: Supervisor sudo-control preflight receipt SHA256
        required: true
        type: string
      source_preflight_control_plane_sha:
        description: Exact control-plane SHA of the Supervisor sudo-control preflight
        required: true
        type: string
      expected_deploy_user_sha256:
        description: Expected deploy-user fingerprint from source preflight
        required: true
        type: string
      expected_rule_sha256:
        description: Expected exact one-line sudoers rule SHA256
        required: true
        type: string
      bootstrap_preflight_run_id:
        description: Apply only - root-bootstrap preflight run ID
        required: false
        type: string
      bootstrap_preflight_run_attempt:
        description: Apply only - root-bootstrap preflight run attempt
        required: false
        type: string
      bootstrap_preflight_receipt_sha256:
        description: Apply only - root-bootstrap preflight receipt SHA256
        required: false
        type: string
      operator_approval_phrase:
        description: Apply only - exact receipt-bound root-bootstrap approval
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-${{ github.repository }}-production
  cancel-in-progress: false

jobs:
  control:
    name: Preflight or apply exact Supervisor root bootstrap
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      MODE: ${{ inputs.mode }}
      EXPECTED_CONTROL_PLANE_SHA: ${{ inputs.expected_control_plane_sha }}
      EXPECTED_ACTIVE_REVISION: ${{ inputs.expected_active_revision }}
      SOURCE_PREFLIGHT_RUN_ID: ${{ inputs.source_preflight_run_id }}
      SOURCE_PREFLIGHT_RUN_ATTEMPT: ${{ inputs.source_preflight_run_attempt }}
      SOURCE_PREFLIGHT_RECEIPT_SHA256: ${{ inputs.source_preflight_receipt_sha256 }}
      SOURCE_PREFLIGHT_CONTROL_PLANE_SHA: ${{ inputs.source_preflight_control_plane_sha }}
      EXPECTED_DEPLOY_USER_SHA256: ${{ inputs.expected_deploy_user_sha256 }}
      EXPECTED_RULE_SHA256: ${{ inputs.expected_rule_sha256 }}
      BOOTSTRAP_PREFLIGHT_RUN_ID: ${{ inputs.bootstrap_preflight_run_id }}
      BOOTSTRAP_PREFLIGHT_RUN_ATTEMPT: ${{ inputs.bootstrap_preflight_run_attempt }}
      BOOTSTRAP_PREFLIGHT_RECEIPT_SHA256: ${{ inputs.bootstrap_preflight_receipt_sha256 }}
      OPERATOR_APPROVAL_PHRASE: ${{ inputs.operator_approval_phrase }}
      BOOTSTRAP_SSH_USER: ${{ secrets.PRODUCTION_ROOT_BOOTSTRAP_SSH_USER }}
      DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT }}
      DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
      DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}

    steps:
      - name: Initialize sanitized failure receipt
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/backend-production-supervisor-root-bootstrap.json"
          jq -n \
            --arg mode "$MODE" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg control "$EXPECTED_CONTROL_PLANE_SHA" \
            --arg active "$EXPECTED_ACTIVE_REVISION" \
            --arg source_run "$SOURCE_PREFLIGHT_RUN_ID" \
            --arg source_attempt "$SOURCE_PREFLIGHT_RUN_ATTEMPT" \
            --arg source_receipt "$SOURCE_PREFLIGHT_RECEIPT_SHA256" \
            --arg source_control "$SOURCE_PREFLIGHT_CONTROL_PLANE_SHA" \
            --arg target "/etc/sudoers.d/fap-api-github-production-supervisor-status" \
            '{
              schema_version: "backend.production_supervisor_root_bootstrap.v2",
              mode: $mode,
              status: "FAIL_ROOT_BOOTSTRAP_INITIALIZATION",
              failed_stage: "initialize",
              run_id: $run_id,
              run_attempt: $run_attempt,
              control_plane_sha: $control,
              active_revision: $active,
              source_preflight: {
                run_id: $source_run,
                run_attempt: $source_attempt,
                receipt_sha256: $source_receipt,
                control_plane_sha: $source_control
              },
              bootstrap_user_sha256: ("0" * 64),
              deploy_user_sha256: ("0" * 64),
              rule_sha256: ("0" * 64),
              sudoers_target: $target,
              target_state: "UNKNOWN",
              credential_present: false,
              credential_tested: false,
              credential_accepted: false,
              candidate_created: false,
              candidate_cleanup_attempted: false,
              candidate_absent_after: true,
              toolchain_safe: false,
              apply_eligible: false,
              supervisor_status_authorized_after: false,
              queue_total: 0,
              queue_running: 0,
              secret_retirement_required: true,
              production_write_execution: false,
              sudoers_rule_write_count: 0,
              remote_temp_file_write_count: 0,
              supervisor_config_write_count: 0,
              service_restart_count: 0,
              deploy_count: 0,
              database_or_cms_write_count: 0,
              warm_or_publication_count: 0,
              discoverability_write_count: 0,
              writes_committed: false,
              checks: {
                active_revision_match: false,
                deploy_lock_absent: false,
                deploy_like_process_count: 0,
                bootstrap_identity_match: false,
                deploy_identity_match: false,
                sudoers_directory_safe: false,
                fixed_binaries_safe: false
              }
            }' > "$receipt"

      - name: Check out exact main control plane
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate latest main and immutable receipt chain
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$MODE" =~ ^(preflight|apply)$ ]]
          [[ "$EXPECTED_CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_ACTIVE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_PREFLIGHT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_PREFLIGHT_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_PREFLIGHT_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$SOURCE_PREFLIGHT_CONTROL_PLANE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_DEPLOY_USER_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_RULE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$BOOTSTRAP_SSH_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          test "$BOOTSTRAP_SSH_USER" != "$DEPLOY_USER"
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          test -n "$SSH_KNOWN_HOSTS"

          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_CONTROL_PLANE_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_CONTROL_PLANE_SHA"
          test "$GITHUB_SHA" = "$EXPECTED_CONTROL_PLANE_SHA"
          bootstrap_user_sha="$(printf '%s' "$BOOTSTRAP_SSH_USER" | sha256sum | awk '{print $1}')"
          deploy_user_sha="$(printf '%s' "$DEPLOY_USER" | sha256sum | awk '{print $1}')"
          rule_sha="$(printf '%s\n' "$DEPLOY_USER ALL=(root) NOPASSWD: /usr/bin/supervisorctl status" | sha256sum | awk '{print $1}')"
          test "$deploy_user_sha" = "$EXPECTED_DEPLOY_USER_SHA256"
          test "$rule_sha" = "$EXPECTED_RULE_SHA256"

          source_run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_PREFLIGHT_RUN_ID}")"
          jq -e \
            --arg sha "$SOURCE_PREFLIGHT_CONTROL_PLANE_SHA" \
            --argjson attempt "$SOURCE_PREFLIGHT_RUN_ATTEMPT" \
            '.name == "Backend Production Supervisor Read-only Sudo Control"
             and .path == ".github/workflows/backend-production-supervisor-read-only-sudo-control.yml"
             and .event == "workflow_dispatch"
             and .head_branch == "main"
             and .head_sha == $sha
             and .status == "completed"
             and .conclusion == "success"
             and .run_attempt == $attempt' <<<"$source_run_json" >/dev/null

          source_dir="$(mktemp -d)"
          gh run download "$SOURCE_PREFLIGHT_RUN_ID" \
            --name "backend-production-supervisor-read-only-sudo-preflight-${SOURCE_PREFLIGHT_RUN_ID}-${SOURCE_PREFLIGHT_RUN_ATTEMPT}" \
            --dir "$source_dir"
          source_receipt="$source_dir/backend-production-supervisor-read-only-sudo-control.json"
          test -f "$source_receipt"
          test "$(sha256sum "$source_receipt" | awk '{print $1}')" = "$SOURCE_PREFLIGHT_RECEIPT_SHA256"
          jq -e \
            --arg control "$SOURCE_PREFLIGHT_CONTROL_PLANE_SHA" \
            --arg active "$EXPECTED_ACTIVE_REVISION" \
            --arg user_sha "$EXPECTED_DEPLOY_USER_SHA256" \
            --arg rule_sha "$EXPECTED_RULE_SHA256" \
            '.schema_version == "backend.production_supervisor_read_only_sudo_control.v1"
             and .mode == "preflight"
             and .status == "PASS_PREFLIGHT_MANUAL_ROOT_REQUIRED"
             and .control_plane_sha == $control
             and .active_revision == $active
             and .deploy_user_sha256 == $user_sha
             and .rule_sha256 == $rule_sha
             and .rule_state == "ABSENT"
             and .supervisor_status_authorized_before == false
             and .apply_eligible == false
             and .production_write_execution == false
             and .sudoers_rule_write_count == 0
             and .remote_temp_file_write_count == 0
             and .writes_committed == false' "$source_receipt" >/dev/null

          if [ "$MODE" = preflight ]; then
            test -z "$BOOTSTRAP_PREFLIGHT_RUN_ID"
            test -z "$BOOTSTRAP_PREFLIGHT_RUN_ATTEMPT"
            test -z "$BOOTSTRAP_PREFLIGHT_RECEIPT_SHA256"
            test -z "$OPERATOR_APPROVAL_PHRASE"
          else
            [[ "$BOOTSTRAP_PREFLIGHT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$BOOTSTRAP_PREFLIGHT_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
            [[ "$BOOTSTRAP_PREFLIGHT_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
            expected_phrase="I explicitly approve one-time backend production Supervisor root bootstrap from preflight run ${BOOTSTRAP_PREFLIGHT_RUN_ID} attempt ${BOOTSTRAP_PREFLIGHT_RUN_ATTEMPT} receipt ${BOOTSTRAP_PREFLIGHT_RECEIPT_SHA256}, chained to Supervisor preflight run ${SOURCE_PREFLIGHT_RUN_ID} attempt ${SOURCE_PREFLIGHT_RUN_ATTEMPT} receipt ${SOURCE_PREFLIGHT_RECEIPT_SHA256} source control-plane SHA ${SOURCE_PREFLIGHT_CONTROL_PLANE_SHA}, with control-plane SHA ${EXPECTED_CONTROL_PLANE_SHA} active SHA ${EXPECTED_ACTIVE_REVISION} bootstrap-user fingerprint ${bootstrap_user_sha} deploy-user fingerprint ${EXPECTED_DEPLOY_USER_SHA256} rule SHA256 ${EXPECTED_RULE_SHA256}, installing only /etc/sudoers.d/fap-api-github-production-supervisor-status; use the protected production sudo credential only for exact install, visudo, and sha256sum commands as the bootstrap user, then validate /usr/bin/supervisorctl status as the deploy user, with no SSH credential change, broader sudo grant, Supervisor config change, service restart, deploy, database/CMS write, warm, publication, or discoverability change."
            test "$OPERATOR_APPROVAL_PHRASE" = "$expected_phrase"

            bootstrap_run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BOOTSTRAP_PREFLIGHT_RUN_ID}")"
            jq -e \
              --arg sha "$EXPECTED_CONTROL_PLANE_SHA" \
              --argjson attempt "$BOOTSTRAP_PREFLIGHT_RUN_ATTEMPT" \
              '.name == "Backend Production Supervisor Root Bootstrap"
               and .path == ".github/workflows/backend-production-supervisor-root-bootstrap.yml"
               and .event == "workflow_dispatch"
               and .head_branch == "main"
               and .head_sha == $sha
               and .status == "completed"
               and .conclusion == "success"
               and .run_attempt == $attempt' <<<"$bootstrap_run_json" >/dev/null
            bootstrap_dir="$(mktemp -d)"
            gh run download "$BOOTSTRAP_PREFLIGHT_RUN_ID" \
              --name "backend-production-supervisor-root-bootstrap-preflight-${BOOTSTRAP_PREFLIGHT_RUN_ID}-${BOOTSTRAP_PREFLIGHT_RUN_ATTEMPT}" \
              --dir "$bootstrap_dir"
            bootstrap_receipt="$bootstrap_dir/backend-production-supervisor-root-bootstrap.json"
            test -f "$bootstrap_receipt"
            test "$(sha256sum "$bootstrap_receipt" | awk '{print $1}')" = "$BOOTSTRAP_PREFLIGHT_RECEIPT_SHA256"
            jq -e \
              --arg control "$EXPECTED_CONTROL_PLANE_SHA" \
              --arg active "$EXPECTED_ACTIVE_REVISION" \
              --arg source_run "$SOURCE_PREFLIGHT_RUN_ID" \
              --arg source_attempt "$SOURCE_PREFLIGHT_RUN_ATTEMPT" \
              --arg source_receipt "$SOURCE_PREFLIGHT_RECEIPT_SHA256" \
              --arg source_control "$SOURCE_PREFLIGHT_CONTROL_PLANE_SHA" \
              --arg bootstrap_user_sha "$bootstrap_user_sha" \
              --arg user_sha "$EXPECTED_DEPLOY_USER_SHA256" \
              --arg rule_sha "$EXPECTED_RULE_SHA256" \
              '.schema_version == "backend.production_supervisor_root_bootstrap.v2"
               and .mode == "preflight"
               and .status == "PASS_ROOT_BOOTSTRAP_PREFLIGHT"
               and .control_plane_sha == $control
               and .active_revision == $active
               and .source_preflight.run_id == $source_run
               and .source_preflight.run_attempt == $source_attempt
               and .source_preflight.receipt_sha256 == $source_receipt
               and .source_preflight.control_plane_sha == $source_control
               and .bootstrap_user_sha256 == $bootstrap_user_sha
               and .deploy_user_sha256 == $user_sha
               and .rule_sha256 == $rule_sha
               and .sudoers_target == "/etc/sudoers.d/fap-api-github-production-supervisor-status"
               and .target_state == "ABSENT"
               and .credential_present == true
               and .credential_tested == false
               and .credential_accepted == false
               and .checks.bootstrap_identity_match == true
               and .checks.deploy_identity_match == true
               and .toolchain_safe == true
               and .apply_eligible == true
               and .production_write_execution == false
               and .sudoers_rule_write_count == 0
               and .remote_temp_file_write_count == 0
               and .writes_committed == false' "$bootstrap_receipt" >/dev/null
          fi

      - name: Validate protected one-time credential presence without authentication
        shell: bash
        env:
          ROOT_BOOTSTRAP_SUDO_PASSWORD: ${{ secrets.PRODUCTION_ROOT_BOOTSTRAP_SUDO_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ROOT_BOOTSTRAP_SUDO_PASSWORD"
          test "$(printf '%s' "$ROOT_BOOTSTRAP_SUDO_PASSWORD" | wc -l | tr -d ' ')" = "0"
          receipt="$RUNNER_TEMP/backend-production-supervisor-root-bootstrap.json"
          tmp="${receipt}.tmp"
          jq '.credential_present = true | .credential_tested = false' "$receipt" > "$tmp"
          mv "$tmp" "$receipt"
          echo "Protected one-time credential is present; no authentication was attempted."

      - name: Start pinned SSH agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install pinned SSH known hosts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null \
            || ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f ~/.ssh/known_hosts >/dev/null

      - name: Run strict zero-write root-bootstrap preflight
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/backend-production-supervisor-root-bootstrap.json"
          zero_sha="$(printf '0%.0s' {1..64})"
          bootstrap_expected_sha="$(printf '%s' "$BOOTSTRAP_SSH_USER" | sha256sum | awk '{print $1}')"
          deploy_expected_sha="$(printf '%s' "$DEPLOY_USER" | sha256sum | awk '{print $1}')"
          rule_sha="$(printf '%s\n' "$DEPLOY_USER ALL=(root) NOPASSWD: /usr/bin/supervisorctl status" | sha256sum | awk '{print $1}')"

          set +e
          bootstrap_result="$(
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
              -p "$DEPLOY_PORT" "$BOOTSTRAP_SSH_USER@$DEPLOY_HOST" bash -s <<'REMOTE'
          set -u
          target=/etc/sudoers.d/fap-api-github-production-supervisor-status
          actor_sha="$(printf '%s' "$(id -un)" | sha256sum | awk '{print $1}')"
          sudoers_dir_safe=false
          binaries_safe=false
          target_state=UNKNOWN
          if [ "$(stat -Lc '%U:%G:%F' /etc/sudoers.d 2>/dev/null)" = "root:root:directory" ]; then
            dir_mode="$(stat -Lc '%a' /etc/sudoers.d)"
            if [[ "$dir_mode" =~ ^[0-7]{3,4}$ ]] && (( (8#$dir_mode & 0022) == 0 )); then sudoers_dir_safe=true; fi
          fi
          fixed_safe=true
          for binary in /usr/bin/install /usr/sbin/visudo /usr/bin/sha256sum /usr/bin/supervisorctl; do
            if [ ! -f "$binary" ] || [ -L "$binary" ] || [ "$(stat -Lc '%U:%G' "$binary" 2>/dev/null)" != "root:root" ]; then fixed_safe=false; continue; fi
            mode="$(stat -Lc '%a' "$binary")"
            if ! [[ "$mode" =~ ^[0-7]{3,4}$ ]] || (( (8#$mode & 0022) != 0 )); then fixed_safe=false; fi
          done
          if [ "$fixed_safe" = true ]; then binaries_safe=true; fi
          if [ -e "$target" ] || [ -L "$target" ]; then
            target_state=PRESENT_OR_LINK
          else
            target_state=ABSENT
          fi
          printf '%s|%s|%s|%s\n' "$actor_sha" "$target_state" "$sudoers_dir_safe" "$binaries_safe"
          REMOTE
          )"
          bootstrap_ssh_rc=$?

          deploy_result="$(
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
              -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "DEPLOY_PATH='$DEPLOY_PATH' EXPECTED_ACTIVE_REVISION='$EXPECTED_ACTIVE_REVISION' bash -s" <<'REMOTE'
          set -u
          actor_sha="$(printf '%s' "$(id -un)" | sha256sum | awk '{print $1}')"
          active_match=false
          lock_absent=false
          deploy_process_count=0
          already_authorized=false
          if [ -r "$DEPLOY_PATH/current/REVISION" ] && [ "$(tr -d '\r\n' < "$DEPLOY_PATH/current/REVISION")" = "$EXPECTED_ACTIVE_REVISION" ]; then active_match=true; fi
          if [ ! -e "$DEPLOY_PATH/.dep/deploy.lock" ]; then lock_absent=true; fi
          deploy_process_count="$(ps -eo comm=,args= | awk '$1=="php" && ($0 ~ /dep\.phar/ || $0 ~ /artisan migrate/ || $0 ~ /queue:reload-workers/) {n++} $1=="composer" && $0 ~ /install/ {n++} END {print n+0}')"
          if sudo -n /usr/bin/supervisorctl status >/dev/null 2>&1; then already_authorized=true; fi
          printf '%s|%s|%s|%s|%s\n' "$actor_sha" "$active_match" "$lock_absent" "$deploy_process_count" "$already_authorized"
          REMOTE
          )"
          deploy_ssh_rc=$?
          set -e

          bootstrap_user_sha="$zero_sha"
          deploy_user_sha="$zero_sha"
          target_state=UNKNOWN
          sudoers_dir_safe=false
          binaries_safe=false
          active_match=false
          lock_absent=false
          deploy_process_count=0
          already_authorized=false
          if [ "$bootstrap_ssh_rc" -eq 0 ]; then
            IFS='|' read -r bootstrap_user_sha target_state sudoers_dir_safe binaries_safe <<<"$bootstrap_result"
          fi
          if [ "$deploy_ssh_rc" -eq 0 ]; then
            IFS='|' read -r deploy_user_sha active_match lock_absent deploy_process_count already_authorized <<<"$deploy_result"
          fi
          [[ "$bootstrap_user_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$deploy_user_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$rule_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$target_state" =~ ^(ABSENT|PRESENT_OR_LINK|UNKNOWN)$ ]]
          for value in "$active_match" "$lock_absent" "$already_authorized" "$sudoers_dir_safe" "$binaries_safe"; do [[ "$value" =~ ^(true|false)$ ]]; done
          [[ "$deploy_process_count" =~ ^[0-9]+$ ]]

          bootstrap_identity_match=false
          deploy_identity_match=false
          toolchain_safe=false
          apply_eligible=false
          if [ "$bootstrap_user_sha" = "$bootstrap_expected_sha" ]; then bootstrap_identity_match=true; fi
          if [ "$deploy_user_sha" = "$deploy_expected_sha" ]; then deploy_identity_match=true; fi
          if [ "$sudoers_dir_safe" = true ] && [ "$binaries_safe" = true ]; then toolchain_safe=true; fi
          status=PASS_ROOT_BOOTSTRAP_PREFLIGHT
          failed_stage=""
          if [ "$bootstrap_ssh_rc" -ne 0 ]; then
            status=FAIL_ROOT_BOOTSTRAP_BOOTSTRAP_SSH; failed_stage=bootstrap_ssh
          elif [ "$deploy_ssh_rc" -ne 0 ]; then
            status=FAIL_ROOT_BOOTSTRAP_DEPLOY_SSH; failed_stage=deploy_ssh
          elif [ "$bootstrap_identity_match" != true ]; then
            status=BLOCKED_BOOTSTRAP_IDENTITY; failed_stage=bootstrap_identity
          elif [ "$deploy_identity_match" != true ]; then
            status=BLOCKED_DEPLOY_IDENTITY; failed_stage=deploy_identity
          elif [ "$active_match" != true ]; then
            status=BLOCKED_ACTIVE_REVISION; failed_stage=active_revision
          elif [ "$lock_absent" != true ]; then
            status=BLOCKED_DEPLOY_LOCK; failed_stage=deploy_lock
          elif [ "$deploy_process_count" -ne 0 ]; then
            status=BLOCKED_DEPLOY_PROCESS; failed_stage=deploy_process
          elif [ "$toolchain_safe" != true ]; then
            status=BLOCKED_UNSAFE_ROOT_TOOLCHAIN; failed_stage=root_toolchain
          elif [ "$target_state" != ABSENT ]; then
            status=BLOCKED_EXISTING_RULE; failed_stage=target_state
          elif [ "$already_authorized" = true ]; then
            status=BLOCKED_ALREADY_AUTHORIZED; failed_stage=unexpected_existing_authority
          fi
          if [ "$status" = PASS_ROOT_BOOTSTRAP_PREFLIGHT ]; then apply_eligible=true; fi
          [[ "$status" =~ ^(PASS_ROOT_BOOTSTRAP_PREFLIGHT|BLOCKED_[A-Z_]+|FAIL_ROOT_BOOTSTRAP_[A-Z_]+)$ ]]
          [[ "$failed_stage" =~ ^[a-z_]*$ ]]

          tmp="${receipt}.tmp"
          jq \
            --arg status "$status" \
            --arg failed_stage "$failed_stage" \
            --arg bootstrap_user_sha "$bootstrap_user_sha" \
            --arg deploy_user_sha "$deploy_user_sha" \
            --arg rule_sha "$rule_sha" \
            --arg target_state "$target_state" \
            --argjson bootstrap_identity_match "$bootstrap_identity_match" \
            --argjson deploy_identity_match "$deploy_identity_match" \
            --argjson toolchain_safe "$toolchain_safe" \
            --argjson apply_eligible "$apply_eligible" \
            --argjson active_match "$active_match" \
            --argjson lock_absent "$lock_absent" \
            --argjson deploy_process_count "$deploy_process_count" \
            --argjson sudoers_dir_safe "$sudoers_dir_safe" \
            --argjson binaries_safe "$binaries_safe" \
            '.status = $status
             | .failed_stage = $failed_stage
             | .bootstrap_user_sha256 = $bootstrap_user_sha
             | .deploy_user_sha256 = $deploy_user_sha
             | .rule_sha256 = $rule_sha
             | .target_state = $target_state
             | .toolchain_safe = $toolchain_safe
             | .apply_eligible = $apply_eligible
             | .checks.active_revision_match = $active_match
             | .checks.deploy_lock_absent = $lock_absent
             | .checks.deploy_like_process_count = $deploy_process_count
             | .checks.bootstrap_identity_match = $bootstrap_identity_match
             | .checks.deploy_identity_match = $deploy_identity_match
             | .checks.sudoers_directory_safe = $sudoers_dir_safe
             | .checks.fixed_binaries_safe = $binaries_safe' "$receipt" > "$tmp"
          mv "$tmp" "$receipt"
          echo "apply_eligible=$apply_eligible" >> "$GITHUB_OUTPUT"
          test "$bootstrap_user_sha" = "$bootstrap_expected_sha"
          test "$deploy_user_sha" = "$EXPECTED_DEPLOY_USER_SHA256"
          test "$rule_sha" = "$EXPECTED_RULE_SHA256"
          test "$status" = PASS_ROOT_BOOTSTRAP_PREFLIGHT
          test "$apply_eligible" = true

      - name: Apply exact one-time root bootstrap
        if: ${{ inputs.mode == 'apply' && steps.preflight.outputs.apply_eligible == 'true' }}
        shell: bash
        env:
          ROOT_BOOTSTRAP_SUDO_PASSWORD: ${{ secrets.PRODUCTION_ROOT_BOOTSTRAP_SUDO_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          receipt="$RUNNER_TEMP/backend-production-supervisor-root-bootstrap.json"
          target=/etc/sudoers.d/fap-api-github-production-supervisor-status
          candidate="/tmp/fap-api-supervisor-root-bootstrap-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rule="$DEPLOY_USER ALL=(root) NOPASSWD: /usr/bin/supervisorctl status"
          bootstrap_remote="ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -p $DEPLOY_PORT $BOOTSTRAP_SSH_USER@$DEPLOY_HOST"
          deploy_remote="ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -p $DEPLOY_PORT $DEPLOY_USER@$DEPLOY_HOST"
          candidate_created=false
          candidate_cleanup_attempted=false
          candidate_absent_after=true

          persist_candidate_state() {
            local tmp="${receipt}.tmp"
            jq \
              --argjson created "$candidate_created" \
              --argjson cleanup_attempted "$candidate_cleanup_attempted" \
              --argjson absent_after "$candidate_absent_after" \
              '.candidate_created = $created
               | .candidate_cleanup_attempted = $cleanup_attempted
               | .candidate_absent_after = $absent_after
               | .remote_temp_file_write_count = (if $created then 1 else 0 end)' "$receipt" > "$tmp"
            mv "$tmp" "$receipt"
          }
          mark_failure() {
            local status="$1" stage="$2" write_count="${3:-0}" temp_count="${4:-0}"
            local tmp="${receipt}.tmp"
            jq --arg status "$status" --arg stage "$stage" --argjson writes "$write_count" --argjson temps "$temp_count" \
              '.status = $status | .failed_stage = $stage | .production_write_execution = true | .sudoers_rule_write_count = $writes | .remote_temp_file_write_count = $temps | .writes_committed = ($writes == 1)' "$receipt" > "$tmp"
            mv "$tmp" "$receipt"
          }
          q_candidate="$(printf '%q' "$candidate")"
          q_target="$(printf '%q' "$target")"
          q_rule="$(printf '%q' "$rule")"

          cleanup_candidate() {
            candidate_cleanup_attempted=true
            if $bootstrap_remote "rm -f $q_candidate; test ! -e $q_candidate" >/dev/null 2>&1; then
              candidate_absent_after=true
            else
              candidate_absent_after=false
            fi
            persist_candidate_state
            test "$candidate_absent_after" = true
          }
          trap cleanup_candidate EXIT

          set +e
          $bootstrap_remote "set -euo pipefail; test ! -e $q_candidate; umask 077; set -o noclobber; printf '%s\\n' $q_rule > $q_candidate; test \"\$(sha256sum $q_candidate | awk '{print \$1}')\" = '$EXPECTED_RULE_SHA256'; /usr/sbin/visudo -cf $q_candidate >/dev/null"
          candidate_rc=$?
          set -e
          if $bootstrap_remote "test -e $q_candidate" >/dev/null 2>&1; then
            candidate_created=true
            candidate_absent_after=false
          fi
          persist_candidate_state
          if [ "$candidate_rc" -ne 0 ]; then
            mark_failure FAIL_ROOT_BOOTSTRAP_CANDIDATE candidate 0 1
            exit 1
          fi

          tmp="${receipt}.tmp"
          jq '.credential_tested = true | .credential_accepted = false | .production_write_execution = true' "$receipt" > "$tmp"
          mv "$tmp" "$receipt"
          sudo_error="$RUNNER_TEMP/root-bootstrap-install.stderr"
          set +e
          printf '%s\n' "$ROOT_BOOTSTRAP_SUDO_PASSWORD" \
            | $bootstrap_remote "LC_ALL=C sudo -S -k -p '' /usr/bin/install -o root -g root -m 0440 $q_candidate $q_target" \
              >/dev/null 2>"$sudo_error"
          install_rc=$?
          set -e
          if [ "$install_rc" -ne 0 ]; then
            if grep -Eq 'Sorry, try again|incorrect password attempt|no password was provided' "$sudo_error"; then
              mark_failure FAIL_ROOT_BOOTSTRAP_CREDENTIAL_AUTH credential_auth 0 1
            else
              mark_failure FAIL_ROOT_BOOTSTRAP_INSTALL install 0 1
            fi
            exit 1
          fi
          tmp="${receipt}.tmp"
          jq '.credential_accepted = true' "$receipt" > "$tmp"
          mv "$tmp" "$receipt"
          mark_failure ROOT_BOOTSTRAP_APPLY_IN_PROGRESS full_policy_validation 1 1

          if ! printf '%s\n' "$ROOT_BOOTSTRAP_SUDO_PASSWORD" | $bootstrap_remote "LC_ALL=C sudo -S -k -p '' /usr/sbin/visudo -cf /etc/sudoers" >/dev/null 2>/dev/null; then
            mark_failure FAIL_ROOT_BOOTSTRAP_FULL_POLICY full_policy_validation 1 1
            exit 1
          fi
          installed_sha="$(printf '%s\n' "$ROOT_BOOTSTRAP_SUDO_PASSWORD" | $bootstrap_remote "LC_ALL=C sudo -S -k -p '' /usr/bin/sha256sum $q_target" 2>/dev/null | awk '{print $1}')"
          if [ "$installed_sha" != "$EXPECTED_RULE_SHA256" ]; then
            mark_failure FAIL_ROOT_BOOTSTRAP_EXACT_READBACK exact_rule_readback 1 1
            exit 1
          fi

          queue_status="$($deploy_remote "sudo -n /usr/bin/supervisorctl status" 2>/dev/null)" || {
            mark_failure FAIL_ROOT_BOOTSTRAP_SUPERVISOR_READBACK supervisor_readback 1 1
            exit 1
          }
          queue_total="$(awk '$1 ~ /^fap-queue/ {n++} END {print n+0}' <<<"$queue_status")"
          queue_running="$(awk '$1 ~ /^fap-queue/ && $2=="RUNNING" {n++} END {print n+0}' <<<"$queue_status")"
          if [ "$queue_total" -le 0 ] || [ "$queue_running" -ne "$queue_total" ]; then
            mark_failure FAIL_ROOT_BOOTSTRAP_QUEUE_STATE queue_state 1 1
            exit 1
          fi

          if ! cleanup_candidate; then
            trap - EXIT
            mark_failure FAIL_ROOT_BOOTSTRAP_CANDIDATE_CLEANUP candidate_cleanup 1 1
            exit 1
          fi
          trap - EXIT

          tmp="${receipt}.tmp"
          jq --argjson total "$queue_total" --argjson running "$queue_running" \
            '.status = "PASS_ROOT_BOOTSTRAP_APPLY"
             | .failed_stage = ""
             | .supervisor_status_authorized_after = true
             | .queue_total = $total
             | .queue_running = $running
             | .production_write_execution = true
             | .credential_tested = true
             | .credential_accepted = true
             | .sudoers_rule_write_count = 1
             | .remote_temp_file_write_count = 1
             | .writes_committed = true' "$receipt" > "$tmp"
          mv "$tmp" "$receipt"

      - name: Validate sanitized root-bootstrap receipt
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/backend-production-supervisor-root-bootstrap.json"
          test -f "$receipt"
          jq -e \
            '.schema_version == "backend.production_supervisor_root_bootstrap.v2"
             and (.mode == "preflight" or .mode == "apply")
             and (.status | type == "string" and length > 0)
             and (.failed_stage | type == "string")
             and (.bootstrap_user_sha256 | test("^[0-9a-f]{64}$"))
             and (.deploy_user_sha256 | test("^[0-9a-f]{64}$"))
             and (.rule_sha256 | test("^[0-9a-f]{64}$"))
             and .sudoers_target == "/etc/sudoers.d/fap-api-github-production-supervisor-status"
             and (.credential_present | type == "boolean")
             and (.credential_tested | type == "boolean")
             and (.credential_accepted | type == "boolean")
             and (.candidate_created | type == "boolean")
             and (.candidate_cleanup_attempted | type == "boolean")
             and (.candidate_absent_after | type == "boolean")
             and (.toolchain_safe | type == "boolean")
             and (.apply_eligible | type == "boolean")
             and .secret_retirement_required == true
             and (.sudoers_rule_write_count | type == "number")
             and (.remote_temp_file_write_count | type == "number")
             and .supervisor_config_write_count == 0
             and .service_restart_count == 0
             and .deploy_count == 0
             and .database_or_cms_write_count == 0
             and .warm_or_publication_count == 0
             and .discoverability_write_count == 0
             and (.writes_committed | type == "boolean")' "$receipt" >/dev/null
          if [ "$MODE" = preflight ]; then
            jq -e \
              '.status == "PASS_ROOT_BOOTSTRAP_PREFLIGHT"
               and .credential_present == true
               and .credential_tested == false
               and .credential_accepted == false
               and .candidate_created == false
               and .candidate_cleanup_attempted == false
               and .candidate_absent_after == true
               and .toolchain_safe == true
               and .apply_eligible == true
               and .checks.bootstrap_identity_match == true
               and .checks.deploy_identity_match == true
               and .production_write_execution == false
               and .sudoers_rule_write_count == 0
               and .remote_temp_file_write_count == 0
               and .writes_committed == false' "$receipt" >/dev/null
          elif [ "$(jq -r '.status' "$receipt")" = PASS_ROOT_BOOTSTRAP_APPLY ]; then
            jq -e \
              '.credential_tested == true
               and .credential_accepted == true
               and .candidate_created == true
               and .candidate_cleanup_attempted == true
               and .candidate_absent_after == true
               and .supervisor_status_authorized_after == true
               and .sudoers_rule_write_count == 1
               and .remote_temp_file_write_count == 1
               and .writes_committed == true' "$receipt" >/dev/null
          fi

      - name: Publish safe root-bootstrap summary
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/backend-production-supervisor-root-bootstrap.json"
          {
            echo "## Backend production Supervisor root bootstrap"
            echo "- Mode: $(jq -r '.mode' "$receipt")"
            echo "- Status: $(jq -r '.status' "$receipt")"
            echo "- Credential tested: $(jq -r '.credential_tested' "$receipt")"
            echo "- Credential accepted: $(jq -r '.credential_accepted' "$receipt")"
            echo "- Candidate absent after: $(jq -r '.candidate_absent_after' "$receipt")"
            echo "- Apply eligible: $(jq -r '.apply_eligible' "$receipt")"
            echo "- Writes committed: $(jq -r '.writes_committed' "$receipt")"
            echo "- Secret retirement required: $(jq -r '.secret_retirement_required' "$receipt")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable root-bootstrap receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-production-supervisor-root-bootstrap-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/backend-production-supervisor-root-bootstrap.json
          if-no-files-found: error
          retention-days: 14
